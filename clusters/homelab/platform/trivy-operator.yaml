# trivy-operator: CVE reports for every running image (VulnerabilityReports)
# and their metrics for the Security dashboard (docs/observability.md).
#
# Multi-source: the chart and its values from this repo.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argo
  annotations:
    # After kube-prometheus-stack (10): the ServiceMonitor CRD comes with that chart.
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: platform
  sources:
    - repoURL: https://aquasecurity.github.io/helm-charts/
      chart: trivy-operator
      # renovate: datasource=helm depName=trivy-operator registryUrl=https://aquasecurity.github.io/helm-charts/
      targetRevision: 0.37.0
      helm:
        releaseName: trivy-operator
        valueFiles:
          - $values/platform/trivy-operator/values.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false # ships CRDs: pruning one deletes every report of that kind
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
