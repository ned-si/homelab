# kube-prometheus-stack: Prometheus, Alertmanager, Grafana, node-exporter.
# Multi-source: the chart, its values, the routes (the Grafana HTTPRoute and
# the rules) and the dashboards.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      # renovate: datasource=helm depName=kube-prometheus-stack registryUrl=https://prometheus-community.github.io/helm-charts
      targetRevision: 92.20.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/platform/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      ref: values
    # Grafana's HTTPRoute.
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      path: deploy/platform/kube-prometheus-stack/routes
    # Grafana dashboards (ConfigMaps for the sidecar).
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      path: deploy/platform/kube-prometheus-stack/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false # ships CRDs: pruning one cascades to every object of that kind
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Longer retry than the repo default: ~13MB of CRDs take tens of seconds
    # to establish, and a 3m window gives up first.
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    # The operator rewrites these continuously.
    - group: monitoring.coreos.com
      kind: Prometheus
      jsonPointers:
        - /spec/replicas
