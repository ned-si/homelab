# The access path to the Hubble UI at https://hubble.lilalala.com, behind
# Keycloak (docs/networking.md, "Hubble"): hubble-sso, the HTTPRoute and the
# CiliumNetworkPolicies. Relay and UI come with the `cilium` release.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hubble-access
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "21"
spec:
  project: platform
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/platform/hubble-access
  destination:
    server: https://kubernetes.default.svc
    namespace: hubble
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
