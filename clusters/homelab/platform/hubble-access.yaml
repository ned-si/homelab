# Hubble UI on the tailnet only (https://hubble.<tailnet>.ts.net,
# docs/remote-access.md). The relay and the UI come with the `cilium` release
# in kube-system; this Application only adds the access path to them.
#
#     tailnet --> Tailscale Ingress proxy --> hubble-sso (oauth2-proxy,
#     Keycloak, group admins) --> hubble-ui (kube-system) --> hubble-relay
#
# Rendered from platform/hubble-access (deploy/platform/hubble-access): the
# proxy, the Ingress and the CiliumNetworkPolicies in `hubble` and
# `kube-system`.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hubble-access
  namespace: argo
  annotations:
    # After tailscale-operator (20): the `tailscale` IngressClass.
    argocd.argoproj.io/sync-wave: "21"
spec:
  project: platform
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/platform/hubble-access
  destination:
    server: https://kubernetes.default.svc
    namespace: hubble
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
