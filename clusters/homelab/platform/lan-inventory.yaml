# lan-inventory: ARP scan of the LAN as metrics, for the device inventory and
# the "new device" alert (platform/lan-inventory, docs/observability.md).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lan-inventory
  namespace: argo
  annotations:
    # After kube-prometheus-stack (10): the ServiceMonitor CRD comes with that chart.
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: platform
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/platform/lan-inventory
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
