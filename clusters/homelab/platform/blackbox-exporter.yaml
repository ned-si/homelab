# blackbox-exporter: probes the public hostnames and the endpoints the cluster
# depends on (docs/observability.md). Multi-source: the chart, its values and
# the Probes (deploy/platform/blackbox-exporter/probes).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox-exporter
  namespace: argo
  annotations:
    # After kube-prometheus-stack (10): the Probe CRD comes with that chart.
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-blackbox-exporter
      # renovate: datasource=helm depName=prometheus-blackbox-exporter registryUrl=https://prometheus-community.github.io/helm-charts
      targetRevision: 11.21.2
      helm:
        releaseName: blackbox-exporter
        valueFiles:
          - $values/platform/blackbox-exporter/values.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      path: deploy/platform/blackbox-exporter/probes
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
