# Barman Cloud plugin for CloudNativePG: WAL and base backups of every Cluster
# to s3://ned-si-homelab-backups/cnpg/<cluster>/ (docs/backups.md). It must
# run in the operator's namespace, `immich`, and uses cert-manager for its
# mTLS. Enabling it on a Cluster restarts that Cluster once (sidecar).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barman-cloud-plugin
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/platform/barman-cloud-plugin
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      # Pruning this would silently disable WAL archiving on every database.
      prune: false
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
