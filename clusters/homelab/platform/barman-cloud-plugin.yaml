# Barman Cloud plugin for CloudNativePG (plugin v0.15.1, operator 1.30.1).
#
# Every CNPG Cluster archives its WAL and takes its base backups through this
# plugin, into s3://ned-si-homelab-backups/cnpg/<cluster>/ (docs/backups.md).
# CloudNativePG deprecated its in-tree Barman Cloud support in 1.26; the plugin
# is the supported path.
#
# The plugin must run in the SAME NAMESPACE as the CNPG operator, which is
# `immich`. It uses cert-manager to issue its own mTLS certificates, which is
# why it syncs after cert-manager (infrastructure) and after the operator.
#
# It injects a sidecar into each PostgreSQL instance, so enabling it on a
# Cluster restarts that Cluster once.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barman-cloud-plugin
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/platform/barman-cloud-plugin
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      # Pruning this would silently disable WAL archiving on every database.
      prune: false
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
