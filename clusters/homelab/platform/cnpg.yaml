# CloudNativePG operator, cluster-wide, release `cnpg` in namespace `immich`
# with the Barman Cloud plugin, which needs the same namespace. Moving both to
# `cnpg-system` is its own change: two operators would reconcile the same
# Clusters.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      # renovate: datasource=helm depName=cloudnative-pg registryUrl=https://cloudnative-pg.github.io/charts
      targetRevision: 0.29.1
      helm:
        releaseName: cnpg
        valueFiles:
          - $values/platform/cloudnative-pg/values.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      # Pruning the operator would leave every Postgres Cluster unmanaged.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
