# Platform secrets, decrypted by SOPS at render time. Points at its source
# directory, not deploy/: rendering would decrypt it
# (clusters/homelab/infrastructure/secrets.yaml, docs/secrets.md).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-platform
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  project: platform
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: platform/secrets
  destination:
    # Each Secret sets its own metadata.namespace.
    server: https://kubernetes.default.svc
    namespace: default
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
