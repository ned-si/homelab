# Platform secrets, decrypted from git at render time by SOPS.
#
# EXPECTED FIRST-RUN STATE: Degraded until the real files are created and sealed
# from the *.example templates in platform/secrets/. See docs/secrets.md.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  project: platform
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: platform/secrets
  destination:
    # Each Secret sets its own metadata.namespace.
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
