# Platform secrets, decrypted from git at render time by SOPS.
#
# Points at its SOURCE directory rather than deploy/, unlike every other
# Application in this layer: rendering it would decrypt it. See
# clusters/homelab/infrastructure/secrets.yaml for the full reasoning.
#
# EXPECTED FIRST-RUN STATE: Degraded until the real files are created and sealed
# from the *.example templates in platform/secrets/. See docs/secrets.md.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  project: platform
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: deployed
    path: platform/secrets
  destination:
    # Each Secret sets its own metadata.namespace.
    server: https://kubernetes.default.svc
    namespace: default
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
