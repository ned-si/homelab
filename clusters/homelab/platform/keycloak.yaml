# Keycloak, the identity provider. Hand-written manifests, not a chart: the
# upstream chart is thin and Bitnami's images need a subscription.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: platform
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/platform/keycloak
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # CloudNativePG owns the instance count and rolls it during switchover.
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /status
