# Root of the layered tree: three AppProjects and three layer Applications;
# each layer owns leaf Applications, each leaf its app (docs/architecture.md).
# Applied once by hand as bootstrap/root-app.yaml (CI: repo_policy.py
# root-profiles).
#
# Every Application tracks `main`; a rollback is a revert. Root and layers do
# not prune (a removed Application must not take its app with it); app leaves
# prune, with `Delete=false,Prune=false` on every PVC, CNPG Cluster,
# StatefulSet and Namespace. Leaves that ship CRDs do not prune. No
# resources-finalizer anywhere. Every Application sets
# `revisionHistoryLimit: 10` and `retry` (5 x 5s doubling, max 3m).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argo
spec:
  project: default
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/clusters/homelab/bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
