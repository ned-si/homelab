# Layer 2 - platform. Databases, observability, identity.
# Waits on infrastructure so that StorageClasses and cert-manager already exist.
#
# Tracks `main`, like every Application in this repo: a merge is a deployment
# and a rollback is a revert pull request (clusters/homelab/root.yaml,
# docs/decisions.md).
#
# This Application owns nothing but other Application objects, and Argo CD has
# no built-in health check for `argoproj.io/Application`, so its own health
# says nothing about the platform: read the leaves.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: layer-platform
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/clusters/homelab/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
