# Platform: the database operator, monitoring and identity.
#
# Cluster-scoped kinds are enumerated, so a chart that starts creating a new
# kind fails to sync. Webhooks are on the list: the cloudnative-pg and
# kube-prometheus-stack webhooks validate Clusters and PrometheusRules. Add an
# entry with the chart that wanted it on the same line.
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Shared services - CloudNativePG, observability, Keycloak
  sourceRepos:
    - https://github.com/ned-si/homelab.git
    - https://cloudnative-pg.github.io/charts
    - https://prometheus-community.github.io/helm-charts
    # tuppr chart (OCI; Argo CD takes the registry path without oci://).
    - ghcr.io/home-operations/charts
    - https://aquasecurity.github.io/helm-charts/
    - https://pkgs.tailscale.com/helmcharts
    - https://kubernetes-sigs.github.io/headlamp/
    - https://helm.vector.dev
    - https://charts.signoz.io
    - https://helm.cilium.io
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition # cnpg crds.create, kube-prometheus-stack
    - group: rbac.authorization.k8s.io
      kind: ClusterRole # both operators watch cluster-wide
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration # cnpg, prometheus-operator
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration # cnpg, prometheus-operator, tuppr
    - group: tuppr.home-operations.com
      kind: TalosUpgrade # tuppr: the target Talos version (platform/tuppr)
    - group: tuppr.home-operations.com
      kind: KubernetesUpgrade # tuppr: the target Kubernetes version
    - group: networking.k8s.io
      kind: IngressClass # tailscale-operator: the `tailscale` class
    - group: tailscale.com
      kind: ProxyClass # tailscale-operator: the default proxy class
    - group: tailscale.com
      kind: Connector # tailscale-operator: the exit node
    - group: admissionregistration.k8s.io
      kind: MutatingAdmissionPolicy # trivy-operator: ExposedSecretReports out of `view`
    - group: admissionregistration.k8s.io
      kind: MutatingAdmissionPolicyBinding # trivy-operator: the policy's binding
    - group: cilium.io
      kind: TracingPolicy # tetragon: the vendored library policies, observe only
  # Not here: Namespace (all declared in infrastructure/namespaces/, with
  # their Pod Security labels), StorageClass (democratic-csi) and
  # monitoring.coreos.com (namespaced kinds).
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
