# Applications: the things this cluster actually exists to run.
#
# Namespaced only. An application that needs a cluster-scoped resource is a
# design smell and should be promoted to the platform layer instead of having
# this list widened.
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: End-user workloads - media, photos, documents, recipes, sync
  sourceRepos:
    - https://github.com/ned-si/homelab.git
    - https://immich-app.github.io/immich-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: theater
    - server: https://kubernetes.default.svc
      namespace: immich
    - server: https://kubernetes.default.svc
      namespace: mealie
    - server: https://kubernetes.default.svc
      namespace: paperless
    - server: https://kubernetes.default.svc
      namespace: seafile
    - server: https://kubernetes.default.svc
      namespace: syncthing
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
