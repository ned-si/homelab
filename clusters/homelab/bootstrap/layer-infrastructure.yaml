# Layer 1 - infrastructure. Nothing else can be healthy until this is.
#
# Tracks `main`, like every Application in this repo: a merge is a deployment
# and a rollback is a revert pull request (clusters/homelab/root.yaml,
# docs/decisions.md).
#
# This Application owns nothing but other Application objects, and Argo CD has
# no built-in health check for `argoproj.io/Application`, so its own health
# says nothing about the infrastructure: read the leaves.
#
# This Application only ever creates other Applications, so it lives in the
# `default` project; the workloads it spawns live in the `infrastructure`
# project and are the ones subject to the RBAC there.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: layer-infrastructure
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/clusters/homelab/infrastructure
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
