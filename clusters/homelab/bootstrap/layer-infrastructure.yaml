# Layer 1, infrastructure. Tracks `main` (docs/decisions.md). It owns only
# Application objects, so its health says nothing: read the leaves. In the
# `default` project; its leaves are in `infrastructure`.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: layer-infrastructure
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/clusters/homelab/infrastructure
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
