# Infrastructure: CNI, CRDs, certificates, DNS, storage drivers.
#
# Cluster-scoped kinds are enumerated even here, so a chart that starts
# shipping a new kind fails to sync and names it instead of installing it
# silently. To widen it, add the group/kind with its reason on the same line.
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Cluster plumbing - CNI, Gateway API, cert-manager, DNS, CSI
  sourceRepos:
    - https://github.com/ned-si/homelab.git
    - https://helm.cilium.io
    - https://charts.jetstack.io
    - https://kubernetes-sigs.github.io/external-dns/
    - https://democratic-csi.github.io/charts/
    - https://argoproj.github.io/argo-helm
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://kyverno.github.io/kyverno/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    # Declared as plain manifests in infrastructure/.
    - group: ""
      kind: Namespace # namespaces/ -- the whole inventory
    - group: ""
      kind: PersistentVolume # nfs-storage/ (media shares), iscsi-volumes/ (static data volumes)
    - group: cert-manager.io
      kind: ClusterIssuer # cert-manager-issuers/
    - group: cilium.io
      kind: CiliumLoadBalancerIPPool # cilium/ip-pools.yaml
    - group: cilium.io
      kind: CiliumL2AnnouncementPolicy # cilium/l2-announcement-policy.yaml
    # Created by the charts this layer installs (argo-cd, cilium, cert-manager,
    # external-dns, democratic-csi) and by the vendored CRD bundle
    # (gateway-api).
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: storage.k8s.io
      kind: CSIDriver # democratic-csi
    - group: storage.k8s.io
      kind: StorageClass # iscsi + iscsi-retain
    - group: gateway.networking.k8s.io
      kind: GatewayClass # the `cilium` GatewayClass
    - group: apiregistration.k8s.io
      kind: APIService # metrics-server: v1beta1.metrics.k8s.io
    - group: policies.kyverno.io
      kind: ValidatingPolicy # kyverno-policies/, Audit only
    - group: policies.kyverno.io
      kind: DeletingPolicy # kyverno-policies/delete-shutdown-pods.yaml
    # Webhooks: cert-manager's own (cainjector writes their CA bundle, hence
    # the diff ignore in bootstrap/argocd-values.yaml). Kyverno registers its
    # webhooks at runtime, outside Argo CD.
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    # The Gateway API CRD bundle (gateway-api/, v1.5+) ships the policy
    # `safe-upgrades.gateway.networking.k8s.io`: it rejects Gateway API CRDs
    # older than v1.5 and experimental CRDs over standard ones. In-process
    # CEL, no webhook.
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
  # Namespaced resources stay wildcarded: a namespaced object cannot reach
  # outside its namespace.
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  # No sync windows. A deny window kept Argo CD off the helm-CLI releases
  # `cilium` and `iscsi` (democratic-csi) until Argo CD took each of them over
  # with one manual sync on 2026-10-05.
