# Layer 3 - applications. Everything the cluster exists to serve.
# Waits on platform so that CloudNativePG and Keycloak are ready first.
#
# Tracks `main`, like every Application in this repo: a merge is a deployment
# and a rollback is a revert pull request (clusters/homelab/root.yaml,
# docs/decisions.md).
#
# This Application owns nothing but other Application objects, and Argo CD has
# no built-in health check for `argoproj.io/Application`, so its own health
# says nothing about the apps: read the leaves.
#
# `clusters/homelab/apps/immich.yaml` is the exception among the leaves: it has
# no `automated` block and is synced by hand.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: layer-apps
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/clusters/homelab/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
