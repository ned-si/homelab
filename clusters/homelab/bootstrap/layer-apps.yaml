# Layer 3 - applications. Everything the cluster exists to serve.
# Waits on platform so that CloudNativePG and Keycloak are ready first.
#
# Tracks the `deployed` git tag, like everything else in this repo. CI moves that
# tag, syncs THIS Application and waits for it to report Synced+Healthy. This is
# the LAST layer, so that wait is the last thing standing between a bad commit
# and a green deploy -- if it passes, the `deployed` tag stays where CI put it.
#
# WHICH IS WHY IT HAS TO BE REAL. This Application owns nothing but other
# Application objects, so its health is purely the roll-up of theirs -- and Argo
# CD ships no built-in health check for `argoproj.io/Application`, having removed
# it in 1.8. The roll-up works only because
# `resource.customizations.health.argoproj.io_Application` is set in
# bootstrap/argocd-values.yaml. Take that away and this wait reports Healthy
# within seconds even if every application in the cluster is Degraded.
#
# `clusters/homelab/apps/immich.yaml` is the intended exception: with no
# `automated` block it sits OutOfSync after a deploy that touches it, but it
# still reports its own health, so it reads Healthy and does not block this gate.
#
# See clusters/homelab/root.yaml for why a tag and not a branch, and
# docs/adr/0001-deploy-by-moving-a-git-tag.md for the rest.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: layer-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: deployed
    path: deploy/clusters/homelab/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
