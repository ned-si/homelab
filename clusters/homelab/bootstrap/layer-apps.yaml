# Layer 3, applications; waits on platform (CloudNativePG, Keycloak). Tracks
# `main` (docs/decisions.md). It owns only Application objects, so its health
# says nothing about the apps: read the leaves.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: layer-apps
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/clusters/homelab/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
