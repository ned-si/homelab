# Cilium: CNI, kube-proxy replacement, L2 announcements, Gateway API controller.
#
# Argo CD owns the lifecycle since 2026-10-05 (taken over from the helm-CLI
# release `cilium` by one manual sync). The chart is rendered with the same
# release name and values file, so every object keeps its name. A chart or
# values change merged to main rolls the CNI: upgrade one change at a time.
#
# Automated sync with self-heal, but NO prune: a pruned DaemonSet, ConfigMap
# or ClusterRole would take the cluster's network down. Remove objects from
# this chart deliberately, by hand.
#
# The helm release Secrets `sh.helm.release.v1.cilium.*` remain as stale
# metadata; they are the rollback path (`helm rollback cilium 16`). Never
# `helm uninstall cilium`: it deletes the CNI.
#
# Fresh cluster: the bootstrap installs the release first (no pod schedules
# without a CNI), then this Application adopts it; see docs/bootstrap.md.
# CI (repo-policy `cilium-version`) keeps the chart version equal to
# ci/helm-releases.yaml, which the bootstrap install reads.
#
# Upgrade one minor at a time (1.16 -> 1.17 -> 1.18 ...); see
# docs/migration-plan.md.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: infrastructure
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      # renovate: datasource=helm depName=cilium registryUrl=https://helm.cilium.io
      targetRevision: 1.17.18
      helm:
        releaseName: cilium
        valueFiles:
          - $values/infrastructure/cilium/values.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # A sync keeps the live value of every field ignored below instead of
      # writing the rendered one.
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # The operator writes status into these; they are not desired state.
    - group: ""
      kind: ConfigMap
      name: cilium-config
      jsonPointers:
        - /data/cluster-id
    # The chart generates this CA and the Hubble server certificate with
    # helm's genCA/genSignedCert, so every render produces new key material.
    # Keep the live certificates: without this, every sync would rotate them.
    - group: ""
      kind: Secret
      name: cilium-ca
      namespace: kube-system
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-server-certs
      namespace: kube-system
      jsonPointers:
        - /data
