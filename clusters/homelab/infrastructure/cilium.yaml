# Cilium: CNI, kube-proxy replacement, L2 announcements, Gateway controller.
# Adopted from the bootstrap install (docs/bootstrap.md); CI keeps the chart
# version equal to ci/helm-releases.yaml. A merge rolls the CNI: one minor at
# a time, with its Gateway API CRDs (Renovate group "cluster networking").
#
# No prune: a pruned DaemonSet or ClusterRole takes the network down. Never
# `helm uninstall cilium`. The third source is the PostSync smoke
# (infrastructure/cilium-smoke).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: infrastructure
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      # renovate: datasource=helm depName=cilium registryUrl=https://helm.cilium.io
      targetRevision: 1.20.4
      helm:
        releaseName: cilium
        valueFiles:
          - $values/infrastructure/cilium/values.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      path: deploy/infrastructure/cilium-smoke
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # A sync keeps the live value of every field ignored below instead of
      # writing the rendered one.
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # The operator writes status into these; they are not desired state.
    - group: ""
      kind: ConfigMap
      name: cilium-config
      jsonPointers:
        - /data/cluster-id
  # No certificate Secrets in the render: certgen writes `cilium-ca`,
  # `hubble-server-certs` and `hubble-relay-client-certs` itself
  # (hubble.tls.auto.method cronJob in infrastructure/cilium/values.yaml), so
  # a sync never rotates or replaces them.
