# Cilium: CNI, kube-proxy replacement, L2 announcements, Gateway API controller.
#
# Being taken over from the helm-CLI release `cilium` (kube-system), which the
# OpenTofu bootstrap installs on a new cluster. The chart is rendered with the
# same release name and values file, so every object keeps its name. No sync
# window any more; synced by hand for the takeover, no `automated` block yet.
# CI (repo-policy `cilium-version`) keeps the chart version equal to
# ci/helm-releases.yaml.
#
# Upgrade one minor at a time (1.16 -> 1.17 -> 1.18 ...); see
# docs/migration-plan.md.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: infrastructure
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      # renovate: datasource=helm depName=cilium registryUrl=https://helm.cilium.io
      targetRevision: 1.17.18
      helm:
        releaseName: cilium
        valueFiles:
          - $values/infrastructure/cilium/values.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  revisionHistoryLimit: 10
  syncPolicy:
    # No `automated`: never sync the CNI from Argo CD. Pruning it would take the
    # cluster's network down.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # A sync keeps the live value of every field ignored below instead of
      # writing the rendered one.
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # The operator writes status into these; they are not desired state.
    - group: ""
      kind: ConfigMap
      name: cilium-config
      jsonPointers:
        - /data/cluster-id
    # The chart generates this CA and the Hubble server certificate with
    # helm's genCA/genSignedCert, so every render produces new key material.
    # Keep the live certificates: without this, every sync would rotate them.
    - group: ""
      kind: Secret
      name: cilium-ca
      namespace: kube-system
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-server-certs
      namespace: kube-system
      jsonPointers:
        - /data
