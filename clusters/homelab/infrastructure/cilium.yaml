# Cilium: CNI, kube-proxy replacement, L2 announcements, Gateway API controller.
#
# The bootstrap installs the release with the helm CLI (no pod schedules
# without a CNI), then this Application adopts it with the same release name
# and values file, so every object keeps its name; see docs/bootstrap.md.
# CI (repo-policy `bootstrap-chart-versions`) keeps the chart version equal to
# ci/helm-releases.yaml, which the bootstrap install reads. A chart or values
# change merged to main rolls the CNI: upgrade one change at a time.
#
# Automated sync with self-heal, but NO prune: a pruned DaemonSet, ConfigMap
# or ClusterRole would take the cluster's network down. Remove objects from
# this chart deliberately, by hand.
#
# The helm release Secrets `sh.helm.release.v1.cilium.*` from the bootstrap
# install remain as stale metadata. Never `helm uninstall cilium`: it deletes
# the CNI.
#
# Upgrade one minor at a time, each its own pull request, together with the
# Gateway API CRDs it supports (Renovate group "cluster networking").
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: infrastructure
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      # renovate: datasource=helm depName=cilium registryUrl=https://helm.cilium.io
      targetRevision: 1.20.4
      helm:
        releaseName: cilium
        valueFiles:
          - $values/infrastructure/cilium/values.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # A sync keeps the live value of every field ignored below instead of
      # writing the rendered one.
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # The operator writes status into these; they are not desired state.
    - group: ""
      kind: ConfigMap
      name: cilium-config
      jsonPointers:
        - /data/cluster-id
  # No certificate Secrets in the render: certgen writes `cilium-ca`,
  # `hubble-server-certs` and `hubble-relay-client-certs` itself
  # (hubble.tls.auto.method cronJob in infrastructure/cilium/values.yaml), so
  # a sync never rotates or replaces them.
