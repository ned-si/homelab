# CiliumNetworkPolicy allow-lists for the application namespaces
# (infrastructure/network-policies/; the switches are in 90-enforcement.yaml).
#
# Wave 30, last in the layer: Application health holds a wave (the custom
# health check in bootstrap/argocd-values.yaml), so the least urgent, most
# likely wrong Application goes where it blocks nothing. Not in `apps`, so a
# policy revert is independent of app syncs.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/infrastructure/network-policies
  destination:
    server: https://kubernetes.default.svc
    # Fallback only, every object sets its namespace. `argo` is inert: a
    # stray policy there selects nothing.
    namespace: argo
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      # PRUNE IS REQUIRED, not merely permitted. Reverting enforcement means
      # taking a `CiliumNetworkPolicy` out of git; without prune the object stays
      # in the cluster and the revert commit does nothing, which is the worst
      # possible behaviour for a safety switch.
      prune: true
      # selfHeal: false, the only Application without it, so the break-glass
      #     kubectl -n <ns> delete cnp enforce-default-deny
      # sticks during an incident (shown as OutOfSync). Until the next merge
      # only: any new revision of `main` auto-syncs and re-creates it. For
      # longer, take it out of git (`prune: true`).
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
