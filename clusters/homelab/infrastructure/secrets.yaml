# Infrastructure secrets, decrypted from git at render time by SOPS/KSOPS.
#
# All secrets for a layer live in ONE Application so that "where are the
# secrets?" has exactly one answer per layer. It syncs at wave -25, right after
# the namespaces exist and before anything that mounts a Secret.
#
# No `plugin:` stanza is needed: KSOPS is a kustomize KRM exec plugin, and the
# repo-server is configured globally with
# `kustomize.buildOptions: --enable-alpha-plugins --enable-exec`, so Argo's
# built-in kustomize resolves the generator transparently. See bootstrap/.
#
# ###########################################################################
# # THE ONE EXCEPTION TO deploy/.
# #
# # Every other Application syncs pre-rendered manifests from deploy/. This one
# # points at its SOURCE directory, because rendering it would mean running
# # KSOPS, which decrypts -- and the output would be plaintext Secrets committed
# # to git. `scripts/render-deploy.sh` refuses to render any */secrets directory,
# # and that refusal is not configurable.
# #
# # Consequence: KSOPS is still needed on the repo-server, but now only three
# # small directories are ever built there instead of all twenty-three. That is
# # the point -- `--enable-exec` is a global setting, so the way to limit it is
# # to limit what gets built. See docs/architecture.md.
# ###########################################################################
#
# EXPECTED FIRST-RUN STATE: Degraded until you have created and sealed the real
# files from the *.example templates in infrastructure/secrets/.
# See docs/secrets.md.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-infrastructure
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: deployed
    path: infrastructure/secrets
  destination:
    # Each Secret carries its own explicit metadata.namespace; this is only the
    # fallback for anything that does not.
    server: https://kubernetes.default.svc
    namespace: default
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
