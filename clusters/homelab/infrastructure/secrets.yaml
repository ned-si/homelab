# Infrastructure secrets, decrypted by KSOPS at render time; one Application
# per layer, at wave -25, after the namespaces and before anything that mounts
# a Secret. KSOPS runs through the repo-server's global
# `--enable-alpha-plugins --enable-exec`, so no `plugin:` stanza.
#
# THE ONE EXCEPTION TO deploy/: it points at its source directory, because
# rendering would commit plaintext Secrets (scripts/render-deploy.sh refuses).
# Only the three secrets directories are built on the repo-server
# (docs/architecture.md, docs/secrets.md).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-infrastructure
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: infrastructure/secrets
  destination:
    # Each Secret carries its own explicit metadata.namespace; this is only the
    # fallback for anything that does not.
    server: https://kubernetes.default.svc
    namespace: default
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
