# Static iSCSI PVs re-bound to their claims by name. Wave 25, after
# democratic-csi and before the claims. Never prune: deleting a Retain PV
# keeps the zvol, but the claim then needs a hand-made PV.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iscsi-volumes
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/infrastructure/iscsi-volumes
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # The binding controller completes claimRef (uid, resourceVersion).
    - group: ""
      kind: PersistentVolume
      jsonPointers:
        - /spec/claimRef
