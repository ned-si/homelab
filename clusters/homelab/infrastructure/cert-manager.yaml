# cert-manager. Issues the wildcard certificate that the shared Gateway serves.
#
# Split into two Applications on purpose: the controller (this one) must be
# running and its CRDs established before any ClusterIssuer can be validated.
# A single Application would try to apply both in one pass and fail the first
# sync every time.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infrastructure
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      # renovate: datasource=helm depName=cert-manager registryUrl=https://charts.jetstack.io
      targetRevision: v1.21.1
      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/infrastructure/cert-manager/values.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: deployed
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
