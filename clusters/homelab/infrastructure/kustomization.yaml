apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ordering inside the infrastructure layer, by sync-wave:
#
#   -30  namespaces        namespace inventory (PSA warn/audit labels)
#   -25  secrets           SOPS-decrypted Secrets (needs the namespaces above)
#   -20  gateway-api       Gateway API CRDs v1.6.3 (experimental channel)
#   -15  argocd            Argo CD's own release; auto-sync, no prune
#   -10  cilium            CNI; auto-sync, no prune
#    -5  cilium-config     LB IP pools + L2 announcement policy
#     0  cert-manager      its CRDs must be established before issuers appear
#     5  cert-manager-issuers
#    10  external-dns      publishes the public hostnames
#    12  kubelet-serving-cert-approver  approves the kubelet serving certificates
#    14  metrics-server    metrics.k8s.io for `kubectl top` and Headlamp
#    15  gateway           the shared Gateway on .254 (ADR 0007)
#    20  democratic-csi    iSCSI CSI driver + StorageClasses; auto-sync, no prune
#    25  iscsi-volumes     static PVs of the existing data zvols; no prune
#    26  kyverno           admission policies, Audit only, fail-open webhooks
#    27  kyverno-policies  the ValidatingPolicies (needs the CRDs above)
#    30  network-policies  CiliumNetworkPolicy allow-lists, not enforced
#                          (every switch in 90-enforcement.yaml is false)
#
# Kept in git, not part of the layer yet (each is new behaviour and ships in
# its own change, ADR 0002):
#   snapshot-controller.yaml  would run beside the unmanaged snapshot-controller
#                             v6.3.1 in kube-system; enabling it must replace it
#   nfs-storage.yaml          would create new NFS PVs/PVCs; theater keeps its
#                             inline NFS volumes as live
resources:
  - namespaces.yaml
  - secrets.yaml
  - argocd.yaml
  - gateway-api.yaml
  - cilium.yaml
  - cilium-config.yaml
  - cert-manager.yaml
  - cert-manager-issuers.yaml
  - external-dns.yaml
  - kubelet-serving-cert-approver.yaml
  - metrics-server.yaml
  - gateway.yaml
  - democratic-csi.yaml
  - iscsi-volumes.yaml
  - kyverno.yaml
  - kyverno-policies.yaml
  - network-policies.yaml
