# external-dns (chart 1.15.0, v0.15.0): publishes the public hostnames to
# Cloudflare. Source: the shared Gateway's HTTPRoutes only. Every record
# points at the single WAN address set by `--default-targets` in
# infrastructure/external-dns/values.yaml.
#
# Its Cloudflare token comes from the `secrets-infrastructure` Application
# (wave -25).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: infrastructure
  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      # renovate: datasource=helm depName=external-dns registryUrl=https://kubernetes-sigs.github.io/external-dns/
      targetRevision: 1.15.2
      helm:
        releaseName: external-dns
        valueFiles:
          - $values/infrastructure/external-dns/values.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Client-side apply, as the running child Application does. Its
      # objects carry last-applied-configuration from client-side apply;
      # switching this leaf to server-side apply on adoption would keep
      # fields the new render drops (e.g. a volume source) and fail
      # validation. Move to ServerSideApply=true in its own change, after
      # adoption.
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
