# external-dns: publishes the shared Gateway's HTTPRoute hostnames to
# Cloudflare, all to the WAN address in `--default-targets`. Token from
# `secrets-infrastructure`. A new chart CRD reports Degraded for a second
# before Established, which triggers auto-rollback: merge such a version with
# auto-rollback paused.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: infrastructure
  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      # renovate: datasource=helm depName=external-dns registryUrl=https://kubernetes-sigs.github.io/external-dns/
      targetRevision: 1.23.0
      helm:
        releaseName: external-dns
        valueFiles:
          - $values/infrastructure/external-dns/values.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Client-side apply: the objects carry last-applied-configuration, and
      # server-side apply would keep fields the render drops. Switch in its
      # own change.
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
