# Gateway API CRDs.
#
# Cilium implements the Gateway API but does NOT ship its CRDs, so they have to
# be installed separately and kept in lockstep with the Cilium version:
# Cilium 1.20.x targets Gateway API v1.6.1.
#
# The pinned version lives in infrastructure/gateway-api/kustomization.yaml,
# where Renovate tracks it via a `# renovate:` comment on the release URL.
#
# Replaces: the manual `kubectl apply -f .../experimental-install.yaml` step
# that used to live in the README. We use the STANDARD channel; switch to
# experimental only if you actually need ListenerSet or BackendTLSPolicy.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: infrastructure/gateway-api
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      # CRDs are never pruned automatically. Removing a Gateway API CRD would
      # cascade-delete every Gateway and HTTPRoute in the cluster.
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
