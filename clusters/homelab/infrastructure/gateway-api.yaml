# Gateway API CRDs.
#
# Gateway API CRDs.
#
# Cilium implements the Gateway API but does NOT ship its CRDs, so they have to
# be installed separately and kept in lockstep with the Cilium version.
#
# The pinned version and channel live in
# infrastructure/gateway-api/kustomization.yaml -- the single source of truth --
# where Renovate tracks them via a `# renovate:` comment on the release URL.
# Currently v1.6.3, **experimental** channel, the version Cilium 1.20 supports.
#
# The channel is not a free choice: the experimental bundle installs CRDs the
# standard one does not (TCPRoute, UDPRoute, the x-k8s.io kinds), and the
# bundle's `safe-upgrades` admission policy rejects experimental CRDs over
# standard ones.
#
# A fresh cluster needs these before Cilium starts, so the bootstrap applies
# the same render by hand first (docs/bootstrap.md); this Application adopts it.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/infrastructure/gateway-api
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      # CRDs are never pruned automatically. Removing a Gateway API CRD would
      # cascade-delete every Gateway and HTTPRoute in the cluster.
      prune: false
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
