# Gateway API CRDs. Cilium does not ship them; version and channel are pinned
# in infrastructure/gateway-api/kustomization.yaml. Experimental, because
# that bundle has kinds the standard one lacks and its `safe-upgrades` policy
# rejects experimental CRDs over standard ones. A fresh cluster applies them
# by hand before Cilium (docs/bootstrap.md); this Application adopts them.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/infrastructure/gateway-api
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      # CRDs are never pruned automatically. Removing a Gateway API CRD would
      # cascade-delete every Gateway and HTTPRoute in the cluster.
      prune: false
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
