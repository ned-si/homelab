# The eight Ingresses the legacy root `all-apps` owns today (ADR 0011), kept at
# parity in one leaf so that removing them with ingress-nginx is one unit.
# Source: infrastructure/legacy-ingress/.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: legacy-ingress
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "13"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: deployed
    path: deploy/infrastructure/legacy-ingress
  destination:
    server: https://kubernetes.default.svc
    # Every Ingress sets its own namespace; this is only the fallback.
    namespace: ingress
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
