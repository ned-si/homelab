# democratic-csi: the iSCSI CSI driver and StorageClasses `iscsi` and
# `iscsi-retain`, backed by TrueNAS.
#
# DIFF VISIBILITY ONLY. The driver is the helm-CLI release `iscsi` (chart
# 0.14.7) and stays one: this Application has no `automated` block and is
# never synced, because a second controller for the same CSI driver, or a
# wrong driver config, would affect every PVC. Upgrade with `helm upgrade`
# as described in infrastructure/democratic-csi/values-iscsi.yaml; the driver
# config comes from SOPS (scripts/democratic-csi-values.sh). Argo CD renders
# the plain values only, so it shows the driver-config Secret as differing.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: democratic-csi
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: infrastructure
  sources:
    - repoURL: https://democratic-csi.github.io/charts/
      chart: democratic-csi
      # renovate: datasource=helm depName=democratic-csi registryUrl=https://democratic-csi.github.io/charts/
      targetRevision: 0.14.7
      helm:
        releaseName: iscsi
        valueFiles:
          - $values/infrastructure/democratic-csi/values-iscsi.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: deployed
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: democratic-csi
  revisionHistoryLimit: 10
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
