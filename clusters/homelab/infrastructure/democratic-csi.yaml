# democratic-csi: the iSCSI CSI driver and StorageClasses `iscsi` and
# `iscsi-retain`, backed by TrueNAS.
#
# The chart is rendered with release name `iscsi`, the name of the helm-CLI
# release that installed it, so every object keeps its name and selector. The
# driver config is not rendered here: it is the SOPS-sealed Secret applied by
# `secrets-infrastructure`, read through `driver.existingConfigSecret`.
#
# Not synced yet: the sync window in project-infrastructure.yaml still denies
# every sync of this leaf, until Argo CD takes it over from the helm release.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: democratic-csi
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: infrastructure
  sources:
    - repoURL: https://democratic-csi.github.io/charts/
      chart: democratic-csi
      # renovate: datasource=helm depName=democratic-csi registryUrl=https://democratic-csi.github.io/charts/
      targetRevision: 0.14.7
      helm:
        releaseName: iscsi
        valueFiles:
          - $values/infrastructure/democratic-csi/values-iscsi.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: democratic-csi
  revisionHistoryLimit: 10
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
