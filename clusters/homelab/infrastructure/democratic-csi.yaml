# democratic-csi: the iSCSI driver and StorageClasses `iscsi` and
# `iscsi-retain` on TrueNAS. Release name `iscsi`, so objects keep their names
# and selectors; the driver config is the SOPS Secret from
# `secrets-infrastructure`.
#
# No prune: a pruned CSIDriver, StorageClass or node DaemonSet cuts every
# volume. Never `helm uninstall iscsi`; the stale release Secrets are the
# rollback path (`helm rollback iscsi 9`).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: democratic-csi
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: infrastructure
  sources:
    - repoURL: https://democratic-csi.github.io/charts/
      chart: democratic-csi
      # renovate: datasource=helm depName=democratic-csi registryUrl=https://democratic-csi.github.io/charts/
      targetRevision: 0.15.1
      helm:
        releaseName: iscsi
        valueFiles:
          - $values/infrastructure/democratic-csi/values-iscsi.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      ref: values
    # The node plugin's /etc/selinux/config (infrastructure/democratic-csi/resources).
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      path: deploy/infrastructure/democratic-csi/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: democratic-csi
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
