# democratic-csi: iSCSI StorageClass backed by TrueNAS.
#
# The driver config -- which contains the TrueNAS API key AND an SSH private key
# with root access to the storage box -- is NOT in this chart's values any more.
# It lives in a SOPS-encrypted Secret and is pulled in via
# `driver.existingConfigSecret`. That plaintext key in `iac/truenas-iscsi.yaml`
# was the single worst thing in the old repo: see docs/security-incident.md.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: democratic-csi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: infrastructure
  sources:
    - repoURL: https://democratic-csi.github.io/charts/
      chart: democratic-csi
      # renovate: datasource=helm depName=democratic-csi registryUrl=https://democratic-csi.github.io/charts/
      targetRevision: 0.15.1
      helm:
        releaseName: democratic-csi-iscsi
        valueFiles:
          - $values/infrastructure/democratic-csi/values-iscsi.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: democratic-csi
  syncPolicy:
    automated:
      # Pruning the CSI driver would orphan every PVC in the cluster.
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
