# democratic-csi: the iSCSI CSI driver and StorageClasses `iscsi` and
# `iscsi-retain`, backed by TrueNAS.
#
# The chart is rendered with release name `iscsi`, the name of the helm-CLI
# release that installed it, so every object keeps its name and selector. The
# driver config is not rendered here: it is the SOPS-sealed Secret applied by
# `secrets-infrastructure`, read through `driver.existingConfigSecret`.
#
# Argo CD owns the lifecycle since 2026-10-05 (taken over from the helm
# release by one manual sync). Automated sync with self-heal, but NO prune: a
# pruned CSIDriver, StorageClass or node DaemonSet would cut every iSCSI
# volume. Remove objects from this chart deliberately, by hand.
#
# The helm release Secrets `sh.helm.release.v1.iscsi.*` remain as stale
# metadata; they are the rollback path (`helm rollback iscsi 9`). Never
# `helm uninstall iscsi`: it deletes the driver and the StorageClasses.
#
# Fresh cluster: this Application installs the driver like any other leaf,
# after `secrets-infrastructure` (wave -25) has created the driver config.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: democratic-csi
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: infrastructure
  sources:
    - repoURL: https://democratic-csi.github.io/charts/
      chart: democratic-csi
      # renovate: datasource=helm depName=democratic-csi registryUrl=https://democratic-csi.github.io/charts/
      targetRevision: 0.15.1
      helm:
        releaseName: iscsi
        valueFiles:
          - $values/infrastructure/democratic-csi/values-iscsi.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: democratic-csi
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
