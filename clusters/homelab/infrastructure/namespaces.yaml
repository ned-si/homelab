# Every namespace in the cluster, declared in one place: Secrets need their
# namespace before the charts run, and `CreateNamespace=true` makes
# namespaces without the Pod Security and Prometheus labels.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/infrastructure/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      # Never prune namespaces automatically: a mistyped path here would
      # cascade-delete every PVC and Secret inside them.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
