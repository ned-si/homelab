# Static NFS volumes for bulk media.
#
# Why this exists as its own Application: in the old repo, eight different
# Deployments each carried an inline
#
#     nfs:
#       server: 192.168.1.228
#       path: /mnt/homelab/k8s/nfs/...
#
# block. That meant the storage server's address was copy-pasted across the
# tree, no app could be moved without editing its Deployment, and there was no
# single place to change after a house move or a NAS replacement.
#
# Now there is one PersistentVolume per share here, and applications reference a
# PVC by name. Changing the NFS server is a one-file change.
#
# PersistentVolume is cluster-scoped, which is why this lives in the
# infrastructure layer rather than with the apps that consume it.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-storage
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/infrastructure/nfs-storage
  destination:
    server: https://kubernetes.default.svc
    namespace: theater
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      # Never prune: deleting a PV that is Bound with reclaimPolicy Retain is
      # survivable, but pruning is not how you want to find that out.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # The binding controller writes claimRef into the PV spec.
    - group: ""
      kind: PersistentVolume
      jsonPointers:
        - /spec/claimRef
