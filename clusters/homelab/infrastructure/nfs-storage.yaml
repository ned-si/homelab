# Static NFS volumes for bulk media: one PV per share, referenced by claim, so
# a NAS change is a one-file change. PersistentVolumes are cluster-scoped,
# hence the infrastructure layer.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-storage
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/infrastructure/nfs-storage
  destination:
    server: https://kubernetes.default.svc
    namespace: theater
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      # Never prune: deleting a PV that is Bound with reclaimPolicy Retain is
      # survivable, but pruning is not how you want to find that out.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # The binding controller writes claimRef into the PV spec.
    - group: ""
      kind: PersistentVolume
      jsonPointers:
        - /spec/claimRef
