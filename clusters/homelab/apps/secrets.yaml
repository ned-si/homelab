# Application secrets, decrypted by SOPS at render time. Points at its source
# directory, not deploy/: rendering would decrypt it
# (clusters/homelab/infrastructure/secrets.yaml, docs/secrets.md).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-apps
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  project: apps
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: apps/secrets
  destination:
    # Each Secret declares its own namespace. This is only the fallback, and it
    # must be one of the `apps` AppProject's destinations (`default` is not:
    # Argo CD rejects the Application with InvalidSpecError).
    server: https://kubernetes.default.svc
    namespace: theater
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
