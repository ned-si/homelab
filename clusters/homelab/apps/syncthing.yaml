# Syncthing - peer-to-peer file sync.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: syncthing
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: apps
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: deployed
    path: deploy/apps/syncthing
  destination:
    server: https://kubernetes.default.svc
    namespace: syncthing
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # Argo CD < 2.12 reports a permanent diff on LoadBalancer status ipMode (argoproj/argo-cd#17548). Harmless on 2.14; remove with the next Argo CD change.
    - group: ""
      kind: Service
      jqPathExpressions:
        - .status.loadBalancer.ingress[].ipMode
