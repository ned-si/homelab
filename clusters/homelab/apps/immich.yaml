# Immich, the photo library. Renovate updates the server and ML image and the
# chart; never the database image (docs/runbooks/immich-upgrade.md). A PreSync
# hook takes a base backup of immich-db, a PostSync hook checks the server.
# Multi-source: the chart plus apps/immich/resources. The library PVC is in no
# leaf, so prune never sees it (CI rule pvc-sync-options).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: apps
  sources:
    # OCI chart (Argo CD takes the registry path without oci://); the HTTP
    # repository is no longer published.
    - repoURL: ghcr.io/immich-app/immich-charts
      chart: immich
      # renovate: datasource=docker depName=ghcr.io/immich-app/immich-charts/immich
      targetRevision: 0.13.4
      helm:
        releaseName: immich
        valueFiles:
          - $values/apps/immich/values.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      path: deploy/apps/immich/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Client-side apply: the objects carry last-applied-configuration, and
      # server-side apply would keep fields the render drops. Switch in its
      # own change.
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /status
