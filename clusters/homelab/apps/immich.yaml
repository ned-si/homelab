# Immich - photo library.
#
# AT PARITY WITH THE RUNNING RELEASE (ADR 0002): chart 0.9.0, server v2.3.1,
# database image ghcr.io/tensorchord/cloudnative-pgvecto.rs:16.5-v0.3.0
# (pgvecto.rs, PG16). Adopting this leaf changes no image and no chart version.
#
# DO NOT UPGRADE FROM HERE. The server image, the chart and the database image
# move together, in one change that follows docs/runbooks/immich-upgrade.md.
# Moving off pgvecto.rs (to VectorChord) migrates the database in place and
# cannot be rolled back; newer charts also rename every values key. Neither
# belongs in a routine bump of this file.
#
# Multi-source: the chart, plus a git path (apps/immich/resources) carrying
# the database Cluster, the Valkey Deployment and Service, and the HTTPRoute.
# The photo library PVC immich-data is in no leaf at all.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: apps
  sources:
    - repoURL: https://immich-app.github.io/immich-charts
      chart: immich
      # renovate: datasource=helm depName=immich registryUrl=https://immich-
      # app.github.io/immich-charts
      targetRevision: 0.9.0
      helm:
        releaseName: immich
        valueFiles:
          - $values/apps/immich/values.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      path: deploy/apps/immich/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  revisionHistoryLimit: 10
  syncPolicy:
    # ###################################################################
    # # THE ONE APPLICATION WITH NO `automated:` BLOCK. Sync it by hand:
    # #     argocd app sync immich
    # #
    # # An Immich major upgrade runs irreversible database migrations -- once
    # # a newer server has migrated the schema, the old image will not start on
    # # it. A merge to main must not be able to trigger that while you are still
    # # reading docs/runbooks/immich-upgrade.md.
    # #
    # # `automated: {prune: false, selfHeal: false}` does NOT achieve this, which
    # # is the trap: `selfHeal` only governs re-syncing after CLUSTER drift. With
    # # an `automated` block present at all, a new GIT revision still auto-syncs.
    # # The only way to require a human is to omit the block, as here.
    # #
    # # Consequence: this Application sits OutOfSync after a deploy that touches
    # # it, deliberately. That does not block the CD health gate -- the gate
    # # waits on HEALTH, and an OutOfSync-but-Healthy Immich is healthy.
    # ###################################################################
    syncOptions:
      # Client-side apply, as the running child Application does. Its
      # objects carry last-applied-configuration from client-side apply;
      # switching this leaf to server-side apply on adoption would keep
      # fields the new render drops (e.g. a volume source) and fail
      # validation. Move to ServerSideApply=true in its own change, after
      # adoption.
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /status
