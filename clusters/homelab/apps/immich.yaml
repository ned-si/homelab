# Immich - photo library.
#
# Synced automatically, like every other app. Renovate updates the server
# image below v3.0.0 and the chart below 0.10.0 (.github/renovate.json5);
# Immich 3.0 drops pgvecto.rs and chart 0.10 rewrote the values, so both
# move together with the database image, by hand, following
# docs/runbooks/immich-upgrade.md. The database image
# (cloudnative-pgvecto.rs:16.5-v0.3.0) is never updated by Renovate.
#
# Before every sync a PreSync hook takes a base backup of immich-db, and
# after it a PostSync hook checks the server answers
# (apps/immich/resources).
#
# Multi-source: the chart, plus a git path (apps/immich/resources) carrying
# the database Cluster, the Valkey Deployment and Service, the HTTPRoute and
# the backup jobs. The photo library PVC immich-data is in no leaf at all, so
# prune never sees it (CI rule pvc-sync-options); every rendered PVC and the
# Cluster carry Delete=false,Prune=false.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: apps
  sources:
    # OCI chart (Argo CD takes the registry path without oci://); the HTTP
    # repository is no longer published.
    - repoURL: ghcr.io/immich-app/immich-charts
      chart: immich
      # renovate: datasource=docker depName=ghcr.io/immich-app/immich-charts/immich
      targetRevision: 0.13.4
      helm:
        releaseName: immich
        valueFiles:
          - $values/apps/immich/values.yaml
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/ned-si/homelab.git
      targetRevision: main
      path: deploy/apps/immich/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Client-side apply, as the running child Application does. Its
      # objects carry last-applied-configuration from client-side apply;
      # switching this leaf to server-side apply on adoption would keep
      # fields the new render drops (e.g. a volume source) and fail
      # validation. Move to ServerSideApply=true in its own change, after
      # adoption.
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /status
