# theater: Plex, Jellyfin, the *arr stack and qBittorrent, one system sharing
# one NFS share and its hardlink contract. If the *arr apps cannot reach
# qBittorrent, read docs/runbooks/arr-qbittorrent.md before debugging Cilium.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: theater
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: apps
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/apps/theater
  destination:
    server: https://kubernetes.default.svc
    namespace: theater
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
