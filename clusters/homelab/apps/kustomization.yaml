apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Applications are independent of each other, so they all sync at wave 0 except
# the secret bundle, which must land first.
#
#   -25  secrets    SOPS-decrypted Secrets for every app namespace
#     0  everything else, in parallel
resources:
  - secrets.yaml
  - theater.yaml
  - immich.yaml
  - mealie.yaml
  - paperless.yaml
  - seafile.yaml
  - syncthing.yaml
