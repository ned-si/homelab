# Seafile, decommissioned (docs/decisions.md). The Application now holds only
# the two retained claims, so its prune removes the workloads; it is deleted
# once that is done (no Application carries the resources-finalizer).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seafile
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: apps
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/apps/seafile
  destination:
    server: https://kubernetes.default.svc
    namespace: seafile
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
