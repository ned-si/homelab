# Books: Audiobookshelf (audiobooks, podcasts), Calibre-Web Automated (ebooks).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: books
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: apps
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/apps/books
  destination:
    server: https://kubernetes.default.svc
    namespace: books
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
