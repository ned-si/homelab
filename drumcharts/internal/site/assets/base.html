{{define "head" -}}
<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<meta name="description" content="{{.Description}}">
<meta name="author" content="nedsi">
<link rel="canonical" href="https://charts.nedsi.io{{.Path}}">
<link rel="stylesheet" href="/layout.css">
<link rel="stylesheet" href="/charts.css">
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<header class="site">
<nav class="site" aria-label="Site">
{{- range .Nav}}
<a href="{{.Href}}"{{if .Current}} aria-current="page"{{end}}>{{.Label}}</a>
{{- end}}
</nav>
<p class="prefs">
<a class="to-light" href="/set-theme/light{{.Path}}" rel="nofollow" title="{{.Prefs.LightTitle}}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 1.5V4M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg><span class="vh">{{.Prefs.Light}}</span></a>
<a class="to-dark" href="/set-theme/dark{{.Path}}" rel="nofollow" title="{{.Prefs.DarkTitle}}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span class="vh">{{.Prefs.Dark}}</span></a>
</p>
</header>
{{- end}}

{{define "foot" -}}
<footer class="site">
<p><a href="https://blog.nedsi.io/privacy/">{{.Privacy}}</a>.</p>
</footer>
</body>
</html>{{end}}
