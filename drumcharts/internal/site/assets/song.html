{{template "head" .}}
<main>
<h1>{{.Heading}}</h1>
<p class="lead">{{.Lead}}</p>
<p class="links"><a class="button" href="/pdf/{{.Slug}}.pdf" download>{{.Download}}</a> · <a href="{{.Root}}">{{.All}}</a>{{if .LegendLink}} · <a href="{{.Root}}legend/">{{.LegendLink}}</a>{{end}}</p>
<div class="sheets">
{{- range $i, $p := .Images}}
<img src="/pages/{{$p.Name}}" width="{{$p.Width}}" height="{{$p.Height}}" alt="{{$p.Alt}}"{{if $i}} loading="lazy"{{end}}>
{{- end}}
</div>
</main>
{{template "foot" .}}
