{{template "head" .}}
<main>
<h1>{{.Heading}}</h1>
<p class="lead">{{.Lead}}</p>
<p>{{.Intro}}</p>
<h2 id="songs">{{.Songs}}</h2>
<ul class="cards" aria-labelledby="songs">
{{- range .Cards}}
<li>
<a class="card" href="{{$.Root}}{{.Slug}}/">
<img src="/pages/{{.Thumb.Name}}" width="{{.Thumb.Width}}" height="{{.Thumb.Height}}" alt="{{.Thumb.Alt}}" loading="lazy">
<span class="card-title">{{.Title}}</span>
<span class="card-artist">{{.Artist}}</span>
</a>
<p class="card-meta">{{.Pages}} · <a href="/pdf/{{.Slug}}.pdf" download aria-label="{{.PDFLabel}}">{{$.PDF}}</a></p>
</li>
{{- end}}
</ul>
<p class="updated">{{.Updated}}</p>
<p class="credits">{{.Credits}}</p>
</main>
{{template "foot" .}}
