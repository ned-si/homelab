            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "container": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "pod": true,
                  "service": true,
                  "uid": true
                },
                "renameByName": {
                  "Value": "hours since base backup"
                }
              }
            }
          ],
          "id": 10,
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 12,
            "y": 25
          }
        },
        {
          "type": "table",
          "title": "Postgres: minutes since the last archived WAL",
          "description": "pg_stat_archiver of each instance. archive_timeout is 5 minutes, so an idle database stays under about 5.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sort_desc(max by (namespace, pod) (cnpg_pg_stat_archiver_seconds_since_last_archival) / 60)",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "color-background"
                }
              },
              "unit": "m",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 15
                  },
                  {
                    "color": "red",
                    "value": 60
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "container": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "pod": true,
                  "service": true,
                  "uid": true
                },
                "renameByName": {
                  "Value": "minutes since archive"
                }
              }
            }
          ],
          "id": 11,
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 12,
            "y": 30
          }
        },
        {
          "id": 12,
          "type": "row",
          "title": "History",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 35
          },
          "panels": []
        },
        {
          "type": "state-timeline",
          "title": "Restore test results over time",
          "description": "1 success, 0 failure, per check and target, as last pushed.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (check, target) (backup_verify_success)",
              "refId": "A",
              "legendFormat": "{{check}}/{{target}}",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "showValue": "never",
            "mergeValues": true,
            "rowHeight": 0.9,
            "legend": {
              "showLegend": false,
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "id": 13,
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 36
          }
        },
        {
          "id": 18,
          "type": "row",
          "title": "Backup freshness SLO (fresh 99% of 30 days)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 48
          },
          "panels": []
        },
        {
          "type": "bargauge",
          "title": "Fresh, share of 30 days",
          "description": "slo:backup_freshness:ratio_rate30d per target: the share of 30 days with a successful backup younger than 26 h. Red below the 99% objective (docs/backups.md, Freshness).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "slo:backup_freshness:ratio_rate30d",
              "refId": "A",
              "legendFormat": "{{kind}} {{namespace}}/{{target}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 19,
          "gridPos": {
            "h": 12,
            "w": 12,
            "x": 0,
            "y": 49
          }
        },
        {
          "type": "stat",
          "title": "Fresh now",
          "description": "slo:backup_fresh per target: FRESH when the last successful backup is younger than 26 h. A stale restic target pages BackupNotFresh.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "slo:backup_fresh",
              "refId": "A",
              "legendFormat": "{{kind}} {{namespace}}/{{target}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "STALE",
                      "color": "red"
                    },
                    "1": {
                      "text": "FRESH",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "orientation": "horizontal"
          },
          "id": 20,
          "gridPos": {
            "h": 12,
            "w": 12,
            "x": 12,
            "y": 49
          }
        }
      ]
    }
kind: ConfigMap
metadata:
  labels:
