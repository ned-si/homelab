        {
          "type": "table",
          "title": "Images with Critical or High CVEs",
          "description": "One row per image and severity. The CVE ids are in the VulnerabilityReport: kubectl get vulnerabilityreports -A -o wide.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
