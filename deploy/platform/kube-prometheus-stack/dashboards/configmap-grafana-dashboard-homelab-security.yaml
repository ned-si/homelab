        {
          "type": "text",
          "title": "Data sources this dashboard does not have",
          "options": {
            "mode": "markdown",
            "content": "- **Keycloak failed logins**: Keycloak runs with `KC_METRICS_ENABLED=true` but without event metrics (`KC_EVENT_METRICS_USER_ENABLED`) and nothing scrapes its management port (9000).\n- **Auth errors at the Gateway**: Cilium's Envoy and Hubble HTTP metrics are not enabled or scraped, so per-route 401/403/5xx rates are not in Prometheus.\n\nSee docs/observability.md for what each needs."
          },
          "id": 12,
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 45
          }
        }
