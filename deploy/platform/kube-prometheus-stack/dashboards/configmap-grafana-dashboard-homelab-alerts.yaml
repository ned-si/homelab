              }
            }
          ],
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 0,
            "y": 39
          }
        },
        {
          "type": "table",
          "id": 11,
          "title": "INFO alerts, last 7 days",
          "description": "Each INFO alert that fired in the last 7 days, by namespace, with the last time it was firing.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sort_desc(max by (alertname, namespace, severity) (max_over_time(timestamp(alerts:active_since:timestamp_seconds{class=\"info\", alertstate=\"firing\"})[7d:5m])) * 1000)",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": true
