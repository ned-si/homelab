          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            },
            "sortBy": [
              {
                "displayName": "Last firing",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "Value": 0,
                  "alertname": 1,
                  "namespace": 2,
                  "severity": 3
                },
                "renameByName": {
                  "Value": "Last firing",
                  "alertname": "Alert",
                  "namespace": "Namespace",
                  "severity": "Severity"
                }
              }
            }
          ],
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 12,
            "y": 39
          }
