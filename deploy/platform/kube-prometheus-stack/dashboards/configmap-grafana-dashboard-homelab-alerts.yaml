            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 30
          }
        },
        {
          "type": "row",
          "id": 12,
          "title": "Recent INFO events",
          "collapsed": false,
          "panels": [],
