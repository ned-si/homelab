apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: kube-prometheus-stack
  name: homelab-arr
  namespace: monitoring
spec:
  groups:
  - name: homelab.arr
    rules:
    - alert: ArrIndexersFailing
      annotations:
        description: 'Prowlarr reports indexers that have failed for more than 6 hours
          or have no definition any more: usually an expired login or cookie, or a
          site that is gone. Prowlarr -> System -> Status names them; update the credentials,
          or disable or remove the indexer (docs/theater.md "Indexers").'
