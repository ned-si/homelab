                ]
              }
            ]
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "type": "table",
          "title": "Volume fullness (%)",
          "description": "From the kubelet, the only source that knows fullness. Listed only while mounted. iscsi allows expansion.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 10,
