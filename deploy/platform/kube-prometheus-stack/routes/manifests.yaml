                    "value": {
                      "type": "color-background"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "type": "table",
          "title": "Backup CronJobs: hours since last scheduled",
          "description": "Shows 'not running', not 'failing'. Over 36h on a daily job = no Job created. Weekly verify jobs reach 168h.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
