kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: grafana-dashboard-data-protection
  namespace: monitoring
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-backup
  namespace: monitoring
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana-backup
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: kube-prometheus-stack
                    app.kubernetes.io/name: grafana
                topologyKey: kubernetes.io/hostname
          containers:
          - args:
            - |
              # `init` is idempotent-by-failure: it errors if the repo
              # already exists, which is the normal case after run one.
              restic init 2>/dev/null || true

              # TWO SEPARATE SNAPSHOTS, with different tags, so a restore
              # knows what it is getting rather than having to guess.
              #
              # 1. `grafana-config` -- provisioning directories and plugins.
              #    Plain files, not written while Grafana serves requests,
              #    so this copy is CONSISTENT.
              #
              # 2. `grafana-db-besteffort` -- the live SQLite. Possibly
              #    torn. The tag says so, and it says so in the snapshot
              #    listing, which is where someone will be reading it at
              #    3am during a restore.
              #
              # Splitting them matters: a single snapshot containing both
              # would inherit the weaker guarantee for all of it.
              restic backup /data \
                --tag grafana-config \
                --host grafana \
                --exclude '/data/grafana.db' \
                --exclude '/data/grafana.db-wal' \
                --exclude '/data/grafana.db-shm' \
                --exclude '/data/png' \
                --exclude '/data/csv' \
                --exclude '/data/pdf' \
                --verbose

              # The `-wal` and `-shm` files are included here deliberately.
              # If they exist, SQLite needs them to recover the database to
              # a consistent state on open -- taking the .db alone would
              # discard committed transactions. It still does not make the
              # set atomic (three files copied in sequence), which is
              # exactly why the tag says best-effort.
              # Build the file list from what EXISTS rather than passing all
              # three and swallowing the error.
              #
              # The previous version ended with
              #   || echo "NOTE: -wal/-shm absent (normal ...)"
              # which made the job report success for ANY failure of this
              # command -- a full cache volume, an expired credential, a
              # corrupt repository -- while printing a reassuring message
              # about journal modes. An absent -wal is normal; a failed
              # upload is not, and the two must not share an exit path.
              DB_FILES=""
              for f in /data/grafana.db /data/grafana.db-wal /data/grafana.db-shm; do
                [ -f "$f" ] && DB_FILES="$DB_FILES $f"
              done

              if [ -z "$DB_FILES" ]; then
                echo "FAIL: /data/grafana.db does not exist. Grafana has never"
                echo "      started, or the volume is not mounted where expected."
                exit 1
              fi

              echo "database snapshot covers:$DB_FILES"
              # Unquoted on purpose: word-splitting is how the list becomes
              # separate arguments. The paths are literals above, so there is
              # nothing to split badly.
              restic backup $DB_FILES \
                --tag grafana-db-besteffort \
                --host grafana \
                --verbose

              restic forget \
                --host grafana \
                --keep-daily 7 --keep-weekly 4 --keep-monthly 6 \
                --prune

              restic check --with-cache
            command:
            - /bin/sh
            - -euo
            - pipefail
            - -c
            env:
            - name: RESTIC_REPOSITORY
              value: s3:https://s3.eu-central-1.amazonaws.com/homelab-backups-REPLACE-ME/grafana/data
            - name: RESTIC_CACHE_DIR
              value: /cache
            - name: TMPDIR
              value: /cache
            envFrom:
            - secretRef:
                name: s3-backup
            image: restic/restic:0.19.0
            imagePullPolicy: IfNotPresent
            name: restic
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /data
              name: data
              readOnly: true
            - mountPath: /cache
              name: cache
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 472
            runAsGroup: 472
            runAsNonRoot: true
            runAsUser: 472
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: kube-prometheus-stack-grafana
              readOnly: true
          - emptyDir:
              sizeLimit: 1Gi
            name: cache
  schedule: 20 4 * * *
  successfulJobsHistoryLimit: 3
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  hostnames:
  - grafana.lilalala.com
  parentRefs:
  - name: shared
    namespace: gateway
    sectionName: https
  rules:
  - backendRefs:
    - name: kube-prometheus-stack-grafana
      port: 80
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: kube-prometheus-stack
  name: homelab-cluster
  namespace: monitoring
spec:
  groups:
  - name: homelab.workload.rules
    rules:
    - alert: PodStuckNotRunning
      annotations:
        description: Container {{ $labels.container }} has been unable to start for
          15 minutes on node {{ $labels.node }}. Read `state`, not `lastState` --
          see docs/migration-plan.md, the cilium-mgr9z diagnosis, where the log pointed
          at the network and the cause was a stale containerd name reservation.
        summary: '{{ $labels.namespace }}/{{ $labels.pod }} stuck in {{ $labels.reason
          }}'
      expr: |
        max by (namespace, pod, container, reason, node) (
          kube_pod_container_status_waiting_reason{
            reason=~"CreateContainerError|CreateContainerConfigError|ErrImagePull|ImagePullBackOff|InvalidImageName"
          }
          * on (namespace, pod) group_left (node) kube_pod_info
        ) > 0
      for: 15m
      labels:
        severity: warning
    - alert: PodStuckNotRunningLongTerm
      annotations:
        summary: '{{ $labels.namespace }}/{{ $labels.pod }} has been broken for 6h
          ({{ $labels.reason }})'
      expr: |
        max by (namespace, pod, container, reason, node) (
          kube_pod_container_status_waiting_reason{
            reason=~"CreateContainerError|CreateContainerConfigError|ErrImagePull|ImagePullBackOff|InvalidImageName"
          }
          * on (namespace, pod) group_left (node) kube_pod_info
        ) > 0
      for: 6h
      labels:
        severity: critical
    - alert: PodPendingTooLong
      annotations:
        description: Usually an unschedulable pod or a ReadWriteOnce volume still
          attached elsewhere. kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod
          }} -- read the Events, not the status.
        summary: '{{ $labels.namespace }}/{{ $labels.pod }} has been Pending for 30m'
      expr: |
        max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"}) > 0
      for: 30m
      labels:
        severity: warning
    - alert: PodNotReady
      annotations:
        description: Its readiness probe has been failing for 20 minutes, so the Service
          has removed it. If this is the only replica the app is down. This is the
          signal that did not exist during the qBittorrent outage -- there was no
          probe to fail.
        summary: '{{ $labels.namespace }}/{{ $labels.pod }} is Running but not Ready'
      expr: |
        max by (namespace, pod, node) (
          kube_pod_status_ready{condition="true"}
          * on (namespace, pod) group_left (node) kube_pod_info
        ) == 0
        unless on (namespace, pod) (
          kube_pod_status_phase{phase=~"Succeeded|Failed|Pending"} == 1
        )
      for: 20m
      labels:
        severity: warning
    - alert: ServiceHasNoReadyBackend
      annotations:
        description: Nothing is serving this Deployment, so its Service has no ready
          backend. Callers see connection refused, which the *arr apps surface as
          'download client unavailable' -- a message that reads like an auth failure.
          See docs/runbooks/arr-qbittorrent.md.
        summary: '{{ $labels.namespace }}/{{ $labels.deployment }} has ZERO available
          replicas'
      expr: |
        kube_deployment_status_replicas_available == 0
        and on (namespace, deployment) (kube_deployment_spec_replicas > 0)
      for: 15m
      labels:
        severity: critical
    - alert: StatefulSetHasNoReadyReplica
      annotations:
        summary: '{{ $labels.namespace }}/{{ $labels.statefulset }} has no ready replica'
      expr: |
        kube_statefulset_status_replicas_ready == 0
        and on (namespace, statefulset) (kube_statefulset_replicas > 0)
      for: 15m
      labels:
        severity: critical
  - name: homelab.storage.rules
    rules:
    - alert: PersistentVolumeNearlyFull
      annotations:
        description: 'The `iscsi` StorageClass sets allowVolumeExpansion: true, so
          this is fixable by editing spec.resources.requests.storage on the PVC and
          letting the filesystem grow -- no data movement. Do it before it becomes
          critical: a full volume under a database is an outage, and under an iSCSI
          zvol with xfs it is not always a clean one.'
        summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is
          over 85% full
      expr: |
        (
          kubelet_volume_stats_available_bytes
          / kubelet_volume_stats_capacity_bytes
        ) < 0.15
      for: 30m
      labels:
        severity: warning
    - alert: PersistentVolumeCriticallyFull
      annotations:
        summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is
          over 95% full
      expr: |
        (
          kubelet_volume_stats_available_bytes
          / kubelet_volume_stats_capacity_bytes
        ) < 0.05
      for: 10m
      labels:
        severity: critical
    - alert: PersistentVolumeFillingUp
      annotations:
        description: Extrapolating the last 6 hours. If this is a Postgres data volume,
          check WAL archiving first -- unarchivable WAL is retained locally and fills
          the volume, and PostgresWALArchiveFailing is the cause, not this.
        summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} will
          be full within 24h
      expr: |
        (
          kubelet_volume_stats_available_bytes
          / kubelet_volume_stats_capacity_bytes
        ) < 0.6
        and
        predict_linear(kubelet_volume_stats_available_bytes[6h], 24 * 3600) < 0
      for: 1h
      labels:
        severity: warning
    - alert: PrometheusTsdbVolumeNearlyFull
      annotations:
        description: retentionSize (12GiB) is meant to keep this from happening inside
          the 15Gi volume. If it has, the WAL or a compaction is using the headroom.
          Grow the volume -- `iscsi` allows expansion -- rather than cutting retention,
          and see the comment on retentionSize in platform/kube-prometheus-stack/values.yaml.
        summary: Prometheus TSDB volume is nearly full
      expr: |
        (
          kubelet_volume_stats_available_bytes{namespace="monitoring", persistentvolumeclaim=~"prometheus-.*"}
          / kubelet_volume_stats_capacity_bytes
        ) < 0.12
      for: 15m
      labels:
        severity: critical
    - alert: NodeFilesystemNearlyFull
      annotations:
        description: On these nodes the root/eMMC filesystem holds kubelet and containerd.
          Reclaim with `crictl rmi --prune` before it stops being able to create containers.
        summary: '{{ $labels.instance }} {{ $labels.mountpoint }} is over 85% full'
      expr: |
        (
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|iso9660|nsfs|autofs"}
          / node_filesystem_size_bytes
        ) < 0.15
        and on (instance, mountpoint) (
          node_filesystem_readonly == 0
        )
      for: 30m
      labels:
        severity: warning
    - alert: NodeFilesystemCriticallyFull
      annotations:
        summary: '{{ $labels.instance }} {{ $labels.mountpoint }} is over 92% full'
      expr: |
        (
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|iso9660|nsfs|autofs"}
          / node_filesystem_size_bytes
        ) < 0.08
      for: 10m
      labels:
        severity: critical
    - alert: NodeFilesystemReadOnly
      annotations:
        description: Usually the beginning of eMMC failure, not a configuration change.
          Check dmesg on the node. Four nodes, one of which is a control plane member
          -- confirm which before rebooting anything.
        summary: '{{ $labels.instance }} remounted {{ $labels.mountpoint }} READ-ONLY'
      expr: |
        node_filesystem_readonly{fstype!~"tmpfs|ramfs|overlay|squashfs|iso9660|nsfs|autofs"} == 1
      for: 5m
      labels:
        severity: critical
    - alert: NodeFilesystemInodesNearlyFull
      annotations:
        description: This reports as ENOSPC while `df -h` shows free space. Check
          `df -i` on the node.
        summary: '{{ $labels.instance }} {{ $labels.mountpoint }} has under 10% of
          inodes free'
      expr: |
        (
          node_filesystem_files_free{fstype!~"tmpfs|ramfs|overlay|squashfs|iso9660|nsfs|autofs"}
          / node_filesystem_files
        ) < 0.10
      for: 30m
      labels:
        severity: warning
  - name: homelab.certificates.rules
    rules:
    - alert: CertificateExpiringSoon
      annotations:
        description: 'cert-manager should have renewed this at 30 days remaining,
          so a renewal has already failed silently. Check the Certificate''s conditions
          and the ClusterIssuer''s Secret reference: kubectl -n {{ $labels.namespace
          }} describe certificate {{ $labels.name }}'
        summary: Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in
          under 21 days
      expr: |
        certmanager_certificate_expiration_timestamp_seconds - time() < 21 * 24 * 3600
      for: 1h
      labels:
        severity: warning
    - alert: CertificateExpiringVerySoon
      annotations:
        description: Every published hostname is served from the wildcard certificate
          on the shared Gateway. When this expires, everything breaks at once. Let's
          Encrypt rate-limits, so do not fix it by deleting and recreating in a loop.
        summary: Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in
          under 7 days
      expr: |
        certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
      for: 1h
      labels:
        severity: critical
    - alert: CertificateNotReady
      annotations:
        description: An order or challenge is failing. A Let's Encrypt order expires
          after 7 days and then never completes, so a stuck Certificate does not recover
          on its own -- it has to be deleted and reissued.
        summary: Certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready
      expr: |
        certmanager_certificate_ready_status{condition=~"True|true"} == 0
      for: 1h
      labels:
        severity: warning
    - alert: CertManagerMetricsAbsent
      annotations:
        description: 'No certificate expiry series exists, so every certificate alert
          is inert and the next expiry will be a surprise. Check `kubectl -n cert-manager
          get servicemonitor` and that Prometheus still has serviceMonitorSelectorNilUsesHelmValues:
          false.'
        summary: cert-manager metrics are not being scraped
      expr: |
        absent(certmanager_certificate_expiration_timestamp_seconds)
      for: 1h
      labels:
        severity: critical
  - name: homelab.meta.rules
    rules:
    - alert: AlertmanagerNotificationsFailing
      annotations:
        description: Alerts are firing and not arriving. Check the credentials in
          the `alertmanager-notify` Secret and the Alertmanager pod log. If the phone
          has gone quiet, this is why.
        summary: Alertmanager cannot deliver notifications ({{ $labels.integration
          }})
      expr: |
        rate(alertmanager_notifications_failed_total[15m]) > 0
      for: 15m
      labels:
        severity: critical
    - alert: AlertmanagerHasNoReceiverConfigured
      annotations:
        description: 'The Watchdog route sends a heartbeat every 5 minutes, so this
          counter should never be flat. Either the receivers have been removed --
          the state this repo was in before the alerting work -- or Alertmanager is
          wedged. This is one of the very few places where `or absent(...)` is combined
          into a single rule rather than split: both halves mean the identical thing,
          ''nothing is being sent'', and there is one action either way.'
        summary: Alertmanager has sent nothing in 6 hours
      expr: |
        increase(alertmanager_notifications_total[6h]) == 0
        or absent(alertmanager_notifications_total)
      for: 1h
      labels:
        severity: critical
    - alert: KubeStateMetricsAbsent
      annotations:
        description: Every kube_* alert in this cluster -- pods, jobs, cronjobs, PVCs,
          deployments -- is currently inert.
        summary: kube-state-metrics is not being scraped
      expr: |
        absent(kube_pod_info)
      for: 15m
      labels:
        severity: critical
    - alert: NodeExporterAbsent
      annotations:
        description: No node disk, memory or filesystem alerting is active. The /controller
          eMMC is unmonitored while this fires.
        summary: node-exporter is not being scraped
      expr: |
        absent(node_filesystem_avail_bytes)
      for: 15m
      labels:
        severity: critical
