# Source:     platform/kube-prometheus-stack/routes
# Regenerate: task render     (scripts/render-deploy.sh)
#
# Edit the kustomization in platform/kube-prometheus-stack/routes and re-render. Editing this file
# directly will be reverted by the next render and rejected by CI.
