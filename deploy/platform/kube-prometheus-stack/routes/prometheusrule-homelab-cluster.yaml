---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: kube-prometheus-stack
  name: homelab-cluster
  namespace: monitoring
spec:
  groups:
  - name: homelab.workload.rules
    rules:
    - alert: PodStuckNotRunning
      annotations:
        description: 'Container {{ $labels.container }} has been unable to start for
          15 minutes on node {{ $labels.node }}. Read `state`, not `lastState` --
          see docs/observability.md: once the log pointed at the network and the cause
          was a stale containerd name reservation.'
        summary: '{{ $labels.namespace }}/{{ $labels.pod }} stuck in {{ $labels.reason
          }}'
      expr: |
        max by (namespace, pod, container, reason, node) (
          kube_pod_container_status_waiting_reason{
            reason=~"CreateContainerError|CreateContainerConfigError|ErrImagePull|ImagePullBackOff|InvalidImageName"
          }
          * on (namespace, pod) group_left (node) kube_pod_info
        ) > 0
      for: 15m
      labels:
        action: auto
        severity: warning
    - alert: PodStuckNotRunningLongTerm
      annotations:
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/PodStuckNotRunningLongTerm.md
        summary: '{{ $labels.namespace }}/{{ $labels.pod }} has been broken for 6h
          ({{ $labels.reason }})'
      expr: |
        max by (namespace, pod, container, reason, node) (
          kube_pod_container_status_waiting_reason{
            reason=~"CreateContainerError|CreateContainerConfigError|ErrImagePull|ImagePullBackOff|InvalidImageName"
          }
          * on (namespace, pod) group_left (node) kube_pod_info
        ) > 0
      for: 6h
      labels:
        action: human
        severity: critical
    - alert: PodPendingTooLong
      annotations:
        description: Usually an unschedulable pod or a ReadWriteOnce volume still
          attached elsewhere. kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod
          }} -- read the Events, not the status.
        summary: '{{ $labels.namespace }}/{{ $labels.pod }} has been Pending for 30m'
      expr: |
        max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"}) > 0
      for: 30m
      labels:
        action: auto
        severity: warning
    - alert: PodNotReady
      annotations:
        description: Its readiness probe has been failing for 20 minutes, so the Service
          has removed it. If this is the only replica the app is down. This is the
          signal that did not exist during the qBittorrent outage -- there was no
          probe to fail.
        summary: '{{ $labels.namespace }}/{{ $labels.pod }} is Running but not Ready'
      expr: |
        max by (namespace, pod, node) (
          kube_pod_status_ready{condition="true"}
          * on (namespace, pod) group_left (node) kube_pod_info
        ) == 0
        unless on (namespace, pod) (
          kube_pod_status_phase{phase=~"Succeeded|Failed|Pending"} == 1
        )
      for: 20m
      labels:
        action: auto
        severity: warning
    - alert: ServiceHasNoReadyBackend
      annotations:
        description: Nothing is serving this Deployment, so its Service has no ready
          backend. Callers see connection refused, which the *arr apps surface as
          'download client unavailable' -- a message that reads like an auth failure.
          See docs/runbooks/arr-qbittorrent.md.
        summary: '{{ $labels.namespace }}/{{ $labels.deployment }} has ZERO available
          replicas'
      expr: |
        kube_deployment_status_replicas_available == 0
        and on (namespace, deployment) (kube_deployment_spec_replicas > 0)
      for: 15m
      labels:
        action: auto
        severity: critical
    - alert: StatefulSetHasNoReadyReplica
      annotations:
        summary: '{{ $labels.namespace }}/{{ $labels.statefulset }} has no ready replica'
      expr: |
        kube_statefulset_status_replicas_ready == 0
        and on (namespace, statefulset) (kube_statefulset_replicas > 0)
      for: 15m
      labels:
        action: auto
        severity: critical
  - name: homelab.storage.rules
    rules:
    - alert: PersistentVolumeNearlyFull
      annotations:
        description: 'The `iscsi` StorageClass sets allowVolumeExpansion: true, so
          this is fixable by editing spec.resources.requests.storage on the PVC and
          letting the filesystem grow -- no data movement. Do it before it becomes
          critical: a full volume under a database is an outage, and under an iSCSI
          zvol with xfs it is not always a clean one.'
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/PersistentVolumeNearlyFull.md
        summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is
          over 85% full
      expr: |
        (
          kubelet_volume_stats_available_bytes
          / kubelet_volume_stats_capacity_bytes
        ) < 0.15
      for: 30m
      labels:
        action: human
        severity: warning
    - alert: PersistentVolumeCriticallyFull
      annotations:
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/PersistentVolumeCriticallyFull.md
        summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is
          over 95% full
      expr: |
        (
          kubelet_volume_stats_available_bytes
          / kubelet_volume_stats_capacity_bytes
        ) < 0.05
      for: 10m
      labels:
        action: human
        severity: critical
    - alert: PersistentVolumeFillingUp
      annotations:
        description: Extrapolating the last 6 hours. If this is a Postgres data volume,
          check WAL archiving first -- unarchivable WAL is retained locally and fills
          the volume, and CNPGWALArchivingFailing is the cause, not this.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/PersistentVolumeFillingUp.md
        summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} will
          be full within 24h
      expr: |
        (
          kubelet_volume_stats_available_bytes
          / kubelet_volume_stats_capacity_bytes
        ) < 0.6
        and
        predict_linear(kubelet_volume_stats_available_bytes[6h], 24 * 3600) < 0
      for: 1h
      labels:
        action: human
        severity: warning
    - alert: PrometheusTsdbVolumeNearlyFull
      annotations:
        description: retentionSize (20GiB) is meant to keep this from happening inside
          the 25Gi volume. If it has, the WAL or a compaction is using the headroom.
          Grow the volume -- `iscsi` allows expansion -- rather than cutting retention,
          and see the comment on retentionSize in platform/kube-prometheus-stack/values.yaml.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/PrometheusTsdbVolumeNearlyFull.md
        summary: Prometheus TSDB volume is nearly full
      expr: |
        (
          kubelet_volume_stats_available_bytes{namespace="monitoring", persistentvolumeclaim=~"prometheus-.*"}
          / kubelet_volume_stats_capacity_bytes
        ) < 0.12
      for: 15m
      labels:
        action: human
        severity: critical
    - alert: NodeFilesystemNearlyFull
      annotations:
        description: On these nodes the eMMC holds the kubelet and containerd data
          (/var). Find what holds it with `talosctl -n <ip> usage /var --depth 2`
          and remove unused images with `talosctl -n <ip> image remove` before it
          stops being able to create containers.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/NodeFilesystemNearlyFull.md
        summary: '{{ $labels.instance }} {{ $labels.mountpoint }} is over 85% full'
      expr: |
        (
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|rootfs|overlay|squashfs|iso9660|nsfs|autofs"}
          / node_filesystem_size_bytes
        ) < 0.15
        and on (instance, mountpoint) (
          node_filesystem_readonly == 0
        )
      for: 30m
      labels:
        action: human
        severity: warning
    - alert: NodeFilesystemCriticallyFull
      annotations:
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/NodeFilesystemCriticallyFull.md
        summary: '{{ $labels.instance }} {{ $labels.mountpoint }} is over 92% full'
      expr: |
        (
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|rootfs|overlay|squashfs|iso9660|nsfs|autofs"}
          / node_filesystem_size_bytes
        ) < 0.08
      for: 10m
      labels:
        action: human
        severity: critical
    - alert: NodeFilesystemReadOnly
      annotations:
        description: Usually the beginning of eMMC failure, not a configuration change.
          Check dmesg on the node. Four nodes, one of which is a control plane member
          -- confirm which before rebooting anything.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/NodeFilesystemReadOnly.md
        summary: '{{ $labels.instance }} remounted {{ $labels.mountpoint }} READ-ONLY'
      expr: |
        node_filesystem_readonly{fstype!~"tmpfs|ramfs|rootfs|overlay|squashfs|iso9660|nsfs|autofs"} == 1
      for: 5m
      labels:
        action: human
        severity: critical
    - alert: NodeFilesystemInodesNearlyFull
      annotations:
        description: This reports as ENOSPC while `df -h` shows free space. Check
          `df -i` on the node.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/NodeFilesystemInodesNearlyFull.md
        summary: '{{ $labels.instance }} {{ $labels.mountpoint }} has under 10% of
          inodes free'
      expr: |
        (
          node_filesystem_files_free{fstype!~"tmpfs|ramfs|rootfs|overlay|squashfs|iso9660|nsfs|autofs"}
          / node_filesystem_files
        ) < 0.10
      for: 30m
      labels:
        action: human
        severity: warning
    - alert: NodeEmmcWearHigh
      annotations:
        description: The eMMC reports 80% or more of its rated wear or of its reserved
          blocks used. Plan the module replacement (docs/runbooks/node-replacement.md)
          and check what writes most with the Homelab / Nodes dashboard.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/NodeEmmcWearHigh.md
        summary: '{{ $labels.instance }} eMMC {{ $labels.device }} is wearing out'
      expr: |
        max by (instance, device) (node_emmc_life_time_estimate) >= 9
        or
        max by (instance, device) (node_emmc_pre_eol_info) >= 2
      for: 1h
      labels:
        action: human
        severity: warning
    - alert: NodeEmmcEndOfLife
      annotations:
        description: The eMMC reports its rated wear exceeded or its reserved blocks
          nearly gone. Replace the module (docs/runbooks/node-replacement.md); on
          a control plane, take an etcd snapshot first (`task talos:etcd-snapshot`).
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/NodeEmmcEndOfLife.md
        summary: '{{ $labels.instance }} eMMC {{ $labels.device }} is at end of life'
      expr: |
        max by (instance, device) (node_emmc_life_time_estimate) >= 11
        or
        max by (instance, device) (node_emmc_pre_eol_info) >= 3
      for: 10m
      labels:
        action: human
        severity: critical
  - name: homelab.certificates.rules
    rules:
    - alert: CertificateExpiringSoon
      annotations:
        description: 'cert-manager should have renewed this at 30 days remaining,
          so a renewal has already failed silently. Check the Certificate''s conditions
          and the ClusterIssuer''s Secret reference: kubectl -n {{ $labels.namespace
          }} describe certificate {{ $labels.name }}'
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/CertificateExpiringSoon.md
        summary: Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in
          under 21 days
      expr: |
        certmanager_certificate_expiration_timestamp_seconds - time() < 21 * 24 * 3600
      for: 1h
      labels:
        action: human
        severity: warning
    - alert: CertificateExpiringVerySoon
      annotations:
        description: Every published hostname is served from the wildcard certificate
          on the shared Gateway. When this expires, everything breaks at once. Let's
          Encrypt rate-limits, so do not fix it by deleting and recreating in a loop.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/CertificateExpiringVerySoon.md
        summary: Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in
          under 7 days
      expr: |
        certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
      for: 1h
      labels:
        action: human
        severity: critical
    - alert: CertificateNotReady
      annotations:
        description: An order or challenge is failing. A Let's Encrypt order expires
          after 7 days and then never completes, so a stuck Certificate does not recover
          on its own -- it has to be deleted and reissued.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/CertificateNotReady.md
        summary: Certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready
      expr: |
        certmanager_certificate_ready_status{condition=~"True|true"} == 0
      for: 1h
      labels:
        action: human
        severity: warning
    - alert: CertManagerMetricsAbsent
      annotations:
        description: No certificate expiry series exists, so every certificate alert
          is inert and the next expiry will be a surprise. Check `kubectl -n cert-manager
          get servicemonitor --show-labels` for release=kube-prometheus-stack, and
          the target in Prometheus.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/CertManagerMetricsAbsent.md
        summary: cert-manager metrics are not being scraped
      expr: |
        absent(certmanager_certificate_expiration_timestamp_seconds)
      for: 1h
      labels:
        action: human
        severity: critical
  - name: homelab.meta.rules
    rules:
    - alert: AlertmanagerNotificationsFailing
      annotations:
        description: Alerts are firing and not arriving. Check the credentials in
          the `alertmanager-notify` Secret and the Alertmanager pod log. If the phone
          has gone quiet, this is why.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/AlertmanagerNotificationsFailing.md
        summary: Alertmanager cannot deliver notifications ({{ $labels.integration
          }})
      expr: |
        rate(alertmanager_notifications_failed_total[15m]) > 0
      for: 15m
      labels:
        action: human
        severity: critical
    - alert: AlertmanagerHasNoReceiverConfigured
      annotations:
        description: 'The Watchdog route sends a heartbeat every 5 minutes, so this
          counter should never be flat. Either the receivers have been removed --
          the state this repo was in before the alerting work -- or Alertmanager is
          wedged. This is one of the very few places where `or absent(...)` is combined
          into a single rule rather than split: both halves mean the identical thing,
          ''nothing is being sent'', and there is one action either way.'
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/AlertmanagerHasNoReceiverConfigured.md
        summary: Alertmanager has sent nothing in 6 hours
      expr: |
        sum(increase(alertmanager_notifications_total[6h])) == 0
        or absent(alertmanager_notifications_total)
      for: 1h
      labels:
        action: human
        severity: critical
    - alert: KubeStateMetricsAbsent
      annotations:
        description: Every kube_* alert in this cluster -- pods, jobs, cronjobs, PVCs,
          deployments -- is currently inert.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/KubeStateMetricsAbsent.md
        summary: kube-state-metrics is not being scraped
      expr: |
        absent(kube_pod_info)
      for: 15m
      labels:
        action: human
        severity: critical
    - alert: NodeExporterAbsent
      annotations:
        description: No node disk, memory or filesystem alerting is active. The /controller
          eMMC is unmonitored while this fires.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/NodeExporterAbsent.md
        summary: node-exporter is not being scraped
      expr: |
        absent(node_filesystem_avail_bytes)
      for: 15m
      labels:
        action: human
        severity: critical
