---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: kube-prometheus-stack
  name: homelab-kyverno
  namespace: monitoring
spec:
  groups:
  - name: homelab.kyverno
    rules:
    - alert: KyvernoReportsStale
      annotations:
        description: The PolicyReports, the Security dashboard counts and the Deny-readiness
          they show are stale. Check the kyverno-reports-controller pod.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/KyvernoReportsStale.md
        summary: Kyverno has not run a background scan for 3 hours
      expr: |
        sum(increase(kyverno_controller_reconcile_total{controller_name="background-scan-controller"}[3h])) == 0
        or
        absent(kyverno_controller_reconcile_total{controller_name="background-scan-controller"})
      for: 15m
      labels:
        action: human
        severity: warning
    - alert: PodSecurityEnforceDenied
      annotations:
        description: A controller or an operator keeps creating Pods that a namespace's
          enforce level rejects. Find the namespace from the FailedCreate events,
          then run the Pod Security break-glass.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/PodSecurityEnforceDenied.md
        summary: Pod Security admission rejected {{ $value | printf "%.0f" }} Pods
          in 30 minutes
      expr: |
        sum(increase(pod_security_evaluations_total{decision="deny",mode="enforce",resource="pod"}[30m])) > 5
      labels:
        action: human
        severity: critical
    - alert: KyvernoDenied
      annotations:
        description: A controller or an operator keeps creating objects that a Kyverno
          policy in Deny rejects. Find the object from the FailedCreate events, then
          run the Kyverno break-glass.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/KyvernoDenied.md
        summary: Kyverno policy {{ $labels.name }} rejected {{ $value | printf "%.0f"
          }} requests in 30 minutes
      expr: |
        sum by (name) (increase(apiserver_admission_webhook_rejection_count{name=~"vpol\\.validate\\.kyverno\\.svc.*",error_type="no_error"}[30m])) > 5
      labels:
        action: human
        severity: critical
