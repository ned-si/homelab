---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: kube-prometheus-stack
  name: homelab-slo
  namespace: monitoring
spec:
  groups:
  - interval: 30s
    name: homelab.slo.sli
    rules:
    - expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|syncthing"}[5m]))
      record: slo:probe_error:ratio_rate5m
    - expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|syncthing"}[30m]))
      record: slo:probe_error:ratio_rate30m
    - expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|syncthing"}[1h]))
      record: slo:probe_error:ratio_rate1h
    - expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|syncthing"}[2h]))
      record: slo:probe_error:ratio_rate2h
    - expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|syncthing"}[6h]))
      record: slo:probe_error:ratio_rate6h
  - interval: 2m
    name: homelab.slo.sli-long
    rules:
    - expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|syncthing"}[1d]))
      record: slo:probe_error:ratio_rate1d
    - expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|syncthing"}[3d]))
      record: slo:probe_error:ratio_rate3d
    - expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|syncthing"}[30d]))
      record: slo:probe_error:ratio_rate30d
    - expr: 1 - slo:probe_error:ratio_rate30d
      record: slo:availability:ratio_rate30d
    - expr: 1 - slo:probe_error:ratio_rate30d / 0.005
      record: slo:error_budget_remaining:ratio_rate30d
    - expr: |
        clamp_max(
          avg by (app) (
            count_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|syncthing"}[30d])
          ) / (30 * 2880),
          1
        )
      record: slo:sli_coverage:ratio_rate30d
  - name: homelab.slo.apps
    rules:
    - expr: vector(1)
      labels:
        app: auth
        namespace: keycloak
      record: slo:app:info
    - expr: vector(1)
      labels:
        app: cinema
        namespace: theater
      record: slo:app:info
    - expr: vector(1)
      labels:
        app: theater
        namespace: theater
      record: slo:app:info
    - expr: vector(1)
      labels:
        app: media
        namespace: immich
      record: slo:app:info
    - expr: vector(1)
      labels:
        app: archive
        namespace: paperless
      record: slo:app:info
    - expr: vector(1)
      labels:
        app: cook
        namespace: mealie
      record: slo:app:info
    - expr: vector(1)
      labels:
        app: syncthing
        namespace: syncthing
      record: slo:app:info
  - name: homelab.slo.alerts
    rules:
    - alert: SLOErrorBudgetBurnFast
      annotations:
        description: At this rate the 99.5% availability budget of {{ $labels.app
          }} is gone within days. Check https://{{ $labels.app }}.lilalala.com, then
          the Homelab overview dashboard (probe status and duration).
        summary: '{{ $labels.app }} is burning its 30-day error budget fast'
      expr: |
        (
          (
            slo:probe_error:ratio_rate1h > (14.4 * 0.005)
            and
            slo:probe_error:ratio_rate5m > (14.4 * 0.005)
          )
          or
          (
            slo:probe_error:ratio_rate6h > (6 * 0.005)
            and
            slo:probe_error:ratio_rate30m > (6 * 0.005)
          )
        )
        * on (app) group_left (namespace) slo:app:info
      for: 2m
      labels:
        action: auto
        severity: critical
    - alert: SLOErrorBudgetBurnSlow
      annotations:
        description: '{{ $labels.app }} fails more probes than its 99.5% objective
          allows, over a day or more. Usually intermittent: look for restarts, slow
          responses (probe_duration_seconds) or a flapping node.'
        summary: '{{ $labels.app }} is slowly burning its 30-day error budget'
      expr: |
        (
          (
            slo:probe_error:ratio_rate1d > (3 * 0.005)
            and
            slo:probe_error:ratio_rate2h > (3 * 0.005)
          )
          or
          (
            slo:probe_error:ratio_rate3d > 0.005
            and
            slo:probe_error:ratio_rate6h > 0.005
          )
        )
        * on (app) group_left (namespace) slo:app:info
        unless on (app) max_over_time(ALERTS{alertname="SLOErrorBudgetBurnFast", alertstate="firing"}[1d])
      for: 15m
      labels:
        action: auto
        severity: warning
    - alert: SLOErrorBudgetBurnFastPersistent
      annotations:
        description: The public probes of {{ $labels.app }} have failed for half an
          hour and nothing automatic has fixed it. Check https://{{ $labels.app }}.lilalala.com,
          the Homelab overview dashboard, and the Homelab / Automation dashboard for
          a rollback that was refused or failed.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOErrorBudgetBurnFastPersistent.md
        summary: '{{ $labels.app }} has been failing for 30 minutes'
      expr: |
        (
          slo:probe_error:ratio_rate1h > (14.4 * 0.005)
          and
          slo:probe_error:ratio_rate5m > (14.4 * 0.005)
        )
        * on (app) group_left (namespace) slo:app:info
      for: 30m
      labels:
        action: human
        severity: critical
    - alert: SLOErrorBudgetBurnSlowPersistent
      annotations:
        description: 'SLOErrorBudgetBurnSlow has fired for {{ $labels.app }} for 24
          hours: an intermittent fault that does not go away on its own. Look for
          restarts, slow responses (probe_duration_seconds) or a flapping node.'
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOErrorBudgetBurnSlowPersistent.md
        summary: '{{ $labels.app }} has been burning its error budget for a day'
      expr: max by (app, namespace) (ALERTS{alertname="SLOErrorBudgetBurnSlow", alertstate="firing"})
      for: 1d
      labels:
        action: human
        severity: warning
    - alert: SLOProbesAbsent
      annotations:
        description: Check the blackbox-exporter Application and the Probes in platform/blackbox-exporter/probes.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOProbesAbsent.md
        summary: 'No public blackbox probe results: the SLO alerts are blind'
      expr: absent(probe_success{job="blackbox-public"})
      for: 15m
      labels:
        action: human
        severity: warning
  - name: homelab.slo.targets
    rules:
    - alert: SLOTargetProbeAbsent
      annotations:
        description: The {{ $labels.app }} target is missing from the Probes in platform/blackbox-exporter/probes,
          or its `app` relabeling no longer matches.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOTargetProbeAbsent.md
        summary: 'No probe results for {{ $labels.app }}: its SLO alerts are blind'
      expr: absent(probe_success{job="blackbox-public", app="auth"}) unless on() absent(probe_success{job="blackbox-public"})
      for: 15m
      labels:
        action: human
        app: auth
        severity: warning
    - alert: SLOTargetProbeAbsent
      annotations:
        description: The {{ $labels.app }} target is missing from the Probes in platform/blackbox-exporter/probes,
          or its `app` relabeling no longer matches.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOTargetProbeAbsent.md
        summary: 'No probe results for {{ $labels.app }}: its SLO alerts are blind'
      expr: absent(probe_success{job="blackbox-public", app="cinema"}) unless on()
        absent(probe_success{job="blackbox-public"})
      for: 15m
      labels:
        action: human
        app: cinema
        severity: warning
    - alert: SLOTargetProbeAbsent
      annotations:
        description: The {{ $labels.app }} target is missing from the Probes in platform/blackbox-exporter/probes,
          or its `app` relabeling no longer matches.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOTargetProbeAbsent.md
        summary: 'No probe results for {{ $labels.app }}: its SLO alerts are blind'
      expr: absent(probe_success{job="blackbox-public", app="theater"}) unless on()
        absent(probe_success{job="blackbox-public"})
      for: 15m
      labels:
        action: human
        app: theater
        severity: warning
    - alert: SLOTargetProbeAbsent
      annotations:
        description: The {{ $labels.app }} target is missing from the Probes in platform/blackbox-exporter/probes,
          or its `app` relabeling no longer matches.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOTargetProbeAbsent.md
        summary: 'No probe results for {{ $labels.app }}: its SLO alerts are blind'
      expr: absent(probe_success{job="blackbox-public", app="media"}) unless on()
        absent(probe_success{job="blackbox-public"})
      for: 15m
      labels:
        action: human
        app: media
        severity: warning
    - alert: SLOTargetProbeAbsent
      annotations:
        description: The {{ $labels.app }} target is missing from the Probes in platform/blackbox-exporter/probes,
          or its `app` relabeling no longer matches.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOTargetProbeAbsent.md
        summary: 'No probe results for {{ $labels.app }}: its SLO alerts are blind'
      expr: absent(probe_success{job="blackbox-public", app="archive"}) unless on()
        absent(probe_success{job="blackbox-public"})
      for: 15m
      labels:
        action: human
        app: archive
        severity: warning
    - alert: SLOTargetProbeAbsent
      annotations:
        description: The {{ $labels.app }} target is missing from the Probes in platform/blackbox-exporter/probes,
          or its `app` relabeling no longer matches.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOTargetProbeAbsent.md
        summary: 'No probe results for {{ $labels.app }}: its SLO alerts are blind'
      expr: absent(probe_success{job="blackbox-public", app="cook"}) unless on() absent(probe_success{job="blackbox-public"})
      for: 15m
      labels:
        action: human
        app: cook
        severity: warning
    - alert: SLOTargetProbeAbsent
      annotations:
        description: The {{ $labels.app }} target is missing from the Probes in platform/blackbox-exporter/probes,
          or its `app` relabeling no longer matches.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOTargetProbeAbsent.md
        summary: 'No probe results for {{ $labels.app }}: its SLO alerts are blind'
      expr: absent(probe_success{job="blackbox-public", app="syncthing"}) unless on()
        absent(probe_success{job="blackbox-public"})
      for: 15m
      labels:
        action: human
        app: syncthing
        severity: warning
  - name: homelab.slo.latency-thresholds
    rules:
    - expr: vector(0.25)
      labels:
        app: auth
      record: slo:latency_threshold_seconds
    - expr: vector(0.25)
      labels:
        app: cinema
      record: slo:latency_threshold_seconds
    - expr: vector(0.25)
      labels:
        app: theater
      record: slo:latency_threshold_seconds
    - expr: vector(0.25)
      labels:
        app: media
      record: slo:latency_threshold_seconds
    - expr: vector(0.25)
      labels:
        app: archive
      record: slo:latency_threshold_seconds
    - expr: vector(0.25)
      labels:
        app: cook
      record: slo:latency_threshold_seconds
    - expr: vector(0.25)
      labels:
        app: syncthing
      record: slo:latency_threshold_seconds
  - interval: 30s
    name: homelab.slo.latency
    rules:
    - expr: |
        probe_success{job="blackbox-public"}
        * (
          probe_duration_seconds{job="blackbox-public"}
          <= bool on (app) group_left () slo:latency_threshold_seconds
        )
      record: slo:probe_fast
    - expr: 1 - avg by (app) (avg_over_time(slo:probe_fast[2h]))
      record: slo:probe_slow:ratio_rate2h
    - expr: 1 - avg by (app) (avg_over_time(slo:probe_fast[6h]))
      record: slo:probe_slow:ratio_rate6h
  - interval: 2m
    name: homelab.slo.latency-long
    rules:
    - expr: 1 - avg by (app) (avg_over_time(slo:probe_fast[1d]))
      record: slo:probe_slow:ratio_rate1d
    - expr: 1 - avg by (app) (avg_over_time(slo:probe_fast[3d]))
      record: slo:probe_slow:ratio_rate3d
    - expr: 1 - avg by (app) (avg_over_time(slo:probe_fast[30d]))
      record: slo:probe_slow:ratio_rate30d
    - expr: 1 - slo:probe_slow:ratio_rate30d
      record: slo:latency:ratio_rate30d
    - expr: 1 - slo:probe_slow:ratio_rate30d / 0.01
      record: slo:latency_budget_remaining:ratio_rate30d
  - name: homelab.slo.latency-alerts
    rules:
    - alert: SLOLatencyBudgetBurnSlow
      annotations:
        description: More than 1% of the probes of {{ $labels.app }} answer slower
          than its threshold (slo:latency_threshold_seconds), over a day or more,
          while the app is up. Look at probe_duration_seconds on the Homelab overview
          dashboard.
        summary: '{{ $labels.app }} is slowly burning its 30-day latency budget'
      expr: |
        (
          (
            slo:probe_slow:ratio_rate1d > (3 * 0.01)
            and
            slo:probe_slow:ratio_rate2h > (3 * 0.01)
          )
          or
          (
            slo:probe_slow:ratio_rate3d > 0.01
            and
            slo:probe_slow:ratio_rate6h > 0.01
          )
        )
        * on (app) group_left (namespace) slo:app:info
        unless on (app) ALERTS{alertname="SLOErrorBudgetBurnSlow"}
        unless on (app) max_over_time(ALERTS{alertname="SLOErrorBudgetBurnFast"}[1d])
      for: 15m
      labels:
        action: auto
        severity: warning
    - alert: SLOLatencyBudgetBurnSlowPersistent
      annotations:
        description: 'SLOLatencyBudgetBurnSlow has fired for {{ $labels.app }} for
          24 hours: responses stay slower than its threshold and nothing automatic
          has fixed it.'
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOLatencyBudgetBurnSlowPersistent.md
        summary: '{{ $labels.app }} has been slow for a day'
      expr: max by (app, namespace) (ALERTS{alertname="SLOLatencyBudgetBurnSlow",
        alertstate="firing"})
      for: 1d
      labels:
        action: human
        severity: warning
