---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: kube-prometheus-stack
  name: homelab-argocd
  namespace: monitoring
spec:
  groups:
  - name: homelab.argocd
    rules:
    - alert: ArgoCDAppDegraded
      annotations:
        description: Argo CD reports the Application {{ $labels.name }} as Degraded
          for 5 minutes. If the newest merge deployed it, auto-rollback opens a revert
          pull request. Check https://argo.lilalala.com/applications/argo/{{ $labels.name
          }}.
        summary: '{{ $labels.name }} is Degraded'
      expr: |
        max by (name, namespace) (
          label_replace(argocd_app_info{health_status="Degraded"}, "namespace", "$1", "dest_namespace", "(.*)")
        ) == 1
      for: 5m
      labels:
        action: auto
        severity: critical
    - alert: ArgoCDSyncFailed
      annotations:
        description: A sync of {{ $labels.name }} ended Failed or Error in the last
          10 minutes. Check https://argo.lilalala.com/applications/argo/{{ $labels.name
          }}.
        summary: '{{ $labels.name }}: sync failed'
      expr: |
        (
          (sum by (name) (increase(argocd_app_sync_total{phase=~"Error|Failed"}[10m])) > 0)
          or
          (
            sum by (name) (
              argocd_app_sync_total{phase=~"Error|Failed"}
              unless argocd_app_sync_total{phase=~"Error|Failed"} offset 10m
            ) > 0
            and on (name) max by (name) (argocd_app_info offset 10m)
          )
        )
        * on (name) group_left (namespace)
        max by (name, namespace) (
          label_replace(argocd_app_info, "namespace", "$1", "dest_namespace", "(.*)")
        )
      labels:
        action: auto
        severity: warning
    - alert: ArgoCDAppOutOfSync
      annotations:
        description: 'The live state of {{ $labels.name }} differs from git and self-heal
          has not closed the gap in 30 minutes: a stuck sync, a field another controller
          rewrites, or a resource Argo CD cannot apply. Check the diff in https://argo.lilalala.com/applications/argo/{{
          $labels.name }}.'
        summary: '{{ $labels.name }} is OutOfSync for 30 minutes'
      expr: |
        max by (name, namespace) (
          label_replace(argocd_app_info{sync_status="OutOfSync"}, "namespace", "$1", "dest_namespace", "(.*)")
        ) == 1
      for: 30m
      labels:
        action: auto
        severity: warning
    - alert: ArgoCDAppStillDegraded
      annotations:
        description: 'Nothing automatic has fixed {{ $labels.name }}: check the auto-rollback
          run on the Homelab / Automation dashboard, then https://argo.lilalala.com/applications/argo/{{
          $labels.name }}.'
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/ArgoCDAppStillDegraded.md
        summary: '{{ $labels.name }} has been Degraded for 30 minutes'
      expr: |
        max by (name, namespace) (
          label_replace(argocd_app_info{health_status="Degraded"}, "namespace", "$1", "dest_namespace", "(.*)")
        ) == 1
      for: 30m
      labels:
        action: human
        severity: critical
    - alert: ArgoCDSyncStuck
      annotations:
        description: 'A sync of {{ $labels.name }} failed and nothing automatic has
          replaced it: the cluster still runs the previous revision. Check the auto-rollback
          run on the Homelab / Automation dashboard, then https://argo.lilalala.com/applications/argo/{{
          $labels.name }}.'
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/ArgoCDSyncStuck.md
        summary: '{{ $labels.name }}: sync failed and still OutOfSync after 30 minutes'
      expr: |
        max by (name, namespace) (
          label_replace(argocd_app_info{sync_status="OutOfSync"}, "namespace", "$1", "dest_namespace", "(.*)")
        ) == 1
        and on (name)
        max by (name) (max_over_time(ALERTS{alertname="ArgoCDSyncFailed", alertstate="firing"}[6h]))
      for: 30m
      labels:
        action: human
        severity: warning
    - alert: ArgoCDMetricsAbsent
      annotations:
        description: Prometheus has no argocd_app_info for 15 minutes, so no Argo
          CD alert can fire. Check the ServiceMonitor argo/argocd-application-controller
          (label release) and the application controller pod.
        runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/ArgoCDMetricsAbsent.md
        summary: Argo CD application metrics are missing
      expr: absent(argocd_app_info)
      for: 15m
      labels:
        action: human
        severity: warning
