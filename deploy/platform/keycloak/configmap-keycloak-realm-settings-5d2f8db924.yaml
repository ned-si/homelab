---
apiVersion: v1
data:
  access.conf: |
    # Who may log in to each app client of the `homelab` realm, applied by
    # apply.sh after clients.conf. One `<clientId>=<groups>` per line, groups
    # space-separated.
    #
    # For each client, apply.sh creates the client role `access`, maps exactly
    # the listed groups to it (creating missing groups), and binds the client to
    # its own browser and direct-grant flows: the `browser-loa` login (or the
    # password grant) followed by "Condition - user role" (not `<clientId>.access`)
    # and "Deny access". The check runs after the cookie, so an SSO session for
    # one app does not open another. Clients not listed here keep the realm flows.
    #
    # Users and their group membership stay in the admin console: a new user gets
    # no app until they are added to a group.
    #   family  household and relatives: the user apps
    #   media   friends: photos and books
    #   admins  the operator: every app

    argocd=admins ArgoCDAdmins
    grafana-oauth=admins
    theater-sso=admins TheaterAdmins
    headlamp=admins
    hubble=admins
    home-assistant=admins HomeAssistantAdmins family
    immich=admins family media
    audiobookshelf=admins family media
    calibre-web=admins family media
    mealie=admins family
    paperless=admins family
  apply.sh: |
    #!/bin/bash
    # Apply sessions.conf, platform.conf, clients.conf and access.conf to the
    # `homelab` realm, then read the realm back and fail unless every managed
    # value is the expected one. CHECK_ONLY=1 runs the static checks of the files
    # and exits.
    #
    # Runs in the Keycloak image (kcadm.sh, bash, grep, sed; no awk, jq or curl).
    # `kcadm.sh update -s` fetches an object, changes only the given fields and
    # writes it back, so nothing outside the two files is touched.
    set -euo pipefail
    # Values such as a `*` redirect URI must never expand to file names.
    set -f

    KCADM=${KCADM:-/opt/keycloak/bin/kcadm.sh}
    CFG=/tmp/kcadm.config
    SERVER=${KEYCLOAK_URL:-http://keycloak.keycloak.svc.cluster.local:8080}
    REALM=${REALM:-homelab}
    CONF=${CONF:-/realm/sessions.conf}
    PLATFORM_CONF=${PLATFORM_CONF:-/realm/platform.conf}
    CLIENTS_CONF=${CLIENTS_CONF:-/realm/clients.conf}
    ACCESS_CONF=${ACCESS_CONF:-/realm/access.conf}
    FLOW=browser-loa
    ROLE=access
    ACR=platform

    kc() { "$KCADM" "$@" --config "$CFG"; }

    rc=0
    check() { # name want got
      if [ "$2" = "$3" ]; then
        echo "ok   $1=$3"
      else
        echo "FAIL $1: want $2, got ${3:-<missing>}" >&2
        rc=1
      fi
    }

    conf() { sed -n "s/^$1=//p" "$PLATFORM_CONF" | tail -n 1; }

    # --- static checks, before any write -------------------------------------------
    # clients.conf lines: <clientId>.<field>=<values>
    client_lines() { sed -e 's/#.*//' -e 's/[[:space:]]*$//' "$CLIENTS_CONF" | grep -v '^[[:space:]]*$' || true; }
    managed_clients=$(client_lines | sed 's/\..*//' | sort -u)
    bad=0
    while IFS= read -r line; do
      [ -z "$line" ] && continue
      if ! [[ "$line" =~ ^[A-Za-z0-9_-]+\.(redirectUris|webOrigins)=[^[:space:]] ]]; then
        echo "FAIL clients.conf: not <clientId>.<redirectUris|webOrigins>=<values>: $line" >&2
        bad=1
        continue
      fi
      field=${line#*.}
      field=${field%%=*}
      for v in ${line#*=}; do
        case "$field:$v" in
          *'*'* | *'+'* | *'"'* | *,*) ok=0 ;;
          redirectUris:https://?*/*) ok=1 ;;
          redirectUris:http:* | redirectUris:https:*) ok=0 ;;
          redirectUris:[a-z]*.[a-z]*:///*) ok=1 ;;
          webOrigins:https://*/*) ok=0 ;;
          webOrigins:https://?*) ok=1 ;;
          *) ok=0 ;;
        esac
        if [ "$ok" = 0 ]; then
          echo "FAIL clients.conf: $field value not allowed: $v" >&2
          bad=1
        fi
      done
    done < <(client_lines)
    for pc in $(conf proxy_clients); do
      if ! [[ "$pc" =~ ^[A-Za-z0-9_-]+:[A-Za-z0-9_-]+$ ]]; then
        echo "FAIL platform.conf: proxy_clients entry is not <clientId>:<group>: $pc" >&2
        bad=1
      fi
    done
    # access.conf lines: <clientId>=<groups>
    access_lines() { sed -e 's/#.*//' -e 's/[[:space:]]*$//' "$ACCESS_CONF" | grep -v '^[[:space:]]*$' || true; }
    while IFS= read -r line; do
      [ -z "$line" ] && continue
      if ! [[ "$line" =~ ^[A-Za-z0-9_-]+=[A-Za-z0-9_-]+([[:space:]]+[A-Za-z0-9_-]+)*$ ]]; then
        echo "FAIL access.conf: not <clientId>=<groups>: $line" >&2
        bad=1
      fi
    done < <(access_lines)
    access_clients=$(access_lines | sed 's/=.*//')
    if [ -n "$(printf '%s\n' "$access_clients" | sort | uniq -d)" ]; then
      echo "FAIL access.conf: client listed twice: $(printf '%s\n' "$access_clients" | sort | uniq -d | tr '\n' ' ')" >&2
      bad=1
    fi
    # A client that must not exist cannot also be configured.
    for c in $(conf removed_clients); do
      for m in $(conf platform_clients) $managed_clients $access_clients $(conf proxy_clients | tr ' ' '\n' | sed 's/:.*//'); do
        if [ "$c" = "$m" ]; then
          echo "FAIL client $c is in removed_clients and configured elsewhere" >&2
          bad=1
        fi
      done
    done
    [ "$bad" = 0 ] || exit 1
    if [ -n "${CHECK_ONLY:-}" ]; then
      echo "ok   static checks"
      exit 0
    fi

    # Keycloak may still be starting after a sync: retry the login for 5 minutes.
    for i in $(seq 1 30); do
      if "$KCADM" config credentials --config "$CFG" --server "$SERVER" \
        --realm master --user "$KC_ADMIN_USER" --password "$KC_ADMIN_PASSWORD" >/dev/null 2>&1; then
        break
      fi
      if [ "$i" = 30 ]; then
        echo "admin login to $SERVER failed" >&2
        exit 1
      fi
      sleep 10
    done

    # --- sessions.conf: realm fields ---------------------------------------------
    args=()
    fields=()
    while IFS= read -r line; do
      line=${line%%#*}
      line=$(printf '%s' "$line" | tr -d '[:space:]')
      [ -z "$line" ] && continue
      args+=(-s "$line")
      fields+=("$line")
    done < "$CONF"

    if [ "${#fields[@]}" -gt 0 ]; then
      kc update "realms/$REALM" "${args[@]}"
      live=$(kc get "realms/$REALM")
      for f in "${fields[@]}"; do
        key=${f%%=*}
        got=$(printf '%s\n' "$live" | grep -E "^  \"$key\" : " | sed -E 's/^[^:]+: //; s/,$//; s/^"//; s/"$//' || true)
        check "$key" "${f#*=}" "$got"
      done
    fi

    # --- platform.conf: browser flow with a level-of-authentication max age --------
    max_age=$(conf loa_max_age)
    clients=$(conf platform_clients)
    [[ "$max_age" =~ ^[0-9]+$ ]] || { echo "FAIL loa_max_age is not a number" >&2; exit 1; }

    # requirement,displayName,level of every execution in a flow, in order.
    execs() { # flow [fields]
      kc get "authentication/flows/$1/executions" -r "$REALM" --format csv --noquotes \
        --fields "${2:-requirement,displayName,level}"
    }
    row_named() { # rows displayName field -> the first row whose <field> is displayName
      local row
      while IFS= read -r row; do
        if [ "$(printf '%s' "$row" | cut -d, -f"$3")" = "$2" ]; then
          printf '%s\n' "$row"
          return
        fi
      done <<< "$1"
    }
    set_reqs() { # flow; stdin: <displayName>|<requirement> lines
      # One listing, then one update per execution. Send the execution's priority
      # back unchanged: Keycloak 25+ applies the priority of this request, and a
      # missing one would reorder the flow.
      local pairs rows kv row id prio body
      pairs=$(cat)
      rows=$(execs "$1" id,displayName,priority)
      while IFS= read -r kv; do
        row=$(row_named "$rows" "${kv%|*}" 2)
        id=${row%%,*}
        prio=${row##*,}
        body="{\"id\":\"$id\",\"requirement\":\"${kv##*|}\""
        if [[ "$prio" =~ ^[0-9]+$ ]]; then body="$body,\"priority\":$prio"; fi
        kc update "authentication/flows/$1/executions" -r "$REALM" -b "$body}" < /dev/null
      done <<< "$pairs"
    }
    # id,requirement,displayName,level,authenticationConfig of every execution;
    # shape() keeps requirement,displayName,level for the readback.
    flow_rows() { execs "$1" id,requirement,displayName,level,authenticationConfig; }
    shape() { printf '%s\n' "$1" | cut -d, -f2-4; }
    flow_id() { # alias -> id; empty when the flow does not exist
      kc get authentication/flows -r "$REALM" --format csv --noquotes --fields id,alias |
        grep -E ",$1\$" | cut -d, -f1 || true
    }
    new_flow() { # alias description
      echo "creating flow $1"
      kc create authentication/flows -r "$REALM" -s alias="$1" -s providerId=basic-flow \
        -s topLevel=true -s builtIn=false -s "description=$2" >/dev/null 2>&1
    }
    sub() { # parent alias
      kc create "authentication/flows/$1/executions/flow" -r "$REALM" -s alias="$2" \
        -s type=basic-flow -s provider=registration-page-form >/dev/null 2>&1
    }
    step() { # flow provider
      kc create "authentication/flows/$1/executions/execution" -r "$REALM" -s provider="$2" >/dev/null 2>&1
    }
    # The browser-loa login under <parent>, subflows named <prefix>-*;
    # login_reqs prints their requirements for set_reqs.
    login_steps() { # parent prefix
      step "$1" auth-cookie
      step "$1" identity-provider-redirector
      sub "$1" "$2-forms"
      sub "$2-forms" "$2-level-1"
      step "$2-level-1" conditional-level-of-authentication
      step "$2-level-1" auth-username-password-form
      sub "$2-level-1" "$2-otp"
      step "$2-otp" conditional-user-configured
      step "$2-otp" auth-otp-form
    }
    login_reqs() { # prefix
      printf '%s\n' "Cookie|ALTERNATIVE" "Identity Provider Redirector|ALTERNATIVE" \
        "$1-forms|ALTERNATIVE" "$1-level-1|CONDITIONAL" \
        "Condition - Level of Authentication|REQUIRED" "Username Password Form|REQUIRED" \
        "$1-otp|CONDITIONAL" "Condition - user configured|REQUIRED" "OTP Form|REQUIRED"
    }
    # Expected rows of login_steps at <level> (0 when directly in the top flow).
    login_rows() { # prefix level
      local l=$2
      printf '%s\n' "ALTERNATIVE,Cookie,$l" "ALTERNATIVE,Identity Provider Redirector,$l" \
        "ALTERNATIVE,$1-forms,$l" "CONDITIONAL,$1-level-1,$((l + 1))" \
        "REQUIRED,Condition - Level of Authentication,$((l + 2))" \
        "REQUIRED,Username Password Form,$((l + 2))" "CONDITIONAL,$1-otp,$((l + 2))" \
        "REQUIRED,Condition - user configured,$((l + 3))" "REQUIRED,OTP Form,$((l + 3))"
    }
    cfg_val() { # config JSON, key -> value
      printf '%s\n' "$1" | sed -n "s/^ *\"$2\" : \"\\(.*\\)\",\\{0,1\\}\$/\\1/p"
    }
    # Create the config of execution <displayName>, or update it when a value
    # differs, then check every value. <rows> is flow_rows of the flow.
    ensure_cfg() { # flow rows displayName alias key=value...
      local f=$1 n=$3 a=$4 row eid cfg live="" kv args=() drift=0
      row=$(row_named "$2" "$n" 3)
      shift 4
      eid=${row%%,*}
      cfg=${row##*,}
      if [ -n "$cfg" ]; then live=$(kc get "authentication/config/$cfg" -r "$REALM"); fi
      for kv in "$@"; do
        args+=(-s "config.\"${kv%%=*}\"=${kv#*=}")
        [ "$(cfg_val "$live" "${kv%%=*}")" = "${kv#*=}" ] || drift=1
      done
      if [ -z "$cfg" ]; then
        kc create "authentication/executions/$eid/config" -r "$REALM" -s alias="$a" "${args[@]}" >/dev/null 2>&1
        row=$(row_named "$(flow_rows "$f")" "$n" 3)
        cfg=${row##*,}
      elif [ "$drift" = 1 ]; then
        kc update "authentication/config/$cfg" -r "$REALM" "${args[@]}"
      fi
      if [ "$drift" = 1 ]; then live=$(kc get "authentication/config/$cfg" -r "$REALM"); fi
      for kv in "$@"; do
        check "flow $f $n ${kv%%=*}" "${kv#*=}" "$(cfg_val "$live" "${kv%%=*}")"
      done
    }
    check_flow() { # flow rows expected-shape
      if [ "$(shape "$2")" = "$3" ]; then
        echo "ok   flow $1: $(printf '%s\n' "$2" | wc -l | tr -d ' ') executions"
      else
        printf 'FAIL flow %s:\n%s\n' "$1" "$(shape "$2")" >&2
        rc=1
      fi
    }

    if [ -z "$(flow_id "$FLOW")" ]; then
      new_flow "$FLOW" 'Browser login; platform clients re-authenticate after platform.conf loa_max_age'
      login_steps "$FLOW" "$FLOW"
      login_reqs "$FLOW" | set_reqs "$FLOW"
    fi
    loa_rows=$(flow_rows "$FLOW")
    ensure_cfg "$FLOW" "$loa_rows" "Condition - Level of Authentication" "$FLOW-max-age" \
      loa-condition-level=1 "loa-max-age=$max_age"

    kc update "realms/$REALM" -s browserFlow="$FLOW" -s "attributes.\"acr.loa.map\"=\"{\\\"$ACR\\\":1}\""

    client_id() { # clientId -> internal id; empty when the client does not exist
      kc get clients -r "$REALM" -q clientId="$1" --format csv --noquotes --fields id,clientId |
        grep -E ",$1\$" | cut -d, -f1 || true
    }

    # --- platform.conf: clients that must not exist --------------------------------
    for c in $(conf removed_clients); do
      id=$(client_id "$c")
      if [ -n "$id" ]; then
        echo "deleting client $c"
        kc delete "clients/$id" -r "$REALM"
      fi
      if [ -z "$(client_id "$c")" ]; then got=absent; else got=present; fi
      check "client $c" absent "$got"
    done

    # --- platform.conf: confidential clients for oauth2-proxy ----------------------
    name_id() { # resource name -> id of the entry with that name
      kc get "$1" -r "$REALM" --format csv --noquotes --fields id,name | grep -E ",$2\$" | cut -d, -f1 || true
    }
    for pc in $(conf proxy_clients); do
      c=${pc%%:*}
      g=${pc#*:}
      if [ -z "$(name_id groups "$g")" ]; then
        echo "creating group $g"
        kc create groups -r "$REALM" -s name="$g" >/dev/null
      fi
      if [ -n "$(name_id groups "$g")" ]; then got=present; else got=absent; fi
      check "group $g" present "$got"

      if [ -z "$(client_id "$c")" ]; then
        echo "creating client $c"
        kc create clients -r "$REALM" -s clientId="$c" -s protocol=openid-connect \
          -s publicClient=false -s standardFlowEnabled=true -s directAccessGrantsEnabled=false \
          -s implicitFlowEnabled=false -s serviceAccountsEnabled=false \
          -s 'attributes."pkce.code.challenge.method"=S256' >/dev/null
      fi
      id=$(client_id "$c")
      if [ -z "$id" ]; then
        check "client $c" present ""
        continue
      fi

      # The secret is never printed: only whether the live one matches.
      var="$(printf '%s' "$c" | tr 'a-z-' 'A-Z_')_CLIENT_SECRET"
      want=${!var:-}
      field=secret
      if [ -z "$want" ] || [ "${want#PENDING}" != "$want" ]; then
        echo "WARN client $c: $var is unset or PENDING; client $field left as is" >&2
      else
        kc update "clients/$id" -r "$REALM" -s "$field=$want"
        live=$(kc get "clients/$id/client-$field" -r "$REALM" | sed -n 's/^ *"value" : "\(.*\)",\{0,1\}$/\1/p')
        if [ "$live" = "$want" ]; then got=matches; else got=differs; fi
        check "client $c $field ($var)" matches "$got"
      fi
      unset want live

      sid=$(name_id client-scopes groups)
      if ! kc get "clients/$id/default-client-scopes" -r "$REALM" --format csv --noquotes --fields name | grep -qx groups; then
        kc update "clients/$id/default-client-scopes/$sid" -r "$REALM"
      fi
      if kc get "clients/$id/default-client-scopes" -r "$REALM" --format csv --noquotes --fields name | grep -qx groups; then
        got=present
      else
        got=absent
      fi
      check "client $c default scope groups" present "$got"

      if ! kc get "clients/$id/protocol-mappers/models" -r "$REALM" --format csv --noquotes --fields name | grep -qx audience; then
        kc create "clients/$id/protocol-mappers/models" -r "$REALM" -s name=audience \
          -s protocol=openid-connect -s protocolMapper=oidc-audience-mapper \
          -s "config.\"included.client.audience\"=$c" -s 'config."access.token.claim"=true' \
          -s 'config."id.token.claim"=false' >/dev/null
      fi
      if kc get "clients/$id/protocol-mappers/models" -r "$REALM" --format csv --noquotes --fields name | grep -qx audience; then
        got=present
      else
        got=absent
      fi
      check "client $c audience mapper" present "$got"
    done

    # --- platform.conf: default ACR of the platform clients -----------------------
    # After proxy_clients, so a platform client that is also a new proxy client
    # exists by now.
    for c in $clients; do
      id=$(client_id "$c")
      if [ -z "$id" ]; then
        check "client $c" present ""
        continue
      fi
      kc update "clients/$id" -r "$REALM" -s "attributes.\"default.acr.values\"=$ACR"
      # `--fields attributes` returns an empty map: read the whole client.
      got=$(kc get "clients/$id" -r "$REALM" | sed -n 's/^ *"default\.acr\.values" : "\(.*\)",\{0,1\}$/\1/p')
      check "client $c default.acr.values" "$ACR" "$got"
    done

    # --- clients.conf: redirect URIs and web origins -------------------------------
    json_list() { # space-separated values -> ["a","b"]
      local out="" v
      for v in $1; do out="$out${out:+,}\"$v\""; done
      printf '[%s]' "$out"
    }
    live_list() { # client JSON, field -> sorted, space-separated values
      printf '%s\n' "$1" | grep -E "^ *\"$2\" : \[" | head -n 1 |
        sed -E 's/^[^[]*\[//; s/\].*$//' | tr ',' '\n' | sed -E 's/^ *"//; s/" *$//' |
        grep -v '^$' | sort | tr '\n' ' ' | sed 's/ $//' || true
    }
    for c in $managed_clients; do
      id=$(client_id "$c")
      if [ -z "$id" ]; then
        check "client $c" present ""
        continue
      fi
      args=()
      fields=()
      while IFS= read -r line; do
        case "$line" in "$c".*) ;; *) continue ;; esac
        f=${line#*.}
        f=${f%%=*}
        args+=(-s "$f=$(json_list "${line#*=}")")
        fields+=("$f=${line#*=}")
      done < <(client_lines)
      kc update "clients/$id" -r "$REALM" "${args[@]}"
      live=$(kc get "clients/$id" -r "$REALM" --fields redirectUris,webOrigins)
      for f in "${fields[@]}"; do
        want=$(printf '%s\n' "${f#*=}" | tr ' ' '\n' | sort | tr '\n' ' ' | sed 's/ $//')
        check "client $c ${f%%=*}" "$want" "$(live_list "$live" "${f%%=*}")"
      done
    done

    # Other clients: warn about absolute wildcard redirect URIs. Keycloak's own
    # consoles use relative ones (/realms/<realm>/account/*), which stay.
    current=""
    while IFS= read -r line; do
      case "$line" in
        *'"clientId" : '*) current=$(printf '%s' "$line" | sed -E 's/^[^:]+: "//; s/",?$//') ;;
        *'"redirectUris" : '*)
          for v in $(printf '%s' "$line" | sed -E 's/^[^[]*\[//; s/\].*$//' | tr ',' ' ' | tr -d '"'); do
            case "$v" in
              /*) ;;
              *'*'*) echo "WARN client $current has a wildcard redirect URI: $v" >&2 ;;
            esac
          done
          ;;
      esac
    done < <(kc get clients -r "$REALM" --fields clientId,redirectUris)

    # --- access.conf: who may log in to each client ---------------------------------
    # Groups get the client role `access`; the client's own flows deny a user
    # without it, after the login step (cookie included).
    access_groups() { access_lines | sed -n "s/^$1=//p"; }
    sorted() { tr ' ' '\n' | grep -v '^$' | sort | tr '\n' ' ' | sed 's/ $//' || true; }
    role_groups() { # client internal id -> sorted names of the groups mapped to its role
      kc get "clients/$1/roles/$ROLE/groups" -r "$REALM" --format csv --noquotes --fields name | sorted
    }
    override() { # client JSON, binding -> flow id
      printf '%s\n' "$1" | sed -n "s/^ *\"$2\" : \"\\(.*\\)\",\\{0,1\\}\$/\\1/p"
    }
    for c in $access_clients; do
      id=$(client_id "$c")
      if [ -z "$id" ]; then
        check "client $c" present ""
        continue
      fi
      want_groups=$(access_groups "$c" | sorted)

      if ! kc get "clients/$id/roles" -r "$REALM" --format csv --noquotes --fields name | grep -qx "$ROLE"; then
        echo "creating role $c.$ROLE"
        kc create "clients/$id/roles" -r "$REALM" -s name="$ROLE" -s 'description=May log in (access.conf)' >/dev/null
      fi
      for g in $want_groups; do
        if [ -z "$(name_id groups "$g")" ]; then
          echo "creating group $g"
          kc create groups -r "$REALM" -s name="$g" >/dev/null
        fi
      done
      live_groups=$(role_groups "$id")
      for g in $want_groups; do
        case " $live_groups " in
          *" $g "*) ;;
          *) kc add-roles -r "$REALM" --gid "$(name_id groups "$g")" --cclientid "$c" --rolename "$ROLE" ;;
        esac
      done
      for g in $live_groups; do
        case " $want_groups " in
          *" $g "*) ;;
          *)
            echo "removing $c.$ROLE from group $g"
            kc remove-roles -r "$REALM" --gid "$(name_id groups "$g")" --cclientid "$c" --rolename "$ROLE"
            ;;
        esac
      done
      check "client $c $ROLE groups" "$want_groups" "$(role_groups "$id")"
      if kc get "roles/default-roles-$REALM/composites/clients/$id" -r "$REALM" --format csv --noquotes --fields name | grep -qx "$ROLE"; then
        got=present
      else
        got=absent
      fi
      check "client $c $ROLE in default roles" absent "$got"
      n=$(kc get "clients/$id/roles/$ROLE/users" -r "$REALM" --format csv --noquotes --fields id | grep -c . || true)
      [ "$n" = 0 ] || echo "WARN client $c: $n user(s) hold $c.$ROLE directly instead of through a group" >&2

      bf="access-$c"
      df="access-$c-direct"
      want_b=$(
        echo "REQUIRED,$bf-login,0"
        login_rows "$bf" 1
        printf '%s\n' "CONDITIONAL,$bf-gate,0" "REQUIRED,Condition - user role,1" "REQUIRED,Deny access,1"
      )
      want_d=$(printf '%s\n' "REQUIRED,Username Validation,0" "REQUIRED,Password,0" \
        "CONDITIONAL,$df-otp,0" "REQUIRED,Condition - user configured,1" "REQUIRED,OTP,1" \
        "CONDITIONAL,$df-gate,0" "REQUIRED,Condition - user role,1" "REQUIRED,Deny access,1")
      bid=$(flow_id "$bf")
      did=$(flow_id "$df")
      rows_b=""
      rows_d=""
      if [ -n "$bid" ]; then rows_b=$(flow_rows "$bf"); fi
      if [ -n "$did" ]; then rows_d=$(flow_rows "$df"); fi
      # A flow that differs (a Job stopped half-way through building it) is
      # rebuilt. Keycloak deletes only unbound flows, so the client falls back to
      # the realm flow until the end of this iteration.
      stale=""
      if [ -n "$bid" ] && [ "$(shape "$rows_b")" != "$want_b" ]; then stale="$stale $bid"; bid=""; fi
      if [ -n "$did" ] && [ "$(shape "$rows_d")" != "$want_d" ]; then stale="$stale $did"; did=""; fi
      if [ -n "$stale" ]; then
        echo "rebuilding the flows of $c"
        kc update "clients/$id" -r "$REALM" -s 'authenticationFlowBindingOverrides={}'
        for f in $stale; do kc delete "authentication/flows/$f" -r "$REALM"; done
      fi
      if [ -z "$bid" ]; then
        new_flow "$bf" "Browser login to $c, then deny without $c.$ROLE (access.conf)"
        sub "$bf" "$bf-login"
        sub "$bf" "$bf-gate"
        login_steps "$bf-login" "$bf"
        step "$bf-gate" conditional-user-role
        step "$bf-gate" deny-access-authenticator
        {
          echo "$bf-login|REQUIRED"
          login_reqs "$bf"
          printf '%s\n' "$bf-gate|CONDITIONAL" "Condition - user role|REQUIRED" "Deny access|REQUIRED"
        } | set_reqs "$bf"
        bid=$(flow_id "$bf")
        rows_b=$(flow_rows "$bf")
      fi
      if [ -z "$did" ]; then
        new_flow "$df" "Password grant to $c, then deny without $c.$ROLE (access.conf)"
        step "$df" direct-grant-validate-username
        step "$df" direct-grant-validate-password
        sub "$df" "$df-otp"
        step "$df-otp" conditional-user-configured
        step "$df-otp" direct-grant-validate-otp
        sub "$df" "$df-gate"
        step "$df-gate" conditional-user-role
        step "$df-gate" deny-access-authenticator
        printf '%s\n' "Username Validation|REQUIRED" "Password|REQUIRED" "$df-otp|CONDITIONAL" \
          "Condition - user configured|REQUIRED" "OTP|REQUIRED" "$df-gate|CONDITIONAL" \
          "Condition - user role|REQUIRED" "Deny access|REQUIRED" | set_reqs "$df"
        did=$(flow_id "$df")
        rows_d=$(flow_rows "$df")
      fi
      check_flow "$bf" "$rows_b" "$want_b"
      check_flow "$df" "$rows_d" "$want_d"
      ensure_cfg "$bf" "$rows_b" "Condition - Level of Authentication" "$bf-max-age" \
        loa-condition-level=1 "loa-max-age=$max_age"
      ensure_cfg "$bf" "$rows_b" "Condition - user role" "$bf-role" "condUserRole=$c.$ROLE" negate=true
      ensure_cfg "$df" "$rows_d" "Condition - user role" "$df-role" "condUserRole=$c.$ROLE" negate=true

      live=$(kc get "clients/$id" -r "$REALM")
      if [ "$(override "$live" browser)" != "$bid" ] || [ "$(override "$live" direct_grant)" != "$did" ]; then
        kc update "clients/$id" -r "$REALM" -s "authenticationFlowBindingOverrides.browser=$bid" \
          -s "authenticationFlowBindingOverrides.direct_grant=$did"
        live=$(kc get "clients/$id" -r "$REALM")
      fi
      got=""
      if [ "$(override "$live" browser)" = "$bid" ]; then got=$bf; fi
      check "client $c browser flow" "$bf" "$got"
      got=""
      if [ "$(override "$live" direct_grant)" = "$did" ]; then got=$df; fi
      check "client $c direct_grant flow" "$df" "$got"
    done

    # Read back the realm flow and its binding.
    check_flow "$FLOW" "$loa_rows" "$(login_rows "$FLOW" 0)"
    realm=$(kc get "realms/$REALM")
    check browserFlow "$FLOW" "$(printf '%s\n' "$realm" | sed -n 's/^ *"browserFlow" : "\(.*\)",\{0,1\}$/\1/p')"
    check acr.loa.map "{\\\"$ACR\\\":1}" "$(printf '%s\n' "$realm" | sed -n 's/^ *"acr\.loa\.map" : "\(.*\)",\{0,1\}$/\1/p')"
    exit "$rc"
  clients.conf: |
    # Redirect URIs and web origins of the `homelab` realm's app clients, applied
    # by apply.sh after platform.conf. Keycloak only sends an authorization code
    # to a listed redirect URI, so each list is the app's exact callback: a
    # wildcard would let any URL on (or off) the host receive a login code.
    #
    # One `<clientId>.<field>=<values>` per line, values space-separated.
    # Fields: redirectUris (absolute https:// URLs or an app scheme such as
    # app.immich:///), webOrigins (https://host, no path). No `*`, no `+`.
    # apply.sh replaces each listed field, reads it back, and warns about any
    # other client of the realm that still has an absolute wildcard redirect URI.

    argocd.redirectUris=https://argo.lilalala.com/auth/callback
    argocd.webOrigins=https://argo.lilalala.com

    grafana-oauth.redirectUris=https://grafana.lilalala.com/login/generic_oauth
    grafana-oauth.webOrigins=https://grafana.lilalala.com

    # Web login, the user-settings "link OAuth account" page, and the mobile app.
    immich.redirectUris=https://media.lilalala.com/auth/login https://media.lilalala.com/user-settings app.immich:///oauth-callback
    immich.webOrigins=https://media.lilalala.com

    # Web login and the mobile apps (the server redirects on to audiobookshelf://).
    audiobookshelf.redirectUris=https://audiobooks.lilalala.com/auth/openid/callback https://audiobooks.lilalala.com/auth/openid/mobile-redirect
    audiobookshelf.webOrigins=https://audiobooks.lilalala.com

    calibre-web.redirectUris=https://ebooks.lilalala.com/login/generic/authorized
    calibre-web.webOrigins=https://ebooks.lilalala.com

    # hass-oidc-auth (apps/home/config/configuration.yaml), public client + PKCE.
    home-assistant.redirectUris=https://home.lilalala.com/auth/oidc/callback
    home-assistant.webOrigins=https://home.lilalala.com

    # oauth2-proxy in front of the theater admin UIs (apps/theater/sso.yaml).
    theater-sso.redirectUris=https://theater.lilalala.com/oauth2/callback
    theater-sso.webOrigins=https://theater.lilalala.com

    # oauth2-proxy in front of Headlamp (platform/headlamp).
    headlamp.redirectUris=https://headlamp.lilalala.com/oauth2/callback
    headlamp.webOrigins=https://headlamp.lilalala.com

    # oauth2-proxy in front of the Hubble UI, on the tailnet (platform/hubble-access).
    hubble.redirectUris=https://hubble.tail32a1fc.ts.net/oauth2/callback
    hubble.webOrigins=https://hubble.tail32a1fc.ts.net

    mealie.redirectUris=https://cook.lilalala.com/login https://cook.lilalala.com/login?direct=1
    mealie.webOrigins=https://cook.lilalala.com

    # django-allauth callback of the provider_id `keycloak` in
    # PAPERLESS_SOCIALACCOUNT_PROVIDERS (apps/paperless).
    paperless.redirectUris=https://archive.lilalala.com/accounts/oidc/keycloak/login/callback/
    paperless.webOrigins=https://archive.lilalala.com
  platform.conf: |
    # Platform clients of the `homelab` realm, applied by apply.sh after
    # sessions.conf. A stolen session on one of these is cluster-admin, so they
    # require a fresh login once the last password login is older than
    # loa_max_age seconds, while user apps keep the long SSO session.
    #
    # How: the realm's browser flow becomes `browser-loa`, the built-in browser
    # flow with its password step behind "Condition - Level of Authentication"
    # (level 1, max age below). These clients request ACR `platform` (level 1) by
    # default; an SSO cookie whose level-1 login is older than the max age does
    # not satisfy it, so Keycloak shows the login form. Clients that request no
    # ACR (Immich, Mealie, Paperless, Seafile) are satisfied by the cookie alone.

    # 12 hours.
    loa_max_age=43200

    # Client IDs, space-separated.
    platform_clients=argocd grafana-oauth security-admin-console headlamp hubble

    # Clients deleted if present, space-separated. `myclient` is the Keycloak
    # getting-started client: public, direct access grants on, redirects to
    # keycloak.org. Listed here so it stays deleted.
    removed_clients=myclient

    # Confidential clients for oauth2-proxy, created if absent, as
    # <clientId>:<group>, space-separated. apply.sh creates the client (standard
    # flow only, PKCE S256, default scope `groups`, an audience mapper) and the
    # group, and sets the client secret from the environment variable
    # <CLIENT_ID>_CLIENT_SECRET (upper case, `-` as `_`). Group members stay in
    # the admin console. Redirect URIs are in clients.conf.
    proxy_clients=theater-sso:TheaterAdmins headlamp:admins hubble:admins
  sessions.conf: |
    # Session and token lifetimes of the `homelab` realm, applied by the
    # keycloak-realm-settings Job (realm-settings.yaml) after every sync.
    #
    # One `<RealmRepresentation field>=<value>` per line, durations in seconds.
    # Only the fields listed here are written; users, credentials, clients and
    # every other realm setting are left as they are.
    #
    # Goal: user apps log in once per device and stay logged in. A session ends
    # only after 30 days without use, or one year after login (two values below
    # for users who tick "Remember me"). Offline tokens (scope offline_access)
    # expire after one year without use and have no absolute maximum. Platform
    # clients log in again after 12 hours regardless (platform.conf).

    # SSO session: 30 days idle, 365 days max.
    ssoSessionIdleTimeout=2592000
    ssoSessionMaxLifespan=31536000

    # "Remember me" on the login page: 180 days idle, 365 days max.
    rememberMe=true
    ssoSessionIdleTimeoutRememberMe=15552000
    ssoSessionMaxLifespanRememberMe=31536000

    # Offline sessions: 365 days idle, no maximum.
    offlineSessionIdleTimeout=31536000
    offlineSessionMaxLifespanEnabled=false

    # Client sessions inherit the SSO and offline values above (0 = inherit), so
    # refresh tokens live as long as the session that issued them.
    clientSessionIdleTimeout=0
    clientSessionMaxLifespan=0
    clientOfflineSessionIdleTimeout=0
    clientOfflineSessionMaxLifespan=0

    # Access tokens stay short (5 minutes); clients renew them with the refresh
    # token. Refresh token rotation stays at the realm default (off), so two tabs
    # refreshing at once do not log each other out.
    accessTokenLifespan=300
kind: ConfigMap
metadata:
  name: keycloak-realm-settings-5d2f8db924
  namespace: keycloak
