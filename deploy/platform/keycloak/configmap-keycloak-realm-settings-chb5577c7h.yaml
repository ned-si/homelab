apiVersion: v1
data:
  apply.sh: |
    #!/bin/bash
    # Write the fields of sessions.conf to the `homelab` realm, then read the realm
    # back and fail unless every field holds the expected value.
    #
    # Runs in the Keycloak image (kcadm.sh, bash, grep, sed; no jq or curl).
    # `kcadm.sh update -s` fetches the realm, changes only the given fields and
    # writes it back, so nothing outside sessions.conf is touched.
    set -euo pipefail

    KCADM=/opt/keycloak/bin/kcadm.sh
    CFG=/tmp/kcadm.config
    SERVER=${KEYCLOAK_URL:-http://keycloak.keycloak.svc.cluster.local:8080}
    REALM=${REALM:-homelab}
    CONF=${CONF:-/realm/sessions.conf}

    # Keycloak may still be starting after a sync: retry the login for 5 minutes.
    for i in $(seq 1 30); do
      if "$KCADM" config credentials --config "$CFG" --server "$SERVER" \
        --realm master --user "$KC_ADMIN_USER" --password "$KC_ADMIN_PASSWORD" >/dev/null 2>&1; then
        break
      fi
      if [ "$i" = 30 ]; then
        echo "admin login to $SERVER failed" >&2
        exit 1
      fi
      sleep 10
    done

    args=()
    fields=()
    while IFS= read -r line; do
      line=${line%%#*}
      line=$(printf '%s' "$line" | tr -d '[:space:]')
      [ -z "$line" ] && continue
      args+=(-s "$line")
      fields+=("$line")
    done < "$CONF"

    "$KCADM" update "realms/$REALM" --config "$CFG" "${args[@]}"

    live=$("$KCADM" get "realms/$REALM" --config "$CFG")
    rc=0
    for f in "${fields[@]}"; do
      key=${f%%=*}
      want=${f#*=}
      got=$(printf '%s\n' "$live" | grep -E "^  \"$key\" : " | sed -E 's/^[^:]+: //; s/,$//; s/^"//; s/"$//' || true)
      if [ "$got" = "$want" ]; then
        echo "ok   $key=$got"
      else
        echo "FAIL $key: want $want, got ${got:-<missing>}" >&2
        rc=1
      fi
    done
    exit "$rc"
  sessions.conf: |
    # Session and token lifetimes of the `homelab` realm, applied by the
    # keycloak-realm-settings Job (realm-settings.yaml) after every sync.
    #
    # One `<RealmRepresentation field>=<value>` per line, durations in seconds.
    # Only the fields listed here are written; users, credentials, clients and
    # every other realm setting are left as they are.
    #
    # Goal: log in once per device and stay logged in. A session ends only after
    # 30 days without use, or one year after login (two values below for users
    # who tick "Remember me"). Offline tokens (scope offline_access, used by
    # Grafana and Argo CD to refresh) expire after one year without use and have
    # no absolute maximum.

    # SSO session: 30 days idle, 365 days max.
    ssoSessionIdleTimeout=2592000
    ssoSessionMaxLifespan=31536000

    # "Remember me" on the login page: 180 days idle, 365 days max.
    rememberMe=true
    ssoSessionIdleTimeoutRememberMe=15552000
    ssoSessionMaxLifespanRememberMe=31536000

    # Offline sessions: 365 days idle, no maximum.
    offlineSessionIdleTimeout=31536000
    offlineSessionMaxLifespanEnabled=false

    # Client sessions inherit the SSO and offline values above (0 = inherit), so
    # refresh tokens live as long as the session that issued them.
    clientSessionIdleTimeout=0
    clientSessionMaxLifespan=0
    clientOfflineSessionIdleTimeout=0
    clientOfflineSessionMaxLifespan=0

    # Access tokens stay short (5 minutes); clients renew them with the refresh
    # token. Refresh token rotation stays at the realm default (off), so two tabs
    # refreshing at once do not log each other out.
    accessTokenLifespan=300
