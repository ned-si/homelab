apiVersion: v1
data:
  run-all-files.sh: |
    #!/usr/bin/env bash
    set -uo pipefail
    rc=0
    while read -r suffix tag; do
      [ -z "${suffix:-}" ] && continue
      case "$suffix" in '#'*) continue ;; esac
      /scripts/verify-files.sh "$suffix" "$tag" || { echo "::FAILED:: $tag"; rc=1; }
      echo
    # ONLY repositories that a backup CronJob actually writes to.
    #
    # An earlier version listed seafile/syncthing/theater as well. Those restic
    # jobs do not exist yet, so every run reported three failures -- and a check
    # that always fails is a check you learn to ignore, which is worse than not
    # having it. Uncomment each line as its backup CronJob is added, and add the
    # repo to `local.restic_repos` in bootstrap/aws-backup/main.tf at the same
    # time or its packs will never be archived.
    done <<'LIST'
    immich/library      immich-library
    paperless/media     paperless-media
    # seafile/shared    seafile-shared
    # syncthing/data    syncthing-data
    # theater/configs   theater-configs
    LIST
    [ $rc -eq 0 ] && echo "ALL FILE BACKUPS VERIFIED" || echo "ONE OR MORE FILE BACKUPS FAILED"
    exit $rc
  verify-files.sh: |
    #!/usr/bin/env bash
    # Usage: verify-files.sh <repo-suffix> <tag>
    set -euo pipefail

    REPO_SUFFIX="$1"
    TAG="$2"
    # 52 slices, one per week, so a year gives complete pack coverage. Lower it
    # to read more per run and finish sooner, at proportionally more retrieval.
    SUBSET_TOTAL="${SUBSET_TOTAL:-52}"
    export RESTIC_REPOSITORY="s3:https://s3.eu-central-1.amazonaws.com/homelab-backups-REPLACE-ME/${REPO_SUFFIX}"
    # Fresh scratch dir per repo so runs cannot contaminate each other.
    DEST="/scratch/${TAG}"
    rm -rf "$DEST" && mkdir -p "$DEST"

    # How stale a snapshot may be before this is a failure. The library backup
    # runs nightly, so >3 days means the CronJob has been silently failing.
    MAX_AGE_DAYS=3

    echo "=== $TAG  ($RESTIC_REPOSITORY) ==="

    echo "--- 1. repository structure ---"
    restic check --with-cache

    echo "--- 2. latest snapshot freshness ---"
    latest_iso=$(restic snapshots --tag "$TAG" --latest 1 --json \
                 | sed -n 's/.*"time":"\([^"]*\)".*/\1/p' | head -1)
    if [ -z "$latest_iso" ]; then
      echo "FAIL: no snapshot found for tag '$TAG'. The backup has never run."
      exit 1
    fi
    echo "    latest: $latest_iso"
    latest_epoch=$(date -d "$latest_iso" +%s 2>/dev/null || echo 0)
    if [ "$latest_epoch" -gt 0 ]; then
      age_days=$(( ( $(date +%s) - latest_epoch ) / 86400 ))
      echo "    age: ${age_days}d"
      if [ "$age_days" -gt "$MAX_AGE_DAYS" ]; then
        echo "FAIL: newest snapshot is ${age_days}d old (max ${MAX_AGE_DAYS}d)."
        echo "      The backup CronJob is not running or is failing silently."
        exit 1
      fi
    fi

    echo "--- 3. sample restore ---"
    # Pick a handful of real files from the snapshot rather than restoring
    # everything: this is a proof of retrievability, not a disaster drill, and
    # restoring 2TB weekly would cost more than the backup itself.
    mapfile -t files < <(restic ls --tag "$TAG" latest 2>/dev/null \
                         | grep -vE '/$' | head -200 | shuf -n 5)
    if [ "${#files[@]}" -eq 0 ]; then
      echo "FAIL: snapshot contains no files."
      exit 1
    fi

    for f in "${files[@]}"; do
      echo "    restoring $f"
      restic restore latest --tag "$TAG" --target "$DEST" --include "$f"
    done

    restored=$(find "$DEST" -type f | wc -l | tr -d ' ')
    empty=$(find "$DEST" -type f -empty | wc -l | tr -d ' ')
    echo "    restored $restored file(s), $empty empty"

    [ "$restored" -ge 1 ] || { echo "FAIL: nothing was restored."; exit 1; }
    [ "$empty" -eq 0 ]    || { echo "FAIL: $empty restored file(s) are empty -- data blobs are not retrievable."; exit 1; }

    # Leave nothing behind; the scratch volume is small.
    rm -rf "$DEST"

    echo "--- 4. rotating pack-data read (1/${SUBSET_TOTAL} of the repository) ---"
    #
    # WHERE THE FULL READ ACTUALLY HAPPENS
    #
    # This is the only step that costs real money against S3, because it pulls
    # pack files. It is therefore DISABLED BY DEFAULT for the remote repository:
    # the same data is read in full, every week, against the LOCAL restic
    # repository on TrueNAS, where reads are free.
    #
    # That split is deliberate. Reading remotely proves something local reading
    # cannot -- that the upload path and the credentials still work -- but that is
    # already covered by steps 1-3 plus the sample restore, which touch the remote
    # repository every run for pennies.
    #
    # Set READ_DATA=1 to enable it (the local verifier does). Kept as a switch
    # rather than deleted so it is visible in the manifest that coverage is being
    # obtained elsewhere rather than skipped.
    if [ "${READ_DATA:-0}" != "1" ]; then
      echo "    skipped -- full pack reads run against the LOCAL repository."
      echo "    Set READ_DATA=1 to read remotely too (costs retrieval)."
    else
      # Which slice depends on the ISO week, so consecutive runs read different
      # packs and a year covers the whole repository. `10#` forces base 10: week
      # "08" would otherwise be an invalid octal literal.
      week=$(date +%V)
      slice=$(( (10#$week - 1) % SUBSET_TOTAL + 1 ))
      echo "    week $week -> subset ${slice}/${SUBSET_TOTAL}"
      restic check --with-cache --read-data-subset="${slice}/${SUBSET_TOTAL}"
    fi

    echo "PASS: $TAG"
kind: ConfigMap
metadata:
  name: backup-verify-files-scripts
  namespace: backup-verify
---
apiVersion: v1
data:
  run-all.sh: |
    #!/usr/bin/env bash
    # Verify every database. Keeps going after a failure so one broken backup
    # does not hide the state of the others.
    set -uo pipefail
    rc=0
    # cluster            namespace   min-tables
    # min-tables is a floor, not an exact count: it only has to be high enough
    # that an empty or half-restored schema fails.
    while read -r cluster ns min; do
      [ -z "${cluster:-}" ] && continue
      case "$cluster" in '#'*) continue ;; esac
      if ! /scripts/verify.sh "$cluster" "$ns" "$min"; then
        echo "::FAILED:: $cluster"
        rc=1
      fi
    done <<'LIST'
    immich-db          immich      40
    keycloak-db        keycloak    50
    mealie-postgresql  mealie      10
    sonarr-postgresql  theater     10
    radarr-postgresql  theater     10
    LIST
    echo
    [ $rc -eq 0 ] && echo "ALL BACKUPS VERIFIED" || echo "ONE OR MORE BACKUPS FAILED VERIFICATION"
    exit $rc
  verify.sh: |
    #!/usr/bin/env bash
    # Restore one database from S3 into a throwaway cluster and assert it works.
    #
    # Usage: verify.sh <source-cluster> <objectstore-namespace> <min-expected-tables>
    set -euo pipefail

    SRC="$1"
    SRC_NS="$2"
    MIN_TABLES="${3:-1}"
    STAMP="$(date +%s)"
    TARGET="verify-${SRC}-${STAMP}"
    # Truncate: Kubernetes names cap at 63 chars and CNPG appends suffixes.
    TARGET="$(printf '%.40s' "$TARGET")"

    cleanup() {
      echo "--- cleaning up $TARGET ---"
      kubectl -n backup-verify delete cluster "$TARGET" --ignore-not-found --wait=false
    }
    trap cleanup EXIT

    echo "=== verifying backup of $SRC (from $SRC_NS) ==="

    # The throwaway cluster.
    #
    # Single instance, small volume, and -- critically -- NO `spec.backup`
    # block. Without it the restored cluster has nowhere to archive WAL, so it
    # physically cannot write into the object store it was restored from. That
    # is what makes running this against production backups safe.
    #
    # `serverName` under externalClusters is what selects WHICH backup inside
    # destinationPath to read. It must match the source cluster's name, because
    # this restored cluster is called something else entirely.
    kubectl apply -f - <<EOF
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      name: $TARGET
      namespace: backup-verify
      labels:
        homelab.lilalala.com/ephemeral: "true"
    spec:
      instances: 1
      imageName: $(kubectl -n "$SRC_NS" get cluster "$SRC" -o jsonpath='{.spec.imageName}')
      storage:
        size: 20Gi
        storageClass: iscsi
      bootstrap:
        recovery:
          source: src
      externalClusters:
        - name: src
          barmanObjectStore:
            destinationPath: s3://homelab-backups-REPLACE-ME/${SRC_NS}/postgres
            endpointURL: https://s3.eu-central-1.amazonaws.com
            serverName: $SRC
            s3Credentials:
              accessKeyId:
                name: s3-backup
                key: ACCESS_KEY_ID
              secretAccessKey:
                name: s3-backup
                key: ACCESS_SECRET_KEY
            wal:
              maxParallel: 4
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    EOF

    echo "--- waiting for restore (up to 30m) ---"
    if ! kubectl -n backup-verify wait --for=condition=Ready \
         "cluster/$TARGET" --timeout=30m; then
      echo "FAIL: restored cluster never became ready"
      kubectl -n backup-verify describe cluster "$TARGET" | tail -40
      kubectl -n backup-verify logs "job/${TARGET}-1-full-recovery" --tail=60 2>/dev/null || true
      exit 1
    fi

    POD="${TARGET}-1"

    echo "--- assertion 1: server answers queries ---"
    kubectl -n backup-verify exec "$POD" -- psql -U postgres -d app -tAc 'SELECT 1' | grep -q 1

    echo "--- assertion 2: schema is populated (>= $MIN_TABLES tables) ---"
    tables=$(kubectl -n backup-verify exec "$POD" -- psql -U postgres -d app -tAc \
      "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
    echo "    tables found: $tables"
    [ "$tables" -ge "$MIN_TABLES" ] || {
      echo "FAIL: expected >= $MIN_TABLES tables, found $tables."
      echo "      A restore that yields an EMPTY schema is the classic silent"
      echo "      backup failure -- the restore 'succeeds' with no data."
      exit 1
    }

    echo "--- assertion 3: no relation is unreadable (catches corruption) ---"
    kubectl -n backup-verify exec "$POD" -- psql -U postgres -d app -tAc \
      "DO \$\$ DECLARE r record; n bigint; BEGIN
         FOR r IN SELECT schemaname, tablename FROM pg_tables
                  WHERE schemaname='public' LIMIT 50 LOOP
           EXECUTE format('SELECT count(*) FROM %I.%I', r.schemaname, r.tablename) INTO n;
         END LOOP;
       END \$\$;"

    # Informational, not asserted: Immich needs its vector extension
    # (pgvecto.rs today, VectorChord after the migration) to boot. Printing the
    # list makes an extension regression visible in the job log.
    echo "--- assertion 4: extensions present ---"
    kubectl -n backup-verify exec "$POD" -- psql -U postgres -d app -tAc \
      'SELECT extname FROM pg_extension' | sort | sed 's/^/    /'

    echo
    echo "PASS: $SRC restored and verified"
