apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-verify-files
  namespace: backup-verify
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 8
  jobTemplate:
    spec:
      activeDeadlineSeconds: 10800
      backoffLimit: 0
      template:
        spec:
          containers:
          - command:
            - /bin/sh
            - /scripts/run-all-files.sh
            env:
            - name: RESTIC_CACHE_DIR
              value: /scratch/.cache
            envFrom:
            - secretRef:
                name: s3-backup
            image: restic/restic:0.19.0
            name: verify
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 100m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - mountPath: /scripts
              name: scripts
            - mountPath: /scratch
              name: scratch
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - configMap:
              defaultMode: 493
              name: backup-verify-files-scripts
            name: scripts
          - name: scratch
            persistentVolumeClaim:
              claimName: backup-verify-scratch
  schedule: 0 7 * * 0
  successfulJobsHistoryLimit: 4
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-verify-postgres
  namespace: backup-verify
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 8
  jobTemplate:
    spec:
      activeDeadlineSeconds: 10800
      backoffLimit: 0
      template:
        spec:
          containers:
          - command:
            - /bin/bash
            - /scripts/run-all.sh
            image: bitnami/kubectl:1.31.2
            name: verify
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            volumeMounts:
            - mountPath: /scripts
              name: scripts
          restartPolicy: Never
          serviceAccountName: backup-verify
          volumes:
          - configMap:
              defaultMode: 493
              name: backup-verify-scripts
            name: scripts
  schedule: 0 5 * * 0
  successfulJobsHistoryLimit: 4
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: kube-prometheus-stack
  name: backup-health
  namespace: backup-verify
spec:
  groups:
  - name: backup.rules
    rules:
    - alert: BackupVerificationFailed
      annotations:
        description: 'A weekly restore test failed. This means a backup may not be
          restorable. Treat as data-loss risk, not as a flaky job. Runbook: docs/backups.md#when-verification-fails'
        summary: Backup restore verification FAILED ({{ $labels.job_name }})
      expr: |
        kube_job_status_failed{namespace="backup-verify"} > 0
      for: 15m
      labels:
        severity: critical
    - alert: BackupVerificationStale
      annotations:
        description: The verification CronJob has not completed successfully for two
          weeks. Either it is not running, or every run is failing.
        summary: No successful backup verification in 14 days
      expr: |
        time() - max(kube_job_status_completion_time{namespace="backup-verify"}) > 14 * 24 * 3600
      for: 1h
      labels:
        severity: critical
    - alert: PostgresBackupFailed
      annotations:
        summary: CloudNativePG backup failing for {{ $labels.namespace }}/{{ $labels.pod
          }}
      expr: |
        cnpg_collector_last_failed_backup_timestamp > cnpg_collector_last_available_backup_timestamp
      for: 30m
      labels:
        severity: critical
    - alert: PostgresBackupStale
      annotations:
        description: Nightly base backups run at 02:30. More than 36h without one
          means two consecutive failures.
        summary: No Postgres base backup in 36h ({{ $labels.namespace }})
      expr: |
        time() - cnpg_collector_last_available_backup_timestamp > 36 * 3600
      for: 1h
      labels:
        severity: critical
    - alert: PostgresWALArchiveFailing
      annotations:
        description: Point-in-time recovery is broken while this fires, and WAL will
          accumulate on the data volume until it fills. This can take the database
          down on its own.
        summary: WAL archiving failing ({{ $labels.namespace }})
      expr: |
        cnpg_collector_pg_stat_archiver_failed_count > 0
      for: 15m
      labels:
        severity: critical
    - alert: FileBackupJobFailed
      annotations:
        summary: 'File backup job failing: {{ $labels.namespace }}/{{ $labels.job_name
          }}'
      expr: |
        kube_job_status_failed{job_name=~".*-backup-.*"} > 0
      for: 30m
      labels:
        severity: warning
