apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-verify-scratch
  namespace: backup-verify
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: iscsi
