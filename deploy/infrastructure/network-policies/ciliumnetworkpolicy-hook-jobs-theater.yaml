apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hook-jobs
  namespace: theater
spec:
  description: 'The Argo CD hook Jobs: presync-backup reads backup status from the
    Kubernetes API, postsync-smoke calls each app once after a sync.'
  egress:
