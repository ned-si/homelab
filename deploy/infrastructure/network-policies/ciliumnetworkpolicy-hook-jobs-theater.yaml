        protocol: TCP
      - port: "8096"
        protocol: TCP
      - port: "5299"
        protocol: TCP
      - port: "8686"
        protocol: TCP
      - port: "32400"
        protocol: TCP
      - port: "9696"
        protocol: TCP
      - port: "8080"
        protocol: TCP
      - port: "7878"
        protocol: TCP
      - port: "8989"
        protocol: TCP
      - port: "4180"
        protocol: TCP
  enableDefaultDeny:
    egress: false
    ingress: false
  endpointSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
