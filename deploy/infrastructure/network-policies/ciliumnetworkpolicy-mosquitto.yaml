---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mosquitto
  namespace: home
spec:
  description: 'Mosquitto: MQTT from Home Assistant and Zigbee2MQTT only.'
  enableDefaultDeny:
    egress: false
    ingress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  ingress:
  - fromEndpoints:
    - matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
        - home-assistant
        - zigbee2mqtt
    toPorts:
    - ports:
      - port: "1883"
        protocol: TCP
