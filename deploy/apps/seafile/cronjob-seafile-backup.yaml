# Source:     apps/seafile
# Regenerate: task render     (scripts/render-deploy.sh)
#
# Edit the kustomization in apps/seafile and re-render. Editing this file
# directly will be reverted by the next render and rejected by CI.
# ---------------------------------------------------------------------------
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: seafile-backup
  namespace: seafile
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 72000
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: seafile-backup
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: seafile
                topologyKey: kubernetes.io/hostname
          containers:
          - args:
            - |
              restic init 2>/dev/null || true

              # 1. The database dump. Small, consistent, and the half
              #    without which the blobs are meaningless -- so it goes
              #    first, in its own snapshot, so it can be restored without
              #    pulling 100GB of blobs out of Glacier to get at it.
              restic backup /dumps \
                --tag seafile-shared \
                --tag seafile-mariadb \
                --host seafile \
                --verbose

              # 2. /shared: the blobs, and Seafile's own configuration.
              #
              #    Excludes are all genuinely derived or transient:
              #      logs/           app logs
              #      *-data/httptemp uploads in flight
              #      seahub-data/thumbnail
              #                      regenerated from the originals
              #      pro-data        search index (Pro only; harmless if
              #                      absent)
              restic backup /shared \
                --tag seafile-shared \
                --tag seafile-data \
                --host seafile \
                --exclude '/shared/logs' \
                --exclude '**/httptemp/**' \
                --exclude '**/seahub-data/thumbnail/**' \
                --exclude '**/pro-data/**' \
                --verbose

              restic check --with-cache
            command:
            - /bin/sh
            - -euo
            - pipefail
            - -c
            env:
            - name: RESTIC_REPOSITORY
              value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/seafile/shared
            - name: RESTIC_CACHE_DIR
              value: /cache
            - name: TMPDIR
              value: /cache
            envFrom:
            - secretRef:
                name: s3-backup
            image: restic/restic:0.19.1
            imagePullPolicy: IfNotPresent
            name: restic
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 200m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /shared
              name: data
              readOnly: true
            - mountPath: /dumps
              name: dumps
              readOnly: true
            - mountPath: /cache
              name: cache
          initContainers:
          - args:
            - |
              # `bash -c` with an explicit status check rather than `set -e`:
              # the pipeline's exit status is what matters and it is checked
              # directly below.
              set -uo pipefail

              # --single-transaction   InnoDB-consistent snapshot with no
              #                        table locks, so Seafile keeps working.
              # --routines --events --triggers
              #                        the default omits all three, and
              #                        their absence only shows up at
              #                        restore time.
              # --databases            names them explicitly so a fourth
              #                        database appearing later is a visible
              #                        omission rather than a silent one.
              mariadb-dump \
                -h mariadb -u root -p"$MARIADB_ROOT_PASSWORD" \
                --single-transaction --routines --events --triggers \
                --databases ccnet_db seafile_db seahub_db \
                | gzip -c > /dumps/seafile-mariadb.sql.gz
              rc=$?

              if [ "$rc" -ne 0 ]; then
                echo "FAIL: mariadb-dump pipeline exited $rc"
                # Delete the partial file. Without this, restic uploads a
                # truncated dump that restores to nothing -- and the
                # snapshot looks complete.
                rm -f /dumps/seafile-mariadb.sql.gz
                exit "$rc"
              fi

              # mariadb-dump writes a completion marker as its final line.
              # Its absence is the ONLY way to detect a dump that died
              # halfway while still exiting 0 -- the same check
              # scripts/dump-databases.sh makes, for the same reason.
              if ! gzip -dc /dumps/seafile-mariadb.sql.gz | tail -3 | grep -q 'Dump completed'; then
                echo "FAIL: dump has no end-of-dump marker -- it is truncated"
                rm -f /dumps/seafile-mariadb.sql.gz
                exit 1
              fi

              echo "ok: $(du -h /dumps/seafile-mariadb.sql.gz | cut -f1), end marker present"
            command:
            - /bin/bash
            - -c
            env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: root-password
                  name: seafile-db
            image: mariadb:10.11
            imagePullPolicy: IfNotPresent
            name: mariadb-dump
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /dumps
              name: dumps
          restartPolicy: OnFailure
          securityContext:
            runAsGroup: 0
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: seafile-pvc
              readOnly: true
          - emptyDir:
              sizeLimit: 4Gi
            name: dumps
          - emptyDir:
              sizeLimit: 2Gi
            name: cache
  schedule: 0 3 * * *
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  suspend: false
