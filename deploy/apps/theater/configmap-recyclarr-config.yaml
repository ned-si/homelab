---
apiVersion: v1
data:
  recyclarr.yml: |
    # Base URLs are in-cluster Service addresses. They are not credentials, so
    # they live here in plaintext; the API keys come from the
    # `recyclarr-api-keys` Secret via envFrom. See
    # apps/secrets/recyclarr-api-keys.sops.yaml.example.
    #
    # The FQDN form rather than a bare `http://sonarr:8989`: this pod is in the
    # same namespace so the short name would resolve, but the explicit form
    # matches what docs/runbooks/subtitles.md tells you to paste into Bazarr and
    # is one less thing that differs between two places.
    sonarr:
      series:
        base_url: http://sonarr.theater.svc.cluster.local:8989
        api_key: !env_var SONARR_API_KEY

        # Quality definitions: the size limits per resolution.
        quality_definition:
          type: series
        # TRaSH guide profiles with their default custom-format groups and
        # scores (upstream templates web-1080p and
        # french-multi-vf-bluray-web-1080p); only the name is overridden.
        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
            name: HD-Original
            reset_unmatched_scores:
              enabled: true
          - trash_id: 58e8dc75731040612dd6f4ac0676bfd7  # [French MULTi.VF] HD Bluray + WEB (1080p)
            name: HD-Kids-FR
            reset_unmatched_scores:
              enabled: true

    radarr:
      movies:
        base_url: http://radarr.theater.svc.cluster.local:7878
        api_key: !env_var RADARR_API_KEY

        quality_definition:
          type: movie
        # Upstream templates hd-bluray-web and french-multi-vf-hd-bluray-web.
        quality_profiles:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
            name: HD-Original
            reset_unmatched_scores:
              enabled: true
          - trash_id: 500ecc23572575511fd81893777d1e06  # [French MULTi.VF] HD Bluray + WEB
            name: HD-Kids-FR
            reset_unmatched_scores:
              enabled: true

    # Lidarr is deliberately absent. Recyclarr supports it, but the TRaSH music
    # guides are far less settled than the TV and film ones, and Lidarr here has
    # no reported problem to fix. Adding it would be change for its own sake.
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: theater
