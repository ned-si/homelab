---
apiVersion: v1
data:
  recyclarr.yml: |
    # Base URLs are in-cluster Service addresses. They are not credentials, so
    # they live here in plaintext; the API keys come from the
    # `recyclarr-api-keys` Secret via envFrom. See
    # apps/secrets/recyclarr-api-keys.sops.yaml.example.
    #
    # The FQDN form rather than a bare `http://sonarr:8989`: this pod is in the
    # same namespace so the short name would resolve, but the explicit form
    # matches what docs/runbooks/subtitles.md tells you to paste into Bazarr and
    # is one less thing that differs between two places.
    sonarr:
      series:
        base_url: http://sonarr.theater.svc.cluster.local:8989
        api_key: !env_var SONARR_API_KEY

        # Quality definitions: the size limits per resolution.
        quality_definition:
          type: series
        # TRaSH guide profiles with their default custom-format groups and
        # scores (upstream templates web-1080p and
        # french-multi-vf-bluray-web-1080p); only the name is overridden.
        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
            name: HD-Original
            reset_unmatched_scores:
              enabled: true
          - trash_id: 58e8dc75731040612dd6f4ac0676bfd7  # [French MULTi.VF] HD Bluray + WEB (1080p)
            name: HD-Kids-FR
            reset_unmatched_scores:
              enabled: true
        # Deviation from TRaSH (operator preference): TRaSH custom formats,
        # our scores. x265 (HD) keeps the TRaSH -10000, pinned here so it
        # stays a block if the guide changes. Bonuses stay below one release
        # group tier step plus the streaming bonus: preferences, never blocks.
        custom_formats:
          - trash_ids:
              - cddfb4e32db826151d97352b8e37c648  # x264
            assign_scores_to:
              - name: HD-Original
                score: 50
              - name: HD-Kids-FR
                score: 50
          - trash_ids:
              - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD)
            assign_scores_to:
              - name: HD-Original
                score: -10000
              - name: HD-Kids-FR
                score: -10000
          - trash_ids:
              - 3fbafa924f361e66fbc6187af82dfa85  # 5.1 Surround
              - 9fb6d778592c293467437593ef394bf1  # 6.1 Surround
              - 204c8c3e7315bb0ea81332774fa888d6  # 7.1 Surround
            assign_scores_to:
              - name: HD-Original
                score: 100
              - name: HD-Kids-FR
                score: 100

    radarr:
      movies:
        base_url: http://radarr.theater.svc.cluster.local:7878
        api_key: !env_var RADARR_API_KEY

        quality_definition:
          type: movie
        # Upstream templates hd-bluray-web and french-multi-vf-hd-bluray-web.
        quality_profiles:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
            name: HD-Original
            reset_unmatched_scores:
              enabled: true
          - trash_id: 500ecc23572575511fd81893777d1e06  # [French MULTi.VF] HD Bluray + WEB
            name: HD-Kids-FR
            reset_unmatched_scores:
              enabled: true
        # Same deviation as Sonarr; Radarr has its own trash_ids.
        custom_formats:
          - trash_ids:
              - 2899d84dc9372de3408e6d8cc18e9666  # x264
            assign_scores_to:
              - name: HD-Original
                score: 50
              - name: HD-Kids-FR
                score: 50
          - trash_ids:
              - dc98083864ea246d05a42df0d05f81cc  # x265 (HD)
            assign_scores_to:
              - name: HD-Original
                score: -10000
              - name: HD-Kids-FR
                score: -10000
          - trash_ids:
              - 77ff61788dfe1097194fd8743d7b4524  # 5.1 Surround
              - 6fd7b090c3f7317502ab3b63cc7f51e3  # 6.1 Surround
              - e77382bcfeba57cb83744c9c5449b401  # 7.1 Surround
            assign_scores_to:
              - name: HD-Original
                score: 100
              - name: HD-Kids-FR
                score: 100

    # Lidarr is deliberately absent. Recyclarr supports it, but the TRaSH music
    # guides are far less settled than the TV and film ones, and Lidarr here has
    # no reported problem to fix. Adding it would be change for its own sake.
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: theater
