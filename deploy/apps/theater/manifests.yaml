apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr-sync
  namespace: theater
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: recyclarr-sync
        spec:
          containers:
          - args:
            - sync
            env:
            - name: TZ
              value: Europe/Zurich
            - name: RECYCLARR_APP_DATA
              value: /config
            envFrom:
            - secretRef:
                name: recyclarr-api-keys
            image: ghcr.io/recyclarr/recyclarr:8.7.1
            imagePullPolicy: IfNotPresent
            name: recyclarr
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /config/recyclarr.yml
              name: config-file
              readOnly: true
              subPath: recyclarr.yml
            - mountPath: /config
              name: app-data
            - mountPath: /tmp
              name: tmp
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - configMap:
              name: recyclarr-config
            name: config-file
          - emptyDir:
              sizeLimit: 512Mi
            name: app-data
          - emptyDir:
              sizeLimit: 64Mi
            name: tmp
  schedule: 0 6 * * *
  successfulJobsHistoryLimit: 3
  suspend: true
---
