# ---------------------------------------------------------------------------
# GENERATED FILE -- DO NOT EDIT.
#
# Source:     apps/theater
# Regenerate: task render     (scripts/render-deploy.sh)
#
# Edit the kustomization in apps/theater and re-render. Editing this file
# directly will be reverted by the next render and rejected by CI.
# ---------------------------------------------------------------------------
---
apiVersion: v1
data:
  seed.sh: |
    # First start only: Bazarr fills every other key with its defaults.
    set -eu
    f=/config/config/config.yaml
    if [ -s "$f" ]; then
      echo "config.yaml exists, left to the settings Job"
      exit 0
    fi
    mkdir -p /config/config
    hash=$(printf '%s' "$ADMIN_PASSWORD" | md5sum | cut -d' ' -f1)
    cat > "$f" <<EOF
    general:
      base_url: /arr/bazarr
    auth:
      type: form
      username: admin
      password: $hash
      apikey: $API_KEY
    EOF
    echo "config.yaml seeded"
  settings.py: |
    # Idempotent. MODE=sync (PostSync): auto tags in Sonarr and Radarr, the
    # Bazarr settings, the profile of every title. MODE=nightly (CronJob):
    # the profile of every title, then the wanted searches. Standard library
    # only.
    import json, os, time, urllib.parse, urllib.request

    MODE = os.environ.get("MODE", "sync")
    KIDS_PROFILE = "HD-Kids-FR"
    SPANISH = "Spanish"
    # No account needed. Podnapisi is no longer in Bazarr 1.6.
    PROVIDERS = ["gestdown", "tvsubtitles", "yifysubtitles", "subtitulamostv", "subtis",
                 "soustitreseu", "subsynchro"]
    LANG = lambda i, code, forced: {"id": i, "language": code, "forced": forced,
                                   "hi": "False", "audio_exclude": "False",
                                   "audio_only_include": "False"}
    def profile(pid, name, tag, *langs):
        items = [LANG(i + 1, code, forced) for i, (code, forced) in enumerate(langs)]
        return {"profileId": pid, "name": name, "cutoff": None, "tag": tag, "items": items,
                "mustContain": [], "mustNotContain": [], "originalFormat": 0}
    EN, FR, FRF, ES = ("en", "False"), ("fr", "False"), ("fr", "True"), ("es", "False")
    PROFILES = [
        profile(1, "en-fr", None, EN, FR),
        profile(2, "kids-fr-es", "kids-fr-es", EN, FR, FRF, ES),
        profile(3, "kids-fr", "kids-fr", EN, FR, FRF),
        profile(4, "en-fr-es", "orig-es", EN, FR, ES),
    ]
    # (kids, Spanish original) -> profile ID
    PROFILE_OF = {(False, False): 1, (True, True): 2, (True, False): 3, (False, True): 4}
    # Bazarr's "never" for its own interval search; bazarr-nightly starts it.
    ONE_HUNDRED_YEARS_IN_HOURS = "876000"

    def call(method, url, key_header, key, body=None, form=None):
        headers = {key_header: key}
        data = None
        if body is not None:
            data = json.dumps(body).encode()
            headers["Content-Type"] = "application/json"
        if form is not None:
            data = urllib.parse.urlencode(form, doseq=True).encode()
            headers["Content-Type"] = "application/x-www-form-urlencoded"
        req = urllib.request.Request(url, data=data, method=method, headers=headers)
        # Long: a profile change makes Bazarr recompute what is missing for
        # the whole library before it answers.
        with urllib.request.urlopen(req, timeout=600) as r:
            raw = r.read()
            return json.loads(raw) if raw else None

    def wait(url):
        for _ in range(60):
            try:
                urllib.request.urlopen(url, timeout=10)
                return
            except Exception:
                time.sleep(10)
        raise SystemExit(f"not answering: {url}")

    def auto_tags(name, base, key):
        h = "X-Api-Key"
        api = f"{base}/api/v3"
        kids = next(p["id"] for p in call("GET", f"{api}/qualityprofile", h, key)
                    if p["name"] == KIDS_PROFILE)
        schema = call("GET", f"{api}/autotagging/schema", h, key)
        lang_spec = next(s for s in schema if s["implementation"] == "OriginalLanguageSpecification")
        spanish = next(o["value"] for o in lang_spec["fields"][0]["selectOptions"] if o["name"] == SPANISH)
        spec_kids = {"name": KIDS_PROFILE, "implementation": "QualityProfileSpecification",
                     "negate": False, "required": True, "fields": [{"name": "value", "value": kids}]}
        spec_es = {"name": SPANISH, "implementation": "OriginalLanguageSpecification",
                   "negate": False, "required": True, "fields": [{"name": "value", "value": spanish}]}
        tags = {t["label"]: t["id"] for t in call("GET", f"{api}/tag", h, key)}
        rules = {r["name"]: r for r in call("GET", f"{api}/autotagging", h, key)}
        for tag, rule_name, specs in (("kids-fr", "kids-fr (Bazarr FR)", [spec_kids]),
                                      ("orig-es", "orig-es (Bazarr ES)", [spec_es]),
                                      ("kids-fr-es", "kids-fr-es (Bazarr FR+ES)", [spec_kids, spec_es])):
            if tag not in tags:
                tags[tag] = call("POST", f"{api}/tag", h, key, {"label": tag})["id"]
            rule = {"name": rule_name, "removeTagsAutomatically": True, "tags": [tags[tag]],
                    "specifications": specs}
            old = rules.get(rule_name)
            if old is None:
                call("POST", f"{api}/autotagging", h, key, rule)
            else:
                call("PUT", f"{api}/autotagging/{old['id']}", h, key, dict(rule, id=old["id"]))
        print(f"{name}: auto tags kids-fr ({KIDS_PROFILE}), orig-es ({SPANISH}), kids-fr-es (both)")

    def wanted_profiles(base, key, kind):
        # {*arr ID: Bazarr profile ID}, from the quality profile and the
        # original language: no wait for the *arr to apply its auto tags.
        h = "X-Api-Key"
        kids = next(p["id"] for p in call("GET", f"{base}/api/v3/qualityprofile", h, key)
                    if p["name"] == KIDS_PROFILE)
        out = {}
        for item in call("GET", f"{base}/api/v3/{kind}", h, key):
            es = (item.get("originalLanguage") or {}).get("name") == SPANISH
            out[item["id"]] = PROFILE_OF[(item["qualityProfileId"] == kids, es)]
        return out

    def assign(kind, id_field, form_id, want):
        # Only the titles whose profile differs; Bazarr recomputes what is
        # missing for each.
        items = call("GET", f"{bazarr}/api/{kind}?length=-1", "X-API-KEY", bkey)["data"]
        todo = [(i[id_field], want[i[id_field]]) for i in items
                if i[id_field] in want and i["profileId"] != want[i[id_field]]]
        for n in range(0, len(todo), 50):
            chunk = todo[n:n + 50]
            call("POST", f"{bazarr}/api/{kind}", "X-API-KEY", bkey,
                 form={form_id: [c[0] for c in chunk], "profileid": [str(c[1]) for c in chunk]})
        counts = {}
        for pid in want.values():
            counts[pid] = counts.get(pid, 0) + 1
        names = {p["profileId"]: p["name"] for p in PROFILES}
        print(f"bazarr: {kind} profiles set, {len(todo)} changed; "
              + ", ".join(f"{names[p]} {n}" for p, n in sorted(counts.items())))

    sonarr = "http://sonarr.theater.svc.cluster.local:8989/arr/sonarr"
    radarr = "http://radarr.theater.svc.cluster.local:7878/arr/radarr"
    bazarr = "http://bazarr.theater.svc.cluster.local:6767/arr/bazarr"
    skey, rkey, bkey = os.environ["SONARR_API_KEY"], os.environ["RADARR_API_KEY"], os.environ["API_KEY"]
    if MODE == "sync":
        auto_tags("sonarr", sonarr, skey)
        auto_tags("radarr", radarr, rkey)

    wait(f"{bazarr}/api/system/ping")
    if MODE == "nightly":
        assign("series", "sonarrSeriesId", "seriesid", wanted_profiles(sonarr, skey, "series"))
        assign("movies", "radarrId", "radarrid", wanted_profiles(radarr, rkey, "movie"))
        # Bazarr runs each search in the background, one at a time, and
        # pauses providers that rate-limit.
        for task in ("wanted_search_missing_subtitles_series", "wanted_search_missing_subtitles_movies"):
            call("POST", f"{bazarr}/api/system/tasks", "X-API-KEY", bkey, form={"taskid": task})
        print("bazarr: wanted searches started (series, movies)")
        raise SystemExit(0)

    form = {
        "languages-enabled": ["en", "fr", "es"],
        "languages-profiles": json.dumps(PROFILES),
        "settings-general-base_url": "/arr/bazarr",
        "settings-general-use_sonarr": "true",
        "settings-general-use_radarr": "true",
        "settings-sonarr-ip": "sonarr.theater.svc.cluster.local",
        "settings-sonarr-port": "8989",
        "settings-sonarr-base_url": "/arr/sonarr",
        "settings-sonarr-ssl": "false",
        "settings-sonarr-apikey": os.environ["SONARR_API_KEY"],
        "settings-radarr-ip": "radarr.theater.svc.cluster.local",
        "settings-radarr-port": "7878",
        "settings-radarr-base_url": "/arr/radarr",
        "settings-radarr-ssl": "false",
        "settings-radarr-apikey": os.environ["RADARR_API_KEY"],
        "settings-general-serie_default_enabled": "true",
        "settings-general-serie_default_profile": "1",
        "settings-general-movie_default_enabled": "true",
        "settings-general-movie_default_profile": "1",
        "settings-general-serie_tag_enabled": "true",
        "settings-general-movie_tag_enabled": "true",
        "settings-general-enabled_providers": PROVIDERS,
        # Embedded text subtitles count as present; bitmaps (PGS, VobSub) do
        # not, so Bazarr fetches a text one that Plex does not burn in.
        "settings-general-use_embedded_subs": "true",
        "settings-general-ignore_pgs_subs": "true",
        "settings-general-ignore_vobsub_subs": "true",
        "settings-general-ignore_ass_subs": "false",
        "settings-general-wanted_search_frequency": ONE_HUNDRED_YEARS_IN_HOURS,
        "settings-general-wanted_search_frequency_movie": ONE_HUNDRED_YEARS_IN_HOURS,
        # External files next to the video, named <video>.<lang>[.forced].srt.
        "settings-general-subfolder": "current",
        "settings-general-utf8_encode": "true",
        "settings-auth-type": "form",
        "settings-auth-username": "admin",
        "settings-auth-password": os.environ["ADMIN_PASSWORD"],
    }
    call("POST", f"{bazarr}/api/system/settings", "X-API-KEY", bkey, form=form)
    print("bazarr: settings applied, profiles " + ", ".join(p["name"] for p in PROFILES)
          + f", providers {', '.join(PROVIDERS)}")
    assign("series", "sonarrSeriesId", "seriesid", wanted_profiles(sonarr, skey, "series"))
    assign("movies", "radarrId", "radarrid", wanted_profiles(radarr, rkey, "movie"))
kind: ConfigMap
metadata:
  name: bazarr-config
  namespace: theater
