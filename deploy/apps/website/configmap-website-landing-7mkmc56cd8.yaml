  landing.css: |
    :root {
      --fg: #1d1f21;
      --muted: #5c6166;
      --bg: #fdfdfc;
      --card-bg: #f3f4f5;
      --link: #0b5cad;
      --rule: #d8dadc;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e3e5e7;
        --muted: #a0a6ab;
        --bg: #17191b;
        --card-bg: #212427;
        --link: #79b8ff;
        --rule: #34383c;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0 auto;
      max-width: 60rem;
      padding: 3rem 1.25rem;
      color: var(--fg);
      background: var(--bg);
      font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    a { color: var(--link); }

    h1 { margin: 0; font-size: 2.5rem; }
    h2 { margin: 3rem 0 1rem; font-size: 1.375rem; }
    h3 { margin: 0.25rem 0 0.5rem; font-size: 1.125rem; }

    .lead { margin: 0.5rem 0 0; color: var(--muted); font-size: 1.25rem; }

    .blocks, .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
      gap: 1rem 1.5rem;
    }

    .blocks h2 { margin: 2.5rem 0 0.25rem; font-size: 1.125rem; }
    .blocks p { margin: 0; }

    .card {
      display: flex;
      flex-direction: column;
      padding: 1rem 1.25rem;
      border: 1px solid var(--rule);
      border-radius: 0.4rem;
      background: var(--card-bg);
    }

    .card p { margin: 0 0 0.75rem; }
    .card > :last-child { margin-top: auto; font-weight: 600; }

    .label {
      color: var(--muted);
      font-size: 0.8125rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .soon { color: var(--muted); }

    .todo { border-style: dashed; }

    footer {
      margin-top: 3rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 0.875rem;
    }
