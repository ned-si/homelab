    <li value="71" id="entry-paperless-ngx"><a href="https://github.com/ned-si/homelab/tree/main/apps/paperless">Paperless-ngx</a>: Scanned documents, searchable.</li>
    <li value="72" id="entry-plex"><a href="https://github.com/ned-si/homelab/blob/main/apps/theater/plex.yaml">Plex</a>: Films and series on the TVs, off SSO so the TV apps sign in.</li>
    <li value="73" id="entry-postgresql"><a href="https://github.com/ned-si/homelab/blob/main/docs/backups.md">PostgreSQL</a>: The one database engine, run by CloudNativePG.</li>
    <li value="74" id="entry-prometheus"><a href="https://github.com/ned-si/homelab/blob/main/docs/observability.md">Prometheus</a>: Metrics for 30 days, the SLOs as recording rules.</li>
    <li value="75" id="entry-restic"><a href="https://github.com/ned-si/homelab/blob/main/docs/backups.md">restic</a>: File backups to S3 and the NAS, restore-tested weekly.</li>
    <li value="76" id="entry-syncthing"><a href="https://github.com/ned-si/homelab/tree/main/apps/syncthing">Syncthing</a>: Device sync without a cloud in the middle.</li>
    <li value="77" id="entry-tuppr"><a href="https://github.com/ned-si/homelab/blob/main/docs/talos.md#upgrades">tuppr</a>: Talos and Kubernetes upgrades rolled out node by node.</li>
    <li value="78" id="entry-vector"><a href="https://github.com/ned-si/homelab/blob/main/docs/observability.md#logs">Vector</a>: Pod and Talos logs shipped as structured events.</li>
    <li value="79" id="entry-zigbee2mqtt"><a href="https://github.com/ned-si/homelab/blob/main/apps/home/zigbee2mqtt.yaml">Zigbee2MQTT</a>: Zigbee devices on MQTT, no vendor hub.</li>
    </ol>
    <h3 class="ring-trial">Trial</h3>
    <ol>
    <li value="80" id="entry-jamulus"><a href="https://github.com/ned-si/homelab/blob/main/docs/jamulus.md">Jamulus</a> <span class="moved">(new)</span>: Rehearsing together from different places, unlisted on the home line.</li>
    <li value="81" id="entry-signoz"><a href="https://github.com/ned-si/homelab/issues/801">SigNoz</a>: Logs on ClickHouse, on trial as the one place for signals.</li>
    <li value="82" id="entry-tetragon"><a href="https://github.com/ned-si/homelab/blob/main/docs/observability.md#runtime-tetragon">Tetragon</a>: Runtime detection that pages on critical events; nothing is blocked yet.</li>
    </ol>
    <h3 class="ring-assess">Assess</h3>
    <ol>
    <li value="83" id="entry-crowdsec"><a href="https://github.com/ned-si/homelab/issues/1676">CrowdSec</a>: A shared blocklist at the Gateway; not evaluated yet.</li>
    <li value="84" id="entry-honeycomb-and-obi"><a href="https://github.com/ned-si/homelab/issues/734">Honeycomb and OBI</a>: Traces from eBPF instrumentation, compared with SigNoz.</li>
    <li value="85" id="entry-keda"><a href="https://github.com/ned-si/homelab/issues/917">KEDA</a>: Event-driven scaling, with the HA work.</li>
    <li value="86" id="entry-openbao-with-external-secrets"><a href="https://github.com/ned-si/homelab/issues/713">OpenBao with External Secrets</a>: Cluster-owned secrets issued, not stored.</li>
    <li value="87" id="entry-shirudo"><a href="https://github.com/ned-si/homelab/issues/1628">Shirudo</a>: eBPF shields for unpatched code paths, once arm64 and Talos fit.</li>
    <li value="88" id="entry-umami"><a href="https://github.com/ned-si/homelab/tree/main/.kiro/specs/public-website">Umami</a>: Cookieless statistics, chosen and not deployed yet.</li>
    </ol>
    <h3 class="ring-hold">Hold</h3>
    <ol>
    <li value="89" id="entry-dex-in-argo-cd"><a href="https://github.com/ned-si/homelab/issues/969">Dex in Argo CD</a>: Unused: Argo CD signs in with Keycloak directly.</li>
    <li value="90" id="entry-loki"><a href="https://github.com/ned-si/homelab/blob/main/docs/observability.md#why-it-is-like-this">Loki</a>: Indexes labels only; the fallback if the SigNoz trial fails.</li>
    <li value="91" id="entry-policy-reporter-ui"><a href="https://github.com/ned-si/homelab/tree/main/.kiro/specs/wave3-runtime-security">Policy Reporter UI</a>: Grafana is the one view for policy reports.</li>
    <li value="92" id="entry-seafile"><a href="https://github.com/ned-si/homelab/blob/main/docs/decisions.md#seafile-removed">Seafile</a>: Removed: Syncthing and Paperless-ngx cover its uses.</li>
    <li value="93" id="entry-service-mesh"><a href="https://github.com/ned-si/homelab/blob/main/docs/decisions.md#no-service-mesh">Service mesh</a>: Cilium already gives the policies and the flows, without sidecars.</li>
    <li value="94" id="entry-sonobus"><a href="https://github.com/ned-si/homelab/issues/1702">SonoBus</a> <span class="moved">(new)</span>: Peer to peer: each player sends to every other; a central server suits the cluster.</li>
    </ol>
    </section>
    <section aria-labelledby="q-infrastructure">
    <h2 id="q-infrastructure">Infrastructure</h2>
    <h3 class="ring-adopt">Adopt</h3>
    <ol>
    <li value="95" id="entry-aws-s3"><a href="https://github.com/ned-si/homelab/blob/main/docs/backups.md#the-bucket">AWS S3</a>: Off-site backups with locked object versions.</li>
    <li value="96" id="entry-cilium"><a href="https://github.com/ned-si/homelab/blob/main/docs/networking.md">Cilium</a>: kube-proxy replacement, LB-IPAM, L2 announcements and the Gateway.</li>
    <li value="97" id="entry-cloudflare-dns"><a href="https://github.com/ned-si/homelab/blob/main/docs/networking.md#dns">Cloudflare DNS</a>: Free zones, DNS-01 for certificates, DNS only.</li>
    <li value="98" id="entry-democratic-csi"><a href="https://github.com/ned-si/homelab/blob/main/docs/architecture.md">democratic-csi</a>: iSCSI volumes from the NAS on demand, Retain for data.</li>
    <li value="99" id="entry-gateway-api"><a href="https://github.com/ned-si/homelab/blob/main/docs/networking.md#gateway">Gateway API</a>: One shared Gateway for every public name.</li>
    <li value="100" id="entry-kubernetes"><a href="https://github.com/ned-si/homelab/blob/main/docs/architecture.md#cluster">Kubernetes</a>: One API for every workload, run on Talos.</li>
    <li value="101" id="entry-tailscale"><a href="https://github.com/ned-si/homelab/blob/main/docs/remote-access.md">Tailscale</a>: kubectl and talosctl only over the tailnet.</li>
    <li value="102" id="entry-talos-linux"><a href="https://github.com/ned-si/homelab/blob/main/docs/talos.md">Talos Linux</a>: Immutable, API-only nodes with the machine config in git.</li>
    <li value="103" id="entry-truenas-scale"><a href="https://github.com/ned-si/homelab/tree/main/.kiro/specs/nas-on-truenas-scale">TrueNAS SCALE</a>: The NAS: ZFS, iSCSI and NFS, driven by its API.</li>
    </ol>
    <h3 class="ring-trial">Trial</h3>
    <ol>
    <li value="104" id="entry-turing-pi-2-with-rk1"><a href="https://github.com/ned-si/homelab/issues/985">Turing Pi 2 with RK1</a>: Four quiet arm64 nodes on one board, which is a single point of failure.</li>
    </ol>
    <h3 class="ring-assess">Assess</h3>
    <ol>
    <li value="105" id="entry-nvme-per-node"><a href="https://github.com/ned-si/homelab/issues/738">NVMe per node</a>: Revisit from the eMMC wear trend.</li>
    <li value="106" id="entry-selinux-enforcing-on-the-nodes"><a href="https://github.com/ned-si/homelab/issues/737">SELinux enforcing on the nodes</a>: Another layer under the pods.</li>
    </ol>
    <h3 class="ring-hold">Hold</h3>
    <ol>
    <li value="107" id="entry-cloudflare-proxy-and-pages"><a href="https://github.com/ned-si/homelab/blob/main/.kiro/specs/public-website/design.md">Cloudflare proxy and Pages</a>: A token with account write access and data pushed out of the house.</li>
    <li value="108" id="entry-github-pages"><a href="https://github.com/ned-si/homelab/blob/main/.kiro/specs/public-website/design.md">GitHub Pages</a>: Cannot set a CSP header for the public site.</li>
    <li value="109" id="entry-ingress-nginx"><a href="https://github.com/ned-si/homelab/blob/main/docs/networking.md#why-it-is-like-this">ingress-nginx</a>: Retired upstream; the Cilium Gateway replaced it.</li>
    <li value="110" id="entry-kube-vip"><a href="https://github.com/ned-si/homelab/blob/main/docs/networking.md#why-it-is-like-this">kube-vip</a>: Talos holds the API VIP itself.</li>
    <li value="111" id="entry-kubeadm"><a href="https://github.com/ned-si/homelab/blob/main/docs/decisions.md#talos-built-as-a-new-cluster">kubeadm</a>: The old cluster; rebuilt on Talos.</li>
    <li value="112" id="entry-truenas-core"><a href="https://github.com/ned-si/homelab/issues/1305">TrueNAS CORE</a>: Replaced by SCALE in November 2026.</li>
    </ol>
    </section>
    </div>
    </main>
    <footer class="site">
    <p><a href="https://blog.nedsi.io/privacy/">Privacy</a>.</p>
    </footer>
