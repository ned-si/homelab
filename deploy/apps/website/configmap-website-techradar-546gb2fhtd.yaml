    <section aria-labelledby="q-techniques">
    <h2 id="q-techniques">Techniques</h2>
    <h3 class="ring-adopt">Adopt</h3>
    <ol>
    <li value="1" id="entry-agent-written-pull-requests"><a href="https://github.com/ned-si/homelab/blob/main/docs/spec-driven-development.md">Agent-written pull requests</a>: Agents implement through PRs; CI and the specs keep them honest.</li>
    <li value="2" id="entry-automatic-rollback"><a href="https://github.com/ned-si/homelab/blob/main/docs/decisions.md#automatic-rollback">Automatic rollback</a>: A merge that degrades an app is reverted, with an outage guard.</li>
    <li value="3" id="entry-ci-as-the-only-gate"><a href="https://github.com/ned-si/homelab/blob/main/docs/decisions.md#no-human-gates">CI as the only gate</a>: No human approval: green CI merges, a degraded app is reverted.</li>
    <li value="4" id="entry-database-majors-fix-forward"><a href="https://github.com/ned-si/homelab/blob/main/docs/decisions.md#database-majors-fix-forward">Database majors fix forward</a>: A Postgres major is a one-way door: fresh backup, then forward.</li>
    <li value="5" id="entry-deterministic-first"><a href="https://github.com/ned-si/homelab/blob/main/docs/decisions.md#deterministic-first">Deterministic first</a>: Scripts, checks and thresholds decide; AI writes and summarises.</li>
    <li value="6" id="entry-dora-metrics"><a href="https://github.com/ned-si/homelab/tree/main/.kiro/specs/homelab-dashboard">DORA metrics</a>: Delivery measured from git, GitHub and alerts, live on the dashboard.</li>
    <li value="7" id="entry-gitops-main-is-production"><a href="https://github.com/ned-si/homelab/blob/main/docs/decisions.md#main-is-production">GitOps, main is production</a>: Merging deploys and a revert rolls back; Argo CD tracks main.</li>
    <li value="8" id="entry-images-pinned-by-digest"><a href="https://github.com/ned-si/homelab/blob/main/docs/testing.md">Images pinned by digest</a>: A tag can move; a digest cannot.</li>
    <li value="9" id="entry-keyless-signing-and-slsa-provenance"><a href="https://github.com/ned-si/homelab/tree/main/.kiro/specs/image-provenance">Keyless signing and SLSA provenance</a>: Own images signed by their workflow and checked by Kyverno.</li>
    <li value="10" id="entry-page-only-when-urgent-and-actionable"><a href="https://github.com/ned-si/homelab/blob/main/docs/sre.md">Page only when urgent and actionable</a>: Everything else is on a dashboard, never on the phone.</li>
    <li value="11" id="entry-rendered-manifests-in-git"><a href="https://github.com/ned-si/homelab/blob/main/docs/architecture.md">Rendered manifests in git</a>: Every object Argo CD applies is reviewed as a file in the pull request.</li>
    <li value="12" id="entry-restore-tested-backups"><a href="https://github.com/ned-si/homelab/blob/main/docs/backups.md">Restore-tested backups</a>: A backup counts once a scheduled restore of it has passed.</li>
    <li value="13" id="entry-scheduled-pentests"><a href="https://github.com/ned-si/homelab/blob/main/docs/pentest/README.md">Scheduled pentests</a>: A scoped run against our own names and addresses, findings as issues.</li>
    <li value="14" id="entry-slos-and-error-budgets"><a href="https://github.com/ned-si/homelab/blob/main/docs/sre.md">SLOs and error budgets</a>: One number per app, 99.5% over 30 days, from public probes.</li>
    <li value="15" id="entry-spec-driven-development"><a href="https://github.com/ned-si/homelab/blob/main/docs/spec-driven-development.md">Spec-driven development</a>: Requirements, design and tasks merged before the code.</li>
    <li value="16" id="entry-trunk-based-with-squash-merges"><a href="https://github.com/ned-si/homelab/blob/main/docs/decisions.md#squash-merge">Trunk-based with squash merges</a>: One commit per pull request on a linear main.</li>
    </ol>
    <h3 class="ring-trial">Trial</h3>
    <ol>
    <li value="17" id="entry-default-deny-network-policies"><a href="https://github.com/ned-si/homelab/issues/709">Default-deny network policies</a>: Enforced in a few namespaces; app allow-lists still in audit.</li>
    <li value="18" id="entry-github-app-instead-of-pats"><a href="https://github.com/ned-si/homelab/blob/main/docs/pentest/README.md">GitHub App instead of PATs</a>: Short-lived tokens for the pentest workflows; PATs remain elsewhere.</li>
    <li value="19" id="entry-pod-security-restricted"><a href="https://github.com/ned-si/homelab/issues/1021">Pod Security restricted</a>: Kyverno restricted policies in Audit until their reports are clean.</li>
    </ol>
    <h3 class="ring-assess">Assess</h3>
    <ol>
    <li value="20" id="entry-canary-tokens"><a href="https://github.com/ned-si/homelab/issues/1618">Canary tokens</a>: Fake credentials that page when touched.</li>
    <li value="21" id="entry-chaos-experiments-tied-to-slos"><a href="https://github.com/ned-si/homelab/issues/733">Chaos experiments tied to SLOs</a>: Break things on purpose, within the error budget.</li>
    <li value="22" id="entry-disaster-recovery-site"><a href="https://github.com/ned-si/homelab/issues/918">Disaster recovery site</a>: Where to rebuild if the house is gone, and how fast.</li>
    <li value="23" id="entry-kubernetes-oidc-through-keycloak"><a href="https://github.com/ned-si/homelab/issues/711">Kubernetes OIDC through Keycloak</a>: Personal API credentials instead of a shared kubeconfig.</li>
    <li value="24" id="entry-weekly-sbom-and-cve-scan"><a href="https://github.com/ned-si/homelab/issues/1507">Weekly SBOM and CVE scan</a>: What runs, scanned weekly, not only at build time.</li>
    <li value="25" id="entry-wide-events"><a href="https://github.com/ned-si/homelab/issues/734">Wide events</a>: One rich event per request instead of three signals.</li>
    </ol>
    <h3 class="ring-hold">Hold</h3>
    <ol>
    <li value="26" id="entry-adr-directory"><a href="https://github.com/ned-si/homelab/blob/main/docs/decisions.md">ADR directory</a>: ADRs rot in a one-person repository; decisions live in the docs.</li>
    </ol>
    </section>
    <section aria-labelledby="q-tools">
    <h2 id="q-tools">Tools and languages</h2>
    <h3 class="ring-adopt">Adopt</h3>
    <ol>
    <li value="27" id="entry-chrome-headless-shell"><a href="https://github.com/ned-si/homelab/blob/main/.kiro/specs/homelab-dashboard/design.md">chrome-headless-shell</a>: Screenshot and layout checks without a pixel diff.</li>
    <li value="28" id="entry-cosign"><a href="https://github.com/ned-si/homelab/tree/main/.kiro/specs/image-provenance">cosign</a>: Keyless signatures with the workflow identity.</li>
    <li value="29" id="entry-github-actions"><a href="https://github.com/ned-si/homelab/blob/main/docs/testing.md">GitHub Actions</a>: CI and publishing, every action pinned to a SHA.</li>
    <li value="30" id="entry-github-artifact-attestations"><a href="https://github.com/ned-si/homelab/blob/main/.kiro/specs/homelab-dashboard/design.md">GitHub artifact attestations</a>: SLSA v1 provenance for the own images, SLSA Build L2.</li>
    <li value="31" id="entry-gitleaks"><a href="https://github.com/ned-si/homelab/blob/main/docs/testing.md">gitleaks</a>: No secret reaches a commit, public repository or not.</li>
    <li value="32" id="entry-go"><a href="https://github.com/ned-si/homelab/blob/main/docs/decisions.md#the-public-dashboard-is-a-first-party-go-app">Go</a>: The dashboard and this radar: one static binary, typed, tested.</li>
    <li value="33" id="entry-hugo"><a href="https://github.com/ned-si/homelab/blob/main/.kiro/specs/public-website/design.md">Hugo</a>: One pinned binary, no theme, no npm tree, strict CSP possible.</li>
    <li value="34" id="entry-kind"><a href="https://github.com/ned-si/homelab/blob/main/docs/testing.md">kind</a>: A throwaway cluster in CI for a server-side dry run and a real boot.</li>
    <li value="35" id="entry-kiro"><a href="https://github.com/ned-si/homelab/blob/main/docs/spec-driven-development.md">Kiro</a>: The agents that write most pull requests, held to the specs.</li>
    <li value="36" id="entry-kubeconform-and-kube-linter"><a href="https://github.com/ned-si/homelab/blob/main/docs/testing.md">kubeconform and kube-linter</a>: Schema and practice checks on every rendered manifest.</li>
    <li value="37" id="entry-kustomize-and-helm"><a href="https://github.com/ned-si/homelab/blob/main/docs/architecture.md">Kustomize and Helm</a>: Helm charts rendered through Kustomize into deploy/.</li>
    <li value="38" id="entry-openssf-scorecard"><a href="https://github.com/ned-si/homelab/tree/main/.kiro/specs/scorecard-hardening">OpenSSF Scorecard</a>: A weekly score of the repository&#39;s supply-chain practice.</li>
    <li value="39" id="entry-opentofu"><a href="https://github.com/ned-si/homelab/blob/main/docs/bootstrap.md">OpenTofu</a>: The cloud resources, applied by a workflow through GitHub OIDC.</li>
    <li value="40" id="entry-owasp-zap"><a href="https://github.com/ned-si/homelab/blob/main/docs/pentest/README.md">OWASP ZAP</a>: The DAST scan of the public names.</li>
    <li value="41" id="entry-pre-commit"><a href="https://github.com/ned-si/homelab/blob/main/docs/testing.md">pre-commit</a>: The same checks locally on commit and push.</li>
    <li value="42" id="entry-python"><a href="https://github.com/ned-si/homelab/blob/main/docs/testing.md">Python</a>: CI scripts and checks, with pytest.</li>
    <li value="43" id="entry-renovate"><a href="https://github.com/ned-si/homelab/blob/main/docs/testing.md">Renovate</a>: Every dependency pinned and updated, automerged on green CI.</li>
    <li value="44" id="entry-sops-with-age"><a href="https://github.com/ned-si/homelab/blob/main/docs/secrets.md">SOPS with age</a>: Secrets encrypted in git, decrypted by KSOPS in Argo CD.</li>
    <li value="45" id="entry-talhelper"><a href="https://github.com/ned-si/homelab/blob/main/docs/talos.md">talhelper</a>: The Talos machine configs rendered from one file.</li>
    <li value="46" id="entry-task"><a href="https://github.com/ned-si/homelab/blob/main/Taskfile.yml">Task</a>: One Taskfile for render, checks and Talos operations.</li>
    <li value="47" id="entry-trivy"><a href="https://github.com/ned-si/homelab/blob/main/docs/testing.md">Trivy</a>: The image and config gate in CI.</li>
