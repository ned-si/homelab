  layout.css: |
    /* The container, header, navigation bar and footer geometry every public
       page shares (.kiro/specs/public-website/design.md, "Shared layout"). The
       one definition: the landing page and the dashboard hold byte copies
       (`task site:layout-sync`), checked by scripts/ci/site-check.sh. Colours
       come from /theme.css (theme-dark.css or theme-light.css). */

    * { box-sizing: border-box; }

    body {
      margin: 0 auto;
      max-width: 72rem;
      padding: 1.5rem 1.25rem 3rem;
      font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    /* The nav on the left, the preferences at the top right
       (.kiro/specs/site-theme-language/design.md#markup). */
    header.site {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.5rem 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--rule);
    }

    nav.site {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
    }

    nav.site a { text-decoration: none; }
    nav.site a:hover { color: var(--fg); }
    nav.site a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 2px; }
    nav.site a[aria-current="page"] { color: var(--fg); font-weight: 700; }

    .prefs { display: flex; align-items: center; gap: 0.75rem; margin: 0; }
    .prefs a { display: inline-flex; color: var(--fg); }
    .prefs a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 2px; }
    .prefs .icon {
      width: 1.25rem;
      height: 1.25rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .vh {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    main { padding-top: 1.5rem; }

    footer.site {
      margin-top: 3rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--rule);
    }
  techradar.css: |
    /* The tech radar's components; the container and the nav come from
       layout.css, the colours from the palette, served as /theme.css
       (theme-dark.css or theme-light.css). */

    body { color: var(--fg); background: var(--bg); }

    a { color: var(--link); }

    h1 { margin: 0; font-size: 2.5rem; }
    h2 { margin: 2.5rem 0 0.5rem; font-size: 1.375rem; }
    h3 { margin: 1.25rem 0 0.25rem; font-size: 1rem; letter-spacing: 0.05em; text-transform: uppercase; }

    .lead { margin: 0.5rem 0 0; color: var(--muted); font-size: 1.25rem; }

    .intro { max-width: 44rem; }
    .rings { padding-left: 1.25rem; }
    .updated { color: var(--muted); font-size: 0.9375rem; }

    .ring-adopt { color: var(--ring-adopt); }
    .ring-trial { color: var(--ring-trial); }
    .ring-assess { color: var(--ring-assess); }
    .ring-hold { color: var(--ring-hold); }

    figure.chart { margin: 2rem auto; max-width: 64rem; }
    figure.chart svg { display: block; width: 100%; height: auto; }

    .ring-line { fill: none; stroke: var(--radar-line); stroke-width: 1.5; }
    .axis { stroke: var(--radar-line); stroke-width: 1.5; }
    .ring-name {
      fill: var(--muted);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-anchor: middle;
      text-transform: uppercase;
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 4px;
    }
    .blip circle, .blip path { fill: currentColor; }
    .blip-number { fill: var(--blip-text); font-size: 8px; font-weight: 700; text-anchor: middle; }
    .blip { text-decoration: none; }
    .blip:focus { outline: none; }
    .blip:focus-visible circle, .blip:focus-visible path { stroke: var(--fg); stroke-width: 2; }

    /* The point's label, hidden until hover or keyboard focus. Hover only where
       the device has it: a tap goes straight to the legend item. */
    .blip-label { visibility: hidden; }
    .blip-label text {
      fill: var(--fg);
      font-size: 14px;
      font-weight: 700;
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 5px;
      stroke-linejoin: round;
    }
    .blip-label-start { text-anchor: start; }
    .blip-label-end { text-anchor: end; }
    .blip:focus-visible .blip-label { visibility: visible; }
    /* Later points paint over the label; dim them while one is pointed at. */
    svg:has(.blip:focus-visible) .blip:not(:focus-visible) { opacity: 0.3; }
    @media (hover: hover) {
      .blip:hover .blip-label { visibility: visible; }
      svg:has(.blip:hover) .blip:not(:hover) { opacity: 0.3; }
    }

    footer.site { color: var(--muted); font-size: 0.875rem; }

    .legend { display: grid; gap: 0 2.5rem; }
    .legend ol { margin: 0; padding-left: 2.75rem; }
    .legend li { margin: 0.25rem 0; overflow-wrap: anywhere; }
    .legend li:target {
      outline: 2px solid var(--link);
      outline-offset: 0.25rem;
      border-radius: 2px;
      scroll-margin-top: 1rem;
    }
    .legend .moved { color: var(--muted); }
    .legend .none { margin: 0; color: var(--muted); }

    @media (min-width: 60rem) {
      .legend { grid-template-columns: 1fr 1fr; }
    }
  theme-dark.css: |
    /* The dark palette, the default (.kiro/specs/site-theme-language/design.md#palette).
       The only place a colour is written; theme-light.css has the same
       properties. Served as /theme.css when there is no theme=light cookie.
       Copies: `task site:layout-sync`. Contrast: scripts/ci/site_contrast.py.
       --syn-*: hugo gen chromastyles --style=github-dark */
    :root {
      color-scheme: dark;
      --bg: #17191b;
      --fg: #e3e5e7;
      --muted: #a0a6ab;
      --link: #79b8ff;
      --rule: #34383c;
      --code-bg: #212427;
      --panel: #212427;
      --tile: #1a1c1f;
      --ok: #3fb950;
      --warn: #d29922;
      --bad: #f85149;
      --none: #a0a6ab;
      --ring-adopt: #4ac26b;
      --ring-trial: #3bc9db;
      --ring-assess: #e3b341;
      --ring-hold: #ff7b72;
      --radar-line: #6e757b;
      --blip-text: #17191b;
      --syn-comment: #99a1aa;
      --syn-keyword: #ff7b72;
      --syn-string: #a5d6ff;
      --syn-number: #a5d6ff;
      --syn-operator: #ff7b72;
      --syn-constant: #79c0ff;
      --syn-function: #d2a8ff;
      --syn-variable: #79c0ff;
      --syn-label: #79c0ff;
      --syn-deleted: #ffa198;
      --syn-inserted: #56d364;
      --syn-error: #fa7973;
    }
    .prefs .to-dark { display: none; }
  theme-light.css: |
    /* The light palette, sent as /theme.css with the theme=light cookie
       (.kiro/specs/site-theme-language/design.md#palette). The same properties
       as theme-dark.css. Copies: `task site:layout-sync`. Contrast:
       scripts/ci/site_contrast.py.
       --syn-*: hugo gen chromastyles --style=github */
    :root {
      color-scheme: light;
      --bg: #fdfdfc;
      --fg: #1d1f21;
      --muted: #5b6065;
      --link: #0b5cad;
      --rule: #d8dadc;
      --code-bg: #f3f4f5;
      --panel: #f3f4f5;
      --tile: #e9ebed;
      --ok: #116329;
      --warn: #8a5c00;
      --bad: #b62324;
      --none: #5b6065;
      --ring-adopt: #1a7f37;
      --ring-trial: #0b7285;
      --ring-assess: #8a5a00;
      --ring-hold: #c62828;
      --radar-line: #7b8187;
      --blip-text: #fdfdfc;
      --syn-comment: #57606a;
      --syn-keyword: #ba1f29;
      --syn-string: #0a3069;
      --syn-number: #0550ae;
      --syn-operator: #0550ae;
      --syn-constant: #0550ae;
      --syn-function: #6639ba;
      --syn-variable: #953800;
      --syn-label: #990000;
      --syn-deleted: #82071e;
      --syn-inserted: #116329;
      --syn-error: #82071e;
    }
    .prefs .to-light { display: none; }
