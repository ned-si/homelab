    <ul class="rings">
    <li><strong class="ring-adopt">Adopt</strong>: in use, and I would choose it again.</li>
    <li><strong class="ring-trial">Trial</strong>: in use on trial, or with a known limit I am working on.</li>
    <li><strong class="ring-assess">Assess</strong>: researched or planned, not in use yet.</li>
    <li><strong class="ring-hold">Hold</strong>: decided against, removed or replaced; the reason says why.</li>
    </ul>
    <p class="updated">112 entries, updated on <time datetime="2026-11-25">25 November 2026</time>. The numbers on the chart match the legend below it; point at one for its name and ring, or follow it to its reason.</p>
