    <main>
    <h1>Security and Reliability Engineering</h1>
    <p class="lead">Automate all the things.</p>
    <section class="blocks" aria-label="About this site">
    <div>
    <h2>What this is</h2>
    <p>My corner of the web: the projects I work on and what I write about them. No newsletter, no tracking.</p>
    </div>
    <div>
    <h2>What you can expect</h2>
    <p>Mostly security, reliability and platform engineering, with a soft spot for developer experience: the friction we often overlook, from a permission prompt to the keyboard under your fingers. I write when I have something worth saying, which is to say: not every week.</p>
    <p>What is here so far:</p>
    <ul>
    <li><a href="https://blog.nedsi.io/">Blog</a>: security, reliability, platform engineering and developer experience, with the homelab as my playground: how it is built and run, the trade-offs behind it, and what I learn on the way.</li>
    <li><a href="https://homelab.nedsi.io/">Homelab dashboard</a>: the homelab in numbers, live: availability, the cluster, DORA metrics, security.</li>
    <li><a href="https://techradar.nedsi.io/">Tech radar</a>: what the homelab uses, tries, assesses and holds, and why.</li>
    <li><a href="https://charts.nedsi.io/">Drum charts</a>: the songs I play, to read in the browser or download as PDF.</li>
    <li><a href="https://blog.nedsi.io/about/">About</a>: who I am, what I have done so far, certifications and talks.</li>
    <li><a href="https://github.com/ned-si/">Projects on GitHub</a>: the homelab, the keyboard firmware and the drum charts, all in the open.</li>
    </ul>
    </div>
    </section>

    <section aria-labelledby="work">
    <h2 id="work">Selected work</h2>
    <p>All public on GitHub.</p>
    <div class="cards">
    <article class="card">
    <p class="label">Project</p>
    <h3>Homelab</h3>
    <p>An over-engineered homelab run like a small production platform: GitOps, SLOs, restore-tested backups, policy checks, and agents that merge their own pull requests (nothing has burnt down yet, touch wood).</p>
    <p class="links"><a class="button" href="https://homelab.nedsi.io/">See the dashboard</a> · <a href="https://github.com/ned-si/homelab">Source on GitHub</a></p>
    </article>
    <article class="card">
    <p class="label">Project</p>
    <h3>Tech radar</h3>
    <p>The technologies behind the homelab on one page: what it uses, what it is trying, what it is looking at and what it decided against, each with its reason.</p>
    <a href="https://techradar.nedsi.io/">See the radar</a>
    </article>
    <article class="card">
    <p class="label">Project</p>
    <h3>Keyboards</h3>
    <p>Ergonomic mechanical keyboards and their firmware: QMK, with one shared userspace, and ZMK for the wireless-only boards. Built and released by CI. The one under my fingers right now is a Scylla.</p>
    <p class="links"><a href="https://github.com/ned-si/scylla">Scylla</a> · <a href="https://github.com/ned-si/qmk-userspace">QMK userspace</a> · <a href="https://github.com/ned-si/zmk-config">ZMK config</a></p>
    </article>
    <article class="card">
    <p class="label">Project</p>
    <h3>Drum charts</h3>
    <p>Drum charts as code: songs written in LilyPond, split by section, with my own notation and a legend. Built to learn a song's structure rather than every note.</p>
    <p class="links"><a class="button" href="https://charts.nedsi.io/">See the charts</a> · <a href="https://github.com/ned-si/drum-charts">Source on GitHub</a></p>
