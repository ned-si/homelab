    <main>
    <h1>Ingénierie de la sécurité et de la fiabilité</h1>
    <p class="lead"><em>Automate all the things.</em></p>
    <section class="blocks" aria-label="À propos de ce site">
    <div>
    <h2>Ce que c’est</h2>
    <p>Mon coin du web : les projets sur lesquels je travaille et ce que j’écris à leur sujet. Pas de newsletter, pas de pistage.</p>
    </div>
    <div>
    <h2>À quoi vous attendre</h2>
    <p>Surtout de la sécurité, de la fiabilité et du <em>platform engineering</em>, avec un faible pour l’expérience développeur : les frictions qu’on oublie souvent, d’une demande d’autorisation au clavier sous vos doigts. J’écris quand j’ai quelque chose qui vaut la peine d’être dit, autrement dit : pas toutes les semaines.</p>
    <p>Ce qu’il y a ici pour l’instant :</p>
    <ul>
    <li><a href="https://blog.nedsi.io/fr/">Blog</a> : la sécurité, la fiabilité, le <em>platform engineering</em> et l’expérience développeur, avec le homelab comme terrain de jeu : sa construction, son exploitation, les compromis derrière, et ce que j’apprends en chemin.</li>
    <li><a href="https://homelab.nedsi.io/fr/">Tableau de bord du homelab</a> : le homelab en chiffres, en direct : disponibilité, le cluster, les métriques DORA, la sécurité.</li>
    <li><a href="https://techradar.nedsi.io/fr/">Tech radar</a> : ce que le homelab utilise, essaie, évalue et met de côté, et pourquoi.</li>
    <li><a href="https://charts.nedsi.io/fr/">Partitions de batterie</a> : les morceaux que je joue, à lire dans le navigateur ou à télécharger en PDF.</li>
    <li><a href="https://blog.nedsi.io/fr/about/">À propos</a> : qui je suis, ce que j’ai fait jusqu’ici, certifications et conférences.</li>
    <li><a href="https://github.com/ned-si/">Projets sur GitHub</a> : le homelab, les <em>firmwares</em> de claviers et les partitions de batterie, tout en open source.</li>
    </ul>
    </div>
    </section>

    <section aria-labelledby="work">
    <h2 id="work">Projets choisis</h2>
    <p>Tous publics sur GitHub.</p>
    <div class="cards">
    <article class="card">
    <p class="label">Projet</p>
    <h3>Homelab</h3>
    <p>Un homelab surconçu, exploité comme une petite plateforme de production : GitOps, SLO, sauvegardes avec tests de restauration, contrôles de <em>policies</em>, et des agents qui mergent leurs propres <em>pull requests</em> (rien n’a encore brûlé, je touche du bois).</p>
    <p class="links"><a class="button" href="https://homelab.nedsi.io/fr/">Voir le tableau de bord</a> · <a href="https://github.com/ned-si/homelab">Code source sur GitHub</a></p>
    </article>
    <article class="card">
    <p class="label">Projet</p>
    <h3>Tech radar</h3>
    <p>Les technologies derrière le homelab sur une seule page : ce qui est utilisé, ce qui est essayé, ce qui est observé et ce qui a été écarté, chacune avec sa raison.</p>
    <a href="https://techradar.nedsi.io/fr/">Voir le radar</a>
    </article>
    <article class="card">
    <p class="label">Projet</p>
    <h3>Claviers</h3>
    <p>Des claviers mécaniques ergonomiques et leurs <em>firmwares</em> : QMK, avec un <em>userspace</em> partagé, et ZMK pour les claviers uniquement sans fil. Construits et publiés par le CI. Celui sous mes doigts en ce moment est un Scylla.</p>
    <p class="links"><a href="https://github.com/ned-si/scylla">Scylla</a> · <a href="https://github.com/ned-si/qmk-userspace">QMK userspace</a> · <a href="https://github.com/ned-si/zmk-config">ZMK config</a></p>
    </article>
    <article class="card">
    <p class="label">Projet</p>
    <h3>Partitions de batterie</h3>
    <p>Des partitions de batterie <em>as code</em> : des morceaux écrits en LilyPond, découpés par section, avec ma propre notation et une légende. Faites pour apprendre la structure d’un morceau plutôt que chaque note.</p>
    <p class="links"><a class="button" href="https://charts.nedsi.io/fr/">Voir les partitions</a> · <a href="https://github.com/ned-si/drum-charts">Code source sur GitHub</a></p>
    </article>
    </div>
    </section>

