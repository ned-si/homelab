  landing.css: |
    /* The container, nav and footer geometry are in layout.css, the colours in
       /theme.css. */
    body { color: var(--fg); background: var(--bg); }

    a { color: var(--link); }

    h1 { margin: 0; font-size: 2.5rem; }
    h2 { margin: 3rem 0 1rem; font-size: 1.375rem; }
    h3 { margin: 0.25rem 0 0.5rem; font-size: 1.125rem; }

    .lead { margin: 0.5rem 0 0; color: var(--muted); font-size: 1.25rem; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
      gap: 1rem 1.5rem;
    }

    .blocks h2 { margin: 2.5rem 0 0.25rem; font-size: 1.125rem; }
    .blocks p, .blocks ul { margin: 0 0 0.5rem; }
    .blocks ul { padding-left: 1.25rem; }
    .blocks li { margin: 0.25rem 0; }

    .card {
      display: flex;
      flex-direction: column;
      padding: 1rem 1.25rem;
      border: 1px solid var(--rule);
      border-radius: 0.4rem;
      background: var(--panel);
    }

    .card p { margin: 0 0 0.75rem; }
    .card > :last-child { margin-top: auto; font-weight: 600; }

    .button {
      display: inline-block;
      padding: 0.2rem 0.75rem;
      border: 1px solid var(--link);
      border-radius: 0.3rem;
      text-decoration: none;
    }

    .label {
      color: var(--muted);
      font-size: 0.8125rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    footer.site { color: var(--muted); font-size: 0.875rem; }
  layout.css: |
    /* The container, header, navigation bar and footer geometry every public
       page shares (.kiro/specs/public-website/design.md, "Shared layout"). The
       one definition: the landing page and the dashboard hold byte copies
       (`task site:layout-sync`), checked by scripts/ci/site-check.sh. Colours
       come from /theme.css (theme-dark.css or theme-light.css). */

    * { box-sizing: border-box; }

    body {
      margin: 0 auto;
      max-width: 72rem;
      padding: 1.5rem 1.25rem 3rem;
      font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    /* The nav on the left, the preferences at the top right
       (.kiro/specs/site-theme-language/design.md#markup). */
    header.site {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.5rem 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--rule);
    }

    nav.site {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
    }

    nav.site a { text-decoration: none; }
    nav.site a:hover { color: var(--fg); }
    nav.site a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 2px; }
    nav.site a[aria-current="page"] { color: var(--fg); font-weight: 700; }

    .prefs { display: flex; align-items: center; gap: 0.75rem; margin: 0; }
    .prefs a { display: inline-flex; color: var(--fg); text-decoration: none; }
    .prefs a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 2px; }
    .prefs .icon {
      width: 1.25rem;
      height: 1.25rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .vh {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    main { padding-top: 1.5rem; }

    footer.site {
      margin-top: 3rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--rule);
    }
  theme-dark.css: |
    /* The dark palette, the default (.kiro/specs/site-theme-language/design.md#palette).
       The only place a colour is written; theme-light.css has the same
       properties. Served as /theme.css when there is no theme=light cookie.
       Copies: `task site:layout-sync`. Contrast: scripts/ci/site_contrast.py.
       --syn-*: hugo gen chromastyles --style=github-dark */
    :root {
      color-scheme: dark;
      --bg: #17191b;
      --fg: #e3e5e7;
      --muted: #a0a6ab;
