      --ring-adopt: #1a7f37;
      --ring-trial: #0b7285;
      --ring-assess: #8a5a00;
      --ring-hold: #c62828;
      --radar-line: #7b8187;
      --blip-text: #fdfdfc;
      --syn-comment: #57606a;
      --syn-keyword: #ba1f29;
