---
apiVersion: v1
data:
  nginx.conf: |
    # nginx for nedsi.io, blog.nedsi.io, techradar.nedsi.io and www.nedsi.io
    # (.kiro/specs/public-website/design.md#serving). Mounted from a ConfigMap, so
    # a change here needs no new image. The root file system is read-only: the pid
    # and temp paths live in the /tmp emptyDir. Security headers are set at the
    # HTTPRoute. The redirects are here, not at the Gateway: Cilium writes :443
    # into a RequestRedirect's Location and serves no HTTPS redirect route.
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events {
        worker_connections 256;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        # No client address, user agent, referrer or query string (Requirement 6.3).
        log_format site escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent}';
        access_log /dev/stdout site;

        server_tokens off;
        sendfile on;
        autoindex off;
        # Relative redirects (/posts -> /posts/), not http://<pod>:8080/.
        absolute_redirect off;

        # Where plain HTTP goes; www and any other name fold into the apex.
        map $host $https_host {
            blog.nedsi.io    blog.nedsi.io;
            homelab.nedsi.io homelab.nedsi.io;
            techradar.nedsi.io techradar.nedsi.io;
            default          nedsi.io;
        }

        # The theme (.kiro/specs/site-theme-language/design.md#nginx).
        map $cookie_theme $theme {
            light   light;
            default dark;
        }
        # A click from a nedsi.io page or a typed address; not a cross-site
        # navigation, not a prefetch or prerender.
        map "$http_sec_fetch_site:$http_sec_purpose" $theme_click {
            ~^(|same-origin|same-site|none):$ 1;
            default                          0;
        }
        # An empty value sends no Set-Cookie.
        map "$theme_click:$uri" $theme_cookie {
            ~^1:/set-theme/light/ "theme=light; Domain=nedsi.io; Path=/; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax";
            ~^1:                  "theme=; Domain=nedsi.io; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax";
            default               "";
        }
        # The blog's French 404 page.
        map $uri $not_found {
            ~^/fr/  /fr/404.html;
            default /404.html;
        }

        # The blog, also the default server (kubelet probes, the smoke's Service check).
        server {
            listen 8080 default_server;
            server_name blog.nedsi.io;
            root /usr/share/nginx/html;
            error_page 404 $not_found;

            # Only GET and HEAD (Requirement 3.3). An `if` with `return` instead of
            # limit_except + error_page 403: no other 403 can turn into a 405.
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }

            location / {
                try_files $uri $uri/ =404;
                add_header Cache-Control "public, max-age=300";
            }

            include /etc/nginx-site/theme.conf;

            # Fingerprinted by Hugo: a change gets a new name.
            location /css/ {
                add_header Cache-Control "public, max-age=31536000, immutable";
            }


            # The dashboard has its own host (spec homelab-dashboard, Address):
            # /homelab and /homelab/ go to its root, /homelab/<path> to <path>.
            location ~ ^/homelab(?:/(.*))?$ {
                return 301 https://homelab.nedsi.io/$1;
            }
        }

        # The landing page.
        server {
            listen 8080;
            server_name nedsi.io;
            root /usr/share/nginx/landing;

            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }

            include /etc/nginx-site/theme.conf;

            location / {
                try_files $uri $uri/ =404;
                add_header Cache-Control "public, max-age=300";
            }
        }

        # The tech radar, rendered by techradar/ (spec tech-radar).
        server {
            listen 8080;
            server_name techradar.nedsi.io;
            root /usr/share/nginx/techradar;

            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }

            include /etc/nginx-site/theme.conf;

            location / {
                try_files $uri $uri/ =404;
                add_header Cache-Control "public, max-age=300";
            }
        }

        server {
            listen 8080;
            server_name www.nedsi.io;

            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            return 301 https://nedsi.io$request_uri;
        }

        # Port 8081 gets the Gateway's port-80 listeners only.
        server {
            listen 8081 default_server;

            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            return 301 https://$https_host$request_uri;
        }
    }
  theme.conf: |
    # The theme stylesheet and endpoint of a host
    # (.kiro/specs/site-theme-language/design.md#nginx), included by its server
    # block; the maps are in nginx.conf. These locations replace the inherited
    # add_header lines on purpose: the HTTPRoute adds the security headers.
    location = /theme.css {
        add_header Cache-Control "no-store";
        add_header Vary "Cookie";
        try_files /theme-$theme.css =404;
    }

    # merge_slashes (on) keeps $back from starting with //; anything the regex
    # refuses (another theme, %5c, %0d%0a) falls to the 404 below.
    location ~ "^/set-theme/(?:light|dark)(?<back>/[A-Za-z0-9._~/-]*)$" {
        add_header Set-Cookie $theme_cookie;
        add_header Cache-Control "no-store";
        return 303 $back;
    }

    location /set-theme/ {
        return 404;
    }
kind: ConfigMap
metadata:
  name: website-nginx-7g4fhm5g6m
  namespace: website
