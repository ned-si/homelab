#
# Source:     apps/home
# Regenerate: task render     (scripts/render-deploy.sh)
#
# Edit the kustomization in apps/home and re-render. Editing this file
# directly will be reverted by the next render and rejected by CI.
# ---------------------------------------------------------------------------
---
apiVersion: v1
data:
  configuration.yaml: |
    # Home Assistant configuration, from git (apps/home/config/). The `config`
    # init container copies it over /config/configuration.yaml on every start,
    # so an edit made on the pod is lost. Integrations, devices, areas and users
    # are set up in the UI and live in /config/.storage.
    #
    # Location (latitude, longitude, elevation) is not here on purpose: the repo
    # is public. It is set once in the UI (Settings, System, General).

    default_config:

    homeassistant:
      name: Home
      unit_system: metric
      time_zone: Europe/Zurich
      currency: CHF
      country: CH
      external_url: https://home.lilalala.com
      internal_url: https://home.lilalala.com

    # No `http:` here: Home Assistant 2026 reads the HTTP settings (reverse proxy,
    # IP ban) only from /config/.storage/http and ignores YAML after a one-time
    # import. config/http-store.json is that file; the `config` init container
    # writes it on every start.

    # Login with Keycloak (custom component hass-oidc-auth, installed by the
    # `custom-components` init container). Public client with PKCE, so there is
    # no client secret. Members of the Keycloak group HomeAssistantAdmins become
    # administrators; every other realm user gets a normal user. The local
    # owner account stays as break-glass: https://home.lilalala.com/?skip_oidc_redirect=true
    auth_oidc:
      client_id: home-assistant
      discovery_url: https://auth.lilalala.com/realms/homelab/.well-known/openid-configuration
      display_name: Keycloak
      roles:
        admin: HomeAssistantAdmins
      features:
        default_redirect: true

    # History on the CNPG cluster `home-assistant-postgresql` (database.yaml)
    # instead of SQLite on the config volume: WAL archiving and point-in-time
    # recovery like the other databases.
    recorder:
      db_url: !env_var HA_RECORDER_DB_URL
      purge_keep_days: 30
      auto_purge: true

    # Metrics at /api/prometheus for Prometheus. Only domains that describe the
    # house; the rest (automations, zones, sun, weather, ...) is noise.
    prometheus:
      namespace: hass
      filter:
        include_domains:
          - alarm_control_panel
          - binary_sensor
          - climate
          - cover
          - fan
          - humidifier
          - light
          - lock
          - person
          - sensor
          - switch
          - update
          - water_heater

    # Edited from the UI; created empty when missing, never overwritten.
    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
  http-store.json: |
    {
      "version": 2,
      "minor_version": 2,
      "key": "http",
      "data": {
        "stable": {
          "server_port": 8123,
          "use_x_forwarded_for": true,
          "trusted_proxies": [
            "10.244.0.0/16"
          ],
          "ip_ban_enabled": true,
          "login_attempts_threshold": 10,
          "cors_allowed_origins": [
            "https://cast.home-assistant.io"
          ],
          "ssl_profile": "modern",
          "use_x_frame_options": true,
          "created_at": "2026-10-15T00:00:00+00:00",
          "error": null,
          "error_message": null
        },
        "pending": null,
        "yaml_migration_done": true
      }
    }
kind: ConfigMap
metadata:
  name: home-assistant-config-5d7dh97298
  namespace: home
