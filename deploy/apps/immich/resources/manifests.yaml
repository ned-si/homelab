apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
  namespace: immich
spec:
  backup:
    barmanObjectStore:
      data:
        compression: gzip
        jobs: 2
      destinationPath: s3://homelab-backups/immich/postgres
      endpointURL: https://s3.eu-central-003.backblazeb2.com
      s3Credentials:
        accessKeyId:
          key: ACCESS_KEY_ID
          name: s3-backup
        secretAccessKey:
          key: ACCESS_SECRET_KEY
          name: s3-backup
      wal:
        compression: gzip
        maxParallel: 2
    retentionPolicy: 30d
  bootstrap:
    initdb:
      postInitApplicationSQL:
      - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
      - CREATE EXTENSION IF NOT EXISTS cube;
      - CREATE EXTENSION IF NOT EXISTS earthdistance;
      - ALTER SCHEMA public OWNER TO "app";
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17-1.1.0
  instances: 1
  monitoring:
    enablePodMonitor: true
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
    shared_preload_libraries:
    - vchord.so
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 512Mi
  storage:
    size: 20Gi
    storageClass: iscsi
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-nightly
  namespace: immich
spec:
  backupOwnerReference: self
  cluster:
    name: immich-db
  immediate: true
  method: barmanObjectStore
  schedule: 0 30 2 * * *
