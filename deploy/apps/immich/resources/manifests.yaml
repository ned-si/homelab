apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-library-backup
  namespace: immich
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 72000
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-library-backup
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: immich-server
                topologyKey: kubernetes.io/hostname
          containers:
          - args:
            - |
              # `init` is idempotent-by-failure: it errors if the repo already
              # exists, which is the normal case after the first run.
              restic init 2>/dev/null || true

              restic backup /data \
                --tag immich-library \
                --host immich \
                --exclude '**/.tmp/**' \
                --exclude '**/encoded-video/**' \
                --exclude '**/thumbs/**' \
                --verbose

              # Retention. Thumbnails and transcodes are excluded above
              # because Immich regenerates them from originals -- backing them
              # up would roughly double the bill for data that is derived.
              restic forget \
                --tag immich-library \
                --keep-daily 7 \
                --keep-weekly 5 \
                --keep-monthly 12 \
                --prune

              # Cheap structural check on every run. The real verification
              # (actually restoring data) is a separate CronJob:
              # platform/backup-verify/.
              restic check --with-cache
            command:
            - /bin/sh
            - -euo
            - pipefail
            - -c
            env:
            - name: RESTIC_REPOSITORY
              value: s3:https://s3.eu-central-003.backblazeb2.com/homelab-backups/immich/library
            - name: RESTIC_CACHE_DIR
              value: /cache
            - name: RESTIC_PACK_SIZE
              value: "64"
            envFrom:
            - secretRef:
                name: s3-backup
            image: restic/restic:0.19.0
            imagePullPolicy: IfNotPresent
            name: restic
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 200m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /data
              name: data
              readOnly: true
            - mountPath: /cache
              name: cache
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: immich-data
              readOnly: true
          - name: cache
            persistentVolumeClaim:
              claimName: immich-restic-cache
  schedule: 30 3 * * *
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
