              claimName: mealie-pvc
              readOnly: true
          - emptyDir:
              sizeLimit: 2Gi
            name: dumps
          - emptyDir:
              sizeLimit: 1Gi
            name: cache
          - name: creds
            secret:
              secretName: mealie-postgresql-app
  schedule: 20 3 * * *
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  suspend: false
