---
apiVersion: v1
kind: Service
metadata:
  name: syncthing-dashboard
  namespace: syncthing
spec:
  type: ClusterIP
  ports:
    - name: syncthing-dashboard
      protocol: TCP
      port: 8384
      targetPort: 8384
  selector:
    app: syncthing
---
apiVersion: v1
kind: Service
metadata:
  name: syncthing-protocol
  namespace: syncthing
  annotations:
    lbipam.cilium.io/ips: "192.168.1.201"
spec:
  type: LoadBalancer
  ports:
    - name: syncthing-tcp
      port: 22000
      protocol: TCP
      targetPort: 22000
    - name: syncthing-udp
      port: 22000
      protocol: UDP
      targetPort: 22000
    - name: syncthing-disc
      port: 21027
      protocol: UDP
      targetPort: 21027
  selector:
    app: syncthing
