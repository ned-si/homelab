# Two Services:
#
#   syncthing       ClusterIP. The web UI, behind the Gateway, and also the
#                   StatefulSet's governing Service (see below).
#   syncthing-sync  LoadBalancer for the peer-to-peer protocol. This is the one
#                   the router forwards 22000 to.
#
# The old repo called these `syncthing-dashboard` and `syncthing-protocol`. The
# names change; the live `syncthing` Service is what the StatefulSet's immutable
# `serviceName` refers to, so that one keeps its name.
---
apiVersion: v1
kind: Service
metadata:
  name: syncthing
  namespace: syncthing
  labels:
    app: syncthing
    app.kubernetes.io/name: syncthing
spec:
  # The StatefulSet's `serviceName` points here (it is `syncthing` on the live
  # object and immutable). A governing Service is conventionally headless, but
  # this one is a normal ClusterIP because it is ALSO the HTTPRoute backend.
  # Splitting the two would mean changing serviceName, which cannot be done in
  # place -- see the note in ./statefulset.yaml.
  type: ClusterIP
  ports:
    - name: web
      port: 8384
      targetPort: web
      protocol: TCP
  selector:
    app: syncthing
---
apiVersion: v1
kind: Service
metadata:
  name: syncthing-sync
  namespace: syncthing
  labels:
    app: syncthing
    app.kubernetes.io/name: syncthing
    # Take an address from the `services` pool, not the Gateway's.
    homelab.lilalala.com/lb-pool: services
  annotations:
    # Publish this address so remote peers can find it by name. Note this is the
    # LAN address; the router must forward 22000 from the WAN to it.
    external-dns.alpha.kubernetes.io/hostname: sync.lilalala.com
spec:
  type: LoadBalancer
  # Deliberately NOT externalTrafficPolicy: Local -- incompatible with Cilium
  # L2 announcements, causes silent drops.
  ports:
    - name: sync-tcp
      port: 22000
      targetPort: sync-tcp
      protocol: TCP
    - name: sync-udp
      port: 22000
      targetPort: sync-udp
      protocol: UDP
    - name: discovery
      port: 21027
      targetPort: discovery
      protocol: UDP
  selector:
    app: syncthing
