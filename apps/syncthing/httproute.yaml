# syncthing.lilalala.com -> the Syncthing web UI.
#
# Only the UI goes through the Gateway. The sync protocol is raw TCP/UDP on
# 22000 and cannot be expressed as an HTTPRoute -- that is what the
# `syncthing-sync` LoadBalancer Service is for.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: syncthing
  namespace: syncthing
spec:
  # group/kind/weight and the catch-all match are the API server's defaults,
  # spelled out so that Argo CD's diff sees no drift.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - syncthing.lilalala.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: syncthing-dashboard
          port: 8384
          weight: 1
      timeouts:
        request: 0s
