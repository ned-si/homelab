# syncthing.lilalala.com -> the Syncthing web UI.
#
# Only the UI goes through the Gateway. The sync protocol is raw TCP/UDP on
# 22000 and cannot be expressed as an HTTPRoute -- that is what the
# `syncthing-sync` LoadBalancer Service is for.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: syncthing
  namespace: syncthing
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - syncthing.lilalala.com
  rules:
    - backendRefs:
        - name: syncthing-dashboard
          port: 8384
      timeouts:
        request: 0s
