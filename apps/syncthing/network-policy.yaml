# Enforced from the start (default-deny ingress), unlike the allow-lists in
# infrastructure/network-policies: only the shared Gateway (Cilium's Envoy,
# identity `ingress`) may reach syncthing-sso, and only syncthing-sso and the
# smoke Job may reach the Syncthing GUI, which has no login of its own
# (statefulset.yaml). Egress stays open (Keycloak, the Syncthing GUI, peers).
# The namespace switch (infrastructure/network-policies/90-enforcement.yaml)
# adds node traffic (`host`, `remote-node`) on every port.
---
# Sync wave -1: enforced before the StatefulSet drops the GUI login.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: syncthing-gui
  namespace: syncthing
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app: syncthing
  enableDefaultDeny:
    ingress: true
    egress: false
  ingress:
    # The GUI :8384, from the proxy and from the postsync-smoke Job
    # (/rest/noauth/health, kustomization.yaml).
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [syncthing-sso, postsync-smoke]
      toPorts:
        - ports:
            - port: "8384"
              protocol: TCP
    # Sync and local discovery, from anywhere as before
    # (`syncthing-protocol`, services.yaml).
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "22000"
              protocol: TCP
            - port: "22000"
              protocol: UDP
            - port: "21027"
              protocol: UDP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: syncthing-sso
  namespace: syncthing
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: syncthing-sso
  enableDefaultDeny:
    ingress: true
    egress: false
  ingress:
    # syncthing.lilalala.com (httproute.yaml) -> syncthing-sso :4180. The
    # Gateway proxy has the identity `ingress`; with `bpf.masquerade: false`
    # its cross-node traffic can arrive SNATed to a node address
    # (infrastructure/network-policies/10-theater.yaml).
    - fromEntities:
        - ingress
        - remote-node
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
    # kubelet probes.
    - fromEntities:
        - host
