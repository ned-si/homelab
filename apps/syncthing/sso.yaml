# Keycloak login in front of the Syncthing GUI: HTTPRoute `syncthing` ->
# syncthing-sso:4180 -> syncthing-dashboard:8384. Group `admins`, checked by
# the client's login flow and the proxy; a platform client, so logins older
# than 12 hours are asked again (the GUI can share every folder).
#
# The GUI's own login is removed (statefulset.yaml) and :8384 admits only
# this proxy and the smoke Job. Break-glass: `kubectl -n syncthing
# port-forward syncthing-0 8384` over the tailnet.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing-sso
  namespace: syncthing
  labels:
    app.kubernetes.io/name: syncthing-sso
    app.kubernetes.io/component: sso-proxy
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: syncthing-sso
  template:
    metadata:
      labels:
        app.kubernetes.io/name: syncthing-sso
        app.kubernetes.io/component: sso-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # `nonroot` in the distroless base image.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          # renovate: datasource=docker depName=quay.io/oauth2-proxy/oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          imagePullPolicy: IfNotPresent
          args:
            - --alpha-config=/config/alpha-config.yaml
            # Authorization is the group in the alpha config.
            - --email-domain=*
            # Behind the shared Gateway.
            - --reverse-proxy=true
            - --redirect-url=https://syncthing.lilalala.com/oauth2/callback
            - --whitelist-domain=syncthing.lilalala.com
            - --cookie-secure=true
            - --cookie-samesite=lax
            # The platform-client session length (platform.conf loa_max_age).
            - --cookie-expire=12h
            - --cookie-refresh=1h
            - --skip-provider-button=true
            # The public blackbox probe and its SLO
            # (platform/blackbox-exporter/probes/probes.yaml). Syncthing
            # answers this path without its own login too: {"status": "OK"}.
            - --skip-auth-route=GET=^/rest/noauth/health$
          env:
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: syncthing-sso
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          # /ping needs no session and does not depend on Keycloak.
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: syncthing-sso
        - name: secrets
          secret:
            secretName: syncthing-sso
            items:
              - key: client-secret
                path: client-secret
---
apiVersion: v1
kind: Service
metadata:
  name: syncthing-sso
  namespace: syncthing
  labels:
    app.kubernetes.io/name: syncthing-sso
    app.kubernetes.io/component: sso-proxy
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4180
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: syncthing-sso
