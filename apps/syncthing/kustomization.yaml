apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: syncthing

# Parity with the running cluster (ADR 0002), plus the restic backup and its
# monthly prune (backup.yaml, docs/backups.md) and the Keycloak login in front
# of the GUI (sso.yaml).
resources:
  - pvc.yaml
  - statefulset.yaml
  - services.yaml
  - httproute.yaml
  - backup.yaml
  - sso.yaml
  - network-policy.yaml

# oauth2-proxy config of syncthing-sso (sso.yaml). The name hash makes a
# change here a new ConfigMap, which rolls the Deployment.
configMapGenerator:
  - name: syncthing-sso
    files:
      - alpha-config.yaml=sso-alpha-config.yaml

# After every sync: the Service answers on the health endpoint.
components:
  - ../../components/postsync-smoke
patches:
  - target: { kind: Job, name: postsync-smoke }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - http://syncthing-dashboard:8384/rest/noauth/health
