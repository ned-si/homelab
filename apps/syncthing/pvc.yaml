---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-pvc
  namespace: syncthing
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  storageClassName: iscsi
  # The existing zvol (infrastructure/iscsi-volumes/).
  volumeName: pvc-46f50111-9681-420b-b8e3-7d6d2bdb2d7a
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
