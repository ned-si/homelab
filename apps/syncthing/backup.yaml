# Syncthing backup: the device identity (cert.pem, key.pem: lose them and
# every peer must re-accept a new device) and config.xml (folders, peers,
# versioning). The index is excluded: rebuilt by rescanning, and the only live
# database in the volume, so the rest is a fully consistent copy of a few KB.
#
# The synced data is not backed up: every peer holds a copy, and deletions are
# covered by File Versioning, configured in config.xml. Before a Syncthing
# major, run it by hand:
#
#     kubectl -n syncthing create job --from=cronjob/syncthing-backup pre-2x
#
# `syncthing/data` stays in `local.restic_repos` in bootstrap/aws-backup/main.tf
# (scripts/check-restic-repos.sh). Retention is monthly (`syncthing-prune`).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: syncthing-backup
  namespace: syncthing
spec:
  # 02:00. The first S3 job of the night, because it is by far the smallest and
  # because Syncthing's identity is the cheapest thing to protect and the most
  # annoying to lose.
  schedule: "0 2 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      # 30 minutes is generous for a few kilobytes. Kept short on purpose: if
      # this job is still running after half an hour something is wrong with the
      # repository, not with the data.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: syncthing-backup
        spec:
          restartPolicy: OnFailure
          # `app: syncthing`, the label on the immutable StatefulSet selector,
          # not the kubernetes.io one, which may be tidied. The volume is
          # ReadWriteOnce, so this pod must land on syncthing's node.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: syncthing
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            # statefulset.yaml runs PUID/PGID 1000 with fsGroup 1000, so the
            # volume's files are owned by 1000. Any other uid reads nothing.
            # No fsGroup here: the job writes only an emptyDir.
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  restic init 2>/dev/null || true
                  # Stale locks only: a live lock is refreshed and stays (docs/backups.md#locks).
                  restic unlock

                  # An INCLUDE-list expressed as excludes, which is the only
                  # form restic offers. The exclusions are the rebuildable
                  # index; everything left is identity and configuration.
                  #
                  # Both database layouts are excluded because the pinned image
                  # crosses the 1.x/2.x boundary: `index-v2` is 1.x's LevelDB
                  # directory and `*.db` is 2.x's SQLite. Listing only the one
                  # matching today's version would silently start capturing a
                  # live database on the next major bump -- the failure mode
                  # being avoided.
                  restic backup --retry-lock 30m /data \
                    --tag syncthing-data \
                    --tag syncthing-identity \
                    --host syncthing \
                    --exclude '/data/index-v2' \
                    --exclude '/data/*.db' \
                    --exclude '/data/*.db-wal' \
                    --exclude '/data/*.db-shm' \
                    --exclude '/data/index-v0.14.0.db' \
                    --exclude '/data/csrftokens.txt' \
                    --exclude '/data/*.log' \
                    --exclude '/data/panic-*.log' \
                    --verbose

                  restic unlock
                  restic check --retry-lock 30m --with-cache

                  # ONE ASSERTION, because a backup of the wrong thing is the
                  # risk here rather than a torn write.
                  #
                  # If the excludes ever over-match -- a version that renames
                  # config.xml, a path change -- this job would keep succeeding
                  # while backing up nothing that matters. `restic ls` of the
                  # snapshot just written is cheap and catches that.
                  echo "--- verifying the snapshot contains the identity files ---"
                  files=$(restic ls --retry-lock 30m --tag syncthing-identity latest)
                  for want in config.xml cert.pem key.pem; do
                    if printf '%s\n' "$files" | grep -q "/${want}\$"; then
                      echo "    ok      ${want}"
                    else
                      echo "    MISSING ${want}"
                      echo "FAIL: the snapshot does not contain ${want}."
                      echo "      This backup is worthless without it -- the"
                      echo "      device identity and folder configuration are"
                      echo "      the only irreplaceable things in this volume."
                      exit 1
                    fi
                  done
                  echo "PASS"
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/syncthing/data
                - name: RESTIC_CACHE_DIR
                  value: /cache
                # restic writes temp pack files here while uploading. Without this it uses
                # /tmp, which does not exist writable under readOnlyRootFilesystem, and
                # `restic backup` fails the moment it has a pack to flush. /cache is
                # already mounted and writable.
                - name: TMPDIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            # `syncthing-pvc` exists only in the live cluster, on purpose:
            # declaring it would make Argo CD adopt live data with unknown
            # immutable fields under prune and selfHeal. Mounting it adopts
            # nothing.
            - name: data
              persistentVolumeClaim:
                claimName: syncthing-pvc
                readOnly: true
            # emptyDir: this repository is kilobytes, so a cold cache costs
            # nothing and a PVC would be a zvol for no reason. sizeLimit guards
            # the node's 29GB eMMC.
            - name: cache
              emptyDir:
                sizeLimit: 512Mi
---
# Retention, monthly: `--keep-within 3m` keeps packs past Glacier IR's
# 90-day minimum, then one snapshot a month for two years. S3 only, so no
# volume and no affinity.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: syncthing-prune
  namespace: syncthing
spec:
  # The 1st of the month at 12:00, the first of the monthly prunes.
  schedule: "0 12 1 * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: syncthing-prune
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  restic unlock
                  restic forget --retry-lock 30m \
                    --host syncthing \
                    --keep-within 3m \
                    --keep-monthly 24 \
                    --prune

                  restic check --retry-lock 30m --with-cache
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/syncthing/data
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: TMPDIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: cache
              emptyDir:
                sizeLimit: 512Mi
