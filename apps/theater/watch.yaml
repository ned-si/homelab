# watch.lilalala.com: Plex only, the same backend and filters as the Plex
# catch-all of theater.lilalala.com (./httproute.yaml). Every other Theater
# path (/arr, /oauth2, Jellyfin) stays on theater.lilalala.com only.
# external-dns publishes the record.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plex-watch
  namespace: theater
spec:
  # group/kind/weight and the catch-all match are the API server's defaults,
  # spelled out so that Argo CD's diff sees no drift.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - watch.lilalala.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # Plex authenticates with X-Plex-Token, not cookies. The theater-sso
        # session cookies on this host reach ~7 KB and Plex answers 400 to
        # request headers over ~5 KB, so cookies are not forwarded to it.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Cookie
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), payment=(), usb=()"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: Content-Security-Policy
                value: "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
      backendRefs:
        - group: ""
          kind: Service
          name: plex
          port: 32400
          weight: 1
      timeouts:
        request: 0s
