# Plex Watchlist import lists in Sonarr and Radarr, as code (docs/theater.md,
# "Plex watchlist").
#
# A PostSync Job creates or updates one list per app through its API on every
# sync of `theater`: a series or movie added to the Plex watchlist is added,
# monitored and searched for with the quality profile HD-Original. The list
# reads the watchlist with the Plex account token in the Secret `plex-token`
# (apps/secrets/plex-token.sops.yaml). Changes made in the UI to these lists
# are overwritten on the next sync.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: arr-import-lists
  namespace: theater
data:
  import-lists.py: |
    # Idempotent; standard library only.
    import json, os, urllib.request

    NAME = "Plex Watchlist"
    PROFILE = "HD-Original"
    APPS = {
        "sonarr": ("http://sonarr.theater.svc.cluster.local:8989/arr/sonarr", "SONARR_API_KEY",
                   {"enableAutomaticAdd": True, "searchForMissingEpisodes": True,
                    "shouldMonitor": "all", "monitorNewItems": "all",
                    "seriesType": "standard", "seasonFolder": True}),
        "radarr": ("http://radarr.theater.svc.cluster.local:7878/arr/radarr", "RADARR_API_KEY",
                   {"enabled": True, "enableAuto": True, "monitor": "movieOnly",
                    "searchOnAdd": True, "minimumAvailability": "released"}),
    }

    def call(method, url, key, body=None):
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(url, data=data, method=method,
                                     headers={"X-Api-Key": key, "Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=60) as r:
            raw = r.read()
            return json.loads(raw) if raw else None

    for app, (base, env, settings) in APPS.items():
        key = os.environ[env]
        api = f"{base}/api/v3"
        schema = next(s for s in call("GET", f"{api}/importlist/schema", key)
                      if s["implementation"] == "PlexImport")
        profile = next(p["id"] for p in call("GET", f"{api}/qualityprofile", key) if p["name"] == PROFILE)
        root = call("GET", f"{api}/rootfolder", key)[0]["path"]
        for f in schema["fields"]:
            if f["name"] == "accessToken":
                f["value"] = os.environ["PLEX_TOKEN"]
        item = dict(schema, name=NAME, qualityProfileId=profile, rootFolderPath=root, **settings)
        for k in ("presets", "message", "infoLink"):
            item.pop(k, None)
        old = next((i for i in call("GET", f"{api}/importlist", key) if i["name"] == NAME), None)
        if old is None:
            call("POST", f"{api}/importlist", key, item)
        else:
            item["id"] = old["id"]
            call("PUT", f"{api}/importlist/{old['id']}", key, item)
        print(f"{app}: import list '{NAME}' -> {PROFILE}, {root}")
---
# Applies the lists after every sync. Re-run by hand: sync `theater` in Argo CD.
apiVersion: batch/v1
kind: Job
metadata:
  name: arr-import-lists
  namespace: theater
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arr-import-lists
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: import-lists
          # renovate: datasource=docker depName=python
          image: python:3.15.0-alpine3.24
          imagePullPolicy: IfNotPresent
          command: ["python3", "/scripts/import-lists.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PLEX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: plex-token
                  key: PLEX_TOKEN
          envFrom:
            # SONARR_API_KEY, RADARR_API_KEY.
            - secretRef:
                name: recyclarr-api-keys
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: arr-import-lists
