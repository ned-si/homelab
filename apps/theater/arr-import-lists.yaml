# Plex wiring for Sonarr and Radarr, as code (docs/theater.md, "Plex
# watchlist" and "Plex library updates"): a PostSync Job upserts per app the
# import list `Plex Watchlist` (quality profile HD-Original) and the connection
# `Plex` (a library update on every import), and turns on Plex's periodic
# library scan. All read the `plex-token` Secret. UI changes to these are
# overwritten.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: arr-import-lists
  namespace: theater
data:
  import-lists.py: |
    # Idempotent; standard library only.
    import json, os, urllib.error, urllib.parse, urllib.request

    NAME = "Plex Watchlist"
    PROFILE = "HD-Original"
    APPS = {
        "sonarr": ("http://sonarr.theater.svc.cluster.local:8989/arr/sonarr", "SONARR_API_KEY",
                   {"enableAutomaticAdd": True, "searchForMissingEpisodes": True,
                    "shouldMonitor": "all", "monitorNewItems": "all",
                    "seriesType": "standard", "seasonFolder": True}),
        "radarr": ("http://radarr.theater.svc.cluster.local:7878/arr/radarr", "RADARR_API_KEY",
                   {"enabled": True, "enableAuto": True, "monitor": "movieOnly",
                    "searchOnAdd": True, "minimumAvailability": "released"}),
    }

    def call(method, url, key, body=None):
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(url, data=data, method=method,
                                     headers={"X-Api-Key": key, "Content-Type": "application/json"})
        try:
            with urllib.request.urlopen(req, timeout=60) as r:
                raw = r.read()
                return json.loads(raw) if raw else None
        except urllib.error.HTTPError as e:
            # Validation errors name the property; never print attemptedValue,
            # which can be the token.
            try:
                errs = json.loads(e.read())
                errs = [(x.get("propertyName"), x.get("errorMessage")) for x in errs] \
                    if isinstance(errs, list) else errs.get("message")
            except ValueError:
                errs = None
            raise SystemExit(f"{method} {url}: HTTP {e.code} {errs}")

    for app, (base, env, settings) in APPS.items():
        key = os.environ[env]
        api = f"{base}/api/v3"
        schema = next(s for s in call("GET", f"{api}/importlist/schema", key)
                      if s["implementation"] == "PlexImport")
        profile = next(p["id"] for p in call("GET", f"{api}/qualityprofile", key) if p["name"] == PROFILE)
        root = call("GET", f"{api}/rootfolder", key)[0]["path"]
        for f in schema["fields"]:
            if f["name"] == "accessToken":
                f["value"] = os.environ["PLEX_TOKEN"]
        item = dict(schema, name=NAME, qualityProfileId=profile, rootFolderPath=root, **settings)
        for k in ("presets", "message", "infoLink"):
            item.pop(k, None)
        old = next((i for i in call("GET", f"{api}/importlist", key) if i["name"] == NAME), None)
        # forceSave: Radarr refuses to save a list that returns nothing, which
        # an empty watchlist does.
        if old is None:
            call("POST", f"{api}/importlist?forceSave=true", key, item)
        else:
            item["id"] = old["id"]
            call("PUT", f"{api}/importlist/{old['id']}?forceSave=true", key, item)
        print(f"{app}: import list '{NAME}' -> {PROFILE}, {root}")

    # Library updates. Plex mounts only the share's media/ at /media, so its
    # file watcher misses what the *arr pods write over NFS: each import asks
    # Plex to scan the item's folder, mapped from /data/media/.
    CONN = "Plex"
    PLEX_HOST, PLEX_PORT = "plex.theater.svc.cluster.local", 32400
    EVENTS = ["onDownload", "onUpgrade", "onImportComplete", "onRename",
              "onSeriesDelete", "onEpisodeFileDelete", "onEpisodeFileDeleteForUpgrade",
              "onMovieDelete", "onMovieFileDelete", "onMovieFileDeleteForUpgrade"]
    PLEX_FIELDS = {"host": PLEX_HOST, "port": PLEX_PORT, "useSsl": False,
                   "authToken": os.environ["PLEX_TOKEN"], "updateLibrary": True,
                   "mapFrom": "/data/media/", "mapTo": "/media/"}
    for app, (base, env, _) in APPS.items():
        key = os.environ[env]
        api = f"{base}/api/v3"
        schema = next(s for s in call("GET", f"{api}/notification/schema", key)
                      if s["implementation"] == "PlexServer")
        names = {f["name"] for f in schema["fields"]}
        missing = set(PLEX_FIELDS) - names
        if missing:
            raise SystemExit(f"{app}: PlexServer schema lacks {sorted(missing)}")
        for f in schema["fields"]:
            if f["name"] in PLEX_FIELDS:
                f["value"] = PLEX_FIELDS[f["name"]]
        item = dict(schema, name=CONN)
        on = [e for e in EVENTS if item.get("supports" + e[0].upper() + e[1:])]
        item.update({e: True for e in on})
        for k in ("presets", "message", "infoLink"):
            item.pop(k, None)
        old = next((i for i in call("GET", f"{api}/notification", key) if i["name"] == CONN), None)
        # forceSave: the save tests Plex, which a sync can run before the
        # network policy allowing it has applied. The hourly scan covers that.
        if old is None:
            call("POST", f"{api}/notification?forceSave=true", key, item)
        else:
            item["id"] = old["id"]
            call("PUT", f"{api}/notification/{old['id']}?forceSave=true", key, item)
        print(f"{app}: connection '{CONN}' -> {PLEX_HOST}:{PLEX_PORT}, {len(on)} events")

    # Periodic scan: every hour, catches what no import announced (files
    # added by hand). Metadata refresh is Plex's own nightly task, on by
    # default (ButlerTaskRefreshPeriodicMetadata).
    PREFS = {"ScheduledLibraryUpdatesEnabled": "1", "ScheduledLibraryUpdateInterval": "3600"}
    req = urllib.request.Request(
        f"http://{PLEX_HOST}:{PLEX_PORT}/:/prefs?" + urllib.parse.urlencode(PREFS),
        method="PUT", headers={"X-Plex-Token": os.environ["PLEX_TOKEN"]})
    try:
        with urllib.request.urlopen(req, timeout=60):
            pass
    except urllib.error.HTTPError as e:
        raise SystemExit(f"PUT plex /:/prefs: HTTP {e.code}")
    print("plex: " + ", ".join(f"{k}={v}" for k, v in PREFS.items()))
---
# Applies all of it after every sync. Re-run by hand: sync `theater` in Argo CD.
apiVersion: batch/v1
kind: Job
metadata:
  name: arr-import-lists
  namespace: theater
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arr-import-lists
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: import-lists
          # renovate: datasource=docker depName=python
          image: python:3.15.2-alpine3.24@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
          imagePullPolicy: IfNotPresent
          command: ["python3", "/scripts/import-lists.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PLEX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: plex-token
                  key: PLEX_TOKEN
          envFrom:
            # SONARR_API_KEY, RADARR_API_KEY.
            - secretRef:
                name: recyclarr-api-keys
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: arr-import-lists
