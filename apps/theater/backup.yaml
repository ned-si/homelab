# Backups for the `theater` namespace: the six /config volumes (restic) and
# logical dumps of the four *arr Postgres clusters. The dumps are a second,
# independent copy: the clusters also archive WAL and take daily base backups
# through the Barman Cloud plugin (cnpg-backup.yaml).
#
# One restic repository, `theater/configs`. Every snapshot is tagged
# `theater-configs` (one entry in platform/backup-verify/restore-files.yaml)
# plus its app tag. bootstrap/aws-backup/main.tf needs the repository in
# `local.restic_repos`, or its packs get no lifecycle rule and stay in S3
# Standard; scripts/check-restic-repos.sh keeps the two lists equal.
#
# One job per volume: each /config is ReadWriteOnce on its app's node, so
# each job carries a podAffinity to that app. Jobs start ten minutes apart
# because restic takes an exclusive repository lock for `backup`.
# `forget --prune` runs monthly in theater-configs-prune: it holds the lock
# much longer, and packs move to Glacier IR (90-day minimum billing), so
# pruning nightly saves nothing.
#
# bazarr's config job is in backup-bazarr.yaml (SQLite in /config, best
# effort).
#
# Consistency per tag:
#
#   theater-postgres        consistent: pg_dump is one transaction.
#   sonarr/radarr/lidarr/prowlarr
#                           consistent: the data is in Postgres; /config holds
#                           config.xml (written by rename), the app's Backups/
#                           zips and data-protection keys. logs.db and
#                           MediaCover/ are excluded.
#   plex                    consistent: live SQLite excluded, Plex's own
#                           database backups included (see the plex job).
#   jellyfin-config         consistent (XML).
#   jellyfin-db-besteffort  not consistent, tagged so (see the jellyfin job).
#
# Apps are not scaled down for the backup: selfHeal reverts `replicas: 0`
# within seconds. A sqlite3 online backup (`.backup`) before restic is the
# fix for the one inconsistent tag (#746).
#
# Not backed up:
#
#   theater-data (NFS media)  PV reclaimPolicy Retain, mounted readOnly by
#                             Plex and Jellyfin, ZFS snapshots on the NAS, and
#                             re-acquirable. See docs/backups.md.
#   qbittorrent-config        reconstructible; a restored copy could bring back
#                             a stale ipc socket (docs/runbooks/arr-qbittorrent.md).
#   plex-transcode, jellyfin-cache  scratch.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: theater-backup-scripts
  namespace: theater
data:
  # One script for six jobs, so an exclude fixed in one cannot drift from
  # the others.
  backup-config.sh: |
    #!/bin/sh
    # Usage: backup-config.sh <tag> <path> [extra restic backup args...]
    #
    # `sh`, not bash: the restic image is Alpine and has no bash. Nothing here
    # needs it.
    set -eu

    TAG="$1"
    shift
    SRC="$1"
    shift

    # Idempotent-by-failure: `init` errors if the repository already exists,
    # which is the normal case from the second run onwards.
    restic init 2>/dev/null || true

    echo "=== ${TAG}: backing up ${SRC} ==="

    # Two tags on every snapshot, doing two different jobs:
    #
    #   theater-configs  a repository-wide marker, so
    #                    platform/backup-verify/restore-files.yaml can verify this
    #                    repository with a single entry.
    #   $TAG             the per-app identity (sonarr-config, radarr-config, ...).
    #                    This is what `--group-by host,paths,tags` in
    #                    forget-and-prune.sh keys on to give each app its own
    #                    retention budget. Without the per-app tag in the
    #                    grouping, all six would share one.
    restic backup "$SRC" \
      --tag theater-configs \
      --tag "$TAG" \
      --host theater \
      "$@" \
      --verbose

    echo "=== ${TAG}: done ==="

  # Retention and integrity, monthly in theater-configs-prune. A separate
  # script so the nightly jobs cannot call it: `forget --prune` holds the
  # repository lock far longer than a backup.
  forget-and-prune.sh: |
    #!/bin/sh
    set -eu

    # ###########################################################################
    # `--group-by host,paths,tags` IS LOAD-BEARING. DO NOT REMOVE IT.
    #
    # restic's default is `--group-by host,paths` -- TAGS ARE NOT INCLUDED.
    #
    # Every one of the six config jobs backs up the path `/config` with
    # `--host theater`. So under the default grouping they all land in ONE group,
    # and `--keep-monthly 12` keeps ONE snapshot per month for the whole group:
    # the most recent, which is jellyfin's. sonarr's, radarr's, lidarr's,
    # prowlarr's and plex's snapshots from the same night are forgotten and
    # pruned.
    #
    # It fails SILENTLY, which is what makes it dangerous: the weekly restore
    # drill in platform/backup-verify/restore-files.yaml verifies this repository
    # by the tag `theater-configs`, and jellyfin's surviving snapshot carries that
    # tag -- so the drill stays green while five apps have no old config backup.
    #
    # Adding `tags` to the grouping gives each app its own retention budget.
    # ###########################################################################
    #
    # `--keep-within 3m` keeps every snapshot for three months, so no pack
    # becomes unused before Glacier IR's 90-day minimum. After that one snapshot
    # per month is kept for a year: these volumes are a few hundred megabytes in
    # total, so depth is nearly free, and a bad *arr configuration change (a
    # mangled quality profile, a deleted indexer) is the kind of thing noticed
    # weeks later.
    restic forget \
      --host theater \
      --group-by host,paths,tags \
      --keep-within 3m \
      --keep-monthly 12 \
      --prune

    # Structural check after the prune. Actually restoring data is a separate
    # CronJob: platform/backup-verify/.
    restic check --with-cache

  # Logical dumps of the four *arr databases: pg_dump in an initContainer
  # (CNPG postgres image) writes to an emptyDir that the restic container
  # reads. No single image has both tools.
  dump-postgres.sh: |
    #!/bin/bash
    # `bash`, deliberately: `set -o pipefail` is required below and dash does
    # not have it. The CNPG postgres image is Debian-based and has bash.
    set -uo pipefail

    OUT=/dumps
    rc=0

    # Credentials come from the CloudNativePG-generated `<cluster>-app` Secrets,
    # mounted as directories of files rather than as twenty environment
    # variables. CNPG rotates these itself, so there is no password in git in
    # any form -- not even encrypted. Bazarr is not here: it runs on SQLite
    # (backup-bazarr.yaml).
    for app in sonarr radarr lidarr prowlarr; do
      d="/creds/${app}"
      if [ ! -f "$d/password" ]; then
        echo "FAIL ${app}: no credentials mounted at ${d}"
        rc=1
        continue
      fi

      host=$(cat "$d/host")
      port=$(cat "$d/port")
      user=$(cat "$d/user")
      db=$(cat "$d/dbname")
      f="${OUT}/pg-${app}.dump"

      # -Fc, custom format: compressed, and pg_restore can inspect it, which is
      # what makes verification possible at all. Matches what
      # scripts/dump-databases.sh produces, so scripts/verify-dump-restore.sh
      # can be pointed straight at a restored file.
      #
      # pg_dump is transactional: the dump is a snapshot of one instant, not a
      # smear across the run. This is the ONLY consistency guarantee in this
      # file that needs no caveat.
      if PGPASSWORD="$(cat "$d/password")" \
         pg_dump -h "$host" -p "$port" -U "$user" -d "$db" -Fc -f "$f"; then
        # A pg_dump custom archive always begins with the five bytes "PGDMP".
        # Local, instant, and it catches the case where the file is actually an
        # error message -- which a non-zero exit code does not always give you.
        if [ "$(head -c 5 "$f")" = "PGDMP" ]; then
          echo "ok   ${app}  $(du -h "$f" | cut -f1)"
        else
          echo "FAIL ${app}: output is not a pg_dump archive"
          rm -f "$f"
          rc=1
        fi
      else
        echo "FAIL ${app}: pg_dump exited non-zero"
        # Remove the partial file. Leaving it would let restic back up a
        # truncated dump that restores to nothing -- the classic silent backup
        # failure, and the one this whole repository is written against.
        rm -f "$f"
        rc=1
      fi
    done

    # Non-zero fails the initContainer, which fails the pod, which is what makes
    # FileBackupJobFailed fire. A dump job that half-worked must not report
    # success, because the restic container would then upload three of four
    # databases and the snapshot would look complete.
    exit $rc
---
# =========================================================================
# The four *arr databases.
# =========================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: theater-postgres-backup
  namespace: theater
spec:
  # 03:40 -- after Immich's library job starts at 03:30 and before the config
  # jobs start at 04:00.
  schedule: "40 3 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: theater-postgres-backup
        spec:
          restartPolicy: OnFailure
          # No podAffinity: no application volume; the databases are reached
          # through their `-rw` Services.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              # Same image as the four *arr clusters, so pg_dump matches the
              # server.
              # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
              image: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/scripts/dump-postgres.sh"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: dumps
                  mountPath: /dumps
                - name: creds-sonarr
                  mountPath: /creds/sonarr
                  readOnly: true
                - name: creds-radarr
                  mountPath: /creds/radarr
                  readOnly: true
                - name: creds-lidarr
                  mountPath: /creds/lidarr
                  readOnly: true
                - name: creds-prowlarr
                  mountPath: /creds/prowlarr
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/backup-config.sh", "theater-postgres", "/dumps"]
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/theater/configs
                - name: RESTIC_CACHE_DIR
                  value: /cache
                # restic's temp pack files; /tmp is read-only here.
                - name: TMPDIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: dumps
                  mountPath: /dumps
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: scripts
              configMap:
                name: theater-backup-scripts
                defaultMode: 0755
            # A few tens of MB. sizeLimit guards the node's 29 GB eMMC, which
            # also holds kubelet and containerd.
            - name: dumps
              emptyDir:
                sizeLimit: 2Gi
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
            - name: creds-sonarr
              secret:
                secretName: sonarr-postgresql-app
            - name: creds-radarr
              secret:
                secretName: radarr-postgresql-app
            - name: creds-lidarr
              secret:
                secretName: lidarr-postgresql-app
            - name: creds-prowlarr
              secret:
                secretName: prowlarr-postgresql-app
---
# =========================================================================
# The six /config volumes. sonarr is the reference; the others note only
# their differences.
# =========================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: theater-config-backup-sonarr
  namespace: theater
spec:
  schedule: "0 4 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: theater-config-backup-sonarr
        spec:
          restartPolicy: OnFailure
          # `sonarr-config` is ReadWriteOnce: the pod must run on sonarr's node
          # or the volume will not attach.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: sonarr
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            # PUID/PGID 1000, as every app in this namespace (sonarr.yaml):
            # the volumes are owned by it.
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /scripts/backup-config.sh
                - sonarr
                - /config
                # MediaCover: artwork the app re-downloads; most of the volume.
                - --exclude=/config/MediaCover
                # logs.db: the one live SQLite file (DB logging is disabled in
                # sonarr.yaml). Excluding it keeps the snapshot consistent.
                - --exclude=/config/logs.db
                - --exclude=/config/logs.db-shm
                - --exclude=/config/logs.db-wal
                - --exclude=/config/logs
                # Sentry crash-report spool. Transient, and it can contain
                # request data.
                - --exclude=/config/Sentry
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/theater/configs
                - name: RESTIC_CACHE_DIR
                  value: /cache
                # restic's temp pack files; /tmp is read-only here.
                - name: TMPDIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: scripts
              configMap:
                name: theater-backup-scripts
                defaultMode: 0755
            - name: config
              persistentVolumeClaim:
                claimName: sonarr-config
                readOnly: true
            # emptyDir, not a PVC: the shared repository is a few hundred MB.
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
---
