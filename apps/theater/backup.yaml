# =========================================================================
# Plex.
#
# The live SQLite databases (library.db, blobs.db) are excluded: a file copy
# of an open database can be torn, and the restic image has no sqlite3.
# Instead the job includes Plex's own database backups, written by the
# scheduled task "Backup database every three days" as
# com.plexapp.plugins.library.db-YYYY-MM-DD in the same directory.
#
# This backup depends on that task (Settings > Manage > Scheduled Tasks,
# on by default). Without a dated file, restic still succeeds with only
# Preferences.xml. Check:
#     kubectl -n theater exec deploy/plex -- \
#       ls -la '/config/Library/Application Support/Plex Media Server/Plug-in Support/Databases/'
#
# Preferences.xml holds the server identity and account token; losing it
# means re-claiming the server and re-pairing every client.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: theater-config-backup-plex
  namespace: theater
spec:
  schedule: "40 4 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: theater-config-backup-plex
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: plex
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /scripts/backup-config.sh
                - plex
                - /config
                # --- the live databases. Excluded; see the block above. ------
                - --exclude=**/Databases/com.plexapp.plugins.library.db
                - --exclude=**/Databases/com.plexapp.plugins.library.db-wal
                - --exclude=**/Databases/com.plexapp.plugins.library.db-shm
                - --exclude=**/Databases/com.plexapp.plugins.blobs.db
                - --exclude=**/Databases/com.plexapp.plugins.blobs.db-wal
                - --exclude=**/Databases/com.plexapp.plugins.blobs.db-shm
                # --- derived: posters, fanart, thumbnails, analysis ---------
                - --exclude=**/Metadata
                - --exclude=**/Media
                - --exclude=**/Cache
                - --exclude=**/Codecs
                - --exclude=**/Crash?Reports
                - --exclude=**/Logs
                - --exclude=**/Diagnostics
                - --exclude=**/Updates
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/theater/configs
                - name: RESTIC_CACHE_DIR
                  value: /cache
                # restic's temp pack files; /tmp is read-only here.
                - name: TMPDIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: scripts
              configMap:
                name: theater-backup-scripts
                defaultMode: 0755
            - name: config
              persistentVolumeClaim:
                claimName: plex-config
                readOnly: true
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
---
# =========================================================================
# Jellyfin, the last job of the night. Two snapshots:
#
#   jellyfin-config          XML configuration and plugin settings; consistent.
#   jellyfin-db-besteffort   jellyfin.db and library.db, live SQLite; may be
#                            torn.
#
# Jellyfin core has no consistent export, the restic image has no sqlite3,
# and selfHeal prevents scaling down. At risk if torn: accounts, watch state,
# playback positions; not media or server settings. A sqlite3 online backup
# (`.backup`) before restic would fix it (#746).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: theater-config-backup-jellyfin
  namespace: theater
spec:
  # 05:00, after bazarr's 04:50 (backup-bazarr.yaml).
  schedule: "0 5 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      # Longer than the others: two snapshots, and the database one can be large.
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: theater-config-backup-jellyfin
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: jellyfin
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              # Inline rather than via backup-config.sh, because this is the
              # only job that takes two snapshots with different guarantees.
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  restic init 2>/dev/null || true

                  # 1. CONSISTENT: the XML configuration and plugin settings.
                  restic backup /config \
                    --tag theater-configs \
                    --tag jellyfin-config \
                    --host theater \
                    --exclude '/config/data/*.db' \
                    --exclude '/config/data/*.db-wal' \
                    --exclude '/config/data/*.db-shm' \
                    --exclude '/config/data/subtitles' \
                    --exclude '/config/data/transcodes' \
                    --exclude '/config/metadata' \
                    --exclude '/config/log' \
                    --exclude '/config/cache' \
                    --verbose

                  # 2. BEST EFFORT: the live databases, in their own snapshot
                  #    with a tag that says so. The -wal/-shm files are included
                  #    because SQLite needs them to recover the database on
                  #    open; taking the .db alone would silently discard
                  #    committed transactions. It still is not atomic across the
                  #    three files, which is precisely what the tag admits.
                  #
                  #    `|| true`: a missing -wal is normal in rollback-journal
                  #    mode, and a glob that matches nothing must not fail the
                  #    whole job and skip the check below.
                  restic backup /config/data \
                    --tag theater-configs \
                    --tag jellyfin-db-besteffort \
                    --host theater \
                    --exclude '/config/data/subtitles' \
                    --exclude '/config/data/transcodes' \
                    --verbose || true

                  # 3. Structural check of the WHOLE repository, once per
                  #    night, from the last job. Retention is monthly, in
                  #    theater-configs-prune.
                  restic check --with-cache
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/theater/configs
                - name: RESTIC_CACHE_DIR
                  value: /cache
                # restic's temp pack files; /tmp is read-only here.
                - name: TMPDIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  # The check loads the index of the whole repository, so this
                  # one needs more headroom than the others.
                  memory: 1536Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: scripts
              configMap:
                name: theater-backup-scripts
                defaultMode: 0755
            - name: config
              persistentVolumeClaim:
                claimName: jellyfin-config
                readOnly: true
            - name: cache
              emptyDir:
                # Larger than the others: the check needs the repository index
                # locally, and this repository holds six apps' snapshots.
                sizeLimit: 3Gi
---
# Retention for theater/configs, monthly (1st, 13:00), away from the nightly
# jobs that share the lock. S3 only: no app volume, no affinity.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: theater-configs-prune
  namespace: theater
spec:
  schedule: "0 13 1 * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: theater-configs-prune
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/forget-and-prune.sh"]
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/theater/configs
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: TMPDIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  # The prune pass builds an in-memory index of the whole
                  # repository.
                  memory: 1536Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: scripts
              configMap:
                name: theater-backup-scripts
                defaultMode: 0755
            - name: cache
              emptyDir:
                sizeLimit: 3Gi
