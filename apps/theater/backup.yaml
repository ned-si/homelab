---
# =========================================================================
# PLEX.
#
# ###########################################################################
# # WHAT IS INCLUDED HERE IS SMALL AND CONSISTENT. WHAT IS EXCLUDED IS THE
# # 20GB OF DERIVED METADATA AND THE LIVE DATABASES.
# #
# # The live SQLite files -- com.plexapp.plugins.library.db and
# # com.plexapp.plugins.blobs.db -- are EXCLUDED. A file-level copy of a
# # database Plex has open can capture a torn write, and restic cannot know it
# # did. There is no sqlite3 binary in the restic image, so the `sqlite3 .backup`
# # trick from apps/paperless/backup.yaml is unavailable.
# #
# # Instead this includes PLEX'S OWN DATABASE BACKUPS. Plex runs a scheduled
# # task, "Backup database every three days", which writes
# #     com.plexapp.plugins.library.db-YYYY-MM-DD
# # into the same Databases/ directory, produced through SQLite's backup API and
# # therefore CONSISTENT.
# #
# # THAT SETTING IS A DEPENDENCY OF THIS BACKUP. It is enabled by default, but
# # confirm it rather than assume:
# #     Plex -> Settings -> Manage -> Scheduled Tasks -> "Backup database"
# # and verify a dated file exists:
# #     kubectl -n theater exec deploy/plex -- \
# #       ls -la '/config/Library/Application Support/Plex Media Server/Plug-in Support/Databases/'
# #
# # If no dated file is there, this job backs up Preferences.xml and nothing
# # else of substance -- and it will not tell you, because from restic's point of
# # view the backup succeeded. That is the one silent failure mode left in this
# # file, and it is the reason it is written in capital letters.
# ###########################################################################
#
# Preferences.xml is the other thing that matters and is easy to overlook: it
# holds the server's machine identity and its Plex account token. Losing it
# means re-claiming the server, and every client re-pairing.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: theater-config-backup-plex
  namespace: theater
spec:
  schedule: "40 4 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: theater-config-backup-plex
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: plex
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /scripts/backup-config.sh
                - plex
                - /config
                # --- the live databases. Excluded; see the block above. ------
                - --exclude=**/Databases/com.plexapp.plugins.library.db
                - --exclude=**/Databases/com.plexapp.plugins.library.db-wal
                - --exclude=**/Databases/com.plexapp.plugins.library.db-shm
                - --exclude=**/Databases/com.plexapp.plugins.blobs.db
                - --exclude=**/Databases/com.plexapp.plugins.blobs.db-wal
                - --exclude=**/Databases/com.plexapp.plugins.blobs.db-shm
                # --- derived, and it is nearly all of the 20GB ---------------
                # Metadata/ and Media/ are posters, fanart, chapter thumbnails
                # and analysis, all re-downloaded or re-generated from the
                # library. Backing them up would multiply the bill for data Plex
                # rebuilds on its own.
                - --exclude=**/Metadata
                - --exclude=**/Media
                - --exclude=**/Cache
                - --exclude=**/Codecs
                - --exclude=**/Crash?Reports
                - --exclude=**/Logs
                - --exclude=**/Diagnostics
                - --exclude=**/Updates
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/theater/configs
                - name: RESTIC_CACHE_DIR
                  value: /cache
                # restic writes temp pack files here while uploading. Without this it uses
                # /tmp, which does not exist writable under readOnlyRootFilesystem, and
                # `restic backup` fails the moment it has a pack to flush. /cache is
                # already mounted and writable.
                - name: TMPDIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: scripts
              configMap:
                name: theater-backup-scripts
                defaultMode: 0755
            - name: config
              persistentVolumeClaim:
                claimName: plex-config
                readOnly: true
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
---
# =========================================================================
# JELLYFIN, the last job of the night.
#
# ###########################################################################
# # JELLYFIN IS THE ONE CASE IN THIS FILE THAT CANNOT BE MADE CONSISTENT, AND
# # IT IS SPLIT INTO TWO SNAPSHOTS SO THAT IS VISIBLE AT RESTORE TIME.
# #
# #   tag jellyfin-config          the XML configuration under /config/config
# #                                and the plugin configurations. Static files,
# #                                CONSISTENT.
# #
# #   tag jellyfin-db-besteffort   /config/data/jellyfin.db and library.db, live
# #                                SQLite, POSSIBLY TORN.
# #
# # Jellyfin core has no consistent database export (that is a plugin), and
# # there is no sqlite3 in the restic image. Quiescing is impossible because Argo
# # CD's selfHeal reverts `replicas: 0` within seconds. So the choice is
# # best-effort-and-labelled or nothing, and nothing is worse.
# #
# # WHAT IS AT RISK IF THE DB COPY IS TORN: user accounts, watch state and
# # playback positions. Not the media, and not the server's settings. Bounded,
# # annoying, and honestly described rather than hidden behind a tag that says
# # "jellyfin".
# #
# # The fix, when watch history starts to matter, is snapshot-then-backup via
# # the CSI VolumeSnapshot machinery, or VolSync. See
# # platform/kube-prometheus-stack/routes/grafana-backup.yaml for why that is
# # not hand-rolled here.
# ###########################################################################
apiVersion: batch/v1
kind: CronJob
metadata:
  name: theater-config-backup-jellyfin
  namespace: theater
spec:
  # 05:00, the last slot of the night; 04:50 is kept for bazarr
  # (backup-bazarr.yaml).
  schedule: "0 5 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      # Longer than the others: two snapshots, and the database one can be large.
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: theater-config-backup-jellyfin
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: jellyfin
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1
              imagePullPolicy: IfNotPresent
              # Inline rather than via backup-config.sh, because this is the
              # only job that takes two snapshots with different guarantees.
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  restic init 2>/dev/null || true

                  # 1. CONSISTENT: the XML configuration and plugin settings.
                  restic backup /config \
                    --tag theater-configs \
                    --tag jellyfin-config \
                    --host theater \
                    --exclude '/config/data/*.db' \
                    --exclude '/config/data/*.db-wal' \
                    --exclude '/config/data/*.db-shm' \
                    --exclude '/config/data/subtitles' \
                    --exclude '/config/data/transcodes' \
                    --exclude '/config/metadata' \
                    --exclude '/config/log' \
                    --exclude '/config/cache' \
                    --verbose

                  # 2. BEST EFFORT: the live databases, in their own snapshot
                  #    with a tag that says so. The -wal/-shm files are included
                  #    because SQLite needs them to recover the database on
                  #    open; taking the .db alone would silently discard
                  #    committed transactions. It still is not atomic across the
                  #    three files, which is precisely what the tag admits.
                  #
                  #    `|| true`: a missing -wal is normal in rollback-journal
                  #    mode, and a glob that matches nothing must not fail the
                  #    whole job and skip the check below.
                  restic backup /config/data \
                    --tag theater-configs \
                    --tag jellyfin-db-besteffort \
                    --host theater \
                    --exclude '/config/data/subtitles' \
                    --exclude '/config/data/transcodes' \
                    --verbose || true

                  # 3. Structural check of the WHOLE repository, once per
                  #    night, from the last job. Retention is monthly, in
                  #    theater-configs-prune.
                  restic check --with-cache
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/theater/configs
                - name: RESTIC_CACHE_DIR
                  value: /cache
                # restic writes temp pack files here while uploading. Without this it uses
                # /tmp, which does not exist writable under readOnlyRootFilesystem, and
                # `restic backup` fails the moment it has a pack to flush. /cache is
                # already mounted and writable.
                - name: TMPDIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  # The check loads the index of the whole repository, so this
                  # one needs more headroom than the others.
                  memory: 1536Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: scripts
              configMap:
                name: theater-backup-scripts
                defaultMode: 0755
            - name: config
              persistentVolumeClaim:
                claimName: jellyfin-config
                readOnly: true
            - name: cache
              emptyDir:
                # Larger than the others: the check needs the repository index
                # locally, and this repository holds six apps' snapshots.
                sizeLimit: 3Gi
---
# Retention for the whole theater/configs repository, once a month, via
# forget-and-prune.sh. The 1st of the month at 13:00, after the other monthly
# prunes and far from the nightly jobs that share this repository's lock. Talks
# to S3 only, so it needs no app volume and no affinity.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: theater-configs-prune
  namespace: theater
spec:
  schedule: "0 13 1 * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: theater-configs-prune
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/forget-and-prune.sh"]
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/theater/configs
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: TMPDIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  # The prune pass builds an in-memory index of the whole
                  # repository.
                  memory: 1536Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: scripts
              configMap:
                name: theater-backup-scripts
                defaultMode: 0755
            - name: cache
              emptyDir:
                sizeLimit: 3Gi
