# The four *arr databases to S3 through the Barman Cloud plugin: WAL and a
# daily base backup each, 30 days of point-in-time recovery (docs/backups.md).
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-backup
  namespace: theater
  annotations:
    # Before the Cluster: the plugin sizes its sidecar when the instance
    # Pod is created (per-app-hardening design.md, Sizing).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://ned-si-homelab-backups/cnpg
    endpointURL: https://s3.eu-central-1.amazonaws.com
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      # boto3 signs for this region; it must match the bucket.
      - name: AWS_DEFAULT_REGION
        value: eu-central-1
    # The injected plugin-barman-cloud sidecar, 14-day sizing (#726).
    resources:
      requests:
        cpu: 20m
        memory: 96Mi
      limits:
        memory: 384Mi
# Six-field crons (seconds first), UTC, staggered 00:30-01:00.
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: sonarr-postgresql-daily
  namespace: theater
spec:
  schedule: "0 30 0 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: sonarr-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: radarr-postgresql-daily
  namespace: theater
spec:
  schedule: "0 40 0 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: radarr-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: lidarr-postgresql-daily
  namespace: theater
spec:
  schedule: "0 50 0 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: lidarr-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: prowlarr-postgresql-daily
  namespace: theater
spec:
  schedule: "0 0 1 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: prowlarr-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
