---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: qbittorrent
  name: qbittorrent
  namespace: theater
spec:
  replicas: 1
  strategy:
    rollingUpdate: null
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qbittorrent
          # renovate: datasource=docker depName=ghcr.io/hotio/qbittorrent
          image: ghcr.io/hotio/qbittorrent:release-5.3.0@sha256:040a8c0665a3ab9bf6a9c5477b12fc64430de3f0b5dd70df4145d7dcc8462b9d
          imagePullPolicy: Always
          # Root profile: s6 runs as root and drops to hotio (1000) with
          # s6-setuidgid, which needs SETGID, SETUID and KILL to stop it.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "KILL", "SETGID", "SETUID"]
          env:
            - name: TZ
              value: Europe/Zurich
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: seed
              containerPort: 50000
              protocol: TCP
          # Ready = answers on the endpoint the PostSync smoke test checks.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # A stale ipc-socket makes the process exit every two seconds;
          # this restarts the container (docs/runbooks/arr-qbittorrent.md).
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: torrents
              mountPath: /data/torrents
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: torrents
          nfs:
            server: 192.168.1.228
            path: /mnt/homelab/k8s/nfs/torrents
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: theater
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  storageClassName: iscsi
  # The existing zvol (infrastructure/iscsi-volumes/).
  volumeName: pvc-734ee65c-a1bc-4547-80fd-274160849198
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: qbittorrent
  name: qbittorrent
  namespace: theater
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: qbittorrent
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: qbittorrent
  name: qbittorrent-seed
  namespace: theater
  annotations:
    lbipam.cilium.io/ips: "192.168.1.200"
spec:
  type: LoadBalancer
  ports:
    - name: seed
      port: 50000
      targetPort: seed
      protocol: TCP
  selector:
    app.kubernetes.io/name: qbittorrent
