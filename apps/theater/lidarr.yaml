# Ported byte-for-byte in spec from the running cluster (legacy tree at the
# all-apps pin), ADR 0002. Differences from live, all intended:
#   - inline credentials replaced by secretKeyRef to SOPS Secrets with the same
#     value (per-key sha256 checked), which restarts the pod once on adoption;
#   - PVCs carry argocd.argoproj.io/sync-options: Delete=false,Prune=false.
# Hardening (probes, security contexts, resources, image digests) is a later,
# separate change: docs/roadmap.md.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lidarr-postgresql
  namespace: theater
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  instances: 1
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  storage:
    size: 5Gi
  # Created from its Barman Cloud backup; archives under a new server name
  # (CNPG refuses a non-empty path; the old one stays readable). docs/bootstrap.md
  bootstrap:
    recovery:
      source: origin
      database: app
      owner: app
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: cnpg-backup
          serverName: lidarr-postgresql
  # WAL archiving and base backups to S3 (cnpg-backup.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # The webhook defaults this; stating it keeps Argo CD's diff clean.
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-backup
        serverName: lidarr-postgresql-t1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: lidarr
  name: lidarr
  namespace: theater
  # Replace, not server-side apply: the API server defaulted
  # strategy.rollingUpdate when this Deployment was created, and an apply
  # cannot remove a field another manager owns, so Recreate is rejected.
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: 1
  # One RWO config volume: the new pod cannot attach it until the old one
  # is gone, so a rolling update would hang.
  strategy:
    rollingUpdate: null
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lidarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lidarr
    spec:
      containers:
        - name: lidarr
          # renovate: datasource=docker depName=ghcr.io/hotio/lidarr
          image: ghcr.io/hotio/lidarr:release-3.1.0.4875
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Europe/Zurich
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: LIDARR__SERVER__URLBASE
              value: /arr/lidarr
          ports:
            - name: http
              containerPort: 8686
              protocol: TCP
          # Ready = answers on the endpoint the PostSync smoke test checks.
          readinessProbe:
            httpGet:
              path: /arr/lidarr/ping
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lidarr-config
        - name: media
          nfs:
            server: 192.168.1.228
            path: /mnt/homelab/k8s/nfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidarr-config
  namespace: theater
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  storageClassName: iscsi
  # The existing zvol (infrastructure/iscsi-volumes/).
  volumeName: pvc-50d17d24-086b-4145-86f6-4e8488de04db
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: lidarr
  name: lidarr
  namespace: theater
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8686
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: lidarr
