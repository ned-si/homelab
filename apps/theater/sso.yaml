# Keycloak SSO in front of the theater admin UIs: one oauth2-proxy,
# `theater-sso`, on https://theater.lilalala.com/arr/<app> (docs/theater.md,
# "Login").
#
#     Gateway --/arr/<app>, /oauth2--> theater-sso:4180 --> <app>:<port>
#
# The *arr apps, LazyLibrarian, Bazarr and qBittorrent have no OIDC support,
# so the login sits in front of them. The proxy routes by path (alpha config
# below): each app keeps its URL base /arr/<app>; qBittorrent has none, so its
# prefix is stripped. Access needs membership of the Keycloak group
# `TheaterAdmins`; the client `theater-sso` and the group are realm code
# (platform/keycloak/realm/platform.conf, `proxy_clients`).
#
# Each app keeps its own form login behind the proxy: that local admin is the
# break-glass account, reached with a port-forward when Keycloak is down.
# Plex (the `/` catch-all) and Jellyfin stay off SSO: their TV apps cannot
# complete an OIDC login. In-cluster API calls (Prowlarr, Bazarr, Recyclarr,
# the *arr apps to qBittorrent) go pod to pod and never pass the proxy.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: theater-sso
  namespace: theater
data:
  alpha-config.yaml: |
    upstreamConfig:
      upstreams:
        - id: sonarr
          path: ^/arr/sonarr(/.*)?$
          rewriteTarget: /arr/sonarr$1
          uri: http://sonarr.theater.svc.cluster.local:8989
          timeout: 300s
        - id: radarr
          path: ^/arr/radarr(/.*)?$
          rewriteTarget: /arr/radarr$1
          uri: http://radarr.theater.svc.cluster.local:7878
          timeout: 300s
        - id: lidarr
          path: ^/arr/lidarr(/.*)?$
          rewriteTarget: /arr/lidarr$1
          uri: http://lidarr.theater.svc.cluster.local:8686
          timeout: 300s
        - id: prowlarr
          path: ^/arr/prowlarr(/.*)?$
          rewriteTarget: /arr/prowlarr$1
          uri: http://prowlarr.theater.svc.cluster.local:9696
          timeout: 300s
        - id: bazarr
          path: ^/arr/bazarr(/.*)?$
          rewriteTarget: /arr/bazarr$1
          uri: http://bazarr.theater.svc.cluster.local:6767
          timeout: 300s
        - id: lazylibrarian
          path: ^/arr/lazylibrarian(/.*)?$
          rewriteTarget: /arr/lazylibrarian$1
          uri: http://lazylibrarian.theater.svc.cluster.local:5299
          timeout: 300s
        # No URL base in qBittorrent: strip the prefix. Its WebUI uses
        # relative links, so it works under the prefix.
        - id: qbittorrent
          path: ^/arr/qbittorrent/(.*)$
          rewriteTarget: /$1
          uri: http://qbittorrent.theater.svc.cluster.local:8080
          timeout: 300s
    server:
      bindAddress: 0.0.0.0:4180
    providers:
      - id: keycloak
        provider: keycloak-oidc
        clientID: theater-sso
        clientSecretFile: /secrets/client-secret
        scope: openid email profile groups
        allowedGroups:
          - TheaterAdmins
        code_challenge_method: S256
        oidcConfig:
          issuerURL: https://auth.lilalala.com/realms/homelab
          emailClaim: email
          groupsClaim: groups
          userIDClaim: email
          audienceClaims:
            - aud
          insecureSkipNonce: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: theater-sso
  namespace: theater
  labels:
    app.kubernetes.io/name: theater-sso
    app.kubernetes.io/component: sso-proxy
spec:
  replicas: 1
  # No volume: a rolling update keeps the UIs reachable during a change.
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: theater-sso
  template:
    metadata:
      labels:
        app.kubernetes.io/name: theater-sso
        app.kubernetes.io/component: sso-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        # `nonroot` in the distroless base image.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          # renovate: datasource=docker depName=quay.io/oauth2-proxy/oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          imagePullPolicy: IfNotPresent
          args:
            - --alpha-config=/config/alpha-config.yaml
            # Authorization is the group in the alpha config; this only asks
            # for an email claim.
            - --email-domain=*
            # Behind the Gateway: trust X-Forwarded-* for scheme and host.
            - --reverse-proxy=true
            # Long session, like the other user apps (docs/architecture.md,
            # "Sessions"); the refresh renews it from the Keycloak session.
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=8760h
            - --cookie-refresh=1h
            # API and calendar-feed paths skip the Keycloak login, for mobile
            # clients (nzb360, LunaSea) and calendar subscriptions: each app
            # still requires its own API key there. Not qBittorrent, whose
            # API takes a session login rather than a key.
            - --skip-auth-route=^/arr/(sonarr|radarr|lidarr|prowlarr|bazarr|lazylibrarian)/api(/.*)?$
            - --skip-auth-route=^/arr/(sonarr|radarr)/feed/
            # Post-login redirects stay on this host.
            - --whitelist-domain=theater.lilalala.com
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: theater-sso
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          # /ping needs no session and does not depend on Keycloak, so a
          # Keycloak outage does not restart the proxy.
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: theater-sso
        - name: secrets
          secret:
            secretName: theater-sso
            items:
              - key: client-secret
                path: client-secret
---
apiVersion: v1
kind: Service
metadata:
  name: theater-sso
  namespace: theater
  labels:
    app.kubernetes.io/name: theater-sso
    app.kubernetes.io/component: sso-proxy
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4180
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: theater-sso
