# Bazarr: downloads subtitles for what Sonarr and Radarr manage, as external
# .srt files next to the media. https://theater.lilalala.com/arr/bazarr, its
# own form login (user `admin`). Setup and policy: docs/theater.md, "Subtitles".
#
# Configuration is code, in two places:
#   - `seed.sh` (init container) writes a minimal config.yaml on first start
#     only: the URL base, the API key and the login, so the UI is never up
#     without authentication;
#   - the `bazarr-settings` PostSync Job (`settings.py`) applies everything
#     else through Bazarr's settings API on every sync, and the `kids-fr` auto
#     tag in Sonarr and Radarr. Changes made in the UI to these keys are
#     overwritten on the next sync; anything else stays the UI's.
#
# Language profiles:
#   EN  English, the default for every series and movie
#   FR  French, full and forced; assigned to titles tagged `kids-fr`, which
#       Sonarr and Radarr set automatically on titles with the quality profile
#       HD-Kids-FR
#
# SQLite in /config/db, not CloudNativePG: everything in it but the download
# history is rebuilt from this file and from Sonarr/Radarr, so a best-effort
# file backup (backup-bazarr.yaml) is enough.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bazarr-config
  namespace: theater
data:
  seed.sh: |
    # First start only: Bazarr fills every other key with its defaults.
    set -eu
    f=/config/config/config.yaml
    if [ -s "$f" ]; then
      echo "config.yaml exists, left to the settings Job"
      exit 0
    fi
    mkdir -p /config/config
    hash=$(printf '%s' "$ADMIN_PASSWORD" | md5sum | cut -d' ' -f1)
    cat > "$f" <<EOF
    general:
      base_url: /arr/bazarr
    auth:
      type: form
      username: admin
      password: $hash
      apikey: $API_KEY
    EOF
    echo "config.yaml seeded"
  settings.py: |
    # Idempotent: apply the managed Bazarr settings and the `kids-fr` auto
    # tag in Sonarr and Radarr. Standard library only.
    import json, os, time, urllib.parse, urllib.request

    TAG = "kids-fr"
    KIDS_PROFILE = "HD-Kids-FR"
    PROVIDERS = ["podnapisi", "gestdown", "tvsubtitles", "yifysubtitles", "soustitreseu", "subsynchro"]
    LANG = lambda i, code, forced: {"id": i, "language": code, "forced": forced,
                                   "hi": "False", "audio_exclude": "False",
                                   "audio_only_include": "False"}
    PROFILES = [
        {"profileId": 1, "name": "EN", "cutoff": None, "tag": None,
         "items": [LANG(1, "en", "False")],
         "mustContain": [], "mustNotContain": [], "originalFormat": 0},
        {"profileId": 2, "name": "FR", "cutoff": None, "tag": TAG,
         "items": [LANG(1, "fr", "False"), LANG(2, "fr", "True")],
         "mustContain": [], "mustNotContain": [], "originalFormat": 0},
    ]

    def call(method, url, key_header, key, body=None, form=None):
        headers = {key_header: key}
        data = None
        if body is not None:
            data = json.dumps(body).encode()
            headers["Content-Type"] = "application/json"
        if form is not None:
            data = urllib.parse.urlencode(form, doseq=True).encode()
            headers["Content-Type"] = "application/x-www-form-urlencoded"
        req = urllib.request.Request(url, data=data, method=method, headers=headers)
        with urllib.request.urlopen(req, timeout=60) as r:
            raw = r.read()
            return json.loads(raw) if raw else None

    def wait(url):
        for _ in range(60):
            try:
                urllib.request.urlopen(url, timeout=10)
                return
            except Exception:
                time.sleep(10)
        raise SystemExit(f"not answering: {url}")

    def auto_tag(name, base, key):
        h = "X-Api-Key"
        profiles = call("GET", f"{base}/api/v3/qualityprofile", h, key)
        pid = next(p["id"] for p in profiles if p["name"] == KIDS_PROFILE)
        tags = call("GET", f"{base}/api/v3/tag", h, key)
        tid = next((t["id"] for t in tags if t["label"] == TAG), None)
        if tid is None:
            tid = call("POST", f"{base}/api/v3/tag", h, key, {"label": TAG})["id"]
        rule = {"name": f"{TAG} (Bazarr FR)", "removeTagsAutomatically": True,
                "tags": [tid],
                "specifications": [{"name": KIDS_PROFILE, "implementation": "QualityProfileSpecification",
                                    "negate": False, "required": True,
                                    "fields": [{"name": "value", "value": pid}]}]}
        rules = call("GET", f"{base}/api/v3/autotagging", h, key)
        old = next((r for r in rules if r["name"] == rule["name"]), None)
        if old is None:
            call("POST", f"{base}/api/v3/autotagging", h, key, rule)
        else:
            call("PUT", f"{base}/api/v3/autotagging/{old['id']}", h, key, dict(rule, id=old["id"]))
        print(f"{name}: auto tag {TAG} -> profile {KIDS_PROFILE} ({pid})")

    sonarr = "http://sonarr.theater.svc.cluster.local:8989/arr/sonarr"
    radarr = "http://radarr.theater.svc.cluster.local:7878/arr/radarr"
    bazarr = "http://bazarr.theater.svc.cluster.local:6767/arr/bazarr"
    auto_tag("sonarr", sonarr, os.environ["SONARR_API_KEY"])
    auto_tag("radarr", radarr, os.environ["RADARR_API_KEY"])

    wait(f"{bazarr}/api/system/ping")
    form = {
        "languages-enabled": ["en", "fr"],
        "languages-profiles": json.dumps(PROFILES),
        "settings-general-base_url": "/arr/bazarr",
        "settings-general-use_sonarr": "true",
        "settings-general-use_radarr": "true",
        "settings-sonarr-ip": "sonarr.theater.svc.cluster.local",
        "settings-sonarr-port": "8989",
        "settings-sonarr-base_url": "/arr/sonarr",
        "settings-sonarr-ssl": "false",
        "settings-sonarr-apikey": os.environ["SONARR_API_KEY"],
        "settings-radarr-ip": "radarr.theater.svc.cluster.local",
        "settings-radarr-port": "7878",
        "settings-radarr-base_url": "/arr/radarr",
        "settings-radarr-ssl": "false",
        "settings-radarr-apikey": os.environ["RADARR_API_KEY"],
        "settings-general-serie_default_enabled": "true",
        "settings-general-serie_default_profile": "1",
        "settings-general-movie_default_enabled": "true",
        "settings-general-movie_default_profile": "1",
        "settings-general-serie_tag_enabled": "true",
        "settings-general-movie_tag_enabled": "true",
        "settings-general-enabled_providers": PROVIDERS,
        # External files next to the video, named <video>.<lang>[.forced].srt.
        "settings-general-subfolder": "current",
        "settings-general-utf8_encode": "true",
        "settings-auth-type": "form",
        "settings-auth-username": "admin",
        "settings-auth-password": os.environ["ADMIN_PASSWORD"],
    }
    call("POST", f"{bazarr}/api/system/settings", "X-API-KEY", os.environ["API_KEY"], form=form)
    print(f"bazarr: settings applied, profiles EN (default) and FR (tag {TAG}), providers {', '.join(PROVIDERS)}")
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-config
  namespace: theater
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  storageClassName: iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: bazarr
  name: bazarr
  namespace: theater
spec:
  replicas: 1
  # One RWO config volume: a rolling update would hang on the attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bazarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazarr
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-config
          # renovate: datasource=docker depName=ghcr.io/hotio/bazarr
          image: ghcr.io/hotio/bazarr:release-1.6.2@sha256:aab1002c1cf03178bfa318706047abbcabd9e6fea5dc2516bfaa44a94608930b
          imagePullPolicy: IfNotPresent
          command: ["sh", "/managed/seed.sh"]
          envFrom:
            - secretRef:
                name: bazarr
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: managed
              mountPath: /managed
              readOnly: true
      containers:
        - name: bazarr
          # Starts as root (s6-overlay), then drops to PUID/PGID.
          # renovate: datasource=docker depName=ghcr.io/hotio/bazarr
          image: ghcr.io/hotio/bazarr:release-1.6.2@sha256:aab1002c1cf03178bfa318706047abbcabd9e6fea5dc2516bfaa44a94608930b
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Zurich
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            # Group-writable subtitle files, so Sonarr and Radarr can still
            # rename or delete the folder.
            - name: UMASK
              value: "002"
          ports:
            - name: http
              containerPort: 6767
              protocol: TCP
          # Unauthenticated health endpoint; also what the PostSync smoke
          # test checks.
          readinessProbe:
            httpGet:
              path: /arr/bazarr/api/system/ping
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /arr/bazarr/api/system/ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /config
            # The share root at /data, like Sonarr and Radarr: the paths they
            # report resolve here unchanged, so no path mapping.
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bazarr-config
        # SITE-SPECIFIC: the NAS.
        - name: data
          nfs:
            server: 192.168.1.228
            path: /mnt/homelab/k8s/nfs
        - name: managed
          configMap:
            name: bazarr-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: bazarr
  name: bazarr
  namespace: theater
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 6767
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: bazarr
---
# Applies the managed settings after every sync (Healthy first, so Bazarr
# answers). Re-run by hand: sync the `theater` app in Argo CD.
apiVersion: batch/v1
kind: Job
metadata:
  name: bazarr-settings
  namespace: theater
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazarr-settings
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: settings
          # renovate: datasource=docker depName=ghcr.io/hotio/bazarr
          image: ghcr.io/hotio/bazarr:release-1.6.2@sha256:aab1002c1cf03178bfa318706047abbcabd9e6fea5dc2516bfaa44a94608930b
          imagePullPolicy: IfNotPresent
          command: ["python3", "/managed/settings.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          envFrom:
            # API_KEY, ADMIN_PASSWORD (apps/secrets/bazarr.sops.yaml).
            - secretRef:
                name: bazarr
            # SONARR_API_KEY, RADARR_API_KEY.
            - secretRef:
                name: recyclarr-api-keys
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: managed
              mountPath: /managed
              readOnly: true
      volumes:
        - name: managed
          configMap:
            name: bazarr-config
