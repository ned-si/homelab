# LazyLibrarian: finds ebooks and audiobooks for qBittorrent (Readarr is
# retired upstream). https://theater.lilalala.com/arr/lazylibrarian, own form
# login (docs/books.md). In `theater` with the share root mounted, so
# downloads hardlink into /data/books: category `ebooks` -> books/ingest
# (Calibre-Web imports it), `audiobooks` -> books/audiobooks. Indexers: public
# ones tagged `books` from Prowlarr.
#
# An init container writes the settings below into config.ini on every start;
# bump `config-version` when managed.conf changes.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lazylibrarian-config
  namespace: theater
data:
  # section.key=value, one per line. ${NAME} comes from the Secret
  # `lazylibrarian` (apps/secrets/lazylibrarian.sops.yaml).
  managed.conf: |
    General.launch_browser=0
    General.ebook_dir=/data/books/ingest
    General.audio_dir=/data/books/audiobooks
    General.download_dir=/data/torrents
    General.ebook_tab=1
    General.audio_tab=1
    General.auth_type=FORM
    WebServer.http_port=5299
    WebServer.http_root=/arr/lazylibrarian
    # Behind the Gateway's TLS: build redirects from X-Forwarded-Proto/Host,
    # so the login redirect stays on https.
    WebServer.http_proxy=1
    WebServer.http_user=${HTTP_USER}
    WebServer.http_pass=${HTTP_PASS}
    API.api_enabled=1
    API.api_key=${API_KEY}
    TORRENT.tor_downloader_qbittorrent=1
    TORRENT.keep_seeding=1
    QBITTORRENT.qbittorrent_host=qbittorrent.theater.svc.cluster.local
    QBITTORRENT.qbittorrent_port=8080
    QBITTORRENT.qbittorrent_user=${QBITTORRENT_USER}
    QBITTORRENT.qbittorrent_pass=${QBITTORRENT_PASS}
    QBITTORRENT.qbittorrent_label=ebooks,audiobooks
    # AudioBook Bay, LazyLibrarian's built-in audiobook provider (no account
    # needed for search and magnets). The torrent indexers come from Prowlarr.
    ABB.abb=1
    ABB.abb_host=audiobookbay.lu
    ABB.abb_dltypes=A
    # Hardcover as the book metadata source: faster searches than
    # OpenLibrary. Its token (read:catalog, apps/secrets) is per user in the
    # database, not here: apply.py writes it to the admin user.
    API.hc_api=1
    API.book_api=HardCover
  apply.py: |
    # Write managed.conf into /config/config.ini; keep every other setting.
    # LazyLibrarian reads keys case-insensitively and writes them lower case.
    import configparser, os, string
    path = "/config/config.ini"
    cp = configparser.ConfigParser(interpolation=None)
    cp.optionxform = str.lower
    cp.read(path)
    for line in open("/managed/managed.conf"):
        line = line.strip()
        if not line or line.startswith("#"):
            continue
        key, value = line.split("=", 1)
        section, option = key.split(".", 1)
        if not cp.has_section(section):
            cp.add_section(section)
        cp.set(section, option.lower(), string.Template(value).substitute(os.environ))
    with open(path + ".new", "w") as f:
        cp.write(f)
    os.replace(path + ".new", path)
    print("config.ini: managed settings applied")
    # The Hardcover token lives in users.hc_token; LazyLibrarian uses the
    # admin's (perms 65535). On a first start the database does not exist
    # yet: the next restart sets it.
    import sqlite3
    db = "/config/lazylibrarian.db"
    if os.environ.get("HC_TOKEN") and os.path.exists(db):
        with sqlite3.connect(db) as c:
            n = c.execute("UPDATE users SET hc_token = ? WHERE perms = 65535",
                          (os.environ["HC_TOKEN"],)).rowcount
        print(f"lazylibrarian.db: Hardcover token set for {n} admin user(s)")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: lazylibrarian
  name: lazylibrarian
  namespace: theater
spec:
  replicas: 1
  # One RWO config volume: a rolling update would hang on the attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lazylibrarian
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lazylibrarian
      annotations:
        homelab.lilalala.com/config-version: "4"
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: apply-config
          # renovate: datasource=docker depName=lscr.io/linuxserver/lazylibrarian versioning=regex:^[0-9a-f]+-ls(?<major>\d+)$
          image: lscr.io/linuxserver/lazylibrarian:228abd29-ls390@sha256:cd0a1faab339ba748551a568b47e7a2faea8bdfc7ff37f4fba076dfd519be8f1
          imagePullPolicy: IfNotPresent
          command: ["python3", "/managed/apply.py"]
          envFrom:
            - secretRef:
                name: lazylibrarian
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: managed
              mountPath: /managed
              readOnly: true
      containers:
        - name: lazylibrarian
          # Starts as root (s6-overlay), then drops to PUID/PGID.
          # renovate: datasource=docker depName=lscr.io/linuxserver/lazylibrarian versioning=regex:^[0-9a-f]+-ls(?<major>\d+)$
          image: lscr.io/linuxserver/lazylibrarian:228abd29-ls390@sha256:cd0a1faab339ba748551a568b47e7a2faea8bdfc7ff37f4fba076dfd519be8f1
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Zurich
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
          ports:
            - name: http
              containerPort: 5299
              protocol: TCP
          # Ready = answers on the endpoint the PostSync smoke test checks:
          # the login page, which is exempt from authentication.
          readinessProbe:
            httpGet:
              path: /arr/lazylibrarian/auth/login
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /arr/lazylibrarian/auth/login
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lazylibrarian-config
        # The share root, inline like the *arr apps: torrents/ and books/ on
        # one mount, so imports can be hardlinks. SITE-SPECIFIC: the NAS.
        - name: data
          nfs:
            server: 192.168.1.228
            path: /mnt/homelab/k8s/nfs
        - name: managed
          configMap:
            name: lazylibrarian-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lazylibrarian-config
  namespace: theater
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  storageClassName: iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: lazylibrarian
  name: lazylibrarian
  namespace: theater
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5299
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: lazylibrarian
