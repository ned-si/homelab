apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: theater

resources:
  - qbittorrent.yaml
  - prowlarr.yaml
  - sonarr.yaml
  - radarr.yaml
  - lidarr.yaml
  - plex.yaml
  - jellyfin.yaml

# `labels` with includeSelectors: false, NOT `commonLabels`.
#
# `commonLabels` also injects into Deployment.spec.selector.matchLabels, which is
# IMMUTABLE once a Deployment exists. On this cluster -- where the Deployments
# are already running -- that would make every sync fail with
# "field is immutable" and require deleting and recreating each workload.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: theater
