apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: theater

# Parity with the running cluster (ADR 0002). Kept in git, not rendered:
#   bazarr.yaml  (new app, its own adoption change)
#   backup-bazarr.yaml  (bazarr's config backup; rendered with bazarr.yaml)
#   sso.yaml, sso-routes.yaml  (oauth2-proxy SSO for the *arr UIs: new
#                public hostnames, its own change)
# recyclarr.yaml is rendered but ships suspended (spec.suspend: true) and
# its API-key Secret holds PENDING sentinels.
resources:
  - sonarr.yaml
  - radarr.yaml
  - lidarr.yaml
  - prowlarr.yaml
  - qbittorrent.yaml
  - recyclarr.yaml
  - plex.yaml
  - jellyfin.yaml
  - httproute.yaml
  # restic CronJobs for the /config volumes and the *arr databases, plus the
  # monthly prune of their shared repository.
  - backup.yaml
  # WAL archiving and daily base backups to S3 (Barman Cloud plugin).
  - cnpg-backup.yaml
  # Runs the database backup before every sync (presync-backup.yaml).
  - presync-backup.yaml

# After every sync: every Service answers on its health endpoint
# (qBittorrent has none without authentication: its login page).
components:
  - ../../components/postsync-smoke
patches:
  - target: { kind: Job, name: postsync-smoke }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - http://sonarr:8989/ping
          - http://radarr:7878/ping
          - http://lidarr:8686/ping
          - http://prowlarr:9696/ping
          - http://qbittorrent:8080/
          - http://plex:32400/identity
          - http://jellyfin:8096/health
