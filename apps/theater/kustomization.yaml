apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: theater

resources:
  - sonarr.yaml
  - radarr.yaml
  - lidarr.yaml
  - prowlarr.yaml
  - qbittorrent.yaml
  # Keeps private-tracker torrents seeding past the queue (docs/theater.md).
  - qbittorrent-private.yaml
  - recyclarr.yaml
  # Plex Watchlist import lists in Sonarr and Radarr (docs/theater.md).
  - arr-import-lists.yaml
  - plex.yaml
  - jellyfin.yaml
  # Book acquisition for the books namespace (docs/books.md).
  - lazylibrarian.yaml
  - backup-lazylibrarian.yaml
  # Subtitles for Sonarr and Radarr (docs/theater.md, "Subtitles").
  - bazarr.yaml
  - backup-bazarr.yaml
  # Subtitle coverage per language for the Usage dashboard.
  - subtitle-exporter.yaml
  # Keycloak login in front of the /arr/* UIs (docs/theater.md, "Login").
  - sso.yaml
  - httproute.yaml
  # restic CronJobs for the /config volumes and the *arr databases, plus the
  # monthly prune of their shared repository.
  - backup.yaml
  # WAL archiving and daily base backups to S3 (Barman Cloud plugin).
  - cnpg-backup.yaml
  # PodMonitor for the exportarr sidecars (Usage dashboard).
  - metrics.yaml

# Before every sync: the database backup, unless one is < 24 h old.
# After every sync: every Service answers on its health endpoint
# (qBittorrent has none without authentication: its login page).
components:
  - ../../components/presync-backup
  - ../../components/postsync-smoke
replacements:
  - source: { kind: Cluster, name: sonarr-postgresql, fieldPath: spec.imageName }
    targets:
      - select: { kind: ConfigMap, name: presync-backup-desired }
        fieldPaths: [data.sonarr-postgresql]
        options: { create: true }
  - source: { kind: Cluster, name: radarr-postgresql, fieldPath: spec.imageName }
    targets:
      - select: { kind: ConfigMap, name: presync-backup-desired }
        fieldPaths: [data.radarr-postgresql]
        options: { create: true }
  - source: { kind: Cluster, name: lidarr-postgresql, fieldPath: spec.imageName }
    targets:
      - select: { kind: ConfigMap, name: presync-backup-desired }
        fieldPaths: [data.lidarr-postgresql]
        options: { create: true }
  - source: { kind: Cluster, name: prowlarr-postgresql, fieldPath: spec.imageName }
    targets:
      - select: { kind: ConfigMap, name: presync-backup-desired }
        fieldPaths: [data.prowlarr-postgresql]
        options: { create: true }
patches:
  - target: { kind: Job, name: presync-backup }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: MODE, value: cronjob }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: CRONJOB, value: theater-postgres-backup }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: IMAGE_CHECKS
          value: >-
            clusters.postgresql.cnpg.io/sonarr-postgresql
            clusters.postgresql.cnpg.io/radarr-postgresql
            clusters.postgresql.cnpg.io/lidarr-postgresql
            clusters.postgresql.cnpg.io/prowlarr-postgresql
  - target: { kind: Job, name: postsync-smoke }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - http://sonarr:8989/ping
          - http://radarr:7878/ping
          - http://lidarr:8686/ping
          - http://prowlarr:9696/ping
          - http://qbittorrent:8080/
          - http://plex:32400/identity
          - http://jellyfin:8096/health
          - http://lazylibrarian:5299/arr/lazylibrarian/auth/login
          - http://bazarr:6767/arr/bazarr/api/system/ping
          - http://theater-sso:4180/ping
