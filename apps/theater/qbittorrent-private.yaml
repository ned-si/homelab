# Private-tracker seeding in qBittorrent (docs/theater.md, "Indexers").
#
# qBittorrent queues torrents beyond 10 active (Session\MaxActiveTorrents); a
# queued seed stops uploading, which a private tracker counts as a hit and run.
# qBittorrent has no per-category queue limit, so this CronJob, every 10 min:
#   - keeps the category `private` (save path /data/torrents/private) for
#     torrents added by hand from a private tracker;
#   - force-starts every torrent in `private` and every torrent qBittorrent
#     flags as private (also the *arr freeleech grabs). A forced torrent
#     ignores the queue and keeps seeding until it is removed.
# Idempotent; it never stops, removes or recategorises a torrent.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-private
  namespace: theater
data:
  private-seed.py: |
    import http.cookiejar, json, os, sys, urllib.parse, urllib.request

    BASE = "http://qbittorrent.theater.svc.cluster.local:8080/api/v2"
    CATEGORY, SAVE_PATH = "private", "private"
    opener = urllib.request.build_opener(
        urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))

    def post(path, **form):
        data = urllib.parse.urlencode(form).encode()
        req = urllib.request.Request(f"{BASE}/{path}", data=data,
                                     headers={"Referer": BASE})
        try:
            with opener.open(req, timeout=30) as r:
                return r.status, r.read().decode()
        except urllib.error.HTTPError as e:
            return e.code, e.read().decode()

    login = {"username": os.environ["QBITTORRENT_USER"],
             "password": os.environ["QBITTORRENT_PASS"]}
    # qBittorrent 5.2 answers 204 with the session cookie; older ones 200 "Ok.".
    status, body = post("auth/login", **login)
    if not (status == 204 or (status == 200 and body.strip() == "Ok.")):
        sys.exit(f"login failed: HTTP {status}")

    status, _ = post("torrents/createCategory", category=CATEGORY, savePath=SAVE_PATH)
    if status == 409:
        status, _ = post("torrents/editCategory", category=CATEGORY, savePath=SAVE_PATH)
    if not 200 <= status < 300:
        sys.exit(f"category {CATEGORY}: HTTP {status}")

    with opener.open(f"{BASE}/torrents/info", timeout=60) as r:
        torrents = json.load(r)
    todo = [t["hash"] for t in torrents
            if (t.get("private") or t.get("category") == CATEGORY) and not t.get("force_start")]
    if todo:
        status, _ = post("torrents/setForceStart", hashes="|".join(todo), value="true")
        if not 200 <= status < 300:
            sys.exit(f"setForceStart: HTTP {status}")
    private = sum(1 for t in torrents if t.get("private") or t.get("category") == CATEGORY)
    print(f"category {CATEGORY} ok; {private} private torrent(s), {len(todo)} newly force-started")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qbittorrent-private-seed
  namespace: theater
spec:
  suspend: false
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: qbittorrent-private-seed
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: seed
              # renovate: datasource=docker depName=python
              image: python:3.15.0-alpine3.24
              imagePullPolicy: IfNotPresent
              command: ["python3", "/scripts/private-seed.py"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                # The qBittorrent WebUI login the *arr apps use
                # (apps/secrets/lazylibrarian.sops.yaml).
                - name: QBITTORRENT_USER
                  valueFrom:
                    secretKeyRef:
                      name: lazylibrarian
                      key: QBITTORRENT_USER
                - name: QBITTORRENT_PASS
                  valueFrom:
                    secretKeyRef:
                      name: lazylibrarian
                      key: QBITTORRENT_PASS
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: qbittorrent-private
