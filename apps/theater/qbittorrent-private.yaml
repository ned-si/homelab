# Private-tracker seeding (docs/theater.md, "Indexers"). qBittorrent queues
# torrents beyond 10 active, and a queued seed counts as a hit and run. Every
# 10 minutes this CronJob force-starts every torrent in category `private` and
# every torrent flagged private. It never stops, removes or recategorises.
# While qBittorrent restarts it waits up to 4 minutes for the WebUI. It also
# keeps the WebUI auth bypass that makes SSO the only login (docs/theater.md).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-private
  namespace: theater
data:
  private-seed.py: |
    import http.cookiejar, json, os, sys, time, urllib.error, urllib.parse, urllib.request

    ROOT = "http://qbittorrent.theater.svc.cluster.local:8080"
    BASE = f"{ROOT}/api/v2"
    CATEGORY, SAVE_PATH = "private", "private"
    WAIT_SECONDS = 240  # within the Job's activeDeadlineSeconds (300)
    opener = urllib.request.build_opener(
        urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))

    def wait_for_webui():
        # During a restart (Recreate) the Service has no endpoint: connection
        # refused or timeout. Any HTTP answer means the WebUI is up.
        deadline = time.monotonic() + WAIT_SECONDS
        while True:
            try:
                with urllib.request.urlopen(f"{ROOT}/", timeout=10):
                    return
            except urllib.error.HTTPError:
                return
            except OSError as e:
                if time.monotonic() >= deadline:
                    sys.exit(f"qBittorrent unreachable for {WAIT_SECONDS}s: {e}")
                print(f"waiting for qBittorrent: {e}", flush=True)
                time.sleep(10)

    def post(path, **form):
        data = urllib.parse.urlencode(form).encode()
        req = urllib.request.Request(f"{BASE}/{path}", data=data,
                                     headers={"Referer": BASE})
        try:
            with opener.open(req, timeout=30) as r:
                return r.status, r.read().decode()
        except urllib.error.HTTPError as e:
            return e.code, e.read().decode()

    login = {"username": os.environ["QBITTORRENT_USER"],
             "password": os.environ["QBITTORRENT_PASS"]}
    wait_for_webui()
    # qBittorrent 5.2 answers 204 with the session cookie; older ones 200 "Ok.".
    status, body = post("auth/login", **login)
    if not (status == 204 or (status == 200 and body.strip() == "Ok.")):
        sys.exit(f"login failed: HTTP {status}")

    # SSO only: no WebUI login for pod addresses, so `theater-sso` (Keycloak)
    # is the only login. The port admits only that proxy and the in-cluster
    # clients (10-theater.yaml); host-network sources are node addresses,
    # outside the pod network. Reverse-proxy mode off: the client address
    # stays the proxy's, never X-Forwarded-For.
    WEBUI = {"bypass_auth_subnet_whitelist_enabled": True,
             "bypass_auth_subnet_whitelist": "10.244.0.0/16",
             "web_ui_reverse_proxy_enabled": False}
    with opener.open(f"{BASE}/app/preferences", timeout=30) as r:
        prefs = json.load(r)
    if any(prefs.get(k) != v for k, v in WEBUI.items()):
        status, _ = post("app/setPreferences", json=json.dumps(WEBUI))
        if not 200 <= status < 300:
            sys.exit(f"setPreferences: HTTP {status}")
        print("WebUI auth bypass for the pod network set")

    status, _ = post("torrents/createCategory", category=CATEGORY, savePath=SAVE_PATH)
    if status == 409:
        status, _ = post("torrents/editCategory", category=CATEGORY, savePath=SAVE_PATH)
    if not 200 <= status < 300:
        sys.exit(f"category {CATEGORY}: HTTP {status}")

    with opener.open(f"{BASE}/torrents/info", timeout=60) as r:
        torrents = json.load(r)
    todo = [t["hash"] for t in torrents
            if (t.get("private") or t.get("category") == CATEGORY) and not t.get("force_start")]
    if todo:
        status, _ = post("torrents/setForceStart", hashes="|".join(todo), value="true")
        if not 200 <= status < 300:
            sys.exit(f"setForceStart: HTTP {status}")
    private = sum(1 for t in torrents if t.get("private") or t.get("category") == CATEGORY)
    print(f"category {CATEGORY} ok; {private} private torrent(s), {len(todo)} newly force-started")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qbittorrent-private-seed
  namespace: theater
spec:
  suspend: false
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: qbittorrent-private-seed
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: seed
              # renovate: datasource=docker depName=python
              image: python:3.15.2-alpine3.24@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
              imagePullPolicy: IfNotPresent
              command: ["python3", "/scripts/private-seed.py"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                # The qBittorrent WebUI login the *arr apps use
                # (apps/secrets/lazylibrarian.sops.yaml).
                - name: QBITTORRENT_USER
                  valueFrom:
                    secretKeyRef:
                      name: lazylibrarian
                      key: QBITTORRENT_USER
                - name: QBITTORRENT_PASS
                  valueFrom:
                    secretKeyRef:
                      name: lazylibrarian
                      key: QBITTORRENT_PASS
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: qbittorrent-private
