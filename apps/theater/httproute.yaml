# Theater on the shared Gateway. /arr/<app> and /oauth2 go to `theater-sso`
# (./sso.yaml); the prefix passes through as each app's URL base.
# `timeouts.request: 0s` disables Envoy's 15 s route timeout, which would cut
# streams. Plex (the `/` catch-all) and Jellyfin stay off SSO for the TV
# apps.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: theater
  namespace: theater
spec:
  # group/kind/weight and the catch-all match are the API server's defaults,
  # spelled out so that Argo CD's diff sees no drift.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - theater.lilalala.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /arr/radarr
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), payment=(), usb=()"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: Content-Security-Policy
                value: "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
      backendRefs:
        - group: ""
          kind: Service
          name: theater-sso
          port: 4180
          weight: 1
      timeouts:
        request: 0s
    - matches:
        - path:
            type: PathPrefix
            value: /arr/sonarr
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), payment=(), usb=()"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: Content-Security-Policy
                value: "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
      backendRefs:
        - group: ""
          kind: Service
          name: theater-sso
          port: 4180
          weight: 1
      timeouts:
        request: 0s
    - matches:
        - path:
            type: PathPrefix
            value: /arr/prowlarr
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), payment=(), usb=()"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: Content-Security-Policy
                value: "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
      backendRefs:
        - group: ""
          kind: Service
          name: theater-sso
          port: 4180
          weight: 1
      timeouts:
        request: 0s
    - matches:
        - path:
            type: PathPrefix
            value: /arr/lidarr
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), payment=(), usb=()"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: Content-Security-Policy
                value: "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
      backendRefs:
        - group: ""
          kind: Service
          name: theater-sso
          port: 4180
          weight: 1
      timeouts:
        request: 0s
    - matches:
        - path:
            type: PathPrefix
            value: /arr/lazylibrarian
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), payment=(), usb=()"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: Content-Security-Policy
                value: "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
      backendRefs:
        - group: ""
          kind: Service
          name: theater-sso
          port: 4180
          weight: 1
      timeouts:
        request: 0s
    - matches:
        - path:
            type: PathPrefix
            value: /arr/bazarr
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), payment=(), usb=()"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: Content-Security-Policy
                value: "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
      backendRefs:
        - group: ""
          kind: Service
          name: theater-sso
          port: 4180
          weight: 1
      timeouts:
        request: 0s
    - matches:
        - path:
            type: PathPrefix
            value: /arr/qbittorrent
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), payment=(), usb=()"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
      backendRefs:
        - group: ""
          kind: Service
          name: theater-sso
          port: 4180
          weight: 1
      timeouts:
        request: 0s
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), payment=(), usb=()"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: Content-Security-Policy
                value: "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
      backendRefs:
        - group: ""
          kind: Service
          name: theater-sso
          port: 4180
          weight: 1
      timeouts:
        request: 0s
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # Plex authenticates with X-Plex-Token, not cookies. The theater-sso
        # session cookies on this host reach ~7 KB and Plex answers 400 to
        # request headers over ~5 KB, so cookies are not forwarded to it.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Cookie
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), payment=(), usb=()"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: Content-Security-Policy
                value: "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
      backendRefs:
        - group: ""
          kind: Service
          name: plex
          port: 32400
          weight: 1
      timeouts:
        request: 0s
---
