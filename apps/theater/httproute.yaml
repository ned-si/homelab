# Theater on the shared Gateway. Every /arr/<app> path and the /oauth2 login
# callback go to the SSO proxy `theater-sso` (./sso.yaml), which routes on to
# the app; the *arr apps run with URL base /arr/<name>, so the prefix is
# passed through as-is. Break-glass without Keycloak: a port-forward to the
# app's Service and its local login (docs/theater.md, "Login").
#
# `timeouts.request: 0s` disables Envoy's default 15 s route timeout, which
# would cut streams and long API calls.
#
# Plex (the `/` catch-all) and Jellyfin stay off SSO: their TV apps cannot
# complete an OIDC login.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: theater
  namespace: theater
spec:
  # group/kind/weight and the catch-all match are the API server's defaults,
  # spelled out so that Argo CD's diff sees no drift.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - theater.lilalala.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /arr/radarr
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), payment=(), usb=()"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: Content-Security-Policy
                value: "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
      backendRefs:
        - group: ""
          kind: Service
          name: theater-sso
          port: 4180
          weight: 1
      timeouts:
        request: 0s
    - matches:
        - path:
            type: PathPrefix
            value: /arr/sonarr
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
