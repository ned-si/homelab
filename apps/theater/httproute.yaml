              - name: Content-Security-Policy
                value: "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
      backendRefs:
        - group: ""
          kind: Service
          name: theater-sso
          port: 4180
          weight: 1
      timeouts:
        request: 0s
    - matches:
        - path:
