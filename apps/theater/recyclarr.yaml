# Recyclarr: syncs TRaSH Guides quality definitions, quality profiles and custom
# formats into Sonarr and Radarr, every night at 06:00.
#
# Each app has exactly two quality profiles, both TRaSH guide profiles used as
# published (trash_id), only renamed:
#
#   | Profile    | Sonarr (TRaSH)                            | Radarr (TRaSH)                     |
#   |------------|-------------------------------------------|------------------------------------|
#   | HD-Original| WEB-1080p                                 | HD Bluray + WEB                    |
#   | HD-Kids-FR | [French MULTi.VF] HD Bluray + WEB (1080p) | [French MULTi.VF] HD Bluray + WEB  |
#
# HD-Original: 1080p, no remux, original language, x265/AV1 penalised.
# HD-Kids-FR: 1080p, no remux, French audio required, MULTi (original + French)
# preferred. For animation and children's titles. The TRaSH defaults are synced
# (default custom-format groups, default scores) with one deliberate deviation,
# the `custom_formats` blocks below: TRaSH custom formats, our scores, so both
# profiles prefer x264 over x265 and 5.1 or more channels over stereo
# (docs/theater.md, "Deviations from TRaSH").
#
# This rewrites profiles, scores and custom formats inside Sonarr's and Radarr's
# databases. Preview a change before it lands (docs/theater.md):
#
#   kubectl -n theater create job recyclarr-preview --from=cronjob/recyclarr-sync \
#     --dry-run=client -o yaml \
#     | yq '.spec.template.spec.containers[0].args = ["sync", "--preview"]' \
#     | kubectl apply -f -
#
# Profiles are matched by name: the state directory is an emptyDir, so every
# run adopts the existing profile with the configured `name`. Renaming a profile
# here therefore creates a new one; rename it in the app first.
apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: theater
data:
  recyclarr.yml: |
    # Base URLs are in-cluster Service addresses. They are not credentials, so
    # they live here in plaintext; the API keys come from the
    # `recyclarr-api-keys` Secret via envFrom. See
    # apps/secrets/recyclarr-api-keys.sops.yaml.example.
    #
    # The FQDN form rather than a bare `http://sonarr:8989`: this pod is in the
    # same namespace so the short name would resolve, but the explicit form
    # matches what docs/runbooks/subtitles.md tells you to paste into Bazarr and
    # is one less thing that differs between two places.
    sonarr:
      series:
        base_url: http://sonarr.theater.svc.cluster.local:8989
        api_key: !env_var SONARR_API_KEY

        # Quality definitions: the size limits per resolution.
        quality_definition:
          type: series
        # TRaSH guide profiles with their default custom-format groups and
        # scores (upstream templates web-1080p and
        # french-multi-vf-bluray-web-1080p); only the name is overridden.
        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
            name: HD-Original
            reset_unmatched_scores:
              enabled: true
          - trash_id: 58e8dc75731040612dd6f4ac0676bfd7  # [French MULTi.VF] HD Bluray + WEB (1080p)
            name: HD-Kids-FR
            reset_unmatched_scores:
              enabled: true
        # Deviation from TRaSH (operator preference): TRaSH custom formats,
        # our scores. x265 (HD) keeps the TRaSH -10000, pinned here so it
        # stays a block if the guide changes. Bonuses stay below one release
        # group tier step plus the streaming bonus: preferences, never blocks.
        custom_formats:
          - trash_ids:
              - cddfb4e32db826151d97352b8e37c648  # x264
            assign_scores_to:
              - name: HD-Original
                score: 50
              - name: HD-Kids-FR
                score: 50
          - trash_ids:
              - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD)
            assign_scores_to:
              - name: HD-Original
                score: -10000
              - name: HD-Kids-FR
                score: -10000
          - trash_ids:
              - 3fbafa924f361e66fbc6187af82dfa85  # 5.1 Surround
              - 9fb6d778592c293467437593ef394bf1  # 6.1 Surround
              - 204c8c3e7315bb0ea81332774fa888d6  # 7.1 Surround
            assign_scores_to:
              - name: HD-Original
                score: 100
              - name: HD-Kids-FR
                score: 100

    radarr:
      movies:
        base_url: http://radarr.theater.svc.cluster.local:7878
        api_key: !env_var RADARR_API_KEY

        quality_definition:
          type: movie
        # Upstream templates hd-bluray-web and french-multi-vf-hd-bluray-web.
        quality_profiles:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
            name: HD-Original
            reset_unmatched_scores:
              enabled: true
          - trash_id: 500ecc23572575511fd81893777d1e06  # [French MULTi.VF] HD Bluray + WEB
            name: HD-Kids-FR
            reset_unmatched_scores:
              enabled: true
        # Same deviation as Sonarr; Radarr has its own trash_ids.
        custom_formats:
          - trash_ids:
              - 2899d84dc9372de3408e6d8cc18e9666  # x264
            assign_scores_to:
              - name: HD-Original
                score: 50
              - name: HD-Kids-FR
                score: 50
          - trash_ids:
              - dc98083864ea246d05a42df0d05f81cc  # x265 (HD)
            assign_scores_to:
              - name: HD-Original
                score: -10000
              - name: HD-Kids-FR
                score: -10000
          - trash_ids:
              - 77ff61788dfe1097194fd8743d7b4524  # 5.1 Surround
              - 6fd7b090c3f7317502ab3b63cc7f51e3  # 6.1 Surround
              - e77382bcfeba57cb83744c9c5449b401  # 7.1 Surround
            assign_scores_to:
              - name: HD-Original
                score: 100
              - name: HD-Kids-FR
                score: 100

    # Lidarr is deliberately absent. Recyclarr supports it, but the TRaSH music
    # guides are far less settled than the TV and film ones, and Lidarr here has
    # no reported problem to fix. Adding it would be change for its own sake.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr-sync
  namespace: theater
spec:
  suspend: false
  # 06:00: after the last backup job (jellyfin, 05:00, which also runs the
  # nightly restic prune) and well before anyone looks at the library. Nothing
  # here contends with the restic repository lock, but sharing a window with a
  # prune means two long-running jobs on the same node for no reason.
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  # A sync that has not run for a few hours has lost nothing -- the guides change
  # on the order of weeks. No startingDeadlineSeconds: missing a window is fine
  # and a missed window must not queue a second run.
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: recyclarr-sync
        spec:
          restartPolicy: OnFailure
          # No podAffinity: this job mounts no application volume. It reaches
          # Sonarr and Radarr over their Services, so it can run anywhere -- the
          # same reasoning as the `theater-postgres-backup` job in ./backup.yaml,
          # and the reason it needs a network policy rule while the /config
          # backup jobs do not.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: recyclarr
              # renovate: datasource=docker depName=ghcr.io/recyclarr/recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.8@sha256:b1fbb929ba718fdbdac2c1fc25b32b0ae916d7a5a0892c2068c9bfae6f1a9209
              imagePullPolicy: IfNotPresent
              args: ["sync"]
              env:
                - name: TZ
                  value: Europe/Zurich
                # Recyclarr resolves its config, its cache and its clone of the
                # guides under this directory (the data dir defaults to it).
                # Pointed at a writable emptyDir because the root filesystem is
                # read-only. Recyclarr 8 refuses the old RECYCLARR_APP_DATA.
                - name: RECYCLARR_CONFIG_DIR
                  value: /config
              envFrom:
                # SONARR_API_KEY and RADARR_API_KEY, referenced from recyclarr.yml
                # as `!env_var` (apps/secrets/recyclarr-api-keys.sops.yaml).
                - secretRef:
                    name: recyclarr-api-keys
              volumeMounts:
                # The config file is read-only; everything Recyclarr WRITES goes
                # to /config, which is why they are separate mounts rather than
                # one.
                - name: config-file
                  mountPath: /config/recyclarr.yml
                  subPath: recyclarr.yml
                  readOnly: true
                - name: app-data
                  mountPath: /config
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                # Unlike the *arr apps -- which cannot do this, hence the
                # AVD-KSV-0014 entry in .trivyignore -- Recyclarr is a plain .NET
                # binary that writes only under RECYCLARR_CONFIG_DIR and TMPDIR.
                # Both are emptyDirs below.
                #
                # If it ever crashloops with a read-only filesystem error, the fix
                # is to find what it is writing and give it a volume, not to drop
                # this flag.
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            # subPath mount of a single key, so /config stays writable. Mounting
            # the ConfigMap AT /config would make the whole directory read-only
            # and Recyclarr could not clone the guides.
            - name: config-file
              configMap:
                name: recyclarr-config
            - name: app-data
              emptyDir:
                # The guides repository is a few tens of megabytes.
                sizeLimit: 512Mi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
