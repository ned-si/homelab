# Per-host routes of the *arr SSO feature (apps/theater/sso.yaml). Not rendered:
# they publish five new hostnames and ship with that feature.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: theater
spec:
  parentRefs:
    - name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - sonarr.lilalala.com
  rules:
    # THROUGH THE SSO PROXY, not straight to the app. `sonarr-sso` is an
    # oauth2-proxy that authenticates against Keycloak and then forwards to
    # sonarr:8989. See apps/theater/sso.yaml.
    #
    # To bypass SSO -- for a diagnosis, or to revert -- change these two lines
    # back to `name: sonarr` / `port: 8989`. Nothing else in this file depends
    # on the proxy.
    - backendRefs:
        - name: sonarr-sso
          port: 4180
---
