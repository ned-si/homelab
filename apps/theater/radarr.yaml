# Ported byte-for-byte in spec from the running cluster (legacy tree at the
# all-apps pin), ADR 0002. Differences from live, all intended:
#   - inline credentials replaced by secretKeyRef to SOPS Secrets with the same
#     value (per-key sha256 checked), which restarts the pod once on adoption;
#   - PVCs carry argocd.argoproj.io/sync-options: Delete=false,Prune=false.
# Hardening (probes, security contexts, resources, image digests) is a later,
# separate change: docs/roadmap.md.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: radarr-postgresql
  namespace: theater
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  instances: 1
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318
  storage:
    size: 5Gi
  # Created from its Barman Cloud backup; archives under a new server name
  # (CNPG refuses a non-empty path; the old one stays readable). docs/bootstrap.md
  bootstrap:
    recovery:
      source: origin
      database: app
      owner: app
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        # Webhook defaults, stated so the server-side apply diff stays clean.
        enabled: true
        isWALArchiver: false
        parameters:
          barmanObjectName: cnpg-backup
          serverName: radarr-postgresql
  # WAL archiving and base backups to S3 (cnpg-backup.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # The webhook defaults this; stating it keeps Argo CD's diff clean.
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-backup
        serverName: radarr-postgresql-t1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: radarr
  name: radarr
  namespace: theater
  # Replace, not server-side apply: the API server defaulted
  # strategy.rollingUpdate when this Deployment was created, and an apply
  # cannot remove a field another manager owns, so Recreate is rejected.
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: 1
  # One RWO config volume: the new pod cannot attach it until the old one
  # is gone, so a rolling update would hang.
  strategy:
    rollingUpdate: null
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: radarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radarr
    spec:
      # Starts the app only once its database accepts connections: started
      # without it, the app hangs instead of retrying.
      initContainers:
        - name: wait-for-db
          # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
          image: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318
          command:
            - sh
            - -c
            - until pg_isready -t 5; do echo "waiting for $PGHOST:$PGPORT"; sleep 5; done
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: port
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: user
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: dbname
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        # The API key for the exportarr sidecar, read from the app's own
        # config.xml (the app generates it; it is not in git).
        - name: exportarr-key
          # renovate: datasource=docker depName=busybox
          image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command:
            - sh
            - -c
            - sed -n 's|.*<ApiKey>\(.*\)</ApiKey>.*|\1|p' /config/config.xml > /run/exportarr/api-key && test -s /run/exportarr/api-key
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: exportarr
              mountPath: /run/exportarr
      containers:
        - name: radarr
          # renovate: datasource=docker depName=ghcr.io/hotio/radarr
          image: ghcr.io/hotio/radarr:release-6.4.4.10685@sha256:c85e3a435039ab24ea668e8b6dd8b02484a3969e89c1a3093fc3e85eac10f15c
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Europe/Zurich
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: RADARR__LOG__DBENABLED
              value: "false"
            - name: RADARR__POSTGRES__HOST
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: host
            - name: RADARR__POSTGRES__PORT
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: port
            - name: RADARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: user
            - name: RADARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: password
            - name: RADARR__POSTGRES__MAINDB
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: dbname
            - name: RADARR__SERVER__URLBASE
              value: /arr/radarr
          ports:
            - name: http
              containerPort: 7878
              protocol: TCP
          # Ready = answers on the endpoint the PostSync smoke test checks.
          readinessProbe:
            httpGet:
              path: /arr/radarr/ping
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # /ping queries the database, so a lost connection restarts the app.
          # Startup (migrations) gets 15 minutes before liveness applies.
          startupProbe:
            httpGet:
              path: /arr/radarr/ping
              port: http
            periodSeconds: 10
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /arr/radarr/ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
        # Prometheus metrics for the Usage dashboard (PodMonitor exportarr).
        - name: exportarr
          # renovate: datasource=docker depName=ghcr.io/onedr0p/exportarr
          image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
          args: ["radarr"]
          env:
            - name: PORT
              value: "9707"
            - name: URL
              value: http://localhost:7878/arr/radarr
            - name: API_KEY_FILE
              value: /run/exportarr/api-key
            - name: LOG_FORMAT
              value: json
          ports:
            - name: metrics
              containerPort: 9707
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: exportarr
              mountPath: /run/exportarr
              readOnly: true
      volumes:
        - name: exportarr
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: media
          nfs:
            server: 192.168.1.228
            path: /mnt/homelab/k8s/nfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: theater
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  storageClassName: iscsi
  # The existing zvol (infrastructure/iscsi-volumes/).
  volumeName: pvc-e798d9b4-0a9f-45da-9435-24694ee29a9d
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: radarr
  name: radarr
  namespace: theater
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 7878
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: radarr
