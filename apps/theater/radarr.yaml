# Ported byte-for-byte in spec from the running cluster (legacy tree at the
# all-apps pin), ADR 0002. Differences from live, all intended:
#   - inline credentials replaced by secretKeyRef to SOPS Secrets with the same
#     value (per-key sha256 checked), which restarts the pod once on adoption;
#   - PVCs carry argocd.argoproj.io/sync-options: Delete=false,Prune=false.
# Hardening (probes, security contexts, resources, image digests) is a later,
# separate change: docs/roadmap.md.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: radarr-postgresql
  namespace: theater
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  instances: 1
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  storage:
    size: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: radarr
  name: radarr
  namespace: theater
  # Replace, not server-side apply: the API server defaulted
  # strategy.rollingUpdate when this Deployment was created, and an apply
  # cannot remove a field another manager owns, so Recreate is rejected.
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: 1
  # One RWO config volume: the new pod cannot attach it until the old one
  # is gone, so a rolling update would hang.
  strategy:
    rollingUpdate: null
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: radarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radarr
    spec:
      containers:
        - name: radarr
          # renovate: datasource=docker depName=ghcr.io/hotio/radarr
          image: ghcr.io/hotio/radarr:release-6.4.4.10685
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Europe/Zurich
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: RADARR__LOG__DBENABLED
              value: "false"
            - name: RADARR__POSTGRES__HOST
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: host
            - name: RADARR__POSTGRES__PORT
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: port
            - name: RADARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: user
            - name: RADARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: password
            - name: RADARR__POSTGRES__MAINDB
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: dbname
            - name: RADARR__SERVER__URLBASE
              value: /arr/radarr
          ports:
            - name: http
              containerPort: 7878
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: media
          nfs:
            server: 192.168.1.228
            path: /mnt/homelab/k8s/nfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: theater
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  storageClassName: iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: radarr
  name: radarr
  namespace: theater
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 7878
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: radarr
