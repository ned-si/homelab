# bazarr's config backup: /config, including its SQLite database in
# /config/db, copied while Bazarr runs (best effort, like jellyfin's). The
# settings and language profiles are code (bazarr.yaml), so a torn database
# loses at most the download history.
#
# Same shape as the sonarr job in backup.yaml; different PVC, label, tag and
# slot. The 04:50 slot sits before jellyfin's 05:00, in the same shared
# repository, ten minutes apart for the restic lock.
#
# The subtitle FILES are not in it: they are written next to the media on the
# NAS share, which this repository does not back up (re-acquirable media is
# deliberately out of scope; see backup.yaml).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: theater-config-backup-bazarr
  namespace: theater
spec:
  schedule: "50 4 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: theater-config-backup-bazarr
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: bazarr
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /scripts/backup-config.sh
                - bazarr
                - /config
                # Bazarr's own rotating logs.
                - --exclude=/config/log
                # Provider response cache and the extracted-subtitle scratch
                # area. Both derived, both re-fetched on demand.
                - --exclude=/config/cache
                # Bazarr writes its own periodic config backups into /config.
                # Backing up backups doubles the snapshot for nothing.
                - --exclude=/config/backup
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/theater/configs
                - name: RESTIC_CACHE_DIR
                  value: /cache
                # restic writes temp pack files here while uploading. Without this it uses
                # /tmp, which does not exist writable under readOnlyRootFilesystem, and
                # `restic backup` fails the moment it has a pack to flush. /cache is
                # already mounted and writable.
                - name: TMPDIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: scripts
              configMap:
                name: theater-backup-scripts
                defaultMode: 0755
            - name: config
              persistentVolumeClaim:
                claimName: bazarr-config
                readOnly: true
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
