# watch.lilalala.com: a second name for Theater, a 302 to the same path on
# theater.lilalala.com. 302 (not 301) so browsers cache nothing, in case
# `watch` later becomes the main name. external-dns publishes the record.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: theater-watch-alias
  namespace: theater
spec:
  # group/kind and the catch-all match are the API server's defaults, spelled
  # out so that Argo CD's diff sees no drift.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - watch.lilalala.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), payment=(), usb=()"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: Content-Security-Policy
                value: "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: theater.lilalala.com
            statusCode: 302
