# media.lilalala.com -> Immich.
#
# Replaces an Ingress that carried `nginx.ingress.kubernetes.io/proxy-body-size: "0"`
# to allow large uploads. There is no equivalent annotation here and none is
# needed: Cilium's Gateway implementation streams request bodies rather than
# buffering them to a limit, so multi-GB video uploads work without tuning.
#
# If uploads DO start failing at a size boundary, the limit is coming from
# somewhere else -- check Immich's own upload settings and Cloudflare (the free
# plan caps request bodies at 100MB, which is why `--cloudflare-proxied=false`
# is set in external-dns).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
spec:
  # group/kind/weight and the catch-all match are the API server's defaults,
  # spelled out so that Argo CD's diff sees no drift.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - media.lilalala.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: immich-server
          port: 2283
          weight: 1
      timeouts:
        request: 0s
