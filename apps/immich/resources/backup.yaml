# Immich Postgres through the Barman Cloud plugin: WAL and a daily base
# backup to s3://ned-si-homelab-backups/cnpg/immich-db/, 30 days of
# point-in-time recovery (docs/backups.md). The files are backed up by
# ./backup-files.yaml; the library needs both.
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-backup
  namespace: immich
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://ned-si-homelab-backups/cnpg
    endpointURL: https://s3.eu-central-1.amazonaws.com
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      # boto3 signs for this region; it must match the bucket.
      - name: AWS_DEFAULT_REGION
        value: eu-central-1
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-db-daily
  namespace: immich
spec:
  # SIX fields, not five: CloudNativePG uses the cron-with-seconds format.
  # 00:00 UTC daily.
  schedule: "0 0 0 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: immich-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
