# Immich Postgres backup through the Barman Cloud plugin: continuous WAL
# archiving plus a daily base backup, into
# s3://ned-si-homelab-backups/cnpg/immich-db/, kept 30 days (point-in-time
# recovery anywhere in that window). The barman tools run in the plugin's
# sidecar, so the pgvecto.rs image needs nothing extra. Restore: docs/backups.md.
#
# Two independent things must be backed up. Losing either loses the library:
#
#   1. POSTGRES  -- albums, people, embeddings, shared links, users. Handled here.
#   2. THE FILES -- the photos themselves, on the `immich-data` PVC. Handled by
#                   the restic CronJobs in ./backup-files.yaml.
#
# A Postgres backup alone gives a catalogue of files that no longer exist. A file
# backup alone gives photos with no albums, no people and no search.
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-backup
  namespace: immich
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://ned-si-homelab-backups/cnpg
    endpointURL: https://s3.eu-central-1.amazonaws.com
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      # boto3 signs for this region; it must match the bucket.
      - name: AWS_DEFAULT_REGION
        value: eu-central-1
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-db-daily
  namespace: immich
spec:
  # SIX fields, not five: CloudNativePG uses the cron-with-seconds format.
  # 00:00 UTC daily.
  schedule: "0 0 0 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: immich-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
