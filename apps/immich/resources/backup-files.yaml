# The photo library itself, to S3 with restic.
#
# WHY RESTIC CRONJOBS AND NOT VOLSYNC
#   VolSync is the more polished GitOps answer and does snapshot-then-backup, so
#   it gets a crash-consistent point-in-time copy. It is also another operator to
#   install, version and understand.
#
#   For THIS data the snapshot buys little: Immich's library is
#   write-once-then-immutable content-addressed files. Backing it up live risks
#   catching a half-uploaded file, and restic simply picks that file up correctly
#   on the next run. The database is a separate concern; see docs/backups.md.
#
#   So: restic here, and VolSync noted as the upgrade path if this ever holds
#   something that is mutated in place.
#
# WHY IT MOUNTS THE SAME RWO PVC AS IMMICH
#   `immich-data` is ReadWriteOnce, so this CronJob's pod MUST land on the same
#   node as the immich-server pod or it will fail to attach. That is what the
#   podAffinity below guarantees. Without it the job fails intermittently and
#   confusingly, depending on scheduling.
#
# WHY THERE IS NO fsGroup
#   With an fsGroup set, the kubelet may change group ownership and mode bits on a
#   mounted volume. `immich-data` is the photo library: these jobs only ever read
#   it, and nothing they run may change it, not even its permissions. The library
#   files are world-readable, uid 1000 reads them as they are, and the caches are
#   emptyDirs, which are writable without an fsGroup.
#
# RETENTION
#   Not here. The S3 repository's packs move to Glacier Instant Retrieval after a
#   day, and Glacier IR bills a 90-day minimum, so the nightly job only adds a
#   snapshot. `immich-library-prune` below forgets and prunes once a month.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-library-backup
  namespace: immich
spec:
  # 03:30, after the local copy at 01:30, so the two never read the library at
  # the same time.
  schedule: "30 3 * * *"
  suspend: false
  # One run at a time. A run that is still uploading when the next one is due
  # keeps going; the next one is skipped, not started beside it.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      # 20h: long enough for a big incremental, short enough that a wedged job
      # does not block tomorrow's run.
      activeDeadlineSeconds: 72000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-library-backup
        spec:
          restartPolicy: OnFailure
          # Must co-locate with immich-server: shared ReadWriteOnce volume. The
          # chart labels the server pod name=server, instance=immich.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: server
                      app.kubernetes.io/instance: immich
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  # `init` is idempotent-by-failure: it errors if the repo already
                  # exists, which is the normal case after the first run.
                  restic init 2>/dev/null || true

                  # Thumbnails and transcodes are excluded because Immich
                  # regenerates them from originals -- backing them up would
                  # roughly double the bill for data that is derived.
                  restic backup /data \
                    --tag immich-library \
                    --host immich \
                    --exclude '**/.tmp/**' \
                    --exclude '**/encoded-video/**' \
                    --exclude '**/thumbs/**' \
                    --verbose

                  # Cheap structural check on every run. The real verification
                  # (actually restoring data) is a separate CronJob:
                  # platform/backup-verify/.
                  restic check --with-cache
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/immich/library
                - name: RESTIC_CACHE_DIR
                  value: /cache
                # restic writes temp pack files here while uploading. Without this it uses
                # /tmp, which does not exist writable under readOnlyRootFilesystem, and
                # `restic backup` fails the moment it has a pack to flush. /cache is
                # already mounted and writable.
                - name: TMPDIR
                  value: /cache
                # Retry rather than fail on a flaky domestic uplink.
                - name: RESTIC_PACK_SIZE
                  value: "64"
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  # restic's deduplication index for a large repo is memory-hungry.
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: immich-data
                readOnly: true
            # A cold cache costs one download of the repository index (index/ and
            # snapshots/ stay in S3 Standard). For ~260 GiB that is seconds.
            # sizeLimit guards the node's eMMC, which also holds kubelet and
            # containerd.
            - name: cache
              emptyDir:
                sizeLimit: 2Gi
---
# ###########################################################################
# THE SAME LIBRARY, BACKED UP AGAIN -- LOCALLY, TO NFS.
#
# Two independent restic repositories, not one repository copied. That is
# deliberate: `restic copy` would make the remote a derivative of the local, so a
# corruption or a bad `forget` in one could propagate. Independent repositories
# fail independently, which is the entire point of having two.
#
# The cost is reading the source twice. On a LAN that is minutes, and it buys a
# copy whose verification is FREE -- which is why the expensive check
# (`restic check --read-data`, full, weekly) runs against this repository while the
# S3 one gets structure, freshness and a sample restore. See docs/backups.md.
#
# WHAT THIS DEFENDS AGAINST
#   A bad Immich upgrade, a bad migration, an app rewriting its own data, a
#   mistaken delete. Recovery is over the LAN at NAS speed, not over a domestic
#   uplink from Glacier.
#
# WHAT IT DOES NOT DEFEND AGAINST
#   Losing the pool. It lives on the same TrueNAS as the data it protects. That is
#   what the S3 repository above is for.
#
# Note this is a nightly SECOND copy, and is separate from the instant
# copy-on-write rollback points taken by scripts/pre-upgrade-snapshot.sh. The
# snapshot is for "undo the last hour"; this is for "the volume itself is wrong".
#
# This repository is not on S3, so the Glacier IR minimum does not apply and it
# keeps its own nightly forget + prune.
# ###########################################################################
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-library-backup-local
  namespace: immich
spec:
  # 01:30 -- before the S3 run at 03:30, so the local copy (the one that gets
  # fully verified) is always at least as fresh as the remote one.
  schedule: "30 1 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      # 6h is plenty over a LAN; the S3 job needs 20h because of the uplink.
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-library-backup-local
        spec:
          restartPolicy: OnFailure
          # Same ReadWriteOnce constraint as the S3 job: `immich-data` can only be
          # attached on the node already running immich-server.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: server
                      app.kubernetes.io/instance: immich
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            # Must be 1000/1000: the NFS dataset is owned by uid/gid 1000 with
            # mode 0770, and NFS AUTH_SYS passes these numeric ids straight to the
            # server. Change them and every write fails with EACCES.
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  restic init 2>/dev/null || true

                  restic backup /data \
                    --tag immich-library \
                    --host immich \
                    --exclude '**/.tmp/**' \
                    --exclude '**/encoded-video/**' \
                    --exclude '**/thumbs/**' \
                    --verbose

                  # Longer retention than the S3 copy: local storage is 16TB of
                  # already-paid-for pool, so depth here is nearly free and gives
                  # more room to notice a problem that started weeks ago.
                  restic forget \
                    --tag immich-library \
                    --keep-daily 14 \
                    --keep-weekly 8 \
                    --keep-monthly 6 \
                    --prune

                  restic check --with-cache
              env:
                # A plain filesystem path, not an s3: URL. No credentials, no
                # endpoint, no egress.
                - name: RESTIC_REPOSITORY
                  value: /backups/immich/library
                - name: RESTIC_CACHE_DIR
                  value: /cache
                # restic writes temp pack files here while uploading. Without this it uses
                # /tmp, which does not exist writable under readOnlyRootFilesystem, and
                # `restic backup` fails the moment it has a pack to flush. /cache is
                # already mounted and writable.
                - name: TMPDIR
                  value: /cache
                # Only the repository password -- deliberately NOT `envFrom` the
                # whole s3-backup Secret. A local job has no business holding S3
                # credentials.
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup
                      key: RESTIC_PASSWORD
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backups
                  mountPath: /backups
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: immich-data
                readOnly: true
            # The backup dataset, mounted inline. The PV/PVC pair in
            # infrastructure/nfs-storage/backup-volume.yaml is the alternative
            # once that leaf is deployed; until then an inline volume needs no
            # cluster-scoped object, which the apps project cannot create.
            - name: backups
              nfs:
                server: 192.168.1.228 # SITE-SPECIFIC
                path: /mnt/homelab/k8s/backups
            # A separate cache from the S3 job's: the cache is keyed by
            # repository id, and the two repositories are different.
            - name: cache
              emptyDir:
                sizeLimit: 2Gi
---
# Retention for the S3 repository, once a month.
#
# Glacier IR bills every pack for at least 90 days, so deleting one sooner costs
# the remaining days anyway. `--keep-within 3m` keeps every snapshot for three
# months, so no pack becomes unused before it is 90 days old; after that one
# snapshot per month is kept for a year. Monthly is often enough for a library
# that only grows.
#
# No library mount, so no affinity: the job only talks to S3.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-library-prune
  namespace: immich
spec:
  # The 1st of the month at 13:30, the last of the monthly prunes and well
  # clear of the nightly backups.
  schedule: "30 13 1 * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-library-prune
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  restic forget \
                    --host immich \
                    --tag immich-library \
                    --keep-within 3m \
                    --keep-monthly 12 \
                    --prune

                  restic check --with-cache
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/immich/library
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: TMPDIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: cache
              emptyDir:
                sizeLimit: 2Gi
