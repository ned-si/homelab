# The photo library itself, to S3 with restic.
#
# WHY RESTIC CRONJOBS AND NOT VOLSYNC
#   VolSync is the more polished GitOps answer and does snapshot-then-backup, so
#   it gets a crash-consistent point-in-time copy. It is also another operator to
#   install, version and understand.
#
#   For THIS data the snapshot buys little: Immich's library is
#   write-once-then-immutable content-addressed files. Backing it up live risks
#   catching a half-uploaded file, and restic simply picks that file up correctly
#   on the next run. The database, where consistency genuinely matters, is handled
#   properly by Barman with PITR.
#
#   So: restic here, and VolSync noted as the upgrade path if this ever holds
#   something that is mutated in place. See docs/backups.md.
#
# WHY IT MOUNTS THE SAME RWO PVC AS IMMICH
#   `immich-data` is ReadWriteOnce, so this CronJob's pod MUST land on the same
#   node as the immich-server pod or it will fail to attach. That is what the
#   podAffinity below guarantees. Without it the job fails intermittently and
#   confusingly, depending on scheduling.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-library-backup
  namespace: immich
spec:
  # 03:30, after the Postgres base backup at 02:30, so the two do not compete
  # for the uplink.
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  # A 2TB initial backup over a domestic uplink takes days. Do not let
  # Kubernetes kill it.
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      # 20h: long enough for a big incremental, short enough that a wedged job
      # does not block tomorrow's run.
      activeDeadlineSeconds: 72000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-library-backup
        spec:
          restartPolicy: OnFailure
          # Must co-locate with immich-server: shared ReadWriteOnce volume.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: immich-server
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.0
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  # `init` is idempotent-by-failure: it errors if the repo already
                  # exists, which is the normal case after the first run.
                  restic init 2>/dev/null || true

                  restic backup /data \
                    --tag immich-library \
                    --host immich \
                    --exclude '**/.tmp/**' \
                    --exclude '**/encoded-video/**' \
                    --exclude '**/thumbs/**' \
                    --verbose

                  # Retention. Thumbnails and transcodes are excluded above
                  # because Immich regenerates them from originals -- backing them
                  # up would roughly double the bill for data that is derived.
                  restic forget \
                    --tag immich-library \
                    --keep-daily 7 \
                    --keep-weekly 5 \
                    --keep-monthly 12 \
                    --prune

                  # Cheap structural check on every run. The real verification
                  # (actually restoring data) is a separate CronJob:
                  # platform/backup-verify/.
                  restic check --with-cache
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/homelab-backups-REPLACE-ME/immich/library
                - name: RESTIC_CACHE_DIR
                  value: /cache
                # Retry rather than fail on a flaky domestic uplink.
                - name: RESTIC_PACK_SIZE
                  value: "64"
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  # restic's deduplication index for a 2TB repo is memory-hungry.
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: immich-data
                readOnly: true
            - name: cache
              persistentVolumeClaim:
                claimName: immich-restic-cache
---
# restic's cache makes incremental runs fast. Without a persistent cache every
# run re-downloads the repository index, which for a 2TB repo is slow enough to
# push the job past its deadline.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-restic-cache
  namespace: immich
spec:
  storageClassName: iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
# ###########################################################################
# THE SAME LIBRARY, BACKED UP AGAIN -- LOCALLY, TO NFS.
#
# Two independent restic repositories, not one repository copied. That is
# deliberate: `restic copy` would make the remote a derivative of the local, so a
# corruption or a bad `forget` in one could propagate. Independent repositories
# fail independently, which is the entire point of having two.
#
# The cost is reading the source twice. On a LAN that is minutes, and it buys a
# copy whose verification is FREE -- which is why the expensive check
# (`restic check --read-data`, full, weekly) runs against this repository while the
# S3 one gets structure, freshness and a sample restore. See docs/backups.md.
#
# WHAT THIS DEFENDS AGAINST
#   A bad Immich upgrade, a bad migration, an app rewriting its own data, a
#   mistaken delete. Recovery is over the LAN at NAS speed, not over a domestic
#   uplink from Glacier.
#
# WHAT IT DOES NOT DEFEND AGAINST
#   Losing the pool. It lives on the same TrueNAS as the data it protects. That is
#   what the S3 repository above is for.
#
# Note this is a nightly SECOND copy, and is separate from the instant
# copy-on-write rollback points taken by scripts/pre-upgrade-snapshot.sh. The
# snapshot is for "undo the last hour"; this is for "the volume itself is wrong".
# ###########################################################################
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-library-backup-local
  namespace: immich
spec:
  # 01:30 -- before the S3 run at 03:30, so the local copy (the one that gets
  # fully verified) is always at least as fresh as the remote one.
  schedule: "30 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      # 6h is plenty over a LAN; the S3 job needs 20h because of the uplink.
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-library-backup-local
        spec:
          restartPolicy: OnFailure
          # Same ReadWriteOnce constraint as the S3 job: `immich-data` can only be
          # attached on the node already running immich-server.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: immich-server
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            # Must be 1000: the NFS dataset is owned by uid/gid 1000 and NFS
            # AUTH_SYS passes these numeric ids straight to the server. Change
            # this and every write fails with EACCES.
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.0
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  restic init 2>/dev/null || true

                  restic backup /data \
                    --tag immich-library \
                    --host immich \
                    --exclude '**/.tmp/**' \
                    --exclude '**/encoded-video/**' \
                    --exclude '**/thumbs/**' \
                    --verbose

                  # Longer retention than the S3 copy: local storage is 16TB of
                  # already-paid-for pool, so depth here is nearly free and gives
                  # more room to notice a problem that started weeks ago.
                  restic forget \
                    --tag immich-library \
                    --keep-daily 14 \
                    --keep-weekly 8 \
                    --keep-monthly 6 \
                    --prune

                  restic check --with-cache
              env:
                # A plain filesystem path, not an s3: URL. No credentials, no
                # endpoint, no egress.
                - name: RESTIC_REPOSITORY
                  value: /backups/immich/library
                - name: RESTIC_CACHE_DIR
                  value: /cache
                # Only the repository password -- deliberately NOT `envFrom` the
                # whole s3-backup Secret. A local job has no business holding S3
                # credentials.
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup
                      key: RESTIC_PASSWORD
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backups
                  mountPath: /backups
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: immich-data
                readOnly: true
            - name: backups
              persistentVolumeClaim:
                claimName: backup-local
            - name: cache
              persistentVolumeClaim:
                claimName: immich-restic-cache-local
---
# A separate cache from the S3 job's. Sharing one would mean two restic processes
# writing the same cache directory for two different repositories, and the cache
# is keyed by repository id -- so it would work by luck rather than by design.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-restic-cache-local
  namespace: immich
spec:
  storageClassName: iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
