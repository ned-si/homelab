# The photo library to S3 with restic. Not VolSync: the library is write-once,
# so a snapshot buys little, and a half-uploaded file is picked up next run.
#
# `immich-data` is ReadWriteOnce: the podAffinity puts this pod on the
# immich-server node. No fsGroup: the kubelet could change ownership of the
# library, and these jobs must never change it.
#
# Retention is monthly (`immich-library-prune`): Glacier IR bills 90 days.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-library-backup
  namespace: immich
spec:
  # 03:30, after the local copy at 01:30, so the two never read the library at
  # the same time.
  schedule: "30 3 * * *"
  suspend: false
  # One run at a time. A run that is still uploading when the next one is due
  # keeps going; the next one is skipped, not started beside it.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      # 20h: long enough for a big incremental, short enough that a wedged job
      # does not block tomorrow's run.
      activeDeadlineSeconds: 72000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-library-backup
        spec:
          restartPolicy: OnFailure
          # Must co-locate with immich-server: shared ReadWriteOnce volume. The
          # chart labels the server pod name=server, instance=immich.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: server
                      app.kubernetes.io/instance: immich
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  # `init` is idempotent-by-failure: it errors if the repo already
                  # exists, which is the normal case after the first run.
                  restic init 2>/dev/null || true
                  # Stale locks only: a live lock is refreshed and stays (docs/backups.md#locks).
                  restic unlock

                  # Thumbnails and transcodes are excluded because Immich
                  # regenerates them from originals -- backing them up would
                  # roughly double the bill for data that is derived.
                  restic backup --retry-lock 30m /data \
                    --tag immich-library \
                    --host immich \
                    --exclude '**/.tmp/**' \
                    --exclude '**/encoded-video/**' \
                    --exclude '**/thumbs/**' \
                    --verbose

                  # Cheap structural check on every run. The real verification
                  # (actually restoring data) is a separate CronJob:
                  # platform/backup-verify/.
                  restic unlock
                  restic check --retry-lock 30m --with-cache
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/immich/library
                - name: RESTIC_CACHE_DIR
                  value: /cache
                # restic writes temp pack files here while uploading. Without this it uses
                # /tmp, which does not exist writable under readOnlyRootFilesystem, and
                # `restic backup` fails the moment it has a pack to flush. /cache is
                # already mounted and writable.
                - name: TMPDIR
                  value: /cache
                # Retry rather than fail on a flaky domestic uplink.
                - name: RESTIC_PACK_SIZE
                  value: "64"
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  # restic's deduplication index for a large repo is memory-hungry.
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: immich-data
                readOnly: true
            # A cold cache costs one download of the repository index (index/ and
            # snapshots/ stay in S3 Standard). For ~260 GiB that is seconds.
            # sizeLimit guards the node's eMMC, which also holds kubelet and
            # containerd.
            - name: cache
              emptyDir:
                sizeLimit: 2Gi
---
# ###########################################################################
# THE SAME LIBRARY AGAIN, LOCALLY, TO NFS: an independent repository, not a
# `restic copy`, so corruption or a bad `forget` cannot propagate. Its reads
# are free, so the weekly `restic check --read-data` runs here
# (docs/backups.md). It covers bad upgrades and mistaken deletes, not losing
# the pool. Its own nightly forget + prune (no Glacier minimum).
# ###########################################################################
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-library-backup-local
  namespace: immich
spec:
  # 01:30 -- before the S3 run at 03:30, so the local copy (the one that gets
  # fully verified) is always at least as fresh as the remote one.
  schedule: "30 1 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      # 6h is plenty over a LAN; the S3 job needs 20h because of the uplink.
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-library-backup-local
        spec:
          restartPolicy: OnFailure
          # Same ReadWriteOnce constraint as the S3 job: `immich-data` can only be
          # attached on the node already running immich-server.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: server
                      app.kubernetes.io/instance: immich
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            # Must be 1000/1000: the NFS dataset is owned by uid/gid 1000 with
            # mode 0770, and NFS AUTH_SYS passes these numeric ids straight to the
            # server. Change them and every write fails with EACCES.
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  restic init 2>/dev/null || true
                  # Stale locks only: a live lock is refreshed and stays (docs/backups.md#locks).
                  restic unlock

                  restic backup --retry-lock 30m /data \
                    --tag immich-library \
                    --host immich \
                    --exclude '**/.tmp/**' \
                    --exclude '**/encoded-video/**' \
                    --exclude '**/thumbs/**' \
                    --verbose

                  # Longer retention than the S3 copy: local storage is 16TB of
                  # already-paid-for pool, so depth here is nearly free and gives
                  # more room to notice a problem that started weeks ago.
                  restic unlock
                  restic forget --retry-lock 30m \
                    --tag immich-library \
                    --keep-daily 14 \
                    --keep-weekly 8 \
                    --keep-monthly 6 \
                    --prune

                  restic check --retry-lock 30m --with-cache
              env:
                # A plain filesystem path, not an s3: URL. No credentials, no
                # endpoint, no egress.
                - name: RESTIC_REPOSITORY
                  value: /backups/immich/library
                - name: RESTIC_CACHE_DIR
                  value: /cache
                # restic writes temp pack files here while uploading. Without this it uses
                # /tmp, which does not exist writable under readOnlyRootFilesystem, and
                # `restic backup` fails the moment it has a pack to flush. /cache is
                # already mounted and writable.
                - name: TMPDIR
                  value: /cache
                # Only the repository password -- deliberately NOT `envFrom` the
                # whole s3-backup Secret. A local job has no business holding S3
                # credentials.
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup
                      key: RESTIC_PASSWORD
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backups
                  mountPath: /backups
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: immich-data
                readOnly: true
            # The backup dataset, mounted inline. The PV/PVC pair in
            # infrastructure/nfs-storage/backup-volume.yaml (claim
            # `backup-local`) replaces it with the NFS hardening (#721).
            - name: backups
              nfs:
                server: 192.168.1.228 # SITE-SPECIFIC
                path: /mnt/homelab/k8s/backups
            # A separate cache from the S3 job's: the cache is keyed by
            # repository id, and the two repositories are different.
            - name: cache
              emptyDir:
                sizeLimit: 2Gi
---
# S3 retention, monthly. `--keep-within 3m` keeps every pack past Glacier
# IR's 90-day minimum; then one snapshot a month for a year. Talks to S3 only,
# so no affinity.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-library-prune
  namespace: immich
spec:
  # The 1st of the month at 13:30, the last of the monthly prunes and well
  # clear of the nightly backups.
  schedule: "30 13 1 * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich-library-prune
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  restic unlock
                  restic forget --retry-lock 30m \
                    --host immich \
                    --tag immich-library \
                    --keep-within 3m \
                    --keep-monthly 12 \
                    --prune

                  restic check --retry-lock 30m --with-cache
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/immich/library
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: TMPDIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: cache
              emptyDir:
                sizeLimit: 2Gi
