# Ported byte-for-byte in spec from the running cluster (legacy tree at the
# all-apps pin), ADR 0002. Differences from live, all intended:
#   - inline credentials replaced by secretKeyRef to SOPS Secrets with the same
#     value (per-key sha256 checked), which restarts the pod once on adoption;
#   - PVCs carry argocd.argoproj.io/sync-options: Delete=false,Prune=false.
# Hardening (probes, security contexts, resources, image digests) is a later,
# separate change: docs/roadmap.md.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  instances: 1
  # PostgreSQL 16 with VectorChord (`vchord`) and pgvector, the extensions
  # Immich 3 requires. Renovate never updates it: a VectorChord update needs
  # `ALTER EXTENSION vchord UPDATE` and a reindex
  # (docs/runbooks/immich-upgrade.md).
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.15-1.1.1@sha256:f5a17fa05faf25e81304ee95e9f920d8ae077ac4a4ef0a1251e09c7197cbb236
  # Created from its Barman Cloud backup, a physical copy, so the extensions
  # (`vchord`, `vector`, `cube`, `earthdistance`) and the search_path come with
  # the data. A recovery needs an image with the same extensions; a backup from
  # before 2026-10-16 still holds pgvecto.rs (`vectors`) and needs the old
  # image, cloudnative-pgvecto.rs:16.5-v0.3.0.
  # Archives under a new server name (CNPG refuses a non-empty path; the old one
  # stays readable). docs/bootstrap.md
  #
  # Fallback (empty cluster + pg_restore of a dump) needs the initdb block this
  # replaced, with its postInitApplicationSQL: `git show pre-talos:<this file>`.
  bootstrap:
    recovery:
      source: origin
      database: app
      owner: app
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: cnpg-backup
          serverName: immich-db
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
  storage:
    size: 5Gi
  # WAL archiving and base backups to S3 (backup.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # The webhook defaults this; stating it keeps Argo CD's diff clean.
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-backup
        serverName: immich-db-t1
