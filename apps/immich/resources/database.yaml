# Ported byte-for-byte in spec from the running cluster (legacy tree at the
# all-apps pin), ADR 0002. Differences from live, all intended:
#   - inline credentials replaced by secretKeyRef to SOPS Secrets with the same
#     value (per-key sha256 checked), which restarts the pod once on adoption;
#   - PVCs carry argocd.argoproj.io/sync-options: Delete=false,Prune=false.
# Hardening (probes, security contexts, resources, image digests) is a later,
# separate change: docs/roadmap.md.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  instances: 1
  imageName: ghcr.io/tensorchord/cloudnative-pgvecto.rs:16.5-v0.3.0  # image-policy: allow frozen until the VectorChord migration
  # Created from its Barman Cloud backup, a physical copy, so the `vectors`,
  # `cube` and `earthdistance` extensions and the search_path come with the
  # data. The image above must stay the one the backup was taken with.
  # Archives under a new server name (CNPG refuses a non-empty path; the old one
  # stays readable). docs/bootstrap.md
  #
  # Fallback (empty cluster + pg_restore of a dump) needs the initdb block this
  # replaced, with its postInitApplicationSQL: `git show pre-talos:<this file>`.
  bootstrap:
    recovery:
      source: origin
      database: app
      owner: app
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: cnpg-backup
          serverName: immich-db
  postgresql:
    shared_preload_libraries:
      - "vectors.so"
  storage:
    size: 5Gi
  # WAL archiving and base backups to S3 (backup.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # The webhook defaults this; stating it keeps Argo CD's diff clean.
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-backup
        serverName: immich-db-t1
