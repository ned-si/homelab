# The photo library, 2Ti, referenced by
# `immich.persistence.library.existingClaim`. ReadWriteOnce: only the server
# writes, so it uses the Recreate strategy.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-data
  namespace: immich
spec:
  storageClassName: iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Ti
