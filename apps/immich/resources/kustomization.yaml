apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich

# Resources the Immich chart does not provide, at parity with the running
# cluster (ADR 0002).
#
# NOT RENDERED, on purpose:
#   library-pvc.yaml   the photo library PVC immich-data (2Ti). It stays owned
#                      by nothing in this tree until the operator signs off its
#                      adoption; CI (repo-policy pvc-sync-options) fails any
#                      render that contains it.
resources:
  - database.yaml
  # WAL archiving and daily base backups of immich-db to S3 (Barman Cloud plugin).
  - backup.yaml
  # Takes a base backup of immich-db before every sync (presync-backup.yaml).
  - presync-backup.yaml
  - valkey.yaml
  - httproute.yaml
  # restic CronJobs for the photo library: S3, local NFS, monthly prune.
  - backup-files.yaml

# After every (manual) sync: the server Service, from the chart, answers.
components:
  - ../../../components/postsync-smoke
patches:
  - target: { kind: Job, name: postsync-smoke }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - http://immich-server:2283/api/server/ping
