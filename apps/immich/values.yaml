# Immich chart values (bjw-s common). Renovate updates `image.tag`, shared by
# server and machine learning; the database image is in
# resources/database.yaml. The config file comes from the SOPS Secret
# `immich-config`, so the OIDC client secret never lands in a ConfigMap.
controllers:
  main:
    containers:
      main:
        image:
          # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
          tag: v3.4.0
        env:
          REDIS_HOSTNAME: "valkey.immich.svc.cluster.local"
          DB_URL:
            valueFrom:
              secretKeyRef:
                name: immich-db-app
                key: uri
          TZ: Europe/Zurich

immich:
  metrics:
    enabled: true
  persistence:
    library:
      # The photo library (2Ti). The PVC itself is not managed by this tree.
      existingClaim: immich-data
  existingConfiguration: immich-config
  configurationKind: Secret

server:
  enabled: true
  # Prometheus selects monitors by this label (repo-policy monitor-selected).
  serviceMonitor:
    main:
      labels:
        release: kube-prometheus-stack
  controllers:
    main:
      # The library PVC is ReadWriteOnce: a second server pod could not mount
      # it. The chart defaults to RollingUpdate.
      strategy: Recreate
      # Off the control planes when there is room: etcd shares their eMMC and
      # CPU, and a library scan or thumbnail run takes every core it gets.
      pod:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        # Root profile (operator decision 1, #726): the library on
        # immich-data stays owned by root, so no runAsUser. The chart already
        # turns the token off.
        securityContext:
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          # Runs as root without switching user: no KILL, SETGID or SETUID.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          # Peak RSS about 3.2Gi (2026-10-21, thumbnail backlog); the rest of
          # its working set is page cache. No CPU limit, like the other apps.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 6Gi
          env:
            # Every asset path in the database starts with this. A different
            # location makes the server rewrite all of them on start.
            IMMICH_MEDIA_LOCATION: /usr/src/app/upload
        # Immich v3.4.0 pulled in OpenTelemetry JS 0.300, whose Prometheus
        # exporter listens on localhost only and no longer reads
        # OTEL_EXPORTER_PROMETHEUS_HOST (immich-app/immich#33173). This
        # sidecar shares the pod's network namespace and re-exposes 8081 and
        # 8082 on 9081 and 9082 for Prometheus. Remove it, and the targetPort
        # overrides below, once Immich passes a host to the exporter.
        metrics-proxy:
          image:
            repository: alpine/socat
            # renovate: datasource=docker depName=alpine/socat
            tag: 1.8.1.3@sha256:e8a6e8868a8e6e01d9c2c321a8f8d4474d2d741d962462e5c5a124a8e66a0055
          command: ["/bin/sh", "-c"]
          args:
            - >-
              socat TCP-LISTEN:9081,fork,reuseaddr TCP:127.0.0.1:8081 &
              exec socat TCP-LISTEN:9082,fork,reuseaddr TCP:127.0.0.1:8082
          ports:
            - name: metrics-api-fwd
              containerPort: 9081
              protocol: TCP
            - name: metrics-ms-fwd
              containerPort: 9082
              protocol: TCP
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 9081
                periodSeconds: 30
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 9082
                periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
  # The metrics Service ports point at the proxy (see metrics-proxy above).
  service:
    main:
      controller: main
      ports:
        metrics-api:
          port: 8081
          targetPort: 9081
          protocol: HTTP
        metrics-ms:
          port: 8082
          targetPort: 9082
          protocol: HTTP
  persistence:
    # The chart's library volume (`immich.persistence.library`), mounted at
    # the old path instead of the chart's /data.
    data:
      existingClaim: immich-data
      globalMounts:
        - path: /usr/src/app/upload
  # No Ingress: media.lilalala.com is served by the shared Gateway
  # (resources/httproute.yaml).
  ingress:
    main:
      enabled: false

machine-learning:
  enabled: true
  controllers:
    main:
      # Its model cache PVC is ReadWriteOnce too.
      strategy: Recreate
      # Off the control planes when there is room: etcd shares their eMMC and
      # CPU, and a library scan or thumbnail run takes every core it gets.
      pod:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        # Rootless as upstream documents it (FAQ, "How can I run Immich as a
        # non-root user?"): it writes only /cache. The cache was written as
        # root, so the kubelet gives its files group 1000 once.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Peak about 2.4Gi with both SigLIP models loaded.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          env:
            MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL: ViT-B-16-SigLIP-i18n-256__webli
            MACHINE_LEARNING_PRELOAD__CLIP__VISUAL: ViT-B-16-SigLIP-i18n-256__webli
  persistence:
    cache:
      enabled: true
      # The name chart 0.9 gave it; the default would be a new, empty PVC.
      forceRename: immich-machine-learning-cache
      type: persistentVolumeClaim
      size: 10Gi
      accessMode: ReadWriteOnce
      storageClass: iscsi
      annotations:
        argocd.argoproj.io/sync-options: Delete=false,Prune=false
