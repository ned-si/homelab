# Immich chart 0.13.x values (oci://ghcr.io/immich-app/immich-charts/immich,
# bjw-s common library 5). Top-level `controllers` applies to every component;
# `server` and `machine-learning` add their own.
#
# Renovate updates `image.tag` (server and machine learning share it). The
# database image is not here: apps/immich/resources/database.yaml.
#
# The runtime config file is not rendered by the chart: `immich.configuration`
# is unset and the file is mounted from the SOPS Secret `immich-config`
# (apps/secrets/immich-config.sops.yaml) at /config, so the OIDC client secret
# never lands in a ConfigMap.
controllers:
  main:
    containers:
      main:
        image:
          # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
          tag: v3.3.5
        env:
          REDIS_HOSTNAME: "valkey.immich.svc.cluster.local"
          DB_URL:
            valueFrom:
              secretKeyRef:
                name: immich-db-app
                key: uri
          TZ: Europe/Zurich

immich:
  metrics:
    enabled: true
  persistence:
    library:
      # The photo library (2Ti). The PVC itself is not managed by this tree.
      existingClaim: immich-data
  existingConfiguration: immich-config
  configurationKind: Secret

server:
  enabled: true
  controllers:
    main:
      # The library PVC is ReadWriteOnce: a second server pod could not mount
      # it. The chart defaults to RollingUpdate.
      strategy: Recreate
      containers:
        main:
          env:
            # Every asset path in the database starts with this. A different
            # location makes the server rewrite all of them on start.
            IMMICH_MEDIA_LOCATION: /usr/src/app/upload
  persistence:
    # The chart's library volume (`immich.persistence.library`), mounted at
    # the old path instead of the chart's /data.
    data:
      existingClaim: immich-data
      globalMounts:
        - path: /usr/src/app/upload
  # No Ingress: media.lilalala.com is served by the shared Gateway
  # (resources/httproute.yaml).
  ingress:
    main:
      enabled: false

machine-learning:
  enabled: true
  controllers:
    main:
      # Its model cache PVC is ReadWriteOnce too.
      strategy: Recreate
      containers:
        main:
          env:
            MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL: ViT-B-16-SigLIP-i18n-256__webli
            MACHINE_LEARNING_PRELOAD__CLIP__VISUAL: ViT-B-16-SigLIP-i18n-256__webli
  persistence:
    cache:
      enabled: true
      # The name chart 0.9 gave it; the default would be a new, empty PVC.
      forceRename: immich-machine-learning-cache
      type: persistentVolumeClaim
      size: 10Gi
      accessMode: ReadWriteOnce
      storageClass: iscsi
      annotations:
        argocd.argoproj.io/sync-options: Delete=false,Prune=false
