# Home Assistant: https://home.lilalala.com (docs/home-automation.md).
#
# Volumes:
#   home-assistant-config (iSCSI)  /config: UI state in .storage, custom
#                                  components, automations/scripts/scenes
#                                  made in the UI
#   ConfigMap home-assistant-config  configuration.yaml, copied over
#                                  /config/configuration.yaml by the `config`
#                                  init container on every start (config/)
# The recorder (history) is the CNPG cluster in database.yaml.
#
# Login: Keycloak through the hass-oidc-auth custom component (auth_oidc in
# config/configuration.yaml). The `custom-components` init container installs
# the pinned releases of the custom components (auth_oidc, and dreame_vacuum
# for the MOVA robot) into /config/custom_components, and the dependencies
# missing from the image (joserfc, mini-racer) into /config/deps, on
# PYTHONPATH, so Home Assistant never installs packages at runtime.
# mini-racer (V8, for dreame_vacuum's map) also needs libatomic, not in the
# image: copied from Alpine's package into /config/deps/lib, on
# LD_LIBRARY_PATH.
#
# Pod network, no hostNetwork: devices get static IPs and are added by
# address, so mDNS/SSDP discovery is not needed (docs/home-automation.md).
#
# Non-root, without the image's s6 init: `python3 -m homeassistant` as uid
# 1000. Nothing here needs root: no USB, no Bluetooth adapter (BLE goes
# through an ESPHome proxy), no ICMP.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: home-assistant
  name: home-assistant
  namespace: home
spec:
  replicas: 1
  # One RWO config volume: a rolling update would hang on the attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # configuration.yaml comes from git and is replaced on every start;
        # the files the UI writes are only created when missing.
        - name: config
          # Same image as the app: one Renovate dependency, and it has a shell.
          # renovate: datasource=docker depName=ghcr.io/home-assistant/home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.10.1@sha256:130241f28d01fa80dfa3b44f7d89781c188d8642ecab9024f079f19f9f82baa0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-euc"]
          args:
            - |
              cp /git/configuration.yaml /config/configuration.yaml
              # HTTP settings (reverse proxy, IP ban) live only in this store.
              mkdir -p /config/.storage
              cp /git/http-store.json /config/.storage/http
              for f in automations.yaml scripts.yaml scenes.yaml; do
                [ -f "/config/$f" ] || echo '[]' > "/config/$f"
              done
              echo "ok: configuration.yaml and .storage/http from git"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: git-config
              mountPath: /git
              readOnly: true
        # Downloads only when the installed version differs from the pin, so a
        # restart does not depend on GitHub or PyPI.
        - name: custom-components
          # renovate: datasource=docker depName=ghcr.io/home-assistant/home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.10.1@sha256:130241f28d01fa80dfa3b44f7d89781c188d8642ecab9024f079f19f9f82baa0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-euc"]
          args:
            - |
              # renovate: datasource=github-releases depName=christiaangoossens/hass-oidc-auth
              OIDC_VERSION=v1.2.1
              # renovate: datasource=pypi depName=joserfc
              JOSERFC_VERSION=1.7.5
              # renovate: datasource=github-releases depName=Tasshack/dreame-vacuum
              DREAME_VERSION=v2.0.2
              # 0.12.4 is the last release whose musllinux aarch64 wheel is
              # really musl; from 0.13.0 it is glibc-linked and V8 does not
              # load (Renovate holds it, renovate.json5).
              # renovate: datasource=pypi depName=mini-racer
              MINI_RACER_VERSION=0.12.4
              # Alpine of the image (/etc/alpine-release); bump both together.
              LIBATOMIC_APK=v3.24/main/aarch64/libatomic-15.2.0-r5.apk
              LIBATOMIC_SHA256=31a45fec053c43a006370f83238f16f959838a9a703fbf26bfd1a36da4f538b2
              cc=/config/custom_components
              mkdir -p "$cc"
              if [ "$(cat "$cc/auth_oidc/.version" 2>/dev/null)" != "$OIDC_VERSION" ]; then
                rm -rf /tmp/auth_oidc /tmp/auth_oidc.zip
                curl -fsSL --retry 3 -m 120 -o /tmp/auth_oidc.zip \
                  "https://github.com/christiaangoossens/hass-oidc-auth/releases/download/$OIDC_VERSION/hass-oidc-auth.zip"
                python3 -m zipfile -e /tmp/auth_oidc.zip /tmp/auth_oidc
                test -f /tmp/auth_oidc/manifest.json
                echo "$OIDC_VERSION" > /tmp/auth_oidc/.version
                rm -rf "$cc/auth_oidc"
                cp -r /tmp/auth_oidc "$cc/auth_oidc"
              fi
              # dreame_vacuum's other requirements (numpy, pycryptodome,
              # python-miio, paho-mqtt) are in the image.
              if [ "$(cat "$cc/dreame_vacuum/.version" 2>/dev/null)" != "$DREAME_VERSION" ]; then
                rm -rf /tmp/dreame_vacuum /tmp/dreame_vacuum.zip
                curl -fsSL --retry 3 -m 300 -o /tmp/dreame_vacuum.zip \
                  "https://github.com/Tasshack/dreame-vacuum/releases/download/$DREAME_VERSION/dreame_vacuum.zip"
                python3 -m zipfile -e /tmp/dreame_vacuum.zip /tmp/dreame_vacuum
                test -f /tmp/dreame_vacuum/manifest.json
                echo "$DREAME_VERSION" > /tmp/dreame_vacuum/.version
                rm -rf "$cc/dreame_vacuum" /tmp/dreame_vacuum.zip
                cp -r /tmp/dreame_vacuum "$cc/dreame_vacuum"
              fi
              deps="joserfc==$JOSERFC_VERSION mini-racer==$MINI_RACER_VERSION $LIBATOMIC_APK"
              if [ "$(cat /config/deps/.versions 2>/dev/null)" != "$deps" ]; then
                rm -rf /config/deps
                uv pip install --quiet --no-deps --python "$(command -v python3)" \
                  --target /config/deps \
                  "joserfc==$JOSERFC_VERSION" "mini-racer==$MINI_RACER_VERSION"
                rm -rf /tmp/libatomic /tmp/libatomic.apk
                mkdir -p /tmp/libatomic /config/deps/lib
                curl -fsSL --retry 3 -m 60 -o /tmp/libatomic.apk \
                  "https://dl-cdn.alpinelinux.org/alpine/$LIBATOMIC_APK"
                echo "$LIBATOMIC_SHA256  /tmp/libatomic.apk" | sha256sum -c -
                tar -xzf /tmp/libatomic.apk -C /tmp/libatomic usr/lib/libatomic.so.1.2.0
                cp /tmp/libatomic/usr/lib/libatomic.so.1.2.0 /config/deps/lib/libatomic.so.1
                echo "$deps" > /config/deps/.versions
              fi
              echo "ok: auth_oidc $OIDC_VERSION, dreame_vacuum $DREAME_VERSION, $deps"
          env:
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      containers:
        - name: home-assistant
          # renovate: datasource=docker depName=ghcr.io/home-assistant/home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.10.1@sha256:130241f28d01fa80dfa3b44f7d89781c188d8642ecab9024f079f19f9f82baa0
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "homeassistant", "--config", "/config"]
          env:
            - name: TZ
              value: Europe/Zurich
            # Read by configuration.yaml (`!env_var`). CloudNativePG generates
            # the Secret, so the password never enters git.
            - name: HA_RECORDER_DB_URL
              valueFrom:
                secretKeyRef:
                  name: home-assistant-postgresql-app
                  key: uri
            # The root filesystem is read-only: caches go to /tmp.
            - name: HOME
              value: /tmp
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
            # joserfc for auth_oidc, mini-racer for dreame_vacuum and the
            # libatomic it needs, installed by the custom-components init
            # container.
            - name: PYTHONPATH
              value: /config/deps
            - name: LD_LIBRARY_PATH
              value: /config/deps/lib
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          # /manifest.json answers without a login; the PostSync smoke test
          # checks the same path.
          startupProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: git-config
          configMap:
            name: home-assistant-config
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: home
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  storageClassName: iscsi-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: home-assistant
  name: home-assistant
  namespace: home
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8123
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: home-assistant
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home
spec:
  # group/kind/weight and the catch-all match are the API server's defaults,
  # spelled out so that Argo CD's diff sees no drift.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - home.lilalala.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Content-Security-Policy
                value: "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
      backendRefs:
        - group: ""
          kind: Service
          name: home-assistant
          port: 8123
          weight: 1
      # The frontend holds one long-lived WebSocket.
      timeouts:
        request: 0s
