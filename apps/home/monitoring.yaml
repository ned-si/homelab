# Prometheus scrapes Home Assistant at /api/prometheus with the HA owner's
# long-lived token `prometheus` from the SOPS Secret
# `home-assistant-prometheus`, for the Grafana dashboard "Home".
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: home-assistant
  namespace: home
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  endpoints:
    - port: http
      path: /api/prometheus
      interval: 60s
      scrapeTimeout: 20s
      authorization:
        type: Bearer
        credentials:
          name: home-assistant-prometheus
          key: token
