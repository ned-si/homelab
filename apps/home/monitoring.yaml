# Prometheus scrapes Home Assistant's prometheus integration
# (config/configuration.yaml) at /api/prometheus. The endpoint needs a
# long-lived access token of the HA owner, client name `prometheus`, in the
# SOPS Secret `home-assistant-prometheus` (apps/secrets/). The Grafana
# dashboard "Home" (platform/kube-prometheus-stack/dashboards/home.json)
# reads these metrics. A new token: HA profile, Security, Long-lived access
# tokens; then `task secrets:edit -- apps/secrets/home-assistant-prometheus.sops.yaml`.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: home-assistant
  namespace: home
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  endpoints:
    - port: http
      path: /api/prometheus
      interval: 60s
      scrapeTimeout: 20s
      authorization:
        type: Bearer
        credentials:
          name: home-assistant-prometheus
          key: token
