# The Home Assistant recorder: states and statistics history. Home Assistant
# reads the connection string from the generated Secret
# `home-assistant-postgresql-app` (key `uri`), so the password never enters git.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: home-assistant-postgresql
  namespace: home
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  instances: 1
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318
  storage:
    size: 5Gi
    storageClass: iscsi-retain
  bootstrap:
    initdb:
      database: app
      owner: app
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  # WAL archiving and base backups to S3 (cnpg-backup.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # The webhook defaults this; stating it keeps Argo CD's diff clean.
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-backup
        serverName: home-assistant-postgresql
