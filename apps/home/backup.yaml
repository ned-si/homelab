# Home Assistant backup, nightly, to the restic repository `home/configs`:
# a pg_dump of the recorder and the config volume. Plus the monthly prune.
#
# CONSISTENCY
#   pg-home-assistant  CONSISTENT. pg_dump runs in one transaction. The
#                      cluster also archives WAL with daily base backups
#                      (cnpg-backup.yaml); this dump is a second copy.
#   /config            .storage holds JSON files Home Assistant rewrites
#                      atomically (write to a temp file, then rename), so a
#                      copy is never torn. Logs, the deps cache and the
#                      text-to-speech cache are skipped: rebuilt on demand.
#
# `home/configs` must stay in `local.restic_repos` in
# bootstrap/aws-backup/main.tf (scripts/check-restic-repos.sh).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: home-assistant-backup
  namespace: home
spec:
  # 05:40, after the books and lazylibrarian jobs (05:10-05:30).
  schedule: "40 5 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: home-assistant-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          # `home-assistant-config` is ReadWriteOnce: run next to the app.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: home-assistant
                  topologyKey: kubernetes.io/hostname
          # No fsGroup: every volume the job writes is an emptyDir, and an
          # fsGroup would let the kubelet change ownership on the app's volume.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              # Same image as home-assistant-postgresql (database.yaml), so
              # pg_dump always matches the server.
              # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
              image: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:c9be7f221a05b18fe65259d9136affbabe3b39ad91c3b68f8f2f990a45f35f38
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -uo pipefail
                  d=/creds
                  f=/dumps/pg-home-home-assistant-postgresql.dump
                  # -Fc: compressed, and pg_restore can inspect it. The name
                  # matches scripts/dump-databases.sh.
                  if ! PGPASSWORD="$(cat "$d/password")" pg_dump \
                       -h "$(cat "$d/host")" -p "$(cat "$d/port")" \
                       -U "$(cat "$d/user")" -d "$(cat "$d/dbname")" \
                       -Fc -f "$f"; then
                    echo "FAIL: pg_dump exited non-zero"
                    rm -f "$f"
                    exit 1
                  fi
                  # Every custom-format archive starts with "PGDMP".
                  if [ "$(head -c 5 "$f")" != "PGDMP" ]; then
                    echo "FAIL: output is not a pg_dump archive"
                    rm -f "$f"
                    exit 1
                  fi
                  echo "ok: $(du -h "$f" | cut -f1)"
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
                - name: creds
                  mountPath: /creds
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  restic init 2>/dev/null || true
                  restic backup /dumps \
                    --tag home-assistant \
                    --tag home-assistant-postgres \
                    --host home
                  restic backup /config \
                    --tag home-assistant \
                    --tag home-assistant-config \
                    --host home \
                    --exclude '/config/home-assistant.log*' \
                    --exclude /config/deps \
                    --exclude /config/tts \
                    --exclude /config/.cache
                  restic check --with-cache
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/home/configs
                - name: RESTIC_CACHE_DIR
                  value: /cache
                # restic's temp pack files; /tmp is read-only here.
                - name: TMPDIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: dumps
                  mountPath: /dumps
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: home-assistant-config
                readOnly: true
            - name: dumps
              emptyDir:
                sizeLimit: 2Gi
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
            - name: creds
              secret:
                # Generated by CloudNativePG; never in git.
                secretName: home-assistant-postgresql-app
---
# Retention, once a month: every snapshot for three months (Glacier IR bills
# 90 days minimum), then one per month for a year. S3 only, no app volume.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: home-prune
  namespace: home
spec:
  schedule: "45 13 1 * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: home-prune
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  restic forget \
                    --host home \
                    --keep-within 3m \
                    --keep-monthly 12 \
                    --prune
                  restic check --with-cache
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/home/configs
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: TMPDIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
