# Mosquitto, the in-cluster MQTT broker (mosquitto.home:1883,
# docs/home-automation.md). No anonymous clients: one user per client from the
# SOPS Secret `mosquitto-users`, hashed by the `passwd` init container; the
# ACL is copied mode 600 because Mosquitto 2.1 refuses a readable one. No
# persistence: Zigbee2MQTT republishes state when Home Assistant comes online.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: mosquitto
  name: mosquitto
  namespace: home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's `mosquitto` user.
        runAsUser: 1883
        runAsGroup: 1883
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: passwd
          # renovate: datasource=docker depName=eclipse-mosquitto
          image: eclipse-mosquitto:2.1.2-alpine@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-euc"]
          args:
            - |
              umask 077
              : > /auth/passwd
              for f in /users/*; do
                printf '%s:%s\n' "$(basename "$f")" "$(cat "$f")" >> /auth/passwd
              done
              mosquitto_passwd -U /auth/passwd
              # Mosquitto 2.1 refuses an ACL file that is not owned by its
              # user or is readable by others: ConfigMap files are both.
              cat /config/acl > /auth/acl
              echo "ok: $(wc -l < /auth/passwd) user(s), acl"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: users
              mountPath: /users
              readOnly: true
            - name: auth
              mountPath: /auth
            - name: config
              mountPath: /config
              readOnly: true
            # mosquitto_passwd -U writes its temporary file to /tmp.
            - name: tmp
              mountPath: /tmp
      containers:
        - name: mosquitto
          # renovate: datasource=docker depName=eclipse-mosquitto
          image: eclipse-mosquitto:2.1.2-alpine@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
          imagePullPolicy: IfNotPresent
          command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
              readOnly: true
            - name: auth
              mountPath: /mosquitto/auth
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: users
          secret:
            secretName: mosquitto-users
        - name: auth
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: mosquitto
  name: mosquitto
  namespace: home
spec:
  type: ClusterIP
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
  selector:
    app.kubernetes.io/name: mosquitto
