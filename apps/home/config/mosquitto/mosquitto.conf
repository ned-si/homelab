# Mosquitto broker configuration, from git (apps/home/config/mosquitto/).
listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/config/acl

# Zigbee2MQTT republishes state when Home Assistant comes online.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S
