# Audiobookshelf: audiobooks and podcasts, with Android and iOS apps.
# https://audiobooks.lilalala.com, login through Keycloak (docs/books.md).
#
# Volumes:
#   audiobookshelf-config (iSCSI)  /config (SQLite database) and /metadata
#                                  (covers, cache, its own daily backups)
#   NFS share (inline, like theater) /audiobooks and /podcasts, the libraries
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: audiobookshelf
  name: audiobookshelf
  namespace: books
spec:
  replicas: 1
  # One RWO config volume: a rolling update would hang on the attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: audiobookshelf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiobookshelf
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: audiobookshelf
          # renovate: datasource=docker depName=ghcr.io/advplyr/audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:2.37.1@sha256:581d68b2a6fc7ebf58d81c878a9f387cbbc0d88ac9d37b298b9cee10168af85b
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Zurich
            # Above 1024: the container runs as a non-root user.
            - name: PORT
              value: "13378"
            - name: CONFIG_PATH
              value: /config
            - name: METADATA_PATH
              value: /metadata
          ports:
            - name: http
              containerPort: 13378
              protocol: TCP
          # Ready = answers on the endpoint the PostSync smoke test checks.
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: config
            - name: config
              mountPath: /metadata
              subPath: metadata
            - name: library
              mountPath: /audiobooks
              subPath: books/audiobooks
            - name: library
              mountPath: /podcasts
              subPath: books/podcasts
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: audiobookshelf-config
        # Inline, like the theater apps: infrastructure/nfs-storage/ is not
        # deployed. SITE-SPECIFIC: the NAS address.
        - name: library
          nfs:
            server: 192.168.1.228
            path: /mnt/homelab/k8s/nfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-config
  namespace: books
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  storageClassName: iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: audiobookshelf
  name: audiobookshelf
  namespace: books
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 13378
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: audiobookshelf
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: audiobookshelf
  namespace: books
spec:
  # group/kind/weight and the catch-all match are the API server's defaults,
  # spelled out so that Argo CD's diff sees no drift.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - audiobooks.lilalala.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), payment=(), usb=()"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
      backendRefs:
        - group: ""
          kind: Service
          name: audiobookshelf
          port: 13378
          weight: 1
      # Streaming and uploads are long requests.
      timeouts:
        request: 0s
