apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperless

# Parity with the running cluster (ADR 0002), plus the restic backup and its
# monthly prune (backup.yaml, docs/backups.md).
resources:
  - valkey.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - backup.yaml
  # Configuration as code: PostSync Job and nightly CronJob (apply.yaml).
  - apply.yaml

# Input of paperless-apply. The name hash makes a change here a new
# ConfigMap, so the Job always runs with the files it was synced with.
configMapGenerator:
  - name: paperless-apply
    files:
      - config/apply.py
      - config/paperless.json

# After every sync: the Service answers on the login page (no health
# endpoint without authentication).
components:
  - ../../components/postsync-smoke
patches:
  - target: { kind: Job, name: postsync-smoke }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - http://paperless:8000/accounts/login/
