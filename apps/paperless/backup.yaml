# Paperless backup. Paperless runs on SQLite, so restic covers everything
# (spec paperless-documents, design "Backups, export and restore").
#
# Tags in the paperless/media repository: paperless-db (a consistent SQLite
# copy), paperless-media (the originals, irreplaceable), paperless-data (the
# rest, minus live database, index and thumbnails) and paperless-export
# (`document_exporter` output, readable without Paperless). The consume
# drop-box is not backed up.
#
# One Job, in order, so restic only snapshots a finished export: db-copy
# (backup API, then integrity_check), export from that copy holding
# media.lock, then restic. `backoffLimit: 1` reruns from a fresh copy; a
# second failure pages through KubeJobFailed. Retention is monthly
# (`paperless-prune`).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-backup
  namespace: paperless
spec:
  # 02:30, between Syncthing (02:00) and Mealie (03:20).
  schedule: "30 2 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      template:
        spec:
          restartPolicy: Never
          # Shares the RWO volumes with the paperless pod, so it must be
          # co-scheduled.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: paperless
                  topologyKey: kubernetes.io/hostname
          # No fsGroup: it would let the kubelet change ownership on the app's
          # volumes. The export volume's owner (uid 1000) comes from the
          # paperless image's init, which chowns /usr/src/paperless/export
          # (deployment.yaml); Kyverno denies a root container here.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
          initContainers:
            - name: db-copy
              # renovate: datasource=docker depName=ghcr.io/paperless-ngx/paperless-ngx
              image: ghcr.io/paperless-ngx/paperless-ngx:3.4.2@sha256:d704e84f88300eb6ab001ab15720a2330ff99169cf9f94d6b8fcc44b63a84c84
              imagePullPolicy: IfNotPresent
              command: ["python3", "-c"]
              args:
                - |
                  import sqlite3, sys
                  # mode=rw: a missing database is an error, not a new empty file.
                  src = sqlite3.connect("file:/data/db.sqlite3?mode=rw", uri=True)
                  dst = sqlite3.connect("/db/db.sqlite3")
                  src.backup(dst)
                  src.close()
                  result = dst.execute("PRAGMA integrity_check").fetchone()[0]
                  dst.close()
                  print("db-copy: integrity_check", result)
                  sys.exit(0 if result == "ok" else 1)
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: db
                  mountPath: /db
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
            - name: export
              # renovate: datasource=docker depName=ghcr.io/paperless-ngx/paperless-ngx
              image: ghcr.io/paperless-ngx/paperless-ngx:3.4.2@sha256:d704e84f88300eb6ab001ab15720a2330ff99169cf9f94d6b8fcc44b63a84c84
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-eu", "-c"]
              args:
                - |
                  : "${PASSPHRASE:?the export passphrase is empty}"
                  mkdir -p /db/log /db/consume
                  cd /usr/src/paperless/src
                  # --skip-checks: the startup checks are for the web app
                  # (paths, OCR languages), not for an export.
                  python3 manage.py document_exporter --skip-checks /export \
                    --use-filename-format --delete --no-progress-bar \
                    --passphrase "$PASSPHRASE"
                  test -s /export/manifest.json
                  # The default manager hides the trash, as the exporter does.
                  python3 manage.py shell -v 0 -c '
                  import datetime, json
                  from documents.models import Document
                  n = Document.objects.count()
                  now = datetime.datetime.now(datetime.timezone.utc)
                  with open("/export/export-meta.json", "w") as f:
                      json.dump({"documents": n, "taken": now.isoformat(timespec="seconds")}, f)
                  print("export: documents", n)
                  '
                  # A standalone file for the paperless-db snapshot: no -wal.
                  python3 -c '
                  import sqlite3
                  c = sqlite3.connect("/db/db.sqlite3")
                  print("db journal_mode", c.execute("PRAGMA journal_mode=DELETE").fetchone()[0])
                  c.close()
                  '
              env:
                - name: PASSPHRASE
                  valueFrom:
                    secretKeyRef:
                      name: paperless-export
                      key: passphrase
                # Paperless refuses to load its settings without it.
                - name: PAPERLESS_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: paperless-secrets
                      key: PAPERLESS_SECRET_KEY
                - name: PAPERLESS_DATA_DIR
                  value: /db
                - name: PAPERLESS_MEDIA_ROOT
                  value: /media
                - name: PAPERLESS_CONSUMPTION_DIR
                  value: /db/consume
                - name: PAPERLESS_TIME_ZONE
                  value: "Europe/Zurich"
                # Same as deployment.yaml: the export's file names.
                - name: PAPERLESS_FILENAME_FORMAT
                  value: "{{ created_year }}/{{ document_type }}/{{ created }} {{ correspondent }} {{ title }}"
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: db
                  mountPath: /db
                # Read-write: the exporter holds media.lock (the lock the app
                # takes while it adds or renames files) for the whole export,
                # and a read-only mount refuses to open it (EROFS, measured
                # on 3.4.2). It writes nothing else there.
                - name: media
                  mountPath: /media
                - name: export
                  mountPath: /export
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  restic init 2>/dev/null || true
                  # Stale locks only: a live lock is refreshed and stays (docs/backups.md#locks).
                  restic unlock

                  # The consistent database copy from db-copy.
                  restic backup --retry-lock 30m /db/db.sqlite3 \
                    --tag paperless-db --host paperless

                  # The documents. These are the irreplaceable part.
                  restic backup --retry-lock 30m /media \
                    --tag paperless-media --host paperless --verbose

                  # The rest of the data directory: not the live database
                  # (paperless-db has the consistent copy), not the
                  # regenerable index and thumbnails.
                  restic backup --retry-lock 30m /data \
                    --tag paperless-data --host paperless \
                    --exclude '/data/db.sqlite3*' \
                    --exclude '**/index/**' \
                    --exclude '**/thumbnails/**' \
                    --verbose

                  # The export: plain files and manifest.json. restic
                  # deduplicates it against /media.
                  restic backup --retry-lock 30m /export \
                    --tag paperless-export --host paperless

                  restic unlock
                  restic check --retry-lock 30m --with-cache
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/paperless/media
                - name: RESTIC_CACHE_DIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: db
                  mountPath: /db
                  readOnly: true
                - name: media
                  mountPath: /media
                  readOnly: true
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: export
                  mountPath: /export
                  readOnly: true
                - name: cache
                  mountPath: /cache
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              # restic writes only to RESTIC_CACHE_DIR (/cache) and the
              # temp dir (/tmp), both emptyDirs.
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            # Read-write for export only (media.lock); restic mounts it
            # read-only.
            - name: media
              persistentVolumeClaim:
                claimName: paperless-media
            # Read-write for db-copy only; restic mounts it read-only.
            - name: data
              persistentVolumeClaim:
                claimName: paperless-data
            - name: export
              persistentVolumeClaim:
                claimName: paperless-export
            # The database copy: the size of db.sqlite3 (MiB today).
            - name: db
              emptyDir:
                sizeLimit: 2Gi
            # emptyDir: the repository is tens of MiB, so a cold cache costs
            # seconds. sizeLimit guards the node's eMMC.
            - name: cache
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
---
# Retention, once a month. `--keep-within 3m` keeps every snapshot for three
# months, so no pack becomes unused before Glacier IR's 90-day minimum; after
# that one snapshot per month is kept for two years. Talks to S3 only, so it
# needs no app volume and no affinity.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-prune
  namespace: paperless
spec:
  schedule: "30 12 1 * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: paperless-prune
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  restic unlock
                  restic forget --retry-lock 30m \
                    --host paperless \
                    --keep-within 3m \
                    --keep-monthly 24 \
                    --prune

                  restic check --retry-lock 30m --with-cache
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/paperless/media
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: TMPDIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
