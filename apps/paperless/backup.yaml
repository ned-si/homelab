# Paperless backup.
#
# Paperless is on SQLite (see deployment.yaml for why), so there is no
# CloudNativePG cluster to archive. Everything lives on PVCs, which means restic
# for all of it.
#
# WHAT IS BACKED UP AND WHY
#   paperless-media   the original scanned documents. IRREPLACEABLE. If the
#                     paper original is gone, this is the only copy.
#   paperless-data    the SQLite database, search index and thumbnails. The
#                     index and thumbnails are derived, but the database holds
#                     tags, correspondents and document types -- i.e. all the
#                     work you did organising the archive.
#
#   paperless-consume is NOT backed up: it is a drop-box that Paperless empties.
#                     Anything sitting in it is transient by definition.
#
# CONSISTENCY CAVEAT, stated honestly: backing up a live SQLite file can capture
# a torn write, and restic has no way to know. The mitigation is the `.backup`
# command below, which produces a consistent copy through SQLite's own API rather
# than copying bytes from under a running process.
#
# RETENTION is monthly, in `paperless-prune` below: Glacier IR bills every pack
# for at least 90 days, so the nightly job only adds snapshots.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-backup
  namespace: paperless
spec:
  # 02:30, between Syncthing (02:00) and Seafile (03:00).
  schedule: "30 2 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 21600
      template:
        spec:
          restartPolicy: OnFailure
          # Shares the RWO volumes with the paperless pod, so it must be
          # co-scheduled.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: paperless
                  topologyKey: kubernetes.io/hostname
          # No fsGroup: every volume the job writes is an emptyDir, and an
          # fsGroup would let the kubelet change ownership on the app's volumes.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.0
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  restic init 2>/dev/null || true

                  # Consistent SQLite snapshot. `sqlite3 .backup` uses SQLite's
                  # backup API, which cooperates with the running writer -- unlike
                  # copying db.sqlite3 directly, which can produce a torn file
                  # that only fails when you try to restore it.
                  #
                  # If sqlite3 is unavailable in this image the copy is skipped
                  # rather than silently producing a corrupt one.
                  if command -v sqlite3 >/dev/null 2>&1; then
                    sqlite3 /data/db.sqlite3 ".backup '/tmp/db-consistent.sqlite3'"
                    restic backup /tmp/db-consistent.sqlite3 \
                      --tag paperless-db --host paperless
                    rm -f /tmp/db-consistent.sqlite3
                  else
                    echo "WARNING: sqlite3 not present; database captured as part"
                    echo "         of the file backup below and MAY BE INCONSISTENT."
                    echo "         See docs/backups.md#paperless."
                  fi

                  # The documents. These are the irreplaceable part.
                  restic backup /media \
                    --tag paperless-media --host paperless --verbose

                  # The database + index, excluding regenerable derivatives.
                  restic backup /data \
                    --tag paperless-data --host paperless \
                    --exclude '**/index/**' \
                    --exclude '**/thumbnails/**' \
                    --verbose

                  restic check --with-cache
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/paperless/media
                - name: RESTIC_CACHE_DIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: media
                  mountPath: /media
                  readOnly: true
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: cache
                  mountPath: /cache
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: media
              persistentVolumeClaim:
                claimName: paperless-media
                readOnly: true
            - name: data
              persistentVolumeClaim:
                claimName: paperless-data
                readOnly: true
            # emptyDir: the repository is tens of MiB, so a cold cache costs
            # seconds. sizeLimit guards the node's eMMC.
            - name: cache
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
---
# Retention, once a month. `--keep-within 3m` keeps every snapshot for three
# months, so no pack becomes unused before Glacier IR's 90-day minimum; after
# that one snapshot per month is kept for two years. Talks to S3 only, so it
# needs no app volume and no affinity.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-prune
  namespace: paperless
spec:
  schedule: "30 12 1 * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: paperless-prune
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.0
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  restic forget \
                    --host paperless \
                    --keep-within 3m \
                    --keep-monthly 24 \
                    --prune

                  restic check --with-cache
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/paperless/media
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: TMPDIR
                  value: /cache
              envFrom:
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
