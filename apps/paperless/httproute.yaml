# archive.lilalala.com -> Paperless.
#
# The old file for this was named `seafile-ingress.yaml` inside the paperless
# directory -- a copy-paste leftover that made the repo hard to navigate.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperless
  namespace: paperless
spec:
  # group/kind/weight and the catch-all match are the API server's defaults,
  # spelled out so that Argo CD's diff sees no drift.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - archive.lilalala.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: paperless
          port: 8000
          weight: 1
      timeouts:
        request: 0s
