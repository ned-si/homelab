# Ported byte-for-byte in spec from the running cluster (legacy tree at the
# all-apps pin), ADR 0002. Differences from live, all intended:
#   - inline credentials replaced by secretKeyRef to SOPS Secrets with the same
#     value (per-key sha256 checked), which restarts the pod once on adoption;
#   - PVCs carry argocd.argoproj.io/sync-options: Delete=false,Prune=false.
# Hardening (probes, security contexts, resources, image digests) is a later,
# separate change: docs/roadmap.md.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: valkey
  name: valkey
  namespace: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
    spec:
      containers:
        - name: valkey
          # renovate: datasource=docker depName=valkey/valkey
          image: valkey/valkey:8.1.10
          ports:
            - containerPort: 6379
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: valkey
  name: valkey
  namespace: paperless
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app.kubernetes.io/name: valkey
