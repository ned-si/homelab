# Paperless configuration as code (config/apply.py, config/paperless.json;
# .kiro/specs/paperless-documents/design.md "Configuration as code").
#
# paperless-apply, a PostSync hook, upserts groups, types, tags, fields, views
# and workflows and puts the accounts in `paperless-config` into `editors` and
# `readers`. A refused configuration fails the sync, so auto-rollback reverts
# it; apply.py waits up to 10 minutes for /api/ and retries 5xx.
# paperless-apply-nightly adds `--nightly`: `Retain until` and the `readers`
# view permissions.
#
# Both use the `automation` user's token (`paperless-automation`,
# docs/secrets.md). The Secrets are optional volumes: on a first deploy they
# appear once `secrets-apps` syncs, and apply.py waits for them.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: paperless-apply
  labels:
    app.kubernetes.io/name: paperless-apply
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  # 10 minutes of waiting for the token and /api/, then the writes.
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-apply
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apply
          # renovate: datasource=docker depName=python
          image: python:3.15.2-alpine3.24@sha256:2b4b04f31a4a009c1fadf7ce9338471f288488199cf43dcd1af71f244ea550aa
          command: ["python3", "-u", "/app/apply.py", "--config", "/app/paperless.json"]
          env:
            - name: PAPERLESS_API_URL
              value: http://paperless:8000
            - name: PAPERLESS_API_TOKEN_FILE
              value: /secret/PAPERLESS_API_TOKEN
            - name: PAPERLESS_MEMBERS_FILE
              value: /members/config.json
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: token
              mountPath: /secret
              readOnly: true
            - name: members
              mountPath: /members
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: paperless-apply
        - name: token
          secret:
            secretName: paperless-automation
            optional: true
        - name: members
          secret:
            secretName: paperless-config
            optional: true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-apply-nightly
  labels:
    app.kubernetes.io/name: paperless-apply-nightly
spec:
  # 04:40 UTC: after the 02:30 backup, so a night's recomputation is in the
  # next backup; the dates are right by the morning.
  schedule: "40 4 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: paperless-apply-nightly
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: apply
              # renovate: datasource=docker depName=python
              image: python:3.15.2-alpine3.24@sha256:2b4b04f31a4a009c1fadf7ce9338471f288488199cf43dcd1af71f244ea550aa
              command: ["python3", "-u", "/app/apply.py", "--config", "/app/paperless.json", "--nightly"]
              env:
                - name: PAPERLESS_API_URL
                  value: http://paperless:8000
                - name: PAPERLESS_API_TOKEN_FILE
                  value: /secret/PAPERLESS_API_TOKEN
                - name: PAPERLESS_MEMBERS_FILE
                  value: /members/config.json
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: app
                  mountPath: /app
                  readOnly: true
                - name: token
                  mountPath: /secret
                  readOnly: true
                - name: members
                  mountPath: /members
                  readOnly: true
          volumes:
            - name: app
              configMap:
                name: paperless-apply
            - name: token
              secret:
                secretName: paperless-automation
            - name: members
              secret:
                secretName: paperless-config
