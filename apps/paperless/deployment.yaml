---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
  labels:
    app.kubernetes.io/name: paperless
spec:
  replicas: 1
  strategy:
    rollingUpdate: null
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless
    spec:
      automountServiceAccountToken: false
      # Rootless as upstream documents it (docs/setup.md, "Rootless"): the
      # image's paperless user, which owns every file on the four volumes.
      # Not with PAPERLESS_OCR_LANGUAGES (installs packages at start).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paperless
          # renovate: datasource=docker depName=ghcr.io/paperless-ngx/paperless-ngx
          image: ghcr.io/paperless-ngx/paperless-ngx:3.4.2@sha256:d704e84f88300eb6ab001ab15720a2330ff99169cf9f94d6b8fcc44b63a84c84
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: PAPERLESS_REDIS
              value: "redis://valkey.paperless.svc.cluster.local:6379"
            - name: PAPERLESS_DATA_DIR
              value: "/data/data"
            - name: PAPERLESS_MEDIA_ROOT
              value: "/data/media"
            - name: PAPERLESS_CONSUMPTION_DIR
              value: "/data/consume"
            # Most frequent first: Tesseract treats the first as primary.
            # All four ship in the image. Spec paperless-documents, task 1.
            - name: PAPERLESS_OCR_LANGUAGE
              value: "fra+eng+spa+deu"
            - name: PAPERLESS_TIME_ZONE
              value: "Europe/Zurich"
            - name: PAPERLESS_DATE_ORDER
              value: "DMY"
            # Changing it renames files on the next edit; existing files are
            # renamed with `manage.py document_renamer`.
            - name: PAPERLESS_FILENAME_FORMAT
              value: "{{ created_year }}/{{ document_type }}/{{ created }} {{ correspondent }} {{ title }}"
            - name: PAPERLESS_ADMIN_USER
              value: "nedsi-admin"
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_ADMIN_PASSWORD
            # Signs sessions and tokens. Unset, Django falls back to a
            # well-known default key.
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_SECRET_KEY
            - name: PAPERLESS_URL
              value: "https://archive.lilalala.com"
            - name: PAPERLESS_BIND_ADDR
              value: "0.0.0.0"
            - name: PAPERLESS_PORT
              value: "8000"
            - name: PAPERLESS_APPS
              value: "allauth.socialaccount.providers.openid_connect"
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_SOCIALACCOUNT_PROVIDERS
            - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
              value: "true"
            - name: PAPERLESS_REDIRECT_LOGIN_TO_SSO
              value: "true"
            # Session cookie lifetime in seconds: one year (default 21 days).
            # Log in once per device; see docs/architecture.md "Sessions".
            - name: PAPERLESS_SESSION_COOKIE_AGE
              value: "31536000"
            # No mail import (web upload only): drop the 10-minute Mail Fetch task.
            - name: PAPERLESS_EMAIL_TASK_CRON
              value: "disable"
          # Measured 2026-11-04 with fra+eng+spa+deu: idle 590Mi, peak
          # working set 715Mi for one page, 1165Mi for ten (PR of task 1).
          resources:
            requests:
              memory: "1280Mi"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # Ready = answers on the endpoint the PostSync smoke test checks.
          readinessProbe:
            httpGet:
              path: /accounts/login/
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # The login page reads the database, so liveness and startup only
          # check the port. Migrations run before the server binds it.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - mountPath: "/data/data"
              name: paperless-data
            - mountPath: "/data/media"
              name: paperless-media
            - mountPath: "/data/consume"
              name: paperless-consume
            # Written by the nightly export in backup.yaml, which runs as
            # 1000 like this container; its files are already 1000:1000.
            - mountPath: "/usr/src/paperless/export"
              name: paperless-export
      volumes:
        - name: paperless-data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: paperless-media
          persistentVolumeClaim:
            claimName: paperless-media
        - name: paperless-consume
          persistentVolumeClaim:
            claimName: paperless-consume
        - name: paperless-export
          persistentVolumeClaim:
            claimName: paperless-export
