# Ported byte-for-byte in spec from the running cluster (legacy tree at the
# all-apps pin), ADR 0002. Differences from live, all intended:
#   - inline credentials replaced by secretKeyRef to SOPS Secrets with the same
#     value (per-key sha256 checked), which restarts the pod once on adoption;
#   - PVCs carry argocd.argoproj.io/sync-options: Delete=false,Prune=false.
# Hardening (probes, security contexts, resources, image digests) is a later,
# separate change: docs/roadmap.md.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
  namespace: paperless
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  # The existing zvol (infrastructure/iscsi-volumes/).
  volumeName: pvc-d028eb83-d038-4e51-b74c-9e5d23b296b0
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
  storageClassName: iscsi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-media
  namespace: paperless
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  # The existing zvol (infrastructure/iscsi-volumes/).
  volumeName: pvc-acdb98bd-8656-4ed3-9d91-fd24601b04f9
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: iscsi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-consume
  namespace: paperless
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  # The existing zvol (infrastructure/iscsi-volumes/).
  volumeName: pvc-5af3ee9f-77d6-4f43-8cc6-e67dd34f4b11
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: iscsi
