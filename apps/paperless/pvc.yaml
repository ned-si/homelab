---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
  namespace: paperless
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  # The existing zvol (infrastructure/iscsi-volumes/).
  volumeName: pvc-d028eb83-d038-4e51-b74c-9e5d23b296b0
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
  storageClassName: iscsi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-media
  namespace: paperless
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  # The existing zvol (infrastructure/iscsi-volumes/).
  volumeName: pvc-acdb98bd-8656-4ed3-9d91-fd24601b04f9
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: iscsi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-consume
  namespace: paperless
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  # The existing zvol (infrastructure/iscsi-volumes/).
  volumeName: pvc-5af3ee9f-77d6-4f43-8cc6-e67dd34f4b11
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: iscsi
---
# The nightly `document_exporter` output (backup.yaml): every document in
# plain files plus manifest.json. Same size as paperless-media, which holds
# the same kinds of files.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-export
  namespace: paperless
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: iscsi-retain
