---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: website
  name: website
  namespace: website
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    # Plain HTTP from the Gateway, answered with a 301 to https.
    - name: http-redirect
      port: 8081
      targetPort: http-redirect
      protocol: TCP
  selector:
    app.kubernetes.io/name: website
