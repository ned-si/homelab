# nedsi.io (landing page), blog.nedsi.io (the blog) and www.nedsi.io, all to
# the one nginx, which picks the site by Host and answers the redirects
# (nginx.conf). Headers of Requirement 3.2 on every HTTPS response. Phase 1
# CSP: no script-src or connect-src, so both fall back to 'none' until the
# statistics script.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: website
  namespace: website
spec:
  # group/kind/weight and the catch-all match are the API server's defaults,
  # spelled out so that Argo CD's diff sees no drift.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https-nedsi
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https-nedsi-www
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https-nedsi-blog
  hostnames:
    - nedsi.io
    - www.nedsi.io
    - blog.nedsi.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Content-Security-Policy
                value: >-
                  default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self';
                  base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: X-Frame-Options
                value: "DENY"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
              - name: Cross-Origin-Opener-Policy
                value: "same-origin"
      backendRefs:
        - group: ""
          kind: Service
          name: website
          port: 8080
          weight: 1
---
# Plain HTTP: nginx's port 8081 answers 301 to the https:// URL, also for
# homelab.nedsi.io (apps/homelab-dashboard serves its HTTPS).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: website-http
  namespace: website
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: http-nedsi
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: http-nedsi-www
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: http-nedsi-blog
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: http-nedsi-homelab
  hostnames:
    - nedsi.io
    - www.nedsi.io
    - blog.nedsi.io
    - homelab.nedsi.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: website
          port: 8081
          weight: 1
