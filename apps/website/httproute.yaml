# nedsi.io -> website:8080 with the security headers of Requirement 3.2, and
# www.nedsi.io -> https://nedsi.io (301). Phase 1 CSP: no script-src or
# connect-src, so both fall back to 'none' until the statistics script.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: website
  namespace: website
spec:
  # group/kind/weight and the catch-all match are the API server's defaults,
  # spelled out so that Argo CD's diff sees no drift.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https-nedsi
  hostnames:
    - nedsi.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Content-Security-Policy
                value: >-
                  default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self';
                  base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: X-Frame-Options
                value: "DENY"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
              - name: Cross-Origin-Opener-Policy
                value: "same-origin"
      backendRefs:
        - group: ""
          kind: Service
          name: website
          port: 8080
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: website-www
  namespace: website
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https-nedsi-www
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: http-nedsi-www
  hostnames:
    - www.nedsi.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: nedsi.io
            statusCode: 301
