# Nightly figures for blog.nedsi.io/homelab/ (publisher.py): reads Prometheus
# and the public GitHub API, writes figures.json and figures.html into the
# ConfigMap website-data. The site pod only mounts the result; it holds no token and
# reaches nothing (.kiro/specs/public-website/design.md, "Public figures").
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: website-publisher
  labels:
    app.kubernetes.io/name: website-publisher
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: website-publisher
  labels:
    app.kubernetes.io/name: website-publisher
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["website-data"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: website-publisher
  labels:
    app.kubernetes.io/name: website-publisher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: website-publisher
subjects:
  - kind: ServiceAccount
    name: website-publisher
    namespace: website
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: website-publisher
  labels:
    app.kubernetes.io/name: website-publisher
spec:
  # After midnight Zurich, so `covers` (yesterday) is a finished day.
  schedule: "30 3 * * *"
  timeZone: Europe/Zurich
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: website-publisher
        spec:
          serviceAccountName: website-publisher
          # The token patches website-data and nothing else (Role above).
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: publisher
              # renovate: datasource=docker depName=python
              image: python:3.15.2-alpine3.24@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
              command: ["python3", "-u", "-B", "/app/publisher.py"]
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: app
                  mountPath: /app
                  readOnly: true
          volumes:
            - name: app
              configMap:
                name: website-publisher
