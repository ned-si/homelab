# nginx for nedsi.io, blog.nedsi.io and www.nedsi.io
# (.kiro/specs/public-website/design.md#serving). Mounted from a ConfigMap, so
# a change here needs no new image. The root file system is read-only: the pid
# and temp paths live in the /tmp emptyDir. Security headers are set at the
# HTTPRoute. The redirects are here, not at the Gateway: Cilium writes :443
# into a RequestRedirect's Location and serves no HTTPS redirect route.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # No client address, user agent, referrer or query string (Requirement 6.3).
    log_format site escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent}';
    access_log /dev/stdout site;

    server_tokens off;
    sendfile on;
    autoindex off;
    # Relative redirects (/posts -> /posts/), not http://<pod>:8080/.
    absolute_redirect off;

    # Where plain HTTP goes; www and any other name fold into the apex.
    map $host $https_host {
        blog.nedsi.io blog.nedsi.io;
        default       nedsi.io;
    }

    # The blog, also the default server (kubelet probes, the smoke's Service check).
    server {
        listen 8080 default_server;
        server_name blog.nedsi.io;
        root /usr/share/nginx/html;
        error_page 404 /404.html;

        # Only GET and HEAD (Requirement 3.3). An `if` with `return` instead of
        # limit_except + error_page 403: no other 403 can turn into a 405.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=300";
        }

        # Fingerprinted by Hugo: a change gets a new name.
        location /css/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Dashboard figures, rewritten nightly by the publisher.
        location /data/ {
            add_header Cache-Control "no-cache";
        }

        # The dashboard includes /data/figures.html (site/layouts/homelab.html);
        # a missing or empty file shows the layout's stub instead.
        location /homelab/ {
            ssi on;
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=300";
        }
    }

    # The landing page.
    server {
        listen 8080;
        server_name nedsi.io;
        root /usr/share/nginx/landing;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=300";
        }
    }

    server {
        listen 8080;
        server_name www.nedsi.io;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        return 301 https://nedsi.io$request_uri;
    }

    # Port 8081 gets the Gateway's port-80 listeners only.
    server {
        listen 8081 default_server;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        return 301 https://$https_host$request_uri;
    }
}
