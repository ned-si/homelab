---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: website
  name: website
  namespace: website
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: website
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Built by .github/workflows/site-publish.yaml; Renovate bumps the
          # digest (.kiro/specs/public-website/design.md#publishing-flow).
          # renovate: datasource=docker depName=ghcr.io/ned-si/homelab-site
          image: ghcr.io/ned-si/homelab-site:main@sha256:bd12e6c3bcd1dc5b1f70c67778c452fe885882640b1b744804db67248c3f8600
          # nginx directly: the image's entrypoint scripts edit /etc/nginx,
          # which is read-only here. The config is apps/website/nginx.conf.
          command: ["nginx", "-c", "/etc/nginx-site/nginx.conf", "-g", "daemon off;"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: http-redirect
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx
              mountPath: /etc/nginx-site
              readOnly: true
            - name: landing
              mountPath: /usr/share/nginx/landing
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx
          configMap:
            name: website-nginx
        - name: landing
          configMap:
            name: website-landing
