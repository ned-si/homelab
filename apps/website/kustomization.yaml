apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: website

# The blog at https://nedsi.io (.kiro/specs/public-website/design.md).
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml

# After every sync: the Service answers, then through the shared Gateway the
# headers on / and on a 404, the 405 and the redirects. Its own script, not
# the component's 2xx/3xx loop: it checks codes, headers and Location.
components:
  - ../../components/postsync-smoke
patches:
  - target: { kind: Job, name: postsync-smoke }
    patch: |-
      - op: replace
        path: /spec/activeDeadlineSeconds
        value: 600
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - http://website:8080/
      - op: replace
        path: /spec/template/spec/containers/0/command
        value:
          - /bin/sh
          - -c
          - |
            fail=0
            # --connect-to the Gateway Service, as in infrastructure/cilium-smoke,
            # so a WAN outage does not fail the sync.
            gw="--connect-to ::cilium-gateway-shared.gateway.svc.cluster.local:"
            headers="content-security-policy strict-transport-security x-content-type-options x-frame-options"
            headers="$headers referrer-policy permissions-policy cross-origin-opener-policy"
            # req <url> [curl options...]: sets $code and $resp (the headers).
            req() {
              url=$1
              shift
              # shellcheck disable=SC2086 # $gw splits on purpose
              resp=$(curl $gw "$@" -s -D - -o /dev/null -w 'CODE %{http_code}' --max-time 5 "$url" | tr -d '\r') || true
              code=$(printf '%s\n' "$resp" | sed -n 's/^CODE //p')
              code=${code:-000}
            }
            # expect <code> <url> [curl options...], 3 tries 5 s apart.
            expect() {
              want=$1
              shift
              for try in 1 2 3; do
                req "$@"
                [ "$code" = "$want" ] && break
                [ "$try" -lt 3 ] && sleep 5
              done
              if [ "$code" = "$want" ]; then echo "ok   $code $1"; else echo "FAIL $code (want $want) $1"; fail=1; fi
            }
            has_headers() {
              for h in $headers; do
                printf '%s\n' "$resp" | grep -qi "^$h:" || { echo "FAIL $1: no $h"; fail=1; }
              done
            }
            location() {
              got=$(printf '%s\n' "$resp" | sed -n 's/^[Ll]ocation: //p')
              [ "$got" = "$2" ] || { echo "FAIL $1: Location '$got', want '$2'"; fail=1; }
            }

            for url in "$@"; do
              code=000
              for try in 1 2 3 4 5 6; do
                code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url") || code=000
                [ "$code" = 200 ] && break
                [ "$try" -lt 6 ] && sleep 5
              done
              if [ "$code" = 200 ]; then echo "ok   $code $url"; else echo "FAIL $code $url"; fail=1; fi
            done

            # The first sync waits for the nedsi-io certificate: up to 5 minutes.
            for try in $(seq 1 30); do
              req https://nedsi.io/
              [ "$code" = 200 ] && break
              sleep 10
            done
            expect 200 https://nedsi.io/
            has_headers https://nedsi.io/
            expect 404 https://nedsi.io/does-not-exist
            has_headers https://nedsi.io/does-not-exist
            expect 405 https://nedsi.io/ -X POST
            expect 301 https://www.nedsi.io/
            location https://www.nedsi.io/ https://nedsi.io/
            expect 301 http://www.nedsi.io/
            location http://www.nedsi.io/ https://nedsi.io/
            expect 301 http://nedsi.io/
            location http://nedsi.io/ https://nedsi.io/
            exit "$fail"
          - postsync-smoke
