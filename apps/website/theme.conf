# The theme stylesheet and endpoint of a host
# (.kiro/specs/site-theme-language/design.md#nginx), included by its server
# block; the maps are in nginx.conf. These locations replace the inherited
# add_header lines on purpose: the HTTPRoute adds the security headers.
location = /theme.css {
    add_header Cache-Control "no-store";
    add_header Vary "Cookie";
    try_files /theme-$theme.css =404;
}

# merge_slashes (on) keeps $back from starting with //; anything the regex
# refuses (another theme, %5c, %0d%0a) falls to the 404 below.
location ~ "^/set-theme/(?:light|dark)(?<back>/[A-Za-z0-9._~/-]*)$" {
    add_header Set-Cookie $theme_cookie;
    add_header Cache-Control "no-store";
    return 303 $back;
}

location /set-theme/ {
    return 404;
}
