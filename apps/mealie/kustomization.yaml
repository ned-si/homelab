apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mealie

# Parity with the running cluster (ADR 0002), plus the restic backup and its
# monthly prune (backup.yaml, docs/backups.md).
resources:
  - database.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - backup.yaml
  # WAL archiving and daily base backups to S3 (Barman Cloud plugin).
  - cnpg-backup.yaml
  # Runs the database backup before every sync (presync-backup.yaml).
  - presync-backup.yaml

# After every sync: the Service answers on the health endpoint.
components:
  - ../../components/postsync-smoke
patches:
  - target: { kind: Job, name: postsync-smoke }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - http://mealie:9000/api/app/about
