# Before every sync of this Application, Argo CD runs the nightly database
# backup (mealie-backup) once and waits for it. The backup verifies its dump before
# uploading, so a failed or unverifiable backup fails the sync and nothing new
# is applied. This is what makes a database image bump safe to automerge: a
# major version upgrades the data files in place and cannot be reverted, so a
# bad one is fixed forward from this backup (docs/decisions.md).
#
# Hook objects: Argo CD recreates them on every sync (BeforeHookCreation), the
# RBAC first (wave -1).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: presync-backup
  namespace: mealie
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: presync-backup
  namespace: mealie
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["mealie-backup"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: presync-backup
  namespace: mealie
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: presync-backup
subjects:
  - kind: ServiceAccount
    name: presync-backup
    namespace: mealie
---
apiVersion: batch/v1
kind: Job
metadata:
  name: presync-backup
  namespace: mealie
  labels:
    app.kubernetes.io/name: presync-backup
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: presync-backup
    spec:
      restartPolicy: Never
      serviceAccountName: presync-backup
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # The image has no shell: one container per kubectl call, in order.
      initContainers:
        - name: clean
          # renovate: datasource=docker depName=registry.k8s.io/kubectl
          image: registry.k8s.io/kubectl:v1.32.13
          args: ["delete", "job", "presync-mealie-backup", "--ignore-not-found", "--wait=true", "--request-timeout=60s"]
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: start
          # renovate: datasource=docker depName=registry.k8s.io/kubectl
          image: registry.k8s.io/kubectl:v1.32.13
          args: ["create", "job", "presync-mealie-backup", "--from=cronjob/mealie-backup", "--request-timeout=60s"]
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: wait
          # renovate: datasource=docker depName=registry.k8s.io/kubectl
          image: registry.k8s.io/kubectl:v1.32.13
          # A failed backup never completes, so this times out and fails the
          # sync. The deadline is the slowest nightly run plus margin.
          args: ["wait", "--for=condition=complete", "job/presync-mealie-backup", "--timeout=45m"]
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
