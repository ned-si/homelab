# mealie-postgresql to S3 through the Barman Cloud plugin: WAL and a daily
# base backup, 30 days of point-in-time recovery (docs/backups.md).
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-backup
  namespace: mealie
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://ned-si-homelab-backups/cnpg
    endpointURL: https://s3.eu-central-1.amazonaws.com
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      # boto3 signs for this region; it must match the bucket.
      - name: AWS_DEFAULT_REGION
        value: eu-central-1
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mealie-postgresql-daily
  namespace: mealie
spec:
  # Six fields (seconds first), UTC. Base backups are staggered 00:00-01:00,
  # before the restic window (docs/backups.md).
  schedule: "0 20 0 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: mealie-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
