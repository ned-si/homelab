---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mealie-postgresql
  namespace: mealie
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  instances: 1
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:26d15a12723510b0b416e8aec2bc65f2da7ac9b77ef3182a0911e4b8b991420a
  storage:
    size: 5Gi
  # Created from its Barman Cloud backup; archives under a new server name
  # (CNPG refuses a non-empty path; the old one stays readable). docs/bootstrap.md
  bootstrap:
    recovery:
      source: origin
      database: app
      owner: app
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        # Webhook defaults, stated so the server-side apply diff stays clean.
        enabled: true
        isWALArchiver: false
        parameters:
          barmanObjectName: cnpg-backup
          serverName: mealie-postgresql
  # WAL archiving and base backups to S3 (cnpg-backup.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # The webhook defaults this; stating it keeps Argo CD's diff clean.
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-backup
        serverName: mealie-postgresql-t1
