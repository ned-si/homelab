---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: mealie
  name: mealie
  namespace: mealie
spec:
  replicas: 1
  strategy:
    rollingUpdate: null
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mealie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealie
    spec:
      automountServiceAccountToken: false
      # PUID:PGID. The entrypoint (docker/entry.sh) skips its root chown and
      # gosu switch when started as PUID; every file on mealie-pvc is 1000:1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mealie
          # renovate: datasource=docker depName=ghcr.io/mealie-recipes/mealie
          image: ghcr.io/mealie-recipes/mealie:v3.30.0@sha256:90f83da6f3ab0a421efc827118a556168573930105f13fa3321768f42163d784
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: ALLOW_SIGNUP
              value: "false"
            - name: TZ
              value: Europe/Zurich
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: BASE_URL
              value: "https://cook.lilalala.com"
            - name: DB_ENGINE
              value: "postgres"
            - name: mealie__LOG__DBENABLED
              value: "false"
            # Login session length in hours: one year (Mealie allows <= 9600).
            # Log in once per device; see docs/architecture.md "Sessions".
            - name: TOKEN_TIME
              value: "8760"
            - name: POSTGRES_SERVER
              valueFrom:
                secretKeyRef:
                  name: mealie-postgresql-app
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: mealie-postgresql-app
                  key: port
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mealie-postgresql-app
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-postgresql-app
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: mealie-postgresql-app
                  key: dbname
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_CONFIGURATION_URL
              value: "https://auth.lilalala.com/realms/homelab/.well-known/openid-configuration"
            - name: OIDC_CLIENT_ID
              value: mealie
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mealie-oidc
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_AUTO_REDIRECT
              value: "true"
            - name: OIDC_PROVIDER_NAME
              value: "Keycloak"
            - name: OIDC_REMEMBER_ME
              value: "true"
            # Keycloak has self-registration and email verification off, so
            # every address is set by the admin and email_verified is never
            # true for some users; without this they cannot log in (v3.21+).
            - name: OIDC_REQUIRES_EMAIL_VERIFICATION
              value: "false"
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          # Ready = answers on the endpoint the PostSync smoke test checks.
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # /api/app/about may read the database, so liveness and startup
          # only check the port. Migrations run before the server binds it.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            limits:
              memory: "1000Mi"
          volumeMounts:
            - name: mealie-data
              mountPath: /app/data
      volumes:
        - name: mealie-data
          persistentVolumeClaim:
            claimName: mealie-pvc
