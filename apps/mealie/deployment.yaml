# Mealie.
#
# WHAT CHANGED
#   - OIDC_CLIENT_SECRET was a literal string in git; it now comes from the
#     `mealie-oidc` Secret. The old value is compromised -- regenerate the client
#     secret in Keycloak. See docs/security-incident.md.
#   - image v2.4.0 -> v3.22.0. Mealie 3.x changed the OIDC flow and the data
#     layout; read the upstream release notes before syncing, and take a backup
#     of the `mealie-postgresql` cluster first.
#   - imagePullPolicy Always -> IfNotPresent, now that the tag is meaningful.
#   - dropped the stray `mealie__LOG__DBENABLED` env var, which was copied from
#     the *arr manifests and does nothing in Mealie.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mealie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealie
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: mealie
          # renovate: datasource=docker depName=ghcr.io/mealie-recipes/mealie
          image: ghcr.io/mealie-recipes/mealie:v3.22.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Zurich
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: ALLOW_SIGNUP
              value: "false"
            - name: BASE_URL
              value: https://cook.lilalala.com
            # --- database (credentials generated by CloudNativePG) ----------
            - name: DB_ENGINE
              value: postgres
            - name: POSTGRES_SERVER
              valueFrom:
                secretKeyRef:
                  name: mealie-postgresql-app
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: mealie-postgresql-app
                  key: port
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mealie-postgresql-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-postgresql-app
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: mealie-postgresql-app
                  key: dbname
            # --- OIDC ------------------------------------------------------
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_CONFIGURATION_URL
              value: https://auth.lilalala.com/realms/homelab/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              value: mealie
            - name: OIDC_AUTO_REDIRECT
              value: "true"
            - name: OIDC_PROVIDER_NAME
              value: Keycloak
            - name: OIDC_REMEMBER_ME
              value: "true"
          envFrom:
            # Supplies OIDC_CLIENT_SECRET.
            - secretRef:
                name: mealie-oidc
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
