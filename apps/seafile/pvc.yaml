# Seafile's /shared: object store, config files and logs all in one volume.
#
# Worth knowing: Seafile's actual configuration (seahub_settings.py, ccnet.conf,
# seafile.conf) lives INSIDE this volume, not in git. So Seafile is the one app
# in this cluster whose config is not under version control. That is a property
# of the upstream image, and it is a good reason to prefer Syncthing if it covers
# your use case.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seafile-data
  namespace: seafile
spec:
  storageClassName: iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
