# Ported byte-for-byte in spec from the running cluster (legacy tree at the
# all-apps pin), ADR 0002. Differences from live, all intended:
#   - inline credentials replaced by secretKeyRef to SOPS Secrets with the same
#     value (per-key sha256 checked), which restarts the pod once on adoption;
#   - PVCs carry argocd.argoproj.io/sync-options: Delete=false,Prune=false.
# Hardening (probes, security contexts, resources, image digests) is a later,
# separate change: docs/roadmap.md.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: seafile
  name: seafile
  namespace: seafile
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seafile
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seafile
    spec:
      # seahub_settings.py lives on the data volume and the image writes it
      # only on first start, so the settings below are enforced here on every
      # start. On the very first start the file does not exist yet and they
      # land on the next one.
      # - FILE_SERVER_ROOT: the URL upload and download links point at.
      # - Sessions: log in once per device. Seahub's web session defaults to
      #   1 day and "remember me" to 7 days. See docs/architecture.md "Sessions".
      initContainers:
        - name: seahub-settings
          image: seafileltd/seafile-mc:11.0-latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              f=/shared/seafile/conf/seahub_settings.py
              [ -f "$f" ] || exit 0
              [ -z "$(tail -c1 "$f")" ] || echo >> "$f"
              root='FILE_SERVER_ROOT = "https://drive.lilalala.com/seafhttp"'
              if grep -q '^FILE_SERVER_ROOT *=' "$f"; then
                sed -i "s|^FILE_SERVER_ROOT *=.*|$root|" "$f"
              else
                echo "$root" >> "$f"
              fi
              grep -n '^FILE_SERVER_ROOT' "$f"
              sed -i '/^# BEGIN sessions (managed by apps\/seafile\/deployment.yaml)$/,/^# END sessions$/d' "$f"
              cat >> "$f" <<'EOF'
              # BEGIN sessions (managed by apps/seafile/deployment.yaml)
              SESSION_COOKIE_AGE = 31536000
              LOGIN_REMEMBER_DAYS = 365
              # END sessions
              EOF
              grep -n -A3 '^# BEGIN sessions' "$f"
          volumeMounts:
            - name: seafile-data
              mountPath: /shared
      containers:
        - name: seafile
          image: seafileltd/seafile-mc:11.0-latest
          imagePullPolicy: Always
          env:
            - name: DB_HOST
              value: "mariadb"
            - name: DB_ROOT_PASSWD
              valueFrom:
                secretKeyRef:
                  name: seafile-db
                  key: root-password
            - name: TIME_ZONE
              value: "Europe/Zurich"
            - name: SEAFILE_ADMIN_EMAIL
              value: "nedsi@pm.me"
            - name: SEAFILE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-admin
                  key: SEAFILE_ADMIN_PASSWORD
            - name: SEAFILE_SERVER_LETSENCRYPT
              value: "false"
            # Read only on first start, to write SERVICE_URL, FILE_SERVER_ROOT
            # and the nginx config: a bare host name, with the scheme forced
            # to https because TLS ends at the Gateway.
            - name: SEAFILE_SERVER_HOSTNAME
              value: "drive.lilalala.com"
            - name: FORCE_HTTPS_IN_CONF
              value: "true"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            limits:
              memory: "1000Mi"
          volumeMounts:
            - name: seafile-data
              mountPath: /shared
      volumes:
        - name: seafile-data
          persistentVolumeClaim:
            claimName: seafile-pvc
