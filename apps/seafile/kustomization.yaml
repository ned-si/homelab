apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: seafile

# Seafile is decommissioned (docs/decisions.md). Only the two claims are left,
# so Argo CD prunes everything else; they carry Delete=false,Prune=false and
# keep their data on the NAS until the volumes are deleted.
resources:
  - pvc.yaml
