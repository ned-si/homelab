apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: seafile

# Parity with the running cluster (ADR 0002), plus the restic backup and its
# monthly prune (backup.yaml, docs/backups.md).
resources:
  - pvc.yaml
  - mariadb.yaml
  - memcached.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - backup.yaml
  # Runs the database backup before every sync (presync-backup.yaml).
  - presync-backup.yaml
