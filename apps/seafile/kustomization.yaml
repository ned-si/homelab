apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: seafile

resources:
  - mariadb.yaml
  - memcached.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - pvc.yaml
  # /shared (blobs + Seafile's own config, which lives only in the volume) plus
  # a consistent MariaDB dump. Both halves or neither is worth anything -- see
  # the header of backup.yaml.
  - backup.yaml
