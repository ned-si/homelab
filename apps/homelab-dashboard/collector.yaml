# The collector: every minute it reads Prometheus (GitHub on a slower
# cadence), signs the snapshot and pushes it to every web pod. No Service,
# no Kubernetes API (.kiro/specs/homelab-dashboard/design.md#collector).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-dashboard-collector
  labels:
    app.kubernetes.io/name: homelab-dashboard
    app.kubernetes.io/component: collector
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab-dashboard
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab-dashboard
        app.kubernetes.io/component: collector
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Group-readable Secret files for uid 65532, mode 0440 below.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          # renovate: datasource=docker depName=ghcr.io/ned-si/homelab-dashboard
          image: ghcr.io/ned-si/homelab-dashboard:main@sha256:62279fdaf7ebe0a0368c6a7e6d333631c582400a8a41d10a34db834885e38119
          args: ["collect"]
          env:
            - name: GOMEMLIMIT
              value: 51MiB
          ports:
            - name: metrics
              containerPort: 9464
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: push-key
              mountPath: /var/run/secrets/push
              readOnly: true
            - name: github
              mountPath: /var/run/secrets/github
              readOnly: true
      volumes:
        - name: push-key
          secret:
            secretName: homelab-dashboard-push
            defaultMode: 0440
        # Optional: without the token the collector calls GitHub anonymously
        # once an hour (design.md#sources).
        - name: github
          secret:
            secretName: homelab-dashboard-github
            optional: true
            defaultMode: 0440
