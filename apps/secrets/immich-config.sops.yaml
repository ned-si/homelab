# Immich's whole runtime configuration (the config file Immich reads from
# IMMICH_CONFIG_FILE), sealed with SOPS because it holds the OIDC client secret
# and Immich has no environment-variable indirection for it.
#
# Mounted by the immich leaf at /config (apps/immich/values.yaml,
# `server.persistence.config`). Sealed from the running cluster's chart
# ConfigMap `immich/immich-immich-config` (same bytes, per-key sha256 checked),
# so adopting the leaf changes the volume type and nothing in the file.
#
# Edit with `sops apps/secrets/immich-config.sops.yaml` (see docs/secrets.md).
# Structure without values: apps/secrets/immich-config.sops.yaml.example.
