    immich-config.yaml: ENC[AES256_GCM,data:,iv:tLI4VgJ2W727vSnBa+dfxB7ou5/O1LUV5cLozRHhg54=,tag:pTGeaNrfMuzWoKbwmuGhlg==,type:str]
