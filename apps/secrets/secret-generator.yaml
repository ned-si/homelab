# KSOPS generator for the application layer.
#
# Absent by design: every Postgres password. CloudNativePG generates those into
# `<cluster>-app` Secrets, so they never enter git in any form. Only credentials
# defined by an external system (OIDC clients, admin bootstrap, MariaDB root)
# need to be here.
---
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: apps-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./immich-config.sops.yaml
  - ./mealie-oidc.sops.yaml
  - ./paperless-secrets.sops.yaml
  - ./seafile-db.sops.yaml
  - ./seafile-admin.sops.yaml
  # The Keycloak client secret and cookie secret shared by the five oauth2-proxy
  # instances in apps/theater/sso.yaml. One file for all five because they share
  # one Keycloak client -- see the header there.
  - ./theater-sso.sops.yaml
