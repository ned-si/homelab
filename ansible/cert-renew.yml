---
# Renew the kubeadm leaf certificates on every control-plane node, one node at
# a time, and restart the static pods so they load the new certificates.
#
# kubeadm leaf certificates live one year. `kubeadm upgrade` renews them, so a
# cluster that is upgraded at least once a year never needs this. Run it when
# `kubeadm certs check-expiration` shows less than ~60 days left.
#
# What it does, per control-plane node (serial: 1):
#   1. Copies /etc/kubernetes to /root/k8s-backup-certs-<utc> (the rollback).
#   2. `kubeadm certs renew all`. This only rewrites files; nothing reloads them.
#   3. Moves every static-pod manifest (etcd, apiserver, controller-manager,
#      scheduler, kube-vip) out of /etc/kubernetes/manifests, waits until the
#      kubelet has stopped the containers, moves them back, waits until they run.
#   4. Waits until the API answers through the VIP and etcd reports every member
#      healthy before touching the next node. Quorum (2 of 3) holds throughout.
# Then it fails unless every leaf certificate on every control plane is valid
# for at least `min_valid_days`.
#
# Rollback (per node): stop the static pods as in step 3, restore
# /etc/kubernetes from the backup copy, put the manifests back.
#
# Usage (from ansible/):
#   ansible-playbook cert-renew.yml                       # all control planes
#   ansible-playbook cert-renew.yml --limit homelab-cp-1  # one node
#   ansible-playbook cert-renew.yml --tags verify          # read-only expiry check
#   ansible-playbook cert-renew.yml --tags kubeconfig -e kubeconfig_out=../kubeconfig-homelab
#
# `kubeconfig_out`, when set, refreshes the client certificate of the user
# `kubernetes-admin` in that local kubeconfig from controlplane[0]'s renewed
# admin.conf. Clusters, contexts and servers in the file are left as they are,
# so it keeps pointing at the VIP. The old file is first copied to
# `kubeconfig_backup_dir` (default ~/homelab-backups/kubeconfig).
#
# Needs on the machine running it: kubectl with a working KUBECONFIG (the
# health checks go through the VIP).

- name: Pre-flight
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tags: [always]
  tasks:
    - name: API answers through the VIP
      ansible.builtin.command: kubectl --request-timeout=10s get --raw /readyz
      changed_when: false

    - name: Every etcd member is healthy
      ansible.builtin.include_tasks: tasks/etcd-health.yml
      vars:
        etcd_pod: "etcd-{{ groups['controlplane'][0] }}"

# ---------------------------------------------------------------------------
- name: Renew and restart, one control-plane node at a time
  hosts: controlplane
  become: true
  serial: 1
  any_errors_fatal: true
  tags: [renew]
  vars:
    static_pods: [etcd, kube-apiserver, kube-controller-manager, kube-scheduler, kube-vip]
    crictl_env:
      CONTAINER_RUNTIME_ENDPOINT: unix:///run/containerd/containerd.sock
  tasks:
    - name: Timestamp
      ansible.builtin.command: date -u +%Y%m%dT%H%M%SZ
      register: ts
      changed_when: false

    - name: Back up /etc/kubernetes
      ansible.builtin.command: "cp -a /etc/kubernetes /root/k8s-backup-certs-{{ ts.stdout }}"
      changed_when: true

    - name: Renew every leaf certificate
      ansible.builtin.command: kubeadm certs renew all
      changed_when: true

    - name: Take the static-pod manifests away from the kubelet
      ansible.builtin.shell: |
        set -euo pipefail
        mkdir -p /root/manifests-restart-{{ ts.stdout }}
        mv /etc/kubernetes/manifests/*.yaml /root/manifests-restart-{{ ts.stdout }}/
      args:
        executable: /bin/bash
      changed_when: true

    - name: Wait until the kubelet has stopped them
      ansible.builtin.command: "crictl ps -q --state Running --name '^({{ static_pods | join('|') }})$'"
      environment: "{{ crictl_env }}"
      register: still_running
      until: still_running.stdout | trim == ''
      retries: 24
      delay: 5
      changed_when: false

    - name: Give the manifests back
      ansible.builtin.shell: |
        set -euo pipefail
        mv /root/manifests-restart-{{ ts.stdout }}/*.yaml /etc/kubernetes/manifests/
        rmdir /root/manifests-restart-{{ ts.stdout }}
      args:
        executable: /bin/bash
      changed_when: true

    - name: Wait until each static pod runs again
      ansible.builtin.command: "crictl ps -q --state Running --name '^{{ item }}$'"
      environment: "{{ crictl_env }}"
      register: running
      until: running.stdout | trim != ''
      retries: 36
      delay: 5
      changed_when: false
      loop: "{{ static_pods }}"

    - name: This node's API server is ready
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf --request-timeout=10s
        --server https://{{ ansible_host }}:6443 get --raw /readyz
      register: local_ready
      until: local_ready.rc == 0
      retries: 24
      delay: 5
      changed_when: false

    - name: API answers through the VIP
      delegate_to: localhost
      become: false
      ansible.builtin.command: kubectl --request-timeout=10s get --raw /readyz
      register: vip_ready
      until: vip_ready.rc == 0
      retries: 24
      delay: 5
      changed_when: false

    - name: Mirror pods are Ready
      delegate_to: localhost
      become: false
      ansible.builtin.command: >-
        kubectl --request-timeout=10s -n kube-system wait --for=condition=Ready
        --timeout=180s pod/{{ item }}-{{ inventory_hostname }}
      changed_when: false
      loop: "{{ static_pods }}"

    - name: Every etcd member is healthy
      ansible.builtin.include_tasks: tasks/etcd-health.yml
      vars:
        etcd_pod: "etcd-{{ inventory_hostname }}"

# ---------------------------------------------------------------------------
- name: Verify expiry on every control plane
  hosts: controlplane
  become: true
  gather_facts: false
  tags: [renew, verify]
  vars:
    min_valid_days: 300
  tasks:
    - name: Every leaf certificate and kubeconfig is valid for min_valid_days
      # check-expiration is for the humans; openssl -checkend is the gate. The
      # .conf files embed their client certificate as base64.
      ansible.builtin.shell: |
        set -euo pipefail
        secs=$(( {{ min_valid_days }} * 86400 ))
        bad=0
        for c in /etc/kubernetes/pki/*.crt /etc/kubernetes/pki/etcd/*.crt; do
          case "$c" in */ca.crt|*/front-proxy-ca.crt|*/etcd/ca.crt) continue ;; esac
          openssl x509 -noout -checkend "$secs" -in "$c" >/dev/null || { echo "EXPIRING $c"; bad=1; }
        done
        for f in admin super-admin controller-manager scheduler; do
          [ -f /etc/kubernetes/$f.conf ] || continue
          grep 'client-certificate-data:' /etc/kubernetes/$f.conf | awk '{print $2}' | base64 -d \
            | openssl x509 -noout -checkend "$secs" >/dev/null || { echo "EXPIRING $f.conf"; bad=1; }
        done
        kubeadm certs check-expiration 2>/dev/null | grep -v '^\['
        exit "$bad"
      args:
        executable: /bin/bash
      register: expiry
      changed_when: false

    - name: Show expiry
      ansible.builtin.debug:
        var: expiry.stdout_lines

# ---------------------------------------------------------------------------
- name: Refresh the local kubeconfig
  hosts: controlplane[0]
  become: true
  gather_facts: false
  tags: [renew, kubeconfig]
  vars:
    kubeconfig_backup_dir: "{{ lookup('env', 'HOME') }}/homelab-backups/kubeconfig"
  tasks:
    - name: Read the renewed admin.conf
      when: kubeconfig_out is defined
      ansible.builtin.slurp:
        src: /etc/kubernetes/admin.conf
      register: admin_conf
      no_log: true

    - name: Replace the client certificate, keep clusters and contexts
      when: kubeconfig_out is defined
      delegate_to: localhost
      become: false
      no_log: true
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        out={{ kubeconfig_out | quote }}
        bak={{ kubeconfig_backup_dir | quote }}
        ts=$(date -u +%Y%m%dT%H%M%SZ)
        mkdir -p "$bak"
        cp -p "$out" "$bak/$(basename "$out").bak-$ts"
        d=$(mktemp -d)
        trap 'rm -rf "$d"' EXIT
        printf '%s' "$ADMIN_CONF" | base64 -d > "$d/admin.conf"
        yq -r '.users[0].user.client-certificate-data' "$d/admin.conf" | base64 -d > "$d/crt"
        yq -r '.users[0].user.client-key-data' "$d/admin.conf" | base64 -d > "$d/key"
        kubectl --kubeconfig "$out" config set-credentials kubernetes-admin \
          --embed-certs --client-certificate="$d/crt" --client-key="$d/key" >/dev/null
        KUBECONFIG="$out" kubectl --request-timeout=10s get --raw /readyz
      args:
        executable: /bin/bash
      environment:
        ADMIN_CONF: "{{ admin_conf.content }}"
      changed_when: true
