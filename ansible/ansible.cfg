[defaults]
inventory = inventory.yml
host_key_checking = True
retry_files_enabled = False
stdout_callback = yaml
# Show which task is running on which host; upgrades are long and it matters.
display_skipped_hosts = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# Long-running apt and kubeadm steps must not be cut off.
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30
