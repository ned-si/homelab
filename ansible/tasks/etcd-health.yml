---
# Included by cert-renew.yml. Passes when `etcdctl endpoint health --cluster`,
# run inside pod `etcd_pod`, reports every member of the control-plane group
# healthy. Runs kubectl on the machine running the playbook, through the VIP.
- name: "etcd: every member healthy (via {{ etcd_pod }})"
  delegate_to: localhost
  become: false
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl --request-timeout=10s -n kube-system exec {{ etcd_pod | quote }} -- \
      etcdctl --endpoints=https://127.0.0.1:2379 \
      --cacert=/etc/kubernetes/pki/etcd/ca.crt \
      --cert=/etc/kubernetes/pki/etcd/healthcheck-client.crt \
      --key=/etc/kubernetes/pki/etcd/healthcheck-client.key \
      endpoint health --cluster -w json \
      | jq -e --argjson n {{ groups['controlplane'] | length }} '[.[] | select(.health == true)] | length == $n'
  args:
    executable: /bin/bash
  register: etcd_health
  until: etcd_health.rc == 0
  retries: 24
  delay: 5
  changed_when: false
