# Root Application of the layered tree. Applied once by hand at bootstrap;
# Argo CD creates every other Application from it:
#
#   kubectl apply -f bootstrap/root-app.yaml
#
# The same object as clusters/homelab/root.yaml (CI: repo_policy.py
# root-profiles fails if they differ); that file describes the tree and its
# prune policy. It tracks `main`: whatever is merged to main is what runs, and
# a rollback is a revert pull request.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argo
spec:
  project: default
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: main
    path: deploy/clusters/homelab/bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
