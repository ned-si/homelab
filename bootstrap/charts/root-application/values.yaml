# All overridden by the OpenTofu `helm_release`. Defaults are here so
# `helm template` works standalone for debugging, and they match
# clusters/homelab/root.yaml so a standalone render is the object the cluster
# should already have.
repoURL: https://github.com/ned-si/homelab.git
# The tag CD moves. See clusters/homelab/root.yaml and bootstrap/variables.tf.
targetRevision: deployed
namespace: argo
path: deploy/clusters/homelab/bootstrap
