# Helm values for the `argocd` release (namespace `argo`), chart argo-cd 10.2.2
# (Argo CD v3.4.6). The release is managed with the helm CLI, not by an Argo
# CD Application, so merging a change here has no live effect on its own.
#
# Apply only from a CI-green commit on main, never from a working tree:
#   git show <sha>:bootstrap/argocd-values.yaml > /tmp/hv.yaml   (mode 600)
#   helm upgrade argocd argo/argo-cd --version <ci/helm-releases.yaml> \
#     -n argo -f /tmp/hv.yaml --wait --timeout 10m
# No --set, no --reuse-values: this file is the whole configuration.
#
# Every key of the live argocd-cm, argocd-rbac-cm and argocd-cmd-params-cm
# is reproduced below, including the argocd-cm keys that were set outside
# Helm (url, oidc.config and the timeouts). Without them a chart upgrade
# would drop the Keycloak login.
#
# No secret value lives here. oidc.config refers to the key
# `oidc.keycloak.clientSecret` of argocd-secret, which Argo CD resolves at
# runtime. configs.secret.createSecret stays true: with false, Helm would
# delete argocd-secret on upgrade.

global:
  domain: argo.lilalala.com

configs:
  cm:
    url: https://argo.lilalala.com
    admin.enabled: true
    exec.enabled: false
    application.instanceLabelKey: argocd.argoproj.io/instance
    # Pinned: Argo CD 3.0 changes the default to annotation tracking.
    application.resourceTrackingMethod: label
    timeout.reconciliation: 180s
    timeout.hard.reconciliation: 0s
    # KSOPS is a kustomize exec plugin. Only the three */secrets directories
    # are built by kustomize on the repo-server; everything else is
    # pre-rendered under deploy/ or a helm chart (scripts/render-deploy.sh).
    kustomize.buildOptions: --enable-alpha-plugins --enable-exec
    oidc.config: |
      name: Keycloak
      issuer: https://auth.lilalala.com/realms/homelab
      clientID: argocd
      clientSecret: $oidc.keycloak.clientSecret
      # Log in once per device: Argo CD renews the 5-minute Keycloak token
      # with the offline token (365 d idle, no maximum) 2 minutes before it
      # expires, instead of logging the UI out.
      refreshTokenThreshold: 2m
      requestedScopes: ["openid", "profile", "email", "groups", "offline_access"]

  rbac:
    policy.default: ""
    policy.csv: |
      g, ArgoCDAdmins, role:admin
    scopes: "[groups]"

  params:
    application.namespaces: ""
    applicationsetcontroller.enable.leader.election: false
    applicationsetcontroller.enable.progressive.syncs: false
    applicationsetcontroller.log.format: text
    applicationsetcontroller.log.level: info
    applicationsetcontroller.policy: sync
    controller.log.format: text
    controller.log.level: info
    controller.operation.processors: 10
    controller.repo.server.timeout.seconds: 60
    controller.self.heal.timeout.seconds: 5
    controller.status.processors: 20
    otlp.address: ""
    redis.server: argocd-redis:6379
    repo.server: argocd-repo-server:8081
    reposerver.log.format: text
    reposerver.log.level: info
    reposerver.parallelism.limit: 0
    server.basehref: /
    server.dex.server: https://argocd-dex-server:5556
    server.dex.server.strict.tls: false
    server.disable.auth: false
    server.enable.gzip: true
    # TLS ends at the edge (the shared Gateway); argocd-server serves plain
    # HTTP on the Service's port 80, which the HTTPRoute
    # (infrastructure/gateway/argocd-route.yaml) targets.
    server.insecure: true
    server.log.format: text
    server.log.level: info
    server.repo.server.strict.tls: false
    server.rootpath: ""
    server.staticassets: /shared/app
    server.x.frame.options: sameorigin

  secret:
    createSecret: true

dex:
  enabled: true

# Argo CD Notifications reports a failed sync or a Degraded Application to
# GitHub as a `repository_dispatch` (event type `argo-degraded`), which runs
# .github/workflows/auto-rollback.yaml. Every Application is subscribed
# (`subscriptions`), so no Application needs an annotation.
#
# The token is the key `github-token` of the Secret
# argocd-notifications-github, sealed in
# platform/secrets/argocd-notifications.sops.yaml and synced by the
# `secrets-platform` Application. The chart therefore creates no Secret of its
# own (`secret.create: false`) and points the controller at that one
# (`secret.name`, passed as --secret-name). Until a real token is sealed the
# key holds a PENDING sentinel: GitHub answers 401 and nothing is dispatched.
#
# The payload carries the revision of the Application's last sync operation
# (`syncResult`, else the requested `operation.sync`), single- or
# multi-source, so the workflow sees the commit that deployed the failing
# change rather than the newest commit on main. Chart versions in a
# multi-source revision list are ignored by the workflow. `oncePer` on the
# same fields sends one dispatch per Application and revision.
notifications:
  enabled: true
  secret:
    create: false
    name: argocd-notifications-github
  notifiers:
    service.webhook.github-dispatch: |
      url: https://api.github.com
      headers:
        - name: Accept
          value: application/vnd.github+json
        - name: Content-Type
          value: application/json
        - name: X-GitHub-Api-Version
          value: "2022-11-28"
        - name: Authorization
          value: Bearer $github-token
  subscriptions:
    - recipients:
        - github-dispatch
      triggers:
        - on-sync-failed
        - on-health-degraded
  triggers:
    trigger.on-sync-failed: |
      - description: The sync operation failed or errored.
        when: app.status?.operationState?.phase in ['Error', 'Failed']
        oncePer: >-
          [app.status?.operationState?.syncResult?.revision,
          app.status?.operationState?.syncResult?.revisions,
          app.status?.operationState?.operation?.sync?.revision,
          app.status?.operationState?.operation?.sync?.revisions]
        send:
          - argo-degraded-sync-failed
    trigger.on-health-degraded: |
      - description: The Application's health is Degraded.
        when: app.status?.health?.status == 'Degraded'
        oncePer: >-
          [app.status?.operationState?.syncResult?.revision,
          app.status?.operationState?.syncResult?.revisions,
          app.status?.operationState?.operation?.sync?.revision,
          app.status?.operationState?.operation?.sync?.revisions]
        send:
          - argo-degraded-health
  # `{{-` trims the line break before it, so "revision" is one line of
  # space-separated revisions.
  templates:
    template.argo-degraded-sync-failed: |
      webhook:
        github-dispatch:
          method: POST
          path: /repos/ned-si/homelab/dispatches
          body: |
            {"event_type": "argo-degraded", "client_payload": {
            "app": "{{ .app.metadata.name }}", "trigger": "on-sync-failed", "revision": "
            {{- with .app.status.operationState }}
            {{- with .syncResult }}{{ with .revision }}{{ . }} {{ end }}{{ range .revisions }}{{ . }} {{ end }}{{ end }}
            {{- with .operation }}{{ with .sync }}{{ with .revision }}{{ . }} {{ end }}{{ range .revisions }}{{ . }} {{ end }}{{ end }}{{ end }}
            {{- end }}"}}
    template.argo-degraded-health: |
      webhook:
        github-dispatch:
          method: POST
          path: /repos/ned-si/homelab/dispatches
          body: |
            {"event_type": "argo-degraded", "client_payload": {
            "app": "{{ .app.metadata.name }}", "trigger": "on-health-degraded", "revision": "
            {{- with .app.status.operationState }}
            {{- with .syncResult }}{{ with .revision }}{{ . }} {{ end }}{{ range .revisions }}{{ . }} {{ end }}{{ end }}
            {{- with .operation }}{{ with .sync }}{{ with .revision }}{{ . }} {{ end }}{{ range .revisions }}{{ . }} {{ end }}{{ end }}{{ end }}
            {{- end }}"}}

# KSOPS on the repo-server: an init container copies the ksops binary into an
# emptyDir that is mounted on PATH; Argo CD's bundled kustomize (v5.4.3) runs
# it as a KRM exec function. The age identity comes from the Secret
# `sops-age` (key `keys.txt`), which is created at bootstrap from the
# operator's key and never stored in git (docs/bootstrap.md).
repoServer:
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /sops-age/keys.txt
  initContainers:
    - name: install-ksops
      # renovate: datasource=docker depName=viaductoss/ksops
      image: viaductoss/ksops:v4.5.1@sha256:4def9fdd4e2f850265740ebe9592c5455d19b76891e88e602df8b52d74b95334
      command: ["/usr/local/bin/ksops", "install", "/custom-tools"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age
        # Files are root-owned and the pod sets no fsGroup; the repo-server
        # runs as uid 999, so the key must be readable by others.
        defaultMode: 0444
  volumeMounts:
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /sops-age
      name: sops-age
      readOnly: true

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
