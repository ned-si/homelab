# Values for the `argocd` release (namespace `argo`). The bootstrap installs it
# with the helm CLI and this file (docs/bootstrap.md); the Application
# clusters/homelab/infrastructure/argocd.yaml adopts it, so a merge here rolls
# Argo CD. This file is the whole configuration: no --set, no --reuse-values.
#
# oidc.config reads `clientSecret` from the Secret argocd-oidc-keycloak, not
# from argocd-secret, which the chart owns and rewrites on upgrade.
# configs.secret.createSecret stays true: with false, Helm deletes
# argocd-secret on upgrade.

global:
  domain: argo.lilalala.com
  # No chart NetworkPolicies: argocd-server's allowed ingress from anywhere.
  # infrastructure/network-policies/87-platform-ingress.yaml (allow-list) and
  # the argo switch in 90-enforcement.yaml police the namespace instead.
  networkPolicy:
    create: false

configs:
  cm:
    url: https://argo.lilalala.com
    # No local admin: login is Keycloak SSO (groups admins and ArgoCDAdmins).
    # Break-glass is the Keycloak master-realm admin, or kubectl with
    # `argocd --core`.
    admin.enabled: false
    exec.enabled: false
    application.instanceLabelKey: argocd.argoproj.io/instance
    # Pinned: Argo CD 3.0 changes the default to annotation tracking.
    application.resourceTrackingMethod: label
    timeout.reconciliation: 180s
    timeout.hard.reconciliation: 0s
    # KSOPS is a kustomize exec plugin. Only the three */secrets directories
    # are built by kustomize on the repo-server; everything else is
    # pre-rendered under deploy/ or a helm chart (scripts/render-deploy.sh).
    kustomize.buildOptions: --enable-alpha-plugins --enable-exec
    oidc.config: |
      name: Keycloak
      issuer: https://auth.lilalala.com/realms/homelab
      clientID: argocd
      clientSecret: $argocd-oidc-keycloak:clientSecret
      requestedScopes: ["openid", "profile", "email", "groups"]
    # Read-only API account for automation (MCP servers, agents): API tokens
    # only, no UI login, bound to role:readonly below. Its token lives outside
    # the repository (docs/secrets.md).
    accounts.agent: apiKey
    # Replaces the built-in DeletingPolicy check, which waits for
    # status.conditionStatus.ready; Kyverno's cleanup controller sets only
    # lastExecutionTime (#1039). An explicit ready: false is still Degraded.
    resource.customizations.health.policies.kyverno.io_DeletingPolicy: |
      local hs = {}
      local cs = obj.status ~= nil and obj.status.conditionStatus or nil
      if cs ~= nil and cs.ready == false then
        hs.status = "Degraded"
        hs.message = (cs.message ~= nil and cs.message ~= "") and cs.message or "Policy is not ready"
        if cs.conditions ~= nil then
          for _, c in ipairs(cs.conditions) do
            if c.status == "False" then
              hs.message = c.type .. ": " .. c.message
              break
            end
          end
        end
        return hs
      end
      if cs ~= nil and cs.ready == true then
        hs.status = "Healthy"
        hs.message = "Policy is ready"
        return hs
      end
      if obj.status ~= nil and obj.status.lastExecutionTime ~= nil then
        hs.status = "Healthy"
        hs.message = "Last run " .. obj.status.lastExecutionTime
        return hs
      end
      -- Healthy, not Progressing: a new policy first runs up to an hour
      -- later, and a sync must not wait for that.
      hs.status = "Healthy"
      hs.message = "Waiting for the first scheduled run"
      return hs

  rbac:
    policy.default: ""
    policy.csv: |
      g, admins, role:admin
      g, ArgoCDAdmins, role:admin
      g, agent, role:readonly
    scopes: "[groups]"

  params:
    application.namespaces: ""
    applicationsetcontroller.enable.leader.election: false
    applicationsetcontroller.enable.progressive.syncs: false
    applicationsetcontroller.log.format: text
    applicationsetcontroller.log.level: info
    applicationsetcontroller.policy: sync
    controller.log.format: text
    controller.log.level: info
    controller.operation.processors: 10
    controller.repo.server.timeout.seconds: 60
    controller.self.heal.timeout.seconds: 5
    controller.status.processors: 20
    otlp.address: ""
    redis.server: argocd-redis:6379
    repo.server: argocd-repo-server:8081
    reposerver.log.format: text
    reposerver.log.level: info
    reposerver.parallelism.limit: 0
    server.basehref: /
    server.disable.auth: false
    server.enable.gzip: true
    # TLS ends at the edge (the shared Gateway); argocd-server serves plain
    # HTTP on the Service's port 80, which the HTTPRoute
    # (infrastructure/gateway/argocd-route.yaml) targets.
    server.insecure: true
    server.log.format: text
    server.log.level: info
    server.repo.server.strict.tls: false
    server.rootpath: ""
    server.staticassets: /shared/app
    server.x.frame.options: sameorigin

  secret:
    createSecret: true

# No Dex: argocd-server talks to Keycloak directly through oidc.config, and
# argocd-cm has no dex.config, so a Dex server would serve nothing. With Dex
# off the chart also leaves server.dex.server out of argocd-cmd-params-cm.
dex:
  enabled: false

# Argo CD Notifications sends a failed sync or a Degraded Application to GitHub
# as a `repository_dispatch` (`argo-degraded`), which runs
# .github/workflows/auto-rollback.yaml. Every Application is subscribed. The
# token is `github-token` in the Secret argocd-notifications-github
# (`secret.create: false`, `secret.name`).
#
# The payload carries the revision of the last sync operation, so the workflow
# sees the commit that deployed the failing change; `oncePer` sends one
# dispatch per Application and revision.
notifications:
  enabled: true
  secret:
    create: false
    name: argocd-notifications-github
  notifiers:
    service.webhook.github-dispatch: |
      url: https://api.github.com
      headers:
        - name: Accept
          value: application/vnd.github+json
        - name: Content-Type
          value: application/json
        - name: X-GitHub-Api-Version
          value: "2022-11-28"
        - name: Authorization
          value: Bearer $github-token
  subscriptions:
    - recipients:
        - github-dispatch
      triggers:
        - on-sync-failed
        - on-health-degraded
  triggers:
    trigger.on-sync-failed: |
      - description: The sync operation failed or errored.
        when: app.status?.operationState?.phase in ['Error', 'Failed']
        oncePer: >-
          [app.status?.operationState?.syncResult?.revision,
          app.status?.operationState?.syncResult?.revisions,
          app.status?.operationState?.operation?.sync?.revision,
          app.status?.operationState?.operation?.sync?.revisions]
        send:
          - argo-degraded-sync-failed
    trigger.on-health-degraded: |
      # Degraded for 5 minutes, as ArgoCDAppDegraded: a single-replica
      # StatefulSet restarting (Prometheus replaying its WAL) is Degraded
      # for about a minute and is not a bad merge. The controller
      # re-evaluates on every app refresh (3 min), so a real failure
      # still dispatches within 8 minutes of turning Degraded.
      # Only if it turned Degraded after the last sync started: an app that
      # was already Degraded is not broken by the new revision, which may be
      # the fix (#1208 was auto-reverted by #1210).
      - description: The Application's health turned Degraded after the last sync and has stayed so for 5 minutes.
        when: >-
          app.status?.health?.status == 'Degraded' &&
          app.status?.operationState?.startedAt != nil &&
          time.Parse(app.status.health.lastTransitionTime).After(time.Parse(app.status.operationState.startedAt)) &&
          time.Now().Sub(time.Parse(app.status.health.lastTransitionTime)).Minutes() >= 5
        oncePer: >-
          [app.status?.operationState?.syncResult?.revision,
          app.status?.operationState?.syncResult?.revisions,
          app.status?.operationState?.operation?.sync?.revision,
          app.status?.operationState?.operation?.sync?.revisions]
        send:
          - argo-degraded-health
  # `{{-` trims the line break before it, so "revision" is one line of
  # space-separated revisions.
  templates:
    template.argo-degraded-sync-failed: |
      webhook:
        github-dispatch:
          method: POST
          path: /repos/ned-si/homelab/dispatches
          body: |
            {"event_type": "argo-degraded", "client_payload": {
            "app": "{{ .app.metadata.name }}", "trigger": "on-sync-failed", "revision": "
            {{- with .app.status.operationState }}
            {{- with .syncResult }}{{ with .revision }}{{ . }} {{ end }}{{ range .revisions }}{{ . }} {{ end }}{{ end }}
            {{- with .operation }}{{ with .sync }}{{ with .revision }}{{ . }} {{ end }}{{ range .revisions }}{{ . }} {{ end }}{{ end }}{{ end }}
            {{- end }}"}}
    template.argo-degraded-health: |
      webhook:
        github-dispatch:
          method: POST
          path: /repos/ned-si/homelab/dispatches
          body: |
            {"event_type": "argo-degraded", "client_payload": {
            "app": "{{ .app.metadata.name }}", "trigger": "on-health-degraded", "revision": "
            {{- with .app.status.operationState }}
            {{- with .syncResult }}{{ with .revision }}{{ . }} {{ end }}{{ range .revisions }}{{ . }} {{ end }}{{ end }}
            {{- with .operation }}{{ with .sync }}{{ with .revision }}{{ . }} {{ end }}{{ range .revisions }}{{ . }} {{ end }}{{ end }}{{ end }}
            {{- end }}"}}

# KSOPS on the repo-server: an init container copies the ksops binary onto
# PATH, and the bundled kustomize runs it as a KRM exec function. The age
# identity is the Secret `sops-age`, created at bootstrap, never in git.
repoServer:
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /sops-age/keys.txt
  initContainers:
    - name: install-ksops
      # renovate: datasource=docker depName=viaductoss/ksops
      image: viaductoss/ksops:v4.5.1@sha256:4def9fdd4e2f850265740ebe9592c5455d19b76891e88e602df8b52d74b95334
      command: ["/usr/local/bin/ksops", "install", "/custom-tools"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age
        # Files are root-owned and the pod sets no fsGroup; the repo-server
        # runs as uid 999, so the key must be readable by others.
        defaultMode: 0444
  volumeMounts:
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /sops-age
      name: sops-age
      readOnly: true

# The `release` label is what the kube-prometheus-stack Prometheus selects
# ServiceMonitors by; without it the Argo CD alerts
# (platform/kube-prometheus-stack/routes/argocd-alerts.yaml) have no data.
controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
