# The blog at https://blog.nedsi.io (.kiro/specs/public-website/design.md).
baseURL = "https://blog.nedsi.io/"
title = "nedsi"
# English at today's URLs, French under /fr/
# (.kiro/specs/site-theme-language/design.md#blog).
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disableDefaultLanguageRedirect = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableRobotsTXT = true
refLinksErrorLevel = "ERROR"
disableKinds = ["section"]

[params]
author = "nedsi"
[languages.en]
locale = "en-GB"
label = "English"
weight = 1
title = "nedsi"
[languages.en.params]
description = "How an over-engineered homelab is built and run."
[languages.fr]
locale = "fr-CH"
label = "Français"
weight = 2
title = "nedsi"
[languages.fr.params]
description = "Comment un homelab bien trop sophistiqué est construit et exploité."

[taxonomies]
tag = "tags"

# One feed per language, /index.xml and /fr/index.xml, with the full content
# of every article.
[outputs]
home = ["html", "rss"]
taxonomy = ["html"]
term = ["html"]

[services.rss]
limit = -1

[markup.goldmark.renderer]
unsafe = false

# Classes, not inline styles: the CSP allows no style attribute.
[markup.highlight]
noClasses = false


[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "LICENSE"
target = "static/LICENSE.txt"
