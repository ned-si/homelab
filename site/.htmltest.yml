---
# htmltest for scripts/ci/site-check.sh: internal links, anchors and images,
# offline. The directory comes from the command line.
CheckExternal: false
CheckFavicon: false
IgnoreAltMissing: false
EnforceHTTPS: false
# The theme endpoint is nginx's (apps/website/theme.conf), not a file;
# scripts/ci/site-serve-check.sh tests it.
IgnoreURLs:
  - "^/set-theme/"
