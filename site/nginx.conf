# nginx for the blog (.kiro/specs/public-website/design.md#serving). The root
# file system is read-only: the pid and temp paths live in the /tmp emptyDir.
# Security headers are set at the HTTPRoute.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # No client address, user agent, referrer or query string (Requirement 6.3).
    log_format site escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent}';
    access_log /dev/stdout site;

    server_tokens off;
    sendfile on;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        autoindex off;
        # Relative redirects (/posts -> /posts/), not http://<pod>:8080/.
        absolute_redirect off;
        error_page 404 /404.html;

        # Only GET and HEAD (Requirement 3.3). An `if` with `return` instead of
        # limit_except + error_page 403: no other 403 can turn into a 405.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=300";
        }

        # Fingerprinted by Hugo: a change gets a new name.
        location /css/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Dashboard figures (phase 2), rewritten by the publisher.
        location /data/ {
            add_header Cache-Control "no-cache";
        }
    }
}
