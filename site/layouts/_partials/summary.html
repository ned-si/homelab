<article class="summary">
<h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
<p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time></p>
{{- if .Params.fallback }}
<p class="note">{{ T "fallback_note" }}</p>
{{- end }}
{{ with .Params.summary }}<p{{ if $.Params.fallback }} lang="en-GB"{{ end }}>{{ . }}</p>{{ end }}
</article>
