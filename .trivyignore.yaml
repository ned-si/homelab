# Trivy config-scan waivers.
#
# Replaces the flat `.trivyignore`. Same decisions, three properties the old
# format could not express:
#
#   paths       a waiver applies to the files named and nowhere else
#   expired_at  a waiver stops working on a date, and the finding comes back
#   statement   the reason travels with the entry
#
# ---------------------------------------------------------------------------
# WHY THE FLAT FILE WAS NOT GOOD ENOUGH
#
# `.trivyignore` suppresses by rule ID, everywhere, forever. That produced a real
# defect, not a hypothetical one: the `AVD-KSV-0118` line was written for the
# linuxserver/hotio images, whose entrypoints need root. Because it had no path
# scope it ALSO silenced
#
#   platform/backup-verify/restore-postgres.yaml   -- ours, no securityContext
#                                                    at all, fixed in this PR
#   deploy/infrastructure/snapshot-controller/...  -- vendored upstream
#
# and the file's own comment said the waiver was "for images whose entrypoint
# requires root, not for new work" -- which was prose, enforced by nothing.
#
# The same shape let Bazarr add two findings of an already-waived class with CI
# unable to say so. scripts/trivy-gate.sh now catches that separately.
#
# ---------------------------------------------------------------------------
# THE RULES FOR THIS FILE
#
#   1. Every entry needs `statement` and `expired_at`.
#      scripts/trivy-waivers.sh rejects entries missing either, and rejects an
#      expiry more than 6 months out. Being unable to write a reason is the
#      signal to fix the finding instead.
#   2. Prefer `paths` over a bare id. A bare id is a claim that the finding is
#      never acceptable to fix ANYWHERE in this repository, now or later.
#   3. Both the source and its rendered copy under deploy/ must be listed. They
#      are separate findings to Trivy.
#   4. The reason must be about the control the ID actually names. An invented
#      mapping reads like a decision and silences a real finding.
#
# EXPERIMENTAL FORMAT. Trivy documents .trivyignore.yaml as experimental and may
# change it without preserving compatibility. Both callers pass `--ignorefile`
# explicitly, so a format change is a one-line fix, but a Trivy bump is the moment
# to re-read this. Verified working on 0.74.0: path scoping confirmed to leave
# non-matching files reporting, and a past `expired_at` confirmed to un-suppress.
#
# Reproduce the unfiltered list:
#     trivy config . --severity HIGH,CRITICAL --ignorefile /dev/null \
#       --skip-check-update
# ---------------------------------------------------------------------------
misconfigurations:
  # =========================================================================
  # CRITICAL -- RBAC that grants RBAC or reads Secrets
  # =========================================================================
  # The Barman Cloud plugin's per-namespace Roles (platform/barman-cloud-plugin/
  # rbac.yaml, #951). For each CNPG Cluster the plugin creates and patches a
  # Role and RoleBinding `<cluster>-barman-cloud` in the Cluster's namespace
  # (upstream internal/cnpgi/operator/rbac/ensure.go at v0.15.1), so it needs
  # create/patch/update on roles and rolebindings there. Upstream grants that
  # cluster-wide; here it is one Role in each of the six namespaces with an
  # ObjectStore. The upstream ClusterRole keeps only get/list/watch on them
  # (its cache watches every namespace) and no Secrets, so it has no finding.
  #
  # Reported by Trivy 0.70.0 (the CI pin), not by 0.76. Re-check on a Trivy
  # bump and drop the entry once it stops matching.
  - id: AVD-KSV-0050
    paths:
      - "platform/barman-cloud-plugin/rbac.yaml"
      - "deploy/platform/barman-cloud-plugin/role-plugin-barman-cloud-*.yaml"
    statement: >-
      Namespaced Roles, one per namespace with an ObjectStore. create/patch/
      update on roles and rolebindings, no delete, bind, escalate or wildcard:
      the plugin creates and updates one Role and RoleBinding per CNPG Cluster
      so the instance can read its own ObjectStore and credentials. Re-read on
      every plugin bump.
    expired_at: 2027-05-01

  # =========================================================================
  # FALSE POSITIVE -- proven
  # =========================================================================
  # The "secret" Trivy reports is the literal string `echo "PASS`, from
  # `echo "PASS: $TAG"` (restore-files.yaml:263) and
  # `echo "PASS: $SRC restored and verified"` (restore-postgres.yaml:276). The
  # check matches PASS as the start of PASSWORD. Both drills read real
  # credentials from the `s3-backup` Secret via envFrom.
  #
  # Path-scoped rather than global specifically BECAUSE it is a false positive:
  # scoped to these files, a genuine secret pasted into a ConfigMap anywhere else
  # still fails. scripts/leak-check.sh remains the control that covers these two.
  #
  # This entry originally carried a one-year expiry on the reasoning that the
  # string is not going to change meaning. scripts/trivy-waivers.sh rejected it
  # against MAX_MONTHS=6 -- correctly. "The reason will still be true later" is an
  # argument for renewing easily, not for skipping the review; a false positive
  # can also be fixed upstream, and a year is long enough for that to happen
  # without anyone noticing.
  - id: AVD-KSV-0109
    paths:
      - "deploy/platform/backup-verify/configmap-backup-verify-scripts-*.yaml"
    statement: >-
      False positive, verified by grep. The flagged values are shell lines of the
      restore-test scripts (PASS/FAIL output, the printf that writes a MariaDB
      option file from a Secret at run time). No credential is present; they
      come from Secrets at run time.
    expired_at: 2027-03-01

  # Bazarr's first-start seed script writes `password: $hash` and
  # `apikey: $API_KEY` into config.yaml. Both are shell variables filled at run
  # time from the `bazarr` Secret (envFrom); the ConfigMap holds no value.
  - id: AVD-KSV-0109
    paths:
      - "apps/theater/bazarr.yaml"
      - "deploy/apps/theater/configmap-bazarr-config.yaml"
    statement: >-
      False positive, verified by grep. The flagged lines are config.yaml keys
      whose values are shell variables from the bazarr Secret via envFrom. No
      credential is present in the ConfigMap.
    expired_at: 2027-03-01

  # vuln-enrich's enrich.py reads the pod's service-account token from its
  # file at run time and sends it as `Authorization: Bearer`; the ConfigMap
  # holds the code, not the token.
  - id: AVD-KSV-0109
    paths:
      - "deploy/platform/vuln-enrich/configmap-vuln-enrich-*.yaml"
    statement: >-
      False positive, verified by grep. The flagged text is the Python that
      reads /var/run/secrets/kubernetes.io/serviceaccount/token at run time.
      No credential is present in the ConfigMap.
    expired_at: 2027-03-01

  # =========================================================================
  # BY DESIGN -- the LAN inventory's ARP scan
  # =========================================================================
  # lan-inventory sends ARP requests from the node's interface through an
  # AF_PACKET socket: ARP does not leave a pod network namespace, and a raw
  # socket needs CAP_NET_RAW. Every other capability is dropped, the root
  # filesystem is read-only, no service account token is mounted, and the
  # namespace is the one node-exporter already makes privileged.
  - id: AVD-KSV-0009
    paths:
      - "platform/lan-inventory/deployment.yaml"
      - "deploy/platform/lan-inventory/deployment-lan-inventory.yaml"
    statement: >-
      hostNetwork is the control the scan needs: ARP requests must go out on
      the node's LAN interface, which a pod network namespace does not reach.
    expired_at: 2027-04-01
  - id: AVD-KSV-0119
    paths:
      - "platform/lan-inventory/deployment.yaml"
      - "deploy/platform/lan-inventory/deployment-lan-inventory.yaml"
    statement: >-
      NET_RAW is the only added capability, required to open the AF_PACKET
      socket that sends and receives ARP frames; all others are dropped.
    expired_at: 2027-04-01

  # =========================================================================
  # DEFERRED -- the fix would break the thing
  # =========================================================================
  # pods/exec on a NAMESPACED Role, not a ClusterRole. This is how the drill
  # verifies: it restores a dump into a throwaway CNPG cluster and execs psql to
  # compare table counts, row counts and extension sets against the source.
  # Removing the verb removes the only mechanism that proves a backup restores.
  #
  # Scope that makes it acceptable: a Role cannot exec into another namespace, and
  # backup-verify holds only the drills and the ephemeral clusters they create.
  - id: AVD-KSV-0053
    paths:
      - "platform/backup-verify/rbac.yaml"
      - "deploy/platform/backup-verify/role-backup-verify.yaml"
    statement: >-
      Namespaced Role, not cluster-wide. pods/exec is how the weekly drill runs
      psql inside the restored cluster to compare table/row counts and extension
      sets. Removing it removes the only proof that backups restore. Revisit by
      rewriting the drill to connect over the Service instead.
    expired_at: 2027-03-01

  # S3 encryption mode of the live backup bucket (ned-si-homelab-backups).
  # The comment above aws_s3_bucket_server_side_encryption_configuration in
  # bootstrap/aws-backup/main.tf records the choice: SSE-S3 (AES256, bucket key
  # on) because restic encrypts client-side.
  #
  # What this finding is actually about: the CNPG objects under
  # cnpg/<serverName>/{base,wals}/ are NOT client-side encrypted, so for those
  # SSE-S3 is the only encryption at rest and AWS holds the key.
  #
  # barman-cloud cannot close it: its `encryption` setting only picks the S3
  # server-side mode (AES256 or aws:kms), and client-side encryption is an open
  # upstream request (EnterpriseDB/barman#1155). A customer managed KMS key was
  # proposed in #952 and declined by the operator (2026-11-03): AWS keeps
  # managing the key, nobody here has to. The CNPG objects rely on SSE-S3 plus
  # the bucket policy and the version lock.
  #
  # Accepted risk by operator decision. Revisit if barman-cloud gains
  # client-side encryption.
  - id: AVD-AWS-0132
    paths:
      - "bootstrap/aws-backup/main.tf"
    statement: >-
      Backup bucket default encryption is SSE-S3, by operator decision (#952,
      2026-11-03: no customer managed key). restic objects are client-side
      encrypted; the CNPG base backups and WAL rely on SSE-S3, the bucket
      policy and the version lock. Revisit if barman-cloud gains client-side
      encryption.
    expired_at: 2027-05-01

  # Same rule, different bucket and a different answer. The state bucket only
  # ever stores OpenTofu ciphertext: state and plans are encrypted client-side
  # (aes_gcm, pbkdf2 key from TOFU_STATE_PASSPHRASE, enforced) before upload, so
  # AWS never holds a key that opens them. A CMK would add cost and a second key
  # whose loss also makes the state unreadable, for no gain in confidentiality.
  - id: AVD-AWS-0132
    paths:
      - "bootstrap/tofu-state/main.tf"
    statement: >-
      State bucket objects are already encrypted client-side by OpenTofu
      (aes_gcm, enforced) before upload; AWS holds no key that decrypts them.
      SSE-S3 is defence in depth only. A CMK adds per-request cost and a second
      key whose loss makes the state unreadable. Revisit if anything but
      OpenTofu state is ever stored in this bucket.
    expired_at: 2027-04-01

  # =========================================================================
  # DEFERRED -- upstream images that need root, SCOPED to exactly those
  # =========================================================================
  # linuxserver/hotio-style containers start an s6 supervision tree as root,
  # chown their config and media paths, then drop to PUID/PGID 1000. Setting
  # runAsNonRoot or a non-root runAsUser makes the entrypoint fail before the
  # application starts.
  #
  # What they do have: pod-level fsGroup 1000 with
  # fsGroupChangePolicy: OnRootMismatch, and the namespace-wide PUID/PGID/UMASK
  # contract documented in apps/theater/sonarr.yaml.
  #
  # ENUMERATED FILE BY FILE, not by a bare id. That is the point of this PR: a new
  # workload that CAN satisfy the check is not silently covered. Adding a new
  # root-requiring image means adding a line here, in a reviewable diff, with a
  # reason -- which is what the old blanket entry only asked for in prose.
  #
  # Same position .kube-linter.yaml takes on the equivalent check.
  - id: AVD-KSV-0118
    paths:
      - "apps/theater/*.yaml"
      - "apps/mealie/deployment.yaml"
      - "apps/paperless/deployment.yaml"
      - "apps/syncthing/statefulset.yaml"
      - "deploy/apps/theater/*.yaml"
      - "deploy/apps/mealie/deployment-mealie.yaml"
      - "deploy/apps/paperless/deployment-paperless.yaml"
      - "deploy/apps/syncthing/statefulset-syncthing.yaml"
    statement: >-
      linuxserver/hotio-style images start s6 as root and drop to PUID/PGID 1000;
      runAsNonRoot breaks the entrypoint before the app starts. Mitigated by
      pod-level fsGroup and the namespace PUID/PGID/UMASK contract. Enumerated per
      file so a workload that CAN satisfy the check is not covered by accident.
    expired_at: 2027-03-01

  # Parity ports (ADR 0002): these workloads are byte-equal to the running
  # cluster, which sets no securityContext on them. Adding one changes the pod
  # template and restarts the pod, which parity forbids; hardening them is its
  # own change (docs/roadmap.md, "Hardening"). Short expiry on purpose.
  - id: AVD-KSV-0118
    paths:
      - "apps/immich/resources/valkey.yaml"
      - "apps/paperless/valkey.yaml"
      - "platform/keycloak/deployment.yaml"
      - "deploy/apps/immich/resources/deployment-valkey.yaml"
      - "deploy/apps/paperless/deployment-valkey.yaml"
      - "deploy/platform/keycloak/deployment-keycloak.yaml"
    statement: >-
      Default security context on workloads ported unchanged from the running
      cluster (valkey x2, Keycloak); setting one restarts them, so it
      ships with the hardening change, not with the parity adoption.
    expired_at: 2027-01-31

  # =========================================================================
  # TEST FIXTURES -- deliberately non-compliant, never applied
  # =========================================================================
  # policies/kyverno/tests/resources.yaml holds the objects the Kyverno policy
  # tests must reject or accept: privileged Pods, Pods without a security
  # context. No Application syncs policies/. Fixing them would remove the very
  # cases the tests exist for.
  - id: AVD-KSV-0017
    paths:
      - "policies/kyverno/tests/resources.yaml"
    statement: >-
      Kyverno policy test fixture: the privileged Pod and Deployment are the
      cases disallow-privileged-containers must reject. Never applied; no
      Application syncs policies/.
    expired_at: 2027-04-01
  - id: AVD-KSV-0118
    paths:
      - "policies/kyverno/tests/resources.yaml"
    statement: >-
      Kyverno policy test fixtures set no securityContext on purpose: each one
      isolates the field its policy tests. Never applied; no Application syncs
      policies/.
    expired_at: 2027-04-01

  # readOnlyRootFilesystem. The upstream app images below write to their own
  # filesystem at runtime with no way to relocate it, so enforcing this would
  # mean forking every image.
  #
  # .kube-linter.yaml holds the SAME position for `no-read-only-root-fs`, which is
  # advisory there rather than blocking. One control, one answer, both files.
  #
  # ENUMERATED FILE BY FILE, like KSV-0118. A bare id suppressed the finding in
  # the baseline scan too, so the delta gate never saw a new workload without
  # the flag. With paths, a new or renamed workload reports again and has to
  # set the flag or be listed here. A stale path only stops matching.
  #
  # Deliberately not listed: apps/paperless/backup.yaml (ours, fixable: #953).
  # It stays a visible pre-existing HIGH finding in the gate summary.
  - id: AVD-KSV-0014
    paths:
      - "apps/books/audiobookshelf.yaml"
      - "apps/books/calibre-web.yaml"
      - "apps/mealie/deployment.yaml"
      - "apps/paperless/deployment.yaml"
      - "apps/syncthing/statefulset.yaml"
      - "apps/theater/bazarr.yaml"
      - "apps/theater/jellyfin.yaml"
      - "apps/theater/lazylibrarian.yaml"
      - "apps/theater/lidarr.yaml"
      - "apps/theater/plex.yaml"
      - "apps/theater/prowlarr.yaml"
      - "apps/theater/qbittorrent.yaml"
      - "apps/theater/radarr.yaml"
      - "apps/theater/sonarr.yaml"
      - "deploy/apps/books/deployment-audiobookshelf.yaml"
      - "deploy/apps/books/deployment-calibre-web.yaml"
      - "deploy/apps/mealie/deployment-mealie.yaml"
      - "deploy/apps/paperless/deployment-paperless.yaml"
      - "deploy/apps/syncthing/statefulset-syncthing.yaml"
      - "deploy/apps/theater/deployment-bazarr.yaml"
      - "deploy/apps/theater/deployment-jellyfin.yaml"
      - "deploy/apps/theater/deployment-lazylibrarian.yaml"
      - "deploy/apps/theater/deployment-lidarr.yaml"
      - "deploy/apps/theater/deployment-plex.yaml"
      - "deploy/apps/theater/deployment-prowlarr.yaml"
      - "deploy/apps/theater/deployment-qbittorrent.yaml"
      - "deploy/apps/theater/deployment-radarr.yaml"
      - "deploy/apps/theater/deployment-sonarr.yaml"
    statement: >-
      Upstream app images (*arr, Plex, Jellyfin, qBittorrent, Audiobookshelf,
      Calibre-Web, Mealie, Paperless, Syncthing) write to their own root
      filesystem with no relocation option. Matches the advisory stance on
      no-read-only-root-fs in .kube-linter.yaml. Enumerated per file so a new
      workload reports.
    expired_at: 2027-03-01
  # Parity ports (ADR 0002), same set and same reason as the KSV-0118 parity
  # entry above: setting the flag changes the pod template and restarts them.
  - id: AVD-KSV-0014
    paths:
      - "apps/immich/resources/valkey.yaml"
      - "apps/paperless/valkey.yaml"
      - "platform/keycloak/deployment.yaml"
      - "deploy/apps/immich/resources/deployment-valkey.yaml"
      - "deploy/apps/paperless/deployment-valkey.yaml"
      - "deploy/platform/keycloak/deployment-keycloak.yaml"
    statement: >-
      Workloads ported unchanged from the running cluster (valkey x2,
      Keycloak) set no readOnlyRootFilesystem; setting it restarts them, so it
      ships with the hardening change, not with the parity adoption.
    expired_at: 2027-01-31
  - id: AVD-KSV-0014
    paths:
      - "policies/kyverno/tests/resources.yaml"
    statement: >-
      Kyverno policy test fixtures set no securityContext on purpose: each one
      isolates the field its policy tests. Never applied; no Application syncs
      policies/.
    expired_at: 2027-04-01
