---
# Local guardrails. Install with `task tools`, which runs:
#     pre-commit install --install-hooks
#     pre-commit install --hook-type commit-msg
#
# Run against everything with: pre-commit run --all-files
#                              pre-commit run --all-files --hook-stage pre-push
#
# CI's `lint` job runs this file and skips only hooks a dedicated CI step runs
# with the same script or binary; tests/test_precommit_parity.py keeps the two
# in step. `pre-push` adds the slow render, kubeconform and repo-policy steps.
# Each `rev` is tracked by Renovate's `pre-commit` manager.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

# deploy/ is generated: hooks that rewrite files exclude it, or
# `render-deploy.sh --check` would fail for ever. Hooks that read it still run.
repos:
  # ---------------------------------------------------------------------------
  # Hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # policies/kyverno/upstream and platform/tetragon/policies hold upstream files kept byte for byte
      # (scripts/kyverno-vendor.sh --check): excluded like deploy/.
      - id: trailing-whitespace
        exclude: ^(deploy|policies/kyverno/upstream|platform/tetragon/policies)/
      - id: end-of-file-fixer
        exclude: ^(deploy|policies/kyverno/upstream|platform/tetragon/policies)/
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^(deploy|policies/kyverno/upstream|platform/tetragon/policies)/
      - id: check-yaml
        name: check-yaml (skips SOPS + Helm templates)
        # Multi-document manifests are the norm here.
        args: [--allow-multiple-documents]
        exclude: |
          (?x)^(
            .*\.sops\.yaml
            |bootstrap/charts/.*/templates/.*
            |Taskfile\.yml
            # Home Assistant YAML: custom tags (!include, !env_var, !secret).
            |apps/home/config/.*
          )$
      - id: check-added-large-files
        args: [--maxkb=512]
        # deploy/infrastructure/gateway-api/ holds the Gateway API experimental
        # CRDs (~830KB in total, the HTTPRoute CRD alone ~370KB), vendored so
        # Argo does not need to reach github.com at sync time. They change only
        # on a Gateway API version bump, which is behind manual review anyway.
        exclude: ^deploy/
      - id: check-executables-have-shebangs
      # A file with a `#!` line that is not executable fails here (git tracks
      # the bit; a local chmod that is never staged fixes nothing).
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
        # This hook matches the bare phrase, so it fires on templates and on
        # the two scripts that talk about it. scripts/leak-check.sh scans the
        # same files and requires the armour, so nothing slips through.
        exclude: |
          (?x)^(
            .*\.example
            |scripts/leak-check\.sh
            |scripts/secrets-inventory\.sh
          )$

  # ---------------------------------------------------------------------------
  # Secret scanning. Two tools on purpose: gitleaks catches high-entropy and
  # known-provider patterns, leak-check enforces THIS repo's rule that every
  # *.sops.yaml must actually be encrypted.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ---------------------------------------------------------------------------
  # YAML / shell / OpenTofu
  # ---------------------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint.yaml]
        # Generated output. Style-linting it would mean either editing generated
        # files or vendoring upstream CRDs that happen to satisfy our line-length
        # rules, neither of which is a real goal.
        exclude: ^(deploy|policies/kyverno/upstream|platform/tetragon/policies)/

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # -x, like scripts/ci/shellcheck-all.sh: the bash tests source
        # tests/bash/lib.sh, which a commit rarely stages too.
        args: [-x]

  # The only OpenTofu format check (`task lint:tofu` calls this hook). It uses
  # PCT_TFPATH, then `terraform`, then `tofu`, and fails with exit code 127
  # when none is on PATH. CI's `lint` runs `tofu fmt -check -recursive`
  # instead.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.4
    hooks:
      - id: terraform_fmt
        files: ^bootstrap/

  # ---------------------------------------------------------------------------
  # Conventional commits, locally. CI checks titles and subjects with
  # scripts/ci/check-title.sh; keep the types in line with its regex.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert
          - security
          - style

  # ---------------------------------------------------------------------------
  # Renovate's own validator for .github/renovate.json5. Installs the renovate
  # npm package into the pre-commit cache on first use (about a minute).
  # ---------------------------------------------------------------------------
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.206.2
    hooks:
      - id: renovate-config-validator
        args: [--strict]
        files: ^\.github/renovate\.json5$

  # ---------------------------------------------------------------------------
  # Repo-specific checks. Local hooks so they cannot drift from the scripts CI
  # runs.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint (GitHub workflows)
        entry: actionlint
        language: system
        pass_filenames: false
        files: ^\.github/workflows/

      # The Kyverno policies, their unit tests, and deploy/ against them: the
      # same script as the CI render job. Needs the kyverno CLI (`task tools`).
      - id: kyverno
        name: kyverno policies over deploy/
        entry: scripts/ci/kyverno.sh
        language: script
        pass_filenames: false
        files: ^(deploy|policies/kyverno)/

      # The CI `render` job, end to end: render every Application the way Argo
      # CD does, kubeconform it against the pinned schemas, then
      # scripts/ci/repo-policy.sh (pins, invariants, kube-linter, deploy/
      # matches its sources). Needs helm, kubectl, kubeconform and kube-linter
      # (`task tools`) and network for the Helm charts, so it runs on push.
      - id: ci-render
        name: render, kubeconform, repo-policy (CI render job)
        entry: scripts/ci/render-validate.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]

      - id: leak-check
        name: no unencrypted secrets
        entry: ./scripts/leak-check.sh
        language: script
        pass_filenames: false
        always_run: true

      # A placeholder is valid YAML, so only this catches it; deferrals live in
      # scripts/placeholder-allowlist.tsv with a reason each.
      # Waiver hygiene only (scripts/trivy-waivers.sh); the gate is CI's
      # trivy-gate.sh. `always_run`: expiry depends on time, not on the file
      # changing. `verbose: true` so the near-expiry warning shows.
      - id: trivy-waivers
        name: trivy waivers carry a reason and an expiry
        entry: ./scripts/trivy-waivers.sh
        language: script
        pass_filenames: false
        always_run: true
        verbose: true

      - id: placeholder-check
        name: no unfilled placeholders in anything Argo syncs
        entry: ./scripts/placeholder-check.sh
        language: script
        pass_filenames: false
        always_run: true

      # Blocking: one missing or unsealed file stalls its `secrets-*`
      # Application at wave -25 and everything below it. `verbose: true` lists
      # the sealed files. A local hook has no `env:` key (pre-commit ignores it
      # with a warning), hence `env VAR=value` in the entry and
      # `language: system`.
      - id: secrets-check
        name: KSOPS generators reference files that exist and are sealed
        entry: env SECRETS_CHECK_STRICT=1 ./scripts/secrets-check.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      - id: renovate-annotations
        name: every pinned version has a working renovate annotation
        entry: node scripts/renovate-dryrun.js
        language: system
        pass_filenames: false
        files: '(\.ya?ml$|\.tf$|Taskfile\.yml$|renovate\.json5$)'

      # Regenerates deploy/, so "you forgot to re-render" becomes a staged
      # file; commit again when it changes something. CI runs the same script
      # with --check.
      - id: render-deploy
        name: deploy/ matches its sources
        entry: ./scripts/render-deploy.sh
        language: script
        pass_filenames: false
        files: '(kustomization\.yaml$|\.ya?ml$)'
