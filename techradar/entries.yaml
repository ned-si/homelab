# The tech radar at https://techradar.nedsi.io/ (.kiro/specs/tech-radar/).
# Fields: name, quadrant (techniques, tools, platform, infrastructure),
# ring (adopt, trial, assess, hold), reason (one line, at most 140
# characters), optional link (#<issue> or a repository path) and moved
# (up, down, new). After a change: task techradar:render.
updated: 2026-11-25
entries:
  # Techniques
  - name: GitOps, main is production
    quadrant: techniques
    ring: adopt
    reason: "Merging deploys and a revert rolls back; Argo CD tracks main."
    link: "docs/decisions.md#main-is-production"
  - name: Rendered manifests in git
    quadrant: techniques
    ring: adopt
    reason: "Every object Argo CD applies is reviewed as a file in the pull request."
    link: "docs/architecture.md"
  - name: CI as the only gate
    quadrant: techniques
    ring: adopt
    reason: "No human approval: green CI merges, a degraded app is reverted."
    link: "docs/decisions.md#no-human-gates"
  - name: Automatic rollback
    quadrant: techniques
    ring: adopt
    reason: "A merge that degrades an app is reverted, with an outage guard."
    link: "docs/decisions.md#automatic-rollback"
  - name: Deterministic first
    quadrant: techniques
    ring: adopt
    reason: "Scripts, checks and thresholds decide; AI writes and summarises."
    link: "docs/decisions.md#deterministic-first"
  - name: SLOs and error budgets
    quadrant: techniques
    ring: adopt
    reason: "One number per app, 99.5% over 30 days, from public probes."
    link: "docs/sre.md"
  - name: Page only when urgent and actionable
    quadrant: techniques
    ring: adopt
    reason: "Everything else is on a dashboard, never on the phone."
    link: "docs/sre.md"
  - name: Restore-tested backups
    quadrant: techniques
    ring: adopt
    reason: "A backup counts once a scheduled restore of it has passed."
    link: "docs/backups.md"
  - name: Spec-driven development
    quadrant: techniques
    ring: adopt
    reason: "Requirements, design and tasks merged before the code."
    link: "docs/spec-driven-development.md"
  - name: Agent-written pull requests
    quadrant: techniques
    ring: adopt
    reason: "Agents implement through PRs; CI and the specs keep them honest."
    link: "docs/spec-driven-development.md"
  - name: Trunk-based with squash merges
    quadrant: techniques
    ring: adopt
    reason: "One commit per pull request on a linear main."
    link: "docs/decisions.md#squash-merge"
  - name: Images pinned by digest
    quadrant: techniques
    ring: adopt
    reason: "A tag can move; a digest cannot."
    link: "docs/testing.md"
  - name: Keyless signing and SLSA provenance
    quadrant: techniques
    ring: adopt
    reason: "Own images signed by their workflow and checked by Kyverno."
    link: ".kiro/specs/image-provenance/"
  - name: DORA metrics
    quadrant: techniques
    ring: adopt
    reason: "Delivery measured from git, GitHub and alerts, live on the dashboard."
    link: ".kiro/specs/homelab-dashboard/"
  - name: Database majors fix forward
    quadrant: techniques
    ring: adopt
    reason: "A Postgres major is a one-way door: fresh backup, then forward."
    link: "docs/decisions.md#database-majors-fix-forward"
  - name: Scheduled pentests
    quadrant: techniques
    ring: adopt
    reason: "A scoped run against our own names and addresses, findings as issues."
    link: "docs/pentest/README.md"
  - name: Default-deny network policies
    quadrant: techniques
    ring: trial
    reason: "Enforced in a few namespaces; app allow-lists still in audit."
    link: "#709"
  - name: Pod Security restricted
    quadrant: techniques
    ring: trial
    reason: "Kyverno restricted policies in Audit until their reports are clean."
    link: "#1021"
  - name: GitHub App instead of PATs
    quadrant: techniques
    ring: trial
    reason: "Short-lived tokens for the pentest workflows; PATs remain elsewhere."
    link: "docs/pentest/README.md"
  - name: Chaos experiments tied to SLOs
    quadrant: techniques
    ring: assess
    reason: "Break things on purpose, within the error budget."
    link: "#733"
  - name: Wide events
    quadrant: techniques
    ring: assess
    reason: "One rich event per request instead of three signals."
    link: "#734"
  - name: Canary tokens
    quadrant: techniques
    ring: assess
    reason: "Fake credentials that page when touched."
    link: "#1618"
  - name: Weekly SBOM and CVE scan
    quadrant: techniques
    ring: assess
    reason: "What runs, scanned weekly, not only at build time."
    link: "#1507"
  - name: Disaster recovery site
    quadrant: techniques
    ring: assess
    reason: "Where to rebuild if the house is gone, and how fast."
    link: "#918"
  - name: Kubernetes OIDC through Keycloak
    quadrant: techniques
    ring: assess
    reason: "Personal API credentials instead of a shared kubeconfig."
    link: "#711"
  - name: ADR directory
    quadrant: techniques
    ring: hold
    reason: "ADRs rot in a one-person repository; decisions live in the docs."
    link: "docs/decisions.md"

  # Tools and languages
  - name: Go
    quadrant: tools
    ring: adopt
    reason: "The dashboard and this radar: one static binary, typed, tested."
    link: "docs/decisions.md#the-public-dashboard-is-a-first-party-go-app"
  - name: Python
    quadrant: tools
    ring: adopt
    reason: "CI scripts and checks, with pytest."
    link: "docs/testing.md"
  - name: Hugo
    quadrant: tools
    ring: adopt
    reason: "One pinned binary, no theme, no npm tree, strict CSP possible."
    link: ".kiro/specs/public-website/design.md"
  - name: OpenTofu
    quadrant: tools
    ring: adopt
    reason: "The cloud resources, applied by a workflow through GitHub OIDC."
    link: "docs/bootstrap.md"
  - name: SOPS with age
    quadrant: tools
    ring: adopt
    reason: "Secrets encrypted in git, decrypted by KSOPS in Argo CD."
    link: "docs/secrets.md"
  - name: Renovate
    quadrant: tools
    ring: adopt
    reason: "Every dependency pinned and updated, automerged on green CI."
    link: "docs/testing.md"
  - name: GitHub Actions
    quadrant: tools
    ring: adopt
    reason: "CI and publishing, every action pinned to a SHA."
    link: "docs/testing.md"
  - name: cosign
    quadrant: tools
    ring: adopt
    reason: "Keyless signatures with the workflow identity."
    link: ".kiro/specs/image-provenance/"
  - name: GitHub artifact attestations
    quadrant: tools
    ring: adopt
    reason: "SLSA v1 provenance for the own images, SLSA Build L2."
    link: ".kiro/specs/homelab-dashboard/design.md"
  - name: OpenSSF Scorecard
    quadrant: tools
    ring: adopt
    reason: "A weekly score of the repository's supply-chain practice."
    link: ".kiro/specs/scorecard-hardening/"
  - name: talhelper
    quadrant: tools
    ring: adopt
    reason: "The Talos machine configs rendered from one file."
    link: "docs/talos.md"
  - name: Kustomize and Helm
    quadrant: tools
    ring: adopt
    reason: "Helm charts rendered through Kustomize into deploy/."
    link: "docs/architecture.md"
  - name: kubeconform and kube-linter
    quadrant: tools
    ring: adopt
    reason: "Schema and practice checks on every rendered manifest."
    link: "docs/testing.md"
  - name: Trivy
    quadrant: tools
    ring: adopt
    reason: "The image and config gate in CI."
    link: "docs/testing.md"
  - name: gitleaks
    quadrant: tools
    ring: adopt
    reason: "No secret reaches a commit, public repository or not."
    link: "docs/testing.md"
  - name: pre-commit
    quadrant: tools
    ring: adopt
    reason: "The same checks locally on commit and push."
    link: "docs/testing.md"
  - name: kind
    quadrant: tools
    ring: adopt
    reason: "A throwaway cluster in CI for a server-side dry run and a real boot."
    link: "docs/testing.md"
  - name: chrome-headless-shell
    quadrant: tools
    ring: adopt
    reason: "Screenshot and layout checks without a pixel diff."
    link: ".kiro/specs/homelab-dashboard/design.md"
  - name: OWASP ZAP
    quadrant: tools
    ring: adopt
    reason: "The DAST scan of the public names."
    link: "docs/pentest/README.md"
  - name: Task
    quadrant: tools
    ring: adopt
    reason: "One Taskfile for render, checks and Talos operations."
    link: "Taskfile.yml"
  - name: Kiro
    quadrant: tools
    ring: adopt
    reason: "The agents that write most pull requests, held to the specs."
    link: "docs/spec-driven-development.md"
  - name: Lore
    quadrant: tools
    ring: assess
    reason: "Memory for coding agents; not evaluated yet, the exact project first."
    link: "#1675"
  - name: Astro and Eleventy
    quadrant: tools
    ring: hold
    reason: "An npm dependency tree to patch for a static blog."
    link: ".kiro/specs/public-website/design.md"
  - name: Zola
    quadrant: tools
    ring: hold
    reason: "Fine, but a smaller ecosystem and nothing gained over Hugo."
    link: ".kiro/specs/public-website/design.md"
  - name: Ansible
    quadrant: tools
    ring: hold
    reason: "Node playbooks replaced by Talos machine configs."
    link: "docs/decisions.md#talos-built-as-a-new-cluster"

  # Platform
  - name: Argo CD
    quadrant: platform
    ring: adopt
    reason: "Root, three layers, one Application per app, tracking main."
    link: "docs/architecture.md"
  - name: Kyverno
    quadrant: platform
    ring: adopt
    reason: "Baseline policies in Deny, in CI and in the cluster."
    link: "docs/testing.md"
  - name: CloudNativePG
    quadrant: platform
    ring: adopt
    reason: "Postgres with WAL and base backups to S3 through Barman Cloud."
    link: "docs/backups.md"
  - name: Keycloak
    quadrant: platform
    ring: adopt
    reason: "One sign-on for every app, access by group, TOTP for admins."
    link: "docs/architecture.md"
  - name: cert-manager
    quadrant: platform
    ring: adopt
    reason: "Let's Encrypt over DNS-01, renewed without anyone noticing."
    link: "docs/networking.md#certificates"
  - name: external-dns
    quadrant: platform
    ring: adopt
    reason: "DNS records from the routes, upsert only."
    link: "docs/networking.md#dns"
  - name: Prometheus
    quadrant: platform
    ring: adopt
    reason: "Metrics for 30 days, the SLOs as recording rules."
    link: "docs/observability.md"
  - name: Alertmanager
    quadrant: platform
    ring: adopt
    reason: "Pages through ntfy, quiet hours, only urgent alerts."
    link: "docs/observability.md#notifications"
  - name: Grafana
    quadrant: platform
    ring: adopt
    reason: "The dashboards, behind Keycloak."
    link: "docs/observability.md#dashboards"
  - name: Vector
    quadrant: platform
    ring: adopt
    reason: "Pod and Talos logs shipped as structured events."
    link: "docs/observability.md#logs"
  - name: Hubble
    quadrant: platform
    ring: adopt
    reason: "Network flows from Cilium, behind Keycloak."
    link: "docs/networking.md"
  - name: tuppr
    quadrant: platform
    ring: adopt
    reason: "Talos and Kubernetes upgrades rolled out node by node."
    link: "docs/talos.md#upgrades"
  - name: restic
    quadrant: platform
    ring: adopt
    reason: "File backups to S3 and the NAS, restore-tested weekly."
    link: "docs/backups.md"
  - name: Headlamp
    quadrant: platform
    ring: adopt
    reason: "A cluster UI behind Keycloak."
    link: "docs/remote-access.md"
  - name: ntfy
    quadrant: platform
    ring: adopt
    reason: "Push notifications for pages."
    link: "docs/observability.md#notifications"
  - name: PostgreSQL
    quadrant: platform
    ring: adopt
    reason: "The one database engine, run by CloudNativePG."
    link: "docs/backups.md"
  - name: Immich
    quadrant: platform
    ring: adopt
    reason: "The photo library, signed in through Keycloak."
    link: "apps/immich/"
  - name: Plex
    quadrant: platform
    ring: adopt
    reason: "Films and series on the TVs, off SSO so the TV apps sign in."
    link: "apps/theater/plex.yaml"
  - name: Jellyfin
    quadrant: platform
    ring: adopt
    reason: "The open-source media server next to Plex, off SSO."
    link: "apps/theater/jellyfin.yaml"
  - name: Paperless-ngx
    quadrant: platform
    ring: adopt
    reason: "Scanned documents, searchable."
    link: "apps/paperless/"
  - name: Mealie
    quadrant: platform
    ring: adopt
    reason: "The household's recipes."
    link: "apps/mealie/"
  - name: Syncthing
    quadrant: platform
    ring: adopt
    reason: "Device sync without a cloud in the middle."
    link: "apps/syncthing/"
  - name: Audiobookshelf
    quadrant: platform
    ring: adopt
    reason: "Audiobooks and podcasts."
    link: "apps/books/audiobookshelf.yaml"
  - name: Calibre-Web
    quadrant: platform
    ring: adopt
    reason: "The e-book library."
    link: "apps/books/calibre-web.yaml"
  - name: Home Assistant
    quadrant: platform
    ring: adopt
    reason: "Home automation, local first."
    link: "apps/home/home-assistant.yaml"
  - name: Mosquitto
    quadrant: platform
    ring: adopt
    reason: "The MQTT broker for the home devices."
    link: "apps/home/mosquitto.yaml"
  - name: Zigbee2MQTT
    quadrant: platform
    ring: adopt
    reason: "Zigbee devices on MQTT, no vendor hub."
    link: "apps/home/zigbee2mqtt.yaml"
  - name: healthchecks.io
    quadrant: platform
    ring: adopt
    reason: "The dead man's switch: pages when the cluster goes silent."
    link: "docs/observability.md"
  - name: Tetragon
    quadrant: platform
    ring: trial
    reason: "Runtime detection that pages on critical events; nothing is blocked yet."
    link: "docs/observability.md#runtime-tetragon"
  - name: SigNoz
    quadrant: platform
    ring: trial
    reason: "Logs on ClickHouse, on trial as the one place for signals."
    link: "#801"
  - name: Jamulus
    quadrant: platform
    ring: trial
    moved: new
    reason: "Rehearsing together from different places, unlisted on the home line."
    link: "docs/jamulus.md"
  - name: Umami
    quadrant: platform
    ring: assess
    reason: "Cookieless statistics, chosen and not deployed yet."
    link: ".kiro/specs/public-website/"
  - name: OpenBao with External Secrets
    quadrant: platform
    ring: assess
    reason: "Cluster-owned secrets issued, not stored."
    link: "#713"
  - name: KEDA
    quadrant: platform
    ring: assess
    reason: "Event-driven scaling, with the HA work."
    link: "#917"
  - name: Shirudo
    quadrant: platform
    ring: assess
    reason: "eBPF shields for unpatched code paths, once arm64 and Talos fit."
    link: "#1628"
  - name: Honeycomb and OBI
    quadrant: platform
    ring: assess
    reason: "Traces from eBPF instrumentation, compared with SigNoz."
    link: "#734"
  - name: CrowdSec
    quadrant: platform
    ring: assess
    reason: "A shared blocklist at the Gateway; not evaluated yet."
    link: "#1676"
  - name: Loki
    quadrant: platform
    ring: hold
    reason: "Indexes labels only; the fallback if the SigNoz trial fails."
    link: "docs/observability.md#why-it-is-like-this"
  - name: Service mesh
    quadrant: platform
    ring: hold
    reason: "Cilium already gives the policies and the flows, without sidecars."
    link: "docs/decisions.md#no-service-mesh"
  - name: Seafile
    quadrant: platform
    ring: hold
    reason: "Removed: Syncthing and Paperless-ngx cover its uses."
    link: "docs/decisions.md#seafile-removed"
  - name: Policy Reporter UI
    quadrant: platform
    ring: hold
    reason: "Grafana is the one view for policy reports."
    link: ".kiro/specs/wave3-runtime-security/"
  - name: Dex in Argo CD
    quadrant: platform
    ring: hold
    reason: "Unused: Argo CD signs in with Keycloak directly."
    link: "#969"
  - name: SonoBus
    quadrant: platform
    ring: hold
    moved: new
    reason: "Peer to peer: each player sends to every other; a central server suits the cluster."
    link: "#1702"

  # Infrastructure
  - name: Kubernetes
    quadrant: infrastructure
    ring: adopt
    reason: "One API for every workload, run on Talos."
    link: "docs/architecture.md#cluster"
  - name: Talos Linux
    quadrant: infrastructure
    ring: adopt
    reason: "Immutable, API-only nodes with the machine config in git."
    link: "docs/talos.md"
  - name: Cilium
    quadrant: infrastructure
    ring: adopt
    reason: "kube-proxy replacement, LB-IPAM, L2 announcements and the Gateway."
    link: "docs/networking.md"
  - name: Gateway API
    quadrant: infrastructure
    ring: adopt
    reason: "One shared Gateway for every public name."
    link: "docs/networking.md#gateway"
  - name: TrueNAS SCALE
    quadrant: infrastructure
    ring: adopt
    reason: "The NAS: ZFS, iSCSI and NFS, driven by its API."
    link: ".kiro/specs/nas-on-truenas-scale/"
  - name: democratic-csi
    quadrant: infrastructure
    ring: adopt
    reason: "iSCSI volumes from the NAS on demand, Retain for data."
    link: "docs/architecture.md"
  - name: Tailscale
    quadrant: infrastructure
    ring: adopt
    reason: "kubectl and talosctl only over the tailnet."
    link: "docs/remote-access.md"
  - name: Cloudflare DNS
    quadrant: infrastructure
    ring: adopt
    reason: "Free zones, DNS-01 for certificates, DNS only."
    link: "docs/networking.md#dns"
  - name: AWS S3
    quadrant: infrastructure
    ring: adopt
    reason: "Off-site backups with locked object versions."
    link: "docs/backups.md#the-bucket"
  - name: Turing Pi 2 with RK1
    quadrant: infrastructure
    ring: trial
    reason: "Four quiet arm64 nodes on one board, which is a single point of failure."
    link: "#985"
  - name: NVMe per node
    quadrant: infrastructure
    ring: assess
    reason: "Revisit from the eMMC wear trend."
    link: "#738"
  - name: SELinux enforcing on the nodes
    quadrant: infrastructure
    ring: assess
    reason: "Another layer under the pods."
    link: "#737"
  - name: TrueNAS CORE
    quadrant: infrastructure
    ring: hold
    reason: "Replaced by SCALE in November 2026."
    link: "#1305"
  - name: kube-vip
    quadrant: infrastructure
    ring: hold
    reason: "Talos holds the API VIP itself."
    link: "docs/networking.md#why-it-is-like-this"
  - name: ingress-nginx
    quadrant: infrastructure
    ring: hold
    reason: "Retired upstream; the Cilium Gateway replaced it."
    link: "docs/networking.md#why-it-is-like-this"
  - name: kubeadm
    quadrant: infrastructure
    ring: hold
    reason: "The old cluster; rebuilt on Talos."
    link: "docs/decisions.md#talos-built-as-a-new-cluster"
  - name: GitHub Pages
    quadrant: infrastructure
    ring: hold
    reason: "Cannot set a CSP header for the public site."
    link: ".kiro/specs/public-website/design.md"
  - name: Cloudflare proxy and Pages
    quadrant: infrastructure
    ring: hold
    reason: "A token with account write access and data pushed out of the house."
    link: ".kiro/specs/public-website/design.md"
