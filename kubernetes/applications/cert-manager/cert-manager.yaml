apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: cert-manager
    helm:
      values: |
        prometheus:
          enabled: true
          servicemonitor:
            enabled: true
        installCRDs: true
        ingressShim:
          defaultIssuerName: ca-cert
          defaultIssuerKind: ClusterIssuer
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
    repoURL: https://charts.jetstack.io
    targetRevision: v1.13.3
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
