---
apiVersion: v1
kind: Service
metadata:
  name: syncthing-protocol
  namespace: syncthing
  annotations:
    # Fixed so the router port forwards (22000 TCP/UDP, 21027 UDP) stay valid.
    lbipam.cilium.io/ips: "192.168.1.201"
spec:
  type: LoadBalancer
  ports:
  - name: syncthing-tcp
    port: 22000
    protocol: TCP
    targetPort: 22000
  - name: syncthing-udp
    port: 22000
    protocol: UDP
    targetPort: 22000
  - name: syncthing-disc
    port: 21027
    protocol: UDP
    targetPort: 21027
  selector:
    app: syncthing
