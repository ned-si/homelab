apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    cert-manager.io/revision-history-limit: "1"
    # Public DNS target is set once: external-dns --default-targets in kubernetes/applications/external-dns/external-dns.yaml
  name: synchting-ingress
  namespace: syncthing
spec:
  ingressClassName: nginx
  rules:
  - host: syncthing.lilalala.com
    http:
      paths:
      - backend:
          service:
            name: syncthing-dashboard
            port:
              number: 8384
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - syncthing.lilalala.com
    secretName: syncthing-tls

