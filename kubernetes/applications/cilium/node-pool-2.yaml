apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: "pool-2"
spec:
  # Must stay inside the LAN (192.168.1.0/24) and outside the router's DHCP
  # pool (.50-.199): the router has no static routes, so a LoadBalancer IP in
  # any other subnet cannot be port-forwarded or reached from the LAN.
  blocks:
  - start: "192.168.1.200"
    stop: "192.168.1.227"
