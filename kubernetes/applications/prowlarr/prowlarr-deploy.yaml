---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: prowlarr
  name: prowlarr
  namespace: theater
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
    spec:
      containers:
        - name: prowlarr
          image: ghcr.io/hotio/prowlarr:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Europe/Zurich
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: PROWLARR__LOG__DBENABLED
              value: "false"
            - name: PROWLARR__POSTGRES__HOST
              valueFrom:
                secretKeyRef:
                  name: prowlarr-postgresql-app
                  key: host
            - name: PROWLARR__POSTGRES__PORT
              valueFrom:
                secretKeyRef:
                  name: prowlarr-postgresql-app
                  key: port
            - name: PROWLARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  name: prowlarr-postgresql-app
                  key: user
            - name: PROWLARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prowlarr-postgresql-app
                  key: password
            - name: PROWLARR__POSTGRES__MAINDB
              valueFrom:
                secretKeyRef:
                  name: prowlarr-postgresql-app
                  key: dbname
            - name: PROWLARR__SERVER__URLBASE
              value: /arr/prowlarr
          ports:
            - name: http
              containerPort: 9696
              protocol: TCP
