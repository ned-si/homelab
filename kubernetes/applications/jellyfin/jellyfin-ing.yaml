---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    external-dns.alpha.kubernetes.io/target: 188.155.74.203
  labels:
    app.kubernetes.io/name: jellyfin
  name: jellyfin
  namespace: theater
spec:
  ingressClassName: nginx
  rules:
    - host: cinema.lilalala.com
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: jellyfin
                port:
                  name: http
  tls:
    - hosts:
        - cinema.lilalala.com
      secretName: cinema-tls
