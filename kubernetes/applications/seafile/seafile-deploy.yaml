---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: seafile
  name: seafile
  namespace: seafile
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seafile
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seafile
    spec:
      containers:
        - name: seafile
          image: seafileltd/seafile-mc:11.0-latest
          imagePullPolicy: Always
          env:
            - name: DB_HOST
              value: "mariadb"
            - name: DB_ROOT_PASSWD
              value: "XjcedwFVwymZ6bDsdnoSw8z86UlsTPBLSl34mz8v" #db's password
            - name: TIME_ZONE
              value: "Europe/Zurich"
            - name: SEAFILE_ADMIN_EMAIL
              value: "nedsi@pm.me" #admin email
            - name: SEAFILE_ADMIN_PASSWORD
              value: "2oW2NXd6MrdfVofzyhhppryz3m9Zqf8eEujLmGtw" #admin password
            - name: SEAFILE_SERVER_LETSENCRYPT
              value: "true"
            - name: SEAFILE_SERVER_HOSTNAME
              value: "https://drive.lilalala.com" #hostname
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            limits:
              memory: "1000Mi"
          volumeMounts:
            - name: seafile-data
              mountPath: /shared
      volumes:
        - name: seafile-data
          persistentVolumeClaim:
            claimName: seafile-pvc
