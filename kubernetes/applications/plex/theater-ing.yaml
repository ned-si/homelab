---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    external-dns.alpha.kubernetes.io/target: 178.39.124.203
  labels:
    app.kubernetes.io/name: theater
  name: theater
  namespace: theater
spec:
  ingressClassName: nginx
  rules:
    - host: theater.lilalala.com
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: plex
                port:
                  name: http
    - host: theater.lilalala.com
      http:
        paths:
          - path: /arr/radarr
            pathType: ImplementationSpecific
            backend:
              service:
                name: radarr
                port:
                  name: http
    - host: theater.lilalala.com
      http:
        paths:
          - path: /arr/sonarr
            pathType: ImplementationSpecific
            backend:
              service:
                name: sonarr
                port:
                  name: http
    - host: theater.lilalala.com
      http:
        paths:
          - path: /arr/prowlarr
            pathType: ImplementationSpecific
            backend:
              service:
                name: prowlarr
                port:
                  name: http
    - host: theater.lilalala.com
      http:
        paths:
          - path: /arr/lidarr
            pathType: ImplementationSpecific
            backend:
              service:
                name: lidarr
                port:
                  name: http
  tls:
    - hosts:
        - theater.lilalala.com
      secretName: theater-tls
