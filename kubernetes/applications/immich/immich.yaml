apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argo
spec:
  destination:
    namespace: immich
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: immich
    helm:
      values: |
        env:
          REDIS_HOSTNAME: "valkey.immich.svc.cluster.local"
          DB_URL:
            valueFrom:
              secretKeyRef:
                name: immich-db-app
                key: uri
          TZ: Europe/Zurich
        postgres:
          enabled: false
        redis:
          enabled: false
        image:
          tag: v2.3.1
        immich:
          metrics:
            enabled: true
          persistence:
            library:
              existingClaim: immich-data
          configuration:
            trash:
              enabled: true
              days: 30
            oauth:
              enabled: true
              issuerUrl: https://auth.lilalala.com/realms/homelab
              autoLaunch: true
              autoRegister: true
              clientId: immich
              clientSecret: REDACTED
              scope: "openid email profile"
            machineLearning:
              clip:
                enabled: true
                modelName: ViT-B-16-SigLIP-i18n-256__webli
        server:
          enabled: true
          image:
            repository: ghcr.io/immich-app/immich-server
            pullPolicy: IfNotPresent
          ingress:
            main:
              ingressClassName: nginx
              enabled: true
              annotations:
                nginx.ingress.kubernetes.io/proxy-body-size: "0"
                cert-manager.io/cluster-issuer: letsencrypt
                external-dns.alpha.kubernetes.io/target: 188.155.74.203
              hosts:
                - host: media.lilalala.com
                  paths:
                    - path: "/"
              tls:
              - secretName: immich-tls
                hosts:
                  - media.lilalala.com
        machine-learning:
          enabled: true
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            pullPolicy: IfNotPresent
          env:
            TRANSFORMERS_CACHE: /cache
            MACHINE_LEARNING_PRELOAD__CLIP: ViT-B-16-SigLIP-i18n-256__webli
          persistence:
            cache:
              enabled: true
              size: 10Gi
              type: pvc
              accessMode: ReadWriteOnce
              storageClass: iscsi
    repoURL: https://immich-app.github.io/immich-charts
    targetRevision: v0.10.3
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
