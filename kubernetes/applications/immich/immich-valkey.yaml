apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-valkey
  namespace: argo
spec:
  destination:
    namespace: immich
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: valkey
    helm:
      values: 
        auth:
          enabled: true
          password: test-pass
    repoURL: oci://registry-1.docker.io/bitnamicharts/valkey
    targetRevision: v2.1.2
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true

