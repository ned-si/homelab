---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: radarr
  name: radarr
  namespace: theater
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: radarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radarr
    spec:
      containers:
        - name: radarr
          image: ghcr.io/hotio/radarr:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Europe/Zurich
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "002"
            - name: RADARR__LOG__DBENABLED
              value: "false"
            - name: RADARR__POSTGRES__HOST
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: host
            - name: RADARR__POSTGRES__PORT
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: port
            - name: RADARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: user
            - name: RADARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: password
            - name: RADARR__POSTGRES__MAINDB
              valueFrom:
                secretKeyRef:
                  name: radarr-postgresql-app
                  key: dbname
            - name: RADARR__SERVER__URLBASE
              value: /arr/radarr
          ports:
            - name: http
              containerPort: 7878
              protocol: TCP
          volumeMounts:
            - name: media
              mountPath: /data
      volumes:
        - name: media
          nfs:
            server: 192.168.1.228
            path: /mnt/homelab/k8s/nfs
