# PostSync hook: once every synced resource is Healthy, GET each URL in args
# and fail unless all answer 2xx or 3xx within a minute. A failed hook fails
# the sync, and auto-rollback reverts the merge; a revert is never reverted,
# so a check that keeps failing ends in an issue. Users patch
# /spec/template/spec/containers/0/args; SMOKE_CURL_OPTS adds curl options.
# Read a failure: `kubectl -n <namespace> logs job/postsync-smoke`.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postsync-smoke
  labels:
    app.kubernetes.io/name: postsync-smoke
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # After the app's own PostSync hooks (keycloak-realm-settings).
    argocd.argoproj.io/sync-wave: "10"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postsync-smoke
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          # renovate: datasource=docker depName=curlimages/curl
          image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          command:
            - /bin/sh
            - -c
            - |
              # Up to 6 tries per URL, 5 s apart, 5 s timeout each.
              fail=0
              check() { # check <label> <url> [curl options...]
                label=$1 url=$2
                shift 2
                code=000
                for try in 1 2 3 4 5 6; do
                  code=$(curl "$@" -s -o /dev/null -w '%{http_code}' --max-time 5 "$url") || code=000
                  case "$code" in 2??|3??) break ;; esac
                  [ "$try" -lt 6 ] && sleep 5
                done
                case "$code" in
                  2??|3??) echo "ok   $code $url$label" ;;
                  *) echo "FAIL $code $url$label"; fail=1 ;;
                esac
              }
              for url in "$@"; do
                # shellcheck disable=SC2086 # options split on purpose
                check "" "$url" ${SMOKE_CURL_OPTS:-}
              done
              # SMOKE_COOKIE_URLS: also requested with an 8 KB Cookie header,
              # the size the SSO session cookies reach on a shared host;
              # SMOKE_COOKIE_CURL_OPTS adds curl options for them.
              if [ -n "${SMOKE_COOKIE_URLS:-}" ]; then
                cookie="Cookie: smoke=$(head -c 8192 /dev/zero | tr '\0' x)"
                for url in $SMOKE_COOKIE_URLS; do
                  # shellcheck disable=SC2086 # options split on purpose
                  check " (8 KB cookie)" "$url" ${SMOKE_COOKIE_CURL_OPTS:-} -H "$cookie"
                done
              fi
              exit "$fail"
            - postsync-smoke
          # Set by each user of the component.
          args: []
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
