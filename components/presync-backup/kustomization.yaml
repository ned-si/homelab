# PreSync backup guard: before every sync, selfHeal included, Job
# presync-backup must succeed or nothing is applied. It makes database image
# bumps safe to automerge: a major upgrades the data in place, so a bad one is
# fixed forward from this backup (docs/decisions.md). Freshness rule
# (docs/backups.md): no-op without the CronJob or Cluster, skip under 24 h,
# always for an image major or ALWAYS_FRESH=true.
# Use it from an app's kustomization:
#
#   components:
#     - ../../components/presync-backup
#   patches:
#     - target: { kind: Job, name: presync-backup }
#       patch: |-
#         - op: add
#           path: /spec/template/spec/containers/0/env/-
#           value: { name: MODE, value: cronjob }
#         ...
#   # The rendered image of every IMAGE_CHECKS object, for the major check.
#   replacements:
#     - source: { kind: Cluster, name: <cluster>, fieldPath: spec.imageName }
#       targets:
#         - select: { kind: ConfigMap, name: presync-backup-desired }
#           fieldPaths: [data.<cluster>]
#           options: { create: true }
#
# Hook objects: Argo CD recreates them on every sync (BeforeHookCreation), the
# RBAC and ConfigMaps first (wave -1).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - rbac.yaml
  - job.yaml
configMapGenerator:
  - name: presync-backup-script
    files:
      - presync-backup.sh
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "-1"
