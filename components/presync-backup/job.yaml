---
apiVersion: batch/v1
kind: Job
metadata:
  name: presync-backup
  labels:
    app.kubernetes.io/name: presync-backup
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: presync-backup
    spec:
      restartPolicy: Never
      serviceAccountName: presync-backup
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          # kubectl on Alpine: the script needs a shell, registry.k8s.io/kubectl
          # has none.
          # renovate: datasource=docker depName=alpine/kubectl
          image: alpine/kubectl:1.37.1
          command: ["/bin/sh", "/scripts/presync-backup.sh"]
          env:
            - name: HOME
              value: /tmp
            - name: MAX_AGE_HOURS
              value: "24"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: desired
              mountPath: /desired
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: scripts
          configMap:
            name: presync-backup-script
        - name: desired
          configMap:
            name: presync-backup-desired
