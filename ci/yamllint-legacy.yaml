# yamllint config for the legacy layout (kubernetes/applications/, iac/).
#
# Argo CD's live root Application applies kubernetes/applications/ as it is, so
# style is not enforced here (relaxed: style rules are warnings). What is
# enforced is what silently changes behaviour: a duplicate key drops one value.
# Deleted together with the legacy tree.
extends: relaxed

rules:
  key-duplicates: enable
  line-length: disable
  # kube-prom-stack.yaml has trailing spaces inside an inline Helm values block;
  # removing them would change the values Argo CD renders.
  trailing-spaces: disable
