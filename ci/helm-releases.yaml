# Helm releases the bootstrap installs before Argo CD can (docs/bootstrap.md),
# adopted afterwards by an Application with the same name and values. CI
# (repo-policy `bootstrap-chart-versions`) keeps each version equal to its
# Application's and renders it; the shared Renovate annotation moves all
# three together.
releases:
  # Application clusters/homelab/infrastructure/argocd.yaml.
  - name: argocd
    repo: https://argoproj.github.io/argo-helm
    chart: argo-cd
    # renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
    version: 10.13.1
    release: argocd
    namespace: argo
    values: bootstrap/argocd-values.yaml
  # Application clusters/homelab/infrastructure/cilium.yaml.
  - name: cilium
    repo: https://helm.cilium.io
    chart: cilium
    # renovate: datasource=helm depName=cilium registryUrl=https://helm.cilium.io
    version: 1.20.4
    release: cilium
    namespace: kube-system
    values: infrastructure/cilium/values.yaml
