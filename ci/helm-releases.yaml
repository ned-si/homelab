# Helm releases the bootstrap installs with the helm CLI before Argo CD can
# (docs/bootstrap.md). Argo CD adopts each one afterwards through an
# Application with the same release name and values file, so these entries are
# the versions the bootstrap installs; CI (repo-policy
# `bootstrap-chart-versions`) keeps each equal to its Application's chart
# version. CI also renders each entry (scripts/ci/render_apps.py scope 4) and
# validates the render with kubeconform. Each version carries the same
# Renovate annotation as bootstrap/main.tf and its Application, so one
# Renovate PR moves all three.
releases:
  # Application clusters/homelab/infrastructure/argocd.yaml.
  - name: argocd
    repo: https://argoproj.github.io/argo-helm
    chart: argo-cd
    # renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
    version: 10.10.3
    release: argocd
    namespace: argo
    values: bootstrap/argocd-values.yaml
  # Application clusters/homelab/infrastructure/cilium.yaml.
  - name: cilium
    repo: https://helm.cilium.io
    chart: cilium
    # renovate: datasource=helm depName=cilium registryUrl=https://helm.cilium.io
    version: 1.20.2
    release: cilium
    namespace: kube-system
    values: infrastructure/cilium/values.yaml
