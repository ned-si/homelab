# CI rehearsal only: traffic through a Cilium Gateway to the `smoke` Service,
# so a Gateway that is Programmed without an Envoy listener fails the run
# (docs/postmortems/2026-10-23-gateway-cilium-xds.md). The check uses the
# ClusterIP; nothing announces the pool.
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: rehearsal
spec:
  blocks:
    - cidr: 10.99.0.0/28
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rehearsal
  namespace: smoke
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: smoke
  namespace: smoke
spec:
  parentRefs:
    - name: rehearsal
  rules:
    - backendRefs:
        - name: smoke
          port: 80
