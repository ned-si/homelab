---
# Build dashboard/ and push ghcr.io/ned-si/homelab-dashboard:<sha> for
# linux/arm64 and linux/amd64 with an SBOM and provenance, signed keyless,
# then tag the signed digest :main
# (.kiro/specs/homelab-dashboard/design.md#publishing). Renovate sees the new
# digest of :main and opens the pull request that deploys it. A failure
# deploys nothing; the running image stays.
name: dashboard-publish

on:
  push:
    branches: [main]
    paths:
      - dashboard/**
      - .github/workflows/dashboard-publish.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: dashboard-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ned-si/homelab-dashboard

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature and the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pushfixture for the smoke test; the module cache is keyed on go.sum.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum

      # The image for the runner's platform, run as the cluster will run it
      # (read-only root, non-root, a mounted public key), before anything is
      # pushed. The key pair is thrown away with the runner.
      - name: Smoke-test the image
        working-directory: dashboard
        env:
          SHA: ${{ github.sha }}
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load --build-arg "VERSION=$SHA" -t dashboard:smoke .
          [ "$(docker run --rm dashboard:smoke version)" = "$SHA" ] || { echo "version does not print the commit"; exit 1; }
          keys=$(mktemp -d)
          go run ./internal/tools/pushfixture keygen "$keys"
          chmod 0644 "$keys/public-keys"
          docker run -d --name web --read-only \
            -p 127.0.0.1:8080:8080 -p 127.0.0.1:9465:9465 -p 127.0.0.1:9464:9464 \
            -v "$keys/public-keys:/etc/homelab-dashboard/public-keys:ro" dashboard:smoke web
          for _ in $(seq 1 20); do curl -fs -m 2 -o /dev/null http://127.0.0.1:9464/healthz && break; sleep 1; done
          rc=0
          code() { curl -s -m 5 -o /dev/null -w '%{http_code}' "$@"; }
          [ "$(code http://127.0.0.1:9464/readyz)" = 503 ] || { echo "/readyz is ready before a snapshot"; rc=1; }
          unsigned=$(code -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:9465/v1/snapshot)
          [ "$unsigned" = 401 ] || { echo "an unsigned push is $unsigned, not 401"; rc=1; }
          go run ./internal/tools/pushfixture push "$keys/private-key" http://127.0.0.1:9465 || rc=1
          [ "$(code http://127.0.0.1:9464/readyz)" = 200 ] || { echo "/readyz is not 200 after a push"; rc=1; }
          [ "$(code http://127.0.0.1:8080/)" = 200 ] || { echo "GET / is not 200"; rc=1; }
          [ "$(code -X POST http://127.0.0.1:8080/)" = 405 ] || { echo "POST / is not 405"; rc=1; }
          [ "$(code http://127.0.0.1:8080/nope)" = 404 ] || { echo "a missing page is not 404"; rc=1; }
          curl -sS -m 5 -D - -o /dev/null http://127.0.0.1:8080/ | tr -d '\r' | sort > "$keys/headers"
          # Every header the web tests assert, as the image serves it.
          while IFS= read -r h; do
            grep -qxF "$h" "$keys/headers" || { echo "GET / lacks: $h"; rc=1; }
          done < internal/web/testdata/headers.golden
          docker logs web
          docker rm -f web >/dev/null
          rm -rf "$keys"
          exit "$rc"

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # The default docker driver rejects --sbom/--provenance and a
      # multi-platform push; the smoke test keeps it because a
      # docker-container builder does not --load.
      - name: Create the attestation builder
        run: docker buildx create --name attest --driver docker-container

      # Go cross-compiles in the builder stage, so no emulation here. Only
      # :<sha>: Renovate follows :main, which is tagged once the digest is
      # signed and verified.
      - name: Build and push linux/arm64 and linux/amd64
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build --builder attest --platform linux/arm64,linux/amd64 --push \
            --sbom=true --provenance=mode=max --build-arg "VERSION=$SHA" \
            --label org.opencontainers.image.source=https://github.com/ned-si/homelab \
            --label "org.opencontainers.image.revision=$SHA" \
            -t "$IMAGE:$SHA" dashboard
          digest=$(docker buildx imagetools inspect "$IMAGE:$SHA" --format '{{json .Manifest}}' | jq -r .digest)
          echo "DIGEST=$digest" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      # The index holds both platforms, and the arm64 binary runs.
      - name: Check the pushed index
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          platforms=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | join(",")')
          echo "$IMAGE:$SHA@$DIGEST ($platforms)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$platforms" = linux/amd64,linux/arm64 ]
          [ "$(docker run --rm --platform linux/arm64 "$IMAGE@$DIGEST" version)" = "$SHA" ]

      # A signed SLSA v1 provenance next to BuildKit's unsigned one, for
      # `gh attestation verify oci://$IMAGE@<digest> --owner ned-si`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      # The provenance names this workflow on main and a GitHub-hosted runner:
      # the builder the dashboard states for SLSA Build L2
      # (.kiro/specs/homelab-dashboard/design.md#which-slsa-build-level).
      - name: Verify the provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$IMAGE@$DIGEST" --owner ned-si --bundle-from-oci \
            --signer-workflow ned-si/homelab/.github/workflows/dashboard-publish.yaml --source-ref refs/heads/main \
            --deny-self-hosted-runners --format json > "$RUNNER_TEMP/provenance.json"
          builder=$(jq -r '[.[].verificationResult.statement.predicate.runDetails.builder.id] | unique | join(",")' "$RUNNER_TEMP/provenance.json")
          want="https://github.com/ned-si/homelab/.github/workflows/dashboard-publish.yaml@refs/heads/main"
          [ "$builder" = "$want" ] || { echo "provenance builder is $builder, want $want"; exit 1; }
          echo "provenance verified: $builder, GitHub-hosted runner" | tee -a "$GITHUB_STEP_SUMMARY"

      # The cosign pin lives in ci.yaml's env, as for site-publish.
      - name: Install the pinned cosign
        run: |
          set -euo pipefail
          COSIGN_VERSION=$(sed -n 's/^  COSIGN_VERSION: *//p' .github/workflows/ci.yaml)
          COSIGN_SHA256=$(sed -n 's/^  COSIGN_SHA256: *//p' .github/workflows/ci.yaml)
          export COSIGN_VERSION COSIGN_SHA256
          scripts/ci/install-tool.sh cosign
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Keyless with the workflow's OIDC identity, classic .sig tag with the
      # Rekor bundle: the format Kyverno and the inventory read
      # (.kiro/specs/image-provenance/design.md#signing-the-site-image-task-2).
      - name: Sign and verify the index digest
        run: |
          set -euo pipefail
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "$IMAGE@$DIGEST"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/ned-si/homelab/.github/workflows/dashboard-publish.yaml@refs/heads/main" \
            "$IMAGE@$DIGEST" >/dev/null
          echo "signed and verified $IMAGE@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Tag the signed digest as main
        run: docker buildx imagetools create -t "$IMAGE:main" "$IMAGE@$DIGEST"

      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io

      # A copy of the site-publish step: priority low, held in quiet hours
      # (docs/sre.md). The topic is the secret.
      - name: Notify ntfy on failure
        if: ${{ failure() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          delay=$(scripts/ci/ntfy-quiet-delay.sh)
          curl -fsS -m 10 -o /dev/null ${delay:+-H "Delay: ${delay}m"} \
            -H "Title: dashboard-publish failed" -H "Priority: low" -H "Tags: warning" \
            -H "Click: $RUN_URL" \
            -d "dashboard-publish failed on ${SHA:0:7}; nothing deployed; see $RUN_URL" \
            "https://ntfy.sh/$NTFY_TOPIC"
