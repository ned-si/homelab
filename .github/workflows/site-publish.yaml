---
# Build the blog under site/ and push ghcr.io/ned-si/homelab-site:main and
# :<sha> for linux/arm64 with a signed SLSA provenance
# (.kiro/specs/public-website/design.md#publishing-flow).
# Renovate sees the new digest of :main and opens the digest pull request that
# deploys it. A failure deploys nothing; the running site stays.
name: site-publish

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/site-publish.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ned-si/homelab-site

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature and the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Hugo pin lives in ci.yaml's env, as for the site job.
      - name: Install the pinned Hugo
        run: |
          set -euo pipefail
          HUGO_VERSION=$(sed -n 's/^  HUGO_VERSION: *//p' .github/workflows/ci.yaml)
          HUGO_SHA256=$(sed -n 's/^  HUGO_SHA256: *//p' .github/workflows/ci.yaml)
          export HUGO_VERSION HUGO_SHA256
          scripts/ci/install-tool.sh hugo

      - name: Build the site
        run: hugo --source site --destination "$GITHUB_WORKSPACE/site/public" --minify --panicOnWarning --gc

      # The same Dockerfile for the runner's platform, run as the cluster runs
      # it (read-only root, /tmp writable, apps/website/nginx.conf), before
      # anything is pushed.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load -t site:smoke site
          docker run -d --name site --read-only --tmpfs /tmp -p 127.0.0.1:8080:8080 \
            -v "$GITHUB_WORKSPACE/apps/website/nginx.conf:/etc/nginx-site/nginx.conf:ro" \
            site:smoke nginx -c /etc/nginx-site/nginx.conf -g 'daemon off;'
          code() { curl -s -m 5 -o /dev/null -w '%{http_code}' "$@" http://127.0.0.1:8080/; }
          for _ in $(seq 1 20); do [ "$(code)" = 200 ] && break; sleep 1; done
          rc=0
          [ "$(code)" = 200 ] || { echo "GET / is not 200"; rc=1; }
          [ "$(code -X POST)" = 405 ] || { echo "POST / is not 405"; rc=1; }
          [ "$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no-such-page)" = 404 ] || { echo "a missing page is not 404"; rc=1; }
          docker logs site
          docker rm -f site >/dev/null
          exit "$rc"

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # The default docker driver rejects --sbom/--provenance; the smoke test
      # keeps it because a docker-container builder does not --load.
      - name: Create the attestation builder
        run: docker buildx create --name attest --driver docker-container

      # Only :<sha> here: Renovate follows :main, which is tagged once the
      # digest is signed and verified.
      - name: Build and push linux/arm64
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build --builder attest --platform linux/arm64 --push \
            --sbom=true --provenance=mode=max \
            --label org.opencontainers.image.source=https://github.com/ned-si/homelab \
            --label "org.opencontainers.image.revision=$SHA" \
            -t "$IMAGE:$SHA" site
          digest=$(docker buildx imagetools inspect "$IMAGE:$SHA" --format '{{json .Manifest}}' | jq -r .digest)
          echo "DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Check the pushed image is linux/arm64
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull -q --platform linux/arm64 "$IMAGE@$DIGEST" >/dev/null
          platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE@$DIGEST")
          echo "$IMAGE:$SHA@$DIGEST ($platform)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$platform" = linux/arm64 ]
      # A signed SLSA v1 provenance next to BuildKit's unsigned one, as in
      # dashboard-publish.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      # The provenance names this workflow on main and a GitHub-hosted runner:
      # the builder the dashboard states for SLSA Build L2
      # (.kiro/specs/homelab-dashboard/design.md#which-slsa-build-level).
      - name: Verify the provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$IMAGE@$DIGEST" --owner ned-si --bundle-from-oci \
            --signer-workflow ned-si/homelab/.github/workflows/site-publish.yaml --source-ref refs/heads/main \
            --deny-self-hosted-runners --format json > "$RUNNER_TEMP/provenance.json"
          builder=$(jq -r '[.[].verificationResult.statement.predicate.runDetails.builder.id] | unique | join(",")' "$RUNNER_TEMP/provenance.json")
          want="https://github.com/ned-si/homelab/.github/workflows/site-publish.yaml@refs/heads/main"
          [ "$builder" = "$want" ] || { echo "provenance builder is $builder, want $want"; exit 1; }
          echo "provenance verified: $builder, GitHub-hosted runner" | tee -a "$GITHUB_STEP_SUMMARY"

      # The cosign pin lives in ci.yaml's env, as the Hugo pin.
      - name: Install the pinned cosign
        run: |
          set -euo pipefail
          COSIGN_VERSION=$(sed -n 's/^  COSIGN_VERSION: *//p' .github/workflows/ci.yaml)
          COSIGN_SHA256=$(sed -n 's/^  COSIGN_SHA256: *//p' .github/workflows/ci.yaml)
          export COSIGN_VERSION COSIGN_SHA256
          scripts/ci/install-tool.sh cosign
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Keyless with the workflow's OIDC identity, classic .sig tag with the
      # Rekor bundle: the format Kyverno and the inventory read
      # (.kiro/specs/image-provenance/design.md#signing-the-site-image-task-2).
      - name: Sign and verify the index digest
        run: |
          set -euo pipefail
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "$IMAGE@$DIGEST"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/ned-si/homelab/.github/workflows/site-publish.yaml@refs/heads/main" \
            "$IMAGE@$DIGEST" >/dev/null
          echo "signed and verified $IMAGE@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Tag the signed digest as main
        run: docker buildx imagetools create -t "$IMAGE:main" "$IMAGE@$DIGEST"

      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io

      # A copy of the renovate-render step: one place for alerts, priority
      # low, held in quiet hours (docs/sre.md). The topic is the secret.
      - name: Notify ntfy on failure
        if: ${{ failure() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          delay=$(scripts/ci/ntfy-quiet-delay.sh)
          curl -fsS -m 10 -o /dev/null ${delay:+-H "Delay: ${delay}m"} \
            -H "Title: site-publish failed" -H "Priority: low" -H "Tags: warning" \
            -H "Click: $RUN_URL" \
            -d "site-publish failed on ${SHA:0:7}; nothing deployed; see $RUN_URL" \
            "https://ntfy.sh/$NTFY_TOPIC"
