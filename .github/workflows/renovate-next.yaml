---
# renovate-next: one Renovate pull request rebased at a time
# (scripts/ci/renovate-next.sh), after each push to main and on a schedule
# that restarts the train after a failed ci. scripts/pr-merge.sh pauses it
# (RENOVATE_TRAIN_PAUSED) and dispatches it on pause and resume.
name: renovate-next

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

# One decision at a time; a push during a run queues behind it.
concurrency:
  group: renovate-next
  cancel-in-progress: false

jobs:
  next:
    name: Rebase the next Renovate pull request
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      # Turning auto-merge on needs both. Such a merge triggers no push
      # workflows; the schedule restarts the train.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pick and rebase
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Set by scripts/pr-merge.sh while it holds its merge lock.
          RENOVATE_TRAIN_PAUSED: ${{ vars.RENOVATE_TRAIN_PAUSED }}
        run: |
          line=$(scripts/ci/renovate-next.sh)
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
