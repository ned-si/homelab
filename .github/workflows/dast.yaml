---
# DAST: dynamic scanning of the running site.
#
# NOT A PR GATE. DAST exercises a running application over HTTP. A pull request
# has nothing running (no preview environment), so a PR-triggered job would
# either scan production on behalf of an arbitrary PR or scan nothing and report
# green. It runs weekly and on demand, from a GitHub-hosted runner, against the
# public hostnames.
#
# FINDINGS STAY PRIVATE. Workflow logs, step summaries and artifacts of a public
# repository are public, so:
#   - nothing ZAP or tls-check prints reaches the log; it goes to files under
#     $RUNNER_TEMP, which are never uploaded as artifacts;
#   - the log shows counts only;
#   - findings are uploaded as SARIF to code scanning, whose alerts only people
#     with write access to the repository can see (Security tab);
#   - no issues, comments or artifacts are created.
#
# WHAT GATES
#   zap  any HIGH alert fails the job, by count. The accepted baseline is zero
#        HIGH: a HIGH that is accepted gets an IGNORE row with its reason in
#        .zap/rules.tsv, so every HIGH that reaches the gate is new. Medium and
#        below are reported only.
#   tls  scripts/tls-check.sh hard-fails on reachability, a missing
#        http -> https redirect and certificate expiry. Its header checks are
#        warnings until STRICT_HEADERS=1 (see .zap/rules.tsv).
#
# The targets sit behind Keycloak, so an unauthenticated baseline scan mostly
# checks headers, TLS and error handling: exactly what regresses silently when
# routing changes.
name: dast

on:
  schedule:
    # Sunday 03:00 UTC.
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      target:
        description: "Single published hostname to scan (default: all of them)"
        required: false
        type: string
      full_scan:
        description: Active scan (SENDS ATTACK TRAFFIC). Baseline if false.
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: dast
  cancel-in-progress: true

jobs:
  dast:
    name: ZAP + TLS
    runs-on: ubuntu-24.04
    # One host after the other: concurrent scans against one Gateway on four
    # SBCs would be a self-inflicted denial of service.
    timeout-minutes: 180
    permissions:
      contents: read
      # upload-sarif writes code scanning alerts.
      security-events: write
    env:
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Derived from deploy/, never listed by hand. published-hostnames.sh
      # exits non-zero on an empty result, so a broken extractor fails here
      # instead of scanning nothing and reporting green.
      - name: Select targets
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          all=$(scripts/published-hostnames.sh)
          if [ -n "$TARGET" ]; then
            if ! grep -qxF -- "$TARGET" <<<"$all"; then
              echo "::error::target is not a published hostname"
              exit 1
            fi
            printf '%s\n' "$TARGET" >"$RUNNER_TEMP/hosts.txt"
          else
            printf '%s\n' "$all" >"$RUNNER_TEMP/hosts.txt"
          fi
          echo "targets: $(wc -l <"$RUNNER_TEMP/hosts.txt") hostname(s)"

      - name: ZAP scan (output kept off the log)
        id: zap
        env:
          FULL_SCAN: ${{ inputs.full_scan }}
        run: scripts/dast-zap.sh "$RUNNER_TEMP/hosts.txt" "$RUNNER_TEMP/zap"

      - name: Convert to SARIF (prints counts only)
        id: sarif
        if: ${{ !cancelled() }}
        run: python3 scripts/zap_sarif.py --rules .zap/rules.tsv --out "$RUNNER_TEMP/zap.sarif" "$RUNNER_TEMP/zap"

      - name: Upload to code scanning (private to maintainers)
        if: ${{ !cancelled() && steps.sarif.outputs.written == 'true' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/zap.sarif
          category: dast-zap

      - name: Gate on new HIGH alerts
        if: ${{ !cancelled() && steps.sarif.outcome == 'success' }}
        env:
          HIGH: ${{ steps.sarif.outputs.high }}
        run: |
          if [ "$HIGH" -gt 0 ]; then
            echo "::error::$HIGH HIGH alert(s); see the Security tab (code scanning, category dast-zap)"
            exit 1
          fi
          echo "no HIGH alerts"

      # Its output names hosts and missing headers, so it goes to a file and
      # only the counts are printed. Run it locally for the details.
      - name: TLS, redirect and certificate expiry (gate)
        if: ${{ !cancelled() }}
        run: |
          # No -e: the exit code and the zero-match greps are handled below.
          set +e -u
          scripts/tls-check.sh >"$RUNNER_TEMP/tls.log" 2>&1
          rc=$?
          hard=$(grep -cE 'UNREACHABLE|redirect missing|cert expires in|could not (read|parse)' "$RUNNER_TEMP/tls.log")
          warn=$(grep -c 'MISSING (warning' "$RUNNER_TEMP/tls.log")
          echo "tls-check: exit $rc, $hard hard failure(s), $warn header warning(s)"
          if [ "$rc" -ne 0 ]; then
            echo "::error::tls-check failed; run scripts/tls-check.sh locally for the details"
          fi
          exit "$rc"
