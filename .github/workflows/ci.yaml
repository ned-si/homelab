---
# CI: everything that can be verified WITHOUT a cluster.
#
# Runs on every PR and on pushes to main. Nothing here touches the homelab, so
# it works from GitHub-hosted runners with no network path into the house.
#
# What is deliberately NOT here:
#   - DAST     needs a running application. See dast.yaml (scheduled, self-hosted).
#   - deploy   see cd.yaml (requires a runner that can reach the cluster).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.*)$
  KUSTOMIZE_VERSION: "5.7.1"
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: "v0.7.0"
  # The renderer for deploy/. `scripts/render-deploy.sh` uses `kubectl kustomize`,
  # so the kustomize version embedded in THIS kubectl decides the bytes that end
  # up in deploy/. It is pinned because checked-in generated output is only
  # meaningful if the generator is deterministic; a different version produces a
  # formatting diff that looks like a stale render.
  #
  # NOT the same thing as K8S_VERSION below. This never contacts the cluster.
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  KUBECTL_VERSION: "v1.36.3"
  # The Kubernetes version to validate manifests against. Bump this alongside a
  # real cluster upgrade, not before -- validating against a newer API than the
  # cluster runs would pass here and fail on sync.
  #
  # VERIFIED against the live cluster on 2026-07-31: the nodes run v1.31.2.
  # An earlier draft said 1.34.0, which would have validated manifests against
  # APIs this cluster does not serve.
  K8S_VERSION: "1.31.2"

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # conventional-commit checking needs the PR's commits, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install pre-commit

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install kustomize
        run: |
          curl -sSLo /tmp/k.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/k.tar.gz -C /usr/local/bin kustomize

      # Pinned, because this is what renders deploy/. See the env block.
      - name: Install kubectl
        run: |
          curl -sSLo /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl
          kubectl version --client -o json | grep kustomizeVersion

      # Runs yamllint, shellcheck, gitleaks, tofu fmt, leak-check,
      # renovate-dryrun, render-check and render-deploy in one pass -- the same
      # set a developer gets locally, so CI cannot disagree with pre-commit.
      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  # ---------------------------------------------------------------------------
  commit-messages:
    name: conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check every commit in the PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert|security)(\([a-z0-9._/-]+\))?!?: .{1,}'
          rc=0
          while read -r sha; do
            msg=$(git log -1 --format=%s "$sha")
            # Merge commits are generated by GitHub and are exempt.
            case "$msg" in "Merge "*) continue ;; esac
            if ! printf '%s' "$msg" | grep -qE "$pattern"; then
              echo "::error::not a conventional commit: $sha  $msg"
              rc=1
            else
              echo "ok: $msg"
            fi
          done < <(git rev-list "$BASE..$HEAD")
          exit $rc

  # ---------------------------------------------------------------------------
  rendered-manifests:
    name: deploy/ matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install kubectl (pinned -- it is the renderer)
        run: |
          curl -sSLo /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl

      # deploy/ is build output. If it does not match what the sources produce,
      # then what Argo applies is not what the repo says, which defeats the whole
      # arrangement. This is the check that keeps deploy/ honest.
      - name: deploy/ is up to date
        run: ./scripts/render-deploy.sh --check

  # ---------------------------------------------------------------------------
  validate:
    name: manifest schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      # Validates deploy/ rather than re-rendering the sources, because deploy/
      # is what Argo actually applies. The `rendered-manifests` job above proves
      # deploy/ is derived from the sources, so this covers both.
      #
      # The three SOPS directories are not in deploy/ and cannot be validated
      # here: the age key is not available to CI and must never be. That gap is
      # covered by `task build` locally, where the key exists.
      - name: Validate rendered manifests
        run: |
          set -euo pipefail
          find deploy -name 'manifests.yaml' -print0 \
          | xargs -0 kubeconform \
              -strict \
              -summary \
              -kubernetes-version "${K8S_VERSION}" \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -ignore-missing-schemas

  # ---------------------------------------------------------------------------
  sast:
    name: SAST (IaC + manifests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      # Trivy in config mode covers Kubernetes manifests, Helm values,
      # Dockerfiles and Terraform in one pass.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          # Fail the build only on things worth blocking a merge for. Homelab
          # manifests trip a lot of LOW/MEDIUM "not production hardened" rules
          # that would make this gate noise rather than signal.
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-config

      # kube-linter checks workload-level practices Trivy does not: missing
      # probes, unset resource limits, latest tags, dangling Service selectors.
      - name: kube-linter
        uses: stackrox/kube-linter-action@v1.0.7
        with:
          directory: .
          config: .kube-linter.yaml
          format: sarif
          output-file: kube-linter.sarif

      - name: Upload kube-linter SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: kube-linter.sarif
          category: kube-linter

  # ---------------------------------------------------------------------------
  # A single required check, so branch protection needs one entry rather than
  # being updated every time a job is added.
  ci-passed:
    name: ci
    runs-on: ubuntu-latest
    needs: [lint, rendered-manifests, validate, sast]
    if: always()
    steps:
      - name: Fail if any dependency failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "results: $results"
          for r in $results; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || exit 1
          done
