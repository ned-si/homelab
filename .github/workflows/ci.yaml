---
# CI: every check that needs no live cluster, for the layered
# clusters/ apps/ platform/ infrastructure/ deploy/ tree Argo CD syncs.
#
# Parallel jobs, then one aggregate:
#   lint         pre-commit hooks, yamllint, actionlint, shellcheck,
#                tofu fmt + validate
#   render       unit tests, promtool (rule checks and rule unit tests),
#                Alertmanager routing and inhibition tests,
#                render, kubeconform, Kyverno policies over deploy/,
#                repo-policy (pins, invariants,
#                secrets/leak/placeholder checks, deploy/ matches sources,
#                kube-linter)
#   security     gitleaks, Trivy waiver hygiene, Trivy gate
#   talos        talhelper genconfig with throwaway secrets, talosctl validate
#                --mode metal, config invariants (scripts/ci/talos-validate.sh),
#                and the plan for talos-upgrade
#   talos-upgrade  only when a Talos or Kubernetes version changes: a QEMU
#                Talos cluster upgraded from main's versions to the pull
#                request's (scripts/ci/talos-upgrade-rehearsal.sh)
#   pr-metadata  PR title and commits (pull requests only, skipped on push)
#   preprod      ephemeral kind cluster: CRDs, server-side dry-run of deploy/,
#                stateless workloads booted and checked for readiness
#   ci           needs all of them, runs always, and fails unless every one
#                succeeded (pr-metadata may be skipped outside a pull request,
#                talos-upgrade when no rehearsal is planned).
# Inside a job every check runs even when an earlier one failed
# (`!cancelled()`), and any failed step fails the job. `ci` is the only check
# name scripts/pr-merge.sh and branch protection require.
#
# Pinning rules (enforced by scripts/ci/check-pins.sh in the repo-policy step):
#   - every remote `uses:` is a 40-hex commit SHA with a `# vX.Y.Z` comment;
#   - every binary is downloaded by exact version and verified against the
#     sha256 below (scripts/ci/install-tool.sh), never `latest`;
#   - Python tools come from ci/requirements-ci.txt with `--require-hashes`;
#   - core Kubernetes schemas come from one pinned commit, CRD schemas from the
#     vendored ci/schemas/ (no -ignore-missing-schemas).
# Never `pull_request_target`; `permissions: {}` at the top, each job asks for
# the minimum; no checkout persists the token. Rendered manifests are
# never uploaded or printed: legacy inline Helm values contain credentials.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    # A manual run always runs talos-upgrade: from main's versions (or these)
    # to the dispatched ref's.
    inputs:
      from_talos:
        description: Talos version to start the upgrade rehearsal from (default main's)
        type: string
        default: ""
      from_kubernetes:
        description: Kubernetes version to start the upgrade rehearsal from (default main's)
        type: string
        default: ""

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Kubernetes version the manifests are validated against: the live cluster's.
  # Bumped only in the PR that records a cluster upgrade; repo-policy
  # (k8s-version-match) keeps its minor on kubernetesVersion in
  # talos/talconfig.yaml.
  K8S_VERSION: "1.37.1"
  # yannh/kubernetes-json-schema commit (2026-09-29) used for core schemas.
  KUBE_SCHEMA_SHA: 8df8a883b68a24a104b4a9e43c1288090ae60b3b
  KUBECONFORM_VERSION: v0.7.0
  KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  GITLEAKS_VERSION: 8.30.0
  GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
  # trivy is installed by install-tool.sh, so the binary is covered by the
  # checksum rule. v0.70.0 is after the 2026-03 compromised releases
  # (0.69.4-0.69.6).
  TRIVY_VERSION: 0.70.0
  TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
  KUBE_LINTER_VERSION: v0.8.3
  KUBE_LINTER_SHA256: 1a6d8419b11971372971fdbc22682b684ebfb7cf1c39591662d1b6ca736c41df
  KYVERNO_VERSION: v1.19.1
  KYVERNO_SHA256: b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae
  HELM_VERSION: v3.22.0
  HELM_SHA256: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb
  # kubectl is the kustomize renderer: v1.36.3 embeds kustomize v5.8.1, the
  # EXPECT_KUSTOMIZE of scripts/render-deploy.sh in the layered tree.
  KUBECTL_VERSION: v1.36.3
  KUBECTL_SHA256: ebbd080e7c2e275093b55915722043257eb24004363e20acb3c4d71919f88336
  # kind v0.33.0 ships a node image of the cluster's minor (1.37); the image is
  # pinned by digest from its release notes. repo-policy (k8s-version-match)
  # keeps its minor on talos/talconfig.yaml.
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  TOFU_VERSION: 1.12.6
  TOFU_SHA256: 50a6106fa4de523d09c87af85f3db1dd47535fc005727fdca6852146476b88ec
  # promtool from the Prometheus release the cluster runs (rule checks and
  # rule unit tests, scripts/ci/promtool-check.sh).
  PROMTOOL_VERSION: 3.15.0
  PROMTOOL_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
  # alertmanager + amtool from the release the cluster runs (routing and
  # inhibition tests, scripts/ci/alertmanager-test.sh).
  ALERTMANAGER_VERSION: 0.34.1
  ALERTMANAGER_SHA256: 265b9d1e55ef0d5306a436018af6d2b686c2ce051f03d968f7464ecb1372a7e8
  TALHELPER_VERSION: v3.1.17
  TALHELPER_SHA256: dff9162569004637b6a842c4020d909b0ffbc7fbbe2fca23a754708db95be204
  # talosctl validates the generated configs and runs the upgrade rehearsal:
  # keep it on talosVersion in talos/talconfig.yaml (by hand, with the sha256,
  # after Renovate's bump has merged).
  TALOSCTL_VERSION: v1.14.2
  TALOSCTL_SHA256: c6c9552b0e5f767352c595fa1c0af4f186f697488646872955057d23990a66c4
  # One checkout serves every step of a job: keep it free of bytecode and
  # pytest caches so no check sees another check's leftovers.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        id: setup
        run: |
          set -euo pipefail
          scripts/ci/install-tool.sh actionlint shellcheck tofu
          scripts/ci/setup-python-deps.sh

      # Hook environments (pre-commit-hooks, the renovate npm package) are
      # keyed on the config that pins them.
      - name: Cache pre-commit environments
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # .pre-commit-config.yaml is the one list of local checks. SKIP names the
      # hooks a dedicated CI step runs with the same script or pinned binary
      # (tests/test_precommit_parity.py keeps the two in line).
      - name: pre-commit (hooks without a dedicated step)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          SKIP: gitleaks,yamllint,shellcheck,terraform_fmt,actionlint,kyverno,leak-check,placeholder-check,secrets-check,trivy-waivers,render-deploy
        run: pre-commit run --all-files --show-diff-on-failure --color always

      - name: yamllint (strict)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: yamllint -c .yamllint.yaml .

      - name: actionlint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: actionlint -color

      - name: shellcheck every shell script
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/ci/shellcheck-all.sh

      # Last: `tofu init` writes .terraform/ into the checkout.
      - name: tofu fmt
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: tofu fmt -check -recursive -diff

      - name: tofu init + validate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          # -backend=false: no AWS credentials or state passphrase in CI.
          for d in bootstrap bootstrap/aws-backup bootstrap/github-oidc bootstrap/tofu-state; do
            if [ -d "$d" ] && ls "$d"/*.tf >/dev/null 2>&1; then
              echo "::group::$d"
              (cd "$d" && tofu init -backend=false -input=false -no-color && tofu validate -no-color)
              echo "::endgroup::"
            fi
          done

  render:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        id: setup
        run: |
          set -euo pipefail
          scripts/ci/install-tool.sh helm kubectl kubeconform kube-linter promtool alertmanager kyverno
          scripts/ci/setup-python-deps.sh

      - name: Unit tests (pytest)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python -m pytest -q -p no:cacheprovider tests

      - name: Unit tests (bash)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash tests/run-bash-tests.sh

      - name: Prometheus rules (promtool check + unit tests)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/ci/promtool-check.sh

      - name: Alertmanager routing (amtool + replayed outages)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/ci/alertmanager-test.sh

      # Rendered once; kubeconform and repo-policy read the same directory.
      - name: Render every Application in scope
        id: render
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 scripts/ci/render_apps.py --out "$RUNNER_TEMP/render" | tee "$RUNNER_TEMP/render.log"
          { echo "### render"; echo '```'; cat "$RUNNER_TEMP/render.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: kubeconform (strict, pinned core schemas, vendored CRD schemas)
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        run: scripts/ci/kubeconform.sh "$RUNNER_TEMP/render"

      # Policy unit tests, then the policies over deploy/. Deny policies
      # block; Audit policies report in the step summary.
      - name: Kyverno policies (policies/kyverno over deploy/)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/ci/kyverno.sh

      # Pins, repository invariants, secrets/leak/placeholder checks, deploy/
      # matches its sources, kube-linter. With no render (the render step
      # failed) repo-policy renders by itself, so its other invariants still
      # run and report.
      - name: Repository policy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          RENDERED: ${{ steps.render.outcome }}
          # image-variant: compare image tag variants with the PR base.
          IMAGE_POLICY_BASE: ${{ github.event.pull_request.base.sha }}
          # Reverts skip image-variant (see repo_policy.py).
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$RENDERED" = "success" ]; then
            scripts/ci/repo-policy.sh "$RUNNER_TEMP/render"
          else
            scripts/ci/repo-policy.sh
          fi

  security:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans the new commits; the trivy delta gate scans the
          # merge-base in a worktree.
          fetch-depth: 0

      - name: Install pinned tools
        id: setup
        run: scripts/ci/install-tool.sh gitleaks trivy

      - name: gitleaks on the new commits only
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base=$PR_BASE; head=$PR_HEAD
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base=$PUSH_BEFORE; head=$SHA
          else
            base=$(git rev-parse origin/main); head=$SHA
          fi
          echo "scanning ${base}..${head}: $(git rev-list --count "${base}..${head}") commit(s)"
          gitleaks git --no-banner --redact --exit-code 1 --log-opts="${base}..${head}" .

      - name: Trivy waiver hygiene
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/trivy-waivers.sh

      # The gate prints its findings to the log and the step summary. There is
      # no SARIF upload: Code Scanning needs a public repository or GHAS, so on
      # this private repository the upload failed on every run (45 s each).
      # Re-add trivy-action + upload-sarif if the repository becomes public.
      - name: Trivy gate (CRITICAL on presence, HIGH on delta vs merge-base)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          TRIVY_GATE_SUMMARY: ${{ runner.temp }}/trivy-summary.md
        run: scripts/trivy-gate.sh

      - name: Trivy summary
        if: ${{ !cancelled() }}
        env:
          SUMMARY: ${{ runner.temp }}/trivy-summary.md
        run: if [ -f "$SUMMARY" ]; then cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"; fi

  # Offline: throwaway secrets from `talhelper gensecret`, the schematic ID
  # computed locally (--offline-mode), no cluster. Generated configs stay in a
  # temp dir and are never printed or uploaded.
  talos:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      rehearse: ${{ steps.plan.outputs.rehearse }}
      force_talos: ${{ steps.plan.outputs.force_talos }}
      from_talos: ${{ steps.plan.outputs.from_talos }}
      from_kubernetes: ${{ steps.plan.outputs.from_kubernetes }}
      to_talos: ${{ steps.plan.outputs.to_talos }}
      to_kubernetes: ${{ steps.plan.outputs.to_kubernetes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        run: scripts/ci/install-tool.sh talhelper talosctl

      - name: talhelper genconfig + talosctl validate --mode metal
        run: scripts/ci/talos-validate.sh

      # Whether talos-upgrade runs, and between which versions.
      - name: Plan the upgrade rehearsal
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || 'main' }}
          INPUT_FROM_TALOS: ${{ inputs.from_talos }}
          INPUT_FROM_KUBERNETES: ${{ inputs.from_kubernetes }}
        run: scripts/ci/talos-upgrade-rehearsal.sh plan

  # Rehearsal of a Talos or Kubernetes version change
  # (scripts/ci/talos-upgrade-rehearsal.sh): a QEMU cluster at main's versions
  # with the repo's patches and Cilium, a smoke workload, `talosctl upgrade`
  # node by node and `talosctl upgrade-k8s` to the pull request's versions,
  # then nodes, Cilium and the workload are checked. Runs only when `talos`
  # plans it (a version or the rehearsal changes, or a manual run); `ci`
  # accepts it skipped otherwise. No secrets, no cluster credentials.
  talos-upgrade:
    needs: talos
    if: ${{ needs.talos.outputs.rehearse == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FROM_TALOS: ${{ needs.talos.outputs.from_talos }}
      FROM_KUBERNETES: ${{ needs.talos.outputs.from_kubernetes }}
      TO_TALOS: ${{ needs.talos.outputs.to_talos }}
      TO_KUBERNETES: ${{ needs.talos.outputs.to_kubernetes }}
      FORCE_TALOS: ${{ needs.talos.outputs.force_talos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools and QEMU
        run: |
          set -euo pipefail
          scripts/ci/install-tool.sh talosctl kubectl helm
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf > /dev/null
          sudo mkdir -p /var/run/netns
          test -c /dev/kvm

      - name: Create the cluster at the current versions, install Cilium
        run: scripts/ci/talos-upgrade-rehearsal.sh create

      - name: Smoke workload
        run: scripts/ci/talos-upgrade-rehearsal.sh smoke

      - name: Upgrade Talos node by node, then Kubernetes
        run: scripts/ci/talos-upgrade-rehearsal.sh upgrade

      - name: Nodes Ready, Cilium OK, workload answers
        run: scripts/ci/talos-upgrade-rehearsal.sh verify

      - name: Cluster state
        if: ${{ failure() }}
        run: scripts/ci/talos-upgrade-rehearsal.sh logs

      - name: Destroy the cluster
        if: ${{ always() }}
        run: scripts/ci/talos-upgrade-rehearsal.sh destroy

  pr-metadata:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      # check-commits.sh reads the PR's commits through the REST API.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: pr-title (Conventional Commits subject under 70 characters)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/ci/check-title.sh "$TITLE"

      - name: commits (every subject passes, every commit verified)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: scripts/ci/check-commits.sh "$REPO" "$PR"

  # Dynamic pre-production on an ephemeral kind cluster
  # (scripts/ci/kind-preprod.sh): the CRDs the repo uses, a server-side
  # dry-run of all of deploy/, then a set of stateless workloads booted for
  # real and checked for readiness. No cluster credentials: the cluster lives
  # and dies inside this job.
  preprod:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    # kind-preprod.sh caches under $RUNNER_TEMP/kind-cache.
    env:
      KIND_CLUSTER: preprod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        run: scripts/ci/install-tool.sh kind kubectl

      # CRD sources are keyed on their pinned list, images on the image list.
      - name: Cache keys
        id: keys
        run: |
          set -euo pipefail
          echo "images=$(scripts/ci/kind-preprod.sh images | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache CRD sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kind-cache/crd-sources
          key: kind-crds-${{ hashFiles('ci/schemas/SOURCES.txt') }}

      - name: Cache workload images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kind-cache/images.tar
          key: kind-images-${{ steps.keys.outputs.images }}

      # The node image is keyed on its pinned digest reference.
      - name: Cache the kind node image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kind-cache/node.tar
          key: kind-node-${{ env.KIND_NODE_IMAGE }}

      - name: Pull or load the kind node image
        run: scripts/ci/kind-preprod.sh node

      - name: Create the kind cluster
        run: kind create cluster --name "$KIND_CLUSTER" --image kindest/node:preprod --wait 120s

      - name: Install CRDs
        run: scripts/ci/kind-preprod.sh crds

      - name: Server-side dry-run of deploy/
        run: scripts/ci/kind-preprod.sh dry-run

      - name: Load workload images
        if: ${{ !cancelled() }}
        run: scripts/ci/kind-preprod.sh load

      - name: Boot stateless workloads and assert readiness
        if: ${{ !cancelled() }}
        run: scripts/ci/kind-preprod.sh boot

  # The one required check. `always()` so it reports even when a job above
  # failed; it fails unless every job succeeded, except pr-metadata, which may
  # be skipped outside a pull request, and talos-upgrade, which may be skipped
  # when `talos` did not plan a rehearsal.
  ci:
    if: ${{ always() }}
    needs: [lint, render, security, talos, talos-upgrade, pr-metadata, preprod]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REHEARSE: ${{ needs.talos.outputs.rehearse }}
        run: |
          set -euo pipefail
          rc=0
          for j in lint render security talos talos-upgrade pr-metadata preprod; do
            result=$(jq -r --arg j "$j" '.[$j].result // "missing"' <<<"$NEEDS")
            if [ "$result" = "success" ]; then
              echo "ok      $j"
            elif [ "$result" = "skipped" ] && [ "$j" = "pr-metadata" ] && [ "$EVENT" != "pull_request" ]; then
              echo "skipped $j (not a pull request)"
            elif [ "$result" = "skipped" ] && [ "$j" = "talos-upgrade" ] && [ "$REHEARSE" != "true" ]; then
              echo "skipped $j (no Talos or Kubernetes version change)"
            else
              echo "::error::$j: $result"
              rc=1
            fi
          done
          exit "$rc"
