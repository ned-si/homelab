---
# CI: everything that can be verified WITHOUT a cluster.
#
# Runs on every PR and on pushes to main. Nothing here touches the homelab, so
# it works from GitHub-hosted runners with no network path into the house.
#
# What is deliberately NOT here:
#   - DAST     needs a running application. See dast.yaml (scheduled, self-hosted).
#   - deploy   see cd.yaml (requires a runner that can reach the cluster).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: "v0.7.0"
  # The renderer for deploy/. `scripts/render-deploy.sh` uses `kubectl kustomize`,
  # so the kustomize version embedded in THIS kubectl decides the bytes that end
  # up in deploy/. It is pinned because checked-in generated output is only
  # meaningful if the generator is deterministic; a different version produces a
  # formatting diff that looks like a stale render.
  #
  # There is deliberately no standalone KUSTOMIZE_VERSION. Nothing in CI invokes
  # the `kustomize` binary -- render-deploy.sh, render-check.sh and
  # dryrun-server.sh all use `kubectl kustomize`. A second pin here tracked a
  # dependency the pipeline does not have and generated Renovate PRs forever.
  #
  # `scripts/render-deploy.sh` holds the single source of truth for the EMBEDDED
  # kustomize version (EXPECT_KUSTOMIZE) and hard-fails in --check mode when this
  # kubectl does not carry it. So bumping KUBECTL_VERSION is a two-line change:
  # this pin, and EXPECT_KUSTOMIZE, followed by a re-render.
  #
  # NOT the same thing as K8S_VERSION below. This never contacts the cluster.
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  KUBECTL_VERSION: "v1.36.3"
  # The Kubernetes version to validate manifests against. Bump this alongside a
  # real cluster upgrade, not before -- validating against a newer API than the
  # cluster runs would pass here and fail on sync.
  #
  # VERIFIED against the live cluster on 2026-07-31: the nodes run v1.31.2.
  # An earlier draft said 1.34.0, which would have validated manifests against
  # APIs this cluster does not serve.
  K8S_VERSION: "1.31.2"

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, not a shallow clone: the gitleaks hook is history-aware,
          # and pre-commit-terraform decides whether it is "running on the whole
          # repo" by consulting git. Commit messages are checked in the
          # `commit-messages` job below, not here.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install pre-commit

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # No kubectl here on purpose. The only hook that needed it was
      # render-deploy, which is skipped below; `rendered-manifests` installs the
      # pinned one and owns that check.

      # Runs yamllint, shellcheck, gitleaks, terraform_fmt, leak-check,
      # placeholder-check, secrets-check and renovate-dryrun in one pass -- the
      # same set a developer gets locally, so CI cannot disagree with pre-commit.
      #
      # SKIP=render-deploy is the one deliberate difference. That hook renders the
      # entire tree and writes deploy/; the `rendered-manifests` job below runs
      # the same script with `--check`, which is the answer CI actually needs.
      # Running both was two full renders per CI run for one fact.
      - name: pre-commit
        env:
          SKIP: render-deploy
        run: pre-commit run --all-files --show-diff-on-failure

      # secrets-check is a WARNING inside pre-commit so the owner can commit
      # before the *.sops.yaml files exist (see scripts/secrets-check.sh). It is
      # still worth surfacing as a workflow annotation, because "every layer
      # stalls at sync-wave -25" is not a thing to discover on the cluster.
      #
      # Kept non-fatal here on purpose: making it fatal is a one-line change to
      # SECRETS_CHECK_STRICT below, to be made when Phase 1 starts.
      - name: KSOPS secret files (advisory)
        if: always()
        env:
          SECRETS_CHECK_STRICT: "0"
        run: ./scripts/secrets-check.sh

  # ---------------------------------------------------------------------------
  commit-messages:
    name: conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install pre-commit

      # There is ONE list of allowed commit types, and it lives in
      # .pre-commit-config.yaml. This job used to carry its own regex, which
      # drifted: the local hook accepted `security` and the CI pattern did not,
      # so a commit could pass locally and fail here. Running the same hook
      # through pre-commit makes drift impossible by construction.
      #
      # Rejected alternative: parsing the type list out of the YAML with yq and
      # rebuilding the regex. That is a second implementation of the same rule
      # and would disagree with conventional-pre-commit's own edge cases
      # (scopes, `!`, reverts).
      - name: Check every commit in the PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          msgfile=$(mktemp)
          trap 'rm -f "$msgfile"' EXIT
          rc=0
          while read -r sha; do
            git log -1 --format=%B "$sha" >"$msgfile"
            subject=$(git log -1 --format=%s "$sha")
            # Merge commits are generated by GitHub and are exempt.
            case "$subject" in "Merge "*) continue ;; esac
            # Output captured and printed on failure rather than discarded: the
            # first invocation also builds the hook's virtualenv, and a setup
            # failure would otherwise look like "every commit is malformed".
            if out=$(pre-commit run --hook-stage commit-msg \
                                    --commit-msg-filename "$msgfile" \
                                    conventional-pre-commit 2>&1); then
              echo "ok: $subject"
            else
              echo "::error::not a conventional commit: $sha  $subject"
              printf '%s\n' "$out" | sed 's/^/    /'
              rc=1
            fi
          done < <(git rev-list "$BASE..$HEAD")
          if [ "$rc" -ne 0 ]; then
            echo
            echo 'Allowed types are the args: list of the conventional-pre-commit'
            echo 'hook in .pre-commit-config.yaml -- that list is the only one.'
          fi
          exit $rc

  # ---------------------------------------------------------------------------
  rendered-manifests:
    name: deploy/ matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install kubectl (pinned -- it is the renderer)
        run: |
          curl -sSLo /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl

      # deploy/ is build output. If it does not match what the sources produce,
      # then what Argo applies is not what the repo says, which defeats the whole
      # arrangement. This is the check that keeps deploy/ honest.
      #
      # Three kustomizations resolve remote URLs (gateway-api,
      # snapshot-controller, barman-cloud-plugin), so this job depends on
      # github.com being up. render-deploy.sh retries those renders with backoff
      # and, if they still fail, labels them NETWORK so a GitHub outage is
      # distinguishable from a broken manifest. See the RETRIES note in the
      # script.
      - name: deploy/ is up to date
        run: ./scripts/render-deploy.sh --check

  # ---------------------------------------------------------------------------
  validate:
    name: manifest schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      # Validates deploy/ rather than re-rendering the sources, because deploy/
      # is what Argo actually applies. The `rendered-manifests` job above proves
      # deploy/ is derived from the sources, so this covers both.
      #
      # The three SOPS directories are not in deploy/ and cannot be validated
      # here: the age key is not available to CI and must never be. What DOES
      # cover them:
      #   - scripts/secrets-check.sh (pre-commit + the lint job) asserts every
      #     file a KSOPS generator references exists and is encrypted, with no
      #     key required.
      #   - `task validate` locally renders them for real. That needs kustomize
      #     AND ksops; both are installed by `task tools` and asserted by
      #     `task tools:check`. Until 2026-08 neither installed ksops, so this
      #     escape hatch did not exist -- do not remove it from the toolchain
      #     without removing this claim.
      - name: Validate rendered manifests
        run: |
          set -euo pipefail
          find deploy -name 'manifests.yaml' -print0 \
          | xargs -0 kubeconform \
              -strict \
              -summary \
              -kubernetes-version "${K8S_VERSION}" \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -ignore-missing-schemas

  # ---------------------------------------------------------------------------
  sast:
    name: SAST (IaC + manifests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      # Trivy in config mode covers Kubernetes manifests, Helm values,
      # Dockerfiles and Terraform in one pass.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          # Fail the build only on things worth blocking a merge for. Homelab
          # manifests trip a lot of LOW/MEDIUM "not production hardened" rules
          # that would make this gate noise rather than signal.
          #
          # This threshold is load-bearing for .trivyignore: a rule below
          # HIGH is already out of scope, so listing it there would be a
          # no-op that reads like a decision.
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-config

      # kube-linter checks workload-level practices Trivy does not: dangling
      # Service selectors, non-existent ServiceAccounts, `:latest` tags,
      # duplicate env vars.
      #
      # Scanned against deploy/ rather than `.`, for two reasons: deploy/ is
      # what Argo applies, and `.` also swept bootstrap/charts/*/templates/,
      # which are Helm templates and not parseable YAML.
      - name: kube-linter
        uses: stackrox/kube-linter-action@v1.0.7
        with:
          directory: deploy
          config: .kube-linter.yaml
          format: sarif
          output-file: kube-linter.sarif

      # THE STEP ABOVE CANNOT FAIL. kube-linter-action's last line is
      #     ./kube-linter ... | tee "$output-file"
      # under `set -u` with no `pipefail`, so the step always exits with tee's
      # status, which is 0. Every finding was being uploaded to the Security tab
      # and silently passing CI.
      #
      # Reading the SARIF is the fix that does not require forking the action or
      # hand-rolling the kube-linter install (which would mean pinning a version
      # this repo has no other reason to track). `jq` is preinstalled on
      # ubuntu-latest.
      - name: kube-linter findings are blocking
        run: |
          set -euo pipefail
          if [ ! -s kube-linter.sarif ]; then
            echo "::error::kube-linter produced no SARIF -- it did not run."
            exit 1
          fi
          n=$(jq '[.runs[]?.results[]?] | length' kube-linter.sarif)
          echo "kube-linter findings: $n"
          if [ "$n" -ne 0 ]; then
            jq -r '.runs[]?.results[]? |
                   "::error file=\(.locations[0].physicalLocation.artifactLocation.uri // "?")::\(.ruleId): \(.message.text)"' \
              kube-linter.sarif
            echo
            echo "Every check in .kube-linter.yaml is one this repo satisfies today."
            echo "Fix the manifest, or move the check to the advisory list in that"
            echo "file with a reason."
            exit 1
          fi

      - name: Upload kube-linter SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: kube-linter.sarif
          category: kube-linter

  # ---------------------------------------------------------------------------
  # A single required check, so branch protection needs one entry rather than
  # being updated every time a job is added.
  #
  # EVERY job that can fail must be listed here. `commit-messages` was missing,
  # which meant a non-conventional commit failed a job nobody had made required.
  # `skipped` counts as a pass because commit-messages does not run on pushes to
  # main.
  ci-passed:
    name: ci
    runs-on: ubuntu-latest
    needs: [lint, commit-messages, rendered-manifests, validate, sast]
    if: always()
    steps:
      - name: Fail if any dependency failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "results: $results"
          for r in $results; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || exit 1
          done
