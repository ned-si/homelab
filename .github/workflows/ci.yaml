---
# CI: everything that can be verified WITHOUT a cluster.
#
# Runs on every PR and on pushes to main. Nothing here touches the homelab, so
# it works from GitHub-hosted runners with no network path into the house.
#
# What is deliberately NOT here:
#   - DAST     needs a running application. See dast.yaml (scheduled, self-hosted).
#   - deploy   see cd.yaml (requires a runner that can reach the cluster).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: "v0.7.0"
  # The renderer for deploy/. `scripts/render-deploy.sh` uses `kubectl kustomize`,
  # so the kustomize version embedded in THIS kubectl decides the bytes that end
  # up in deploy/. It is pinned because checked-in generated output is only
  # meaningful if the generator is deterministic; a different version produces a
  # formatting diff that looks like a stale render.
  #
  # There is deliberately no standalone KUSTOMIZE_VERSION. Nothing in CI invokes
  # the `kustomize` binary -- render-deploy.sh, render-check.sh and
  # dryrun-server.sh all use `kubectl kustomize`. A second pin here tracked a
  # dependency the pipeline does not have and generated Renovate PRs forever.
  #
  # `scripts/render-deploy.sh` holds the single source of truth for the EMBEDDED
  # kustomize version (EXPECT_KUSTOMIZE) and hard-fails in --check mode when this
  # kubectl does not carry it. So bumping KUBECTL_VERSION is a two-line change:
  # this pin, and EXPECT_KUSTOMIZE, followed by a re-render.
  #
  # NOT the same thing as K8S_VERSION below. This never contacts the cluster.
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  KUBECTL_VERSION: "v1.36.3"
  # The Kubernetes version to validate manifests against. Bump this alongside a
  # real cluster upgrade, not before -- validating against a newer API than the
  # cluster runs would pass here and fail on sync.
  #
  # VERIFIED against the live cluster on 2026-07-31: the nodes run v1.31.2.
  # An earlier draft said 1.34.0, which would have validated manifests against
  # APIs this cluster does not serve.
  K8S_VERSION: "1.31.2"
  # Consumed by the terraform_fmt pre-commit hook in the `lint` job, via
  # PCT_TFPATH=tofu. Kept equal to what `task tools` installs from Homebrew so
  # that `task lint:tofu` and CI cannot disagree about formatting. `fmt` is
  # stable across versions, but "CI agrees with pre-commit" is a property this
  # repo maintains deliberately, and a floating version gives it up quietly.
  # renovate: datasource=github-releases depName=opentofu/opentofu
  TOFU_VERSION: "1.12.6"

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, not a shallow clone: the gitleaks hook is history-aware,
          # and pre-commit-terraform decides whether it is "running on the whole
          # repo" by consulting git. Commit messages are checked in the
          # `commit-messages` job below, not here.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install pre-commit

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # REQUIRED BY THE terraform_fmt HOOK, which otherwise exits 127.
      #
      # pre-commit-terraform resolves its binary as PCT_TFPATH, then `terraform`,
      # then `tofu`. The hook's comment in .pre-commit-config.yaml used to say
      # "the GitHub runner has terraform while this laptop has tofu" -- that was
      # true once and is not any more: the ubuntu-24.04 runner image no longer
      # ships terraform. So the hook found neither binary and failed with
      # "command not found", which pre-commit reports as `exit code: 127` under a
      # hook whose every other line says Passed.
      #
      # OpenTofu rather than Terraform because that is what this repo uses
      # (bootstrap/ is applied with `tofu`), and PCT_TFPATH is set explicitly so
      # the resolution order stops guessing.
      - uses: opentofu/setup-opentofu@v1
        with:
          # From the env block at the top of this file rather than inline. The
          # generic Renovate manager matches an annotation followed by a key named
          # `version`/`tag`/`chart` or an ALL_CAPS name, and `tofu_version` is
          # none of those -- an inline annotation here matched nothing, which
          # scripts/renovate-dryrun.js reports as an unmatched annotation.
          # KUBECONFORM_VERSION and KUBECTL_VERSION are pinned the same way.
          tofu_version: ${{ env.TOFU_VERSION }}
          # The wrapper intercepts stdout to expose it as step outputs. Nothing
          # here reads those, and it confuses the hook's own output parsing.
          tofu_wrapper: false

      # No kubectl here on purpose. The only hook that needed it was
      # render-deploy, which is skipped below; `rendered-manifests` installs the
      # pinned one and owns that check.

      # Runs yamllint, shellcheck, gitleaks, terraform_fmt, leak-check,
      # placeholder-check, secrets-check and renovate-dryrun in one pass -- the
      # same set a developer gets locally, so CI cannot disagree with pre-commit.
      #
      # SKIP=render-deploy is the one deliberate difference. That hook renders the
      # entire tree and writes deploy/; the `rendered-manifests` job below runs
      # the same script with `--check`, which is the answer CI actually needs.
      # Running both was two full renders per CI run for one fact.
      - name: pre-commit
        env:
          SKIP: render-deploy
          # See the setup-opentofu step above. Explicit so the hook does not fall
          # through its resolution order onto a binary that is not installed.
          PCT_TFPATH: tofu
        run: pre-commit run --all-files --show-diff-on-failure

      # The pre-commit step above already runs this hook, and now runs it with
      # SECRETS_CHECK_STRICT=1, so this step is a duplicate as a GATE. It is kept
      # as a separate step for the ANNOTATION: pre-commit prints the failure as
      # part of a wall of hook output, while this produces a `::error::` that
      # GitHub attaches to the run summary. "One missing file stalls every
      # Application below sync-wave -25" is worth that much visibility.
      #
      # `if: always()` so it still reports when an earlier hook failed for an
      # unrelated reason.
      #
      # No age key is available here and none is needed: the script only checks
      # that referenced paths exist and carry a SOPS envelope. It never decrypts.
      - name: KSOPS secret files
        if: always()
        env:
          SECRETS_CHECK_STRICT: "1"
        run: ./scripts/secrets-check.sh

  # ---------------------------------------------------------------------------
  commit-messages:
    name: conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install pre-commit

      # There is ONE list of allowed commit types, and it lives in
      # .pre-commit-config.yaml. This job used to carry its own regex, which
      # drifted: the local hook accepted `security` and the CI pattern did not,
      # so a commit could pass locally and fail here. Running the same hook
      # through pre-commit makes drift impossible by construction.
      #
      # Rejected alternative: parsing the type list out of the YAML with yq and
      # rebuilding the regex. That is a second implementation of the same rule
      # and would disagree with conventional-pre-commit's own edge cases
      # (scopes, `!`, reverts).
      - name: Check every commit in the PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          msgfile=$(mktemp)
          trap 'rm -f "$msgfile"' EXIT
          rc=0
          while read -r sha; do
            git log -1 --format=%B "$sha" >"$msgfile"
            subject=$(git log -1 --format=%s "$sha")
            # Merge commits are generated by GitHub and are exempt.
            case "$subject" in "Merge "*) continue ;; esac
            # Output captured and printed on failure rather than discarded: the
            # first invocation also builds the hook's virtualenv, and a setup
            # failure would otherwise look like "every commit is malformed".
            if out=$(pre-commit run --hook-stage commit-msg \
                                    --commit-msg-filename "$msgfile" \
                                    conventional-pre-commit 2>&1); then
              echo "ok: $subject"
            else
              echo "::error::not a conventional commit: $sha  $subject"
              printf '%s\n' "$out" | sed 's/^/    /'
              rc=1
            fi
          done < <(git rev-list "$BASE..$HEAD")
          if [ "$rc" -ne 0 ]; then
            echo
            echo 'Allowed types are the args: list of the conventional-pre-commit'
            echo 'hook in .pre-commit-config.yaml -- that list is the only one.'
          fi
          exit $rc

  # ---------------------------------------------------------------------------
  rendered-manifests:
    name: deploy/ matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install kubectl (pinned -- it is the renderer)
        run: |
          curl -sSLo /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl

      # deploy/ is build output. If it does not match what the sources produce,
      # then what Argo applies is not what the repo says, which defeats the whole
      # arrangement. This is the check that keeps deploy/ honest.
      #
      # Three kustomizations resolve remote URLs (gateway-api,
      # snapshot-controller, barman-cloud-plugin), so this job depends on
      # github.com being up. render-deploy.sh retries those renders with backoff
      # and, if they still fail, labels them NETWORK so a GitHub outage is
      # distinguishable from a broken manifest. See the RETRIES note in the
      # script.
      - name: deploy/ is up to date
        run: ./scripts/render-deploy.sh --check

  # ---------------------------------------------------------------------------
  validate:
    name: manifest schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      # Validates deploy/ rather than re-rendering the sources, because deploy/
      # is what Argo actually applies. The `rendered-manifests` job above proves
      # deploy/ is derived from the sources, so this covers both.
      #
      # The three SOPS directories are not in deploy/ and cannot be validated
      # here: the age key is not available to CI and must never be. What DOES
      # cover them:
      #   - scripts/secrets-check.sh (pre-commit + the lint job) asserts every
      #     file a KSOPS generator references exists and is encrypted, with no
      #     key required.
      #   - `task validate` locally renders them for real. That needs kustomize
      #     AND ksops; both are installed by `task tools` and asserted by
      #     `task tools:check`. Until 2026-08 neither installed ksops, so this
      #     escape hatch did not exist -- do not remove it from the toolchain
      #     without removing this claim.
      - name: Validate rendered manifests
        run: |
          set -euo pipefail
          find deploy -name 'manifests.yaml' -print0 \
          | xargs -0 kubeconform \
              -strict \
              -summary \
              -kubernetes-version "${K8S_VERSION}" \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -ignore-missing-schemas

  # ---------------------------------------------------------------------------
  sast:
    name: SAST (IaC + manifests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # REQUIRED BY codeql-action/upload-sarif, and its absence is not obvious.
      # The action reads the workflow run via the Actions API to attach the SARIF
      # to the right run; without `actions: read` it fails with
      #
      #   Resource not accessible by integration
      #   https://docs.github.com/rest/actions/workflow-runs#get-a-workflow-run
      #
      # which names neither the missing permission nor the SARIF. It surfaced only
      # once the Trivy scan started producing a report to upload.
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Do not leave the GITHUB_TOKEN in .git/config for later steps to find.
          #
          # This job runs a third-party scanner that was itself backdoored in March
          # 2026 with a payload whose whole purpose was harvesting whatever
          # credentials it could reach on the runner. Nothing in this job pushes,
          # so persisting the token buys nothing and hands a future compromise one
          # more thing to steal.
          persist-credentials: false

      # Trivy in config mode covers Kubernetes manifests, Helm values,
      # Dockerfiles and Terraform in one pass.
      #
      # ###########################################################################
      # # PINNED BY COMMIT SHA, NOT BY TAG, AND THAT IS NOT PEDANTRY HERE.
      # #
      # # On 2026-03-19 an attacker with tag-write access FORCE-PUSHED 76 of the 77
      # # tags in aquasecurity/trivy-action and ALL 7 tags in
      # # aquasecurity/setup-trivy, repointing trusted versions at malicious
      # # commits, and published a credential-stealing Trivy binary (v0.69.4) to
      # # the official release channels. The payload harvested cloud credentials,
      # # env vars and `kubectl get secrets --all-namespaces`, exfiltrated them,
      # # and then ran the real scan so the job went green.
      # #
      # # A git tag is a mutable pointer. `@v0.36.0` would have offered no
      # # protection whatsoever against that, which is the whole lesson:
      # #
      # #   safe versions per the advisory   trivy binary  v0.69.2 - v0.69.3
      # #                                    trivy-action  v0.35.0
      # #                                    setup-trivy   v0.2.6
      # #   malicious binaries               0.69.4, 0.69.5, 0.69.6
      # #
      # # https://www.microsoft.com/en-us/security/blog/2026/03/24/detecting-investigating-defending-against-trivy-supply-chain-compromise/
      # #
      # # WHY v0.36.0 RATHER THAN THE v0.35.0 NAMED SAFE: v0.35.0 shipped
      # # 2026-03-20, the day after the compromise, and predates the `version`
      # # input this job needs to pin the scanner binary. v0.36.0 shipped
      # # 2026-04-22, a month into remediation, and -- verified by reading
      # # action.yaml at this exact commit -- pins setup-trivy by SHA to
      # # 3fb12ec12f41e471780db15c232d5dd185dcb514, which resolves to v0.2.6, the
      # # version the advisory names safe. So all three links in the chain are
      # # immutable: this SHA, the SHA it pins, and the binary version below.
      # #
      # # WHEN RENOVATE PROPOSES A BUMP HERE, re-check the advisory before merging.
      # # This is the one dependency in the repo where "newer" is not automatically
      # # "safer".
      # ###########################################################################
      #
      # Separately, `@0.33.1` was ALSO broken two other ways, both of which
      # presented as a red job with zero findings: the tag is `v0.33.1`, so it
      # never resolved; and v0.33.x installed Trivy by running
      # `contrib/install.sh` fetched from the trivy repo's `main` BRANCH -- an
      # unpinned script behind a pinned action.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          # The scanner binary, pinned separately from the action -- the action
          # only decides HOW it is fetched, not WHICH one.
          #
          # v0.70.0 (2026-04-17) is post-remediation and above the malicious
          # 0.69.4-0.69.6. Do not float this.
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.70.0
          # Report only what is worth blocking a merge for. Homelab manifests trip
          # a lot of LOW/MEDIUM "not production hardened" rules that would make
          # this gate noise rather than signal.
          #
          # This threshold is load-bearing for .trivyignore: a rule below HIGH is
          # already out of scope, so listing it there would be a no-op that reads
          # like a decision.
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          # Apply `severity` to the SARIF too, not just to the exit code.
          #
          # Without this the action writes EVERY severity into the SARIF while the
          # gate blocks only on HIGH/CRITICAL, so the Code Scanning tab fills with
          # the findings the paragraph above says are out of scope and
          # `.trivyignore` stops describing what is enforced.
          limit-severities-for-sarif: "true"
          # NOT the gate. `exit-code: 1` here fails the step with the findings
          # written to trivy.sarif and NOTHING in the log -- 141 files scanned, a
          # red step, and no way to see what tripped it without downloading an
          # artifact that was never uploaded because the upload runs later.
          #
          # The next step is the gate, and it prints each finding as a
          # file-anchored annotation. Same pattern as kube-linter below.
          exit-code: "0"

      # The Trivy gate. Reads the report the step above wrote, so there is one
      # scan and the findings are legible in the log.
      - name: Trivy findings are blocking
        run: |
          set -euo pipefail
          if [ ! -s trivy.sarif ]; then
            echo "::error::Trivy produced no SARIF -- the scan did not run."
            exit 1
          fi
          n=$(jq '[.runs[]?.results[]?] | length' trivy.sarif)
          echo "Trivy HIGH/CRITICAL findings: $n"
          if [ "$n" -ne 0 ]; then
            jq -r '.runs[]?.results[]?
                   | .locations[0].physicalLocation as $loc
                   | "::error file=\($loc.artifactLocation.uri // "?")"
                     + ",line=\($loc.region.startLine // 1)"
                     + "::\(.ruleId): \(.message.text)"' \
              trivy.sarif
            echo
            echo "Fix the manifest, or add the check id to .trivyignore WITH A REASON."
            echo "Reproduce locally:"
            echo "    trivy config . --severity HIGH,CRITICAL --ignorefile .trivyignore"
            exit 1
          fi

      # ###########################################################################
      # # THE TWO SARIF UPLOADS ARE `continue-on-error`. THEY ARE REPORTING, NOT
      # # GATES, AND ON THIS REPOSITORY THEY CANNOT SUCCEED.
      # #
      # # upload-sarif writes into GitHub Code Scanning, which needs either a
      # # public repository or GitHub Advanced Security. This repository is PRIVATE
      # # with no GHAS, so the API answers
      # #
      # #     Code scanning is not enabled for this repository.
      # #
      # # and the step fails. Without continue-on-error that failure fails the SAST
      # # job -- and therefore `ci` -- even when both scanners found nothing. That
      # # is exactly what happened: for several runs the job was red while
      # # `Trivy findings are blocking` and `kube-linter findings are blocking`
      # # both PASSED, which reads like a security failure and is not one.
      # #
      # # THE GATES ARE THE TWO `... findings are blocking` STEPS. They parse the
      # # SARIF with jq and exit non-zero on any finding, so making the upload
      # # advisory removes no enforcement whatsoever.
      # #
      # # Kept rather than deleted: if the repository is ever made public, or GHAS
      # # is enabled, these start populating the Security tab again with no change
      # # here. `if: always()` so a finding still gets uploaded rather than only
      # # clean runs.
      # ###########################################################################
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-config

      # kube-linter checks workload-level practices Trivy does not: dangling
      # Service selectors, non-existent ServiceAccounts, `:latest` tags,
      # duplicate env vars.
      #
      # Scanned against deploy/ rather than `.`, for two reasons: deploy/ is
      # what Argo applies, and `.` also swept bootstrap/charts/*/templates/,
      # which are Helm templates and not parseable YAML.
      #
      # `if: always()` so ONE run reports BOTH scanners. Without it a Trivy finding
      # short-circuits the job, kube-linter never runs, and you fix Trivy, push,
      # and only then discover kube-linter's findings -- one round trip per
      # scanner. The gate below is what fails the job.
      - name: kube-linter
        if: always()
        uses: stackrox/kube-linter-action@v1.0.7
        with:
          directory: deploy
          config: .kube-linter.yaml
          format: sarif
          output-file: kube-linter.sarif

      # THE STEP ABOVE CANNOT FAIL. kube-linter-action's last line is
      #     ./kube-linter ... | tee "$output-file"
      # under `set -u` with no `pipefail`, so the step always exits with tee's
      # status, which is 0. Every finding was being uploaded to the Security tab
      # and silently passing CI.
      #
      # Reading the SARIF is the fix that does not require forking the action or
      # hand-rolling the kube-linter install (which would mean pinning a version
      # this repo has no other reason to track). `jq` is preinstalled on
      # ubuntu-latest.
      - name: kube-linter findings are blocking
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s kube-linter.sarif ]; then
            echo "::error::kube-linter produced no SARIF -- it did not run."
            exit 1
          fi
          n=$(jq '[.runs[]?.results[]?] | length' kube-linter.sarif)
          echo "kube-linter findings: $n"
          if [ "$n" -ne 0 ]; then
            jq -r '.runs[]?.results[]? |
                   "::error file=\(.locations[0].physicalLocation.artifactLocation.uri // "?")::\(.ruleId): \(.message.text)"' \
              kube-linter.sarif
            echo
            echo "Every check in .kube-linter.yaml is one this repo satisfies today."
            echo "Fix the manifest, or move the check to the advisory list in that"
            echo "file with a reason."
            exit 1
          fi

      # Advisory for the same reason as the Trivy upload above. The gate is the
      # `kube-linter findings are blocking` step.
      - name: Upload kube-linter SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: kube-linter.sarif
          category: kube-linter

  # ---------------------------------------------------------------------------
  # A single required check, so branch protection needs one entry rather than
  # being updated every time a job is added.
  #
  # EVERY job that can fail must be listed here. `commit-messages` was missing,
  # which meant a non-conventional commit failed a job nobody had made required.
  # `skipped` counts as a pass because commit-messages does not run on pushes to
  # main.
  ci-passed:
    name: ci
    runs-on: ubuntu-latest
    needs: [lint, commit-messages, rendered-manifests, validate, sast]
    if: always()
    steps:
      - name: Fail if any dependency failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "results: $results"
          for r in $results; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || exit 1
          done
