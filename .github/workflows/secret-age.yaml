---
# secret-age: the rotation alert. Weekly, scripts/ci/secret_rotation.py age
# checks every row of ci/secret-rotation.tsv against its class period
# (docs/secrets.md, Rotation periods). A secret past its period fails the run,
# and the failure posts to ntfy. It reads dates from git only: no secret, no
# cluster access. Rows due within 30 days are listed in the log.
name: secret-age

on:
  schedule:
    # Monday 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-age
  cancel-in-progress: true

jobs:
  age:
    name: Secret age
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check rotation periods
        run: scripts/ci/secret_rotation.py age

      # Same channel as every other scheduled failure. The topic is the
      # secret, so it is never printed. In quiet hours ntfy holds it until
      # 08:00 Zurich (docs/sre.md).
      - name: Notify ntfy on failure
        if: ${{ failure() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          delay=$(scripts/ci/ntfy-quiet-delay.sh)
          curl -fsS -m 10 -o /dev/null ${delay:+-H "Delay: ${delay}m"} \
            -H "Title: secret past its rotation period" -H "Priority: low" -H "Tags: key" \
            -H "Click: $RUN_URL" \
            -d "A sealed secret is past its rotation period; the run log names the file. $RUN_URL" \
            "https://ntfy.sh/$NTFY_TOPIC"
