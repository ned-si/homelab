---
# OpenSSF Scorecard: results to the Security tab and api.scorecard.dev (the
# README badge). Publishing restricts the workflow (no top-level env or
# defaults, no workflow-level write, only checkout, upload-artifact,
# upload-sarif and scorecard-action): keep this shape.
name: scorecard

on:
  push:
    # Only the default branch is supported.
    branches: [main]
  schedule:
    # Saturday 01:30 UTC.
    - cron: "30 1 * * 6"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      # upload-sarif writes code scanning alerts.
      security-events: write
      # OIDC token that signs the published results.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Fine-grained PAT, this repository only, read-only (Administration,
          # Contents, Metadata): the default token can't read classic branch
          # protection. Publishing still signs with the job's OIDC token.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
