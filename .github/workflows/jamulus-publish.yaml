---
# Build jamulus/ and push ghcr.io/ned-si/homelab-jamulus:<sha> for
# linux/arm64 and linux/amd64 with an SBOM and provenance, signed keyless,
# then tag the signed digest :main
# (.kiro/specs/self-hosted-jamulus/design.md#publishing). Renovate sees the
# new digest of :main and opens the pull request that deploys it. A failure
# deploys nothing; the running image stays.
name: jamulus-publish
on:
  push:
    branches: [main]
    paths:
      - jamulus/**
      - scripts/ci/jamulus-smoke.sh
      - .github/workflows/jamulus-publish.yaml
  workflow_dispatch:
permissions: {}
concurrency:
  group: jamulus-publish
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/ned-si/homelab-jamulus
jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature and the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image for the runner's platform, run as the cluster will run it
      # (read-only root, non-root, no capabilities), before anything is pushed.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load -t jamulus:smoke jamulus
          scripts/ci/jamulus-smoke.sh jamulus:smoke
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      # The default docker driver rejects --sbom/--provenance and a
      # multi-platform push; the smoke test keeps it because a
      # docker-container builder does not --load.
      - name: Create the attestation builder
        run: docker buildx create --name attest --driver docker-container
      # The arm64 apt-get runs under emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      # Only :<sha>: Renovate follows :main, which is tagged once the digest
      # is signed and verified.
      - name: Build and push linux/arm64 and linux/amd64
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build --builder attest --platform linux/arm64,linux/amd64 --push \
            --sbom=true --provenance=mode=max \
            --label org.opencontainers.image.source=https://github.com/ned-si/homelab \
            --label "org.opencontainers.image.revision=$SHA" \
            -t "$IMAGE:$SHA" jamulus
          digest=$(docker buildx imagetools inspect "$IMAGE:$SHA" --format '{{json .Manifest}}' | jq -r .digest)
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
      # The index holds both platforms, and the arm64 server prints the pinned version.
      - name: Check the pushed index
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag=$(sed -nE 's/^ARG JAMULUS_TAG=(r[0-9]+_[0-9]+_[0-9]+)$/\1/p' jamulus/Dockerfile)
          version=$(echo "${tag#r}" | tr _ .)
          platforms=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | join(",")')
          echo "$IMAGE:$SHA@$DIGEST ($platforms, Jamulus $version)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$platforms" = linux/amd64,linux/arm64 ]
          out=$(docker run --rm --platform linux/arm64 "$IMAGE@$DIGEST" --version)
          grep -qF "$version" <<<"$out" || { echo "arm64 --version prints '$out', want $version"; exit 1; }
      # A signed SLSA v1 provenance next to BuildKit's unsigned one, for
      # `gh attestation verify oci://$IMAGE@<digest> --owner ned-si`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      # The cosign pin lives in ci.yaml's env, as for site-publish.
      - name: Install the pinned cosign
        run: |
          set -euo pipefail
          COSIGN_VERSION=$(sed -n 's/^  COSIGN_VERSION: *//p' .github/workflows/ci.yaml)
          COSIGN_SHA256=$(sed -n 's/^  COSIGN_SHA256: *//p' .github/workflows/ci.yaml)
          export COSIGN_VERSION COSIGN_SHA256
          scripts/ci/install-tool.sh cosign
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Keyless with the workflow's OIDC identity, classic .sig tag with the
      # Rekor bundle: the format Kyverno and the inventory read
      # (.kiro/specs/image-provenance/design.md#signing-the-site-image-task-2).
      - name: Sign and verify the index digest
        run: |
          set -euo pipefail
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "$IMAGE@$DIGEST"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/ned-si/homelab/.github/workflows/jamulus-publish.yaml@refs/heads/main" \
            "$IMAGE@$DIGEST" >/dev/null
          echo "signed and verified $IMAGE@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tag the signed digest as main
        run: docker buildx imagetools create -t "$IMAGE:main" "$IMAGE@$DIGEST"
      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io
      # A copy of the site-publish step: priority low, held in quiet hours
      # (docs/sre.md). The topic is the secret.
      - name: Notify ntfy on failure
        if: ${{ failure() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          delay=$(scripts/ci/ntfy-quiet-delay.sh)
          curl -fsS -m 10 -o /dev/null ${delay:+-H "Delay: ${delay}m"} \
            -H "Title: jamulus-publish failed" -H "Priority: low" -H "Tags: warning" \
            -H "Click: $RUN_URL" \
            -d "jamulus-publish failed on ${SHA:0:7}; nothing deployed; see $RUN_URL" \
            "https://ntfy.sh/$NTFY_TOPIC"
