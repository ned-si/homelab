---
# CodeQL: SAST of the Python scripts and tests, the workflows and the Go module
# in dashboard/. Alerts go to the Security tab; not a required check. Advanced
# setup: the default setup is off, and the two cannot run together. Go is a
# compiled language: its build mode is manual, and dashboard/ is built between
# init and analyze, with Go set up before init.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Saturday 02:30 UTC.
    - cron: "30 2 * * 6"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      # codeql-action reads the workflow run to label the analysis.
      actions: read
      # analyze uploads the results as code scanning alerts.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Interpreted languages: nothing to build.
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before init, so CodeQL wraps this Go; no build cache, so the build
      # below compiles every package and CodeQL sees the sources.
      - name: Set up Go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: dashboard/go.mod
          cache: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build dashboard/
        if: ${{ matrix.language == 'go' }}
        working-directory: dashboard
        env:
          GOTOOLCHAIN: local
        run: go build ./...

      - name: Analyse
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: codeql-${{ matrix.language }}
