# Kubelet serving certificates from the cluster CA, so metrics-server verifies
# every kubelet. kubelet-serving-cert-approver must run before this patch
# reaches a node, or `kubectl logs`/`exec` fail there.
# https://docs.siderolabs.com/kubernetes-guides/monitoring-and-observability/deploy-metrics-server
machine:
  kubelet:
    extraConfig:
      serverTLSBootstrap: true
