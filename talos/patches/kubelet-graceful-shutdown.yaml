# Graceful shutdown sized for single-instance CNPG: a smart shutdown takes up
# to 180 s, then a fast one. 240 s with 30 s for critical pods leaves regular
# pods 210 s; the Talos default (20 s) kills Postgres mid-shutdown.
machine:
  kubelet:
    extraConfig:
      shutdownGracePeriod: 240s
      shutdownGracePeriodCriticalPods: 30s
