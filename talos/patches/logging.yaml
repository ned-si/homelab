# Talos service logs as JSON lines to the Vector pod on the same node
# (127.0.0.1:6050, source `talos_services`). Logs from before Vector starts
# are only in `talosctl logs`. Kernel logs: talosctl/kmsg-log.yaml.
machine:
  logging:
    destinations:
      - endpoint: tcp://127.0.0.1:6050/
        format: json_lines
