# Applied with talosctl after talhelper (scripts/talos-genconfig.sh).
# Workload isolation off: democratic-csi nsenters the host iscsid, which the
# sandbox hides ("failed to find iscsid pid for nsenter"). Reboot after a
# change. To try again: WORKLOAD_ISOLATION=true task talos:genconfig
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: false
