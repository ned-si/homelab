# Applied with talosctl after talhelper (scripts/talos-genconfig.sh): the
# vendored machinery does not know this document yet. Lets pods in
# `system-upgrade` (tuppr) hold an os:admin Talos API certificate.
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
  - os:admin
allowedKubernetesNamespaces:
  - system-upgrade
