# Image GC well before eviction: on the one 29 GB eMMC the default GC start
# (85%) equals the eviction threshold, so nodes went DiskPressure. GC from
# 70% down to 60%; eviction thresholds stay default.
machine:
  kubelet:
    extraConfig:
      imageGCHighThresholdPercent: 70
      imageGCLowThresholdPercent: 60
