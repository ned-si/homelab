# talhelper source for the Talos machine configs: https://budimanjojo.github.io/talhelper/
#
#   task talos:genconfig   writes talos/clusterconfig/ (git-ignored) from this file
#                          and talos/talsecret.sops.yaml
#
# docs/talos.md explains the tree, the commands and the choices below.
---
clusterName: homelab

# Talos 1.14 publishes no ghcr.io/siderolabs/installer image; the talos image
# carries the same tags. tuppr rolls this version out after a merge
# (platform/tuppr/upgrades/talos-upgrade.yaml, kept equal by CI).
# renovate: datasource=docker depName=ghcr.io/siderolabs/talos
talosVersion: v1.14.4
# The Kubernetes that Talos 1.14.2 ships. Cilium 1.20, Argo CD 3.5 and
# cert-manager 1.21 are tested up to 1.36 only, so the CI test cluster runs
# this version before any node does. tuppr applies a change to the running
# cluster (platform/tuppr/upgrades/kubernetes-upgrade.yaml, kept equal by CI).
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.37.1

# The API VIP (Layer2VIPConfig on the control planes, below), not a node IP.
endpoint: https://192.168.1.11:6443
additionalApiServerCertSans:
  - 192.168.1.11
additionalMachineCertSans:
  - 192.168.1.11

# Workloads run on the control planes too; 3 cp + 1 worker could not host
# them otherwise.
allowSchedulingOnControlPlanes: true
clusterPodNets:
  - 10.244.0.0/16
clusterSvcNets:
  - 10.96.0.0/12
# Cilium is installed once with the helm CLI, then adopted by Argo CD.
cniConfig:
  name: none

# Patches for every node. patches/talosctl/ holds the documents talhelper cannot
# parse yet; scripts/talos-genconfig.sh applies them with talosctl.
patches:
  - "@./patches/sysctls.yaml"
  - "@./patches/kubelet-image-gc.yaml"
  - "@./patches/kubelet-graceful-shutdown.yaml"
  - "@./patches/node-ip.yaml"
  - "@./patches/kubelet-serving-certs.yaml"
  # Service logs as JSON to the Vector pod on the node (docs/observability.md, "Logs").
  - "@./patches/logging.yaml"

controlPlane:
  patches:
    # Kubernetes component documents are control-plane only in Talos 1.14.
    - "@./patches/kube-proxy.yaml"
    - "@./patches/controlplane-metrics.yaml"
    - "@./patches/etcd-subnet.yaml"
  # Image Factory schematic 21cb209fd2bf7aa421d4f2ae391ca60c97b25694cda234c067f992a2709f0646.
  # scripts/ci/talos-validate.sh fails if the generated installer image has another ID.
  # tuppr keeps each node's running schematic: a change here reaches the
  # nodes through `task talos:upgrade -- <node>`, one node at a time.
  schematic: &schematic
    overlay:
      image: siderolabs/sbc-rockchip
      name: turingrk1
    customization:
      systemExtensions:
        officialExtensions:
          # iscsiadm and iscsid for democratic-csi (ISCSIADM_HOST_STRATEGY=nsenter).
          - siderolabs/iscsi-tools
          # The Talos API on the tailnet (docs/remote-access.md, "Talos API").
          - siderolabs/tailscale
  machineSpec: &machineSpec
    mode: metal
    arch: arm64
    bootMethod: disk-image
    imageSuffix: raw.xz

worker:
  schematic: *schematic
  machineSpec: *machineSpec

# Tailnet (docs/remote-access.md, "Talos API"): each node joins as
# talos-<node> with tag:talos through the siderolabs/tailscale extension, and
# apid's certificate carries that name. TS_OAUTH_SECRET is the operator's
# Tailscale OAuth client secret, sealed in talos/talenv.sops.yaml; talhelper
# substitutes it. TS_AUTH_ONCE logs in on first start only: the node key
# then lives in the extension's state on EPHEMERAL.
nodes:
  - hostname: homelab-cp-1
    ipAddress: 192.168.1.247
    controlPlane: true
    installDisk: /dev/mmcblk0
    certSANs:
      - talos-cp-1
      - talos-cp-1.tail32a1fc.ts.net
    extensionServices:
      - name: tailscale
        environment:
          - TS_AUTHKEY=${TS_OAUTH_SECRET}?ephemeral=false&preauthorized=true
          - TS_HOSTNAME=talos-cp-1
          - TS_EXTRA_ARGS=--advertise-tags=tag:talos
          - TS_AUTH_ONCE=true
    nameservers: [192.168.1.1]
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses: [192.168.1.247/24]
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
        vip:
          ip: 192.168.1.11

  - hostname: homelab-cp-2
    ipAddress: 192.168.1.238
    controlPlane: true
    installDisk: /dev/mmcblk0
    certSANs:
      - talos-cp-2
      - talos-cp-2.tail32a1fc.ts.net
    extensionServices:
      - name: tailscale
        environment:
          - TS_AUTHKEY=${TS_OAUTH_SECRET}?ephemeral=false&preauthorized=true
          - TS_HOSTNAME=talos-cp-2
          - TS_EXTRA_ARGS=--advertise-tags=tag:talos
          - TS_AUTH_ONCE=true
    nameservers: [192.168.1.1]
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses: [192.168.1.238/24]
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
        vip:
          ip: 192.168.1.11

  - hostname: homelab-cp-3
    ipAddress: 192.168.1.239
    controlPlane: true
    installDisk: /dev/mmcblk0
    certSANs:
      - talos-cp-3
      - talos-cp-3.tail32a1fc.ts.net
    extensionServices:
      - name: tailscale
        environment:
          - TS_AUTHKEY=${TS_OAUTH_SECRET}?ephemeral=false&preauthorized=true
          - TS_HOSTNAME=talos-cp-3
          - TS_EXTRA_ARGS=--advertise-tags=tag:talos
          - TS_AUTH_ONCE=true
    nameservers: [192.168.1.1]
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses: [192.168.1.239/24]
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
        vip:
          ip: 192.168.1.11

  - hostname: homelab-w-1
    ipAddress: 192.168.1.240
    controlPlane: false
    installDisk: /dev/mmcblk0
    certSANs:
      - talos-w-1
      - talos-w-1.tail32a1fc.ts.net
    extensionServices:
      - name: tailscale
        environment:
          - TS_AUTHKEY=${TS_OAUTH_SECRET}?ephemeral=false&preauthorized=true
          - TS_HOSTNAME=talos-w-1
          - TS_EXTRA_ARGS=--advertise-tags=tag:talos
          - TS_AUTH_ONCE=true
    nameservers: [192.168.1.1]
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses: [192.168.1.240/24]
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
