# Byte-equal in spec to the running Ingress (ADR 0011). Removed with ingress-nginx.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    cert-manager.io/revision-history-limit: "1"
    # Plain HTTP to port 80 (argocd-server runs with server.insecure). Set
    # explicitly: under server-side apply, dropping the key would keep the old
    # HTTPS value, which another field manager co-owns.
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  name: argo-server-ingress
  namespace: argo
spec:
  ingressClassName: nginx
  rules:
    - host: argo.lilalala.com
      http:
        paths:
          - backend:
              service:
                name: argocd-server
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - argo.lilalala.com
      secretName: argocd-server-tls
