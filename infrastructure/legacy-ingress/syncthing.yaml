# Byte-equal in spec to the running Ingress (ADR 0011). Removed with ingress-nginx.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    cert-manager.io/revision-history-limit: "1"
  name: synchting-ingress
  namespace: syncthing
spec:
  ingressClassName: nginx
  rules:
    - host: syncthing.lilalala.com
      http:
        paths:
          - backend:
              service:
                name: syncthing-dashboard
                port:
                  number: 8384
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - syncthing.lilalala.com
      secretName: syncthing-tls
