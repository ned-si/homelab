# Byte-equal in spec to the running Ingress (ADR 0011). Removed with ingress-nginx.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  labels:
    app.kubernetes.io/name: keycloak
  name: keycloak
  namespace: keycloak
spec:
  ingressClassName: nginx
  rules:
    - host: auth.lilalala.com
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: keycloak
                port:
                  name: http
  tls:
    - hosts:
        - auth.lilalala.com
      secretName: keycloak-tls
