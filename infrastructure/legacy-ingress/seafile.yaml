# Byte-equal in spec to the running Ingress (ADR 0011). Removed with ingress-nginx.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  labels:
    app.kubernetes.io/name: seafile
  name: seafile
  namespace: seafile
spec:
  ingressClassName: nginx
  rules:
    - host: drive.lilalala.com
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: seafile
                port:
                  name: http
  tls:
    - hosts:
        - drive.lilalala.com
      secretName: seafile-tls
