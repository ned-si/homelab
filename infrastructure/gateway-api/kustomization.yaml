apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Gateway API CRDs, experimental channel, at the version Cilium supports
# (https://docs.cilium.io/en/v1.20/network/servicemesh/gateway-api/gateway-api/).
# CRDs newer than Cilium understands leave Gateways unprogrammed, so Renovate
# groups them. Switching to standard would orphan or prune the
# experimental-only kinds. Fresh cluster: applied by hand before Cilium
# (docs/bootstrap.md step 3).
#
# renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
resources:
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.7.0/experimental-install.yaml
