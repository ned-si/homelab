apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Gateway API CRDs, standard channel.
#
# Must match the Gateway API version that the running Cilium release targets.
# Cilium 1.20.x -> Gateway API v1.6.1. Renovate groups this with the Cilium
# chart (see the "cluster networking" packageRule) so they are never bumped
# independently.
#
# renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
resources:
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml
