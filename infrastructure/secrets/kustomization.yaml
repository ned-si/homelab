apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deliberately no `namespace:` here -- each decrypted Secret sets its own, so
# one Application can seed several namespaces.

# KSOPS decrypts each listed file at render time. Requires
# `kustomize build --enable-alpha-plugins --enable-exec`; the Argo CD repo-server
# sets that globally via `kustomize.buildOptions`. Locally: `task build`.
generators:
  - secret-generator.yaml
