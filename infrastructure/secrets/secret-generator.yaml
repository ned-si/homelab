# KSOPS generator for the infrastructure layer.
#
# Each file listed here is decrypted using the age identity available to the
# renderer -- the `sops-age` Secret mounted into the Argo CD repo-server in the
# cluster, or ~/.config/sops/age/keys.txt when you run `task build` locally.
#
# Adding a secret is two steps: create + seal the file, then list it below.
---
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: infrastructure-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./cloudflare-cert-manager.sops.yaml
  - ./cloudflare-external-dns.sops.yaml
# Deliberately NOT listed: infrastructure/democratic-csi/driver-config.sops.yaml. democratic-csi is
# a helm-CLI release; its sealed driver config is consumed by
# scripts/democratic-csi-values.sh at `helm upgrade` time, and Argo CD must
# never write the chart-owned Secret.
