# cert-manager configuration.
crds:
  enabled: true
  # Keep CRDs if the release is ever uninstalled. Deleting them would delete
  # every Certificate and Secret cert-manager manages, taking TLS down site-wide.
  keep: true

# Gateway API support. This is what lets cert-manager watch Gateway resources
# and mint a Certificate from the `cert-manager.io/cluster-issuer` annotation,
# exactly the way it used to do for Ingress objects.
config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  enableGatewayAPI: true

# Only DNS-01 is used here (see ../cert-manager-issuers). Point the self-checks
# at public resolvers so validation does not depend on the LAN's DNS, which
# split-horizons lilalala.com to internal addresses.
dns01RecursiveNameservers: "1.1.1.1:53,9.9.9.9:53"
dns01RecursiveNameserversOnly: true

prometheus:
  enabled: true
  servicemonitor:
    enabled: true

# Four small ARM nodes: keep the footprint honest.
resources:
  requests:
    cpu: 10m
    memory: 64Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
