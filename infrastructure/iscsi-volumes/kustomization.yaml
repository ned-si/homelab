apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Static PVs for every Retain data volume, so a new cluster binds each claim to
# its existing zvol. Each is generated from the live PV (name, volumeHandle,
# volumeAttributes, secret refs, Retain, a claimRef by name); each claim sets
# `volumeName` and keeps `storageClassName: iscsi`.
#
# Not rendered: operator/immich-data.yaml, applied by hand (docs/bootstrap.md);
# CI (repo-policy pvc-sync-options) fails a render containing it. Not here:
# CNPG volumes (recovered from S3) and the Delete-policy caches.
resources:
  - mealie-mealie-pvc.yaml
  - monitoring-prometheus-db.yaml
  - paperless-paperless-consume.yaml
  - paperless-paperless-data.yaml
  - paperless-paperless-media.yaml
  - syncthing-syncthing-pvc.yaml
  - theater-jellyfin-config.yaml
  - theater-lidarr-config.yaml
  - theater-plex-config.yaml
  - theater-prowlarr-config.yaml
  - theater-qbittorrent-config.yaml
  - theater-radarr-config.yaml
  - theater-sonarr-config.yaml
