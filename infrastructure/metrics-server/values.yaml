# metrics-server: the metrics.k8s.io API for `kubectl top` and Headlamp.
# TLS verified both ways: kubelet serving certificates from the cluster CA
# (talos/patches/kubelet-serving-certs.yaml), and a cert-manager certificate
# whose CA cainjector writes into the APIService.
image:
  repository: registry.k8s.io/metrics-server/metrics-server
  # renovate: datasource=docker depName=registry.k8s.io/metrics-server/metrics-server
  tag: v0.9.1@sha256:9b0ba1926e1d3089673f45461c3c1416109dea33b3ba3434048defd380df329b
  pullPolicy: IfNotPresent

apiService:
  insecureSkipTLSVerify: false

tls:
  type: cert-manager

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop: ["ALL"]

# Four nodes: a fraction of the chart's 100m / 200Mi default.
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
