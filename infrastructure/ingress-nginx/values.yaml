# ingress-nginx chart 4.11.3 values (release `ingress-nginx`, namespace
# `ingress`): the running release's values plus one address pin.
#
# The router forwards 80/443 TCP to 192.168.1.254, which the shared Gateway
# now holds (ADR 0007). ingress-nginx stays installed on 192.168.1.203, with
# no public role, until it is removed in its own change (ADR 0011). Reverting
# the handover change puts .254 back here and the Gateway back on .202.
controller:
  metrics:
    enabled: true
  service:
    annotations:
      lbipam.cilium.io/ips: "192.168.1.203"
