# argo.lilalala.com -> argocd-server.
#
# In Argo CD's own namespace, next to its Service, so no ReferenceGrant is
# needed. Port 80 = plain HTTP: TLS ends at the Gateway (ADR 0007).
#
# Requires `server.insecure: true` (`configs.params` in
# bootstrap/argocd-values.yaml): with TLS on, argocd-server answers plain HTTP
# with a redirect to HTTPS and argo.lilalala.com loops through the Gateway.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argo
spec:
  # group/kind/weight and the catch-all match are the API server's defaults,
  # spelled out so that Argo CD's diff sees no drift.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - argo.lilalala.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 80
          weight: 1
      timeouts:
        request: 0s
