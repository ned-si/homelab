# argo.lilalala.com -> argocd-server, in Argo CD's namespace (no
# ReferenceGrant). Plain HTTP: TLS ends at the Gateway (ADR 0007), which needs
# `server.insecure: true` in bootstrap/argocd-values.yaml or it loops.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argo
spec:
  # group/kind/weight and the catch-all match are the API server's defaults,
  # spelled out so that Argo CD's diff sees no drift.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - argo.lilalala.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), payment=(), usb=()"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
      backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 80
          weight: 1
      # Unlimited on purpose: the UI holds watch streams
      # (/api/v1/stream/applications) and log follows open; Envoy's 15 s
      # default would cut them. Unauthenticated requests get a 401 at once.
      timeouts:
        request: 0s
