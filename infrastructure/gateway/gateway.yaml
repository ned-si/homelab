# The shared Gateway (Cilium, ADR 0007) on 192.168.1.254, the router's 80/443
# target, pinned through `spec.infrastructure.annotations` on the Service
# Cilium creates. external-dns publishes the WAN address for every route; no
# target annotation here, so the WAN IP has one copy.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared
  namespace: gateway
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "192.168.1.254"
  listeners:
    # Plain HTTP exists only to redirect: see http-redirect.yaml.
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.lilalala.com"
      allowedRoutes:
        namespaces:
          from: All

    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.lilalala.com"
      # The `group` fields are the API server's defaults, spelled out so that
      # Argo CD's diff (server-side apply, no last-applied annotation) sees no
      # drift.
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-lilalala-tls
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
