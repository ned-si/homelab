# One wildcard certificate for the site, declared rather than left to the
# Gateway shim so the DNS-01 dependency is visible. The Secret lives in the
# Gateway's namespace. Prove a new setup with `letsencrypt-staging` first.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-lilalala
  namespace: gateway
spec:
  secretName: wildcard-lilalala-tls
  # Wildcard only: no listener serves the apex, and an apex SAN needs a
  # second DNS-01 challenge on the same TXT name, which never completes on
  # Cloudflare before cert-manager v1.16.4 (cert-manager#7540).
  commonName: "*.lilalala.com"
  dnsNames:
    - "*.lilalala.com"
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
    # Rotate the key on every renewal rather than reusing it for years.
    rotationPolicy: Always
  duration: 2160h    # 90d, the only value Let's Encrypt issues
  renewBefore: 720h  # 30d, so there is a month of slack to notice a failure
