# homelab.nedsi.io, the public dashboard (spec homelab-dashboard, Address).
# Its own Certificate, so adding the name does not reissue nedsi-io.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-nedsi-io
  namespace: gateway
spec:
  secretName: homelab-nedsi-io-tls
  commonName: homelab.nedsi.io
  dnsNames:
    - homelab.nedsi.io
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  duration: 2160h    # 90d, the only value Let's Encrypt issues
  renewBefore: 720h  # 30d
