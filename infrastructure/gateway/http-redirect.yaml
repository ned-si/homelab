# HTTP -> HTTPS for every hostname on the shared Gateway (301, cached).
#
# DNS: this route must never create a record. external-dns v0.15.0 has no
# `exclude` annotation; its gateway-httproute source skips a route whose
# `external-dns.alpha.kubernetes.io/controller` annotation is not
# `dns-controller`, so `none` keeps the wildcard hostname out of Cloudflare.
# CI (repo-policy `wildcard-route-dns`) requires this on any wildcard route.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: gateway
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
spec:
  # group/kind and the catch-all match are the API server's defaults, spelled
  # out so that Argo CD's diff sees no drift.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: http
  hostnames:
    - "*.lilalala.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
