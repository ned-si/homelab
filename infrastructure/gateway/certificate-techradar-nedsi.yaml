# techradar.nedsi.io, the tech radar (spec tech-radar, Serving). Its own
# Certificate, so adding the name does not reissue the live ones.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: techradar-nedsi-io
  namespace: gateway
spec:
  secretName: techradar-nedsi-io-tls
  commonName: techradar.nedsi.io
  dnsNames:
    - techradar.nedsi.io
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  duration: 2160h    # 90d, the only value Let's Encrypt issues
  renewBefore: 720h  # 30d
