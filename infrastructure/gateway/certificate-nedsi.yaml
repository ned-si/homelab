# nedsi.io, www.nedsi.io and blog.nedsi.io (spec public-website). Each SAN has
# its own TXT name, so the apex issue of certificate.yaml does not apply.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nedsi-io
  namespace: gateway
spec:
  secretName: nedsi-io-tls
  commonName: nedsi.io
  dnsNames:
    - nedsi.io
    - www.nedsi.io
    - blog.nedsi.io
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  duration: 2160h    # 90d, the only value Let's Encrypt issues
  renewBefore: 720h  # 30d
