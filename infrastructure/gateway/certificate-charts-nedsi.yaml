# charts.nedsi.io, the drum charts (spec drum-charts-site, Serving). Its own
# Certificate, so adding the name does not reissue the live ones.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: charts-nedsi-io
  namespace: gateway
spec:
  secretName: charts-nedsi-io-tls
  commonName: charts.nedsi.io
  dnsNames:
    - charts.nedsi.io
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  duration: 2160h    # 90d, the only value Let's Encrypt issues
  renewBefore: 720h  # 30d
