# Kyverno: admission and reports controllers
# (docs/architecture.md#admission-policy-kyverno).
#
# Cold start never waits on Kyverno: webhooks fail open, policies use
# failurePolicy Ignore and a 3 s timeout, the cold-start namespaces are
# skipped (findings there are PolicyExceptions), and no Helm hooks. The
# background controller is off to save memory. Images pinned by digest.

crds:
  # A post-upgrade Helm hook that rewrites stored objects to the newest CRD
  # version. Under Argo CD it becomes a Job on every sync. Run it by hand when
  # a Kyverno minor drops a CRD version (release notes).
  migration:
    enabled: false

webhooksCleanup:
  # pre-delete hook; Argo CD never deletes this release.
  enabled: false

config:
  webhooks:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - argo
            - cilium
            - kyverno
            - tailscale

features:
  forceFailurePolicyIgnore:
    enabled: true
  # No policy opts in (spec.autogen.validatingAdmissionPolicy); the webhook
  # namespaceSelector above would not apply to a generated one.
  generateValidatingAdmissionPolicy:
    enabled: false
  policyExceptions:
    enabled: true
    namespace: kyverno
  logging:
    format: json
  backgroundScan:
    backgroundScanInterval: 1h
    backgroundScanWorkers: 1

admissionController:
  replicas: 1
  initContainer:
    image:
      registry: ghcr.io
      repository: kyverno/kyvernopre
      # renovate: datasource=docker depName=ghcr.io/kyverno/kyvernopre
      tag: v1.20.0@sha256:339067e083430e0c97007541bef9cfdbac89bee13f7228772c77ae8aead14b8b
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  container:
    image:
      registry: ghcr.io
      repository: kyverno/kyverno
      # renovate: datasource=docker depName=ghcr.io/kyverno/kyverno
      tag: v1.20.0@sha256:9de49c5416ea536f00a205527197ac048abdf32c5a75d633cd9afff8928f359d
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 384Mi

backgroundController:
  enabled: false

cleanupController:
  enabled: true
  replicas: 1
  image:
    registry: ghcr.io
    repository: kyverno/cleanup-controller
    # renovate: datasource=docker depName=ghcr.io/kyverno/cleanup-controller
    tag: v1.20.0@sha256:0f9ce0c203561c52499e871a987ff987371f57385fcafe7af1a01dfd6db1feee
  rbac:
    clusterRole:
      # What the DeletingPolicies delete; the chart grants no deletes.
      extraResources:
        - apiGroups: [""]
          resources: [pods]
          verbs: [get, list, watch, delete]
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

reportsController:
  replicas: 1
  image:
    registry: ghcr.io
    repository: kyverno/reports-controller
    # renovate: datasource=docker depName=ghcr.io/kyverno/reports-controller
    tag: v1.20.0@sha256:f54e3cc106fadb1a615d0ec11c42f741f51d3580a5f70dfbe7bd7ec58864ef03
  rbac:
    clusterRole:
      # Kyverno reports a pods/ephemeralcontainers policy only if this
      # ServiceAccount can read every resource it matches.
      extraResources:
        - apiGroups: [""]
          resources: [pods/ephemeralcontainers]
        # check-deprecated-apis matches these; the chart grants none of them
        # (#1039). podsecuritypolicies no longer exists on 1.37, but the
        # check asks for it all the same.
        - apiGroups: [policy]
          resources: [podsecuritypolicies]
        - apiGroups: [node.k8s.io]
          resources: [runtimeclasses]
        - apiGroups: [flowcontrol.apiserver.k8s.io]
          resources: [flowschemas, prioritylevelconfigurations]
        - apiGroups: [storage.k8s.io]
          resources: [csistoragecapacities]
  # Scraped for KyvernoReportsStale: only the reconcile counter (the
  # background scan) and kyverno_info; the execution-duration histograms are
  # about 4000 series nobody reads.
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: kyverno_controller_reconcile_total|kyverno_info
        action: keep
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# The kyverno-api subchart renders empty `labels: {}` the API server drops, so
# Argo CD never converged. One label makes the map real.
kyverno-api:
  labels:
    app.kubernetes.io/part-of: kyverno
  annotations:
    homelab.lilalala.com/source: kyverno-api subchart of the kyverno chart
