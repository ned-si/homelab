# Kyverno chart values: the admission controller and the reports controller,
# Audit only (docs/architecture.md#admission-policy-kyverno).
#
# Cold start never waits on Kyverno:
#   - every webhook Kyverno registers fails open (forceFailurePolicyIgnore),
#     and every policy sets failurePolicy Ignore and a 3 s webhook timeout
#     (infrastructure/kyverno-policies);
#   - the webhooks skip the namespaces a cold start depends on, so a Kyverno
#     outage never sits in their pod-creation path. Background scans still
#     report on them; expected findings are PolicyExceptions
#     (policies/kyverno/exceptions);
#   - no Helm hooks: Argo CD would run them on every sync.
#
# Off to save memory on the SBCs: the background controller (generate and
# mutate-existing policies, none here). The cleanup controller runs the
# DeletingPolicies (infrastructure/kyverno-policies/delete-shutdown-pods.yaml).
# The reports controller runs the hourly background
# scan and writes the wgpolicyk8s.io PolicyReports.
#
# Images are pinned by digest; Renovate moves tag and digest together with the
# chart (the chart's appVersion is the image tag).

crds:
  # A post-upgrade Helm hook that rewrites stored objects to the newest CRD
  # version. Under Argo CD it becomes a Job on every sync. Run it by hand when
  # a Kyverno minor drops a CRD version (release notes).
  migration:
    enabled: false

webhooksCleanup:
  # pre-delete hook; Argo CD never deletes this release.
  enabled: false

config:
  webhooks:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - argo
            - cilium
            - kyverno
            - tailscale

features:
  forceFailurePolicyIgnore:
    enabled: true
  # No policy opts in (spec.autogen.validatingAdmissionPolicy); the webhook
  # namespaceSelector above would not apply to a generated one.
  generateValidatingAdmissionPolicy:
    enabled: false
  policyExceptions:
    enabled: true
    namespace: kyverno
  logging:
    format: json
  backgroundScan:
    backgroundScanInterval: 1h
    backgroundScanWorkers: 1

admissionController:
  replicas: 1
  initContainer:
    image:
      registry: ghcr.io
      repository: kyverno/kyvernopre
      # renovate: datasource=docker depName=ghcr.io/kyverno/kyvernopre
      tag: v1.19.2@sha256:27f3cc52e628559b56d08363b85316819802086c9808606914f7805a244148f4
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  container:
    image:
      registry: ghcr.io
      repository: kyverno/kyverno
      # renovate: datasource=docker depName=ghcr.io/kyverno/kyverno
      tag: v1.19.2@sha256:c8c4dd09e720d2cd7fd24ca73ac28e46651001372f988e0cba3f2f612f04b955
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 384Mi

backgroundController:
  enabled: false

cleanupController:
  enabled: true
  replicas: 1
  image:
    registry: ghcr.io
    repository: kyverno/cleanup-controller
    # renovate: datasource=docker depName=ghcr.io/kyverno/cleanup-controller
    tag: v1.19.2@sha256:d7340aa7c9315080c3dafa7b765d090ced37353e89e5cd7a3f9ac69e8fb532b2
  rbac:
    clusterRole:
      # What the DeletingPolicies delete; the chart grants no deletes.
      extraResources:
        - apiGroups: [""]
          resources: [pods]
          verbs: [get, list, watch, delete]
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

reportsController:
  replicas: 1
  image:
    registry: ghcr.io
    repository: kyverno/reports-controller
    # renovate: datasource=docker depName=ghcr.io/kyverno/reports-controller
    tag: v1.19.2@sha256:5fb6d3e738050dbce84f60ecabaede7665fbe0578d07c1e8c912443b035e79c3
  # Scraped for KyvernoReportsStale: only the reconcile counter (the
  # background scan) and kyverno_info; the execution-duration histograms are
  # about 4000 series nobody reads.
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: kyverno_controller_reconcile_total|kyverno_info
        action: keep
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# The policies.kyverno.io CRDs come from the `kyverno-api` subchart, which
# renders them with `labels: {}` and `annotations: {}`; the API server drops an empty map, so Argo
# CD's diff never converged and the app stayed OutOfSync from the first sync
# (2026-10-17). One label makes the map real. (`crds.customLabels` only
# reaches the `crds` subchart's kyverno.io CRDs.)
kyverno-api:
  labels:
    app.kubernetes.io/part-of: kyverno
  annotations:
    homelab.lilalala.com/source: kyverno-api subchart of the kyverno chart
