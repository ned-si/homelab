# theater: qBittorrent, Prowlarr, Sonarr/Radarr/Lidarr, Plex, Jellyfin and the
# four CloudNativePG clusters behind the *arr apps.
#
# Per workload: qBittorrent fetches arbitrary content and is published on a
# LoadBalancer, so it must not reach the databases, the NAS or the API server.
#
#   1. Kubelet probes are allowed by `--allow-localhost=auto`; the
#      `fromEntities: [host, remote-node]` rules keep that true under `policy`.
#   2. The Gateway proxy is `reserved:ingress`. `host` and `remote-node` are
#      listed too: with `bpf.masquerade: false` cross-node traffic can arrive
#      SNATed to a node address.
#   3. No Service ClusterIPs: kube-proxy replacement translates them before
#      policy, so rules select the backend pods by label.
---
# ---------------------------------------------------------------------------
# qBittorrent
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qbittorrent
  namespace: theater
spec:
  description: >-
    qBittorrent: WebUI reachable from the Gateway and the *arr apps, peer port
    reachable from the LAN, egress to internet peers but NOT to the LAN.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  # Off: an allow-list only; default-deny is switched in ./90-enforcement.yaml.
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # WebUI through the SSO proxy (`qbittorrent-sso`, apps/theater/sso.yaml).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: sso-proxy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # Direct from the Gateway. Unused while SSO is in front; kept so reverting
    # SSO (a two-line HTTPRoute change) needs no policy change.
    - fromEntities:
        - ingress
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # The *arr apps poll the WebUI API (download client); the
    # `qbittorrent-private-seed` CronJob force-starts private torrents.
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [sonarr, radarr, lidarr, qbittorrent-private-seed]
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # Inbound peers via the `qbittorrent-peer` LoadBalancer (50000 TCP+UDP).
    # `host`/`remote-node`: the node holding the L2 announcement may SNAT
    # before forwarding to a pod on another node.
    #
    # Intended drop (spec netpol-default-deny, decision D5): `world` to
    # qBittorrent outside these rules, port not seen live. 4 connections in
    # the 7 days to 2026-11-04, the last on 2026-11-01; the only ingress
    # would-be drop of `theater`. Internet traffic reaches the pod only
    # through the router's 50000/TCP forward to `qbittorrent-seed`, which
    # this rule matches, so these are packets Cilium no longer tracks: most
    # likely late packets (FIN, RST, UDP replies) of outbound peer
    # connections whose conntrack entry expired, or ICMP types other than the
    # errors `qbittorrent-icmp` allows. qBittorrent uses neither: the
    # connections are already closed. Re-check at the theater ingress flip.
    - fromEntities:
        - world
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
            - port: "50000"
              protocol: UDP
  egress:
    # Cluster DNS. Check the selector: kubectl -n kube-system get pods -l k8s-app=kube-dns
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # Trackers, DHT and peers: any host, any port, RFC1918 excepted. `world`
    # would include the LAN and expose the NAS (NFS, iSCSI, TrueNAS UI).
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 192.168.0.0/16    # the LAN, including the LoadBalancer pools
            - 10.0.0.0/8        # Cilium's default cluster-pool pod CIDR
            - 172.16.0.0/12
            - 169.254.0.0/16    # link-local, incl. cloud metadata addresses
            - 127.0.0.0/8
---
# ---------------------------------------------------------------------------
# Sonarr / Radarr / Lidarr: one policy, they differ only in port and database.
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arr-apps
  namespace: theater
spec:
  description: >-
    Sonarr/Radarr/Lidarr: UI from the Gateway, release pushes from Prowlarr,
    egress to their own Postgres, to qBittorrent, to Prowlarr and to indexers.
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [sonarr, radarr, lidarr]
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # The SSO proxies (`<app>-sso`, apps/theater/sso.yaml): how the UIs are
    # reached from outside.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: sso-proxy
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP    # sonarr
            - port: "7878"
              protocol: TCP    # radarr
            - port: "8686"
              protocol: TCP    # lidarr

    # Direct from the Gateway. Unused while SSO is in front; kept so reverting
    # SSO (a two-line HTTPRoute change) does not turn into a silent 503 once
    # enforcement is on.
    - fromEntities:
        - ingress
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP    # sonarr
            - port: "7878"
              protocol: TCP    # radarr
            - port: "8686"
              protocol: TCP    # lidarr

    # Prowlarr pushes indexers and releases into each app's API.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prowlarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
            - port: "7878"
              protocol: TCP
            - port: "8686"
              protocol: TCP

    # Bazarr polls Sonarr and Radarr for the library and file paths. Not
    # Lidarr: Bazarr handles TV and film only. In-cluster Service traffic, so
    # the SSO proxy is not in this path.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: bazarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
            - port: "7878"
              protocol: TCP

    # Recyclarr, the bazarr-settings and bazarr-nightly Jobs and
    # arr-import-lists, by their own labels: the job-name selector would also
    # grant the backup jobs these ports. None touches Lidarr (8686).
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [recyclarr-sync, bazarr-settings, bazarr-nightly, arr-import-lists]
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
            - port: "7878"
              protocol: TCP
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # Every *arr database in one rule: what matters is that qBittorrent, Plex
    # and Jellyfin cannot reach any of them.
    - toEndpoints:
        - matchExpressions:
            - key: cnpg.io/cluster
              operator: In
              values: [sonarr-postgresql, radarr-postgresql, lidarr-postgresql]
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

    # The download client (Service `qbittorrent` :8080).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: qbittorrent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # Indexer search goes through Prowlarr.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prowlarr
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP

    # Metadata providers and update checks. `world`, not `toFQDNs`: FQDN
    # policy routes all DNS through Cilium's L7 DNS proxy.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
---
# ---------------------------------------------------------------------------
# Prowlarr
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prowlarr
  namespace: theater
spec:
  description: >-
    Prowlarr: UI from the Gateway, search API from the three *arr apps, egress to
    its own Postgres, to the *arr apps it syncs, and to indexers on the internet.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # prowlarr.lilalala.com through the SSO proxy (`prowlarr-sso`).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: sso-proxy
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP

    # Direct from the Gateway; unused, kept as on `arr-apps`.
    - fromEntities:
        - ingress
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP

    # Search requests from the *arr apps.
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [sonarr, radarr, lidarr]
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # Its own database (`prowlarr-postgresql-app`).
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: prowlarr-postgresql
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

    # App sync: Prowlarr writes indexer definitions into each *arr app.
    - toEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [sonarr, radarr, lidarr]
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
            - port: "7878"
              protocol: TCP
            - port: "8686"
              protocol: TCP

    # Indexers and trackers. Some private trackers use non-standard ports: if
    # one indexer test fails after enforcement while others pass, add its port
    # here rather than allowing all ports.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
---
# ---------------------------------------------------------------------------
# Bazarr: a client of Sonarr and Radarr that reaches subtitle providers, so
# joining `arr-apps` would widen both sides.
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bazarr
  namespace: theater
spec:
  description: >-
    Bazarr: UI from the Gateway, egress to the Sonarr and Radarr APIs and to
    subtitle providers on the internet.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bazarr
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # Direct from the Gateway. Unused while SSO is in front; kept so reverting
    # SSO (a two-line HTTPRoute change) needs no policy change.
    - fromEntities:
        - ingress
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6767"
              protocol: TCP

    # The `bazarr-settings` PostSync Job and the `bazarr-nightly` CronJob
    # (apps/theater/bazarr.yaml) and the SSO proxy (apps/theater/sso.yaml).
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [bazarr-settings, bazarr-nightly, theater-sso]
      toPorts:
        - ports:
            - port: "6767"
              protocol: TCP
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # Sonarr and Radarr; the matching ingress rule is on `arr-apps`.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: sonarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: radarr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP

    # Subtitle providers. `world` rather than `toFQDNs`, as on `arr-apps`; the
    # provider list is also set in the UI, so an FQDN list would drift and fail
    # as an empty subtitle search.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
---
# ---------------------------------------------------------------------------
# arr-import-lists (apps/theater/arr-import-lists.yaml). No ingress.
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arr-import-lists
  namespace: theater
spec:
  description: >-
    arr-import-lists Job: egress to the Sonarr and Radarr APIs. No ingress.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: arr-import-lists
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: sonarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: radarr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
---
# ---------------------------------------------------------------------------
# qbittorrent-private-seed: egress to the qBittorrent WebUI API only.
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qbittorrent-private-seed
  namespace: theater
spec:
  description: >-
    qbittorrent-private-seed job: egress to the qBittorrent WebUI API. No
    ingress.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent-private-seed
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: qbittorrent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# ---------------------------------------------------------------------------
# Recyclarr: a CronJob, no ingress.
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: recyclarr
  namespace: theater
spec:
  description: >-
    Recyclarr sync job: egress to the Sonarr and Radarr APIs and to GitHub for the
    TRaSH Guides repository. No ingress -- nothing connects to a CronJob.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: recyclarr-sync
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # The two APIs it configures; the matching ingress rule is on `arr-apps`.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: sonarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: radarr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP

    # The TRaSH guides, a git clone over HTTPS: 443 only.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# ---------------------------------------------------------------------------
# bazarr-settings (PostSync Job) and bazarr-nightly (CronJob). No ingress.
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bazarr-settings
  namespace: theater
spec:
  description: >-
    bazarr-settings Job and bazarr-nightly CronJob: egress to the Bazarr,
    Sonarr and Radarr APIs. No ingress.
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [bazarr-settings, bazarr-nightly]
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: bazarr
      toPorts:
        - ports:
            - port: "6767"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: sonarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: radarr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
---
# ---------------------------------------------------------------------------
# SSO proxies, selected by `app.kubernetes.io/component: sso-proxy` so a new
# proxy is covered. In from the Gateway; out to the apps and Keycloak.
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sso-proxies
  namespace: theater
spec:
  description: >-
    oauth2-proxy instances: reachable from the Gateway on 4180, egress to the app
    they front and to Keycloak for the OIDC flow.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: sso-proxy
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # theater.lilalala.com/arr/* and /oauth2 (HTTPRoute `theater` -> :4180).
    - fromEntities:
        - ingress
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP

    # The PostSync smoke test (/ping).
    - fromEndpoints:
        - matchExpressions:
            - key: batch.kubernetes.io/job-name
              operator: Exists
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # The fronted apps. The upstreams are fixed in the proxy's config, not
    # something a request can change.
    - toEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [sonarr, radarr, lidarr, prowlarr, qbittorrent, bazarr, lazylibrarian]
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
            - port: "7878"
              protocol: TCP
            - port: "8686"
              protocol: TCP
            - port: "9696"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "6767"
              protocol: TCP
            - port: "5299"
              protocol: TCP

    # Keycloak via `world`: auth.lilalala.com resolves to the WAN address.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# ---------------------------------------------------------------------------
# Plex and Jellyfin: HTTP through the Gateway, media read-only, internet for
# metadata only.
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: media-servers
  namespace: theater
spec:
  description: >-
    Plex and Jellyfin: HTTP from the Gateway, metadata lookup on the internet,
    and deliberately no in-cluster egress at all.
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [plex, jellyfin]
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # theater.lilalala.com -> Plex :32400, cinema.lilalala.com -> Jellyfin :8096.
    - fromEntities:
        - ingress
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "32400"
              protocol: TCP   # plex
            - port: "8096"
              protocol: TCP   # jellyfin
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # plex.tv and metadata providers. Plex remote access, GDM and DLNA are not
    # allowed and have no LoadBalancer Service; add both together.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
---
# ---------------------------------------------------------------------------
# The four CloudNativePG clusters, selected by `cnpg.io/cluster: Exists`
# (instances and the operator's Jobs). The Barman Cloud sidecar runs in the
# instance pod: policy `postgres-backups`.
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres
  namespace: theater
spec:
  description: >-
    CloudNativePG instances in theater: reachable by their own application and by
    the operator, egress to the Kubernetes API only.
  endpointSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # The applications (`<cluster>-app` Secrets).
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [sonarr, radarr, lidarr, prowlarr, bazarr]
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

    # The CloudNativePG operator: instance manager API on 8000 and 5432 for
    # checks. Without it the operator sees every instance as unknown and stops
    # reconciling.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: immich
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "5432"
              protocol: TCP

    # Replication between instances of one cluster. Unused at `instances: 1`;
    # without it a second instance loops on join.
    - fromEndpoints:
        - matchExpressions:
            - key: cnpg.io/cluster
              operator: Exists
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP

    # Prometheus scrape of the CNPG exporter (:9187), via each Cluster's
    # `monitoring.enablePodMonitor: true`.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP

    # The nightly logical dump (`theater-postgres-backup`, apps/theater/backup.yaml),
    # over the `-rw` Services.
    - fromEndpoints:
        - matchExpressions:
            - key: batch.kubernetes.io/job-name
              operator: Exists
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  egress:
    # Cluster DNS (`<cluster>-rw`, the pod's own FQDN).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # The Kubernetes API: the instance manager watches its Cluster and writes
    # status. `kube-apiserver` matches the real API addresses (the
    # control-plane node IPs behind the `kubernetes` Service).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

    # Peer instances, for the same reason as the matching ingress rule.
    - toEndpoints:
        - matchExpressions:
            - key: cnpg.io/cluster
              operator: Exists
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
---
# ---------------------------------------------------------------------------
# The backup CronJobs (apps/theater/backup.yaml).
#
# `batch.kubernetes.io/job-name: Exists` is on every Job pod and Cilium keeps
# it in the identity, so a new backup job is covered. `cnpg.io/cluster:
# DoesNotExist` leaves CNPG's Jobs to the `postgres` policy.
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backup-jobs
  namespace: theater
spec:
  description: >-
    The theater backup CronJobs: egress to the four Postgres clusters for
    pg_dump and to S3 for restic. No ingress at all.
  endpointSelector:
    matchExpressions:
      - key: batch.kubernetes.io/job-name
        operator: Exists
      - key: cnpg.io/cluster
        operator: DoesNotExist
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # Nothing connects to a backup job; kubelet probes use the always-allowed
    # reserved:host path.
    - fromEntities:
        - host
        - remote-node
  egress:
    # Cluster DNS. Needed to resolve `<cluster>-rw` and the S3 endpoint.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # pg_dump against the four clusters.
    - toEndpoints:
        - matchExpressions:
            - key: cnpg.io/cluster
              operator: Exists
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

    # restic to S3 (RESTIC_REPOSITORY in every job).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# ---------------------------------------------------------------------------
# Observed needs, one policy each (Cilium unions every selecting policy).
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres-backups
  namespace: theater
spec:
  description: >-
    CloudNativePG instances: WAL and base backups to S3, and the weekly backup-verify reads.
  endpointSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # backup-verify-postgres (platform/backup-verify, Sundays 21:00 UTC)
    # compares the live databases with their restores: 50 connections in 7
    # days.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: backup-verify
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  egress:
    # The Barman Cloud plugin sidecar to S3 (eu-central-2 endpoints, 3.5.x
    # and 52.219.x): 52 connections in 45 minutes.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lazylibrarian
  namespace: theater
spec:
  description: >-
    LazyLibrarian: its UI through the SSO proxy, Prowlarr's indexer sync; egress to qBittorrent, Prowlarr and the metadata and audiobook sites.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lazylibrarian
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # The UI through `theater-sso` (65 connections in 45 minutes).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: sso-proxy
      toPorts:
        - ports:
            - port: "5299"
              protocol: TCP
    # Prowlarr pushes its indexers into LazyLibrarian's API.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prowlarr
      toPorts:
        - ports:
            - port: "5299"
              protocol: TCP
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # The download client (96 connections in 45 minutes).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: qbittorrent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Torznab searches through Prowlarr.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prowlarr
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
    # Hardcover, OpenLibrary, AudioBook Bay, cover images: HTTPS only.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lazylibrarian-peers
  namespace: theater
spec:
  description: >-
    The other side of LazyLibrarian's flows: qBittorrent and Prowlarr accept it, Prowlarr reaches its API.
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [qbittorrent, prowlarr]
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: lazylibrarian
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP    # qbittorrent
            - port: "9696"
              protocol: TCP    # prowlarr
  egress:
    # Prowlarr's application sync into LazyLibrarian (19 in 7 days).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: lazylibrarian
      toPorts:
        - ports:
            - port: "5299"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qbittorrent-icmp
  namespace: theater
spec:
  description: >-
    qBittorrent: ICMP errors from internet peers (destination unreachable, time exceeded), so path MTU discovery and failed peers resolve fast.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # 15 in 45 minutes, types 3 and 11 only.
    - fromEntities:
        - world
      icmps:
        - fields:
            - type: 3
              family: IPv4
            - type: 11
              family: IPv4
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hook-jobs
  namespace: theater
spec:
  description: >-
    The Argo CD hook Jobs: presync-backup reads backup status from the Kubernetes API, postsync-smoke calls each app once after a sync.
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [presync-backup, postsync-smoke]
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    # presync-backup: the CronJobs' last success (160 in 7 days).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # postsync-smoke: one HTTP call per app (components/postsync-smoke).
    # The ports of every theater app to every one of them, not per pair: the
    # smoke Job is short-lived and the apps' own policies stay per pair.
    - toEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [bazarr, jellyfin, lazylibrarian, lidarr, plex, prowlarr, qbittorrent, radarr, sonarr, theater-sso]
      toPorts:
        - ports:
            - port: "6767"
              protocol: TCP    # bazarr
            - port: "8096"
              protocol: TCP    # jellyfin
            - port: "5299"
              protocol: TCP    # lazylibrarian
            - port: "8686"
              protocol: TCP    # lidarr
            - port: "32400"
              protocol: TCP    # plex
            - port: "9696"
              protocol: TCP    # prowlarr
            - port: "8080"
              protocol: TCP    # qbittorrent
            - port: "7878"
              protocol: TCP    # radarr
            - port: "8989"
              protocol: TCP    # sonarr
            - port: "4180"
              protocol: TCP    # theater-sso
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: smoke-ingress
  namespace: theater
spec:
  description: >-
    Every theater app accepts the postsync-smoke Job on its HTTP port.
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [bazarr, jellyfin, lazylibrarian, lidarr, plex, prowlarr, qbittorrent, radarr, sonarr, theater-sso]
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: postsync-smoke
      toPorts:
        - ports:
            - port: "6767"
              protocol: TCP    # bazarr
            - port: "8096"
              protocol: TCP    # jellyfin
            - port: "5299"
              protocol: TCP    # lazylibrarian
            - port: "8686"
              protocol: TCP    # lidarr
            - port: "32400"
              protocol: TCP    # plex
            - port: "9696"
              protocol: TCP    # prowlarr
            - port: "8080"
              protocol: TCP    # qbittorrent
            - port: "7878"
              protocol: TCP    # radarr
            - port: "8989"
              protocol: TCP    # sonarr
            - port: "4180"
              protocol: TCP    # theater-sso
