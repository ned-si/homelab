# Ingress allow-lists for the platform namespaces (assessment finding P3,
# issue #1011), not enforced: every policy here is default-allow, so it only
# makes Hubble record policy verdicts. After 7 days,
# `scripts/netpol-observe.sh <namespace> --days 7` lists the flows no rule
# covers (match `all`); those get a rule or a reason, then each namespace gets
# an ingress switch in ./90-enforcement.yaml (docs/runbooks/netpol-enforcement.md).
#
# Common to all: the namespace itself, the API server (admission webhooks,
# conversion, aggregated APIs), kubelet probes (host, remote-node) and
# monitoring (Prometheus scrapes, blackbox probes). Ingress only: egress is
# finding P2. Host-network pods (democratic-csi node plugin) are never
# selected by pod policy.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: platform-ingress
  namespace: argo
spec:
  description: >-
    Argo CD: in from the namespace itself, the API server, kubelet probes and
    monitoring, and the Gateway. Default-allow (observe only).
  endpointSelector: {}
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: argo
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
    # The Gateway (`ingress`): argo.lilalala.com to argocd-server.
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
        - ingress
