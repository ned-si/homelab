# CiliumNetworkPolicy allow-lists for the application namespaces. They block
# nothing until a switch in 90-enforcement.yaml is set; read it first.
# Design: docs/networking.md, "Network policy".
#
# CiliumNetworkPolicy, not NetworkPolicy: it expresses `reserved:ingress`,
# `toEntities: [kube-apiserver]` and `enableDefaultDeny` (a NetworkPolicy
# denies as soon as it selects a pod). Namespaced allow-lists; the one
# cluster-wide policy is the NAS deny (95-nas-egress.yaml).
#
# `theater` is policed per workload; other namespaces as a whole, since their
# chart labels change on upgrades. NFS and iSCSI mounts happen in the host
# network namespace, which pod policy never sees.
#
# Not covered, allow-all: external-dns, gateway, kube-system. Observed, not
# enforced: argo, kyverno, cert-manager, system-upgrade, trivy-system,
# democratic-csi (87-platform-ingress.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:`: these resources span several namespaces and set their own.
resources:
  - 10-theater.yaml
  - 15-theater-metrics.yaml
  - 20-immich.yaml
  - 30-paperless.yaml
  - 40-books.yaml
  - 50-mealie.yaml
  - 60-syncthing.yaml
  - 70-home.yaml
  - 80-backup-verify.yaml
  - 85-keycloak.yaml
  - 87-platform-ingress.yaml
  - 88-monitoring.yaml
  # Every pod: no NAS. A deny, independent of the switch below.
  - 95-nas-egress.yaml
  # The switch. Last on purpose: it is the file you edit.
  - 90-enforcement.yaml
