# mealie: the Mealie Deployment and its `mealie-postgresql` CloudNativePG cluster.
#
# The smallest namespace (two workloads, one route, one database, one
# outbound dependency), so it is enforced first. See ./90-enforcement.yaml.
---
# ---------------------------------------------------------------------------
# Mealie
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mealie
  namespace: mealie
spec:
  description: >-
    Mealie: HTTP from the Gateway, egress to its Postgres, to Keycloak over the
    WAN, and to arbitrary sites for recipe import.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mealie
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # cook.lilalala.com -> mealie :9000.
    # apps/mealie/httproute.yaml -- HTTPRoute `mealie`.
    - fromEntities:
        - ingress
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # The database, via `mealie-postgresql-rw`.
    # apps/mealie/deployment.yaml -- POSTGRES_SERVER from the
    # `mealie-postgresql-app` Secret's `host` key.
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: mealie-postgresql
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

    # HTTPS and HTTP to the internet:
    #
    #   - OIDC discovery at https://auth.lilalala.com, which resolves to the WAN
    #     address, so `world` (see 20-immich.yaml for split-horizon DNS).
    #   - Recipe import by URL scrapes arbitrary sites, many still on plain
    #     HTTP, hence port 80.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
---
# ---------------------------------------------------------------------------
# mealie-postgresql (CloudNativePG)
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mealie-postgres
  namespace: mealie
spec:
  description: >-
    mealie-postgresql instances: reachable by Mealie and the operator, egress to
    the Kubernetes API only.
  endpointSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # The application.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mealie
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

    # The CloudNativePG operator: instance-manager API on 8000, plus 5432.
    # platform/cloudnative-pg/values.yaml -- operator Deployment in cnpg-system.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "5432"
              protocol: TCP

    # Peer instances. `instances: 1` today (apps/mealie/database.yaml).
    - fromEndpoints:
        - matchExpressions:
            - key: cnpg.io/cluster
              operator: Exists
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP

    # Prometheus scrape of the CloudNativePG exporter.
    # apps/mealie/database.yaml -- `monitoring.enablePodMonitor: true`.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP

    # The nightly logical dump.
    # apps/mealie/backup.yaml -- the `mealie-backup` CronJob runs
    # `pg_dump -h "$(cat "$d/host")" -p "$(cat "$d/port")"`, reading the
    # `mealie-postgresql-app` Secret from a projected volume.
    - fromEndpoints:
        - matchExpressions:
            - key: batch.kubernetes.io/job-name
              operator: Exists
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # The Kubernetes API, watched by the instance manager.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

    # No S3 egress: the cluster has no `backup.barmanObjectStore` (its
    # `retentionPolicy` therefore governs nothing). It is protected by the
    # pg_dump in apps/mealie/backup.yaml, whose pod has its own S3 rule.
    # Adding a backup destination needs `toEntities: [world]` on 443 in the
    # same change, or blocked WAL archiving fills pg_wal and stops writes.

    # Peer instances, counterpart of the ingress rule above.
    - toEndpoints:
        - matchExpressions:
            - key: cnpg.io/cluster
              operator: Exists
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
---
# ---------------------------------------------------------------------------
# The backup CronJob
#
# apps/mealie/backup.yaml: `mealie-backup` pushes a pg_dump and the
# `mealie-data` volume to S3 with restic. Separate from `mealie` so the job
# does not inherit port 80. Selectors as in 10-theater.yaml: job-name Exists,
# and `cnpg.io/cluster: DoesNotExist` to stay disjoint from `mealie-postgres`.
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backup-jobs
  namespace: mealie
spec:
  description: >-
    The mealie backup CronJob: egress to Postgres for pg_dump and to S3 on 443
    for restic. Nothing else.
  endpointSelector:
    matchExpressions:
      - key: batch.kubernetes.io/job-name
        operator: Exists
      - key: cnpg.io/cluster
        operator: DoesNotExist
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    # Cluster DNS, to resolve `mealie-postgresql-rw` and the S3 endpoint.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # pg_dump.
    # apps/mealie/backup.yaml -- `mealie-backup`.
    - toEndpoints:
        - matchExpressions:
            - key: cnpg.io/cluster
              operator: Exists
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

    # restic to S3.
    # apps/mealie/backup.yaml -- RESTIC_REPOSITORY s3:https://s3....
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
