# syncthing: one StatefulSet, a ClusterIP for the UI and a LoadBalancer for
# the sync protocol. Selector `app: syncthing`: the StatefulSet selector is
# immutable.
#
# All-ports egress to `world`, RFC1918 included, unlike qBittorrent: LAN
# peers are a normal use, and cutting them falls back to relays silently.
# The cost: an enforced namespace can still reach the NAS.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: syncthing
  namespace: syncthing
spec:
  description: >-
    Syncthing: web UI from its SSO proxy, sync protocol from the LAN and the
    internet, outbound to peers, discovery servers and relays on any port.
  endpointSelector:
    matchLabels:
      app: syncthing
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # The UI only through the `syncthing-sso` proxy; the postsync-smoke Job
    # calls /rest/noauth/health.
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [syncthing-sso, postsync-smoke]
      toPorts:
        - ports:
            - port: "8384"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8384"
              protocol: TCP

    # Sync (22000 TCP+UDP) and local discovery (21027 UDP) through the
    # `syncthing-sync` LoadBalancer. LAN peers also arrive as `world`;
    # `host`/`remote-node` cover SNAT.
    - fromEntities:
        - world
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "22000"
              protocol: TCP
            - port: "22000"
              protocol: UDP
            - port: "21027"
              protocol: UDP
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # Peers, global discovery, relays and STUN, on any port: peers advertise
    # their own ports, and an enumerated set gives peers that connect sometimes.
    - toEntities:
        - world
    # Its own announced addresses (the node IPs, hostPort 22000) and local
    # discovery on the LAN reach the nodes: `host`, `remote-node`, and
    # `kube-apiserver` for the control-plane nodes.
    - toEntities:
        - host
        - remote-node
        - kube-apiserver
      toPorts:
        - ports:
            - port: "22000"
              protocol: TCP
            - port: "22000"
              protocol: UDP
            - port: "21027"
              protocol: UDP
---
# ---------------------------------------------------------------------------
# The backup CronJob (apps/syncthing/backup.yaml). `app: syncthing` does not
# match the Job pod, so it needs its own policy. Selector as in 10-theater.yaml.
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backup-jobs
  namespace: syncthing
spec:
  description: >-
    The syncthing backup CronJob: DNS and restic to S3. It reads a volume, so it
    talks to nothing else.
  endpointSelector:
    matchExpressions:
      - key: batch.kubernetes.io/job-name
        operator: Exists
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    # Cluster DNS, to resolve the S3 endpoint. Repeated here rather than inherited:
    # the policy above does not select this pod.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # restic to S3.
    # apps/syncthing/backup.yaml -- RESTIC_REPOSITORY
    # s3:https://s3.eu-central-1.amazonaws.com/.../syncthing/data
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: syncthing-sso-egress
  namespace: syncthing
spec:
  description: >-
    The Syncthing SSO proxy (oauth2-proxy): DNS, the Syncthing GUI upstream and
    Keycloak (auth.lilalala.com, the WAN address, so `world`; the Gateway if
    DNS answers with it).
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: syncthing-sso
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: syncthing
      toPorts:
        - ports:
            - port: "8384"
              protocol: TCP
    - toEntities:
        - world
        - ingress
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postsync-smoke
  namespace: syncthing
spec:
  description: >-
    The Argo CD PostSync smoke Job (apps/syncthing): DNS and the Syncthing GUI.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: postsync-smoke
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: syncthing
      toPorts:
        - ports:
            - port: "8384"
              protocol: TCP
