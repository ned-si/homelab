# No pod reaches NFS on the NAS (NFS2ROOT, CVE-2026-99362, #1774): one
# crafted NFSv4.1 request to nfsd on 2049 gives root, before any export
# check. 95-nas-egress.yaml already denies every pod outside democratic-csi
# and blackbox-exporter; this rule also covers democratic-csi, whose
# controller and exporter use only 22 and 443. Exempt: blackbox-exporter,
# whose NFS probe feeds HomelabNASDown. The kubelet's NFS mounts run in the
# host network namespace and are never selected.
#
# AUDIT: an allow rule with default-deny off, so it drops nothing. Hubble
# names it in `egress_allowed_by` on every flow it would drop. Enforcing is
# one word, `egress` to `egressDeny`, here and in repo-policy rule
# `nas-nfs-deny` (scripts/ci/repo_policy.py, NAS_NFS_RULE).
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-pod-nfs-to-nas
spec:
  description: >-
    No pod but blackbox-exporter reaches NFS (2049) on the NAS. Audit: an
    allow rule, drops nothing until it becomes egressDeny.
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [prometheus-blackbox-exporter]
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toCIDR:
        - 192.168.1.228/32
      toPorts:
        - ports:
            - port: "2049"
              protocol: TCP
            - port: "2049"
              protocol: UDP
