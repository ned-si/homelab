# immich: server, machine-learning, Valkey, the `immich-db` cluster and two
# restic CronJobs.
#
# The namespace is the boundary for the app (chart labels change between
# versions; only `app.kubernetes.io/name: immich-server` is relied on), with
# a tighter policy for the database.
---
# ---------------------------------------------------------------------------
# Everything in the namespace except the Postgres instances
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-app
  namespace: immich
spec:
  description: >-
    Immich server, machine-learning, Valkey and the restic CronJobs. Free
    movement inside the namespace; outside it only the Gateway, Prometheus, DNS
    and HTTPS to the internet.
  endpointSelector:
    # Everything in `immich` except the CNPG instances (`immich-postgres`
    # below), so a drop comes from exactly one policy.
    matchExpressions:
      - key: cnpg.io/cluster
        operator: DoesNotExist
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # media.lilalala.com -> immich-server :2283.
    # apps/immich/resources/httproute.yaml -- HTTPRoute `immich`, with `request:
    # 0s` so multi-GB uploads are not cut off.
    - fromEntities:
        - ingress
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP

    # Between the chart's own components. No `toPorts`: the ports belong to
    # the chart, and pinning them makes every chart bump a policy edit.
    - fromEndpoints:
        - {}

    # Prometheus scrape (`immich.metrics.enabled: true`). No `toPorts`: the
    # chart chooses the metrics ports.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # Intra-namespace, the counterpart of the ingress rule above.
    - toEndpoints:
        - {}

    # The database, via `immich-db-rw`.
    # apps/immich/values.yaml -- DB_HOSTNAME: immich-db-rw, credentials from the
    # `immich-db-app` Secret.
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: immich-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

    # HTTPS out: CLIP model downloads, OIDC discovery (auth.lilalala.com
    # resolves to the WAN address, so `world`), reverse geocoding and version
    # checks, and the S3 restic CronJob.
    #
    # With split-horizon DNS for auth.lilalala.com, OIDC also needs:
    #
    #     - toEntities: [ingress, host, remote-node]
    #       toPorts:
    #         - ports:
    #             - port: "443"
    #               protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# ---------------------------------------------------------------------------
# immich-db (CloudNativePG, VectorChord)
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-postgres
  namespace: immich
spec:
  description: >-
    immich-db instances: reachable by the Immich components and the operator,
    egress to the Kubernetes API and to S3 for WAL archiving.
  endpointSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # The Immich components.
    # apps/immich/values.yaml -- DB_HOSTNAME: immich-db-rw.
    - fromEndpoints:
        - matchExpressions:
            - key: cnpg.io/cluster
              operator: DoesNotExist
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

    # The CloudNativePG operator: instance-manager API on 8000, plus 5432.
    # The operator Deployment runs in namespace immich
    # (clusters/homelab/platform/cnpg.yaml).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: immich
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "5432"
              protocol: TCP

    # Peer instances. `instances: 1` today
    # (apps/immich/resources/database.yaml), so unused until it is not.
    - fromEndpoints:
        - matchExpressions:
            - key: cnpg.io/cluster
              operator: Exists
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP

    # Prometheus scrape of the CloudNativePG exporter.
    # apps/immich/resources/database.yaml -- `monitoring.enablePodMonitor: true`.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # The Kubernetes API, watched by the instance manager.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

    # WAL archiving and base backups to S3 (Barman Cloud sidecar). Blocked
    # archiving fills the 5Gi pg_wal volume and stops writes within hours.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # Peer instances, counterpart of the ingress rule above.
    - toEndpoints:
        - matchExpressions:
            - key: cnpg.io/cluster
              operator: Exists
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
---
# ---------------------------------------------------------------------------
# Added from 7 days of flows (spec wave3-network-logs task 7).
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-operator
  namespace: immich
spec:
  description: >-
    The CloudNativePG operator, cluster-wide from this namespace: its admission webhook in, the instance managers of every namespace and the Kubernetes API out.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # The API server calls the CNPG webhooks (failurePolicy Fail) for every
    # Cluster, Backup and ScheduledBackup. Hubble sees these from cilium_host,
    # so as `host` or `remote-node`; `kube-apiserver` covers a routing mode
    # that keeps the node IP.
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    # Instance-manager status (8000) and checks (5432) of every Cluster, in
    # any namespace, so a new Cluster is covered.
    - toEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: Exists
            - key: cnpg.io/cluster
              operator: Exists
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "5432"
              protocol: TCP
    # Reconciling Clusters, Backups and their Secrets (59 in 7 days).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Intended drop: one series of operator -> `world` connections on another
    # port, not seen since the agents restarted. Its only `world` peer is S3.
---
# ---------------------------------------------------------------------------
# Added for the immich flips (spec netpol-default-deny task 13).
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: barman-cloud-plugin
  namespace: immich
spec:
  description: >-
    The Barman Cloud plugin reads its ObjectStores, Secrets and leader lease from the Kubernetes API.
  endpointSelector:
    matchLabels:
      app: barman-cloud
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    # platform/barman-cloud-plugin (Deployment `barman-cloud`,
    # --leader-elect). The operator reaches it on 9090 through immich-app's
    # intra-namespace rule.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hook-jobs
  namespace: immich
spec:
  description: >-
    presync-backup reads backup status from the Kubernetes API.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: presync-backup
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    # components/presync-backup, MODE cnpg. postsync-smoke needs no rule: it
    # calls immich-server inside the namespace (immich-app).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-postgres-verify
  namespace: immich
spec:
  description: >-
    The Immich database accepts the weekly backup-verify reads.
  endpointSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # backup-verify-postgres, Sundays 21:00 UTC (9 in 7 days).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: backup-verify
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
