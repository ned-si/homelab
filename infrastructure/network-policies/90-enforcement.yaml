# The enforcement switch: the one file to edit. Flip, break-glass, revert and
# debugging: docs/runbooks/netpol-enforcement.md.
#
# Every allow-list policy here sets enableDefaultDeny false in both directions;
# only the switches below block anything. Cilium semantics
# (pkg/policy/repository.go):
#   1. `enableDefaultDeny` only affects a direction that has rules, so each
#      policy below carries a real rule in each direction.
#   2. One selecting policy asking for default-deny enables it, so one `true`
#      here overrides every `false` in the allow-list files.
#   3. While all are `false`, Cilium logs "Only default-allow policies,
#      synthesizing ingress wildcard-allow rule" per endpoint. Not an error.
#
# Not used: `policyEnforcementMode: always` (whole cluster at once) and
# `policyAuditMode` (cluster-wide, restarts every agent).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: enforce-default-deny
  namespace: mealie
spec:
  description: >-
    Enforcement switch for the mealie namespace. Also carries the two rules every
    pod needs regardless of workload: kubelet probes in, cluster DNS out.
  endpointSelector: {}
  enableDefaultDeny:
    ingress: false     # <-- true enforces INGRESS default-deny for this namespace
    egress: false      # <-- true enforces EGRESS default-deny for this namespace
  ingress:
    # Kubelet probes from the pod's node. Already allowed by
    # `--allow-localhost=auto`; stated explicitly, and it gives the ingress
    # direction a rule to enforce.
    - fromEntities:
        - host
        - remote-node
  egress:
    # Cluster DNS, repeated from the per-workload policies: this policy
    # selects every pod in the namespace, including future ones, and a DNS
    # drop makes every other drop unreadable.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
