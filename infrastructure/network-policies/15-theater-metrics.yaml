# Metrics paths into the theater namespace, kept apart from the per-workload
# allow-lists in 10-theater.yaml (Cilium allows the union of all policies):
#   - Prometheus scrapes the exportarr sidecars of the *arr apps on 9707;
#   - the usage exporter (monitoring) reads library counts and sessions from
#     Jellyfin's API on 8096;
#   - Prometheus scrapes the subtitle exporter on 9173, which reads Bazarr's
#     API on 6767.
# Off like the rest: an allow-list only, switched in ./90-enforcement.yaml.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arr-metrics
  namespace: theater
spec:
  description: Prometheus scrapes the exportarr sidecars of the *arr apps.
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [sonarr, radarr, lidarr, prowlarr]
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9707"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jellyfin-usage
  namespace: theater
spec:
  description: The usage exporter reads Jellyfin's API.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # The exporter pod only, not all of monitoring: it holds an admin-level
    # Jellyfin key (docs/secrets.md).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: usage-exporter
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: subtitle-exporter
  namespace: theater
spec:
  description: >-
    Subtitle exporter: scraped from monitoring, reads Bazarr's API.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: subtitle-exporter
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9173"
              protocol: TCP
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: bazarr
      toPorts:
        - ports:
            - port: "6767"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bazarr-subtitle-exporter
  namespace: theater
spec:
  description: The subtitle exporter reads Bazarr's API.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bazarr
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: subtitle-exporter
      toPorts:
        - ports:
            - port: "6767"
              protocol: TCP
