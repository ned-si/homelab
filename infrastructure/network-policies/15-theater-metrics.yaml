# Metrics paths into theater: Prometheus to the exportarr sidecars (9707) and
# the subtitle exporter (9173, which reads Bazarr on 6767); the usage exporter
# to Jellyfin's API (8096).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arr-metrics
  namespace: theater
spec:
  description: Prometheus scrapes the exportarr sidecars of the *arr apps.
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [sonarr, radarr, lidarr, prowlarr]
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9707"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jellyfin-usage
  namespace: theater
spec:
  description: The usage exporter reads Jellyfin's API.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # The exporter pod only, not all of monitoring: it holds an admin-level
    # Jellyfin key (docs/secrets.md).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: usage-exporter
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: subtitle-exporter
  namespace: theater
spec:
  description: >-
    Subtitle exporter: scraped from monitoring, reads Bazarr's API.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: subtitle-exporter
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9173"
              protocol: TCP
  egress:
    # Cluster DNS.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: bazarr
      toPorts:
        - ports:
            - port: "6767"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bazarr-subtitle-exporter
  namespace: theater
spec:
  description: The subtitle exporter reads Bazarr's API.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bazarr
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: subtitle-exporter
      toPorts:
        - ports:
            - port: "6767"
              protocol: TCP
