# A graceful node shutdown leaves the node's pods in phase Failed (reason
# NodeShutdown, or Terminated for the ones it stopped). Their controllers
# start replacements, but nothing deletes the dead pods: the
# controller-manager's pod GC only starts above 12500 terminated pods. After
# the rolling reboot of 2026-10-27, 35 stayed (#819).
#
# Every hour, delete those pods when a ReplicaSet, StatefulSet or DaemonSet
# owns them (a replacement exists). Job pods are left to the Jobs' history
# limits; their logs are the backup evidence. Run by Kyverno's cleanup
# controller (infrastructure/kyverno/values.yaml, cleanupController).
apiVersion: policies.kyverno.io/v1
kind: DeletingPolicy
metadata:
  name: delete-shutdown-pods
spec:
  schedule: "17 * * * *"
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
  conditions:
    - name: failed-by-node-shutdown
      expression: >-
        has(object.status.phase) && object.status.phase == 'Failed' &&
        has(object.status.reason) && object.status.reason in ['NodeShutdown', 'Terminated']
    - name: replaced-by-its-controller
      expression: >-
        has(object.metadata.ownerReferences) &&
        object.metadata.ownerReferences.exists(o, o.kind in ['ReplicaSet', 'StatefulSet', 'DaemonSet'])
