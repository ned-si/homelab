# A graceful node shutdown leaves its pods Failed, and pod GC starts only above
# 12500 terminated pods (#819). Every hour, delete those owned by a
# ReplicaSet, StatefulSet or DaemonSet. Job pods stay: their logs are backup
# evidence.
apiVersion: policies.kyverno.io/v1
kind: DeletingPolicy
metadata:
  name: delete-shutdown-pods
spec:
  schedule: "17 * * * *"
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
  conditions:
    - name: failed-by-node-shutdown
      expression: >-
        has(object.status.phase) && object.status.phase == 'Failed' &&
        has(object.status.reason) && object.status.reason in ['NodeShutdown', 'Terminated']
    - name: replaced-by-its-controller
      expression: >-
        has(object.metadata.ownerReferences) &&
        object.metadata.ownerReferences.exists(o, o.kind in ['ReplicaSet', 'StatefulSet', 'DaemonSet'])
