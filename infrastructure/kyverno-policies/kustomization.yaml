apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The ValidatingPolicies the in-cluster Kyverno runs: the same files CI runs
# over deploy/ (policies/kyverno). Audit only; Deny is wave 4, one policy at a
# time, once its reports are clean.
#
# The vendored files stay byte for byte upstream; the cluster settings are
# patched here:
#   - validationActions [Audit]; then [Deny] for the policies below, which
#     had no live finding outside the excluded namespaces on 2026-10-24
#     (after the PolicyExceptions) and block in CI over deploy/ and the
#     rendered Helm apps (scripts/ci/kyverno.sh, BLOCKING). Keep the two
#     lists equal;
#   - failurePolicy Ignore and a 3 s webhook timeout: an evaluation error or a
#     slow Kyverno never blocks a request.
resources:
  - ../../policies/kyverno
  - ../../policies/kyverno/exceptions

patches:
  - target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
    patch: |-
      - op: add
        path: /spec/validationActions
        value: [Audit]
      - op: add
        path: /spec/failurePolicy
        value: Ignore
      - op: add
        path: /spec/webhookConfiguration
        value:
          timeoutSeconds: 3
  - target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: "^(disallow-capabilities|disallow-container-sock-mounts|disallow-default-namespace|disallow-host-namespaces|disallow-host-path|disallow-host-ports|disallow-host-process|disallow-latest-tag|disallow-privileged-containers|disallow-proc-mount|disallow-selinux|require-run-as-non-root-user|restrict-external-ips|restrict-nodeport|restrict-seccomp|restrict-sysctls)$"
    patch: |-
      - op: replace
        path: /spec/validationActions
        value: [Deny]
