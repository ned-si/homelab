apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The ValidatingPolicies CI runs over deploy/ (policies/kyverno), vendored
# byte for byte and patched here: Audit, Deny for the policies below (keep the
# list equal to BLOCKING in scripts/ci/kyverno.sh), failurePolicy Ignore and a
# 3 s timeout so Kyverno never blocks a request.
resources:
  - ../../policies/kyverno
  - ../../policies/kyverno/exceptions
  # Cluster housekeeping, not an admission policy: not run by CI over deploy/.
  - delete-shutdown-pods.yaml

patches:
  - target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
    patch: |-
      - op: add
        path: /spec/validationActions
        value: [Audit]
      - op: add
        path: /spec/failurePolicy
        value: Ignore
      - op: add
        path: /spec/webhookConfiguration
        value:
          timeoutSeconds: 3
  - target:
      group: policies.kyverno.io
      kind: ValidatingPolicy
      name: "^(disallow-capabilities|disallow-container-sock-mounts|disallow-default-namespace|disallow-host-namespaces|disallow-host-path|disallow-host-ports|disallow-host-process|disallow-latest-tag|disallow-privileged-containers|disallow-proc-mount|disallow-selinux|require-probes|require-run-as-non-root-user|restrict-external-ips|restrict-nodeport|restrict-seccomp|restrict-sysctls)$"
    patch: |-
      - op: replace
        path: /spec/validationActions
        value: [Deny]
