# PostSync smoke of the `cilium` Application: a request through the shared
# Gateway for two hostnames, so a Cilium update that leaves the Gateway
# without listeners fails the sync
# (docs/postmortems/2026-10-23-gateway-cilium-xds.md). `--connect-to` targets
# the Gateway Service, so a WAN outage does not fail it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
components:
  - ../../components/postsync-smoke
patches:
  - target: { kind: Job, name: postsync-smoke }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - https://auth.lilalala.com/
          - https://media.lilalala.com/api/server/ping
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: SMOKE_CURL_OPTS
            value: "--connect-to ::cilium-gateway-shared.gateway.svc.cluster.local:"
