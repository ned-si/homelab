# Let's Encrypt staging. Issues untrusted certificates but is effectively
# un-rate-limited.
#
# Use this while bringing the Gateway up in the new house: point the Gateway's
# `cert-manager.io/cluster-issuer` annotation at `letsencrypt-staging`, confirm
# a Certificate reaches Ready, then switch to `letsencrypt`. Getting this order
# wrong is the usual way to burn a week's worth of production rate limit.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: igontfh79hks@opayq.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - lilalala.com
