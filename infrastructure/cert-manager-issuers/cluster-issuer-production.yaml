# Let's Encrypt production (50 certificates per registered domain per week).
# DNS-01: the only solver for a wildcard, and it needs no inbound port 80.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: nedsi@pm.me
    privateKeySecretRef:
      # Holds the registered ACME account key. Renaming it makes cert-manager
      # register a new account and abandon the existing one.
      name: letsencrypt
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
