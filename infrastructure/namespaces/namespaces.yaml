# Every namespace the layered tree deploys into, declared in one place.
#
# PARITY (ADR 0002). Every namespace below already exists on the cluster with
# no Pod Security labels. Adopting this file adds only `warn` and `audit`
# labels: admission keeps accepting every pod, and a pod that would fail the
# level shows up as a warning and an audit event instead. `enforce` is set on
# exactly one namespace, `gateway`, which is new and holds no pods (Cilium's
# Envoy runs in kube-system).
#
# The levels are the target for each namespace. Moving one to `enforce` is its
# own change, after the audit events for that namespace are clean.
#
# `argocd.argoproj.io/sync-options: Delete=false,Prune=false`: Argo CD never
# deletes a namespace, even if it disappears from git.
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
