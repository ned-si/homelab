    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Tailscale operator and its proxies (platform/tailscale-operator).
# privileged: the exit node's Connector pods get the operator's privileged
# `sysctler` init container, which no ProxyClass can remove. Everything else
# here (the operator, the Ingress proxies, the exit node's main container)
# sets a restricted security context; warn and audit stay `restricted`, so
# the init container is the only expected finding.
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Kyverno (infrastructure/kyverno): the chart sets a restricted security
# context on every pod. Its PolicyExceptions live here too.
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Tetragon (platform/tetragon). privileged: the agent loads eBPF programs,
# shares the host PID namespace and mounts /sys/kernel and the BPF filesystem.
# The operator sets a restricted context; warn and audit stay `restricted` to
# show the agent.
apiVersion: v1
kind: Namespace
metadata:
  name: tetragon
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Headlamp and its oauth2-proxy (platform/headlamp). Both set a restricted
# security context.
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# The log agent Vector (platform/vector). privileged: its DaemonSet mounts the
# node's /var/log and /var/lib/vector (hostPath) and runs in the host network
# (Talos sends its logs to 127.0.0.1), which baseline rejects. The
# container runs with every capability dropped and a read-only root.
apiVersion: v1
kind: Namespace
metadata:
  name: logging
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
---
# SigNoz (platform/signoz). baseline, not restricted: the chart exposes no
# container security context for ClickHouse, ZooKeeper's init or the ClickHouse
# operator, so restricted's dropped capabilities and seccomp cannot be set
# there. signoz-sso and the collector set a restricted context; warn and audit
# stay `restricted` to show the rest.
apiVersion: v1
kind: Namespace
metadata:
  name: signoz
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
