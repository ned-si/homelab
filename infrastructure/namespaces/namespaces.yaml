# The complete namespace inventory for this cluster.
#
# Pod Security admission is set per namespace. `restricted` wherever the
# workload tolerates it; `baseline` or `privileged` only where a chart genuinely
# needs it, with the reason stated. Anything unlabelled defaults to `privileged`
# in Kubernetes, which is how clusters quietly end up with no admission control
# at all.
#
# `pod-security.kubernetes.io/warn` is set alongside `enforce` so that tightening
# a namespace later is a matter of reading warnings rather than guessing.

# ---------------------------------------------------------------------------
# Infrastructure
# ---------------------------------------------------------------------------
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: democratic-csi
  labels:
    # CSI node plugins mount host paths and need privileged containers.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged

# ---------------------------------------------------------------------------
# Platform
# ---------------------------------------------------------------------------
---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # node-exporter needs hostPath, hostNetwork and hostPID.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: backup-verify
  labels:
    # Restores databases and files into throwaway resources here. Isolated in its
    # own namespace so its RBAC cannot reach anything live.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted

# ---------------------------------------------------------------------------
# Applications
# ---------------------------------------------------------------------------
---
apiVersion: v1
kind: Namespace
metadata:
  name: theater
  labels:
    # The hotio and Plex images run as a fixed non-root UID via PUID/PGID but
    # do not set a full restricted securityContext, and Plex wants NFS mounts.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: immich
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: mealie
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: paperless
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: seafile
  labels:
    # The seafile-mc image runs its entrypoint as root before dropping.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: syncthing
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
