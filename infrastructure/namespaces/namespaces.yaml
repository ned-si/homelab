# Every namespace the layered tree deploys into, declared in one place.
#
# Pod Security. Every namespace sets `enforce`, `warn` and `audit`
# (repo-policy rule `pod-security-labels`); `warn` and `audit` are the target
# level, never looser than `enforce`. Talos would enforce `baseline` where a
# label is missing (kube-system is exempt); written here, the level holds on
# any cluster. Moving a namespace to `enforce: restricted` follows
# .kiro/specs/pod-security-restricted (scripts/psa-readiness.sh first).
#
# restricted: gateway, argo, cert-manager, external-dns,
#   kubelet-serving-cert-approver, metrics-server, trivy-system, kyverno,
#   headlamp, hubble.
# Below restricted, and why:
#   democratic-csi  privileged: the node plugin needs host namespaces,
#                   hostPath and privileged containers to attach iSCSI disks.
#   monitoring      privileged: node-exporter needs host namespaces, hostPath
#                   and a hostPort.
#   tailscale, tetragon, logging
#                   privileged: reasons at each namespace below.
#   signoz          baseline: the chart sets no security context for
#                   ClickHouse and ZooKeeper.
#   backup-verify, books, theater
#                   baseline: NFS volumes, and images that start as root
#                   (reasons at each namespace below).
#   home, system-upgrade
#                   baseline until their flip (spec tasks 8 and 9).
#   immich, keycloak, mealie, paperless, syncthing
#                   baseline: an app fails restricted (#726, then #1020).
#   ingress         baseline: unused, holds no pods (#1022).
#
# `argocd.argoproj.io/sync-options: Delete=false,Prune=false`: Argo CD never
# deletes a namespace, even if it disappears from git.
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Argo CD itself. bootstrap/main.tf creates it with the same enforce label;
# declaring it here keeps the labels on a cluster that was not bootstrapped
# by OpenTofu.
apiVersion: v1
kind: Namespace
metadata:
  name: argo
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
