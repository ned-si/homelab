# Every namespace the layered tree deploys into, declared in one place.
#
# Pod Security. Talos configures the admission plugin to ENFORCE `baseline`
# in every namespace without an `enforce` label (kube-system is exempt). The
# `warn` and `audit` labels below are the target level for each namespace;
# a pod that would fail it shows up as a warning and an audit event.
#
# `enforce` is set where baseline is wrong:
#   gateway         restricted: new, holds no pods (Cilium's Envoy runs in
#                   kube-system).
#   argo, cert-manager, external-dns
#                   restricted: every pod passes it (server dry-run of
#                   `enforce=restricted`, 2026-10-15: no warnings).
#   democratic-csi  privileged: the node plugin needs host namespaces,
#                   hostPath and privileged containers to attach iSCSI disks.
#   monitoring      privileged: node-exporter needs host namespaces, hostPath
#                   and a hostPort.
# Every other namespace passes baseline today (server dry-run of
# `enforce=baseline` against each namespace, 2026-10-13: no warnings outside
# the two above). Moving one to `enforce: restricted` is its own change, after
# its audit events are clean.
#
# `argocd.argoproj.io/sync-options: Delete=false,Prune=false`: Argo CD never
# deletes a namespace, even if it disappears from git.
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Argo CD itself. bootstrap/main.tf creates it with the same enforce label;
# declaring it here keeps the labels on a cluster that was not bootstrapped
# by OpenTofu.
apiVersion: v1
kind: Namespace
metadata:
  name: argo
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
