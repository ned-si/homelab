# external-dns, `gateway-httproute` as the only source. Chart defaults kept:
# TXT registry, default owner id, no prefix, no domain filter.
provider:
  name: cloudflare

# Records are created and updated, never deleted: a bad render cannot wipe a
# public hostname. The chart requires this to be set explicitly.
policy: upsert-only

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        # Created by the `secrets-infrastructure` Application (SOPS), same
        # Secret name and per-key digest as the running cluster.
        name: cloudflare-api-token-secret
        key: api-token

# Only the shared Gateway's HTTPRoutes publish hostnames (ADR 0011). The
# redirect route opts out with `external-dns.alpha.kubernetes.io/controller:
# none`.
sources:
  - gateway-httproute

# The public WAN IP, set only here (CI rule `wan-ip-single-source`). Dynamic:
# re-check after router reboots. The force flag makes default targets replace
# the Gateway's LAN address on every record (external-dns#6134).
extraArgs:
  - --default-targets=31.164.170.92
  - --force-default-targets
resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    memory: 128Mi
