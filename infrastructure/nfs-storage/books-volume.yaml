# The books library for the `books` namespace, on the same TrueNAS share as
# the media library (./nfs-volumes.yaml). SITE-SPECIFIC: the NAS address, see
# the header there.
#
# Mounted at the share's root, like `theater-data`, and narrowed with subPath
# in each pod: books/audiobooks, books/podcasts, books/ebooks, books/ingest.
# Those directories belong to uid 1000 (docs/books.md).
#
# Retain: a deleted PVC must never delete the library.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: books-data
  labels:
    homelab.lilalala.com/share: books-data
spec:
  capacity:
    # NFS ignores this; Kubernetes uses it only for matching.
    storage: 26Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  # Pin this PV to its claim.
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: books-data
    namespace: books
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
    - timeo=600
    - retrans=2
  nfs:
    server: 192.168.1.228 # SITE-SPECIFIC
    path: /mnt/homelab/k8s/nfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: books-data
  namespace: books
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: books-data
  resources:
    requests:
      storage: 26Ti
