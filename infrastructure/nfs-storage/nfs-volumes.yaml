# Bulk storage on NFS for the theater namespace.
#
# SITE-SPECIFIC: the TrueNAS address, also in ./backup-volume.yaml,
# apps/immich/resources/backup-files.yaml and the encrypted
# infrastructure/secrets/democratic-csi-iscsi.sops.yaml (map in
# docs/architecture.md). Re-render after editing.
#
# ONE PV at the parent of torrents/ and media/: hardlinks cannot cross a
# mount point, and the *arr imports rely on them (instant, no extra space,
# qBittorrent keeps seeding). Two PVs would turn every import into a copy.
#   sonarr/radarr/lidarr   the whole PVC at /data
#   qbittorrent            subPath: torrents at /data/torrents
#   plex/jellyfin          subPath: media at /media (read-only)
#
# `storageClassName: ""` plus `volumeName` pins the claim to this PV; Retain,
# so deleting the claim never touches the share. Export hardening:
# docs/runbooks/nfs-hardening.md.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: theater-data
  labels:
    homelab.lilalala.com/share: theater-data
spec:
  capacity:
    # NFS ignores this; Kubernetes requires it and uses it only for matching.
    storage: 26Ti
  accessModes:
    # RWX: every app in the namespace mounts it simultaneously.
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
    # `hard`: stall rather than corrupt when the NAS disappears.
    - timeo=600
    - retrans=2
  nfs:
    server: 192.168.1.228 # SITE-SPECIFIC
    # The PARENT of both `media/` and `torrents/`. Do not narrow this.
    path: /mnt/homelab/k8s/nfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: theater-data
  namespace: theater
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: theater-data
  resources:
    requests:
      storage: 26Ti
