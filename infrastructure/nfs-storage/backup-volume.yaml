# Local backup tier on NFS (docs/backups.md): restic repositories and database
# dumps. It covers bad upgrades and migrations, and carries the weekly
# `restic check --read-data`; it shares the ZFS pool with the data, so it is
# not disaster protection (that is S3).
#
# SITE-SPECIFIC: the TrueNAS address, also in nfs-volumes.yaml and
# apps/immich/resources/backup-files.yaml.
#
# Dataset homelab/k8s/backups, its own dataset (restricted export, own
# snapshots, no shared fill-up with media), owned by uid/gid 1000: the restic
# jobs run as 1000 and NFS AUTH_SYS passes the ids through.
#
# One PV per namespace on the same export: a PV binds one claim, whatever its
# access mode. Each workload uses its own `subPath`.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: backup-local-immich
  labels:
    homelab.lilalala.com/share: backup-local
spec:
  capacity:
    # Advisory only for NFS. 16.3T was free on the pool when this was created.
    storage: 16Ti
  accessModes:
    - ReadWriteMany
  # A deleted PVC must never be able to trigger deletion of the backups.
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  # Pin this PV to exactly one claim, so the two PVs cannot bind the wrong way
  # round when both are created at once.
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: backup-local
    namespace: immich
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
    - timeo=600
    - retrans=2
  nfs:
    server: 192.168.1.228 # SITE-SPECIFIC
    path: /mnt/homelab/k8s/backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-local
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: backup-local-immich
  resources:
    requests:
      storage: 16Ti
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: backup-local-verify
  labels:
    homelab.lilalala.com/share: backup-local
spec:
  capacity:
    storage: 16Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: backup-local
    namespace: backup-verify
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
    - timeo=600
    - retrans=2
  nfs:
    server: 192.168.1.228 # SITE-SPECIFIC
    path: /mnt/homelab/k8s/backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-local
  namespace: backup-verify
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: backup-local-verify
  resources:
    requests:
      storage: 16Ti
