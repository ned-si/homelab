# L2 announcements (ARP) for LoadBalancer IPs: every node may announce,
# LoadBalancer IPs only. Cilium is the only announcer of these addresses; the
# Kubernetes API VIP is announced by Talos itself (`vip` in
# talos/talconfig.yaml), not by this policy.
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
spec:
  loadBalancerIPs: true
