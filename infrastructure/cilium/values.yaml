# Helm values for the `cilium` release (namespace `kube-system`), rendered by
# the Argo CD Application clusters/homelab/infrastructure/cilium.yaml. A merge
# to main that changes this file rolls the CNI on every node.
#
# The bootstrap of a fresh cluster installs the release with this same file
# (docs/bootstrap.md), then Argo CD adopts it.
#
# Talos settings, from the Talos Cilium guide
# (https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium):
#   - The API server is reached through KubePrism, the load balancer Talos
#     runs on every node at localhost:7445. It works before any pod network
#     exists and does not depend on the VIP.
#   - Talos mounts cgroup v2 itself and does not allow loading kernel modules,
#     so Cilium does not mount cgroups and the agent drops SYS_MODULE (the
#     lists below are the chart defaults without it).
#   - Pod CIDRs come from the node objects (`ipam.mode: kubernetes`), i.e.
#     from the cluster's pod subnet in talos/talconfig.yaml.
# The cluster runs without kube-proxy (`proxy.disabled` in talconfig.yaml), so
# kubeProxyReplacement is required, not optional.
k8sServiceHost: localhost
k8sServicePort: 7445
kubeProxyReplacement: true
ipam:
  mode: kubernetes
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYSLOG
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
externalIPs:
  enabled: true
gatewayAPI:
  enabled: true
# Serves the Gateway on 192.168.1.254 and the pinned LoadBalancer IPs
# (infrastructure/cilium/ip-pools.yaml). The Kubernetes API VIP is not
# Cilium's: Talos announces it (`vip` in talos/talconfig.yaml).
l2announcements:
  enabled: true

# Metrics: the agent on :9962, Hubble on :9965 (both host ports on every
# node), the operator on :9963 and Envoy on :9964 (chart defaults). Scraped by
# the PodMonitors in platform/kube-prometheus-stack/routes/cilium-monitors.yaml,
# not by the chart's ServiceMonitors: the bootstrap and the CI Talos
# rehearsal install this chart before the Prometheus CRDs exist.
#
# Hubble metrics, labelled by namespace (or the reserved identity, such as
# `world` for traffic from outside the cluster) on both ends:
#   flow    every flow by type and verdict
#   drop    drops by reason
#   tcp     TCP flags (SYN without SYN-ACK = failed connections)
#   icmp    ICMP by type
#   httpV2  requests, status and latency of L7 traffic through Envoy (the
#           Gateway)
# No `dns`: Hubble sees DNS only through its DNS proxy, which needs an FQDN
# policy; CoreDNS's own metrics cover DNS.
prometheus:
  enabled: true
hubble:
  metrics:
    enabled:
      - flow:sourceContext=namespace|reserved-identity;destinationContext=namespace|reserved-identity
      - drop:sourceContext=namespace|reserved-identity;destinationContext=namespace|reserved-identity
      - tcp:sourceContext=namespace|reserved-identity;destinationContext=namespace|reserved-identity
      - icmp:sourceContext=namespace|reserved-identity;destinationContext=namespace|reserved-identity
      - httpV2:sourceContext=namespace|reserved-identity;destinationContext=namespace|reserved-identity
  # Relay: one gRPC endpoint for the flows of every node (hubble-relay:80 in
  # kube-system), read by the UI. Its client certificate for the agents'
  # Hubble servers is `hubble-relay-client-certs`, signed by `cilium-ca`
  # (see `tls` below). Neither relay nor UI changes cilium-config: enabling
  # them does not roll the agents. Images stay digest-pinned (chart default
  # `useDigest: true`). Relay metrics on :9966 (PodMonitor hubble-relay):
  # hubble_relay_pool_peer_connection_status, the alert HubbleRelayPeersNotReady.
  relay:
    enabled: true
    prometheus:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  # mTLS between the relay and the agents' Hubble servers, issued by the
  # chart's certgen (method cronJob): it reuses the CA in the Secret
  # `cilium-ca` (or creates it on a new cluster) and writes
  # `hubble-server-certs` and `hubble-relay-client-certs`, valid 365 days.
  # It runs on every sync of the `cilium` Application (the Job is an Argo CD
  # PostSync hook, see `certgen` below) and every four months (the CronJob
  # `hubble-generate-certs`). Agents and relay reload the files without a
  # restart. Not the helm method: Argo CD renders without `lookup`, so each
  # render would sign with a throw-away CA. Not cert-manager: the bootstrap
  # installs this chart before the cert-manager CRDs exist.
  # Alert HubbleCertRenewalStale (platform/kube-prometheus-stack/routes/hubble-alerts.yaml).
  tls:
    auto:
      method: cronJob
      certValidityDuration: 365
      schedule: "0 3 1 */4 *"
  # UI: tailnet only, behind the oauth2-proxy `hubble-sso`
  # (platform/hubble-access); no Service other than the chart's ClusterIP.
  ui:
    enabled: true
    frontend:
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          memory: 64Mi
    backend:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 128Mi

# The Hubble certificate generator (hubble.tls.auto.method cronJob). The
# one-shot Job is an Argo CD PostSync hook: it is not a tracked resource, so a
# new Job name (its spec checksum) leaves nothing to prune, and it re-issues
# the certificates after each sync. The bootstrap's helm install ignores the
# annotations and runs it once. certgen replaces each Secret it writes, labels
# included, so Argo CD does not track them.
certgen:
  annotations:
    job:
      argocd.argoproj.io/hook: PostSync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
