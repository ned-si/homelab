# Helm values for the `cilium` release (namespace `kube-system`), rendered by
# the Argo CD Application clusters/homelab/infrastructure/cilium.yaml. A merge
# to main that changes this file rolls the CNI on every node.
#
# These are the user values of helm revision 16 (Cilium 1.17.18), the release
# Argo CD took over. upgradeCompatibility keeps the 1.16 defaults where 1.17
# changed them, so the 1.16 -> 1.17 upgrade changed versions and not the
# datapath.
#
# The bootstrap of a fresh cluster installs the release with this same file
# (docs/bootstrap.md), then Argo CD adopts it.
upgradeCompatibility: "1.16"
k8sServiceHost: 192.168.1.11
k8sServicePort: 6443
kubeProxyReplacement: true
externalIPs:
  enabled: true
gatewayAPI:
  enabled: true
l2announcements:
  enabled: true
