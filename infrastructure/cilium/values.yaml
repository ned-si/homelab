# Values for the `cilium` release (kube-system). A merge that changes this file
# rolls the CNI on every node; the bootstrap installs with the same file
# (docs/bootstrap.md).
#
# Talos (https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium):
# the API server through KubePrism on localhost:7445, no cgroup mount, no
# SYS_MODULE, pod CIDRs from the nodes. No kube-proxy, so the replacement is
# required.
k8sServiceHost: localhost
k8sServicePort: 7445
kubeProxyReplacement: true
ipam:
  mode: kubernetes
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYSLOG
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
externalIPs:
  enabled: true
gatewayAPI:
  enabled: true
# Set explicitly so the agent config and the Envoy bootstrap render from one
# value (docs/postmortems/2026-10-23-gateway-cilium-xds.md).
envoy:
  xdsMode: ads
# Serves the Gateway on 192.168.1.254 and the pinned LoadBalancer IPs
# (infrastructure/cilium/ip-pools.yaml). The Kubernetes API VIP is not
# Cilium's: Talos announces it (`vip` in talos/talconfig.yaml).
l2announcements:
  enabled: true

# Transparent encryption (assessment finding P4): pod traffic between nodes
# goes through WireGuard (cilium_wg0, UDP 51871) inside the VXLAN tunnel.
# Talos ships the WireGuard module. Pod-to-node and node-to-node traffic stay
# plain (nodeEncryption is beta). Takes effect when the agents restart
# (`rollOutCiliumPods` is off); pods created before keep their old route MTU
# until they restart, and the kernel fragments the few oversized packets.
encryption:
  enabled: true
  type: wireguard
# One agent at a time on a restart (chart default 2 of 4 nodes).
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1

# Metrics: agent :9962, Hubble :9965, operator :9963, Envoy :9964, scraped by
# the PodMonitors in platform/kube-prometheus-stack/routes/cilium-monitors.yaml
# (the chart installs before the Prometheus CRDs exist).
#
# A change to the Hubble metrics list takes effect when the agents restart
# (`rollOutCiliumPods` is off): restart the DaemonSet under a kube-system
# silence. No `dns`: it needs an FQDN policy; CoreDNS metrics cover DNS.
prometheus:
  enabled: true
hubble:
  metrics:
    enabled:
      - flow:sourceContext=namespace|reserved-identity;destinationContext=namespace|reserved-identity
      - drop:sourceContext=namespace|reserved-identity;destinationContext=namespace|reserved-identity
      - tcp:sourceContext=namespace|reserved-identity;destinationContext=namespace|reserved-identity
      - icmp:sourceContext=namespace|reserved-identity;destinationContext=namespace|reserved-identity
      - httpV2:sourceContext=namespace|reserved-identity;destinationContext=namespace|reserved-identity
      # Policy verdicts per new connection, by workload and namespace on both
      # ends: match="all" in a namespace with allow-lists is a would-be drop
      # (platform/kube-prometheus-stack/routes/netpol.yaml).
      - policy:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,destination_namespace
  # Relay: one gRPC endpoint for every node's flows, read by the UI. Neither
  # relay nor UI changes cilium-config, so enabling them does not roll the
  # agents.
  relay:
    enabled: true
    prometheus:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  # mTLS between relay and agents, from the chart's certgen (cronJob method)
  # with the CA in `cilium-ca`, on every sync and every four months. Not the
  # helm method: Argo CD renders without `lookup`, so each render would sign
  # with a new CA. Not cert-manager: the bootstrap installs this chart before
  # its CRDs exist.
  tls:
    auto:
      method: cronJob
      certValidityDuration: 365
      schedule: "0 3 1 */4 *"
  # UI: tailnet only, behind the oauth2-proxy `hubble-sso`
  # (platform/hubble-access); no Service other than the chart's ClusterIP.
  ui:
    enabled: true
    frontend:
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          memory: 64Mi
    backend:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 128Mi

# certgen's Job is a PostSync hook: untracked, so a new Job name leaves nothing
# to prune. The Secrets it replaces are not tracked by Argo CD either.
certgen:
  annotations:
    job:
      argocd.argoproj.io/hook: PostSync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
