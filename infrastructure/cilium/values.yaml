# Helm values for the `cilium` release (namespace `kube-system`), rendered by
# the Argo CD Application clusters/homelab/infrastructure/cilium.yaml. A merge
# to main that changes this file rolls the CNI on every node.
#
# The bootstrap of a fresh cluster installs the release with this same file
# (docs/bootstrap.md), then Argo CD adopts it.
#
# Talos settings, from the Talos Cilium guide
# (https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium):
#   - The API server is reached through KubePrism, the load balancer Talos
#     runs on every node at localhost:7445. It works before any pod network
#     exists and does not depend on the VIP.
#   - Talos mounts cgroup v2 itself and does not allow loading kernel modules,
#     so Cilium does not mount cgroups and the agent drops SYS_MODULE (the
#     lists below are the chart defaults without it).
#   - Pod CIDRs come from the node objects (`ipam.mode: kubernetes`), i.e.
#     from the cluster's pod subnet in talos/talconfig.yaml.
# The cluster runs without kube-proxy (`proxy.disabled` in talconfig.yaml), so
# kubeProxyReplacement is required, not optional.
k8sServiceHost: localhost
k8sServicePort: 7445
kubeProxyReplacement: true
ipam:
  mode: kubernetes
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYSLOG
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
externalIPs:
  enabled: true
gatewayAPI:
  enabled: true
# Serves the Gateway on 192.168.1.254 and the pinned LoadBalancer IPs
# (infrastructure/cilium/ip-pools.yaml). The Kubernetes API VIP is not
# Cilium's: Talos announces it (`vip` in talos/talconfig.yaml).
l2announcements:
  enabled: true

# Metrics: the agent on :9962, Hubble on :9965 (both host ports on every
# node), the operator on :9963 and Envoy on :9964 (chart defaults). Scraped by
# the PodMonitors in platform/kube-prometheus-stack/routes/cilium-monitors.yaml,
# not by the chart's ServiceMonitors: the bootstrap and the CI Talos
# rehearsal install this chart before the Prometheus CRDs exist.
#
# Hubble metrics, labelled by namespace (or the reserved identity, such as
# `world` for traffic from outside the cluster) on both ends:
#   flow    every flow by type and verdict
#   drop    drops by reason
#   tcp     TCP flags (SYN without SYN-ACK = failed connections)
#   icmp    ICMP by type
#   httpV2  requests, status and latency of L7 traffic through Envoy (the
#           Gateway)
# No `dns`: Hubble sees DNS only through its DNS proxy, which needs an FQDN
# policy; CoreDNS's own metrics cover DNS.
prometheus:
  enabled: true
hubble:
  metrics:
    enabled:
      - flow:sourceContext=namespace|reserved-identity;destinationContext=namespace|reserved-identity
      - drop:sourceContext=namespace|reserved-identity;destinationContext=namespace|reserved-identity
      - tcp:sourceContext=namespace|reserved-identity;destinationContext=namespace|reserved-identity
      - icmp:sourceContext=namespace|reserved-identity;destinationContext=namespace|reserved-identity
      - httpV2:sourceContext=namespace|reserved-identity;destinationContext=namespace|reserved-identity
