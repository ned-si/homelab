# LoadBalancer IP pools on the LAN, outside the router's DHCP pool. No
# serviceSelector: the addresses that matter are pinned on the Services with
# `lbipam.cilium.io/ips` (table in docs/networking.md).
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool-1
spec:
  blocks:
    - cidr: 192.168.1.254/32
  disabled: false
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool-2
spec:
  blocks:
    - start: 192.168.1.200
      stop: 192.168.1.227
  disabled: false
