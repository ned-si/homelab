# /etc/selinux/config for the iSCSI node plugin. Without it libselinux reports
# SELinux disabled and libmount drops `context=` from every mount
# (.kiro/specs/wave3-network-logs/design.md, "libmount in the CSI node
# plugin"). Talos decides the real mode. The node plugin cannot start without
# it: never pruned, synced before the DaemonSet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: iscsi-node-selinux-config
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
data:
  config: |
    SELINUX=permissive
    SELINUXTYPE=targeted
