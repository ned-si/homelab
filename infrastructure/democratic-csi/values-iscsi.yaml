csiDriver:
  name: org.democratic-csi.iscsi

# Driver image pinned to tag and digest (the chart default is `latest`). The
# digest rides in `tag` (rendered "<registry>:<tag>"); docker.io, not the
# chart's ghcr.io default, is what the pods run. A change restarts the
# controller and every node pod.
controller:
  driver:
    image:
      registry: docker.io/democraticcsi/democratic-csi
      # renovate: datasource=docker depName=docker.io/democraticcsi/democratic-csi
      tag: v1.9.5@sha256:fc3b7d7ed3a616714139525075312758e23a5d425ffb539ad12c9bd20fb6001f
    resources:
      requests:
        cpu: 20m
        memory: 80Mi
      limits:
        memory: 256Mi
  # No CSI snapshots: no snapshot CRDs or controller; backups are restic and
  # Barman (docs/backups.md). Re-enable with both.
  externalSnapshotter:
    enabled: false
  externalAttacher:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  externalProvisioner:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  externalResizer:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
# Talos has no iscsiadm: the node plugin enters the iscsi-tools extension's
# iscsid namespaces with `nsenter`, which needs the host PID namespace and
# Talos workload isolation off (talos/patches/talosctl/security-profile.yaml).
# State is in /var/iscsi; the path type is empty because it exists only once
# iscsid runs. https://github.com/democratic-csi/democratic-csi#talos
node:
  hostPID: true
  driver:
    image:
      registry: docker.io/democraticcsi/democratic-csi
      # renovate: datasource=docker depName=docker.io/democraticcsi/democratic-csi
      tag: v1.9.5@sha256:fc3b7d7ed3a616714139525075312758e23a5d425ffb539ad12c9bd20fb6001f
    extraEnv:
      - name: ISCSIADM_HOST_STRATEGY
        value: nsenter
      - name: ISCSIADM_HOST_PATH
        value: /usr/local/sbin/iscsiadm
    iscsiDirHostPath: /var/iscsi
    iscsiDirHostPathType: ""
    # libmount keeps `context=` only when libselinux sees SELinux enabled
    # (resources/selinux-config.yaml).
    extraVolumeMounts:
      - name: selinux-config
        mountPath: /etc/selinux/config
        subPath: config
        readOnly: true
    resources:
      requests:
        cpu: 60m
        memory: 144Mi
      limits:
        memory: 320Mi
  extraVolumes:
    - name: selinux-config
      configMap:
        name: iscsi-node-selinux-config
  driverRegistrar:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  cleanup:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

driver:
  # Same name as the Secret the chart used to render, so the pods' volume
  # does not change.
  existingConfigSecret: iscsi-democratic-csi-driver-config
  # Only `driver` is kept in plain text: the chart derives the iSCSI node
  # settings from it, and it is not secret.
  config:
    driver: freenas-iscsi

storageClasses:
  # The default class, reclaimPolicy Delete; data PVs are switched to Retain
  # one by one (docs/backups.md). storageClassName and reclaimPolicy are
  # immutable.
  #
  # mountOptions: the SELinux label Talos gives its own volumes; without it
  # every file is `unlabeled_t`. mountOptions are immutable too, hence
  # Force/Replace, which leaves bound PVs and claims alone. Existing PVs:
  # scripts/pv-selinux-label.sh. CI: repo policy `iscsi-selinux-label`.
  - name: iscsi
    defaultClass: true
    annotations:
      argocd.argoproj.io/sync-options: Force=true,Replace=true
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      fsType: xfs
    mountOptions:
      - context=system_u:object_r:ephemeral_t:s0
    secrets:
      provisioner-secret:
      controller-publish-secret:
      node-stage-secret:
      node-publish-secret:
      controller-expand-secret:
  # For NEW data volumes: same backend, but deleting the PVC keeps the volume
  # on the NAS (the PV goes to Released and can be re-bound). Use it for
  # anything that is not a regenerable cache.
  - name: iscsi-retain
    defaultClass: false
    annotations:
      argocd.argoproj.io/sync-options: Force=true,Replace=true
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      fsType: xfs
    mountOptions:
      - context=system_u:object_r:ephemeral_t:s0
    secrets:
      provisioner-secret:
      controller-publish-secret:
      node-stage-secret:
      node-publish-secret:
      controller-expand-secret:
csiProxy:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
