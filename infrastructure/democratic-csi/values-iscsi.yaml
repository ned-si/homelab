# democratic-csi chart 0.15.1 values for the `democratic-csi` Application
# (release name `iscsi`, namespace democratic-csi). The release name, driver
# name and driver config are what the existing volumes were created with;
# infrastructure/iscsi-volumes/ depends on all three staying the same.
#
# The driver configuration (TrueNAS API key, SSH key, portal) is NOT here. It
# is the SOPS-sealed Secret iscsi-democratic-csi-driver-config
# (infrastructure/secrets/democratic-csi-iscsi.sops.yaml), applied by the
# `secrets-infrastructure` Application and read through
# `driver.existingConfigSecret`, so the chart renders no Secret of its own.
csiDriver:
  name: org.democratic-csi.iscsi

# The driver image, pinned by digest. The chart default is the moving `latest`
# tag, and Kubernetes pulls `latest` on every pod start, so a restart could
# bring up a different driver. The digest is the one the running pods use
# (`latest` on 2026-10-05; no version tag carries it). Changing it restarts
# the controller and every node pod.
# Since chart 0.15 an image is `{registry, tag}`, rendered as
# "<registry>:<tag>", so the digest rides in `tag`. The chart default moved to
# ghcr.io; this stays on the docker.io image the pods run, so the chart bump
# does not change the driver.
controller:
  driver:
    image:
      registry: docker.io/democraticcsi/democratic-csi
      tag: latest@sha256:944d0e65077efbd9c1fdf23997eec8fac4b4bfb7c3de400f63e33a0a849c5ced
# Talos: there is no iscsiadm in the node image. The iscsi-tools system
# extension runs iscsid on the host, and the node plugin runs the host's
# iscsiadm by entering iscsid's namespaces (`nsenter`), which needs the host
# PID namespace. iscsi-tools >= v0.2.0 keeps its state in /var/iscsi, not
# /etc/iscsi (democratic-csi issue #461); the path type is left empty because
# the directory exists only once iscsid has started. This only works with
# Talos workload isolation off (`workloadIsolation: false`, talos/patches/talosctl/security-profile.yaml):
# inside the sandbox the node plugin cannot see iscsid ("failed to find iscsid
# pid for nsenter", measured on a test node).
# https://github.com/democratic-csi/democratic-csi#talos
node:
  hostPID: true
  driver:
    image:
      registry: docker.io/democraticcsi/democratic-csi
      tag: latest@sha256:944d0e65077efbd9c1fdf23997eec8fac4b4bfb7c3de400f63e33a0a849c5ced
    extraEnv:
      - name: ISCSIADM_HOST_STRATEGY
        value: nsenter
      - name: ISCSIADM_HOST_PATH
        value: /usr/local/sbin/iscsiadm
    iscsiDirHostPath: /var/iscsi
    iscsiDirHostPathType: ""

driver:
  # Same name as the Secret the chart used to render, so the pods' volume
  # does not change.
  existingConfigSecret: iscsi-democratic-csi-driver-config
  # Only `driver` is kept in plain text: the chart derives the iSCSI node
  # settings from it, and it is not secret.
  config:
    driver: freenas-iscsi

storageClasses:
  # The running class. Default class, reclaimPolicy Delete. Every existing
  # PersistentVolumeClaim uses it and keeps it: a PVC's storageClassName is
  # immutable, and a StorageClass's reclaimPolicy is immutable too. The data
  # PVs bound through it were switched to Retain individually on 2026-10-04
  # (docs/backups.md); caches stay on Delete.
  - name: iscsi
    defaultClass: true
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      fsType: xfs
    mountOptions: []
    secrets:
      provisioner-secret:
      controller-publish-secret:
      node-stage-secret:
      node-publish-secret:
      controller-expand-secret:
  # For NEW data volumes: same backend, but deleting the PVC keeps the volume
  # on the NAS (the PV goes to Released and can be re-bound). Use it for
  # anything that is not a regenerable cache.
  - name: iscsi-retain
    defaultClass: false
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      fsType: xfs
    mountOptions: []
    secrets:
      provisioner-secret:
      controller-publish-secret:
      node-stage-secret:
      node-publish-secret:
      controller-expand-secret:
