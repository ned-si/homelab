# democratic-csi driver configuration (TrueNAS API key, SSH key, iSCSI portal)
# for the helm-CLI release `iscsi` (chart 0.14.7) in namespace democratic-csi.
#
# This is the exact Secret the chart renders from `driver.config`
# (iscsi-democratic-csi-driver-config), sealed from the running cluster. It is
# NOT applied by Argo CD (it is not in secret-generator.yaml): the release is
# upgraded with helm, and scripts/democratic-csi-values.sh turns this file back
# into the `driver.config` values overlay, so the rendered Secret and the pods'
# checksum/secret annotation stay byte-identical.
