# Tetragon chart values: eBPF process and kernel events on every node, observe
# only (docs/observability.md#runtime-tetragon). The TracingPolicies are the
# vendored upstream library in policies/; none has an enforcement action.
#
# Events: the export-stdout sidecar prints the JSON export file, so Vector
# collects it like any container log. The export file is on
# /var/run/cilium/tetragon, which is the /run tmpfs on Talos, never the eMMC:
# 10 MiB and two rotated copies at most.
#
# Metrics: labels namespace, workload and binary (no pod: one series per pod
# restart). Scraped through the chart's ServiceMonitor.
#
# Images are pinned by digest; Renovate moves tag and digest together with the
# chart and the vendored policies (group `tetragon`).

tetragon:
  image:
    repository: quay.io/cilium/tetragon
    # renovate: datasource=docker depName=quay.io/cilium/tetragon
    tag: v1.7.1@sha256:afc9458ba4bc3f2795da3df6b03d88ce50e175ac3903027de8036e2046b84a02
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  exportFileMaxSizeMB: 10
  exportFileMaxBackups: 2
  # One filter per line; lines are OR'ed, the fields of a line AND'ed.
  exportAllowList: |-
    {"event_set":["PROCESS_EXEC", "PROCESS_KPROBE", "PROCESS_TRACEPOINT", "PROCESS_LSM", "PROCESS_UPROBE"]}
  # Exec on the host ("") and in the system namespaces is metrics only.
  exportDenyList: |-
    {"health_check":true}
    {"event_set":["PROCESS_EXEC"], "namespace":["", "kube-system", "tetragon"]}
  prometheus:
    metricsLabelFilter: "namespace,workload,binary"
    serviceMonitor:
      enabled: true
      scrapeInterval: 60s

tetragonOperator:
  image:
    repository: quay.io/cilium/tetragon-operator
    # renovate: datasource=docker depName=quay.io/cilium/tetragon-operator
    tag: v1.7.1@sha256:cd8b71f6860e4b969c195baa52ddf337505098157e0123577f2db3328b591379
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

export:
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 64Mi
  stdout:
    image:
      repository: quay.io/cilium/hubble-export-stdout
      # renovate: datasource=docker depName=quay.io/cilium/hubble-export-stdout
      tag: v1.1.1@sha256:cf701f96d1c8de30231792e35733e1ab07451e11751ef4f676f482836759da06
