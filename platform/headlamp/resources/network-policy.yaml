# Enforced from the start: Headlamp trusts its identity headers, so only
# headlamp-sso may reach it, and only the Gateway may reach headlamp-sso.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headlamp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  enableDefaultDeny:
    ingress: true
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: headlamp-sso
      toPorts:
        - ports:
            - port: "4466"
              protocol: TCP
    # kubelet probes.
    - fromEntities:
        - host
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headlamp-sso
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp-sso
  enableDefaultDeny:
    ingress: true
    egress: false
  ingress:
    # headlamp.lilalala.com (httproute.yaml) -> headlamp-sso :4180. The
    # Gateway proxy has the identity `ingress`; with `bpf.masquerade: false`
    # its cross-node traffic can arrive SNATed to a node address
    # (infrastructure/network-policies/10-theater.yaml).
    - fromEntities:
        - ingress
        - remote-node
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
    # kubelet probes.
    - fromEntities:
        - host
