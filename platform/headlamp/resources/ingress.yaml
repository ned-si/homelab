# Headlamp on the tailnet only: https://headlamp.<tailnet>.ts.net. The
# Tailscale operator creates the proxy pod (namespace tailscale, ProxyClass
# `restricted`) and its Let's Encrypt certificate. No HTTPRoute: the UI is not
# on the public Gateway.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: headlamp-sso
      port:
        number: 4180
  tls:
    - hosts:
        - headlamp
