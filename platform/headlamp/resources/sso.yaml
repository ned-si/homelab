# Keycloak login in front of Headlamp: HTTPRoute `headlamp` -> headlamp-sso
# :4180 -> headlamp:80. Group `admins`, checked by the client's login flow
# (platform/keycloak/realm/access.conf) and the proxy's allowedGroups. The
# proxy overwrites the X-Forwarded-* headers Headlamp trusts. No break-glass:
# when Keycloak is down, use kubectl. The config ConfigMap's name hash rolls
# the Deployment on change.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp-sso
  labels:
    app.kubernetes.io/name: headlamp-sso
    app.kubernetes.io/component: sso-proxy
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp-sso
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp-sso
        app.kubernetes.io/component: sso-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # `nonroot` in the distroless base image.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          # renovate: datasource=docker depName=quay.io/oauth2-proxy/oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          imagePullPolicy: IfNotPresent
          args:
            - --alpha-config=/config/alpha-config.yaml
            # Authorization is the group in the alpha config.
            - --email-domain=*
            # Behind the shared Gateway.
            - --reverse-proxy=true
            - --redirect-url=https://headlamp.lilalala.com/oauth2/callback
            - --whitelist-domain=headlamp.lilalala.com
            - --cookie-secure=true
            - --cookie-samesite=lax
            # The platform-client session length (platform.conf loa_max_age).
            - --cookie-expire=12h
            - --cookie-refresh=1h
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: headlamp-sso
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          # /ping needs no session and does not depend on Keycloak.
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: headlamp-sso
        - name: secrets
          secret:
            secretName: headlamp-sso
            items:
              - key: client-secret
                path: client-secret
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp-sso
  labels:
    app.kubernetes.io/name: headlamp-sso
    app.kubernetes.io/component: sso-proxy
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4180
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: headlamp-sso
