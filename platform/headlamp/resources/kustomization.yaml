apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Rendered to deploy/platform/headlamp/resources, the third source of the
# headlamp Application.
namespace: headlamp
resources:
  - sso.yaml
  - httproute.yaml
  - rbac.yaml
  - network-policy.yaml

# oauth2-proxy config of headlamp-sso (sso.yaml). The name hash makes a
# change here a new ConfigMap, which rolls the Deployment.
configMapGenerator:
  - name: headlamp-sso
    files:
      - alpha-config.yaml=sso-alpha-config.yaml
