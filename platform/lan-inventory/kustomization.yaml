# lan-inventory: every LAN device from an ARP scan every 5 minutes
# (docs/observability.md). The ConfigMap's name hash rolls the pod when
# inventory.py changes. Tests: tests/test_lan_inventory.py.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - deployment.yaml

configMapGenerator:
  - name: lan-inventory
    files:
      - inventory.py
