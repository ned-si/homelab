# Helm values for the `vector` release (namespace `logging`), the log agent
# (clusters/homelab/platform/vector.yaml, docs/observability.md "Logs").
#
# One DaemonSet pod per node reads /var/log/pods (kubelet's container logs,
# Talos keeps them on the EPHEMERAL partition), parses each line and, for now,
# ships it to SigNoz over OTLP/HTTP (signoz-otel-collector, namespace signoz).
#
# Runs as uid 0 with every capability dropped and a read-only root: the log
# files are root-owned 0640, which root reads as their owner. Kubernetes sets
# no ambient capabilities, so a non-root user with DAC_READ_SEARCH could not.
# The hostPath volumes and the host network are why the namespace enforces
# `privileged`.
#
# Host network: Talos sends its service and kernel logs to 127.0.0.1 on each
# node (talos/patches/logging.yaml, talos/patches/talosctl/kmsg-log.yaml), so
# the listeners must be in the node's network namespace. They bind 127.0.0.1
# only; the API (probes) too. The metrics port (9598) listens on the node's
# addresses, like the Cilium agent's.
role: Agent

podHostNetwork: true
dnsPolicy: ClusterFirstWithHostNet

image:
  repository: docker.io/timberio/vector
  # The digest is a separate key: the chart also writes the tag into the
  # app.kubernetes.io/version label, where `@sha256:...` is not allowed.
  # renovate: datasource=docker depName=docker.io/timberio/vector
  tag: 0.60.0-distroless-libc
  sha: sha256:a9ed9a4710bdc2efa66e94c1e8edc7b439709e6e50079f1e1b2b1bf479d387da

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# 256Mi was OOM-killed on start, while the pods source catches up on every
# existing file under /var/log/pods; steady state is 70-100Mi.
resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    memory: 512Mi

tolerations:
  # Logs of the control planes too.
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# Checkpoints of kubernetes_logs (a few KiB per file) in the chart's hostPath
# /var/lib/vector. No disk buffer: sinks buffer in memory.
service:
  enabled: false

containerPorts:
  - name: prom-exporter
    containerPort: 9598
    protocol: TCP

# The kubelet probes 127.0.0.1 in the node's namespace, where the API listens.
livenessProbe:
  httpGet:
    host: 127.0.0.1
    path: /health
    port: 8686
  initialDelaySeconds: 10
  periodSeconds: 30
  failureThreshold: 5
readinessProbe:
  httpGet:
    host: 127.0.0.1
    path: /health
    port: 8686
  periodSeconds: 10

customConfig:
  data_dir: /vector-data-dir
  # /health for the probes.
  api:
    enabled: true
    address: 127.0.0.1:8686
  sources:
    pods:
      type: kubernetes_logs
      glob_minimum_cooldown_ms: 5000
    # Talos service logs (machine.logging, json_lines).
    talos_services:
      type: socket
      mode: tcp
      address: 127.0.0.1:6050
      decoding:
        codec: json
      framing:
        method: newline_delimited
    # Talos kernel logs (KmsgLogConfig).
    talos_kernel:
      type: socket
      mode: tcp
      address: 127.0.0.1:6051
      decoding:
        codec: json
      framing:
        method: newline_delimited
    vector_metrics:
      type: internal_metrics
  transforms:
    # JSON first, then logfmt (a line that starts with key=value), else the
    # line stays a plain message with parse_failed=true. Parsed fields go
    # under `attributes`; Kubernetes metadata stays under `kubernetes`.
    parsed:
      type: remap
      inputs: [pods]
      source: |
        .log_source = "pods"
        .parse_failed = false
        msg = string(.message) ?? ""
        parsed, err = parse_json(msg)
        if err == null && is_object(parsed) {
          .attributes = parsed
        } else if match(msg, r'^[A-Za-z_][A-Za-z0-9_.-]*=') {
          parsed, err = parse_logfmt(msg)
          if err == null {
            .attributes = parsed
          } else {
            .parse_failed = true
          }
        } else {
          .parse_failed = true
        }
    # Talos fields: msg, talos-level, talos-service (services), facility and
    # priority (kernel). Mapped to the same shape as the pod events.
    talos_parsed:
      type: remap
      inputs: [talos_services, talos_kernel]
      source: |
        raw = .
        .log_source = if exists(raw.facility) { "talos-kernel" } else { "talos-service" }
        default_service = if .log_source == "talos-kernel" { "kernel" } else { "talos" }
        .service = string(raw."talos-service") ?? default_service
        .message = string(raw.msg) ?? ""
        .attributes = {
          "level": string(raw."talos-level") ?? string(raw.priority) ?? "",
          "facility": string(raw.facility) ?? ""
        }
        .host = get_env_var("VECTOR_SELF_NODE_NAME") ?? ""
        .parse_failed = false
        del(.msg)
        del(."talos-level")
        del(."talos-service")
        del(."talos-time")
        del(.facility)
        del(.priority)
        del(.clock)
        del(.seq)
    # Events per namespace and how many did not parse: the trial's parse
    # ratio (vector_log_events_total{namespace, parse_failed}).
    parse_metrics:
      type: log_to_metric
      inputs: [parsed, talos_parsed]
      metrics:
        - type: counter
          field: message
          name: log_events_total
          namespace: vector
          # The chart passes customConfig through Helm's `tpl`: the
          # escapes render as Vector's own `{{ field }}` templates.
          tags:
            namespace: '{{ "{{" }} kubernetes.pod_namespace {{ "}}" }}'
            source: '{{ "{{" }} log_source {{ "}}" }}'
            parse_failed: '{{ "{{" }} parse_failed {{ "}}" }}'
    # Talos auditd records by record type (AVC, SYSCALL, BPF, ...):
    # vector_audit_records_total{node, type}, `node` from the PodMonitor.
    # Counted, never dropped: SELinux denial bursts stay visible in
    # Prometheus (AuditAVCRateHigh) and the records stay in SigNoz.
    # A route, not a filter, abort or missing field: each of those counts the
    # other events in vector_component_discarded_events_total
    # (LogPipelineDiscarding); a route's unconsumed `_unmatched` output does
    # not (checked with Vector 0.59.0). This branch only feeds the counter;
    # the OTLP sink gets every Talos event from talos_parsed.
    audit_route:
      type: route
      inputs: [talos_parsed]
      route:
        auditd: '.service == "auditd"'
    audit_records:
      type: remap
      inputs: [audit_route.auditd]
      source: |
        .audit_type = parse_regex(string(.message) ?? "", r'^type=(?P<t>[A-Z_]+)').t ?? "unknown"
    audit_metrics:
      type: log_to_metric
      inputs: [audit_records]
      metrics:
        - type: counter
          field: audit_type
          name: audit_records_total
          namespace: vector
          tags:
            type: '{{ "{{" }} audit_type {{ "}}" }}'
    # One OTLP log record per event: resource attributes (service.name,
    # k8s.*, host.name, log.source), the parsed fields as record attributes,
    # severity from the `level` field.
    otlp_pods:
      type: remap
      inputs: [parsed]
      source: |
        # One OTLP log record per event (codec otlp of the opentelemetry sink).
        ts = to_unix_timestamp(timestamp(.timestamp) ?? now(), unit: "nanoseconds")
        attrs = {}
        if is_object(.attributes) { attrs = object!(.attributes) }
        level = downcase(string(attrs.level || attrs.lvl || attrs.severity || .level || "") ?? "")
        severity = if includes(["error", "err", "fatal", "panic", "crit", "critical", "alert", "emerg"], level) {
          "ERROR"
        } else if includes(["warn", "warning"], level) {
          "WARN"
        } else if includes(["debug", "trace"], level) {
          "DEBUG"
        } else if level == "" { "UNSPECIFIED" } else { "INFO" }
        record_attrs = [{"key": "parse_failed", "value": {"boolValue": .parse_failed == true}}]
        for_each(attrs) -> |k, v| {
          s = if is_string(v) { string!(v) } else { encode_json(v) }
          record_attrs = push(record_attrs, {"key": k, "value": {"stringValue": s}})
        }
        src = string(.log_source) ?? "pods"
        body = string(attrs.msg || attrs.message) ?? string(.message) ?? ""
        resource = [
          {"key": "log.source", "value": {"stringValue": src}},
          {"key": "host.name", "value": {"stringValue": string(.host) ?? ""}}
        ]
        if src == "pods" {
          resource = push(resource, {"key": "service.name", "value": {"stringValue": string(.kubernetes.container_name) ?? "unknown"}})
          resource = push(resource, {"key": "k8s.namespace.name", "value": {"stringValue": string(.kubernetes.pod_namespace) ?? ""}})
          resource = push(resource, {"key": "k8s.pod.name", "value": {"stringValue": string(.kubernetes.pod_name) ?? ""}})
          resource = push(resource, {"key": "k8s.container.name", "value": {"stringValue": string(.kubernetes.container_name) ?? ""}})
          resource = push(resource, {"key": "k8s.node.name", "value": {"stringValue": string(.kubernetes.pod_node_name) ?? ""}})
        } else {
          resource = push(resource, {"key": "service.name", "value": {"stringValue": string(.service) ?? src}})
        }
        . = {"resourceLogs": [{
          "resource": {"attributes": resource},
          "scopeLogs": [{
            "scope": {"name": "vector"},
            "logRecords": [{
              "timeUnixNano": ts,
              "body": {"stringValue": body},
              "severityText": severity,
              "attributes": record_attrs
            }]
          }]
        }]}
    otlp_talos:
      type: remap
      inputs: [talos_parsed]
      source: |
        # One OTLP log record per event (codec otlp of the opentelemetry sink).
        ts = to_unix_timestamp(timestamp(.timestamp) ?? now(), unit: "nanoseconds")
        attrs = {}
        if is_object(.attributes) { attrs = object!(.attributes) }
        level = downcase(string(attrs.level || attrs.lvl || attrs.severity || .level || "") ?? "")
        severity = if includes(["error", "err", "fatal", "panic", "crit", "critical", "alert", "emerg"], level) {
          "ERROR"
        } else if includes(["warn", "warning"], level) {
          "WARN"
        } else if includes(["debug", "trace"], level) {
          "DEBUG"
        } else if level == "" { "UNSPECIFIED" } else { "INFO" }
        record_attrs = [{"key": "parse_failed", "value": {"boolValue": .parse_failed == true}}]
        for_each(attrs) -> |k, v| {
          s = if is_string(v) { string!(v) } else { encode_json(v) }
          record_attrs = push(record_attrs, {"key": k, "value": {"stringValue": s}})
        }
        src = string(.log_source) ?? "pods"
        body = string(attrs.msg || attrs.message) ?? string(.message) ?? ""
        resource = [
          {"key": "log.source", "value": {"stringValue": src}},
          {"key": "host.name", "value": {"stringValue": string(.host) ?? ""}}
        ]
        if src == "pods" {
          resource = push(resource, {"key": "service.name", "value": {"stringValue": string(.kubernetes.container_name) ?? "unknown"}})
          resource = push(resource, {"key": "k8s.namespace.name", "value": {"stringValue": string(.kubernetes.pod_namespace) ?? ""}})
          resource = push(resource, {"key": "k8s.pod.name", "value": {"stringValue": string(.kubernetes.pod_name) ?? ""}})
          resource = push(resource, {"key": "k8s.container.name", "value": {"stringValue": string(.kubernetes.container_name) ?? ""}})
          resource = push(resource, {"key": "k8s.node.name", "value": {"stringValue": string(.kubernetes.pod_node_name) ?? ""}})
        } else {
          resource = push(resource, {"key": "service.name", "value": {"stringValue": string(.service) ?? src}})
        }
        . = {"resourceLogs": [{
          "resource": {"attributes": resource},
          "scopeLogs": [{
            "scope": {"name": "vector"},
            "logRecords": [{
              "timeUnixNano": ts,
              "body": {"stringValue": body},
              "severityText": severity,
              "attributes": record_attrs
            }]
          }]
        }]}
  sinks:
    # OTLP/HTTP to the SigNoz collector, memory buffers only (no disk: eMMC).
    # Pods block when full (the kubelet keeps the files, Vector resumes from
    # its checkpoint); Talos drops the newest (counted in
    # vector_component_discarded_events_total).
    signoz_pods:
      type: opentelemetry
      inputs: [otlp_pods]
      protocol:
        type: http
        uri: http://signoz-otel-collector.signoz.svc.cluster.local:4318/v1/logs
        method: post
        encoding:
          codec: otlp
      buffer:
        type: memory
        max_size: 33554432
        when_full: block
    signoz_talos:
      type: opentelemetry
      inputs: [otlp_talos]
      protocol:
        type: http
        uri: http://signoz-otel-collector.signoz.svc.cluster.local:4318/v1/logs
        method: post
        encoding:
          codec: otlp
      buffer:
        type: memory
        max_size: 33554432
        when_full: drop_newest
    prometheus:
      type: prometheus_exporter
      inputs: [vector_metrics, parse_metrics, audit_metrics]
      address: 0.0.0.0:9598
