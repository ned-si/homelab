# The Kubernetes version of the cluster. tuppr runs `talosctl upgrade-k8s`
# from a Job: control plane static pods one node at a time, then the kubelet
# on every node; no reboot. It never runs at the same time as a TalosUpgrade.
# A Kubernetes minor cannot be downgraded: the CI rehearsal
# (scripts/ci/talos-upgrade-rehearsal.sh) is the gate, and a broken upgrade is
# fixed forward.
---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
  annotations:
    # After the controller and its webhook (clusters/homelab/platform/tuppr.yaml).
    argocd.argoproj.io/sync-wave: "1"
spec:
  kubernetes:
    # Equal to kubernetesVersion in talos/talconfig.yaml (CI checks).
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.37.2
  healthChecks:
    - apiVersion: v1
      kind: Node
      description: every node Ready
      expr: status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
      timeout: 15m
    - apiVersion: argoproj.io/v1alpha1
      kind: Application
      namespace: argo
      description: every Argo CD Application Healthy
      expr: status.health.status == "Healthy"
      timeout: 15m
