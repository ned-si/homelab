# tuppr values. Chart defaults:
# https://github.com/home-operations/tuppr/blob/main/charts/tuppr/values.yaml
# Its talos.dev ServiceAccount (os:admin) needs KubeTalosAPIAccessConfig
# (talos/patches/talosctl/controlplane/talos-api-access.yaml).
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

# Metrics go to the kube-prometheus-stack Prometheus, which selects on the
# `release` label. The chart's alerts are off: they page on a run waiting
# for its health checks. Ours: platform/kube-prometheus-stack/routes/tuppr-alerts.yaml.
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: false
