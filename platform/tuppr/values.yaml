# tuppr values. Chart defaults:
# https://github.com/home-operations/tuppr/blob/main/charts/tuppr/values.yaml
# Its talos.dev ServiceAccount (os:admin) needs KubeTalosAPIAccessConfig
# (talos/patches/talosctl/controlplane/talos-api-access.yaml).
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

# Metrics and the chart's alerts (TalosUpgradeFailed, KubernetesUpgradeFailed,
# TalosUpgradeStuck, TupprOperatorAbsent, ...) go to the kube-prometheus-stack
# Prometheus, which selects on the `release` label, and show in Grafana;
# The failed, stuck and operator-absent ones also notify, by name
# (docs/sre.md "Paging").
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    labels:
      release: kube-prometheus-stack
