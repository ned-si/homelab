# trivy-operator: CVE reports for every running image, as metrics for the
# Security dashboard (docs/observability.md). Light on purpose: one scan Job
# at a time, the built-in Trivy server holds the DB, vulnerability scanning
# only (CI covers manifests), reports live 24 h.
operator:
  scanJobsConcurrentLimit: 1
  scanJobTimeout: 10m
  scannerReportTTL: 24h
  vulnerabilityScannerEnabled: true
  vulnerabilityScannerScanOnlyCurrentRevisions: true
  sbomGenerationEnabled: false
  configAuditScannerEnabled: false
  rbacAssessmentScannerEnabled: false
  infraAssessmentScannerEnabled: false
  clusterComplianceEnabled: false
  exposedSecretScannerEnabled: false
  builtInTrivyServer: true
  metricsFindingsEnabled: true
  # trivy_vulnerability_id: one series per finding with the CVE and the fixed
  # version, which platform/vuln-enrich joins with KEV and EPSS. Findings
  # without a severity are dropped at the scrape (serviceMonitor below):
  # about 8,700 of 13,700, not actionable.
  metricsVulnIdEnabled: true

# Kubernetes system images are scanned too; nothing is excluded.
excludeNamespaces: ""

compliance:
  specs: []

serviceMonitor:
  enabled: true
  interval: 5m
  labels:
    release: kube-prometheus-stack
  endpointAdditionalProperties:
    metricRelabelings:
      - sourceLabels: [__name__, severity]
        regex: "trivy_vulnerability_id;(Unknown|Low)"
        action: drop

trivyOperator:
  scanJobPodTemplatePodSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  scanJobPodTemplateContainerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true

trivy:
  # Unfixed CVEs are not actionable here: images move only with upstream.
  ignoreUnfixed: true
  severity: MEDIUM,HIGH,CRITICAL
  # `severity` does not drop findings without a severity (mostly Go module
  # advisories): about 60% of the entries. They are not actionable and push
  # the largest reports past the 2 MiB etcd request limit, so the report is
  # never stored.
  ignorePolicy: |
    package trivy

    import rego.v1

    default ignore := false

    ignore if input.Severity == "UNKNOWN"
  slow: true
  storageClassEnabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  server:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
    podSecurityContext:
      runAsUser: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10000
  runAsGroup: 10000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    memory: 512Mi
