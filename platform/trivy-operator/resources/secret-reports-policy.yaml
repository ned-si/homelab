# ExposedSecretReports stay readable to cluster admins only.
#
# The trivy-operator chart labels its ClusterRole
# `aggregate-exposed-secret-reports-view` aggregate-to-view, -edit, -admin and
# -cluster-reader, with no value to turn that off. So every holder of `view`
# (the Headlamp and agent-readonly ServiceAccounts) could list reports that
# point at exposed secrets. This policy strips the view, edit and
# cluster-reader labels from any ClusterRole that grants
# `exposedsecretreports`, whenever it is created or updated (each Argo CD
# sync), so a renamed role in a later chart is covered too. Aggregated roles
# themselves (`view`, `edit`, `admin`) are left alone. The Application ignores
# the stripped labels (clusters/homelab/platform/trivy-operator.yaml).
#
# Headlamp reads vulnerability, config audit and SBOM reports through
# `headlamp-read` (platform/headlamp/resources/rbac.yaml).
#
# Check: kubectl auth can-i list exposedsecretreports.aquasecurity.github.io -A \
#          --as=system:serviceaccount:headlamp:headlamp    # no
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: exposed-secret-reports-admin-only
  annotations:
    # Before the chart's ClusterRoles in the same sync.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusterroles"]
  matchConditions:
    - name: not-an-aggregated-role
      expression: "!has(object.aggregationRule)"
    - name: grants-exposed-secret-reports
      expression: >-
        has(object.rules) && object.rules.exists(r,
        has(r.apiGroups) && r.apiGroups.exists(g, g == 'aquasecurity.github.io') &&
        has(r.resources) && r.resources.exists(x, x == 'exposedsecretreports'))
    - name: aggregated-to-a-reader
      expression: >-
        has(object.metadata.labels) &&
        ['rbac.authorization.k8s.io/aggregate-to-view',
        'rbac.authorization.k8s.io/aggregate-to-edit',
        'rbac.authorization.k8s.io/aggregate-to-cluster-reader'].exists(k, k in object.metadata.labels)
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          ['rbac.authorization.k8s.io/aggregate-to-view',
          'rbac.authorization.k8s.io/aggregate-to-edit',
          'rbac.authorization.k8s.io/aggregate-to-cluster-reader']
          .filter(k, k in object.metadata.labels)
          .map(k, JSONPatch{op: "remove", path: "/metadata/labels/" + jsonpatch.escapeKey(k)})
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: exposed-secret-reports-admin-only
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  policyName: exposed-secret-reports-admin-only
