# KSOPS generator for the platform layer. No database passwords: CloudNativePG
# generates them into `<cluster>-app` Secrets.
---
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: platform-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./keycloak-admin.sops.yaml
  - ./grafana-oidc.sops.yaml
  # Grafana's built-in admin (break-glass), read through
  # `grafana.admin.existingSecret`.
  - ./grafana-admin.sops.yaml
  # One file, several namespaces: the S3 backup credential is needed wherever
  # something is backed up.
  - ./s3-backup.sops.yaml
  # Alertmanager's receiver credentials. The operator mounts it as a volume,
  # so Alertmanager does not start without it.
  - ./alertmanager-notify.sops.yaml
  # GitHub token of Argo CD Notifications (namespace argo), for automatic
  # rollback. Sealed with a PENDING sentinel until the token exists; see the
  # template.
  - ./argocd-notifications.sops.yaml
  # The Keycloak client `argocd`, read by oidc.config in
  # bootstrap/argocd-values.yaml (namespace argo).
  - ./argocd-oidc.sops.yaml
  # Barman Cloud plugin credential, limited to the cnpg/ prefix of the bucket.
  - ./cnpg-backup-s3.sops.yaml
  # Immich and Jellyfin API keys of the usage exporter; PENDING sentinels until
  # the operator creates them (see the template).
  - ./usage-exporter.sops.yaml
  # The read-only AWS metrics key of YACE and aws-cost-exporter.
  - ./aws-exporter.sops.yaml
  # Client secrets of the oauth2-proxy clients (platform.conf `proxy_clients`),
  # set by the keycloak-realm-settings Job. The same values are in the apps'
  # own Secrets (apps/secrets/theater-sso.sops.yaml).
  - ./keycloak-proxy-clients.sops.yaml
  # OAuth client of the Tailscale operator (namespace tailscale).
  - ./tailscale-operator.sops.yaml
  # The Keycloak client `headlamp`: the oauth2-proxy's Secret (namespace
  # headlamp) and the realm Job's copy (namespace keycloak).
  - ./headlamp-sso.sops.yaml
  # The Keycloak client `hubble`: the oauth2-proxy's Secret (namespace hubble)
  # and the realm Job's copy (namespace keycloak).
  - ./hubble-sso.sops.yaml
  # The master client `realm-settings`: the keycloak-realm-settings Job's
  # login, and the Keycloak admin break-glass.
  - ./keycloak-automation.sops.yaml
  # The `homelab` client `pentest-setup`: the realm Job sets it on the
  # client; the pentest setup and teardown of the test user log in with it.
  - ./keycloak-pentest.sops.yaml
  # The Keycloak client `signoz` and SigNoz's own admin login: the
  # oauth2-proxy's Secret (namespace signoz) and the realm Job's copy.
  - ./signoz-sso.sops.yaml
  # The Keycloak client `syncthing`: the oauth2-proxy's Secret (namespace
  # syncthing) and the realm Job's copy (namespace keycloak).
  - ./syncthing-sso.sops.yaml
  # The S3 backup credential in `signoz`, for the metadata backup.
  - ./signoz-backup-s3.sops.yaml
  # The Paperless export passphrase in `backup-verify`, for the restore test;
  # the same value as apps/secrets/paperless-export.sops.yaml.
  - ./paperless-export.sops.yaml
