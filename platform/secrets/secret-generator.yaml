# KSOPS generator for the platform layer.
#
# Note what is absent: any database password. CloudNativePG generates those
# itself into `<cluster>-app` Secrets, so they never enter git at all -- not even
# encrypted. Only credentials that an external system defines (OIDC clients,
# bootstrap admins) need to live here.
---
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: platform-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./keycloak-admin.sops.yaml
  - ./grafana-oidc.sops.yaml
  # One file, several namespaces: the S3 backup credential is needed wherever
  # something is backed up.
  - ./s3-backup.sops.yaml
  # Alertmanager's receiver credentials. Listed here because the Prometheus
  # Operator mounts this Secret into the Alertmanager pod as a volume, so the pod
  # does not start at all until it exists -- which makes it a hard dependency of
  # the whole monitoring stack, not just of notification delivery.
  #
  # Sealed with PENDING sentinels today: no notification transport has been
  # chosen yet. Alertmanager starts, every alert is visible in its own UI and in
  # Grafana, and push delivery fails until real values land. See the receiver
  # comment block in platform/kube-prometheus-stack/values.yaml.
  - ./alertmanager-notify.sops.yaml
