apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` -- each decrypted Secret declares its own.
generators:
  - secret-generator.yaml

# backup-verify is staged (clusters/homelab/staged/), so its namespace does not
# exist and the Secret would fail the sync. Remove this patch when the
# backup-verify Application is enabled.
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: s3-backup
        namespace: backup-verify
