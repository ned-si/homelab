# Read-only access for automation that inspects the cluster (coding agents,
# MCP servers): `view` (no Secrets, no exec, port-forward or proxy) plus
# nodes. No long-lived token: scripts/agent-kubeconfig.sh readonly mints a
# 12-hour one into ~/homelab-backups/agent/kubeconfig-readonly.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-readonly
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-readonly-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: agent-readonly
    namespace: kube-system
---
# `view` is namespaced in spirit: it grants no cluster-scoped kinds.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-readonly-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-readonly-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-readonly-nodes
subjects:
  - kind: ServiceAccount
    name: agent-readonly
    namespace: kube-system
