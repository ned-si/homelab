# blackbox-exporter, the prober; the targets are the Probes in ./probes.
#
#   http_2xx      2xx over valid TLS, no redirects (a login redirect would
#                 measure Keycloak)
#   http_gated    an SSO proxy answered: 401 or 302
#   http_internal plain HTTP inside the cluster
#   tcp_connect   something listens
#   dns_public    an A record for a public hostname
#   dns_cluster   CoreDNS resolves the API Service
#   icmp          a LAN device answers (net.ipv4.ping_group_range, no NET_RAW)
fullnameOverride: blackbox-exporter

podSecurityContext:
  sysctls:
    - name: net.ipv4.ping_group_range
      value: "1000 1000"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

config:
  modules:
    http_2xx:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: false
        fail_if_not_ssl: true
        preferred_ip_protocol: ip4
        ip_protocol_fallback: false
    http_gated:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [401, 302]
        follow_redirects: false
        fail_if_not_ssl: true
        preferred_ip_protocol: ip4
        ip_protocol_fallback: false
    http_internal:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: false
        preferred_ip_protocol: ip4
        ip_protocol_fallback: false
    tcp_connect:
      prober: tcp
      timeout: 5s
      tcp:
        preferred_ip_protocol: ip4
        ip_protocol_fallback: false
    dns_public:
      prober: dns
      timeout: 5s
      dns:
        query_name: media.lilalala.com
        query_type: A
        valid_rcodes: [NOERROR]
        preferred_ip_protocol: ip4
        ip_protocol_fallback: false
        validate_answer_rrs:
          fail_if_not_matches_regexp: ['.*\tIN\tA\t.*']
    icmp:
      prober: icmp
      timeout: 5s
      icmp:
        preferred_ip_protocol: ip4
        ip_protocol_fallback: false
    dns_cluster:
      prober: dns
      timeout: 5s
      dns:
        query_name: kubernetes.default.svc.cluster.local
        query_type: A
        valid_rcodes: [NOERROR]
        preferred_ip_protocol: ip4
        ip_protocol_fallback: false
        validate_answer_rrs:
          fail_if_not_matches_regexp: ['.*\tIN\tA\t.*']
