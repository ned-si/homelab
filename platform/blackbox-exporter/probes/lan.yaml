# Static LAN devices answer a ping (job `blackbox-lan`); the table is in
# docs/networking.md. The BMC's DHCP lease is probed: update it here if it
# moves. Nodes and the NAS are dashboard only (HomelabNodeDown and
# HomelabNASDown page).
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-icmp
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobName: blackbox-lan
  interval: 30s
  scrapeTimeout: 10s
  module: icmp
  prober:
    url: blackbox-exporter.monitoring.svc:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        probe: lan
      static:
        - 192.168.1.1
        - 192.168.1.228
        - 192.168.1.247
        - 192.168.1.238
        - 192.168.1.239
        - 192.168.1.240
        - 192.168.1.194
      relabelingConfigs:
        - action: replace
          sourceLabels: [__param_target]
          regex: "192\\.168\\.1\\.1"
          targetLabel: device
          replacement: router
        - action: replace
          sourceLabels: [__param_target]
          regex: "192\\.168\\.1\\.228"
          targetLabel: device
          replacement: nas
        - action: replace
          sourceLabels: [__param_target]
          regex: "192\\.168\\.1\\.247"
          targetLabel: device
          replacement: homelab-cp-1
        - action: replace
          sourceLabels: [__param_target]
          regex: "192\\.168\\.1\\.238"
          targetLabel: device
          replacement: homelab-cp-2
        - action: replace
          sourceLabels: [__param_target]
          regex: "192\\.168\\.1\\.239"
          targetLabel: device
          replacement: homelab-cp-3
        - action: replace
          sourceLabels: [__param_target]
          regex: "192\\.168\\.1\\.240"
          targetLabel: device
          replacement: homelab-w-1
        - action: replace
          sourceLabels: [__param_target]
          regex: "192\\.168\\.1\\.194"
          targetLabel: device
          replacement: bmc
