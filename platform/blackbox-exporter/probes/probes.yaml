# What blackbox-exporter probes. Every Probe carries `release:
# kube-prometheus-stack`, the label Prometheus selects on.
#
# Public probes use the public name, as a client does (DNS, router, WAN
# address, NAT loopback, Gateway), so they fail when any of those is wrong.
# The `app` label groups them for routes/slo.yaml. `prober.path` and the
# relabeling `action` are CRD defaults, written out so the app stays Synced.
# Not probed: the .200 and .201 LoadBalancers, whose policies admit `world`
# only.
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: public-https
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobName: blackbox-public
  interval: 30s
  scrapeTimeout: 15s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        probe: public
      # A health endpoint per app where one exists without login.
      static:
        - https://argo.lilalala.com/healthz
        - https://auth.lilalala.com/realms/homelab
        - https://grafana.lilalala.com/api/health
        - https://cinema.lilalala.com/health
        # Plex's identity endpoint.
        - https://watch.lilalala.com/identity
        - https://media.lilalala.com/api/server/ping
        - https://archive.lilalala.com/accounts/login/
        - https://cook.lilalala.com/api/app/about
        - https://syncthing.lilalala.com/rest/noauth/health
        - https://audiobooks.lilalala.com/healthcheck
        - https://ebooks.lilalala.com/login
        - https://home.lilalala.com/manifest.json
        # The landing page, the blog, the dashboard and the tech radar: `app`
        # is `nedsi`, `blog`, `homelab` and `techradar` from the relabeling.
        - https://nedsi.io/
        - https://blog.nedsi.io/
        - https://homelab.nedsi.io/
        - https://techradar.nedsi.io/
        # oauth2-proxy's own health endpoint: needs no session.
        - https://hubble.lilalala.com/ping
        - https://signoz.lilalala.com/ping
      relabelingConfigs:
        - action: replace
          sourceLabels: [__param_target]
          regex: "https://([^.]+)\\..*"
          targetLabel: app
          replacement: "$1"
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: public-https-gated
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobName: blackbox-public
  interval: 30s
  scrapeTimeout: 15s
  module: http_gated
  prober:
    url: blackbox-exporter.monitoring.svc:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        probe: public
      # The theater SSO proxy's own sign-in page: 302 to Keycloak without a
      # session, without calling Keycloak. `/` is Plex (the route's
      # catch-all), whose 401 would count in the public 4xx figures.
      static:
        - https://theater.lilalala.com/oauth2/sign_in
      relabelingConfigs:
        - action: replace
          sourceLabels: [__param_target]
          regex: "https://([^.]+)\\..*"
          targetLabel: app
          replacement: "$1"
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: internal-tcp
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobName: blackbox-internal
  interval: 30s
  scrapeTimeout: 10s
  module: tcp_connect
  prober:
    url: blackbox-exporter.monitoring.svc:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        probe: internal
      static:
        # Kubernetes API VIP (held by Talos on a control plane).
        - 192.168.1.11:6443
        # Shared Gateway (HTTPS listener).
        - 192.168.1.254:443
        # NAS: iSCSI portal (every PVC) and NFS (media, local backups).
        - 192.168.1.228:3260
        - 192.168.1.228:2049
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: internal-http
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobName: blackbox-internal
  interval: 30s
  scrapeTimeout: 10s
  module: http_internal
  prober:
    url: blackbox-exporter.monitoring.svc:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        probe: internal
      static:
        - http://keycloak.keycloak.svc.cluster.local:9000/health/ready
        - http://argocd-server.argo.svc.cluster.local/healthz
---
# Prometheus and Alertmanager have no public name. With Grafana and SigNoz
# they make the dashboard's Observability figure (routes/slo.yaml,
# homelab.slo.observability).
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: internal-observability
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobName: blackbox-internal
  interval: 30s
  scrapeTimeout: 10s
  module: http_internal
  prober:
    url: blackbox-exporter.monitoring.svc:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        probe: internal
      static:
        - http://kube-prometheus-stack-prometheus.monitoring.svc:9090/-/ready
        - http://kube-prometheus-stack-alertmanager.monitoring.svc:9093/-/ready
      relabelingConfigs:
        - action: replace
          sourceLabels: [__param_target]
          regex: "http://kube-prometheus-stack-([a-z]+)\\..*"
          targetLabel: app
          replacement: "$1"
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: dns-router
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobName: blackbox-internal
  interval: 60s
  scrapeTimeout: 10s
  module: dns_public
  prober:
    url: blackbox-exporter.monitoring.svc:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        probe: internal
      # The router's DNS forwarder, which CoreDNS forwards to.
      static:
        - 192.168.1.1:53
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: dns-cluster
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobName: blackbox-internal
  interval: 60s
  scrapeTimeout: 10s
  module: dns_cluster
  prober:
    url: blackbox-exporter.monitoring.svc:9115
    path: /probe
  targets:
    staticConfig:
      labels:
        probe: internal
      static:
        - kube-dns.kube-system.svc.cluster.local:53
