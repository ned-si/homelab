# Daily enrichment of the trivy-operator findings (enrich.py): CISA KEV and
# FIRST EPSS for every CVE in a running image, and which namespaces an
# HTTPRoute exposes. A batch job cannot be scraped, so it pushes to the
# Pushgateway of backup-verify (platform/backup-verify/pushgateway.yaml, which
# admits pushes from `monitoring`); Prometheus scrapes that with honorLabels.
#
# Reads: Prometheus (in-cluster), the HTTPRoutes (ClusterRole below, list
# only), and two public HTTPS feeds. Writes nothing in the cluster.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vuln-enrich
  labels:
    app.kubernetes.io/name: vuln-enrich
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vuln-enrich
  labels:
    app.kubernetes.io/name: vuln-enrich
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vuln-enrich
  labels:
    app.kubernetes.io/name: vuln-enrich
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vuln-enrich
subjects:
  - kind: ServiceAccount
    name: vuln-enrich
    namespace: monitoring
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vuln-enrich
  labels:
    app.kubernetes.io/name: vuln-enrich
spec:
  # 06:20 UTC: KEV is updated on US working days, EPSS once a day around
  # 00:00 UTC; trivy-operator rescans every image within 24 h.
  schedule: "20 6 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vuln-enrich
        spec:
          serviceAccountName: vuln-enrich
          # The token lists HTTPRoutes and nothing else (ClusterRole above).
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: enrich
              # renovate: datasource=docker depName=python
              image: python:3.15.0-alpine3.24@sha256:ff4d3c9b1a48f646eedd93182aaea385c7a5452f4c8a8cd7cef686babacf4928
              command: ["python3", "-u", "/app/enrich.py"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 192Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: app
                  mountPath: /app
                  readOnly: true
          volumes:
            - name: app
              configMap:
                name: vuln-enrich
