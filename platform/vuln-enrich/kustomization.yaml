# vuln-enrich: CISA KEV, FIRST EPSS and exposure for the trivy-operator
# findings, and the act-now recording rules (docs/observability.md
# "Vulnerability priority"). enrich.py is stdlib Python; the ConfigMap name
# carries a content hash, so a change reaches the next run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - cronjob.yaml
  - rules.yaml

configMapGenerator:
  - name: vuln-enrich
    files:
      - enrich.py
