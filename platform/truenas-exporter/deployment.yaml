---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: truenas-exporter
  labels:
    app.kubernetes.io/name: truenas-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: truenas-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: truenas-exporter
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # renovate: datasource=docker depName=python
          image: docker.io/library/python:3.15.0-alpine3.24@sha256:ff4d3c9b1a48f646eedd93182aaea385c7a5452f4c8a8cd7cef686babacf4928
          command: ["python3", "-u", "/app/exporter.py"]
          env:
            - name: TRUENAS_URL
              value: https://192.168.1.228
            - name: TRUENAS_CONFIG
              value: /secret/driver-config-file.yaml
            - name: LISTEN_PORT
              value: "9814"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: metrics
              containerPort: 9814
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: driver-config
              mountPath: /secret
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: truenas-exporter
        - name: driver-config
          secret:
            secretName: iscsi-democratic-csi-driver-config
            items:
              - key: driver-config-file.yaml
                path: driver-config-file.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: truenas-exporter
  labels:
    app.kubernetes.io/name: truenas-exporter
spec:
  selector:
    app.kubernetes.io/name: truenas-exporter
  ports:
    - name: metrics
      port: 9814
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: truenas-exporter
  labels:
    app.kubernetes.io/name: truenas-exporter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: truenas-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 50s
