# truenas-exporter: NAS health as metrics (docs/observability.md). In
# `democratic-csi`, to reuse the CSI driver's API key Secret (CORE 13 keys
# cannot be scoped; the exporter only reads). The ConfigMap's name hash rolls
# the pod. Tests: tests/test_truenas_exporter.py.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: democratic-csi

resources:
  - deployment.yaml

configMapGenerator:
  - name: truenas-exporter
    files:
      - exporter.py
