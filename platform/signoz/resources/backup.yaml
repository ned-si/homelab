# SigNoz's metadata (users, dashboards, saved views, alert rules: the SQLite
# file in /var/lib/signoz on PVC signoz-db-signoz-0), to S3 with restic,
# nightly. The telemetry in ClickHouse is disposable and not backed up
# (docs/backups.md, "What is not backed up").
#
# BEST-EFFORT COPY OF A LIVE SQLITE DATABASE, like
# platform/kube-prometheus-stack/routes/grafana-backup.yaml (read its header
# for the approaches rejected): the restic image has no sqlite3, so the .db
# and its -wal/-shm files are copied as they are, tagged
# `signoz-db-besteffort`. Losing a torn copy costs re-creating a few saved
# views and dashboards, not data.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: signoz-backup
  namespace: signoz
spec:
  # 06:00, after grafana-backup (docs/backups.md, Schedule).
  schedule: "0 6 * * *"
  # Runs for real (ci/active-cronjobs.txt): the s3-backup Secret in `signoz`
  # holds the real credentials.
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: signoz-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          # signoz-db-signoz-0 is ReadWriteOnce: run on SigNoz's node.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: signoz
                      app.kubernetes.io/component: signoz
                  topologyKey: kubernetes.io/hostname
          # SigNoz writes its files 0644, so any uid reads them.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  restic init 2>/dev/null || true
                  DB_FILES=""
                  for f in /data/signoz.db /data/signoz.db-wal /data/signoz.db-shm; do
                    [ -f "$f" ] && DB_FILES="$DB_FILES $f"
                  done
                  if [ -z "$DB_FILES" ]; then
                    echo "FAIL: /data/signoz.db does not exist; is the volume mounted?"
                    ls -la /data
                    exit 1
                  fi
                  echo "database snapshot covers:$DB_FILES"
                  restic backup $DB_FILES \
                    --tag signoz-db-besteffort \
                    --host signoz \
                    --verbose
                  restic forget \
                    --host signoz \
                    --keep-daily 7 --keep-weekly 4 --keep-monthly 6 \
                    --prune
                  restic check --with-cache
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/signoz/metadata
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: TMPDIR
                  value: /cache
              envFrom:
                # platform/secrets/signoz-backup-s3.sops.yaml.
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: signoz-db-signoz-0
                readOnly: true
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
