# Helm values for the `signoz` release (namespace `signoz`): the log and trace
# store of the 14-day trial (docs/observability.md, "SigNoz"). Logs arrive
# from Vector over OTLP; Prometheus stays the metrics and paging system.
#
#   signoz            UI and query service, metadata in SQLite on `signoz-db`
#   otel-collector    OTLP receiver (gRPC 4317, HTTP 4318), writes ClickHouse
#   clickhouse        one replica (Altinity operator), 50 GiB on `iscsi`:
#                     telemetry is disposable, not backed up
#   zookeeper         one replica, ClickHouse's coordination
#
# Every image is pinned by digest (`tag: <version>@sha256:<index digest>`,
# Renovate's annotated-tag manager). The fixed default ClickHouse password of
# the chart stays: only pods in `signoz` can reach ClickHouse
# (platform/signoz/resources/network-policy.yaml).

global:
  storageClass: iscsi

clickhouse:
  image:
    registry: docker.io
    repository: clickhouse/clickhouse-server
    # renovate: datasource=docker depName=docker.io/clickhouse/clickhouse-server
    tag: 26.9.20@sha256:83243a0057e4c78fa019f5b59d0082f2f9844986b57a598a6d9b012221f90ba2
  persistence:
    storageClass: iscsi
    size: 50Gi
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 6Gi
  # The UDF init container downloads a binary from GitHub at start
  # (histogramQuantile, for SigNoz metrics). No metrics here: off.
  initContainers:
    enabled: false
    udf:
      enabled: false
  zookeeper:
    image:
      registry: docker.io
      repository: signoz/zookeeper
      # renovate: datasource=docker depName=docker.io/signoz/zookeeper
      tag: 3.9.3@sha256:2982759ec21211d52514154a5c87d2bbe6725d94cfa864cdfea2f7040b7bd365
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi
    persistence:
      storageClass: iscsi
      size: 2Gi
      dataLogDir:
        size: 1Gi
  clickhouseOperator:
    image:
      registry: docker.io
      repository: altinity/clickhouse-operator
      # renovate: datasource=docker depName=docker.io/altinity/clickhouse-operator
      tag: 0.28.0@sha256:4b801537f0263af95a10584b2fcf740c3fe4f88586266f3df4726ca2b32230ab
    metricsExporter:
      image:
        registry: docker.io
        repository: altinity/metrics-exporter
        # renovate: datasource=docker depName=docker.io/altinity/metrics-exporter
        tag: 0.28.0@sha256:d501d63931b7901668ba0b7de3a272cf95f5d15eadc8817750987d1bfcaa350f

signoz:
  image:
    registry: docker.io
    repository: signoz/signoz
    # renovate: datasource=docker depName=docker.io/signoz/signoz
    tag: v0.146.0@sha256:cd3ca6950df3b3681b4629c1b2cea4d3bcd5fece57445a3ec2a1a20466ab14ca
  # Metadata (users, dashboards, saved views): backed up nightly to S3
  # (platform/signoz/resources/backup.yaml), so the volume itself is plain
  # `iscsi`. The chart's global.storageClass wins over this key anyway.
  persistence:
    storageClass: iscsi
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  env:
    # The UI's external URL, behind the oauth2-proxy signoz-sso.
    signoz_alertmanager_signoz_external__url: https://signoz.lilalala.com
    signoz_instrumentation_logs_level: info

otelCollector:
  image:
    registry: docker.io
    repository: signoz/signoz-otel-collector
    # renovate: datasource=docker depName=docker.io/signoz/signoz-otel-collector
    tag: v0.144.14@sha256:b08671f56f3164c7781a740cc2af12c0739435faf49cd2ddc8a50d7238b81170
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  # The collector serves its own metrics on localhost:8888 by default, which
  # Prometheus cannot scrape (SigNozCollectorAbsent fired on a running
  # collector). Merged into the chart's `service.telemetry`, which keeps its
  # JSON logs.
  config:
    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888

telemetryStoreMigrator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
