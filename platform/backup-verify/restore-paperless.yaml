# Monthly Paperless restore test (scripts/verify-paperless.sh): import the
# newest paperless-export snapshot into a throwaway Paperless and compare the
# document counts. Scratch volume: an ephemeral claim twice the export's size.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-verify-paperless
spec:
  # The 3rd of the month, 19:00 UTC: after the monthly prunes of the 1st,
  # outside the nightly backup window and before the weekend restore tests
  # (docs/backups.md#schedule).
  schedule: "0 19 3 * *"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  # One of each: a kept pod keeps its scratch claim.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: restore
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.20.0@sha256:93999df80d4ac6cb148e82d2ef1fe6a81996f17ff535e772723538211b31555a
              command: ["/bin/sh", "/scripts/verify-paperless.sh", "restore"]
              envFrom:
                # The read-only verifier key and RESTIC_PASSWORD.
                - secretRef:
                    name: s3-backup
              env:
                - name: WORK
                  value: /work
                - name: RESTIC_CACHE_DIR
                  value: /work/.cache
                - name: TMPDIR
                  value: /work/.cache
                - name: HOME
                  value: /work
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
            # A throwaway Valkey on localhost, a native sidecar stopped with
            # the pod: Paperless' Django cache is Redis, so even `migrate`
            # fails without one (measured on 3.4.2). Nothing persists.
            - name: valkey
              # renovate: datasource=docker depName=valkey/valkey
              image: valkey/valkey:9.2-alpine@sha256:3ad5a213cb1bc2fd4a113c89b6248a88655a6bf1dda69519d04e03cd3e3d2742
              restartPolicy: Always
              command: ["valkey-server", "--bind", "127.0.0.1", "--port", "6379",
                        "--save", "", "--appendonly", "no", "--dir", "/data"]
              startupProbe:
                exec:
                  command: ["valkey-cli", "-h", "127.0.0.1", "ping"]
                periodSeconds: 2
                failureThreshold: 30
              volumeMounts:
                - name: valkey
                  mountPath: /data
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
            # The throwaway Paperless: manage.py commands only, so no web
            # server, Celery worker or beat.
            - name: import
              # renovate: datasource=docker depName=ghcr.io/paperless-ngx/paperless-ngx
              image: ghcr.io/paperless-ngx/paperless-ngx:3.5.1@sha256:8508853b8a0f8394074260957d0be186c8c64f346973b24a7583de4580f306b9
              command: ["/bin/sh", "/scripts/verify-paperless.sh", "import"]
              env:
                - name: PASSPHRASE
                  valueFrom:
                    secretKeyRef:
                      name: paperless-export
                      key: passphrase
                - name: WORK
                  value: /work
                - name: PAPERLESS_DATA_DIR
                  value: /work/paperless/data
                - name: PAPERLESS_MEDIA_ROOT
                  value: /work/paperless/media
                - name: PAPERLESS_CONSUMPTION_DIR
                  value: /work/paperless/consume
                - name: PAPERLESS_REDIS
                  value: redis://127.0.0.1:6379
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: report
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.20.0@sha256:93999df80d4ac6cb148e82d2ef1fe6a81996f17ff535e772723538211b31555a
              command: ["/bin/sh", "/scripts/verify-paperless.sh", "report"]
              env:
                - name: WORK
                  value: /work
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: scripts
              configMap:
                name: backup-verify-scripts
            - name: work
              ephemeral:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    storageClassName: iscsi
                    resources:
                      requests:
                        storage: 200Gi
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
            - name: valkey
              emptyDir:
                sizeLimit: 64Mi
