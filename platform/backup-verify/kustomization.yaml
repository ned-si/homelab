# Scheduled restore tests of every backup (docs/backups.md#verification).
# The scripts are in scripts/; the ConfigMap name carries a content hash, so a
# script change reaches the next run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backup-verify

resources:
  - rbac.yaml
  - object-store.yaml
  - pushgateway.yaml
  - restore-files.yaml
  - restore-postgres.yaml
  - restore-mariadb.yaml
  - alerts.yaml

configMapGenerator:
  - name: backup-verify-scripts
    files:
      - scripts/common.sh
      - scripts/verify-files.sh
      - scripts/verify-postgres.sh
      - scripts/verify-mariadb.sh
      - scripts/restic-targets.txt
      - scripts/restic-data-targets.txt
      - scripts/postgres-targets.txt
