# backup-verify-postgres creates and deletes its restore Clusters in this
# namespace only. In each source namespace a Role lets it `get` that
# namespace's source Clusters and their -app Secrets by name, nothing else.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-verify
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-verify
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # psql runs in the job's own sidecar and in the restored primary.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-verify
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-verify
subjects:
  - kind: ServiceAccount
    name: backup-verify
    namespace: backup-verify
---
# One Role and RoleBinding per source namespace, `get` on its own Clusters
# and -app Secrets by name. A cluster added to scripts/postgres-targets.txt
# needs its Cluster and -app Secret names in its namespace's Role here; a new
# namespace needs its own Role and RoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-verify-source
  namespace: immich
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get"]
    resourceNames:
      - immich-db
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      - immich-db-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-verify-source
  namespace: immich
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-verify-source
subjects:
  - kind: ServiceAccount
    name: backup-verify
    namespace: backup-verify
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-verify-source
  namespace: keycloak
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get"]
    resourceNames:
      - keycloak-db
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      - keycloak-db-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-verify-source
  namespace: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-verify-source
subjects:
  - kind: ServiceAccount
    name: backup-verify
    namespace: backup-verify
---
