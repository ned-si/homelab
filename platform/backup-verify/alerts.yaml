# Alerts on the restore tests (metrics from the Pushgateway, see
# scripts/common.sh). max_over_time and absent_over_time read Prometheus'
# history, so a restarted Pushgateway neither hides nor fakes a result.
# Tests: tests/prometheus/backup_verify_test.yaml.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backup-verify
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: backup.verify
      rules:
        - alert: BackupVerifyFailed
          expr: backup_verify_success == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Backup restore test failed: {{ $labels.check }}/{{ $labels.target }}"
            description: >-
              The last {{ $labels.check }} restore test of {{ $labels.target }}
              failed, so that backup may not restore. The FAIL lines are in the
              log of the last Job: kubectl -n backup-verify get jobs, then
              kubectl -n backup-verify logs job/<job> --all-containers.
              Runbook: docs/backups.md#when-a-restore-test-fails

        - alert: BackupVerifyStale
          # Weekly checks: no pass in 8 days, the schedule plus a day.
          expr: |
            time() - max by (check, target) (
              max_over_time(backup_verify_last_success_timestamp_seconds{check!="restic-data"}[9d])
            ) > 8 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No passing restore test in 8 days: {{ $labels.check }}/{{ $labels.target }}"
            description: >-
              {{ $labels.check }}/{{ $labels.target }} last passed
              {{ $value | humanizeDuration }} ago. Either its CronJob did not
              run or every run failed: kubectl -n backup-verify get cronjobs,jobs.
              Runbook: docs/backups.md#when-a-restore-test-fails

        - alert: BackupVerifyDataStale
          # Monthly pack reads run on the first Saturday: at most 35 days apart.
          expr: |
            time() - max by (check, target) (
              max_over_time(backup_verify_last_success_timestamp_seconds{check="restic-data"}[30d])
            ) > 36 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No passing pack read in 36 days: {{ $labels.target }}"
            description: >-
              The monthly restic check --read-data-subset of {{ $labels.target }}
              last passed {{ $value | humanizeDuration }} ago.
              Runbook: docs/backups.md#when-a-restore-test-fails

        - alert: BackupVerifyMissing
          # No result at all: the jobs never ran, or the Pushgateway is not
          # scraped. Covers the case the two rules above cannot see.
          expr: |
            absent_over_time(backup_verify_last_success_timestamp_seconds{check="restic"}[9d])
            or absent_over_time(backup_verify_last_success_timestamp_seconds{check="postgres"}[9d])
            or absent_over_time(backup_verify_last_success_timestamp_seconds{check="mariadb"}[9d])
            or absent_over_time(backup_verify_last_success_timestamp_seconds{check="restic-data"}[30d])
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No passing {{ $labels.check }} restore test on record"
            description: >-
              Prometheus has no passing {{ $labels.check }} result in its
              window (9 days, 30 for restic-data). Check the CronJobs
              (kubectl -n backup-verify get cronjobs,jobs) and the Pushgateway
              target on the Prometheus targets page.
              Runbook: docs/backups.md#when-a-restore-test-fails
