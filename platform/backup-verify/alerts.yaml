# Alerts on the backup pipeline, including the verifier itself: a backup that
# succeeds while producing unrestorable data is the case that loses data.
#
# Check every rule against three mistakes:
#
#   1. A counter treated as a gauge: `x_total > 0` latches after the first
#      event and never resolves. Use rate()/increase() over a window.
#   2. No data in the failure case: `time() - max(completion_time)` cannot
#      fire when nothing ever completed. Add a separate absent() alert.
#   3. An aggregate that hides a member: `max()` over two CronJobs lets a
#      fresh one mask a stale one. Keep a `by` clause on what you would fix.
#
# Metric sources:
#
#   kube_job_*, kube_cronjob_*   kube-state-metrics (chart ServiceMonitor).
#   cnpg_*                       the CNPG instance exporter, through each
#                                Cluster's `monitoring.enablePodMonitor: true`
#                                and podMonitorSelectorNilUsesHelmValues: false.
#
# The pg_stat_archiver metrics are matched under both possible names
# (`cnpg_pg_stat_archiver_*` and `cnpg_collector_pg_stat_archiver_*`), with
# an absent() alert if neither exists. Check with:
#
#     kubectl -n immich exec immich-db-1 -c postgres -- \
#       curl -s localhost:9187/metrics | grep archiver
# ---------------------------------------------------------------------------
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backup-health
  namespace: backup-verify
  labels:
    # Picked up by the kube-prometheus-stack Prometheus, which is configured
    # with ruleSelectorNilUsesHelmValues: false so it watches all namespaces.
    release: kube-prometheus-stack
spec:
  groups:
    - name: backup.verification.rules
      rules:
        # --- verification ---------------------------------------------------
        - alert: BackupVerificationFailed
          # `kube_job_failed{condition="true"}`, set only when the Job gives up.
          # `kube_job_status_failed` counts failed pods, so a Job that failed
          # once and then succeeded on retry would alert for as long as the Job
          # object exists.
          expr: |
            max by (namespace, job_name) (kube_job_failed{namespace="backup-verify", condition="true"}) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Backup restore verification FAILED ({{ $labels.job_name }})"
            description: >-
              A weekly restore test failed. This means a backup may not be
              restorable. Treat as data-loss risk, not as a flaky job.
              Runbook: docs/backups.md#when-verification-fails

        - alert: BackupVerificationStale
          # Per CronJob, via kube_job_owner (Job names are <cronjob>-<timestamp>,
          # so the CronJob is not a label of its own).
          #
          # completion_time exists only while the Job object exists: with
          # successfulJobsHistoryLimit: 4 on a weekly schedule that is about 4
          # weeks, so 14 days is measurable. Lowering the history limit breaks
          # this rule silently. BackupVerificationNeverRan covers "never
          # completed".
          expr: |
            time() - max by (owner_name) (
              kube_job_status_completion_time{namespace="backup-verify"}
              * on (namespace, job_name) group_left (owner_name)
                kube_job_owner{namespace="backup-verify", owner_kind="CronJob"}
            ) > 14 * 24 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "No successful backup verification in 14 days ({{ $labels.owner_name }})"
            description: >-
              The {{ $labels.owner_name }} CronJob has not completed
              successfully for two weeks. Either it is not running, or every run
              is failing. Check: kubectl -n backup-verify get jobs

        - alert: BackupVerificationNeverRan
          # absent() companion: fires when the CronJob has never completed a Job,
          # so there is no completion_time series for the rule above.
          #
          # `for: 6h`: long enough not to page during a deploy, far shorter than
          # the weekly schedule.
          expr: |
            absent(kube_job_status_completion_time{namespace="backup-verify"})
          for: 6h
          labels:
            severity: critical
          annotations:
            summary: "Backup verification has NEVER completed successfully"
            description: >-
              No Job in the backup-verify namespace has ever reached completion.
              Every backup in this cluster is therefore an untested hypothesis.
              Most likely: the S3 bucket and credentials do not exist yet
              (docs/backups.md, 'Setup, start to finish'), or the `s3-backup`
              Secret is missing from the backup-verify namespace.

        - alert: BackupVerificationCronJobSuspended
          # A suspended CronJob produces no failures and no Jobs, so no other
          # rule here sees it.
          expr: |
            kube_cronjob_spec_suspend{namespace="backup-verify"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Backup verification CronJob is SUSPENDED ({{ $labels.cronjob }})"
            description: >-
              Someone suspended it, probably temporarily. Nothing else in this
              rule group can tell you that verification has stopped, because a
              suspended CronJob creates no Jobs to fail.

    - name: backup.postgres.rules
      rules:
        # --- the database backups -------------------------------------------
        - alert: PostgresBackupFailed
          expr: |
            cnpg_collector_last_failed_backup_timestamp
              > cnpg_collector_last_available_backup_timestamp
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "CloudNativePG backup failing for {{ $labels.namespace }}/{{ $labels.pod }}"
            description: >-
              The most recent backup attempt failed and is newer than the most
              recent successful one. Recovery is still possible to the older
              point, but the window is no longer growing.

        - alert: PostgresBackupNeverSucceeded
          # CNPG reports a never-completed backup as timestamp 0, so "never" and
          # "stale" would otherwise arrive as the same alert; they need
          # different responses. 0 rather than absent(): absent() would also
          # match a Cluster with no `spec.backup`, which has its own alert
          # (PostgresClusterHasNoBackupConfigured).
          expr: |
            cnpg_collector_last_available_backup_timestamp == 0
          for: 2h
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} has NEVER had a successful backup"
            description: >-
              Barman has never written a base backup for this cluster. There is
              no point-in-time recovery and no snapshot to fall back to.

        - alert: PostgresClusterHasNoBackupConfigured
          # A Cluster with no backup destination emits no failure and no stale
          # timestamp; its backup metrics do not exist, so every other rule
          # here is blind to it. Databases without one are covered only by the
          # nightly pg_dump CronJobs (apps/*/backup.yaml): no point-in-time
          # recovery.
          #
          # `cnpg_collector_up` exists for every scraped instance, so `unless`
          # selects instances that are up and publish no backup timestamp. 6h
          # so a new Cluster does not page during bootstrap.
          expr: |
            (cnpg_collector_up == 1)
            unless on (namespace, pod)
            cnpg_collector_last_available_backup_timestamp
          for: 6h
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} has NO object-store backup configured"
            description: >-
              This Postgres cluster is running and scraped, but publishes no
              backup timestamp -- it has no spec.backup.barmanObjectStore, so
              barman is not archiving anything for it. Add the block to its
              Cluster manifest (copy platform/keycloak/database.yaml) and a
              ScheduledBackup alongside it.

        - alert: PostgresBackupStale
          expr: |
            time() - cnpg_collector_last_available_backup_timestamp > 36 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "No Postgres base backup in 36h ({{ $labels.namespace }})"
            description: >-
              Nightly base backups run at 02:30. More than 36h without one means
              two consecutive failures.

        - alert: PostgresBackupMetricsAbsent
          # absent() companion for the cnpg backup family: if the exporter stops
          # being scraped (PodMonitor deleted, selector changed, metrics
          # renamed), every rule above goes quiet.
          expr: |
            absent(cnpg_collector_up)
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "CloudNativePG metrics are not being scraped AT ALL"
            description: >-
              No cnpg_collector_up series exists, so every Postgres backup alert
              in this repository is inert. Check the PodMonitors
              (kubectl get podmonitor -A) and that Prometheus still has
              podMonitorSelectorNilUsesHelmValues: false.

        - alert: PostgresClusterUnhealthy
          # The instance manager's own check that it can reach PostgreSQL. 0
          # means the exporter answers and Postgres does not. There is no metric
          # for the Cluster CR's status.phase (no CustomResourceStateMetrics).
          expr: |
            cnpg_collector_up == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Postgres not answering in {{ $labels.namespace }}/{{ $labels.pod }}"
            description: >-
              The CloudNativePG instance manager is up but cannot query its own
              PostgreSQL. The database is down, not merely unmonitored.

        - alert: PostgresWALArchiveFailing
          # failed_count is cumulative (reset only by pg_stat_reset_shared()), so
          # increase() over 1h asks whether archiving fails now. `__name__=~`
          # matches both possible metric names; PostgresWALArchiveMetricAbsent
          # fires if neither exists.
          expr: |
            increase({__name__=~"cnpg_(collector_)?pg_stat_archiver_failed_count"}[1h]) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "WAL archiving failing ({{ $labels.namespace }}/{{ $labels.pod }})"
            description: >-
              Point-in-time recovery is broken while this fires, and WAL will
              accumulate on the data volume until it fills. This can take the
              database down on its own -- treat it as more urgent than a failed
              base backup.

        - alert: PostgresWALArchiveMetricAbsent
          # Guard for the metric name above: without it, a different name means
          # PostgresWALArchiveFailing can never fire. Limited with `unless` to
          # instances that have a backup destination.
          expr: |
            (cnpg_collector_last_available_backup_timestamp > 0)
            unless on (namespace, pod)
            {__name__=~"cnpg_(collector_)?pg_stat_archiver_failed_count"}
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No WAL-archiver metric for {{ $labels.namespace }}/{{ $labels.pod }}"
            description: >-
              This cluster archives to an object store but publishes no
              pg_stat_archiver counter under either spelling, so
              PostgresWALArchiveFailing cannot fire for it. Find the real name:
              kubectl -n {{ $labels.namespace }} exec {{ $labels.pod }}
              -c postgres -- curl -s localhost:9187/metrics | grep archiver

        - alert: PostgresWALArchiveBacklog
          # The consequence measured directly, for when the failure counter is
          # missing or archiving is too slow to keep up. Same two-name selector.
          #
          # 4h: an idle database archives only when a segment fills or
          # `archive_timeout` elapses, so minutes would fire nightly on the
          # *arr databases.
          expr: |
            {__name__=~"cnpg_(collector_)?pg_stat_archiver_seconds_since_last_archival"} > 4 * 3600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "WAL archive backlog in {{ $labels.namespace }}/{{ $labels.pod }}"
            description: >-
              No WAL segment has been archived for over 4 hours. Unarchived WAL
              is retained on the data volume; check pg_wal usage before this
              becomes a disk-full outage:
              kubectl -n {{ $labels.namespace }} exec {{ $labels.pod }}
              -c postgres -- df -h /var/lib/postgresql/data

    - name: backup.files.rules
      rules:
        - alert: FileBackupJobFailed
          # `kube_job_failed{condition="true"}` for the same reason as
          # BackupVerificationFailed; these Jobs use backoffLimit: 2, so a retry
          # that succeeds is normal on a flaky uplink. The selector matches
          # `backup` anywhere in the Job name; `backup-verify` has its own rule.
          expr: |
            max by (namespace, job_name) (
              kube_job_failed{namespace!="backup-verify", job_name=~".*backup.*", condition="true"}
            ) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "File backup job failing: {{ $labels.namespace }}/{{ $labels.job_name }}"
            description: >-
              A restic CronJob gave up after its retries. Check the log:
              kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }}

        - alert: FileBackupNotRunRecently
          # "Not running" rather than "failing": a deleted CronJob, a lost
          # controller lease or a missed startingDeadlineSeconds produces no
          # failed Job. last_schedule_time is set when the controller creates a
          # Job. 36h allows one missed night on a daily schedule.
          #
          # backup-verify is excluded: its CronJobs are weekly and have their own
          # 14-day rule.
          expr: |
            time() - kube_cronjob_status_last_schedule_time{namespace!="backup-verify", cronjob=~".*backup.*"} > 36 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Backup CronJob has not been scheduled in 36h ({{ $labels.namespace }}/{{ $labels.cronjob }})"
            description: >-
              The CronJob controller has not created a Job for this schedule.
              Nothing failed -- nothing ran. Check
              kubectl -n {{ $labels.namespace }} describe cronjob {{ $labels.cronjob }}
              for a missed startingDeadlineSeconds or concurrencyPolicy: Forbid
              blocking on a wedged previous run.

        - alert: FileBackupCronJobSuspended
          expr: |
            kube_cronjob_spec_suspend{namespace!="backup-verify", cronjob=~".*backup.*"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Backup CronJob is SUSPENDED ({{ $labels.namespace }}/{{ $labels.cronjob }})"

        - alert: FileBackupCronJobsAbsent
          # absent() companion for this group: without the CronJobs (Application
          # out of sync, resource line lost) every rule above says nothing.
          expr: |
            absent(kube_cronjob_status_last_schedule_time{namespace!="backup-verify", cronjob=~".*backup.*"})
          for: 2h
          labels:
            severity: critical
          annotations:
            summary: "No backup CronJobs exist in this cluster"
            description: >-
              kube-state-metrics reports no CronJob whose name contains
              'backup'. Either nothing is backing anything up, or
              kube-state-metrics is not being scraped -- both are worth
              interrupting whatever you were doing.

    - name: backup.correlation.rules
      rules:
        - alert: BackupCredentialUnusable
          # A correlation for the inhibit_rule in
          # platform/kube-prometheus-stack/values.yaml. An expired S3 credential
          # or a wrong bucket fails every backup at once; this sends one alert
          # naming the cause instead of ten. Two or more failing at once is
          # almost always the shared credential.
          expr: |
            count(
              cnpg_collector_last_failed_backup_timestamp
                > cnpg_collector_last_available_backup_timestamp
            ) >= 2
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Two or more databases are failing to back up -- suspect the shared credential"
            description: >-
              Multiple unrelated Postgres clusters stopped backing up at the
              same time. They share exactly one thing: the `s3-backup` Secret
              and the bucket it points at. Check the bucket still exists, the
              IAM key is active, and `homelab-backups-REPLACE-ME` has actually
              been replaced (task backup:set-target).
