# Receives the verify jobs' results; Prometheus scrapes it with honorLabels so
# the check and target labels survive. State is persisted to an emptyDir
# (container restarts keep it); the alerts read max_over_time from Prometheus,
# so a rescheduled pod loses nothing they need. The NetworkPolicy lets only
# this namespace push and only the monitoring namespace scrape: the
# Pushgateway has no authentication of its own.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pushgateway
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  labels:
    app.kubernetes.io/name: pushgateway
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pushgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pushgateway
    spec:
      serviceAccountName: pushgateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pushgateway
          # renovate: datasource=docker depName=prom/pushgateway
          image: prom/pushgateway:v1.11.4-distroless@sha256:cb9a7a2f0f7351ea2e4b0f48510749492c483d0bba4c611f84a1249e2b9599a6
          args:
            - --persistence.file=/data/metrics
            - --persistence.interval=1m
          ports:
            - name: http
              containerPort: 9091
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
              ephemeral-storage: 16Mi
            limits:
              memory: 64Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  labels:
    app.kubernetes.io/name: pushgateway
spec:
  selector:
    app.kubernetes.io/name: pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: http
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pushgateway
  labels:
    app.kubernetes.io/name: pushgateway
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pushgateway
  endpoints:
    - port: http
      interval: 1m
      honorLabels: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pushgateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pushgateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        # talos-drift (platform/talos-drift) pushes its result.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: system-upgrade
          podSelector:
            matchLabels:
              app.kubernetes.io/name: talos-drift
      ports:
        - port: http
          protocol: TCP
