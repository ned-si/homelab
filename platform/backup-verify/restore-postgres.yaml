# Weekly CNPG restore tests, one cluster at a time
# (scripts/verify-postgres.sh). Each restore is a new Cluster bv-<source> in
# this namespace on an iscsi volume the size of the source's, deleted with its
# volume before the next one starts.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-verify-postgres
spec:
  # Sunday 21:00 UTC; eight clusters take about an hour and the deadline ends
  # the run before the 00:00 base backups.
  schedule: "0 21 * * 0"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 10800
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: backup-verify
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # psql for the source queries; a native sidecar, stopped when the
            # verify container ends.
            - name: psql
              # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
              image: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie@sha256:b98ae0b74a12f20ccff32219be0e33fdd35c7e2e8e73c8bff9173f1128e167d1
              restartPolicy: Always
              command: ["sleep", "infinity"]
              env:
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                  ephemeral-storage: 16Mi
                limits:
                  memory: 128Mi
                  ephemeral-storage: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: verify
              # renovate: datasource=docker depName=alpine/kubectl
              image: alpine/kubectl:1.37.2@sha256:02791a008d526a0b2ca9edc9692d86933b4a164e64d1c012eb46e30fca18d818
              command: ["/bin/sh", "/scripts/verify-postgres.sh"]
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: IMMICH_FLOOR_IMAGES
                  value: "49032"
                - name: IMMICH_FLOOR_VIDEOS
                  value: "2377"
                - name: WORK
                  value: /tmp/work
                # kubectl writes its discovery cache under HOME.
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                  ephemeral-storage: 64Mi
                limits:
                  memory: 256Mi
                  ephemeral-storage: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: scripts
              configMap:
                name: backup-verify-scripts
            - name: tmp
              emptyDir:
                sizeLimit: 128Mi
