# Weekly restic sample restores, plus the monthly pack read on the first
# Saturday of the month (scripts/verify-files.sh). Restores go to an emptyDir
# on the node and are deleted after each tag; the largest sampled file is
# 64 MiB.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-verify-files
spec:
  # Saturday 22:00 UTC, after backup-verify-mariadb and outside the nightly
  # backup window (docs/backups.md#schedule).
  schedule: "0 22 * * 6"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 9000
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verify
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1
              command: ["/bin/sh", "/scripts/verify-files.sh"]
              envFrom:
                # The read-only verifier key and RESTIC_PASSWORD.
                - secretRef:
                    name: s3-backup
              env:
                - name: DATA_CHECK
                  value: auto
                - name: WORK
                  value: /work
                - name: RESTIC_CACHE_DIR
                  value: /work/.cache
                - name: TMPDIR
                  value: /work/.cache
                - name: HOME
                  value: /work
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: work
                  mountPath: /work
                - name: backups
                  mountPath: /backups
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 2Gi
                limits:
                  memory: 2Gi
                  ephemeral-storage: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: scripts
              configMap:
                name: backup-verify-scripts
            - name: work
              emptyDir:
                sizeLimit: 4Gi
            # The NAS restic repository, read-only.
            - name: backups
              nfs:
                server: 192.168.1.228 # SITE-SPECIFIC
                path: /mnt/homelab/k8s/backups
                readOnly: true
