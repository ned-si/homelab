# One replica, no state: the exporter keeps the last good collection in memory
# and re-reads GitHub every 15 minutes. A restart costs one collection.
#
# In the cluster it reads the Argo CD Applications (ClusterRole below, list
# only; they hold no secrets) and the Alertmanager silences (no
# authentication), for the Homelab / Automation dashboard.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-exporter
  labels:
    app.kubernetes.io/name: github-exporter
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: github-exporter
  labels:
    app.kubernetes.io/name: github-exporter
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-exporter
  labels:
    app.kubernetes.io/name: github-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: github-exporter
subjects:
  - kind: ServiceAccount
    name: github-exporter
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-exporter
  labels:
    app.kubernetes.io/name: github-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: github-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-exporter
    spec:
      serviceAccountName: github-exporter
      # The token lists Argo CD Applications and nothing else (ClusterRole above).
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # renovate: datasource=docker depName=python
          image: python:3.15.2-alpine3.24@sha256:20a82dbc2783112ddb91d1534603f802d222a3e63e593cd002eb2ac534e70211
          command: ["python3", "-u", "/app/exporter.py"]
          env:
            - name: REPO
              value: ned-si/homelab
            - name: INTERVAL
              value: "900"
            - name: PORT
              value: "9171"
            - name: ALERTMANAGER_URL
              value: http://kube-prometheus-stack-alertmanager.monitoring:9093
          ports:
            - name: metrics
              containerPort: 9171
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: github-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: github-exporter
  labels:
    app.kubernetes.io/name: github-exporter
spec:
  selector:
    app.kubernetes.io/name: github-exporter
  ports:
    - name: metrics
      port: 9171
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: github-exporter
  labels:
    app.kubernetes.io/name: github-exporter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: github-exporter
  endpoints:
    - port: metrics
      interval: 2m
