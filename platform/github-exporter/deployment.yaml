# One replica, no state: the exporter keeps the last good collection in memory
# and re-reads GitHub every 15 minutes. A restart costs one collection.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-exporter
  labels:
    app.kubernetes.io/name: github-exporter
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-exporter
  labels:
    app.kubernetes.io/name: github-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: github-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-exporter
    spec:
      serviceAccountName: github-exporter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # renovate: datasource=docker depName=python
          image: python:3.15.0-alpine3.24
          command: ["python3", "-u", "/app/exporter.py"]
          env:
            - name: REPO
              value: ned-si/homelab
            - name: INTERVAL
              value: "900"
            - name: PORT
              value: "9171"
          ports:
            - name: metrics
              containerPort: 9171
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: github-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: github-exporter
  labels:
    app.kubernetes.io/name: github-exporter
spec:
  selector:
    app.kubernetes.io/name: github-exporter
  ports:
    - name: metrics
      port: 9171
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: github-exporter
  labels:
    app.kubernetes.io/name: github-exporter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: github-exporter
  endpoints:
    - port: metrics
      interval: 2m
