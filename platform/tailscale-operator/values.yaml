# tailscale-operator (docs/remote-access.md). The OAuth client is the
# precreated Secret `operator-oauth`, so `oauth` stays empty. Every pod passes
# Pod Security `restricted`; Ingress proxies through the ProxyClass
# `restricted` (resources/proxyclass.yaml), in userspace mode.
installCRDs: true

operatorConfig:
  defaultTags:
    - "tag:k8s-operator"
  # The tailnet name of the operator, and of its API server proxy:
  # `tailscale configure kubeconfig tailscale-operator`.
  hostname: tailscale-operator
  image:
    repository: tailscale/k8s-operator
    # renovate: datasource=docker depName=tailscale/k8s-operator
    tag: v1.104.4@sha256:68fc0aa4e1c3d7ba19ca41c0bc27f17b2a5a8dca6c10efcdd18020a6bf97768d
    pullPolicy: IfNotPresent
  logging: info
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  # tsnet keeps its state in the Secret `operator`, but still creates a
  # config directory under $HOME, which uid 65532 has no other place for.
  extraEnv:
    - name: HOME
      value: /tmp

ingressClass:
  name: tailscale
  enabled: true

proxyConfig:
  image:
    repository: tailscale/tailscale
    # renovate: datasource=docker depName=tailscale/tailscale
    tag: v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
  defaultTags: "tag:k8s"
  firewallMode: auto
  # Applied to every Ingress and Service proxy that names no other class.
  defaultProxyClass: restricted

# In-process API server proxy in auth mode: it drops the client's credentials
# and impersonates the tailnet identity, with the groups that the tailnet
# policy grants (`tailscale.com/cap/kubernetes`, bootstrap/tailscale/policy.hujson).
# RBAC for those groups: platform/tailscale-operator/resources/rbac.yaml.
apiServerProxyConfig:
  mode: "true"
  allowImpersonation: "true"
