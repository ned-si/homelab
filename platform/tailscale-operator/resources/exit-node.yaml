# Exit node on the home connection (docs/remote-access.md, "Exit node"): two
# replicas, each a separate exit node in the Tailscale app. The tailnet policy
# grants autogroup:internet only, not the LAN or the cluster.
---
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: home-exit
spec:
  hostnamePrefix: home-exit
  replicas: 2
  exitNode: true
  tags:
    - "tag:exit"
  proxyClass: exit-node
---
# Connector pods always get the operator's privileged `sysctler` init
# container, hence `privileged` on the `tailscale` namespace. tailscaled runs
# in userspace mode, non-root, without capabilities.
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: exit-node
spec:
  statefulSet:
    pod:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    tailscale.com/parent-resource: home-exit
                    tailscale.com/parent-resource-type: connector
      tailscaleInitContainer:
        securityContext:
          privileged: true
          runAsUser: 0
        resources:
          requests:
            cpu: 1m
            memory: 4Mi
          limits:
            memory: 16Mi
      tailscaleContainer:
        # renovate: datasource=docker depName=tailscale/tailscale
        image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
        imagePullPolicy: IfNotPresent
        env:
          - name: TS_USERSPACE
            value: "true"
        resources:
          requests:
            cpu: 20m
            memory: 48Mi
          limits:
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
