# aws-cost-exporter: Cost Explorer figures and the backup bucket's size per
# prefix for the Homelab / AWS dashboard (docs/observability.md). YACE is the
# Helm chart in the same Application (values.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - deployment.yaml

configMapGenerator:
  - name: aws-cost-exporter
    files:
      - exporter.py
