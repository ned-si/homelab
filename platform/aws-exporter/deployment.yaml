# One replica, no state: the exporter lists the backup bucket every 6 hours,
# reads Cost Explorer once per UTC day and keeps the result in memory. A
# restart costs one more Cost Explorer read (about $0.02).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-cost-exporter
  labels:
    app.kubernetes.io/name: aws-cost-exporter
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-cost-exporter
  labels:
    app.kubernetes.io/name: aws-cost-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: aws-cost-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aws-cost-exporter
    spec:
      serviceAccountName: aws-cost-exporter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # renovate: datasource=docker depName=python
          image: python:3.15.0-alpine3.24
          command: ["python3", "-u", "/app/exporter.py"]
          env:
            - name: INTERVAL
              value: "21600"
            - name: PORT
              value: "9173"
            - name: BUCKET
              value: ned-si-homelab-backups
            - name: REGION
              value: eu-central-1
            # The read-only homelab-metrics-reader key (platform/secrets/aws-exporter).
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-exporter
                  key: access_key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-exporter
                  key: secret_key
          ports:
            - name: metrics
              containerPort: 9173
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: aws-cost-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: aws-cost-exporter
  labels:
    app.kubernetes.io/name: aws-cost-exporter
spec:
  selector:
    app.kubernetes.io/name: aws-cost-exporter
  ports:
    - name: metrics
      port: 9173
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aws-cost-exporter
  labels:
    app.kubernetes.io/name: aws-cost-exporter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aws-cost-exporter
  endpoints:
    - port: metrics
      interval: 5m
