# Values of the CloudNativePG chart (version pinned in
# clusters/homelab/platform/cnpg.yaml).
replicaCount: 1
monitoring:
  podMonitorEnabled: true
  # Prometheus selects monitors by this label (repo-policy monitor-selected).
  podMonitorAdditionalLabels:
    release: kube-prometheus-stack
  grafanaDashboard:
    create: true
