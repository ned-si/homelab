# Cluster alerts on top of the chart's `defaultRules`, each for a failure this
# cluster had that no default rule saw. In `routes/`, not
# `additionalPrometheusRulesMap`: PromQL nested in Helm values diffs badly.
#
# Overlaps with `defaultRules` on purpose: PersistentVolume* (upstream is too
# late for 5Gi volumes), AlertmanagerNotificationsFailing (critical here), and
# the *Absent rules (a deleted ServiceMonitor leaves no series for
# TargetDown). certmanager_* needs the ServiceMonitor and the
# `release: kube-prometheus-stack` label in infrastructure/cert-manager/values.yaml.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-cluster
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    # =====================================================================
    - name: homelab.workload.rules
      rules:
        - alert: PodStuckNotRunning
          # A container that never starts waits rather than crash-loops, so
          # KubePodCrashLooping misses it. ContainerCreating is normal for
          # seconds; CrashLoopBackOff is left to KubePodCrashLooping. The join
          # adds `node` for the HomelabNodeNotReady inhibit rule.
          expr: |
            max by (namespace, pod, container, reason, node) (
              kube_pod_container_status_waiting_reason{
                reason=~"CreateContainerError|CreateContainerConfigError|ErrImagePull|ImagePullBackOff|InvalidImageName"
              }
              * on (namespace, pod) group_left (node) kube_pod_info
            ) > 0
          for: 15m
          labels:
            severity: warning
            action: auto
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} stuck in {{ $labels.reason }}"
            description: >-
              Container {{ $labels.container }} has been unable to start for 15
              minutes on node {{ $labels.node }}. Read `state`, not `lastState`
              -- see docs/observability.md: once the log pointed at the network
              and the cause was a stale containerd name reservation.

        - alert: PodStuckNotRunningLongTerm
          # The same condition, escalated after 6h.
          expr: |
            max by (namespace, pod, container, reason, node) (
              kube_pod_container_status_waiting_reason{
                reason=~"CreateContainerError|CreateContainerConfigError|ErrImagePull|ImagePullBackOff|InvalidImageName"
              }
              * on (namespace, pod) group_left (node) kube_pod_info
            ) > 0
          for: 6h
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/PodStuckNotRunningLongTerm.md
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} has been broken for 6h ({{ $labels.reason }})"

        - alert: PodPendingTooLong
          # A pod that is never scheduled. Usual cause here: a ReadWriteOnce
          # iSCSI volume still attached to another node (see
          # scripts/normalize-deployment-strategy.sh). 30m because an iSCSI
          # detach/attach after a node reboot takes minutes.
          expr: |
            max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"}) > 0
          for: 30m
          labels:
            severity: warning
            action: auto
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} has been Pending for 30m"
            description: >-
              Usually an unschedulable pod or a ReadWriteOnce volume still
              attached elsewhere. kubectl -n {{ $labels.namespace }} describe pod
              {{ $labels.pod }} -- read the Events, not the status.

        - alert: PodNotReady
          # Running but not Ready. Succeeded/Failed pods stay not-Ready
          # forever; Pending is PodPendingTooLong's. `== 0` after the join:
          # `(x == 0) * y` returns value-0 series, which still fire.
          expr: |
            max by (namespace, pod, node) (
              kube_pod_status_ready{condition="true"}
              * on (namespace, pod) group_left (node) kube_pod_info
            ) == 0
            unless on (namespace, pod) (
              kube_pod_status_phase{phase=~"Succeeded|Failed|Pending"} == 1
            )
          for: 20m
          labels:
            severity: warning
            action: auto
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} is Running but not Ready"
            description: >-
              Its readiness probe has been failing for 20 minutes, so the
              Service has removed it. If this is the only replica the app is
              down. This is the signal that did not exist during the qBittorrent
              outage -- there was no probe to fail.

        - alert: ServiceHasNoReadyBackend
          # Zero available replicas, so it depends on a readiness probe.
          # Deployment availability, not `kube_endpoint_address*`, which
          # kube-state-metrics renamed (a rule on a missing metric never fires).
          expr: |
            kube_deployment_status_replicas_available == 0
            and on (namespace, deployment) (kube_deployment_spec_replicas > 0)
          for: 15m
          labels:
            severity: critical
            action: auto
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has ZERO available replicas"
            description: >-
              Nothing is serving this Deployment, so its Service has no ready
              backend. Callers see connection refused, which the *arr apps
              surface as 'download client unavailable' -- a message that reads
              like an auth failure. See docs/runbooks/arr-qbittorrent.md.

        - alert: StatefulSetHasNoReadyReplica
          # Syncthing is the only StatefulSet here, and it is the one holding
          # device identity keys. Covered separately because the Deployment
          # metric above cannot see it.
          expr: |
            kube_statefulset_status_replicas_ready == 0
            and on (namespace, statefulset) (kube_statefulset_replicas > 0)
          for: 15m
          labels:
            severity: critical
            action: auto
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.statefulset }} has no ready replica"

    # =====================================================================
    - name: homelab.storage.rules
      rules:
        - alert: PersistentVolumeNearlyFull
          # kubelet_volume_stats_*: the kubelet is the only source of PVC usage.
          # The series exist only while a pod mounts the volume, so there is no
          # absent() companion: unmounted is not a fault.
          expr: |
            (
              kubelet_volume_stats_available_bytes
              / kubelet_volume_stats_capacity_bytes
            ) < 0.15
          for: 30m
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/PersistentVolumeNearlyFull.md
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is over 85% full"
            description: >-
              The `iscsi` StorageClass sets allowVolumeExpansion: true, so this
              is fixable by editing spec.resources.requests.storage on the PVC
              and letting the filesystem grow -- no data movement. Do it before
              it becomes critical: a full volume under a database is an outage,
              and under an iSCSI zvol with xfs it is not always a clean one.

        - alert: PersistentVolumeCriticallyFull
          expr: |
            (
              kubelet_volume_stats_available_bytes
              / kubelet_volume_stats_capacity_bytes
            ) < 0.05
          for: 10m
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/PersistentVolumeCriticallyFull.md
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is over 95% full"

        - alert: PersistentVolumeFillingUp
          # Trend rule for what the thresholds miss: a volume that will be full
          # by tomorrow (e.g. WAL kept because archiving fails). predict_linear
          # over 6h, 24h ahead. `< 0.6` skips volumes the threshold rules cover
          # and stops small volumes' churn from projecting to zero.
          expr: |
            (
              kubelet_volume_stats_available_bytes
              / kubelet_volume_stats_capacity_bytes
            ) < 0.6
            and
            predict_linear(kubelet_volume_stats_available_bytes[6h], 24 * 3600) < 0
          for: 1h
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/PersistentVolumeFillingUp.md
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} will be full within 24h"
            description: >-
              Extrapolating the last 6 hours. If this is a Postgres data volume,
              check WAL archiving first -- unarchivable WAL is retained locally
              and fills the volume, and CNPGWALArchivingFailing is the cause,
              not this.

        - alert: PrometheusTsdbVolumeNearlyFull
          # Prometheus's own volume: a full one stops ingestion, and then
          # nothing alerts. retentionSize (34GiB of 40Gi) leaves about 15%
          # free; a compaction dips to about 10%. Below 10% for 15m, something
          # retentionSize does not count is using the volume.
          expr: |
            (
              kubelet_volume_stats_available_bytes{namespace="monitoring", persistentvolumeclaim=~"prometheus-.*"}
              / kubelet_volume_stats_capacity_bytes
            ) < 0.10
          for: 15m
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/PrometheusTsdbVolumeNearlyFull.md
            summary: "Prometheus TSDB volume is nearly full"
            description: >-
              retentionSize (34GiB, WAL included) is meant to keep this from
              happening inside the 40Gi volume. If it has, a compaction or files
              Prometheus does not count are using the headroom. Grow the volume
              -- `iscsi` allows expansion -- rather
              than cutting retention, and see the comment on retentionSize in
              platform/kube-prometheus-stack/values.yaml.

        - alert: PrometheusRetentionCutBySize
          # retentionSize deleting blocks before `retention: 30d`, so the
          # 30-day SLO windows see less than 30 days (#905). Both halves: a
          # young TSDB refills on its own, and a size cut with 29+ days kept is
          # harmless. 4d, because a steady size cut deletes a block about every
          # 3 days. `action: human`: nothing fixes it on its own.
          expr: |
            (time() - prometheus_tsdb_lowest_timestamp_seconds) < 29 * 86400
            and
            increase(prometheus_tsdb_size_retentions_total[4d]) > 0
          for: 1h
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/PrometheusRetentionCutBySize.md
            summary: "Prometheus keeps only {{ $value | humanizeDuration }} of data: retentionSize is cutting it"
            description: >-
              retentionSize deleted blocks in the last 4 days and the oldest
              sample is younger than 29 days, so the 30-day SLO windows are
              short. Grow the volume and retentionSize, or drop unused series.

        - alert: NodeFilesystemNearlyFull
          # The 29 GB eMMC holds kubelet and containerd; full means no pulls,
          # no containers, no logs, while the node stays Ready. Not scoped to
          # one mountpoint; the fstype exclusions skip tmpfs, overlay and the
          # Talos read-only binds. Filtered on the numerator only (PromQL
          # matches all labels).
          expr: |
            (
              node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|rootfs|overlay|squashfs|iso9660|nsfs|autofs"}
              / node_filesystem_size_bytes
            ) < 0.15
            and on (instance, mountpoint) (
              node_filesystem_readonly == 0
            )
          for: 30m
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/NodeFilesystemNearlyFull.md
            summary: "{{ $labels.instance }} {{ $labels.mountpoint }} is over 85% full"
            description: >-
              On these nodes the eMMC holds the kubelet and containerd
              data (/var). Find what holds it with `talosctl -n <ip> usage
              /var --depth 2` and remove unused images with `talosctl -n <ip>
              image remove` before it stops being able to create containers.

        - alert: NodeFilesystemCriticallyFull
          expr: |
            (
              node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|rootfs|overlay|squashfs|iso9660|nsfs|autofs"}
              / node_filesystem_size_bytes
            ) < 0.08
          for: 10m
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/NodeFilesystemCriticallyFull.md
            summary: "{{ $labels.instance }} {{ $labels.mountpoint }} is over 92% full"

        - alert: NodeFilesystemReadOnly
          # A filesystem remounted read-only is what an eMMC does when it starts
          # to fail. It is not a capacity problem and no fullness rule sees it;
          # the node keeps reporting Ready and everything on it slowly breaks.
          expr: |
            node_filesystem_readonly{fstype!~"tmpfs|ramfs|rootfs|overlay|squashfs|iso9660|nsfs|autofs"} == 1
          for: 5m
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/NodeFilesystemReadOnly.md
            summary: "{{ $labels.instance }} remounted {{ $labels.mountpoint }} READ-ONLY"
            description: >-
              Usually the beginning of eMMC failure, not a configuration change.
              Check dmesg on the node. Four nodes, one of which is a control
              plane member -- confirm which before rebooting anything.

        - alert: NodeFilesystemInodesNearlyFull
          # Inodes run out independently of bytes (containerd image stores on a
          # small eMMC). The symptom is ENOSPC while `df -h` shows free space.
          expr: |
            (
              node_filesystem_files_free{fstype!~"tmpfs|ramfs|rootfs|overlay|squashfs|iso9660|nsfs|autofs"}
              / node_filesystem_files
            ) < 0.10
          for: 30m
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/NodeFilesystemInodesNearlyFull.md
            summary: "{{ $labels.instance }} {{ $labels.mountpoint }} has under 10% of inodes free"
            description: >-
              This reports as ENOSPC while `df -h` shows free space. Check
              `df -i` on the node.

        - alert: NodeEmmcWearHigh
          # A worn-out eMMC means a new RK1 module. life_time step 9 or
          # pre_eol 2 leaves months to plan it
          # (docs/runbooks/node-replacement.md).
          expr: |
            max by (instance, device) (node_emmc_life_time_estimate) >= 9
            or
            max by (instance, device) (node_emmc_pre_eol_info) >= 2
          for: 1h
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/NodeEmmcWearHigh.md
            summary: "{{ $labels.instance }} eMMC {{ $labels.device }} is wearing out"
            description: >-
              The eMMC reports 80% or more of its rated wear or of its reserved
              blocks used. Plan the module replacement
              (docs/runbooks/node-replacement.md) and check what writes most
              with the Homelab / Nodes dashboard.

        - alert: NodeEmmcEndOfLife
          # life_time 11 = rated wear exceeded; pre_eol 3 = reserved blocks
          # nearly gone. Writes can start failing at any time.
          expr: |
            max by (instance, device) (node_emmc_life_time_estimate) >= 11
            or
            max by (instance, device) (node_emmc_pre_eol_info) >= 3
          for: 10m
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/NodeEmmcEndOfLife.md
            summary: "{{ $labels.instance }} eMMC {{ $labels.device }} is at end of life"
            description: >-
              The eMMC reports its rated wear exceeded or its reserved blocks
              nearly gone. Replace the module (docs/runbooks/node-replacement.md);
              on a control plane, take an etcd snapshot first
              (`task talos:etcd-snapshot`).

    # =====================================================================
    - name: homelab.certificates.rules
      rules:
        - alert: CertificateExpiringSoon
          # cert-manager keeps the old certificate when renewal fails and only
          # logs it. 90-day Let's Encrypt certificates renew at 30 days left, so
          # under 21 days means at least one renewal has failed, with three
          # weeks left to fix DNS-01.
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < 21 * 24 * 3600
          for: 1h
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/CertificateExpiringSoon.md
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in under 21 days"
            description: >-
              cert-manager should have renewed this at 30 days remaining, so a
              renewal has already failed silently. Check the Certificate's
              conditions and the ClusterIssuer's Secret reference:
              kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }}

        - alert: CertificateExpiringVerySoon
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
          for: 1h
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/CertificateExpiringVerySoon.md
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in under 7 days"
            description: >-
              Every published hostname is served from the wildcard certificate on
              the shared Gateway. When this expires, everything breaks at once.
              Let's Encrypt rate-limits, so do not fix it by deleting and
              recreating in a loop.

        - alert: CertificateNotReady
          # Not Ready long before expiry (an order dies after 7 days). "True
          # is 0", not "False is 1": it also covers `Unknown`.
          expr: |
            certmanager_certificate_ready_status{condition=~"True|true"} == 0
          for: 1h
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/CertificateNotReady.md
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready"
            description: >-
              An order or challenge is failing. A Let's Encrypt order expires
              after 7 days and then never completes, so a stuck Certificate does
              not recover on its own -- it has to be deleted and reissued.

        - alert: CertManagerMetricsAbsent
          # absent() guard for this group. If cert-manager's ServiceMonitor
          # loses the `release` label Prometheus selects by, every rule above
          # goes quiet.
          expr: |
            absent(certmanager_certificate_expiration_timestamp_seconds)
          for: 1h
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/CertManagerMetricsAbsent.md
            summary: "cert-manager metrics are not being scraped"
            description: >-
              No certificate expiry series exists, so every certificate alert is
              inert and the next expiry will be a surprise. Check
              `kubectl -n cert-manager get servicemonitor --show-labels` for
              release=kube-prometheus-stack, and the target in Prometheus.

    # =====================================================================
    # The monitoring system itself. The Watchdog to the external heartbeat
    # covers an unreachable cluster; these cover a broken delivery path.
    # =====================================================================
    - name: homelab.meta.rules
      rules:
        - alert: AlertmanagerNotificationsFailing
          # A counter: rate() asks whether delivery fails now; `> 0` would
          # latch after one transient failure. Catches a wrong ntfy URL
          # or a dead heartbeat URL. If all delivery is broken this cannot be
          # delivered either; the external heartbeat covers that.
          expr: |
            rate(alertmanager_notifications_failed_total[15m]) > 0
          for: 15m
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/AlertmanagerNotificationsFailing.md
            summary: "Alertmanager cannot deliver notifications ({{ $labels.integration }})"
            description: >-
              Alerts are firing and not arriving. Check the credentials in the
              `alertmanager-notify` Secret and the Alertmanager pod log. If the
              phone has gone quiet, this is why.

        - alert: AlertmanagerHasNoReceiverConfigured
          # The Watchdog route sends every 5 minutes, so a flat counter for 6h
          # means every route leads nowhere. Summed: unused integrations
          # export flat zero counters.
          expr: |
            sum(increase(alertmanager_notifications_total[6h])) == 0
            or absent(alertmanager_notifications_total)
          for: 1h
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/AlertmanagerHasNoReceiverConfigured.md
            summary: "Alertmanager has sent nothing in 6 hours"
            description: >-
              The Watchdog route sends a heartbeat every 5 minutes, so this
              counter should never be flat. Either the receivers have been
              removed -- the state this repo was in before the alerting work --
              or Alertmanager is wedged. This is one of the very few places
              where `or absent(...)` is combined into a single rule rather than
              split: both halves mean the identical thing, 'nothing is being
              sent', and there is one action either way.

        - alert: KubeStateMetricsAbsent
          # Roughly half the rules in this repo are built on kube_*. If
          # kube-state-metrics stops being scraped, all of them evaluate over an
          # empty set and report nothing wrong.
          expr: |
            absent(kube_pod_info)
          for: 15m
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/KubeStateMetricsAbsent.md
            summary: "kube-state-metrics is not being scraped"
            description: >-
              Every kube_* alert in this cluster -- pods, jobs, cronjobs, PVCs,
              deployments -- is currently inert.

        - alert: NodeExporterAbsent
          expr: |
            absent(node_filesystem_avail_bytes)
          for: 15m
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/NodeExporterAbsent.md
            summary: "node-exporter is not being scraped"
            description: >-
              No node disk, memory or filesystem alerting is active. The
              /controller eMMC is unmonitored while this fires.

        # ---------------------------------------------------------------
        # No "Prometheus stopped ingesting" rule: the chart's
        # PrometheusNotIngestingSamples uses the same expression.
        # ---------------------------------------------------------------
