# The restic CronJobs the backup-freshness SLO watches, as static series, so
# a deleted or never-successful CronJob still goes stale. Repo-policy
# `backup-slo-targets` keeps it equal to ci/active-cronjobs.txt.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-backup-slo-targets
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab.backup-slo.targets
      rules:
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: immich, cronjob: immich-library-backup}
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: immich, cronjob: immich-library-backup-local}
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: mealie, cronjob: mealie-backup}
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: paperless, cronjob: paperless-backup}
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: syncthing, cronjob: syncthing-backup}
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: theater, cronjob: theater-postgres-backup}
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: theater, cronjob: theater-config-backup-sonarr}
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: theater, cronjob: theater-config-backup-radarr}
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: theater, cronjob: theater-config-backup-lidarr}
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: theater, cronjob: theater-config-backup-prowlarr}
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: theater, cronjob: theater-config-backup-plex}
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: theater, cronjob: theater-config-backup-jellyfin}
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: theater, cronjob: theater-config-backup-lazylibrarian}
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: theater, cronjob: theater-config-backup-bazarr}
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: books, cronjob: books-config-backup-audiobookshelf}
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: books, cronjob: books-config-backup-calibre-web}
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: home, cronjob: home-assistant-backup}
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: monitoring, cronjob: grafana-backup}
        - record: slo:backup_target:info
          expr: vector(1)
          labels: {kind: restic, namespace: signoz, cronjob: signoz-backup}
