# Availability SLOs for the user-facing apps, as plain recording rules.
#
# Objective: 99.5% of blackbox probes succeed over 30 days, per app. The error
# budget is therefore 0.5%, about 3.6 hours a month.
#
# SLI: `probe_success` of job `blackbox-public` (Probes in
# platform/blackbox-exporter/probes), grouped by its `app` label. A probe runs
# every 30s from inside the cluster through the public name, so an app counts
# as down when its Gateway route, its backend, DNS or the WAN address fails.
#
# In scope: auth cinema theater media archive cook drive syncthing. argo and
# grafana are probed but carry no SLO: they are operator tools.
#
# Alerts follow the multi-window, multi-burn-rate pattern (Google SRE workbook,
# "Alerting on SLOs"): an alert needs both a long window (the budget is really
# burning) and a short one (it is still burning now).
#
#   alert                     burn rate   long / short window   budget spent
#   SLOErrorBudgetBurnFast    14.4x       1h / 5m               2% in 1h
#                             6x          6h / 30m              5% in 6h
#   SLOErrorBudgetBurnSlow    3x          1d / 2h               10% in 1d
#                             1x          3d / 6h               10% in 3d
#
# The 30-day figures need 30 days of data: `retention: 30d` in ../values.yaml.
#
# Tests: tests/prometheus/slo_test.yaml (promtool test rules).
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-slo
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab.slo.sli
      interval: 30s
      rules:
        - record: slo:probe_error:ratio_rate5m
          expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|drive|syncthing"}[5m]))
        - record: slo:probe_error:ratio_rate30m
          expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|drive|syncthing"}[30m]))
        - record: slo:probe_error:ratio_rate1h
          expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|drive|syncthing"}[1h]))
        - record: slo:probe_error:ratio_rate2h
          expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|drive|syncthing"}[2h]))
        - record: slo:probe_error:ratio_rate6h
          expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|drive|syncthing"}[6h]))

    # The long windows change slowly; evaluating them every 2 minutes keeps the
    # cost of reading days of samples low. Not 5m or more: an instant query
    # looks back 5 minutes, so a 5m interval leaves gaps with no sample.
    - name: homelab.slo.sli-long
      interval: 2m
      rules:
        - record: slo:probe_error:ratio_rate1d
          expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|drive|syncthing"}[1d]))
        - record: slo:probe_error:ratio_rate3d
          expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|drive|syncthing"}[3d]))
        - record: slo:probe_error:ratio_rate30d
          expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|drive|syncthing"}[30d]))
        - record: slo:availability:ratio_rate30d
          expr: 1 - slo:probe_error:ratio_rate30d
        # 1 = the whole budget is left, 0 = spent, negative = SLO missed.
        - record: slo:error_budget_remaining:ratio_rate30d
          expr: 1 - slo:probe_error:ratio_rate30d / 0.005

    - name: homelab.slo.alerts
      rules:
        - alert: SLOErrorBudgetBurnFast
          expr: |
            (
              slo:probe_error:ratio_rate1h > (14.4 * 0.005)
              and
              slo:probe_error:ratio_rate5m > (14.4 * 0.005)
            )
            or
            (
              slo:probe_error:ratio_rate6h > (6 * 0.005)
              and
              slo:probe_error:ratio_rate30m > (6 * 0.005)
            )
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.app }} is burning its 30-day error budget fast"
            description: >-
              At this rate the 99.5% availability budget of {{ $labels.app }}
              is gone within days. Check https://{{ $labels.app }}.lilalala.com,
              then the Homelab overview dashboard (probe status and duration).
        - alert: SLOErrorBudgetBurnSlow
          expr: |
            (
              slo:probe_error:ratio_rate1d > (3 * 0.005)
              and
              slo:probe_error:ratio_rate2h > (3 * 0.005)
            )
            or
            (
              slo:probe_error:ratio_rate3d > 0.005
              and
              slo:probe_error:ratio_rate6h > 0.005
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.app }} is slowly burning its 30-day error budget"
            description: >-
              {{ $labels.app }} fails more probes than its 99.5% objective
              allows, over a day or more. Usually intermittent: look for
              restarts, slow responses (probe_duration_seconds) or a flapping
              node.
        - alert: SLOProbesAbsent
          # Without probe_success every SLO rule above evaluates to nothing and
          # cannot fire. TargetDown does not see a Probe object that was
          # deleted; absent() does.
          expr: absent(probe_success{job="blackbox-public"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "No public blackbox probe results: the SLO alerts are blind"
            description: >-
              Check the blackbox-exporter Application and the Probes in
              platform/blackbox-exporter/probes.
