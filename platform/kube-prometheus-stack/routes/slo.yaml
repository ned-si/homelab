# Availability SLOs for the user-facing apps (docs/sre.md): 99.5% of
# `blackbox-public` probes succeed over 30 days, per app (budget about 3.6 h a
# month). Probes go through the public name, so routes, backends, DNS and the
# WAN all count. argo and grafana are probed without an SLO.
#
# Multi-window, multi-burn-rate alerts (Google SRE workbook, "Alerting on
# SLOs"). The burns are `action: auto`; their persistent versions page. The
# slow burn stays quiet for a day after a fast burn, so one outage notifies
# once. Latency is an internal objective (99% within the app's threshold),
# slow burn only. The 30-day figures need `retention: 30d`.
# Tests: tests/prometheus/slo_test.yaml.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-slo
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab.slo.sli
      interval: 30s
      rules:
        - record: slo:probe_error:ratio_rate5m
          expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|syncthing|nedsi"}[5m]))
        - record: slo:probe_error:ratio_rate30m
          expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|syncthing|nedsi"}[30m]))
        - record: slo:probe_error:ratio_rate1h
          expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|syncthing|nedsi"}[1h]))
        - record: slo:probe_error:ratio_rate2h
          expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|syncthing|nedsi"}[2h]))
        - record: slo:probe_error:ratio_rate6h
          expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|syncthing|nedsi"}[6h]))

    # The long windows change slowly; evaluating them every 2 minutes keeps the
    # cost of reading days of samples low. Not 5m or more: an instant query
    # looks back 5 minutes, so a 5m interval leaves gaps with no sample.
    - name: homelab.slo.sli-long
      interval: 2m
      rules:
        - record: slo:probe_error:ratio_rate1d
          expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|syncthing|nedsi"}[1d]))
        - record: slo:probe_error:ratio_rate3d
          expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|syncthing|nedsi"}[3d]))
        - record: slo:probe_error:ratio_rate30d
          expr: 1 - avg by (app) (avg_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|syncthing|nedsi"}[30d]))
        - record: slo:availability:ratio_rate30d
          expr: 1 - slo:probe_error:ratio_rate30d
        # 1 = the whole budget is left, 0 = spent, negative = SLO missed.
        - record: slo:error_budget_remaining:ratio_rate30d
          expr: 1 - slo:probe_error:ratio_rate30d / 0.005
        # The share of the 30-day window with probe results: samples per
        # target over the 2880 a day of a 30s probe interval
        # (platform/blackbox-exporter/probes). Below 1 the 30-day figures
        # cover a shorter window.
        - record: slo:sli_coverage:ratio_rate30d
          expr: |
            clamp_max(
              avg by (app) (
                count_over_time(probe_success{job="blackbox-public", app=~"auth|cinema|theater|media|archive|cook|syncthing|nedsi"}[30d])
              ) / (30 * 2880),
              1
            )

    # The namespace each app runs in. The burn alerts carry it, so that an app
    # outage inhibits the pod, workload and Argo CD alerts of the same
    # namespace in Alertmanager (../values.yaml).
    - name: homelab.slo.apps
      rules:
        - record: slo:app:info
          expr: vector(1)
          labels: {app: auth, namespace: keycloak}
        - record: slo:app:info
          expr: vector(1)
          labels: {app: cinema, namespace: theater}
        - record: slo:app:info
          expr: vector(1)
          labels: {app: theater, namespace: theater}
        - record: slo:app:info
          expr: vector(1)
          labels: {app: media, namespace: immich}
        - record: slo:app:info
          expr: vector(1)
          labels: {app: archive, namespace: paperless}
        - record: slo:app:info
          expr: vector(1)
          labels: {app: cook, namespace: mealie}
        - record: slo:app:info
          expr: vector(1)
          labels: {app: syncthing, namespace: syncthing}
        - record: slo:app:info
          expr: vector(1)
          labels: {app: nedsi, namespace: website}

    - name: homelab.slo.alerts
      rules:
        - alert: SLOErrorBudgetBurnFast
          expr: |
            (
              (
                slo:probe_error:ratio_rate1h > (14.4 * 0.005)
                and
                slo:probe_error:ratio_rate5m > (14.4 * 0.005)
              )
              or
              (
                slo:probe_error:ratio_rate6h > (6 * 0.005)
                and
                slo:probe_error:ratio_rate30m > (6 * 0.005)
              )
            )
            * on (app) group_left (namespace) slo:app:info
          for: 2m
          labels:
            severity: critical
            action: auto
          annotations:
            summary: "{{ $labels.app }} is burning its 30-day error budget fast"
            description: >-
              At this rate the 99.5% availability budget of {{ $labels.app }}
              is gone within days. Check https://{{ $labels.app }}.lilalala.com,
              then the Homelab overview dashboard (probe status and duration).
        # Quiet for a day after a fast burn of the same app: the slow windows
        # still hold that outage after it ends, and it has already notified.
        - alert: SLOErrorBudgetBurnSlow
          expr: |
            (
              (
                slo:probe_error:ratio_rate1d > (3 * 0.005)
                and
                slo:probe_error:ratio_rate2h > (3 * 0.005)
              )
              or
              (
                slo:probe_error:ratio_rate3d > 0.005
                and
                slo:probe_error:ratio_rate6h > 0.005
              )
            )
            * on (app) group_left (namespace) slo:app:info
            unless on (app) max_over_time(ALERTS{alertname="SLOErrorBudgetBurnFast", alertstate="firing"}[1d])
          for: 15m
          labels:
            severity: warning
            action: auto
          annotations:
            summary: "{{ $labels.app }} is slowly burning its 30-day error budget"
            description: >-
              {{ $labels.app }} fails more probes than its 99.5% objective
              allows, over a day or more. Usually intermittent: look for
              restarts, slow responses (probe_duration_seconds) or a flapping
              node.
        # The pages. Fast: the 1h / 5m pair still true after 30 minutes, so
        # the app is failing now. Not the 6h / 30m pair: it stays true for
        # half an hour after recovery.
        - alert: SLOErrorBudgetBurnFastPersistent
          expr: |
            (
              slo:probe_error:ratio_rate1h > (14.4 * 0.005)
              and
              slo:probe_error:ratio_rate5m > (14.4 * 0.005)
            )
            * on (app) group_left (namespace) slo:app:info
          for: 30m
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOErrorBudgetBurnFastPersistent.md
            summary: "{{ $labels.app }} has been failing for 30 minutes"
            description: >-
              The public probes of {{ $labels.app }} have failed for half an
              hour and nothing automatic has fixed it. Check
              https://{{ $labels.app }}.lilalala.com, the Homelab overview
              dashboard, and the Homelab / Automation dashboard for a rollback
              that was refused or failed.
        - alert: SLOErrorBudgetBurnSlowPersistent
          expr: max by (app, namespace) (ALERTS{alertname="SLOErrorBudgetBurnSlow", alertstate="firing"})
          for: 1d
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOErrorBudgetBurnSlowPersistent.md
            summary: "{{ $labels.app }} has been burning its error budget for a day"
            description: >-
              SLOErrorBudgetBurnSlow has fired for {{ $labels.app }} for 24
              hours: an intermittent fault that does not go away on its own.
              Look for restarts, slow responses (probe_duration_seconds) or a
              flapping node.
        - alert: SLOProbesAbsent
          # Without probe_success every SLO rule above evaluates to nothing and
          # cannot fire. TargetDown does not see a Probe object that was
          # deleted; absent() does.
          expr: absent(probe_success{job="blackbox-public"})
          for: 15m
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOProbesAbsent.md
            summary: "No public blackbox probe results: the SLO alerts are blind"
            description: >-
              Check the blackbox-exporter Application and the Probes in
              platform/blackbox-exporter/probes.

    # One absent() per SLO target: a target dropped from a Probe leaves its
    # SLO with no series, so no burn alert can fire for it. Quiet while
    # SLOProbesAbsent fires (every target missing is one problem, not eight).
    - name: homelab.slo.targets
      rules:
        - alert: SLOTargetProbeAbsent
          expr: absent(probe_success{job="blackbox-public", app="auth"}) unless on() absent(probe_success{job="blackbox-public"})
          for: 15m
          labels:
            app: auth
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOTargetProbeAbsent.md
            summary: "No probe results for {{ $labels.app }}: its SLO alerts are blind"
            description: >-
              The {{ $labels.app }} target is missing from the Probes in
              platform/blackbox-exporter/probes, or its `app` relabeling no
              longer matches.
        - alert: SLOTargetProbeAbsent
          expr: absent(probe_success{job="blackbox-public", app="cinema"}) unless on() absent(probe_success{job="blackbox-public"})
          for: 15m
          labels:
            app: cinema
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOTargetProbeAbsent.md
            summary: "No probe results for {{ $labels.app }}: its SLO alerts are blind"
            description: >-
              The {{ $labels.app }} target is missing from the Probes in
              platform/blackbox-exporter/probes, or its `app` relabeling no
              longer matches.
        - alert: SLOTargetProbeAbsent
          expr: absent(probe_success{job="blackbox-public", app="theater"}) unless on() absent(probe_success{job="blackbox-public"})
          for: 15m
          labels:
            app: theater
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOTargetProbeAbsent.md
            summary: "No probe results for {{ $labels.app }}: its SLO alerts are blind"
            description: >-
              The {{ $labels.app }} target is missing from the Probes in
              platform/blackbox-exporter/probes, or its `app` relabeling no
              longer matches.
        - alert: SLOTargetProbeAbsent
          expr: absent(probe_success{job="blackbox-public", app="media"}) unless on() absent(probe_success{job="blackbox-public"})
          for: 15m
          labels:
            app: media
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOTargetProbeAbsent.md
            summary: "No probe results for {{ $labels.app }}: its SLO alerts are blind"
            description: >-
              The {{ $labels.app }} target is missing from the Probes in
              platform/blackbox-exporter/probes, or its `app` relabeling no
              longer matches.
        - alert: SLOTargetProbeAbsent
          expr: absent(probe_success{job="blackbox-public", app="archive"}) unless on() absent(probe_success{job="blackbox-public"})
          for: 15m
          labels:
            app: archive
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOTargetProbeAbsent.md
            summary: "No probe results for {{ $labels.app }}: its SLO alerts are blind"
            description: >-
              The {{ $labels.app }} target is missing from the Probes in
              platform/blackbox-exporter/probes, or its `app` relabeling no
              longer matches.
        - alert: SLOTargetProbeAbsent
          expr: absent(probe_success{job="blackbox-public", app="cook"}) unless on() absent(probe_success{job="blackbox-public"})
          for: 15m
          labels:
            app: cook
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOTargetProbeAbsent.md
            summary: "No probe results for {{ $labels.app }}: its SLO alerts are blind"
            description: >-
              The {{ $labels.app }} target is missing from the Probes in
              platform/blackbox-exporter/probes, or its `app` relabeling no
              longer matches.
        - alert: SLOTargetProbeAbsent
          expr: absent(probe_success{job="blackbox-public", app="syncthing"}) unless on() absent(probe_success{job="blackbox-public"})
          for: 15m
          labels:
            app: syncthing
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOTargetProbeAbsent.md
            summary: "No probe results for {{ $labels.app }}: its SLO alerts are blind"
            description: >-
              The {{ $labels.app }} target is missing from the Probes in
              platform/blackbox-exporter/probes, or its `app` relabeling no
              longer matches.
        - alert: SLOTargetProbeAbsent
          expr: absent(probe_success{job="blackbox-public", app="nedsi"}) unless on() absent(probe_success{job="blackbox-public"})
          for: 15m
          labels:
            app: nedsi
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOTargetProbeAbsent.md
            summary: "No probe results for {{ $labels.app }}: its SLO alerts are blind"
            description: >-
              The {{ $labels.app }} target is missing from the Probes in
              platform/blackbox-exporter/probes, or its `app` relabeling no
              longer matches.

    # Latency thresholds from scripts/slo-latency-thresholds.sh: the smallest
    # of 0.25 0.5 1 2 5 s at least twice the app's p95, static so a
    # regression cannot move its own bar. A failed probe counts as slow.
    - name: homelab.slo.latency-thresholds
      rules:
        - record: slo:latency_threshold_seconds
          expr: vector(0.25)
          labels: {app: auth}
        - record: slo:latency_threshold_seconds
          expr: vector(0.25)
          labels: {app: cinema}
        - record: slo:latency_threshold_seconds
          expr: vector(0.25)
          labels: {app: theater}
        - record: slo:latency_threshold_seconds
          expr: vector(0.25)
          labels: {app: media}
        - record: slo:latency_threshold_seconds
          expr: vector(0.25)
          labels: {app: archive}
        - record: slo:latency_threshold_seconds
          expr: vector(0.25)
          labels: {app: cook}
        - record: slo:latency_threshold_seconds
          expr: vector(0.25)
          labels: {app: syncthing}
        # The blog: static files, no p95 history yet; the smallest bar.
        - record: slo:latency_threshold_seconds
          expr: vector(0.25)
          labels: {app: nedsi}

    # 1 per probe target when its last probe succeeded within the threshold,
    # else 0. Evaluated every 30s, the probe interval, so each probe counts
    # about once.
    - name: homelab.slo.latency
      interval: 30s
      rules:
        - record: slo:probe_fast
          expr: |
            probe_success{job="blackbox-public"}
            * (
              probe_duration_seconds{job="blackbox-public"}
              <= bool on (app) group_left () slo:latency_threshold_seconds
            )
        - record: slo:probe_slow:ratio_rate2h
          expr: 1 - avg by (app) (avg_over_time(slo:probe_fast[2h]))
        - record: slo:probe_slow:ratio_rate6h
          expr: 1 - avg by (app) (avg_over_time(slo:probe_fast[6h]))

    - name: homelab.slo.latency-long
      interval: 2m
      rules:
        - record: slo:probe_slow:ratio_rate1d
          expr: 1 - avg by (app) (avg_over_time(slo:probe_fast[1d]))
        - record: slo:probe_slow:ratio_rate3d
          expr: 1 - avg by (app) (avg_over_time(slo:probe_fast[3d]))
        - record: slo:probe_slow:ratio_rate30d
          expr: 1 - avg by (app) (avg_over_time(slo:probe_fast[30d]))
        - record: slo:latency:ratio_rate30d
          expr: 1 - slo:probe_slow:ratio_rate30d
        # 1 = the whole budget (1% slow) is left, 0 = spent, negative = missed.
        - record: slo:latency_budget_remaining:ratio_rate30d
          expr: 1 - slo:probe_slow:ratio_rate30d / 0.01

    # Slow burn only: a hard outage is the availability alerts' job. Quiet
    # while an availability burn of the app is pending or firing, and for a
    # day after a fast one.
    - name: homelab.slo.latency-alerts
      rules:
        - alert: SLOLatencyBudgetBurnSlow
          expr: |
            (
              (
                slo:probe_slow:ratio_rate1d > (3 * 0.01)
                and
                slo:probe_slow:ratio_rate2h > (3 * 0.01)
              )
              or
              (
                slo:probe_slow:ratio_rate3d > 0.01
                and
                slo:probe_slow:ratio_rate6h > 0.01
              )
            )
            * on (app) group_left (namespace) slo:app:info
            unless on (app) ALERTS{alertname="SLOErrorBudgetBurnSlow"}
            unless on (app) max_over_time(ALERTS{alertname="SLOErrorBudgetBurnFast"}[1d])
          for: 15m
          labels:
            severity: warning
            action: auto
          annotations:
            summary: "{{ $labels.app }} is slowly burning its 30-day latency budget"
            description: >-
              More than 1% of the probes of {{ $labels.app }} answer slower
              than its threshold (slo:latency_threshold_seconds), over a day
              or more, while the app is up. Look at probe_duration_seconds on
              the Homelab overview dashboard.
        - alert: SLOLatencyBudgetBurnSlowPersistent
          expr: max by (app, namespace) (ALERTS{alertname="SLOLatencyBudgetBurnSlow", alertstate="firing"})
          for: 1d
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOLatencyBudgetBurnSlowPersistent.md
            summary: "{{ $labels.app }} has been slow for a day"
            description: >-
              SLOLatencyBudgetBurnSlow has fired for {{ $labels.app }} for 24
              hours: responses stay slower than its threshold and nothing
              automatic has fixed it.
