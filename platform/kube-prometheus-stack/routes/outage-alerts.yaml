# Cluster-wide outages: a node NotReady, the NAS unreachable, the Gateway down.
#
# Two alerts per outage. The short one (`action: auto`) feeds the outage guard
# of auto-rollback, which matches it by name (OUTAGE_ALERTS in
# scripts/ci/auto-rollback-guard.sh: rename both), and inhibits the alerts it
# causes. The long one pages: 15m covers a Talos upgrade reboot, 10m the NAS
# switch flaps.
#
# GatewayDown is every app at once: not in the outage guard, pages through
# quiet hours (ntfy-urgent) and inhibits the per-app SLO burns.
# Tests: tests/prometheus/outage_test.yaml.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-outage
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab.outage
      rules:
        - alert: HomelabNodeNotReady
          expr: max by (node) (kube_node_status_condition{condition="Ready", status="true"}) == 0
          for: 2m
          labels:
            severity: critical
            action: auto
          annotations:
            summary: "Node {{ $labels.node }} is NotReady"
            description: >-
              {{ $labels.node }} has not been Ready for 2 minutes; its pods
              and volumes are down. auto-rollback reverts nothing while this
              fires. Check `kubectl get nodes` and
              `talosctl -n <node IP> dmesg`.

        - alert: HomelabNodeDown
          expr: max by (node) (kube_node_status_condition{condition="Ready", status="true"}) == 0
          for: 15m
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/HomelabNodeDown.md
            summary: "Node {{ $labels.node }} has been NotReady for 15 minutes"
            description: >-
              {{ $labels.node }} did not come back on its own. Check
              `talosctl -n <node IP> dmesg`, then power-cycle it from the
              BMC (docs/runbooks/node-power-cycle.md).

        - alert: HomelabNASUnreachable
          expr: |
            max by (instance) (
              probe_success{job="blackbox-internal", instance=~"192\\.168\\.1\\.228:(3260|2049)"}
            ) == 0
          for: 2m
          labels:
            severity: critical
            action: auto
          annotations:
            summary: "NAS port {{ $labels.instance }} is unreachable"
            description: >-
              The cluster cannot reach {{ $labels.instance }} for 2 minutes
              (3260 iSCSI: every PVC; 2049 NFS: media and local backups).
              auto-rollback reverts nothing while this fires. Check the NAS
              and the basement switch.

        - alert: HomelabNASDown
          expr: |
            max by (instance) (
              probe_success{job="blackbox-internal", instance=~"192\\.168\\.1\\.228:(3260|2049)"}
            ) == 0
          for: 10m
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/HomelabNASDown.md
            summary: "NAS port {{ $labels.instance }} has been unreachable for 10 minutes"
            description: >-
              The NAS does not power on by itself after a power loss: press
              its power button. Otherwise check the basement switch and the
              NAS network link.
        - alert: GatewayDown
          expr: |
            count(avg_over_time(probe_success{job="blackbox-public"}[2m]) < 0.5)
              >= 0.5 * count(avg_over_time(probe_success{job="blackbox-public"}[2m]))
          for: 5m
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/GatewayDown.md
            summary: "Half or more of the public hostnames are down"
            description: >-
              {{ $value }} public hostnames have failed their probe for 5
              minutes: the shared Gateway, Cilium or the uplink, not one app.
              Pages through quiet hours.
