# Cluster-wide outages: a node NotReady or the NAS unreachable.
#
# Two alerts per outage. The short one is read by the outage guard of
# auto-rollback (scripts/ci/auto-rollback-guard.sh): while it fires, a failing
# app is blamed on the outage, not on the newest merge, and nothing is
# reverted. The guard finds it by alert name in the ntfy.sh guard topic, so a
# rename here needs the same rename in OUTAGE_ALERTS there. It also inhibits
# the alerts the outage causes (../values.yaml). It pages nobody: a node
# rebooting for a Talos upgrade, or a switch that drops the NAS for a few
# minutes, recovers on its own. The long one pages: past that window the node
# or the NAS needs a person (power, cable, the NAS power button).
#
#   HomelabNodeNotReady     a node not Ready for 2m          critical  auto
#   HomelabNodeDown         a node not Ready for 15m         critical  human
#   HomelabNASUnreachable   iSCSI or NFS port down for 2m    critical  auto
#   HomelabNASDown          iSCSI or NFS port down for 10m   critical  human
#   GatewayDown             half the public probes failing   critical  human
#                           for 5m
#
# GatewayDown is every app at once, so it is never one merge's fault to hide
# behind: it is not in the outage guard (a failed Cilium patch update must
# still revert), it pages through quiet hours (receiver ntfy-urgent), and it
# inhibits the per-app SLO burns (../values.yaml). Postmortem 2026-10-23.
#
# 15 minutes covers a Talos upgrade reboot (about 5 on the RK1 eMMC); 10
# covers the switch flaps seen so far (the longest, 2026-10-15, about 11
# minutes with the cluster unreachable too, so it is the heartbeat's case).
#
# Tests: tests/prometheus/outage_test.yaml (promtool test rules).
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-outage
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab.outage
      rules:
        - alert: HomelabNodeNotReady
          expr: max by (node) (kube_node_status_condition{condition="Ready", status="true"}) == 0
          for: 2m
          labels:
            severity: critical
            action: auto
          annotations:
            summary: "Node {{ $labels.node }} is NotReady"
            description: >-
              {{ $labels.node }} has not been Ready for 2 minutes; its pods
              and volumes are down. auto-rollback reverts nothing while this
              fires. Check `kubectl get nodes` and
              `talosctl -n <node IP> dmesg`.

        - alert: HomelabNodeDown
          expr: max by (node) (kube_node_status_condition{condition="Ready", status="true"}) == 0
          for: 15m
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/HomelabNodeDown.md
            summary: "Node {{ $labels.node }} has been NotReady for 15 minutes"
            description: >-
              {{ $labels.node }} did not come back on its own. Check
              `talosctl -n <node IP> dmesg`, then power-cycle it from the
              BMC (docs/runbooks/node-power-cycle.md).

        - alert: HomelabNASUnreachable
          expr: |
            max by (instance) (
              probe_success{job="blackbox-internal", instance=~"192\\.168\\.1\\.228:(3260|2049)"}
            ) == 0
          for: 2m
          labels:
            severity: critical
            action: auto
          annotations:
            summary: "NAS port {{ $labels.instance }} is unreachable"
            description: >-
              The cluster cannot reach {{ $labels.instance }} for 2 minutes
              (3260 iSCSI: every PVC; 2049 NFS: media and local backups).
              auto-rollback reverts nothing while this fires. Check the NAS
              and the basement switch.

        - alert: HomelabNASDown
          expr: |
            max by (instance) (
              probe_success{job="blackbox-internal", instance=~"192\\.168\\.1\\.228:(3260|2049)"}
            ) == 0
          for: 10m
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/HomelabNASDown.md
            summary: "NAS port {{ $labels.instance }} has been unreachable for 10 minutes"
            description: >-
              The NAS does not power on by itself after a power loss: press
              its power button. Otherwise check the basement switch and the
              NAS network link.
        - alert: GatewayDown
          expr: |
            count(avg_over_time(probe_success{job="blackbox-public"}[2m]) < 0.5)
              >= 0.5 * count(avg_over_time(probe_success{job="blackbox-public"}[2m]))
          for: 5m
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/GatewayDown.md
            summary: "Half or more of the public hostnames are down"
            description: >-
              {{ $value }} public hostnames have failed their probe for 5
              minutes: the shared Gateway, Cilium or the uplink, not one app.
              Pages through quiet hours.
