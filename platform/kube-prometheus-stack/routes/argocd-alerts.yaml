# Argo CD failures as alerts, from the application controller's metrics
# (ServiceMonitor `argocd-application-controller`, bootstrap/argocd-values.yaml).
#
#   ArgoCDAppDegraded       health Degraded for 5m                      critical  auto
#   ArgoCDSyncFailed        a sync ended Failed or Error in the last 10m  warning   auto
#   ArgoCDAppOutOfSync      OutOfSync for 30m                           warning   auto
#   ArgoCDAppStillDegraded  health Degraded for 30m                     critical  human
#   ArgoCDSyncStuck         OutOfSync for 30m after a failed sync       warning   human
#   ArgoCDMetricsAbsent     no argocd_app_info for 15m, so none of the
#                           above can fire                              warning   human
#
# `action: auto` is what auto-rollback and self-heal handle: Grafana only.
# `action: human` pages (docs/sre.md "Paging"). `namespace` is the
# Application's destination namespace, so an app-level alert of that
# namespace inhibits them (../values.yaml).
#
# They resolve on their own once the app recovers. The record of an automatic
# rollback is its revert pull request (label `auto-rollback`); the Homelab
# overview dashboard marks the failure and the recovery sync as annotations.
#
# Tests: tests/prometheus/argocd_test.yaml (promtool test rules).
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-argocd
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab.argocd
      rules:
        - alert: ArgoCDAppDegraded
          expr: |
            max by (name, namespace) (
              label_replace(argocd_app_info{health_status="Degraded"}, "namespace", "$1", "dest_namespace", "(.*)")
            ) == 1
          for: 5m
          labels:
            severity: critical
            action: auto
          annotations:
            summary: "{{ $labels.name }} is Degraded"
            description: >-
              Argo CD reports the Application {{ $labels.name }} as Degraded
              for 5 minutes. If the newest merge deployed it, auto-rollback
              opens a revert pull request. Check
              https://argo.lilalala.com/applications/argo/{{ $labels.name }}.

        # A counter, so increase(); the second half catches the first failure
        # of an app, which creates the series at 1 and so has no increase.
        # That half only counts apps Prometheus already saw 10 minutes ago:
        # when scraping starts (or resumes after a gap) every old failure
        # counter looks new, and is not a failure now. The join adds
        # `namespace` from argocd_app_info.
        - alert: ArgoCDSyncFailed
          expr: |
            (
              (sum by (name) (increase(argocd_app_sync_total{phase=~"Error|Failed"}[10m])) > 0)
              or
              (
                sum by (name) (
                  argocd_app_sync_total{phase=~"Error|Failed"}
                  unless argocd_app_sync_total{phase=~"Error|Failed"} offset 10m
                ) > 0
                and on (name) max by (name) (argocd_app_info offset 10m)
              )
            )
            * on (name) group_left (namespace)
            max by (name, namespace) (
              label_replace(argocd_app_info, "namespace", "$1", "dest_namespace", "(.*)")
            )
          labels:
            severity: warning
            action: auto
          annotations:
            summary: "{{ $labels.name }}: sync failed"
            description: >-
              A sync of {{ $labels.name }} ended Failed or Error in the last 10
              minutes. Check
              https://argo.lilalala.com/applications/argo/{{ $labels.name }}.

        - alert: ArgoCDAppOutOfSync
          expr: |
            max by (name, namespace) (
              label_replace(argocd_app_info{sync_status="OutOfSync"}, "namespace", "$1", "dest_namespace", "(.*)")
            ) == 1
          for: 30m
          labels:
            severity: warning
            action: auto
          annotations:
            summary: "{{ $labels.name }} is OutOfSync for 30 minutes"
            description: >-
              The live state of {{ $labels.name }} differs from git and
              self-heal has not closed the gap in 30 minutes: a stuck sync, a
              field another controller rewrites, or a resource Argo CD cannot
              apply. Check the diff in
              https://argo.lilalala.com/applications/argo/{{ $labels.name }}.

        # The pages: what auto-rollback did not fix within 30 minutes, because
        # it refused (not the newest merge, a second revert in a row, an
        # excluded app), the outage guard skipped it, or the revert failed.
        # A revert merges and syncs in about 10 minutes.
        - alert: ArgoCDAppStillDegraded
          expr: |
            max by (name, namespace) (
              label_replace(argocd_app_info{health_status="Degraded"}, "namespace", "$1", "dest_namespace", "(.*)")
            ) == 1
          for: 30m
          labels:
            severity: critical
            action: human
          annotations:
            summary: "{{ $labels.name }} has been Degraded for 30 minutes"
            description: >-
              Nothing automatic has fixed {{ $labels.name }}: check the
              auto-rollback run on the Homelab / Automation dashboard, then
              https://argo.lilalala.com/applications/argo/{{ $labels.name }}.

        # OutOfSync for 30 minutes after a failed sync: the merge never
        # deployed and no revert replaced it. ArgoCDSyncFailed has the
        # first-failure logic; its ALERTS series says a sync failed in the
        # last 6 hours.
        - alert: ArgoCDSyncStuck
          expr: |
            max by (name, namespace) (
              label_replace(argocd_app_info{sync_status="OutOfSync"}, "namespace", "$1", "dest_namespace", "(.*)")
            ) == 1
            and on (name)
            max by (name) (max_over_time(ALERTS{alertname="ArgoCDSyncFailed", alertstate="firing"}[6h]))
          for: 30m
          labels:
            severity: warning
            action: human
          annotations:
            summary: "{{ $labels.name }}: sync failed and still OutOfSync after 30 minutes"
            description: >-
              A sync of {{ $labels.name }} failed and nothing automatic has
              replaced it: the cluster still runs the previous revision.
              Check the auto-rollback run on the Homelab / Automation
              dashboard, then
              https://argo.lilalala.com/applications/argo/{{ $labels.name }}.

        - alert: ArgoCDMetricsAbsent
          expr: absent(argocd_app_info)
          for: 15m
          labels:
            severity: warning
            action: human
          annotations:
            summary: Argo CD application metrics are missing
            description: >-
              Prometheus has no argocd_app_info for 15 minutes, so no Argo CD
              alert can fire. Check the ServiceMonitor
              argo/argocd-application-controller (label release) and the
              application controller pod.
