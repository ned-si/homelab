# LAN devices, from the ICMP probes (job `blackbox-lan`,
# platform/blackbox-exporter/probes/lan.yaml).
#
#   LANDeviceUnreachable   the router or the BMC does not answer a ping for 10m   warning
#
# Nodes and the NAS are left to HomelabNodeNotReady and HomelabNASUnreachable
# (outage-alerts.yaml), which page for them already.
#
# Tests: tests/prometheus/lan_test.yaml.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-lan
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab.lan
      rules:
        - alert: LANDeviceUnreachable
          expr: probe_success{job="blackbox-lan", device=~"router|bmc"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "LAN device {{ $labels.device }} ({{ $labels.instance }}) does not answer a ping"
            description: >-
              No ICMP reply for 10 minutes. For the router, the cluster has
              no internet and this may only arrive once it is back. For the
              BMC, check whether its DHCP lease moved (`turingpi.local` from
              the Mac) and update platform/blackbox-exporter/probes/lan.yaml.
