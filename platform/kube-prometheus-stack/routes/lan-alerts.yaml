# LAN devices, from the ICMP probes (job `blackbox-lan`,
# platform/blackbox-exporter/probes/lan.yaml) and the ARP inventory
# (platform/lan-inventory).
#
#   LANDeviceUnreachable   the router or the BMC does not answer a ping for 10m   warning
#   LANNewDeviceSeen       a fixed MAC not seen in the last 30 days answers ARP    warning
#   LANInventoryFailing    no completed ARP scan for 30m                          warning
#   LANInventoryAbsent     no lan_inventory_devices series for 30m                warning
#
# All four need a person (`action: human`, docs/sre.md "Paging"). A new
# randomised MAC has no alert: phones rotate those, and nobody can act on it;
# the Homelab / LAN dashboard counts them.
#
# Nodes and the NAS are left to the alerts of outage-alerts.yaml.
#
# Tests: tests/prometheus/lan_test.yaml, tests/prometheus/lan_inventory_test.yaml.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-lan
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab.lan
      rules:
        - alert: LANDeviceUnreachable
          expr: probe_success{job="blackbox-lan", device=~"router|bmc"} == 0
          for: 10m
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/LANDeviceUnreachable.md
            summary: "LAN device {{ $labels.device }} ({{ $labels.instance }}) does not answer a ping"
            description: >-
              No ICMP reply for 10 minutes. For the router, the cluster has
              no internet and this may only arrive once it is back. For the
              BMC, check whether its DHCP lease moved (`turingpi.local` from
              the Mac) and update platform/blackbox-exporter/probes/lan.yaml.

    # Device inventory from lan-inventory (platform/lan-inventory). Every
    # 5 minutes: the 30-day lookback is the expensive part.
    - name: homelab.lan.inventory.recording
      interval: 5m
      rules:
        - record: lan:device_present:max_by_mac
          expr: max by (mac) (lan_device_present)

    - name: homelab.lan.inventory
      interval: 5m
      rules:
        - alert: LANNewDeviceSeen
          # A MAC with a fixed (vendor) address that answers now and did not
          # answer in the 30 days before the last hour. Quiet for the first
          # day of data, so the first scans do not report every device.
          # Resolves after an hour.
          expr: |
            max by (mac, ip, random_mac) (lan_device_present{random_mac="false"})
            unless on (mac) max_over_time(lan:device_present:max_by_mac[30d] offset 1h)
            and on () (count(lan_inventory_devices offset 1d) > 0)
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/LANNewDeviceSeen.md
            summary: "New device on the LAN: {{ $labels.mac }} at {{ $labels.ip }}"
            description: >-
              {{ $labels.mac }} answered ARP at {{ $labels.ip }} and was not
              seen in the last 30 days. Its MAC is a fixed vendor address, so
              this is new hardware, not a phone rotating its private address.
              If it is not yours, find it in the router's DHCP list and block it.

        - alert: LANInventoryFailing
          expr: |
            lan_inventory_scan_success == 0
            or time() - lan_inventory_scan_timestamp_seconds > 1800
          for: 30m
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/LANInventoryFailing.md
            summary: "lan-inventory has not completed an ARP scan for 30 minutes"
            description: >-
              LANNewDeviceSeen is inert while this fires. Read
              `kubectl -n monitoring logs deploy/lan-inventory`.

        - alert: LANInventoryAbsent
          expr: absent(lan_inventory_devices)
          for: 30m
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/LANInventoryAbsent.md
            summary: "lan-inventory is not being scraped"
            description: >-
              LANNewDeviceSeen is inert while this fires. Check the
              lan-inventory Application and its ServiceMonitor.
