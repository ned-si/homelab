# Would-be drops of the CiliumNetworkPolicy allow-lists (docs/networking.md,
# "Network policy"), from hubble_policy_verdicts_total. A connection no
# allow-list matches is allowed by the synthesized wildcard rule and reported
# as match="all": the default-deny switch would drop it.
#
# The policed namespace is the destination for ingress, the source for egress.
# Only namespaces with a switch in 90-enforcement.yaml count; add one here
# with its allow-list. Elsewhere match="all" is not a would-be drop.
#
# The presence term: Hubble's first sample of a series is already 1, so rate()
# never counts a flow seen once; netpol:would_drop:series shows it.
# netpol.ready runs every 2 minutes, under the 5-minute lookback.
#
# No alert. A direction is flipped only when netpol:ready_to_enforce is 1.
# Tests: tests/prometheus/netpol_test.yaml.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-netpol
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: netpol.verdicts
      interval: 1m
      rules:
        - record: netpol:verdicts:rate5m
          expr: |
            sum by (namespace, direction) (
              label_replace(rate(hubble_policy_verdicts_total{
                  direction="ingress",
                  destination_namespace=~"books|home|immich|mealie|paperless|syncthing|theater"
                }[5m]),
                "namespace", "$1", "destination_namespace", "(.*)")
            )
            or
            sum by (namespace, direction) (
              label_replace(rate(hubble_policy_verdicts_total{
                  direction="egress",
                  source_namespace=~"books|home|immich|mealie|paperless|syncthing|theater"
                }[5m]),
                "namespace", "$1", "source_namespace", "(.*)")
            )
        - record: netpol:would_drop:rate5m
          expr: |
            sum by (namespace, direction) (
              label_replace(rate(hubble_policy_verdicts_total{
                  match="all",
                  direction="ingress",
                  destination_namespace=~"books|home|immich|mealie|paperless|syncthing|theater"
                }[5m]),
                "namespace", "$1", "destination_namespace", "(.*)")
            )
            or
            sum by (namespace, direction) (
              label_replace(rate(hubble_policy_verdicts_total{
                  match="all",
                  direction="egress",
                  source_namespace=~"books|home|immich|mealie|paperless|syncthing|theater"
                }[5m]),
                "namespace", "$1", "source_namespace", "(.*)")
            )
        - record: netpol:would_drop:series
          expr: |
            count by (namespace, direction) (
              label_replace(hubble_policy_verdicts_total{
                  match="all",
                  direction="ingress",
                  destination_namespace=~"books|home|immich|mealie|paperless|syncthing|theater"
                },
                "namespace", "$1", "destination_namespace", "(.*)")
            )
            or
            count by (namespace, direction) (
              label_replace(hubble_policy_verdicts_total{
                  match="all",
                  direction="egress",
                  source_namespace=~"books|home|immich|mealie|paperless|syncthing|theater"
                },
                "namespace", "$1", "source_namespace", "(.*)")
            )
    - name: netpol.ready
      interval: 2m
      rules:
        - record: netpol:would_drop:increase7d
          expr: |
            avg_over_time(netpol:would_drop:rate5m[7d]) * 604800
            or
            max_over_time(netpol:verdicts:rate5m[7d]) * 0
        - record: netpol:would_drop:seen7d
          expr: |
            max_over_time(netpol:would_drop:series[7d])
            or
            max_over_time(netpol:verdicts:rate5m[7d]) * 0
        # 1 only with verdicts 7 days ago: a fresh allow-list or a quiet
        # namespace is not "ready" just because nothing was seen yet.
        - record: netpol:ready_to_enforce
          expr: |
            (
              (netpol:would_drop:increase7d < bool 1)
              * on (namespace, direction)
              (netpol:would_drop:seen7d == bool 0)
              * on (namespace, direction)
              (max_over_time(netpol:verdicts:rate5m[1h] offset 7d) >= bool 0)
            )
            or
            netpol:would_drop:increase7d * 0
