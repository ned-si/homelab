# ONE dashboard: "am I protected right now?"
#
# ###########################################################################
# # DELIBERATELY ONE, NOT ONE PER APP.
# #
# # A dashboard per app is the standard way an observability setup rots: twenty
# # dashboards, each drifting from the workload it describes, none of them the
# # one you open during an incident. This is the single view that answers the
# # question the owner actually has, and it is built ENTIRELY from metrics that
# # already drive alert rules in ./alerts.yaml and
# # platform/backup-verify/alerts.yaml.
# #
# # That last property is what stops it rotting: there is no query here that is
# # not also load-bearing somewhere else, so a metric that disappears breaks an
# # alert (loudly) rather than only a panel (silently).
# #
# # It also deliberately shows NO graphs. Every panel is an instant table or a
# # single number, because the question is "what is the state now", not "what
# # was the trend". Time series here would be decoration, and decoration is what
# # makes a dashboard slow to read.
# ###########################################################################
#
# HOW IT IS LOADED
#   The Grafana sidecar watches for ConfigMaps labelled grafana_dashboard="1" in
#   ALL namespaces (`sidecar.dashboards` in ../values.yaml). That is the same
#   mechanism CloudNativePG and Cilium use to ship theirs, so this needs no
#   provisioning file and no Grafana restart.
#
# ON THE DATASOURCE REFERENCE
#   `${datasource}` with a `type: datasource` template variable, NOT a hardcoded
#   uid. A hardcoded uid is the other classic way a shipped dashboard breaks: the
#   Prometheus datasource uid is generated per install, so a dashboard carrying
#   one from somebody else's cluster renders every panel as "Datasource not
#   found" -- which reads like a broken dashboard rather than a broken reference.
#
# NOT VERIFIED HERE: this JSON has not been loaded into a Grafana. It parses as
# JSON and its queries are the same expressions the alert rules use, but panel
# rendering could not be checked without a running Grafana. If a panel is blank,
# check the query in Explore first -- the expression is more likely to be right
# than the panel options.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-data-protection
  namespace: monitoring
  labels:
    # The label the sidecar selects on. Without it this ConfigMap is inert.
    grafana_dashboard: "1"
data:
  data-protection.json: |
    {
      "uid": "homelab-data-protection",
      "title": "Homelab / Data protection",
      "tags": [
        "homelab",
        "backup"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "editable": true,
      "refresh": "5m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Notifications sent in the last 6h",
          "description": "Watchdog beats every 5m, so this is never 0 when healthy. 0 = alerts go nowhere.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(increase(alertmanager_notifications_total[6h]))",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Postgres clusters with NO object store",
          "description": "Scraped but publishing no backup timestamp: no spec.backup.barmanObjectStore. Expect 5 for now.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count((cnpg_collector_up == 1) unless on (namespace, pod) cnpg_collector_last_available_backup_timestamp) or vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Firing alerts",
          "description": "Excludes Watchdog, which always fires by design.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(ALERTS{alertstate=\"firing\", alertname!=\"Watchdog\"}) or vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Soonest certificate expiry (days)",
          "description": "cert-manager renews at 30d, so under 21 means a renewal already failed silently.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "min((certmanager_certificate_expiration_timestamp_seconds - time()) / 86400)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "unit": "d",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 7
                  },
                  {
                    "color": "green",
                    "value": 21
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "table",
          "title": "Postgres: age of the newest successful backup",
          "description": "Hours since barman's last base backup. A cluster MISSING here has no object store. Over 36h = two failures.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(time() - cnpg_collector_last_available_backup_timestamp) / 3600",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "job": true,
                  "endpoint": true,
                  "instance": true,
                  "container": true,
                  "service": true,
                  "__name__": true
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left"
              },
              "decimals": 1,
              "unit": "h",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 30
                  },
                  {
                    "color": "red",
                    "value": 36
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "type": "table",
          "title": "Backup CronJobs: hours since last scheduled",
          "description": "Shows 'not running', not 'failing'. Over 36h on a daily job = no Job created. Weekly verify jobs reach 168h.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(time() - kube_cronjob_status_last_schedule_time{cronjob=~\".*backup.*\"}) / 3600",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "job": true,
                  "endpoint": true,
                  "instance": true,
                  "container": true,
                  "service": true,
                  "uid": true,
                  "__name__": true
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left"
              },
              "decimals": 1,
              "unit": "h",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 30
                  },
                  {
                    "color": "red",
                    "value": 36
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "type": "table",
          "title": "Volume fullness (%)",
          "description": "From the kubelet, the only source that knows fullness. Listed only while mounted. iscsi allows expansion.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * (1 - kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes)",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "job": true,
                  "endpoint": true,
                  "instance": true,
                  "service": true,
                  "metrics_path": true,
                  "node": true,
                  "__name__": true
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "field": "Value",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left"
              },
              "decimals": 1,
              "unit": "percent",
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 85
                  },
                  {
                    "color": "red",
                    "value": 95
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "gradient"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "type": "table",
          "title": "Node filesystems: % used (worst first)",
          "description": "/controller was at 83% of a 29GB eMMC that holds kubelet and containerd. Pseudo-filesystems excluded.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 - 100 * node_filesystem_avail_bytes{fstype!~\"tmpfs|ramfs|overlay|squashfs|iso9660|nsfs|autofs\"} / node_filesystem_size_bytes",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "job": true,
                  "endpoint": true,
                  "service": true,
                  "container": true,
                  "__name__": true
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "field": "Value",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left"
              },
              "decimals": 1,
              "unit": "percent",
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 85
                  },
                  {
                    "color": "red",
                    "value": 92
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Value"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "gradient"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true
          }
        }
      ]
    }
