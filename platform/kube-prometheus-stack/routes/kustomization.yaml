apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

# Rendered: the Grafana route, the SLO rules, the general cluster alerts, the
# Argo CD, the outage and the NAS alerts, the Cilium PodMonitors, the etcd scrape.
# And the nightly restic backup of grafana.db (grafana-backup.yaml).
resources:
  - grafana-backup.yaml
  - grafana.yaml
  - slo.yaml
  - alerts.yaml
  - argocd-alerts.yaml
  - outage-alerts.yaml
  - cilium-monitors.yaml
  - etcd-scrape.yaml
  - nas-alerts.yaml
  - lan-alerts.yaml
