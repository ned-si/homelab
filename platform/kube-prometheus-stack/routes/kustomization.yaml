apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

# Rendered: the Grafana route, the SLO rules and the Argo CD alerts. alerts.yaml,
# dashboard-data-protection.yaml and grafana-backup.yaml are new behaviour
# (alerting and backups) and ship in their own changes.
resources:
  - grafana.yaml
  - slo.yaml
  - argocd-alerts.yaml
