apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

# Rendered: the Grafana route, the SLO rules, the general cluster alerts, the
# Argo CD, the outage, the NAS, the LAN and the *arr alerts, the Cilium
# PodMonitors, the etcd scrape.
# And the nightly restic backup of grafana.db (grafana-backup.yaml).
resources:
  - grafana-backup.yaml
  - grafana.yaml
  - slo.yaml
  # The backup-freshness SLO and the CronJobs it watches.
  - backup-slo.yaml
  - backup-slo-targets.yaml
  # The automation history of the Homelab / Automation dashboard.
  - automation.yaml
  - alerts.yaml
  - argocd-alerts.yaml
  - outage-alerts.yaml
  - kyverno-alerts.yaml
  - cilium-monitors.yaml
  - etcd-scrape.yaml
  - nas-alerts.yaml
  - lan-alerts.yaml
  - arr-alerts.yaml
  # Hubble relay and its certificates.
  - hubble-alerts.yaml
  # Would-be drops of the network policy allow-lists (recording rules only).
  - netpol.yaml
  # The SigNoz trial gate, the log-pipeline alerts and the collector scrape.
  - signoz-trial.yaml
  # Talos audit records (Vector's counter): AuditAVCRateHigh.
  - audit-records.yaml
