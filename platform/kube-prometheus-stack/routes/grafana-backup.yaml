# Grafana's state to S3 with restic: a BEST-EFFORT copy of a live SQLite
# database, tagged as such. The restic image has no sqlite3, so the copy can
# be torn.
#
# Little is lost if it is: dashboards and datasources are provisioned from
# git, users come from Keycloak. grafana.db holds only hand-made dashboards,
# stars, preferences and annotations.
#
# Rejected: scaling Grafana to 0 (selfHeal reverts it mid-backup), a
# VolumeSnapshot pipeline (no snapshot controller; VolSync was rejected, see
# apps/immich/resources/backup-files.yaml), an extra image just for sqlite3.
# docs/backups.md.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-backup
  namespace: monitoring
spec:
  # 05:50, after the other nightly jobs (docs/backups.md, Schedule).
  schedule: "50 5 * * *"
  # Runs for real (ci/active-cronjobs.txt): the s3-backup Secret in
  # `monitoring` holds the real credentials.
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana-backup
        spec:
          restartPolicy: OnFailure
          # `kube-prometheus-stack-grafana` is ReadWriteOnce, so this pod MUST
          # land on the node already running Grafana or the volume will not
          # attach. Without this the job fails intermittently depending on
          # scheduling, which is the most confusing possible failure mode.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: grafana
                      app.kubernetes.io/instance: kube-prometheus-stack
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            # 472 is Grafana's uid, and the chart's fsGroup. The volume's files
            # are owned by it; any other uid reads nothing and the job fails
            # with a permission error that looks like a restic problem.
            runAsUser: 472
            runAsGroup: 472
            fsGroup: 472
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  # `init` is idempotent-by-failure: it errors if the repo
                  # already exists, which is the normal case after run one.
                  restic init 2>/dev/null || true
                  # Stale locks only: a live lock is refreshed and stays (docs/backups.md#locks).
                  restic unlock

                  # TWO SEPARATE SNAPSHOTS, with different tags, so a restore
                  # knows what it is getting rather than having to guess.
                  #
                  # 1. `grafana-config` -- provisioning directories and plugins.
                  #    Plain files, not written while Grafana serves requests,
                  #    so this copy is CONSISTENT.
                  #
                  # 2. `grafana-db-besteffort` -- the live SQLite. Possibly
                  #    torn. The tag says so, and it says so in the snapshot
                  #    listing, which is where someone will be reading it at
                  #    3am during a restore.
                  #
                  # Splitting them matters: a single snapshot containing both
                  # would inherit the weaker guarantee for all of it.
                  restic backup --retry-lock 30m /data \
                    --tag grafana-config \
                    --host grafana \
                    --exclude '/data/grafana.db' \
                    --exclude '/data/grafana.db-wal' \
                    --exclude '/data/grafana.db-shm' \
                    --exclude '/data/png' \
                    --exclude '/data/csv' \
                    --exclude '/data/pdf' \
                    --verbose

                  # The `-wal` and `-shm` files are included here deliberately.
                  # If they exist, SQLite needs them to recover the database to
                  # a consistent state on open -- taking the .db alone would
                  # discard committed transactions. It still does not make the
                  # set atomic (three files copied in sequence), which is
                  # exactly why the tag says best-effort.
                  # Build the file list from what EXISTS rather than passing all
                  # three and swallowing the error.
                  #
                  # The previous version ended with
                  #   || echo "NOTE: -wal/-shm absent (normal ...)"
                  # which made the job report success for ANY failure of this
                  # command -- a full cache volume, an expired credential, a
                  # corrupt repository -- while printing a reassuring message
                  # about journal modes. An absent -wal is normal; a failed
                  # upload is not, and the two must not share an exit path.
                  DB_FILES=""
                  for f in /data/grafana.db /data/grafana.db-wal /data/grafana.db-shm; do
                    [ -f "$f" ] && DB_FILES="$DB_FILES $f"
                  done

                  if [ -z "$DB_FILES" ]; then
                    echo "FAIL: /data/grafana.db does not exist. Grafana has never"
                    echo "      started, or the volume is not mounted where expected."
                    exit 1
                  fi

                  echo "database snapshot covers:$DB_FILES"
                  # Unquoted on purpose: word-splitting is how the list becomes
                  # separate arguments. The paths are literals above, so there is
                  # nothing to split badly.
                  restic backup --retry-lock 30m $DB_FILES \
                    --tag grafana-db-besteffort \
                    --host grafana \
                    --verbose

                  restic unlock
                  restic forget --retry-lock 30m \
                    --host grafana \
                    --keep-daily 7 --keep-weekly 4 --keep-monthly 6 \
                    --prune

                  restic check --retry-lock 30m --with-cache
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/ned-si-homelab-backups/grafana/data
                - name: RESTIC_CACHE_DIR
                  value: /cache
                # restic writes temp pack files here while uploading. Without this it uses
                # /tmp, which does not exist writable under readOnlyRootFilesystem, and
                # `restic backup` fails the moment it has a pack to flush. /cache is
                # already mounted and writable.
                - name: TMPDIR
                  value: /cache
              envFrom:
                # Needs the `s3-backup` Secret in the `monitoring` namespace.
                # See platform/secrets/s3-backup.sops.yaml.example.
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: kube-prometheus-stack-grafana
                readOnly: true
            # emptyDir, not a PVC: the repository is a few tens of MB, so a
            # cold cache costs seconds. sizeLimit protects the node's eMMC.
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
