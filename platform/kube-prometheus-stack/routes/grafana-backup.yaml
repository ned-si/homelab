# Grafana's state, to S3 with restic.
#
# ###########################################################################
# # READ THIS BEFORE TRUSTING IT: THIS IS A BEST-EFFORT COPY OF A LIVE SQLITE
# # DATABASE, AND IT IS LABELLED AS SUCH ON PURPOSE.
# #
# # /var/lib/grafana/grafana.db is open and being written by Grafana while this
# # runs. A file-level copy of a live SQLite database can capture a torn write,
# # and restic has no way to know it did. There is no sqlite3 binary and no
# # Python in the restic image, so `sqlite3 .backup` (the trick
# # apps/paperless/backup.yaml uses) and `sqlite3.Connection.backup()` (the one
# # scripts/dump-databases.sh uses) are both unavailable here.
# #
# # It is shipped anyway, clearly marked, because the alternative is nothing --
# # and because of the mitigation below, the exposure is genuinely small.
# ###########################################################################
#
# WHY THE EXPOSURE IS SMALL: ALMOST NOTHING IMPORTANT LIVES IN grafana.db
#
#   dashboards   provisioned from ConfigMaps by the sidecar
#                (`sidecar.dashboards.enabled: true`, label grafana_dashboard).
#                CloudNativePG and Cilium ship theirs that way. Those are in
#                git, or generated by a chart, and are recreated on a fresh
#                install with no restore.
#   datasources  provisioned (`sidecar.datasources.enabled: true`).
#   users/auth   Keycloak, via generic OAuth. Grafana holds no password worth
#                keeping -- the local admin account is unused.
#
# What grafana.db actually holds that is not reproducible: dashboards created by
# hand in the UI, starred dashboards, per-user preferences, annotations, and
# any alert rules defined in Grafana rather than as PrometheusRules.
#
# So the honest summary is: losing this volume costs an evening of re-starring
# dashboards, not data. That is why it gets a best-effort copy rather than the
# machinery a real database deserves.
#
# ---------------------------------------------------------------------------
# THREE APPROACHES CONSIDERED AND REJECTED, because each looks better than it is
#
#   QUIESCE (scale the Deployment to 0, back up, scale back).
#     This is the obvious answer and it CANNOT WORK ON THIS CLUSTER. Every
#     Application in clusters/ runs with `selfHeal: true`, so Argo CD reverts
#     `replicas: 0` back to the chart's value within seconds -- restarting
#     Grafana in the middle of the backup and, worse, contending for a
#     ReadWriteOnce volume that the backup pod now holds. Quiescing anything
#     Argo manages requires suspending the Application first, which a CronJob
#     has no business doing. This applies equally to Plex, Jellyfin, Seafile and
#     Syncthing and is why none of their backup jobs quiesce either.
#
#   SNAPSHOT FIRST (VolumeSnapshot -> temporary PVC -> restic).
#     Correct, and the CSI machinery exists (infrastructure/snapshot-controller/,
#     VolumeSnapshotClass `iscsi`). But a pod's volumes are fixed at creation, so
#     a single Job cannot create a snapshot and then mount it. Doing it properly
#     needs an orchestrator that creates a snapshot, waits for readyToUse,
#     creates a PVC from it, creates a SECOND Job, waits for that, and cleans up
#     both -- with RBAC for all of it, and a freshness check so a failed snapshot
#     step does not silently make the next run back up yesterday's data. That is
#     a bespoke controller. VolSync is the off-the-shelf version of exactly this
#     and was deliberately rejected for the whole repo
#     (apps/immich/resources/backup-files.yaml). Introducing a hand-rolled
#     version for the least valuable volume in the cluster is the wrong place to
#     start; it is the right thing to build the day Plex's watch history matters.
#
#   AN IMAGE WITH sqlite3.
#     Would solve it in one line. It also means adding an image whose only
#     purpose is to carry a 700KB binary, pinned and Renovate-tracked, from a
#     publisher this repo does not otherwise depend on. Not worth it for
#     starred dashboards.
#
# See docs/backups.md. If this volume ever holds something that matters, the
# upgrade path is VolSync, not a cleverer CronJob.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-backup
  namespace: monitoring
spec:
  # 04:20. After the *arr configs (04:00-04:30 in apps/theater/backup.yaml) but
  # the volume is tiny, so overlap costs nothing.
  schedule: "20 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana-backup
        spec:
          restartPolicy: OnFailure
          # `kube-prometheus-stack-grafana` is ReadWriteOnce, so this pod MUST
          # land on the node already running Grafana or the volume will not
          # attach. Without this the job fails intermittently depending on
          # scheduling, which is the most confusing possible failure mode.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: grafana
                      app.kubernetes.io/instance: kube-prometheus-stack
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            # 472 is Grafana's uid, and the chart's fsGroup. The volume's files
            # are owned by it; any other uid reads nothing and the job fails
            # with a permission error that looks like a restic problem.
            runAsUser: 472
            runAsGroup: 472
            fsGroup: 472
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # renovate: datasource=docker depName=restic/restic
              image: restic/restic:0.19.0
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  # `init` is idempotent-by-failure: it errors if the repo
                  # already exists, which is the normal case after run one.
                  restic init 2>/dev/null || true

                  # TWO SEPARATE SNAPSHOTS, with different tags, so a restore
                  # knows what it is getting rather than having to guess.
                  #
                  # 1. `grafana-config` -- provisioning directories and plugins.
                  #    Plain files, not written while Grafana serves requests,
                  #    so this copy is CONSISTENT.
                  #
                  # 2. `grafana-db-besteffort` -- the live SQLite. Possibly
                  #    torn. The tag says so, and it says so in the snapshot
                  #    listing, which is where someone will be reading it at
                  #    3am during a restore.
                  #
                  # Splitting them matters: a single snapshot containing both
                  # would inherit the weaker guarantee for all of it.
                  restic backup /data \
                    --tag grafana-config \
                    --host grafana \
                    --exclude '/data/grafana.db' \
                    --exclude '/data/grafana.db-wal' \
                    --exclude '/data/grafana.db-shm' \
                    --exclude '/data/png' \
                    --exclude '/data/csv' \
                    --exclude '/data/pdf' \
                    --verbose

                  # The `-wal` and `-shm` files are included here deliberately.
                  # If they exist, SQLite needs them to recover the database to
                  # a consistent state on open -- taking the .db alone would
                  # discard committed transactions. It still does not make the
                  # set atomic (three files copied in sequence), which is
                  # exactly why the tag says best-effort.
                  # Build the file list from what EXISTS rather than passing all
                  # three and swallowing the error.
                  #
                  # The previous version ended with
                  #   || echo "NOTE: -wal/-shm absent (normal ...)"
                  # which made the job report success for ANY failure of this
                  # command -- a full cache volume, an expired credential, a
                  # corrupt repository -- while printing a reassuring message
                  # about journal modes. An absent -wal is normal; a failed
                  # upload is not, and the two must not share an exit path.
                  DB_FILES=""
                  for f in /data/grafana.db /data/grafana.db-wal /data/grafana.db-shm; do
                    [ -f "$f" ] && DB_FILES="$DB_FILES $f"
                  done

                  if [ -z "$DB_FILES" ]; then
                    echo "FAIL: /data/grafana.db does not exist. Grafana has never"
                    echo "      started, or the volume is not mounted where expected."
                    exit 1
                  fi

                  echo "database snapshot covers:$DB_FILES"
                  # Unquoted on purpose: word-splitting is how the list becomes
                  # separate arguments. The paths are literals above, so there is
                  # nothing to split badly.
                  restic backup $DB_FILES \
                    --tag grafana-db-besteffort \
                    --host grafana \
                    --verbose

                  restic forget \
                    --host grafana \
                    --keep-daily 7 --keep-weekly 4 --keep-monthly 6 \
                    --prune

                  restic check --with-cache
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-1.amazonaws.com/homelab-backups-REPLACE-ME/grafana/data
                - name: RESTIC_CACHE_DIR
                  value: /cache
                # restic writes temp pack files here while uploading. Without this it uses
                # /tmp, which does not exist writable under readOnlyRootFilesystem, and
                # `restic backup` fails the moment it has a pack to flush. /cache is
                # already mounted and writable.
                - name: TMPDIR
                  value: /cache
              envFrom:
                # Needs the `s3-backup` Secret in the `monitoring` namespace.
                # See platform/secrets/s3-backup.sops.yaml.example.
                - secretRef:
                    name: s3-backup
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: cache
                  mountPath: /cache
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: kube-prometheus-stack-grafana
                readOnly: true
            # emptyDir, NOT a PVC.
            #
            # apps/immich/resources/backup-files.yaml uses a dedicated 20Gi PVC
            # for its cache, and that is right there: a 2TB repository's index
            # is slow enough to re-download that the job would miss its
            # deadline. This repository is a few tens of megabytes, so a cold
            # cache costs seconds and a PVC would be a zvol per backup job for
            # no gain.
            #
            # sizeLimit is not decoration: emptyDir lives on the node's
            # ephemeral storage, and these nodes boot from a 29GB eMMC that was
            # already at 83% (docs/migration-plan.md). An unbounded cache on a
            # node that also runs kubelet and containerd is a way to break the
            # node rather than the backup.
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
