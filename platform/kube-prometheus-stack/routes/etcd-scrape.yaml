# etcd on the control planes, HTTP on 2381 (Talos service). Static targets:
# Argo CD does not sync Endpoints. Job `kube-etcd` matches the chart's rules.
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: kube-etcd
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobName: kube-etcd
  scheme: HTTP
  metricsPath: /metrics
  staticConfigs:
    - targets: ["192.168.1.247:2381"]
      labels:
        node: homelab-cp-1
    - targets: ["192.168.1.238:2381"]
      labels:
        node: homelab-cp-2
    - targets: ["192.168.1.239:2381"]
      labels:
        node: homelab-cp-3
