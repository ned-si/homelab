# Kyverno: stale PolicyReports make the Security dashboard's counts stale.
# PodSecurityEnforceDenied (spec pod-security-restricted, D15): the API
# server's counter has no namespace; a retrying controller passes 5 in
# minutes, a single dry run does not. KyvernoDenied (spec per-app-hardening,
# requirement 7): the same for a Kyverno policy in Deny; `name` is the
# webhook, vpol.validate.kyverno.svc-ignore-finegrained-<policy>, and no
# namespace label, so a namespace silence does not mute it.
# Tests: tests/prometheus/kyverno_test.yaml.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-kyverno
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab.kyverno
      rules:
        - alert: KyvernoReportsStale
          expr: |
            sum(increase(kyverno_controller_reconcile_total{controller_name="background-scan-controller"}[3h])) == 0
            or
            absent(kyverno_controller_reconcile_total{controller_name="background-scan-controller"})
          for: 15m
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/KyvernoReportsStale.md
            summary: Kyverno has not run a background scan for 3 hours
            description: >-
              The PolicyReports, the Security dashboard counts and the
              Deny-readiness they show are stale. Check the
              kyverno-reports-controller pod.
        - alert: PodSecurityEnforceDenied
          expr: |
            sum(increase(pod_security_evaluations_total{decision="deny",mode="enforce",resource="pod"}[30m])) > 5
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/PodSecurityEnforceDenied.md
            summary: Pod Security admission rejected {{ $value | printf "%.0f" }} Pods in 30 minutes
            description: >-
              A controller or an operator keeps creating Pods that a
              namespace's enforce level rejects. Find the namespace from the
              FailedCreate events, then run the Pod Security break-glass.
        - alert: KyvernoDenied
          expr: |
            sum by (name) (increase(apiserver_admission_webhook_rejection_count{name=~"vpol\\.validate\\.kyverno\\.svc.*",error_type="no_error"}[30m])) > 5
          labels:
            severity: critical
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/KyvernoDenied.md
            summary: Kyverno policy {{ $labels.name }} rejected {{ $value | printf "%.0f" }} requests in 30 minutes
            description: >-
              A controller or an operator keeps creating objects that a
              Kyverno policy in Deny rejects. Find the object from the
              FailedCreate events, then run the Kyverno break-glass.
