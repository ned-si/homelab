# Grafana, exposed through the shared Gateway.
#
# This is the canonical HTTPRoute shape used everywhere in this repo:
#
#   parentRefs   always the `shared` Gateway in the `gateway` namespace, and
#                always `sectionName: https`. Omitting sectionName attaches the
#                route to BOTH listeners, which means it would also answer on
#                port 80 and bypass the HTTPS redirect.
#
#   hostnames    one hostname, matching the wildcard certificate. external-dns
#                creates the Cloudflare record from this, with the address taken
#                from the Gateway's target annotation.
#
#   backendRefs  a Service in this route's own namespace. Cross-namespace
#                backends would need a ReferenceGrant; nothing here does that.
#
# Attaching a route from another namespace is permitted because the Gateway's
# https listener sets `allowedRoutes.namespaces.from: All`.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  # group/kind/weight and the catch-all match are the API server's defaults,
  # spelled out so that Argo CD's diff sees no drift.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - grafana.lilalala.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kube-prometheus-stack-grafana
          port: 80
          weight: 1
      timeouts:
        request: 0s
