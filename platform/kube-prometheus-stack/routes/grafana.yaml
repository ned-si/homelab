# Grafana through the shared Gateway. The repo's HTTPRoute shape: the `shared`
# Gateway with `sectionName: https` (without it the route also answers on port
# 80 and skips the redirect), one hostname under the wildcard certificate, and
# a backend in the route's own namespace (no ReferenceGrant).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  # group/kind/weight and the catch-all match are the API server's defaults,
  # spelled out so that Argo CD's diff sees no drift.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - grafana.lilalala.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), payment=(), usb=()"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: Content-Security-Policy
                value: "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
      backendRefs:
        - group: ""
          kind: Service
          name: kube-prometheus-stack-grafana
          port: 80
          weight: 1
      timeouts:
        request: 0s
