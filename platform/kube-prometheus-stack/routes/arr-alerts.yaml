# Prowlarr indexers that need a person (expired login, locked account, dead
# site), from the exportarr sidecar (apps/theater/metrics.yaml). Prowlarr's
# backoff keeps short tracker outages under the 6-hour check, which counts
# enabled indexers only. Indexer names are in the message, not a label, so a
# list change does not notify again. Tests: tests/prometheus/arr_test.yaml.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-arr
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab.arr
      rules:
        - alert: ArrIndexersFailing
          expr: |
            max by (namespace, source) (
              prowlarr_system_health_issues{source=~"IndexerLongTermStatusCheck|IndexerNoDefinitionCheck"}
            ) == 1
          for: 1h
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/ArrIndexersFailing.md
            summary: "Prowlarr: indexers need attention ({{ $labels.source }})"
            description: >-
              Prowlarr reports indexers that have failed for more than 6 hours
              or have no definition any more: usually an expired login or
              cookie, or a site that is gone. Prowlarr -> System -> Status
              names them; update the credentials or disable the indexer, and
              remove one that has no definition (docs/theater.md "Indexers").
