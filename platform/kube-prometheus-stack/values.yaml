# kube-prometheus-stack values. The Grafana OIDC client secret comes from the
# SOPS Secret `grafana-oidc` through GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET, not
# from grafana.ini (rendered into a ConfigMap).
#
# Talos: no kube-proxy, so no kube-proxy ServiceMonitor. The controller-manager
# and scheduler bind 0.0.0.0 (talos/talconfig.yaml). etcd is a Talos service
# and Argo CD does not sync Endpoints, so routes/etcd-scrape.yaml scrapes it;
# `kubeEtcd` stays on for the chart's etcd rules.
kubeProxy:
  enabled: false

# These nine histograms (about 82k series) feed no rule, alert or dashboard.
# Dropped at scrape time so the 30-day retention fits.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      # The chart default (setting the list replaces it): drop the noisy
      # buckets of the request and etcd duration histograms.
      - action: drop
        regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
        sourceLabels: [__name__, le]
      - sourceLabels: [__name__]
        regex: (apiserver_watch_events_dispatch_duration_seconds|apiserver_watch_list_duration_seconds|apiserver_storage_list_duration_seconds|apiserver_request_body_size_bytes|apiserver_watch_cache_read_wait_seconds|apiserver_response_sizes|apiserver_watch_cache_initialization_duration_seconds|apiserver_watch_events_sizes|etcd_request_duration_seconds)_bucket
        action: drop

# The admission webhook certificate from cert-manager, not the chart's
# certgen hook Jobs: under Argo CD the hook ServiceAccount is deleted after
# PreSync and the PostSync Job never gets a pod.
prometheusOperator:
  # Operator v0.95.1 (chart v93) was published for amd64 only, and all nodes
  # are arm64: the pod sat in ImagePullBackOff. Pinned to the last multi-arch
  # release, the reloader too (the operator injects it into Prometheus and
  # Alertmanager). Drop both pins once v0.95.x ships arm64 images.
  image:
    tag: v0.94.2
  prometheusConfigReloader:
    image:
      tag: v0.94.2
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  admissionWebhooks:
    certManager:
      enabled: true

# eMMC wear: Talos exposes life_time and pre_eol_info only in sysfs, so a
# sidecar reads them from /host/sys every 5 minutes for the textfile collector
# (docs/observability.md). extraArgs replaces the chart's list, so its two
# filesystem filters are repeated.
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    - --collector.textfile.directory=/run/textfile
  sidecarVolumeMount:
    - name: textfile
      mountPath: /run/textfile
      readOnly: false
  sidecars:
    - name: emmc-wear
      # renovate: datasource=docker depName=busybox
      image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
      command: ["/bin/sh", "-c"]
      args:
        - |
          trap 'exit 0' TERM
          out=/run/textfile/emmc.prom
          while true; do
            tmp=$out.tmp
            : > "$tmp"
            for d in /host/sys/bus/mmc/devices/*; do
              [ -r "$d/life_time" ] || continue
              dev=${d##*/}
              set -- $(cat "$d/life_time")
              printf 'node_emmc_life_time_estimate{device="%s",type="a"} %d\n' "$dev" "$1" >> "$tmp"
              printf 'node_emmc_life_time_estimate{device="%s",type="b"} %d\n' "$dev" "$2" >> "$tmp"
              printf 'node_emmc_pre_eol_info{device="%s"} %d\n' "$dev" "$(cat "$d/pre_eol_info")" >> "$tmp"
            done
            if [ -s "$tmp" ]; then
              mv "$tmp" "$out"
            else
              echo 'level=error msg="no eMMC life_time in /host/sys/bus/mmc/devices"'
            fi
            sleep 300 &
            wait $!
          done
      volumeMounts:
        - name: sys
          mountPath: /host/sys
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 1m
          memory: 4Mi
        limits:
          memory: 16Mi
      # Healthy while the file is less than 15 minutes old.
      livenessProbe:
        exec:
          command: ["/bin/sh", "-c", "find /run/textfile/emmc.prom -mmin -15 | grep -q ."]
        initialDelaySeconds: 60
        periodSeconds: 300

# The TSDB claim is pre-created in infrastructure/iscsi-volumes/; the template
# below must keep its name and size.
# Kyverno PolicyReport summaries as metrics (spec wave3-runtime-security, 2.3).
# The report name keeps the series apart (Kyverno writes one report per
# resource); Kyverno's own per-result counter overflows its cardinality limit.
kube-state-metrics:
  rbac:
    extraRules:
      - apiGroups: [wgpolicyk8s.io]
        resources: [policyreports, clusterpolicyreports]
        verbs: [list, watch]
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind: {group: wgpolicyk8s.io, version: v1alpha2, kind: PolicyReport}
            metricNamePrefix: kyverno_policyreport
            labelsFromPath:
              namespace: [metadata, namespace]
              report: [metadata, name]
            metrics:
              - name: summary
                help: Results of one Kyverno PolicyReport, by result
                each:
                  type: Gauge
                  gauge:
                    path: [summary]
                    labelFromKey: result
          - groupVersionKind: {group: wgpolicyk8s.io, version: v1alpha2, kind: ClusterPolicyReport}
            metricNamePrefix: kyverno_clusterpolicyreport
            labelsFromPath:
              report: [metadata, name]
            metrics:
              - name: summary
                help: Results of one Kyverno ClusterPolicyReport, by result
                each:
                  type: Gauge
                  gauge:
                    path: [summary]
                    labelFromKey: result

prometheus:
  prometheusSpec:
    # 30 days for the SLO windows and the 30-day restic-data check.
    # retentionSize caps blocks, WAL and head chunks at 34GiB (85% of the
    # volume), leaving room for compactions. Watch
    # prometheus_tsdb_lowest_timestamp_seconds: it must stay 30 days old.
    # Grow the volume through the claim in
    # infrastructure/iscsi-volumes/monitoring-prometheus-db.yaml.
    retention: 30d
    retentionSize: 34GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - "ReadWriteOnce"
          resources:
            requests:
              storage: 40Gi
    resources:
      requests:
        cpu: 220m
        memory: 4928Mi
      limits:
        memory: 11136Mi

grafana:
  defaultDashboardsTimezone: browser
  assertNoLeakedSecrets: false
  envFromSecret: grafana-oidc
  # The built-in admin (docs/runbooks/grafana-break-glass.md) from the SOPS
  # Secret `grafana-admin`. Without it the chart renders a new random Secret
  # on every Argo CD render and Grafana restarts on every sync.
  admin:
    existingSecret: grafana-admin
  grafana.ini:
    server:
      domain: grafana.lilalala.com
      root_url: https://%(domain)s/
    # A platform tool: the session ends after 12 hours without use and 24
    # hours at most, and Keycloak asks for the password again once the last
    # login is 12 hours old (docs/architecture.md "Sessions").
    auth:
      login_maximum_inactive_lifetime_duration: 12h
      login_maximum_lifetime_duration: 24h
    auth.generic_oauth:
      enabled: true
      name: Keycloak-OAuth
      allow_sign_up: true
      client_id: grafana-oauth
      # client_secret: from GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET (see above)
      scopes: openid email profile roles
      email_attribute_path: email
      login_attribute_path: username
      name_attribute_path: full_name
      auth_url: https://auth.lilalala.com/realms/homelab/protocol/openid-connect/auth
      token_url: https://auth.lilalala.com/realms/homelab/protocol/openid-connect/token
      api_url: https://auth.lilalala.com/realms/homelab/protocol/openid-connect/userinfo
      # Keycloak group `admins` -> org role Admin. The `groups` claim comes
      # from the realm's `groups` client scope (a default scope of
      # `grafana-oauth`), in the ID token and userinfo. Keycloak sends no
      # top-level `roles` claim.
      role_attribute_path: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
  # No Ingress: grafana.lilalala.com is served by the shared Gateway
  # (routes/grafana.yaml). ingress-nginx is removed (ADR 0011).
  ingress:
    enabled: false
  # grafana.db on a volume, for what is not provisioned: the `agent-readonly`
  # service account and token, annotations, stars. ReadWriteOnce, so
  # maxSurge 0; not `type: Recreate`, which the live Deployment's defaulted
  # rollingUpdate block refuses.
  persistence:
    enabled: true
    type: pvc
    storageClassName: iscsi-retain
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    annotations:
      argocd.argoproj.io/sync-options: Delete=false,Prune=false
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  # fsGroup 472 (the chart default) already gives Grafana the new volume; the
  # chown init container would run as root.
  initChownData:
    enabled: false

# Alertmanager routes: the paging policy of docs/sre.md "Paging". Every homelab
# rule carries `action: human` (page) or `action: auto` (INFO, Grafana only);
# CI fails a rule without it.
#
#   Watchdog          -> the healthchecks.io heartbeat (key `heartbeat-url`)
#   action=human      -> ntfy, one group per alert name
#   chart rules       -> ntfy, by name: etcd quorum, tuppr, failed backup Job
#   security critical -> ntfy
#   anything else     -> "null"
#
# Quiet hours 23:00-08:00 Europe/Zurich on every ntfy route (a child route
# does not inherit mute_time_intervals): a group still firing at 08:00
# notifies at its next flush. The heartbeat and the guard topic
# (`ntfy-guard-url`, read by scripts/ci/auto-rollback-guard.sh) are never
# muted.
#
# Inhibition hides the cause alerts of an incident that already notifies.
# URLs are read from the mounted Secret with `url_file`, so none is in git.
# ntfy templates the title, message and priority (`X-Template: yes`); the
# message ends with the runbook_url.
#
# Helm merges `config` into the chart default: `route` keys merge; `routes`,
# `receivers` and `inhibit_rules` are replaced. The first two inhibit rules
# are the chart's. Tests: scripts/ci/alertmanager-test.sh.
alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-notify
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  config:
    route:
      receiver: "null"
      group_by: [namespace, app]
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 24h
      routes:
        - receiver: heartbeat
          matchers:
            - alertname = "Watchdog"
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 5m
        # The outage guard's copy, never muted. Both are `action: auto`, so
        # nothing below matches them.
        - receiver: ntfy-guard
          matchers:
            - alertname =~ "HomelabNodeNotReady|HomelabNASUnreachable"
          group_by: [alertname]
          repeat_interval: 4h
        # Every public hostname down at once: pages through quiet hours.
        # A separate receiver (same topic), so every `ntfy` route still mutes
        # quiet-hours (scripts/ci/alertmanager-test.sh). Postmortem 2026-10-23.
        - receiver: ntfy-urgent
          matchers:
            - alertname = "GatewayDown"
          group_by: [alertname]
          repeat_interval: 1h
        # PAGE: every homelab rule labelled `action: human`.
        - receiver: ntfy
          matchers:
            - action = "human"
          group_by: [alertname]
          mute_time_intervals: [quiet-hours]
          routes:
            - matchers:
                - alertname = "SLOErrorBudgetBurnFastPersistent"
              group_by: [alertname, namespace, app]
              repeat_interval: 4h
              mute_time_intervals: [quiet-hours]
            - matchers:
                - alertname =~ "SLOErrorBudgetBurnSlowPersistent|SLOLatencyBudgetBurnSlowPersistent"
              group_by: [alertname, namespace, app]
              mute_time_intervals: [quiet-hours]
            - matchers:
                - alertname =~ "Backup.*|CNPG.*"
              group_wait: 5m
              mute_time_intervals: [quiet-hours]
            - matchers:
                - severity = "critical"
              repeat_interval: 4h
              mute_time_intervals: [quiet-hours]
        # PAGE: chart rules that carry no `action` label (etcd from
        # kube-prometheus-stack, the tuppr chart's upgrade alerts).
        - receiver: ntfy
          matchers:
            - alertname =~ "etcdInsufficientMembers|etcdNoLeader"
          group_by: [alertname]
          repeat_interval: 4h
          mute_time_intervals: [quiet-hours]
        - receiver: ntfy
          matchers:
            - alertname =~ "(Talos|Kubernetes)Upgrade(Failed|NodeFailed|Stuck)|TupprOperatorAbsent"
          group_by: [alertname]
          repeat_interval: 4h
          mute_time_intervals: [quiet-hours]
        # PAGE: a failed backup or dump Job (the restic CronJobs are
        # *-backup*; the chart's KubeJobFailed). The restore tests report
        # through BackupVerifyFailed instead.
        - receiver: ntfy
          matchers:
            - alertname = "KubeJobFailed"
            - job_name =~ ".+-backup-.+"
            - namespace != "backup-verify"
          group_by: [alertname]
          group_wait: 5m
          mute_time_intervals: [quiet-hours]
        # PAGE: critical security findings.
        - receiver: ntfy
          matchers:
            - category = "security"
            - severity = "critical"
          group_by: [alertname]
          repeat_interval: 4h
          mute_time_intervals: [quiet-hours]
    # 23:00-08:00 local time; a range cannot cross midnight, so two ranges.
    time_intervals:
      - name: quiet-hours
        time_intervals:
          - times:
              - start_time: "23:00"
                end_time: "24:00"
              - start_time: "00:00"
                end_time: "08:00"
            location: Europe/Zurich
    inhibit_rules:
      # The whole Gateway down: one page, GatewayDown, not one per app.
      - source_matchers:
          - alertname = "GatewayDown"
        target_matchers:
          - alertname =~ "SLO(ErrorBudget|LatencyBudget)Burn.*"
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity =~ "warning|info"
        equal: [namespace, alertname]
      - source_matchers:
          - severity = "warning"
        target_matchers:
          - severity = "info"
        equal: [namespace, alertname]
      # The pod, workload and Argo CD alerts. A fast burn also hides their
      # pages: SLOErrorBudgetBurnFastPersistent covers the app. A missing
      # backend hides only the `action: auto` ones, so an app without an SLO
      # still pages.
      - source_matchers:
          - alertname = "SLOErrorBudgetBurnFast"
        target_matchers:
          - alertname =~ "(Kube(Pod|ContainerWaiting|Deployment|StatefulSet|PdbNotEnoughHealthyPods|JobFailed)|Pod|ArgoCD).*"
        equal: [namespace]
      - source_matchers:
          - alertname =~ "ServiceHasNoReadyBackend|StatefulSetHasNoReadyReplica"
        target_matchers:
          - alertname =~ "(Kube(Pod|ContainerWaiting|Deployment|StatefulSet|PdbNotEnoughHealthyPods|JobFailed)|Pod|ArgoCD).*"
          - action != "human"
        equal: [namespace]
      - source_matchers:
          - alertname = "SLOErrorBudgetBurnFast"
        target_matchers:
          - alertname =~ "ServiceHasNoReadyBackend|StatefulSetHasNoReadyReplica"
        equal: [namespace]
      # The worse alert of the same object hides the milder one.
      - source_matchers:
          - alertname = "CertificateExpiringVerySoon"
        target_matchers:
          - alertname =~ "CertificateExpiringSoon|CertificateNotReady"
        equal: [namespace, name]
      - source_matchers:
          - alertname = "CertificateExpiringSoon"
        target_matchers:
          - alertname = "CertificateNotReady"
        equal: [namespace, name]
      - source_matchers:
          - alertname = "PersistentVolumeCriticallyFull"
        target_matchers:
          - alertname =~ "PersistentVolumeNearlyFull|PersistentVolumeFillingUp"
        equal: [namespace, persistentvolumeclaim]
      - source_matchers:
          - alertname = "NodeFilesystemCriticallyFull"
        target_matchers:
          - alertname = "NodeFilesystemNearlyFull"
        equal: [instance, mountpoint]
      - source_matchers:
          - alertname = "NASPoolCriticallyFull"
        target_matchers:
          - alertname =~ "NASPoolNearlyFull|NASPoolFillingUp"
        equal: [pool]
      - source_matchers:
          - alertname = "NodeEmmcEndOfLife"
        target_matchers:
          - alertname = "NodeEmmcWearHigh"
        equal: [instance, device]
      - source_matchers:
          - alertname = "HomelabNodeNotReady"
        target_matchers:
          - alertname =~ "KubeNode.*|KubePod.*|Pod.*"
        equal: [node]
      - source_matchers:
          - alertname = "HomelabNASUnreachable"
        target_matchers:
          - alertname =~ "(Kube(Pod|ContainerWaiting|Deployment|StatefulSet|PdbNotEnoughHealthyPods|JobFailed)|Pod|ArgoCD).*"
      - source_matchers:
          - alertname = "HomelabNASUnreachable"
        target_matchers:
          - alertname =~ "(SLOErrorBudgetBurn|(ServiceHas|StatefulSetHas)NoReady|KubePersistentVolumeErrors|CNPG|Backup|NASExporter).*"
    receivers:
      - name: "null"
      - name: heartbeat
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-notify/heartbeat-url
            send_resolved: false
      - name: ntfy-urgent
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-notify/ntfy-url
            send_resolved: true
            timeout: 10s
      - name: ntfy
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-notify/ntfy-url
            send_resolved: true
            # ntfy caps a message at 4 KiB; a batch beyond 5 alerts is cut.
            max_alerts: 5
            timeout: 10s
            http_config: &ntfy-http
              http_headers:
                X-Template:
                  values: ["yes"]
                X-Title:
                  values:
                    # Folded scalars: each line break becomes one space, so
                    # lines break only inside {{ }} or where a space belongs.
                    - >-
                      {{if eq .status "resolved"}}Resolved{{else if eq
                      .commonLabels.severity "critical"}}CRITICAL{{else}}Warning{{end}}:
                      {{.commonLabels.alertname}}{{if .commonLabels.namespace}}
                      ({{.commonLabels.namespace}}){{end}}
                X-Message:
                  values:
                    - >-
                      {{range .alerts}}{{if .annotations.summary}}{{.annotations.summary}}{{else
                      }}{{.labels.alertname}}{{end}}{{"\n"}}{{end}}{{if eq (len .alerts)
                      1}}{{with (index .alerts 0).annotations.description}}{{"\n"}}{{.}}{{end}}{{end}}{{with
                      .commonAnnotations.runbook_url}}{{"\n\n"}}{{.}}{{end}}
                X-Priority:
                  values:
                    - '{{if eq .status "resolved"}}2{{else if eq .commonLabels.severity "critical"}}5{{else}}4{{end}}'
      - name: ntfy-guard
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-notify/ntfy-guard-url
            send_resolved: true
            max_alerts: 5
            timeout: 10s
            http_config: *ntfy-http
