# kube-prometheus-stack.
#
# Scope note: this restores monitoring to a working state on Gateway API with no
# plaintext secrets. Retention, recording rules and real dashboards are a
# separate piece of work.
#
# ---------------------------------------------------------------------------
# WHERE THE ALERT RULES LIVE
#
#   platform/backup-verify/alerts.yaml            the backup pipeline
#   platform/kube-prometheus-stack/routes/alerts.yaml
#                                                 the cluster itself
#
# Both are plain PrometheusRule objects rather than `additionalPrometheusRulesMap`
# entries here. The chart's map nests the rules four levels deep inside Helm
# values, which makes a 200-line expression unreviewable in a diff; a standalone
# manifest reads like the thing it is. `ruleSelectorNilUsesHelmValues: false`
# below is what makes rules in any namespace get picked up.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Prometheus
# ---------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    # 30d of retention on a 15Gi volume with a 12GiB size cap. The size cap is
    # the one that actually binds: Prometheus deletes the oldest blocks when it
    # is reached, so retention is "30 days or 12GiB, whichever comes first".
    #
    # 3GiB of headroom is deliberate and is NOT slack. `retentionSize` bounds the
    # TSDB blocks only -- the WAL, the head chunks and any in-progress compaction
    # live on the same volume and are not counted. A compaction of a large block
    # can transiently need most of the size of that block again. With less
    # headroom than this, Prometheus fills its own volume during compaction and
    # stops ingesting, which takes the monitoring system down at the exact moment
    # it has the most data to look at.
    #
    # If this needs more room, grow the volume rather than the cap: `iscsi` has
    # allowVolumeExpansion: true. There is a PrometheusTsdbVolumeNearlyFull alert
    # in routes/alerts.yaml so the decision is not made by discovering an outage.
    retention: 30d
    retentionSize: 12GiB
    # Discover ServiceMonitors and PodMonitors from EVERY namespace, not only
    # those carrying the release label. Without these four flags the monitors
    # shipped by Cilium, cert-manager and CloudNativePG are silently ignored --
    # a classic "metrics enabled but no data" trap.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: iscsi
          resources:
            requests:
              storage: 15Gi
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi

# ---------------------------------------------------------------------------
# Alertmanager.
#
# ###########################################################################
# # THIS IS THE PART THAT MAKES THE OTHER 40 ALERT RULES MEAN ANYTHING.
# #
# # Alertmanager previously ran with no receivers at all: every rule in this
# # repo rendered to a web page nobody opens. A monitoring system that does not
# # reach the operator is not monitoring, it is decoration.
# ###########################################################################
#
# WHY PUSHOVER, AND WHAT WAS REJECTED
#
#   The deciding constraint is not the transport, it is that NOTHING
#   site-specific may end up in git. Alertmanager can read a receiver's
#   credentials from files (`*_file` keys), and Pushover is the only option here
#   where BOTH values -- the application token and the user key -- are
#   file-sourced. So the whole of this file stays reviewable in plaintext and the
#   owner's phone is not identified anywhere in the repository. It also has a
#   native receiver, so messages are templated and readable rather than raw JSON.
#
#   telegram  free, native receiver, but `chat_id` is an int64 with no
#             `chat_id_file`. Using it means committing an identifier that
#             locates the owner's chat. Switch to it by replacing the
#             pushover_configs block below with:
#                 telegram_configs:
#                   - bot_token_file: /etc/alertmanager/secrets/alertmanager-notify/pushover-token
#                     chat_id: <your numeric chat id>
#             A chat_id is an identifier, not a credential -- it is useless
#             without the bot token -- so this is a defensible trade, just not
#             the default.
#
#   ntfy      no server needed, but Alertmanager has no ntfy receiver. A
#             `webhook_config` would POST Alertmanager's own JSON envelope and
#             the phone would show a JSON blob. Making it readable needs a
#             bridge process, which is a server by another name.
#
#   gotify    needs a server, which is the thing being avoided: a self-hosted
#             notifier on the cluster it is meant to page about cannot report
#             that cluster being down.
#
#   smtp      needs a smarthost, a from-address and a to-address in git, and
#             email is a poor pager -- the failure mode is a notification the
#             owner sees the next morning.
#
# THE CREDENTIALS
#   `alertmanagerSpec.secrets` makes the operator mount the named Secret into
#   the Alertmanager pod at /etc/alertmanager/secrets/<name>/, one file per key.
#   Create it from platform/secrets/alertmanager-notify.sops.yaml.example.
#
#   Until that Secret exists the Alertmanager pod will NOT start (a missing
#   secret volume blocks the pod). So it is not optional and it is not
#   "notification config" -- it is a hard dependency of the monitoring stack.
#
# ---------------------------------------------------------------------------
# CURRENT STATE: SEALED WITH SENTINELS, NO TRANSPORT CHOSEN
#
#   `alertmanager-notify` exists and Alertmanager starts, but `pushover-token`
#   and `pushover-user-key` hold `PENDING-*` sentinels, because there is no
#   Pushover account. So today:
#
#     works  -- every alert rule evaluates; every firing alert is visible in the
#               Alertmanager UI and in Grafana; grouping, inhibition and
#               silencing all behave normally
#     fails  -- push delivery to the phone. Alertmanager's own
#               `AlertmanagerFailedToSendAlerts` rule (shipped by this chart)
#               fires, so the broken state is visible in the same UI rather than
#               being silent.
#
#   That is a worse position than working notifications and a much better one
#   than an Alertmanager that will not start. To finish it, pick a transport:
#
#     pushover  keep this config as-is. ~$5 one-off. Fill PUSHOVER_TOKEN and
#               PUSHOVER_USER_KEY in secrets.local.env, re-seal, done -- no edit
#               to this file at all.
#
#     telegram  free. @BotFather -> /newbot -> token; then message the bot and
#               read the chat id from
#               https://api.telegram.org/bot<token>/getUpdates. Put the token in
#               PUSHOVER_TOKEN (the key name is just a filename) and replace the
#               pushover_configs block below with the telegram_configs form
#               shown above. Costs one committed chat id.
#
#     discord   free if you already have a server. Server Settings -> Integrations
#               -> Webhooks -> copy URL, which is a bearer credential and so goes
#               in the Secret via `webhook_url_file`:
#                   discord_configs:
#                     - webhook_url_file: /etc/alertmanager/secrets/alertmanager-notify/pushover-token
#               Nothing site-specific in git, same as Pushover.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: iscsi
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
    # Mounted at /etc/alertmanager/secrets/alertmanager-notify/<key>.
    secrets:
      - alertmanager-notify

  config:
    global:
      # How long after the last firing evaluation an alert is declared resolved.
      # The default is 5m; alert rules here evaluate on the 30s global interval,
      # so 5m is ~10 missed evaluations. Long enough not to flap, short enough
      # that a resolved notification is still useful.
      resolve_timeout: 5m

    # -----------------------------------------------------------------------
    # ROUTING
    #
    # The shape of this tree is driven by one requirement: a cold start must not
    # produce 40 notifications. When the cluster boots, every rule that has no
    # data yet and every workload that is not up yet fires at once.
    #
    # Three mechanisms do that work, and they are not interchangeable:
    #
    #   group_by       collapses many alerts into ONE notification. Grouping by
    #                  (alertname, namespace) means "PVC nearly full" across six
    #                  namespaces is six notifications, but "pod not ready" for
    #                  nine pods in `theater` is one.
    #
    #   group_wait     how long to wait for MORE alerts to join a new group
    #                  before sending. 5m, not the default 30s: a cold start
    #                  takes minutes to settle, and 30s means one notification
    #                  per straggler.
    #
    #   repeat_interval  how long before nagging about something still firing.
    #                  12h. A single operator does not need to be told hourly
    #                  about a full disk he already knows about; he does need to
    #                  be told again tomorrow.
    #
    # Rejected: routing `severity: warning` to a different, quieter receiver.
    # With one operator and one phone there is no second destination, and a
    # warning that goes somewhere he does not look is the original problem again.
    # Warnings instead get a longer group_wait and a longer repeat_interval.
    # -----------------------------------------------------------------------
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 5m
      group_interval: 10m
      repeat_interval: 12h
      receiver: pushover
      routes:
        # ---------------------------------------------------------------
        # THE DEAD-MAN'S SWITCH. This is the most important route here.
        #
        # `Watchdog` is an alert the chart ships that is ALWAYS firing, by
        # design, and carries `severity: none`. Sending it to a heartbeat URL
        # turns "Prometheus, Alertmanager or the network died" -- the failure
        # that silences every other alert in this file -- into an inbound
        # notification from a third party.
        #
        # Without this, the failure mode of the whole monitoring stack is
        # silence, and silence is indistinguishable from health. That is
        # strictly worse than having no alerting at all, because it is
        # believed.
        #
        # `continue: false` (the default) stops here: Watchdog must never reach
        # the phone.
        #
        # repeat_interval must be comfortably SHORTER than the grace period
        # configured at the heartbeat provider, or a normal quiet period is
        # reported as an outage. 5m here pairs with a 15-20m grace.
        # ---------------------------------------------------------------
        # ---------------------------------------------------------------
        # CURRENTLY DISABLED -- receiver is `"null"`, not `heartbeat`.
        #
        # There is no heartbeat provider yet: `heartbeat-url` in the
        # alertmanager-notify Secret holds
        # `https://pending.invalid/no-heartbeat-provider-configured-yet`, a
        # deliberately unresolvable URL (see the PENDING block in
        # scripts/seal-secrets-from-env.sh).
        #
        # Pointing Watchdog at that URL would fail every 5 minutes forever, and
        # `AlertmanagerFailedToSendAlerts` would fire and stay firing from the
        # first hour. One permanently-red alert trains you to ignore the alert
        # list, which costs more than the missing dead-man's switch.
        #
        # TO ENABLE (about five minutes, free, no server):
        #   1. healthchecks.io -> new check -> Period 5m, GRACE 20m
        #      (the grace MUST exceed repeat_interval below, or a normal quiet
        #      period reads as an outage and you will mute it within a week)
        #   2. copy its Ping URL (https://hc-ping.com/<uuid>)
        #   3. HEARTBEAT_URL='<that url>' in secrets.local.env
        #   4. scripts/seal-secrets-from-env.sh --force
        #   5. change `receiver: "null"` back to `receiver: heartbeat` here
        #   6. point the provider's own notification at an address that does NOT
        #      depend on this cluster
        #
        # Steps 3-5 are the whole change; the `heartbeat` receiver below is
        # already defined and stays defined so this is a one-word edit.
        # ---------------------------------------------------------------
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
          group_wait: 0s
          group_interval: 5m
          repeat_interval: 5m

        # Alerts the chart fires that are noise on THIS cluster, dropped here
        # rather than by disabling whole rule groups -- disabling a group also
        # hides the rules in it that are useful.
        - matchers:
            - alertname = "InfoInhibitor"
          receiver: "null"

        # Critical: shorter group_wait, because these are the ones where five
        # minutes of batching is five minutes of a database not archiving WAL.
        - matchers:
            - severity = "critical"
          receiver: pushover
          group_wait: 1m
          repeat_interval: 4h

        # Warnings: batched harder. A warning is something to look at this week.
        - matchers:
            - severity = "warning"
          receiver: pushover
          group_wait: 10m
          repeat_interval: 24h

    # -----------------------------------------------------------------------
    # INHIBITION
    #
    # Suppression by CAUSE, which grouping cannot do. A node going down makes
    # every pod on it unready, every PVC on it unreachable and every Service
    # backed by it empty. Without these rules that single event is thirty
    # notifications, of which one is actionable.
    # -----------------------------------------------------------------------
    inhibit_rules:
      # A node being down explains everything else happening on that node.
      #
      # `equal: [node]` is what scopes it -- without that key this rule would
      # suppress alerts cluster-wide the moment ANY node went down, which is
      # the classic way an inhibit_rule turns into a silence.
      #
      # THE LIMIT OF THIS, STATED PLAINLY: Alertmanager can only match on labels
      # that are actually present. An alert with no `node` label is never
      # suppressed by this rule, because absent-vs-"cp-2" is not equal. That is
      # why the pod-level rules in routes/alerts.yaml deliberately join
      # `kube_pod_info` to carry `node` -- otherwise this rule would look
      # correct and do nothing.
      - source_matchers:
          - alertname = "KubeNodeNotReady"
        target_matchers:
          - severity =~ "warning|critical"
        equal: ["node"]

      # Same idea one level down: if the kubelet is unreachable, its pods'
      # readiness and its volumes' fullness are unknown, not broken.
      - source_matchers:
          - alertname = "KubeletDown"
        target_matchers:
          - severity =~ "warning|critical"
        equal: ["node"]

      # The standard severity rule, kept -- but READ THE LIMIT BEFORE TRUSTING
      # IT, because it is almost always misunderstood.
      #
      # `equal: [alertname, namespace]` means it only suppresses a warning whose
      # ALERTNAME IS IDENTICAL to the firing critical's. That works for the
      # chart's own rules, several of which template `severity` onto ONE
      # alertname at two thresholds (KubePersistentVolumeFillingUp is both
      # warning and critical). It does NOTHING for a warning/critical PAIR with
      # two different names, which is how every rule pair in this repo is
      # written -- so on its own this rule would have looked like it deduplicated
      # them and would not have.
      #
      # Hence the explicit pairs below. Rejected alternative: `equal:
      # [namespace]`, which would deduplicate the pairs -- and would also
      # suppress every unrelated warning in a namespace the moment any critical
      # fired there. A full disk in `theater` would hide a certificate warning
      # in `theater`.
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ["alertname", "namespace"]

      # THE EXPLICIT PAIRS. Each `equal` list is the identity of the THING the
      # two rules are talking about, which is different for each pair -- a PVC
      # is identified by (namespace, persistentvolumeclaim) and a node
      # filesystem by (instance, mountpoint). Getting these keys wrong is how an
      # inhibit_rule becomes either useless or a silence.
      - source_matchers:
          - alertname = "PersistentVolumeCriticallyFull"
        target_matchers:
          - alertname = "PersistentVolumeNearlyFull"
        equal: ["namespace", "persistentvolumeclaim"]

      - source_matchers:
          - alertname = "NodeFilesystemCriticallyFull"
        target_matchers:
          - alertname =~ "NodeFilesystemNearlyFull|NodeFilesystemInodesNearlyFull"
        equal: ["instance", "mountpoint"]

      - source_matchers:
          - alertname = "CertificateExpiringVerySoon"
        target_matchers:
          - alertname = "CertificateExpiringSoon"
        equal: ["namespace", "name"]

      - source_matchers:
          - alertname = "PodStuckNotRunningLongTerm"
        target_matchers:
          - alertname = "PodStuckNotRunning"
        equal: ["namespace", "pod", "container"]

      - source_matchers:
          - alertname = "PostgresBackupNeverSucceeded"
        target_matchers:
          - alertname = "PostgresBackupStale"
        equal: ["namespace", "pod"]

      # 'This cluster has no object store configured' explains both 'it has
      # never backed up' and 'its last backup is stale', and it is the one that
      # names the fix.
      - source_matchers:
          - alertname = "PostgresClusterHasNoBackupConfigured"
        target_matchers:
          - alertname =~ "PostgresBackup.*|PostgresWALArchive.*"
        equal: ["namespace", "pod"]

      # Postgres being down explains its backup being stale, not the reverse.
      - source_matchers:
          - alertname = "PostgresClusterUnhealthy"
        target_matchers:
          - alertname =~ "PostgresBackup.*|PostgresWALArchive.*"
        equal: ["namespace", "pod"]

      # ###############################################################
      # # NO INHIBIT RULE FOR THE `*MetricsAbsent` FAMILY, AND THAT IS THE
      # # CORRECT ANSWER RATHER THAN AN OMISSION.
      # #
      # # The obvious rule -- "if cert-manager metrics are absent, suppress
      # # every certificate alert" -- was drafted and deleted. Two reasons, and
      # # the second is the serious one:
      # #
      # #  1. IT IS UNNECESSARY. If `certmanager_certificate_expiration_
      # #     timestamp_seconds` is absent, CertificateExpiringSoon cannot fire:
      # #     there is no series to evaluate. There is nothing to inhibit. The
      # #     same holds for every other absent()/derived pair here, by
      # #     construction.
      # #
      # #  2. WRITING IT WOULD HAVE BEEN A CLUSTER-WIDE SILENCE. The natural
      # #     spelling is `source: alertname =~ ".*MetricsAbsent"`, `target:
      # #     severity =~ "warning|critical"`, `equal: []` -- and an empty
      # #     `equal` means match regardless of labels. So one absent exporter,
      # #     in one namespace, would suppress EVERY warning and critical in
      # #     the cluster: full disks, dead databases, failed backups. An
      # #     inhibit_rule with no `equal` keys and a broad target matcher is
      # #     the single easiest way to turn an alerting system off while
      # #     believing you tuned it.
      # #
      # # The one place `equal: []` IS used above -- BackupCredentialUnusable --
      # # is safe only because its TARGET matcher is a narrow alertname regex
      # # naming the backup family, not a severity.
      # ###############################################################

      # The whole backup pipeline depends on the object store being reachable.
      # If the credential or the bucket is wrong, every per-database and
      # per-repository alert fires with the same root cause.
      - source_matchers:
          - alertname = "BackupCredentialUnusable"
        target_matchers:
          - alertname =~ "PostgresBackup.*|FileBackup.*|BackupVerification.*"
        # No `equal` keys: BackupCredentialUnusable is a cluster-wide
        # correlation with no namespace of its own, and the alerts it explains
        # are in six different namespaces. An empty list means "match
        # regardless of labels", which is the intent here and is exactly the
        # over-broad thing to avoid on the node rules above -- the difference
        # being that this source alert only fires when the shared credential is
        # the cause.
        equal: []

    receivers:
      # A receiver with no configs. Alertmanager requires every route to name a
      # receiver, so "drop this" is spelled as an empty one.
      - name: "null"

      - name: pushover
        pushover_configs:
          # Both values come from the mounted Secret, so neither the token nor
          # anything identifying the owner's device is in this file.
          - user_key_file: /etc/alertmanager/secrets/alertmanager-notify/pushover-user-key
            token_file: /etc/alertmanager/secrets/alertmanager-notify/pushover-token
            # Pushover priority 1 = bypass the phone's quiet hours for
            # criticals. Deliberately NOT 2 (which demands acknowledgement and
            # re-alerts until it gets one): with one operator that becomes a
            # thing to dismiss rather than a thing to read.
            priority: '{{ if eq .CommonLabels.severity "critical" }}1{{ else }}0{{ end }}'
            title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }}{{ if .CommonLabels.namespace }} [{{ .CommonLabels.namespace }}]{{ end }}'
            # `.Alerts | len` is included because grouping means one message can
            # represent many alerts, and not knowing that is how a group of
            # nine gets read as one.
            message: |-
              {{ .Alerts | len }} alert(s)
              {{ range .Alerts -}}
              - {{ .Annotations.summary }}
              {{ if .Annotations.description }}  {{ .Annotations.description }}
              {{ end }}{{ end }}
            # Deliberately NOT `{{ .ExternalURL }}`. Alertmanager has no
            # HTTPRoute in this repo, so its external URL resolves to an
            # in-cluster Service address that a phone cannot reach -- a link
            # that always fails is worse than no link. Grafana is routed, and
            # its Alerting page reads the same Prometheus.
            url: https://grafana.lilalala.com/alerting/list
            url_title: Open in Grafana
            # Retry/expire only apply to priority 2; set anyway so switching
            # the priority above does not change behaviour by surprise.
            retry: 5m
            expire: 3h
            send_resolved: true

      - name: heartbeat
        webhook_configs:
          # The full URL -- including the provider's per-check token -- comes
          # from the Secret. healthchecks.io and Better Stack both work; either
          # gives a free check that notifies when pings STOP arriving.
          #
          # send_resolved: false because Watchdog never resolves. A resolved
          # notification for it would mean Prometheus has stopped, which is
          # precisely the case where nothing here can send anything -- the
          # absence of the ping is the signal, not a message about it.
          - url_file: /etc/alertmanager/secrets/alertmanager-notify/heartbeat-url
            send_resolved: false
            max_alerts: 1

# ---------------------------------------------------------------------------
# Grafana
# ---------------------------------------------------------------------------
grafana:
  defaultDashboardsTimezone: browser

  # The chart refuses to start if it finds what looks like a secret in
  # `grafana.ini`. Previously this was set to false because the OIDC client
  # secret was pasted in literally. It is now a real Secret reference, so the
  # check can stay on -- it is a useful guard against regressing.
  assertNoLeakedSecrets: true

  persistence:
    enabled: true
    storageClassName: iscsi
    size: 5Gi

  # Ingress is dead; the route lives in ./routes/grafana.yaml.
  ingress:
    enabled: false

  grafana.ini:
    server:
      domain: grafana.lilalala.com
      root_url: "https://%(domain)s/"
    # Grafana sits behind the Gateway, which terminates TLS.
    security:
      cookie_secure: true
      cookie_samesite: lax
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana
      # Injected from the `grafana-oidc` Secret via the envFrom below. Grafana
      # substitutes $__env{} at config-render time, which keeps the value out of
      # both git and the rendered ConfigMap.
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: "openid email profile offline_access roles"
      email_attribute_path: email
      login_attribute_path: preferred_username
      name_attribute_path: name
      auth_url: https://auth.lilalala.com/realms/homelab/protocol/openid-connect/auth
      token_url: https://auth.lilalala.com/realms/homelab/protocol/openid-connect/token
      api_url: https://auth.lilalala.com/realms/homelab/protocol/openid-connect/userinfo
      role_attribute_path: "contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'"
      # Do not let a user without a mapped role fall back to Viewer silently if
      # the claim is missing entirely -- fail the login instead.
      role_attribute_strict: false

  envFrom:
    - secretRef:
        # Created by the `secrets-platform` Application.
        name: grafana-oidc

  # Pick up dashboards from ConfigMaps labelled grafana_dashboard="1", which is
  # how CloudNativePG and Cilium ship theirs.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      enabled: true

  # Probes, stated explicitly.
  #
  # CORRECTION TO A CLAIM WORTH RECORDING: the Grafana subchart is not unprobed.
  # It ships defaults on /api/health -- a liveness probe with
  # initialDelaySeconds 60 / timeoutSeconds 30 / failureThreshold 10, and a bare
  # readiness probe that inherits Kubernetes' defaults (10s period,
  # failureThreshold 3, timeoutSeconds 1). So Grafana was never in the
  # qBittorrent situation from docs/runbooks/arr-qbittorrent.md.
  #
  # What the defaults get wrong for this cluster is the readiness side: a 1s
  # timeout against Grafana on a contended ARM node marks it NotReady on
  # transient slowness, which pulls it out of the Service. Declaring both here
  # fixes the timeout, and means the values are visible where someone would look
  # rather than inherited from a chart default that can change under a bump.
  #
  # /api/health needs no authentication, which matters because OIDC is enabled
  # here: probing `/` would follow into the Keycloak redirect and report Grafana
  # unhealthy whenever Keycloak is down.
  # which matters because OIDC is enabled here: probing `/` would follow into the
  # Keycloak redirect and report Grafana unhealthy whenever Keycloak is down.
  #
  # readiness on 5 failures, liveness on 6, and liveness starts later. A liveness
  # probe that trips before readiness turns a slow start into a restart loop --
  # Grafana runs its SQLite schema migrations before serving, and on a first
  # start after an upgrade that is not instant.
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 90
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# ---------------------------------------------------------------------------
# Exporters
# ---------------------------------------------------------------------------
nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

# These are kubeadm-managed control plane components listening on the node's
# own address. The chart's defaults assume a managed control plane and produce
# permanently-down targets on a self-hosted cluster.
kubeControllerManager:
  enabled: true
  endpoints: []
kubeScheduler:
  enabled: true
  endpoints: []
kubeEtcd:
  enabled: true
  endpoints: []

# kube-proxy is REPLACED by Cilium, so there is nothing to scrape. Leaving this
