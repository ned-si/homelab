# kube-prometheus-stack chart 92.0.0 values, at parity with the running release
# (ADR 0002): the legacy child Application's values, with one intended change.
#
# The Grafana OIDC client secret is no longer inline in grafana.ini (which the
# chart renders into a ConfigMap). Grafana reads it from the environment
# variable GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET, set from the SOPS Secret
# `grafana-oidc` (platform/secrets/grafana-oidc.sops.yaml, same value as live,
# sha256 checked). Adopting this restarts Grafana once.
#
# Upgrading the chart (56 -> current) is a separate change with its own CRD
# upgrade: docs/roadmap.md.
#
# Talos: there is no kube-proxy (Cilium replaces it), so its ServiceMonitor
# would only ever show a target down. The controller-manager, scheduler and
# etcd metrics endpoints are reachable because talos/talconfig.yaml binds them
# to 0.0.0.0; the chart defaults (10257, 10259 over HTTPS) match.
#
# etcd is a Talos service, not a pod, so the chart's etcd Service selects
# nothing. `kubeEtcd.endpoints` does not help under Argo CD, which excludes
# Endpoints and EndpointSlices from sync. etcd is scraped by the ScrapeConfig
# in routes/etcd-scrape.yaml instead; `kubeEtcd` stays enabled for the
# chart's etcd rules.
kubeProxy:
  enabled: false

# eMMC wear. Talos exposes the eMMC's life_time and pre_eol_info only in
# sysfs (no metric, and its Read API is admin-only), so a sidecar reads them
# from node-exporter's read-only /host/sys mount every 5 minutes and writes a
# .prom file that the textfile collector serves:
#
#   node_emmc_life_time_estimate{device, type="a"|"b"}  1..11, each step 10%
#                                                       of rated wear used;
#                                                       11 = exceeded
#   node_emmc_pre_eol_info{device}                      1 normal, 2 warning
#                                                       (80% of reserved
#                                                       blocks used), 3 urgent
#
# extraArgs replaces the chart's list, so its two filesystem filters are
# repeated here.
prometheus-node-exporter:
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    - --collector.textfile.directory=/run/textfile
  sidecarVolumeMount:
    - name: textfile
      mountPath: /run/textfile
      readOnly: false
  sidecars:
    - name: emmc-wear
      # renovate: datasource=docker depName=busybox
      image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
      command: ["/bin/sh", "-c"]
      args:
        - |
          trap 'exit 0' TERM
          out=/run/textfile/emmc.prom
          while true; do
            tmp=$out.tmp
            : > "$tmp"
            for d in /host/sys/bus/mmc/devices/*; do
              [ -r "$d/life_time" ] || continue
              dev=${d##*/}
              set -- $(cat "$d/life_time")
              printf 'node_emmc_life_time_estimate{device="%s",type="a"} %d\n' "$dev" "$1" >> "$tmp"
              printf 'node_emmc_life_time_estimate{device="%s",type="b"} %d\n' "$dev" "$2" >> "$tmp"
              printf 'node_emmc_pre_eol_info{device="%s"} %d\n' "$dev" "$(cat "$d/pre_eol_info")" >> "$tmp"
            done
            if [ -s "$tmp" ]; then
              mv "$tmp" "$out"
            else
              echo 'level=error msg="no eMMC life_time in /host/sys/bus/mmc/devices"'
            fi
            sleep 300 &
            wait $!
          done
      volumeMounts:
        - name: sys
          mountPath: /host/sys
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 1m
          memory: 4Mi
        limits:
          memory: 16Mi
      # Healthy while the file is less than 15 minutes old.
      livenessProbe:
        exec:
          command: ["/bin/sh", "-c", "find /run/textfile/emmc.prom -mmin -15 | grep -q ."]
        initialDelaySeconds: 60
        periodSeconds: 300

# The claim of the TSDB is pre-created in infrastructure/iscsi-volumes/ and
# bound to the existing volume; the template below must keep its name (the
# chart derives it from the release name) and its size.
prometheus:
  prometheusSpec:
    # 30 days for the SLO window (routes/slo.yaml). At about 0.55 GB/day of
    # blocks (2026-10) that is about 17 GB. retentionSize caps the blocks at
    # 20GiB, leaving about 5Gi of the volume for the WAL and compaction.
    #
    # The operator does not resize the PVC: after a change to `storage`, patch
    # prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0
    # to the same size (`iscsi` allows expansion; online, no restart).
    retention: 30d
    retentionSize: 20GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - "ReadWriteOnce"
          resources:
            requests:
              storage: 25Gi

grafana:
  defaultDashboardsTimezone: browser
  assertNoLeakedSecrets: false
  envFromSecret: grafana-oidc
  grafana.ini:
    server:
      domain: grafana.lilalala.com
      root_url: https://%(domain)s/
    # A platform tool: the session ends after 12 hours without use and 24
    # hours at most, and Keycloak asks for the password again once the last
    # login is 12 hours old (docs/architecture.md "Sessions").
    auth:
      login_maximum_inactive_lifetime_duration: 12h
      login_maximum_lifetime_duration: 24h
    auth.generic_oauth:
      enabled: true
      name: Keycloak-OAuth
      allow_sign_up: true
      client_id: grafana-oauth
      # client_secret: from GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET (see above)
      scopes: openid email profile roles
      email_attribute_path: email
      login_attribute_path: username
      name_attribute_path: full_name
      auth_url: https://auth.lilalala.com/realms/homelab/protocol/openid-connect/auth
      token_url: https://auth.lilalala.com/realms/homelab/protocol/openid-connect/token
      api_url: https://auth.lilalala.com/realms/homelab/protocol/openid-connect/userinfo
      role_attribute_path: contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'
  # No Ingress: grafana.lilalala.com is served by the shared Gateway
  # (routes/grafana.yaml). ingress-nginx is removed (ADR 0011).
  ingress:
    enabled: false
  # grafana.db (SQLite) on a volume, so what is not provisioned survives a
  # restart: the service account `agent-readonly` and its token
  # (docs/secrets.md), annotations, stars. Dashboards and datasources stay
  # provisioned from git. PVC `kube-prometheus-stack-grafana`, the name
  # routes/grafana-backup.yaml backs up. ReadWriteOnce, so the old pod stops
  # before the new one starts (maxSurge 0). Not `type: Recreate`: the live
  # Deployment keeps its defaulted rollingUpdate block and the apply is refused.
  persistence:
    enabled: true
    type: pvc
    storageClassName: iscsi-retain
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    annotations:
      argocd.argoproj.io/sync-options: Delete=false,Prune=false
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  # fsGroup 472 (the chart default) already gives Grafana the new volume; the
  # chown init container would run as root.
  initChownData:
    enabled: false

# Alertmanager routes: the paging policy of docs/sre.md "Paging". Only the
# alerts below notify; every other alert is visible in Grafana and
# Alertmanager and sends nothing.
#
#   Watchdog          -> heartbeat: the dead-man's switch (healthchecks.io) in
#                        Secret `alertmanager-notify` key `heartbeat-url`,
#                        every 5 minutes. It alerts when the pings stop.
#   SLO burn rate     -> ntfy, one group per app (fast critical, slow warning).
#   infra critical    -> ntfy, one group per alert name: node down, etcd
#                        quorum, NAS unreachable or pool unhealthy, a node
#                        filesystem read-only, a failed Talos upgrade,
#                        Alertmanager failing to deliver.
#   backup failed     -> ntfy, one group per alert name: a restore test, a
#                        CNPG base backup or WAL archive, a backup Job.
#   security critical -> ntfy: any critical rule labelled `category: security`.
#   anything else     -> "null".
#
# Quiet hours: every route to ntfy has mute_time_intervals [quiet-hours],
# 23:00-08:00 Europe/Zurich (the location follows DST). A muted flush sends
# nothing and records nothing, so a group still firing at 08:00 notifies at
# its next group_interval flush (within 5 minutes), once per group, after
# inhibition. Groups that fired and resolved overnight send nothing. The
# heartbeat and ntfy-guard routes are never muted. A child route does not inherit
# mute_time_intervals, so each one lists it.
#
# The ntfy pushes go to the hosted ntfy.sh topic in key `ntfy-url`. Hosted,
# so they do not depend on this cluster or the house's network being up.
# HomelabNodeNotReady and HomelabNASUnreachable also go, unmuted and with
# the same title, to the guard topic in key `ntfy-guard-url` (the ntfy topic
# plus `-guard`, which nobody subscribes to): the auto-rollback outage guard
# reads them there at any hour (scripts/ci/auto-rollback-guard.sh).
#
# Inhibition removes the cause alerts of an incident that already notifies,
# so they show as suppressed in Alertmanager:
#
#   SLOErrorBudgetBurnFast              -> the pod, workload and Argo CD
#   ServiceHasNoReadyBackend,              alerts of the same namespace
#   StatefulSetHasNoReadyReplica
#   HomelabNodeNotReady                 -> the node and pod alerts with the
#                                          same `node` label
#   HomelabNASUnreachable               -> everything that needs storage:
#                                          pods, workloads, Argo CD, CNPG,
#                                          backups, SLO burns, everywhere
#
# Tests: scripts/ci/alertmanager-test.sh (CI: render job) runs amtool on
# tests/alertmanager/routes.txt and replays tests/alertmanager/*.json against
# a real Alertmanager, counting notifications.
#
# The operator mounts the Secret at
# /etc/alertmanager/secrets/alertmanager-notify/<key>; `url_file` reads it at
# send time, so neither URL is in git (the ntfy topic is the only credential:
# whoever knows it can read and post).
#
# ntfy formats the standard webhook JSON itself (inline templating,
# https://docs.ntfy.sh/publish/#message-templating): `X-Template: yes` makes
# the X-Title, X-Message and X-Priority headers Go templates over the body.
# Priority: critical 5 (urgent), warning 4 (high), resolved 2 (low).
#
# Every ntfy group has one alert name, so the title names it.
#
# Helm merges `config` into the chart default: `route` keys are merged,
# `routes`, `receivers` and `inhibit_rules` (lists) are replaced, `global`
# and `templates` stay the chart's. The first two inhibit rules are the
# chart's own.
alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-notify
  config:
    route:
      receiver: "null"
      group_by: [namespace, app]
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 24h
      routes:
        - receiver: heartbeat
          matchers:
            - alertname = "Watchdog"
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 5m
        # The outage guard's copy, never muted; `continue` so the ntfy route
        # below still pages.
        - receiver: ntfy-guard
          matchers:
            - alertname =~ "HomelabNodeNotReady|HomelabNASUnreachable"
          group_by: [alertname]
          repeat_interval: 4h
          continue: true
        - receiver: ntfy
          matchers:
            - alertname =~ "SLOErrorBudgetBurnFast|SLOErrorBudgetBurnSlow"
          group_by: [alertname, namespace, app]
          mute_time_intervals: [quiet-hours]
          routes:
            - matchers:
                - severity = "critical"
              repeat_interval: 4h
              mute_time_intervals: [quiet-hours]
            - matchers:
                - severity = "warning"
              group_wait: 5m
              repeat_interval: 24h
              mute_time_intervals: [quiet-hours]
        - receiver: ntfy
          matchers:
            - alertname =~ "HomelabNodeNotReady|HomelabNASUnreachable|etcdInsufficientMembers|etcdNoLeader|NASPoolUnhealthy"
          group_by: [alertname]
          repeat_interval: 4h
          mute_time_intervals: [quiet-hours]
        - receiver: ntfy
          matchers:
            - alertname =~ "NodeFilesystemReadOnly|TalosUpgradeFailed|AlertmanagerNotificationsFailing"
          group_by: [alertname]
          repeat_interval: 4h
          mute_time_intervals: [quiet-hours]
        - receiver: ntfy
          matchers:
            - alertname =~ "BackupVerifyFailed|CNPGBackupFailed|CNPGWALArchivingFailing"
          group_by: [alertname]
          group_wait: 5m
          mute_time_intervals: [quiet-hours]
        # A failed backup or dump Job (the restic CronJobs are *-backup*).
        # The restore tests report through BackupVerifyFailed instead.
        - receiver: ntfy
          matchers:
            - alertname = "KubeJobFailed"
            - job_name =~ ".+-backup-.+"
            - namespace != "backup-verify"
          group_by: [alertname]
          group_wait: 5m
          mute_time_intervals: [quiet-hours]
        - receiver: ntfy
          matchers:
            - category = "security"
            - severity = "critical"
          group_by: [alertname]
          repeat_interval: 4h
          mute_time_intervals: [quiet-hours]
    # 23:00-08:00 local time; a range cannot cross midnight, so two ranges.
    time_intervals:
      - name: quiet-hours
        time_intervals:
          - times:
              - start_time: "23:00"
                end_time: "24:00"
              - start_time: "00:00"
                end_time: "08:00"
            location: Europe/Zurich
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity =~ "warning|info"
        equal: [namespace, alertname]
      - source_matchers:
          - severity = "warning"
        target_matchers:
          - severity = "info"
        equal: [namespace, alertname]
      # The pod, workload and Argo CD alerts: KubePod*, KubeContainerWaiting,
      # KubeDeployment*, KubeStatefulSet*, KubePdbNotEnoughHealthyPods,
      # KubeJobFailed, Pod* (routes/alerts.yaml) and ArgoCD*.
      - source_matchers:
          - alertname =~ "SLOErrorBudgetBurnFast|ServiceHasNoReadyBackend|StatefulSetHasNoReadyReplica"
        target_matchers:
          - alertname =~ "(Kube(Pod|ContainerWaiting|Deployment|StatefulSet|PdbNotEnoughHealthyPods|JobFailed)|Pod|ArgoCD).*"
        equal: [namespace]
      - source_matchers:
          - alertname = "SLOErrorBudgetBurnFast"
        target_matchers:
          - alertname =~ "ServiceHasNoReadyBackend|StatefulSetHasNoReadyReplica"
        equal: [namespace]
      - source_matchers:
          - alertname = "HomelabNodeNotReady"
        target_matchers:
          - alertname =~ "KubeNode.*|KubePod.*|Pod.*"
        equal: [node]
      - source_matchers:
          - alertname = "HomelabNASUnreachable"
        target_matchers:
          - alertname =~ "(Kube(Pod|ContainerWaiting|Deployment|StatefulSet|PdbNotEnoughHealthyPods|JobFailed)|Pod|ArgoCD).*"
      - source_matchers:
          - alertname = "HomelabNASUnreachable"
        target_matchers:
          - alertname =~ "(SLOErrorBudgetBurn|(ServiceHas|StatefulSetHas)NoReady|KubePersistentVolumeErrors|CNPG|BackupVerify|NASExporter).*"
    receivers:
      - name: "null"
      - name: heartbeat
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-notify/heartbeat-url
            send_resolved: false
      - name: ntfy
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-notify/ntfy-url
            send_resolved: true
            # ntfy caps a message at 4 KiB; a batch beyond 5 alerts is cut.
            max_alerts: 5
            timeout: 10s
            http_config: &ntfy-http
              http_headers:
                X-Template:
                  values: ["yes"]
                X-Title:
                  values:
                    # Folded scalars: each line break becomes one space, so
                    # lines break only inside {{ }} or where a space belongs.
                    - >-
                      {{if eq .status "resolved"}}Resolved{{else if eq
                      .commonLabels.severity "critical"}}CRITICAL{{else}}Warning{{end}}:
                      {{.commonLabels.alertname}}{{if .commonLabels.namespace}}
                      ({{.commonLabels.namespace}}){{end}}
                X-Message:
                  values:
                    - >-
                      {{range .alerts}}{{if .annotations.summary}}{{.annotations.summary}}{{else
                      }}{{.labels.alertname}}{{end}}{{"\n"}}{{end}}{{if eq (len .alerts)
                      1}}{{with (index .alerts 0).annotations.description}}{{"\n"}}{{.}}{{end}}{{end}}
                X-Priority:
                  values:
                    - '{{if eq .status "resolved"}}2{{else if eq .commonLabels.severity "critical"}}5{{else}}4{{end}}'
      - name: ntfy-guard
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-notify/ntfy-guard-url
            send_resolved: true
            max_alerts: 5
            timeout: 10s
            http_config: *ntfy-http
