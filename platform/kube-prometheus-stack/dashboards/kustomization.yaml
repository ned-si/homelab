# Grafana dashboards as code. Each JSON file becomes a ConfigMap labelled
# grafana_dashboard: "1"; the Grafana sidecar loads every such ConfigMap from
# every namespace, no restart needed.
#
# Edit the JSON (or export it from Grafana: Share -> Export -> "Export for
# sharing externally" off), keep `"uid"` stable, and re-render. Panels use the
# `${datasource}` variable, never a datasource uid.
#
# Checked by tests/test_dashboards.py.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  - name: grafana-dashboard-homelab-overview
    files:
      - homelab-overview.json
  - name: grafana-dashboard-homelab-security
    files:
      - homelab-security.json
  - name: grafana-dashboard-homelab-nodes
    files:
      - homelab-nodes.json
  - name: grafana-dashboard-homelab-storage
    files:
      - homelab-storage.json
  - name: grafana-dashboard-homelab-lan
    files:
      - homelab-lan.json
  - name: grafana-dashboard-homelab-network
    files:
      - homelab-network.json
  - name: grafana-dashboard-homelab-cicd
    files:
      - homelab-cicd.json
  - name: grafana-dashboard-homelab-usage
    files:
      - homelab-usage.json
  - name: grafana-dashboard-home
    files:
      - home.json
  - name: grafana-dashboard-homelab-aws
    files:
      - homelab-aws.json
