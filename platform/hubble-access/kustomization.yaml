apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Rendered to deploy/platform/hubble-access, the source of the hubble-access
# Application. No `namespace:`: the policies for the relay and the UI live in
# kube-system, everything else in hubble; each file sets its own.
resources:
  - sso.yaml
  - httproute.yaml
  - network-policy.yaml

# oauth2-proxy config of hubble-sso (sso.yaml). The name hash makes a change
# here a new ConfigMap, which rolls the Deployment.
configMapGenerator:
  - name: hubble-sso
    namespace: hubble
    files:
      - alpha-config.yaml=sso-alpha-config.yaml
