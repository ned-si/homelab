# Enforced from the start: the UI has no login and the relay serves every
# flow, so each hop admits only the previous one (Gateway -> hubble-sso -> UI
# -> relay, plus Prometheus). The kube-system policies select only the relay
# and UI pods; a port-forward is not subject to them.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hubble-sso
  namespace: hubble
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hubble-sso
  enableDefaultDeny:
    ingress: true
    egress: false
  ingress:
    # The shared Gateway (Cilium's Envoy, identity `reserved:ingress`).
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
    # kubelet probes.
    - fromEntities:
        - host
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s-app: hubble-ui
  enableDefaultDeny:
    ingress: true
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hubble
            app.kubernetes.io/name: hubble-sso
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - fromEntities:
        - host
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hubble-relay
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s-app: hubble-relay
  enableDefaultDeny:
    ingress: true
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s-app: hubble-ui
      toPorts:
        - ports:
            - port: "4245"
              protocol: TCP
    # Prometheus scrapes the relay metrics (PodMonitor monitoring/hubble-relay).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9966"
              protocol: TCP
    - fromEntities:
        - host
