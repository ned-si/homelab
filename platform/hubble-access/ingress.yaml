# Hubble UI on the tailnet only: https://hubble.<tailnet>.ts.net. The
# Tailscale operator creates the proxy pod (namespace tailscale, ProxyClass
# `restricted`) and its Let's Encrypt certificate. No HTTPRoute: the UI is not
# on the public Gateway.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubble
  namespace: hubble
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: hubble-sso
      port:
        number: 4180
  tls:
    - hosts:
        - hubble
