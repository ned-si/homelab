# hubble.lilalala.com to the oauth2-proxy `hubble-sso`. Route shape:
# platform/kube-prometheus-stack/routes/grafana.yaml. Security headers
# (docs/networking.md): the full set, never framed.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
  namespace: hubble
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - hubble.lilalala.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), payment=(), usb=()"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
              - name: X-Frame-Options
                value: "DENY"
              - name: Content-Security-Policy
                value: "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
      backendRefs:
        - group: ""
          kind: Service
          name: hubble-sso
          port: 4180
          weight: 1
      # The flow stream (gRPC-web) is a long-lived request.
      timeouts:
        request: 0s
