# Talos machine config drift (check.sh). Both page: nothing applies Talos
# config automatically, and a check that stopped needs fixing by hand.
# Tests: tests/prometheus/talos_drift_test.yaml.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: talos-drift
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: talos.drift
      rules:
        - alert: TalosConfigDrift
          expr: max by (node) (talos_config_drift{job="talos-drift"}) == 1
          for: 10m
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/TalosConfigDrift.md
            summary: "Talos config on {{ $labels.node }} differs from main"
            description: >-
              The running machine config of {{ $labels.node }} is not the one
              talos/talconfig.yaml on main renders. From an up-to-date main,
              preview with `task talos:apply -- {{ $labels.node }}` in dry-run
              (docs/talos.md), then apply; if the node is right and main is
              wrong, fix main instead.
        - alert: TalosDriftCheckStale
          expr: |
            time() - max(max_over_time(talos_config_drift_last_success_timestamp_seconds{job="talos-drift"}[3d])) > 2 * 86400
            or absent_over_time(talos_config_drift_last_success_timestamp_seconds{job="talos-drift"}[3d])
          for: 1h
          labels:
            severity: warning
            action: human
          annotations:
            runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/TalosDriftCheckStale.md
            summary: "No Talos drift check in 2 days"
            description: >-
              The talos-drift CronJob has not pushed a result for 2 days. Check
              kubectl -n system-upgrade get cronjob,jobs -l app.kubernetes.io/name=talos-drift
              and the last Job's log.
