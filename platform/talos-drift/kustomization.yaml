# talos-drift: daily Talos machine config drift check against main, and its
# alerts (docs/talos.md "Drift check"). The ConfigMap name carries a content
# hash, so a change to check.sh reaches the next run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: system-upgrade

resources:
  - cronjob.yaml
  - rules.yaml

configMapGenerator:
  - name: talos-drift
    files:
      - check.sh
