# Daily Talos machine config drift check (check.sh): each node's running config
# against the render of main, pushed to the backup-verify Pushgateway.
#
# In system-upgrade, the one namespace Talos grants API access to
# (talos/patches/talosctl/controlplane/talos-api-access.yaml). os:admin,
# because only it can read machine configs; the script only reads. talosctl
# and talhelper are image volumes at the pinned versions, so the render
# matches `task talos:genconfig`.
---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-drift
spec:
  roles:
    - os:admin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-drift-check
  labels:
    app.kubernetes.io/name: talos-drift
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-drift
  labels:
    app.kubernetes.io/name: talos-drift
spec:
  # 05:40 UTC daily, after the tofu drift run.
  schedule: "40 5 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: talos-drift
        spec:
          serviceAccountName: talos-drift-check
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              # renovate: datasource=docker depName=bash
              image: bash:5.3.20-alpine3.24@sha256:589adbc588d8ef3c1ec3c68333faf4baf5dccb65d3cb50f6cf3d78cad2d6e1b0
              command: ["bash", "/app/check.sh"]
              env:
                - name: PATH
                  value: /opt/talosctl:/opt/talhelper/bin:/usr/local/bin:/usr/bin:/bin
                - name: HOME
                  value: /work
                - name: WORK_DIR
                  value: /work
                - name: TALOSCONFIG
                  value: /var/run/secrets/talos.dev/config
                - name: PUSHGATEWAY
                  value: http://pushgateway.backup-verify.svc:9091
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: app
                  mountPath: /app
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
                - name: talosctl
                  mountPath: /opt/talosctl
                  readOnly: true
                - name: talhelper
                  mountPath: /opt/talhelper
                  readOnly: true
          volumes:
            - name: app
              configMap:
                name: talos-drift
            # Configs and the rebuilt secrets: memory only, gone with the pod.
            - name: work
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 16Mi
            - name: talos-secrets
              secret:
                secretName: talos-drift
            - name: talosctl
              image:
                # renovate: datasource=docker depName=ghcr.io/siderolabs/talosctl
                reference: ghcr.io/siderolabs/talosctl:v1.14.6@sha256:82c9a9985fc7292a222e680414c65955ac0566db588b84d88f620b05d16b1d5b
                pullPolicy: IfNotPresent
            - name: talhelper
              image:
                # renovate: datasource=docker depName=ghcr.io/budimanjojo/talhelper
                reference: ghcr.io/budimanjojo/talhelper:v3.1.17@sha256:ca00310090f71bf32b2dca1e3884dc05f64e9012f8c3d3bca86fa0ce2cd750a5
                pullPolicy: IfNotPresent
