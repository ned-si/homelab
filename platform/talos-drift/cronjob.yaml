# Daily Talos machine config drift check (check.sh): each node's running
# config against the one rendered from main. Results go to the backup-verify
# Pushgateway (its NetworkPolicy admits this namespace); the alerts are in
# rules.yaml.
#
# It runs in system-upgrade because that is the one namespace Talos grants API
# access to (KubeTalosAPIAccessConfig in
# talos/patches/talosctl/controlplane/talos-api-access.yaml). The role is
# os:admin: machine configs are a sensitive resource that os:reader and
# os:operator cannot read. The script only reads; the client certificate is
# in the Secret talos-drift, which only this Job mounts.
#
# talosctl and talhelper come from their own images as image volumes, at the
# versions of talos/talconfig.yaml (talosVersion) and of ci.yaml
# (TALHELPER_VERSION), so the render matches `task talos:genconfig`.
---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-drift
spec:
  roles:
    - os:admin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-drift-check
  labels:
    app.kubernetes.io/name: talos-drift
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-drift
  labels:
    app.kubernetes.io/name: talos-drift
spec:
  # 05:40 UTC daily, after the tofu drift run.
  schedule: "40 5 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: talos-drift
        spec:
          serviceAccountName: talos-drift-check
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              # renovate: datasource=docker depName=bash
              image: bash:5.3.20-alpine3.24
              command: ["bash", "/app/check.sh"]
              env:
                - name: PATH
                  value: /opt/talosctl:/opt/talhelper/bin:/usr/local/bin:/usr/bin:/bin
                - name: HOME
                  value: /work
                - name: WORK_DIR
                  value: /work
                - name: TALOSCONFIG
                  value: /var/run/secrets/talos.dev/config
                - name: PUSHGATEWAY
                  value: http://pushgateway.backup-verify.svc:9091
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: app
                  mountPath: /app
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
                - name: talosctl
                  mountPath: /opt/talosctl
                  readOnly: true
                - name: talhelper
                  mountPath: /opt/talhelper
                  readOnly: true
          volumes:
            - name: app
              configMap:
                name: talos-drift
            # Configs and the rebuilt secrets: memory only, gone with the pod.
            - name: work
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 16Mi
            - name: talos-secrets
              secret:
                secretName: talos-drift
            - name: talosctl
              image:
                # renovate: datasource=docker depName=ghcr.io/siderolabs/talosctl
                reference: ghcr.io/siderolabs/talosctl:v1.14.3
                pullPolicy: IfNotPresent
            - name: talhelper
              image:
                # renovate: datasource=docker depName=ghcr.io/budimanjojo/talhelper
                reference: ghcr.io/budimanjojo/talhelper:v3.1.17
                pullPolicy: IfNotPresent
