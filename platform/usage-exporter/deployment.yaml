# One replica, no state: the exporter reads Immich and Jellyfin every 5
# minutes and keeps the last collection in memory.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: usage-exporter
  labels:
    app.kubernetes.io/name: usage-exporter
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-exporter
  labels:
    app.kubernetes.io/name: usage-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: usage-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: usage-exporter
      annotations:
        # Bumped after platform/secrets/usage-exporter changed and the Secret
        # is live (Application secrets-platform synced): the keys are read at
        # start, and in the same pull request the pod can restart first.
        kubectl.kubernetes.io/restartedAt: "2026-10-16T07:45:00Z"
    spec:
      serviceAccountName: usage-exporter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # renovate: datasource=docker depName=python
          image: python:3.15.0-alpine3.24@sha256:2699b90f4d562a22e2dd076c82f964032f64814204bff36d271a54ba4cc2c7e2
          command: ["python3", "-u", "/app/exporter.py"]
          env:
            - name: INTERVAL
              value: "300"
            - name: PORT
              value: "9172"
            - name: IMMICH_URL
              value: http://immich-server.immich:2283
            - name: JELLYFIN_URL
              value: http://jellyfin.theater:8096
          # IMMICH_API_KEY and JELLYFIN_API_KEY (platform/secrets/usage-exporter).
          envFrom:
            - secretRef:
                name: usage-exporter
          ports:
            - name: metrics
              containerPort: 9172
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: usage-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: usage-exporter
  labels:
    app.kubernetes.io/name: usage-exporter
spec:
  selector:
    app.kubernetes.io/name: usage-exporter
  ports:
    - name: metrics
      port: 9172
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: usage-exporter
  labels:
    app.kubernetes.io/name: usage-exporter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: usage-exporter
  endpoints:
    - port: metrics
      interval: 1m
