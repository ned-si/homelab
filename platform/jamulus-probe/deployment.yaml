# One replica, no state: every scrape pings the Jamulus server
# (docs/observability.md).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jamulus-probe
  labels:
    app.kubernetes.io/name: jamulus-probe
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jamulus-probe
  labels:
    app.kubernetes.io/name: jamulus-probe
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: jamulus-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jamulus-probe
    spec:
      serviceAccountName: jamulus-probe
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # renovate: datasource=docker depName=python
          image: python:3.15.2-alpine3.24@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
          command: ["python3", "-u", "/app/exporter.py"]
          env:
            # The jamulus LoadBalancer (apps/jamulus/service.yaml).
            - name: TARGETS
              value: 192.168.1.202:41124
            - name: PORT
              value: "9174"
          ports:
            - name: metrics
              containerPort: 9174
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: jamulus-probe
---
apiVersion: v1
kind: Service
metadata:
  name: jamulus-probe
  labels:
    app.kubernetes.io/name: jamulus-probe
spec:
  selector:
    app.kubernetes.io/name: jamulus-probe
  ports:
    - name: metrics
      port: 9174
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jamulus-probe
  labels:
    app.kubernetes.io/name: jamulus-probe
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: jamulus-probe
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
