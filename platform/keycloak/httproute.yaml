# auth.lilalala.com -> Keycloak. The WAN IP and the certificate are set once,
# in external-dns and on the shared Gateway.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  # group/kind/weight and the catch-all match are the API server's defaults,
  # spelled out so that Argo CD's diff sees no drift.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: gateway
      sectionName: https
  hostnames:
    - auth.lilalala.com
  rules:
    # The admin console, the admin REST API and the master realm are on the
    # tailnet only (admin-ingress.yaml, pentest 2026-11-10 E1): here they,
    # and the root, redirect to the homelab account page.
    - matches:
        # Keycloak answers the root with a redirect to the admin console,
        # which would name the tailnet admin address here.
        - path:
            type: Exact
            value: /
        - path:
            type: PathPrefix
            value: /admin
        - path:
            type: PathPrefix
            value: /realms/master
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              # The Gateway answers this redirect itself, so Keycloak's own
              # headers are missing; scripts/tls-check.sh gates on both.
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: Content-Security-Policy
                value: "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /realms/homelab/account/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: Permissions-Policy
                value: "camera=(), microphone=(), payment=(), usb=()"
      backendRefs:
        - group: ""
          kind: Service
          name: keycloak
          port: 8080
          weight: 1
      timeouts:
        request: 0s
