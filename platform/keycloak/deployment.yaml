# Keycloak.
#
# WHAT CHANGED FROM THE OLD MANIFEST
#
#   - KC_BOOTSTRAP_ADMIN_PASSWORD was a literal string in git. It is now read
#     from the `keycloak-admin` Secret (SOPS-encrypted, created by the
#     `secrets-platform` Application). The old password is compromised and must
#     be rotated -- see docs/security-incident.md.
#
#   - Image bumped 26.0.5 -> 26.7.0 and annotated for Renovate.
#
#   - JGroups now discovers peers via a dedicated headless Service
#     (`keycloak-headless`) instead of the same Service that serves traffic.
#     The old setup pointed `jgroups.dns.query` at a headless Service that was
#     also the Ingress backend, conflating cluster discovery with routing.
#
#   - Added resource requests and probes on the management port. The old pod had
#     no requests at all, so the scheduler treated a JVM as free and could stack
#     it next to Postgres on the same RK1 module.
#
#   - Added a restricted securityContext; the namespace enforces PSA `restricted`.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  strategy:
    # Keycloak clusters via Infinispan/JGroups. With one replica a rolling
    # update would briefly run two members that must form a cluster and then
    # immediately tear one down; Recreate avoids that entirely.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          # renovate: datasource=docker depName=quay.io/keycloak/keycloak
          image: quay.io/keycloak/keycloak:26.7.0
          args:
            - start
          env:
            # --- clustering ------------------------------------------------
            - name: JAVA_OPTS_APPEND
              value: "-Djgroups.dns.query=keycloak-headless.keycloak.svc.cluster.local"
            - name: KC_CACHE
              value: ispn
            - name: KC_CACHE_STACK
              value: kubernetes

            # --- database --------------------------------------------------
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              valueFrom:
                secretKeyRef:
                  # Generated by CloudNativePG, never stored in git.
                  name: keycloak-db-app
                  key: jdbc-uri

            # --- hostname / proxy ------------------------------------------
            # KC_HOSTNAME must be the public URL. KC_PROXY_HEADERS=xforwarded
            # makes Keycloak trust the Gateway's X-Forwarded-* headers, which is
            # what stops it generating http:// redirect URLs behind TLS
            # termination.
            - name: KC_HOSTNAME
              value: https://auth.lilalala.com
            - name: KC_HOSTNAME_STRICT
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded

            # --- bootstrap admin ------------------------------------------
            # Only used to create the first admin account on an empty database.
            # Once a real admin exists these can be removed entirely; leaving
            # them costs nothing but the Secret.
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password

            # --- operational ----------------------------------------------
            - name: KC_FEATURES_DISABLED
              value: impersonation
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_LOG
              value: console
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: mgmt
              containerPort: 9000
              protocol: TCP
          # Health and metrics are on the management port (9000), never exposed
          # through the Gateway.
          startupProbe:
            httpGet:
              path: /health/started
              port: mgmt
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: mgmt
          livenessProbe:
            httpGet:
              path: /health/live
              port: mgmt
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Keycloak writes to /opt/keycloak/data
            capabilities:
              drop: ["ALL"]
