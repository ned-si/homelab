# Credentials from SOPS Secrets (secretKeyRef); PVCs carry
# argocd.argoproj.io/sync-options: Delete=false,Prune=false (ADR 0002).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: keycloak
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
      annotations:
        # Env from a Secret is read at pod start only. Bump this after
        # rotating keycloak-admin so the pod env matches the Secret.
        kubectl.kubernetes.io/restartedAt: "2026-10-07T00:00:00Z"
    spec:
      automountServiceAccountToken: false
      # The image's config user 1000; its files are group 0 and group-writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          # renovate: datasource=docker depName=quay.io/keycloak/keycloak
          image: quay.io/keycloak/keycloak:26.8.2@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /opt/keycloak/bin/kc.sh
          args:
            - start
          env:
            # Cluster discovery through the database (JGroups JDBC_PING, table
            # jgroups_ping in keycloak-db): the default stack, so no
            # KC_CACHE_STACK. Members talk on 7800 and 57800 (pod IPs).
            - name: KC_CACHE
              value: ispn
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-app
                  key: jdbc-uri
            - name: KC_FEATURES_DISABLED
              value: impersonation
            - name: KC_HOSTNAME
              value: https://auth.lilalala.com
            # The admin console and admin API on the tailnet only
            # (admin-ingress.yaml, pentest 2026-11-10 E1).
            - name: KC_HOSTNAME_ADMIN
              value: https://keycloak-admin.tail32a1fc.ts.net
            - name: KC_HOSTNAME_STRICT
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            # keycloak_user_events_total{realm,client_id,event,error} on the
            # management port, for the Security dashboard (failed logins,
            # lockouts). Global listener: no realm event storage needed.
            - name: KC_FEATURES
              value: user-event-metrics
            - name: KC_EVENT_METRICS_USER_ENABLED
              value: "true"
            - name: KC_EVENT_METRICS_USER_TAGS
              value: realm,clientId
            - name: KC_EVENT_METRICS_USER_EVENTS
              value: login,client_login,code_to_token,refresh_token,logout,reset_password,update_credential,user_disabled_by_temporary_lockout,user_disabled_by_permanent_lockout
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_LOG
              value: console
            - name: KC_LOG_CONSOLE_COLOR
              value: "true"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: mgmt
              containerPort: 9000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: mgmt
              scheme: HTTP
          readinessProbe:
            httpGet:
              path: /health/ready
              port: mgmt
              scheme: HTTP
          startupProbe:
            httpGet:
              path: /health/started
              port: mgmt
              scheme: HTTP
            failureThreshold: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: keycloak
  name: keycloak
  namespace: keycloak
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: mgmt
      port: 9000
      targetPort: mgmt
      protocol: TCP
  selector:
    app.kubernetes.io/name: keycloak
