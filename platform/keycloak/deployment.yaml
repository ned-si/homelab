# Ported byte-for-byte in spec from the running cluster (legacy tree at the
# all-apps pin), ADR 0002. Differences from live, all intended:
#   - inline credentials replaced by secretKeyRef to SOPS Secrets with the same
#     value (per-key sha256 checked), which restarts the pod once on adoption;
#   - PVCs carry argocd.argoproj.io/sync-options: Delete=false,Prune=false.
# Hardening (probes, security contexts, resources, image digests) is a later,
# separate change: docs/roadmap.md.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: keycloak
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
      annotations:
        # Env from a Secret is read at pod start only. Bump this after
        # rotating keycloak-admin so the pod env matches the Secret.
        kubectl.kubernetes.io/restartedAt: "2026-10-07T00:00:00Z"
    spec:
      containers:
        - name: keycloak
          # renovate: datasource=docker depName=quay.io/keycloak/keycloak
          image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
          command:
            - /opt/keycloak/bin/kc.sh
          args:
            - start
          env:
            - name: JAVA_OPTS_APPEND
              value: "-Djgroups.dns.query=keycloak"
            - name: KC_CACHE
              value: ispn
            - name: KC_CACHE_STACK
              value: kubernetes
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-app
                  key: jdbc-uri
            - name: KC_FEATURES_DISABLED
              value: impersonation
            - name: KC_HOSTNAME
              value: https://auth.lilalala.com
            - name: KC_HOSTNAME_STRICT
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            # keycloak_user_events_total{realm,client_id,event,error} on the
            # management port, for the Security dashboard (failed logins,
            # lockouts). Global listener: no realm event storage needed.
            - name: KC_FEATURES
              value: user-event-metrics
            - name: KC_EVENT_METRICS_USER_ENABLED
              value: "true"
            - name: KC_EVENT_METRICS_USER_TAGS
              value: realm,clientId
            - name: KC_EVENT_METRICS_USER_EVENTS
              value: login,client_login,code_to_token,refresh_token,logout,reset_password,update_credential,user_disabled_by_temporary_lockout,user_disabled_by_permanent_lockout
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_LOG
              value: console
            - name: KC_LOG_CONSOLE_COLOR
              value: "true"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: mgmt
              containerPort: 9000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: mgmt
              scheme: HTTP
          readinessProbe:
            httpGet:
              path: /health/ready
              port: mgmt
              scheme: HTTP
          startupProbe:
            httpGet:
              path: /health/started
              port: mgmt
              scheme: HTTP
            failureThreshold: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: keycloak
  name: keycloak
  namespace: keycloak
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: mgmt
      port: 9000
      targetPort: mgmt
      protocol: TCP
  selector:
    app.kubernetes.io/name: keycloak
