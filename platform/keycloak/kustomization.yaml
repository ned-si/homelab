apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak

resources:
  - database.yaml
  # WAL archiving and daily base backups to S3 (Barman Cloud plugin).
  - backup.yaml
  # Takes a base backup before every sync (presync-backup.yaml).
  - presync-backup.yaml
  - deployment.yaml
  - httproute.yaml
  - realm-settings.yaml

# Input of the realm-settings Job. The name hash makes a change here a new
# ConfigMap, so the Job always runs with the file it was synced with.
configMapGenerator:
  - name: keycloak-realm-settings
    files:
      - realm/sessions.conf
      - realm/platform.conf
      - realm/apply.sh

# After every sync: the management port reports ready.
components:
  - ../../components/postsync-smoke
patches:
  - target: { kind: Job, name: postsync-smoke }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - http://keycloak:9000/health/ready
