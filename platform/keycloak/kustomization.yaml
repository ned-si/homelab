apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak

# Parity with the running cluster (ADR 0002). backup.yaml is kept in git but
# not rendered: the restic CronJobs ship with off-site backups (ADR 0008), once
# real storage credentials exist. Enabling them is one line here.
resources:
  - database.yaml
  - deployment.yaml
  - httproute.yaml
  - realm-settings.yaml

# Input of the realm-settings Job. The name hash makes a change here a new
# ConfigMap, so the Job always runs with the file it was synced with.
configMapGenerator:
  - name: keycloak-realm-settings
    files:
      - realm/sessions.conf
      - realm/platform.conf
      - realm/apply.sh
