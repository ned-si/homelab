apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak

resources:
  - database.yaml
  # WAL archiving and daily base backups to S3 (Barman Cloud plugin).
  - backup.yaml
  - deployment.yaml
  - httproute.yaml
  - realm-settings.yaml

# Input of the realm-settings Job. The name hash makes a change here a new
# ConfigMap, so the Job always runs with the file it was synced with.
configMapGenerator:
  - name: keycloak-realm-settings
    files:
      - realm/sessions.conf
      - realm/platform.conf
      - realm/clients.conf
      - realm/apply.sh

# Before every sync: a base backup, unless WAL archiving works and the last
# base backup is < 24 h old. After every sync: the management port reports
# ready.
components:
  - ../../components/presync-backup
  - ../../components/postsync-smoke
replacements:
  - source: { kind: Cluster, name: keycloak-db, fieldPath: spec.imageName }
    targets:
      - select: { kind: ConfigMap, name: presync-backup-desired }
        fieldPaths: [data.keycloak-db]
        options: { create: true }
patches:
  - target: { kind: Job, name: presync-backup }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: MODE, value: cnpg }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: CLUSTERS, value: keycloak-db }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: IMAGE_CHECKS, value: clusters.postgresql.cnpg.io/keycloak-db }
  - target: { kind: Job, name: postsync-smoke }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - http://keycloak:9000/health/ready
