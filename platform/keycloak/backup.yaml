# Keycloak database backup through the Barman Cloud plugin: continuous WAL
# archiving plus a daily base backup, into
# s3://ned-si-homelab-backups/cnpg/keycloak-db/, kept 30 days (point-in-time
# recovery anywhere in that window). Restore: docs/backups.md.
#
# Worth as much as it looks: this holds every user, every OIDC client and every
# role mapping. Losing it means rebuilding the realm by hand AND re-issuing every
# client secret referenced from `apps/secrets/`, because those live in Keycloak,
# not here.
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-backup
  namespace: keycloak
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://ned-si-homelab-backups/cnpg
    endpointURL: https://s3.eu-central-1.amazonaws.com
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      # boto3 signs for this region; it must match the bucket.
      - name: AWS_DEFAULT_REGION
        value: eu-central-1
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: keycloak-db-daily
  namespace: keycloak
spec:
  # Six fields (seconds first), UTC: 00:10 daily.
  schedule: "0 10 0 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: keycloak-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
