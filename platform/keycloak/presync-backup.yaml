# Before every sync of this Application, Argo CD takes a Barman Cloud base
# backup of keycloak-db (a CNPG Backup, method plugin) and waits for it to
# complete. A failed backup never completes, so the sync fails and nothing new
# is applied. This is what makes a database image bump safe to automerge: a
# major version upgrades the data files in place and cannot be reverted, so a
# bad one is fixed forward from this backup (docs/decisions.md).
#
# Hook objects: Argo CD recreates them on every sync (BeforeHookCreation), the
# RBAC and the Backup manifest first (wave -1).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: presync-backup
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: presync-backup
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: presync-backup
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: presync-backup
subjects:
  - kind: ServiceAccount
    name: presync-backup
    namespace: keycloak
---
# The Backup the Job creates. A ConfigMap, not a Backup object in the render:
# Argo CD would otherwise own it and prune or diff it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: presync-backup
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
data:
  backup.yaml: |
    apiVersion: postgresql.cnpg.io/v1
    kind: Backup
    metadata:
      name: presync-keycloak-db
      namespace: keycloak
    spec:
      cluster:
        name: keycloak-db
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: presync-backup
  namespace: keycloak
  labels:
    app.kubernetes.io/name: presync-backup
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: presync-backup
    spec:
      restartPolicy: Never
      serviceAccountName: presync-backup
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # The image has no shell: one container per kubectl call, in order. No
      # --request-timeout: any client override makes kubectl skip the
      # in-cluster config and dial localhost:8080.
      initContainers:
        - name: clean
          # renovate: datasource=docker depName=registry.k8s.io/kubectl
          image: registry.k8s.io/kubectl:v1.32.13
          args: ["delete", "backup.postgresql.cnpg.io", "presync-keycloak-db", "--ignore-not-found", "--wait=true"]
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: start
          # renovate: datasource=docker depName=registry.k8s.io/kubectl
          image: registry.k8s.io/kubectl:v1.32.13
          args: ["create", "-f", "/hook/backup.yaml"]
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: hook
              mountPath: /hook
              readOnly: true
      containers:
        - name: wait
          # renovate: datasource=docker depName=registry.k8s.io/kubectl
          image: registry.k8s.io/kubectl:v1.32.13
          # A failed backup never completes, so this times out and fails the
          # sync. The deadline is well above the slowest base backup.
          args: ["wait", "--for=jsonpath={.status.phase}=completed", "backup.postgresql.cnpg.io/presync-keycloak-db", "--timeout=45m"]
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: hook
          configMap:
            name: presync-backup
