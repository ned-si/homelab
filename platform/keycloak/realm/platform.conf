# Platform clients of the `homelab` realm, applied by apply.sh after
# sessions.conf. A stolen session on one of these is cluster-admin, so they
# require a fresh login once the last password login is older than
# loa_max_age seconds, while user apps keep the long SSO session.
#
# How: the realm's browser flow becomes `browser-loa`, the built-in browser
# flow with its password step behind "Condition - Level of Authentication"
# (level 1, max age below). These clients request ACR `platform` (level 1) by
# default; an SSO cookie whose level-1 login is older than the max age does
# not satisfy it, so Keycloak shows the login form. Clients that request no
# ACR (Immich, Mealie, Paperless, Seafile) are satisfied by the cookie alone.

# 12 hours.
loa_max_age=43200

# Client IDs, space-separated.
platform_clients=argocd grafana-oauth security-admin-console headlamp

# Clients deleted if present, space-separated. `myclient` is the Keycloak
# getting-started client: public, direct access grants on, redirects to
# keycloak.org. Listed here so it stays deleted.
removed_clients=myclient

# Confidential clients for oauth2-proxy, created if absent, as
# <clientId>:<group>, space-separated. apply.sh creates the client (standard
# flow only, PKCE S256, default scope `groups`, an audience mapper) and the
# group, and sets the client secret from the environment variable
# <CLIENT_ID>_CLIENT_SECRET (upper case, `-` as `_`). Group members stay in
# the admin console. Redirect URIs are in clients.conf.
proxy_clients=theater-sso:TheaterAdmins headlamp:admins
