# Platform clients of the `homelab` realm, applied by apply.sh after
# sessions.conf. A stolen session on one of these is cluster-admin, so they
# require a fresh login once the last password login is older than
# loa_max_age seconds, while user apps keep the long SSO session.
#
# How: the realm's browser flow becomes `browser-loa`, the built-in browser
# flow with its password step behind "Condition - Level of Authentication"
# (level 1, max age below). These clients request ACR `platform` (level 1) by
# default; an SSO cookie whose level-1 login is older than the max age does
# not satisfy it, so Keycloak shows the login form. Clients that request no
# ACR (Immich, Mealie, Paperless, Seafile) are satisfied by the cookie alone.

# 12 hours.
loa_max_age=43200

# Client IDs, space-separated.
platform_clients=argocd grafana-oauth security-admin-console
