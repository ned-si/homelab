# Platform clients of the `homelab` realm, applied by apply.sh after
# sessions.conf. A stolen session on one of these is cluster-admin, so they
# require a fresh login once the last password login is older than
# loa_max_age seconds, while user apps keep the long SSO session.
#
# How: the realm's browser flow becomes `browser-loa`, the built-in browser
# flow with its password step behind "Condition - Level of Authentication"
# (level 1, max age below). These clients request ACR `platform` (level 1) by
# default; an SSO cookie whose level-1 login is older than the max age does
# not satisfy it, so Keycloak shows the login form. Clients that request no
# ACR (Immich, Mealie, Paperless) are satisfied by the cookie alone.

# 12 hours.
loa_max_age=43200

# OTP for every group that grants an admin role in some app (access.conf):
# `admins` and the per-app admin groups. Members of mfa_groups get the realm
# role mfa_role. The
# password step of `browser-loa` and of every `access-<client>` flow is then
# followed by the OTP Form for holders of the role; one without an
# authenticator app is asked to set one up (required action CONFIGURE_TOTP).
# Everyone else keeps OTP optional: asked only when they set one up. Password
# grants skip this step; they are off (direct_grant_clients below).
mfa_role=mfa-required
mfa_groups=admins ArgoCDAdmins TheaterAdmins HomeAssistantAdmins

# OTP policy of both realms, as RealmRepresentation fields: what common
# authenticator apps expect.
otp_policy=otpPolicyType=totp otpPolicyDigits=6 otpPolicyPeriod=30 otpPolicyAlgorithm=HmacSHA1

# The Keycloak admin (realm `master`). Its browser flow `browser-otp` asks
# every master user for password and OTP. The keycloak-realm-settings Job logs
# in as this confidential master client (client credentials, master role
# `admin`, secret from <CLIENT_ID>_CLIENT_SECRET as for proxy_clients), so the
# admin's OTP never blocks it; the admin password is only its fallback on a
# new database. apply.sh binds `browser-otp` only after a login as this client
# works. Only then does it turn the password grant off on every master client
# (`admin-cli` included, directAccessGrantsEnabled=false, read back): a
# password grant skips the OTP of `browser-otp`. A new database starts with
# Keycloak's defaults, so the fallback still works on its first run.
automation_client=realm-settings

# Fields of sessions.conf also written to the `master` realm, by name: the
# brute-force detection of `homelab`, with its temporary lockout only. Master
# sessions stay at the Keycloak defaults.
master_fields=bruteForceProtected permanentLockout failureFactor waitIncrementSeconds maxFailureWaitSeconds maxDeltaTimeSeconds quickLoginCheckMilliSeconds minimumQuickLoginWaitSeconds

# Login events and admin events of both realms, kept this many seconds
# (7 days): Keycloak's record of each user's last login and of every admin
# change. Admin events keep no representation (adminEventsDetailsEnabled=false):
# the Job writes client secrets on every run.
events_expiration=604800

# Client IDs, space-separated.
platform_clients=argocd grafana-oauth security-admin-console headlamp hubble signoz syncthing

# Clients deleted if present, space-separated. `myclient` is the Keycloak
# getting-started client: public, direct access grants on, redirects to
# keycloak.org. Listed here so it stays deleted.
removed_clients=myclient

# Confidential clients for oauth2-proxy, created if absent, as
# <clientId>:<group>, space-separated. apply.sh creates the client (standard
# flow only, PKCE S256, default scope `groups`, an audience mapper) and the
# group, and sets the client secret from the environment variable
# <CLIENT_ID>_CLIENT_SECRET (upper case, `-` as `_`). Group members stay in
# the admin console. Redirect URIs are in clients.conf.
proxy_clients=theater-sso:TheaterAdmins headlamp:admins hubble:admins signoz:admins syncthing:admins

# The pentest test user and its setup client (docs/pentest/README.md, Setup
# credentials). apply.sh creates pentest_user and keeps it disabled between
# runs (every sync disables it) and a member of pentest_group only, never of
# an mfa_groups group.
# pentest_client is a confidential client with the service account only; its
# secret comes from <CLIENT_ID>_CLIENT_SECRET
# (platform/secrets/keycloak-pentest.sops.yaml). Its service account holds
# realm-management `query-users` and nothing else, and one fine-grained admin
# permission (adminPermissionsEnabled on this realm) gives it `view` and
# `manage` on pentest_user alone: it can set that user's password, enable,
# disable and log it out (scripts/pentest-keycloak-user.sh), and reach no
# other user, group or role.
pentest_user=pentest-family
pentest_group=family
pentest_client=pentest-setup

# Clients of the `homelab` realm allowed the password grant (direct access
# grants), space-separated, each with its reason in a comment here. Every
# other client gets directAccessGrantsEnabled=false and the Job reads it back
# (requirement 6.4): a password grant skips OTP and the login page's
# brute-force wait. None needs it: every app logs in with the code flow.
direct_grant_clients=
