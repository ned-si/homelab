# Who may log in to each app client of the `homelab` realm, applied by
# apply.sh after clients.conf. One `<clientId>=<groups>` per line, groups
# space-separated.
#
# For each client, apply.sh creates the client role `access`, maps exactly
# the listed groups to it (creating missing groups), and binds the client to
# its own browser and direct-grant flows: the `browser-loa` login (or the
# password grant) followed by "Condition - user role" (not `<clientId>.access`)
# and "Deny access". The check runs after the cookie, so an SSO session for
# one app does not open another. Clients not listed here keep the realm flows.
#
# Users and their group membership stay in the admin console: a new user gets
# no app until they are added to a group.
#   family  household and relatives: the user apps
#   media   friends: photos and books
#   admins  the operator: every app

argocd=admins ArgoCDAdmins
grafana-oauth=admins
theater-sso=admins TheaterAdmins
home-assistant=admins HomeAssistantAdmins family
immich=admins family media
audiobookshelf=admins family media
calibre-web=admins family media
mealie=admins family
paperless=admins family
