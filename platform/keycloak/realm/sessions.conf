# Session and token lifetimes of the `homelab` realm, applied by the
# keycloak-realm-settings Job (realm-settings.yaml) after every sync.
#
# One `<RealmRepresentation field>=<value>` per line, durations in seconds.
# Only the fields listed here are written; users, credentials, clients and
# every other realm setting are left as they are.
#
# Goal: user apps log in once per device and stay logged in. A session ends
# only after 30 days without use, or one year after login (two values below
# for users who tick "Remember me"). Offline tokens (scope offline_access)
# expire after one year without use and have no absolute maximum. Platform
# clients log in again after 12 hours regardless (platform.conf).

# SSO session: 30 days idle, 365 days max.
ssoSessionIdleTimeout=2592000
ssoSessionMaxLifespan=31536000

# "Remember me" on the login page: 180 days idle, 365 days max.
rememberMe=true
ssoSessionIdleTimeoutRememberMe=15552000
ssoSessionMaxLifespanRememberMe=31536000

# Offline sessions: 365 days idle, no maximum.
offlineSessionIdleTimeout=31536000
offlineSessionMaxLifespanEnabled=false

# Client sessions inherit the SSO and offline values above (0 = inherit), so
# refresh tokens live as long as the session that issued them.
clientSessionIdleTimeout=0
clientSessionMaxLifespan=0
clientOfflineSessionIdleTimeout=0
clientOfflineSessionMaxLifespan=0

# Access tokens stay short (5 minutes); clients renew them with the refresh
# token. Refresh token rotation stays at the realm default (off), so two tabs
# refreshing at once do not log each other out.
accessTokenLifespan=300

# Brute-force detection (spec wave3-runtime-security, requirement 6.1): after
# 10 failures the account waits 60 s, doubling per further failure up to 15
# minutes; failures are forgotten after 12 hours. Never a permanent lockout:
# with one operator, an attacker could otherwise lock out the only admin. A
# login within 1 s of the previous one counts as a robot and waits 60 s.
# (Until 2026-10-24 the realm had this on from the UI, with a permanent
# lockout after 30 failures.)
bruteForceProtected=true
permanentLockout=false
failureFactor=10
waitIncrementSeconds=60
maxFailureWaitSeconds=900
maxDeltaTimeSeconds=43200
quickLoginCheckMilliSeconds=1000
minimumQuickLoginWaitSeconds=60
