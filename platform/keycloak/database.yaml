# Keycloak's Postgres, managed by CloudNativePG.
#
# CloudNativePG generates a Secret named `<cluster>-app` containing host, port,
# user, password, dbname, uri and jdbc-uri. The Deployment reads `jdbc-uri` from
# it, so the database password never appears in this repo in any form -- not
# even encrypted. That is strictly better than a SOPS-managed password: there is
# no value to rotate, leak or forget.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  instances: 1
  # Pin the Postgres image. Leaving this unset means the operator picks its own
  # default, which silently changes major version across operator upgrades and
  # would refuse to start on an existing data directory.
  #
  # PINNED TO 17.0, THE RUNNING VERSION -- not 17.6 like the other clusters, and
  # deliberately so. CloudNativePG refuses to change the image and the PostgreSQL
  # configuration in the same apply:
  #
  #   spec.imageName: Can't change image name and configuration at the same time.
  #   There are differences in PostgreSQL configuration parameters:
  #   {"max_connections":["","100"],"shared_buffers":["","64MB"]}
  #
  # This cluster is the only one that sets `postgresql.parameters`, so it is the
  # only one that hits the rule. Applying the tuning first and letting Renovate
  # propose 17.0 -> 17.6 as an isolated, image-only change satisfies CNPG and
  # keeps the version bump reviewable on its own. Verified with a server-side
  # dry-run against the live operator (1.24.1).
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:17.0
  storage:
    size: 5Gi
    storageClass: iscsi
  monitoring:
    enablePodMonitor: true
  # Continuous WAL archiving to S3, in-tree form (CNPG 1.24 cannot use the
  # Barman Cloud plugin -- see apps/immich/resources/backup.yaml).
  #
  # Retention is longer than Immich's 30d: this database is tiny, so retention is
  # nearly free, and a bad realm change can go unnoticed for weeks.
  backup:
    retentionPolicy: "90d"
    barmanObjectStore:
      destinationPath: s3://homelab-backups/keycloak/postgres
      endpointURL: https://s3.eu-central-003.backblazeb2.com
      s3Credentials:
        accessKeyId:
          name: s3-backup
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: s3-backup
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 1
      data:
        compression: gzip
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 64MB
