# Credentials from SOPS Secrets (secretKeyRef); PVCs carry
# argocd.argoproj.io/sync-options: Delete=false,Prune=false (ADR 0002).
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  # postgres, bootstrap init and the operator's Jobs; 14-day sizing (#726).
  resources:
    requests:
      cpu: 30m
      memory: 112Mi
    limits:
      memory: 512Mi
  instances: 1
  # The full image, not -minimal-trixie: the minimal image breaks keycloak-db.
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11@sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e
  storage:
    size: 5Gi
  # Created from its Barman Cloud backup; archives under a new server name
  # (CNPG refuses a non-empty path; the old one stays readable). docs/bootstrap.md
  bootstrap:
    recovery:
      source: origin
      database: app
      owner: app
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        # Webhook defaults, stated so the server-side apply diff stays clean.
        enabled: true
        isWALArchiver: false
        parameters:
          barmanObjectName: cnpg-backup
          serverName: keycloak-db
  # WAL archiving and base backups to S3 (backup.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # The webhook defaults this; stating it keeps Argo CD's diff clean.
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-backup
        serverName: keycloak-db-t1
