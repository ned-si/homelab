# The admin console and admin REST API on the tailnet, off the internet
# (pentest 2026-11-10 E1, #1293): https://keycloak-admin.tail32a1fc.ts.net,
# a Tailscale Ingress proxy tagged tag:k8s-admin, which only the tailnet owner
# and admins reach (bootstrap/tailscale/policy.hujson). KC_HOSTNAME_ADMIN in
# deployment.yaml points the console here; the public HTTPRoute no longer
# routes /admin or /realms/master.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-admin
  namespace: keycloak
  annotations:
    tailscale.com/tags: tag:k8s-admin
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: keycloak-http
      port:
        number: 8080
  tls:
    - hosts:
        - keycloak-admin
---
# The Tailscale Ingress needs a backend with a ClusterIP; `keycloak`
# (deployment.yaml) is headless.
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: keycloak
  name: keycloak-http
  namespace: keycloak
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: keycloak
