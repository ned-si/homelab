# Realm settings as code: after every sync of the `keycloak` Application,
# this Job writes realm/sessions.conf and realm/platform.conf to the `homelab`
# realm with kcadm.sh and verifies them (realm/apply.sh). A failed Job fails
# the sync, which the auto-rollback workflow treats like any other failed
# deploy.
#
# Scope is deliberately those two files: realm session fields, the
# `browser-loa` flow and the default ACR of the platform clients. Users,
# credentials, other client settings and groups stay managed in the Keycloak
# admin console.
#
# The image is the server's image (deployment.yaml); keep the two equal.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-settings
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak-realm-settings
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-realm-settings
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kcadm
          # renovate: datasource=docker depName=quay.io/keycloak/keycloak
          image: quay.io/keycloak/keycloak:26.0.8
          command: ["/bin/bash", "/realm/apply.sh"]
          env:
            - name: KC_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: realm
              mountPath: /realm
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm-settings
        - name: tmp
          emptyDir: {}
