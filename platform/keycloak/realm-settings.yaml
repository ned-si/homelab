# Realm settings as code: after every `keycloak` sync, this Job applies
# realm/*.conf to the realms with kcadm.sh and verifies them (realm/apply.sh).
# A failed Job fails the sync, which auto-rollback treats as a failed deploy.
# Users, group members, credentials and anything the files do not name stay
# in the admin console. Keep the image equal to deployment.yaml's.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-settings
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak-realm-settings
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  # kcadm.sh starts a JVM per call (~2 s); access.conf alone is ~15 calls per
  # client, ~60 more when its flows are (re)built.
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-realm-settings
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kcadm
          # renovate: datasource=docker depName=quay.io/keycloak/keycloak
          image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
          command: ["/bin/bash", "/realm/apply.sh"]
          env:
            - name: KC_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            # Secrets of the platform.conf `proxy_clients`
            # (platform/secrets/keycloak-proxy-clients.sops.yaml). Optional:
            # apply.sh warns and leaves the secret alone when it is missing.
            - name: THEATER_SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-proxy-clients
                  key: THEATER_SSO_CLIENT_SECRET
                  optional: true
            # platform/secrets/headlamp-sso.sops.yaml.
            - name: HEADLAMP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-headlamp-client
                  key: HEADLAMP_CLIENT_SECRET
                  optional: true
            # platform/secrets/hubble-sso.sops.yaml.
            - name: HUBBLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-hubble-client
                  key: HUBBLE_CLIENT_SECRET
                  optional: true
            # The Job's own master client (platform.conf `automation_client`).
            # Without it the Job falls back to the admin password, which works
            # only while master admin-cli allows the password grant.
            - name: REALM_SETTINGS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-automation
                  key: REALM_SETTINGS_CLIENT_SECRET
                  optional: true
            # platform/secrets/signoz-sso.sops.yaml.
            - name: SIGNOZ_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-signoz-client
                  key: SIGNOZ_CLIENT_SECRET
                  optional: true
            # platform/secrets/syncthing-sso.sops.yaml.
            - name: SYNCTHING_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-syncthing-client
                  key: SYNCTHING_CLIENT_SECRET
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: realm
              mountPath: /realm
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm-settings
        - name: tmp
          emptyDir: {}
