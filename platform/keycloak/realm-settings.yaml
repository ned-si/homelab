# Realm settings as code: after every sync of the `keycloak` Application,
# this Job writes realm/sessions.conf, realm/platform.conf,
# realm/clients.conf and realm/access.conf to the `homelab` realm with
# kcadm.sh and verifies them (realm/apply.sh). A failed Job fails the sync,
# which the auto-rollback workflow treats like any other failed deploy.
#
# Scope is deliberately those four files: realm session fields, the
# `browser-loa` flow, the default ACR of the platform clients, the clients
# that must not exist (`removed_clients`), the oauth2-proxy clients and their
# groups (`proxy_clients`), the redirect URIs and web origins of the app
# clients, and per-client access (the `access` role, the groups mapped to it,
# the client's `access-<client>` flows). Users, group members, credentials,
# other client settings and other groups stay managed in the Keycloak admin
# console.
#
# The image is the server's image (deployment.yaml); keep the two equal.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-settings
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak-realm-settings
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  # kcadm.sh starts a JVM per call (~2 s); access.conf alone is ~15 calls per
  # client, ~40 more when its flows are first built.
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-realm-settings
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kcadm
          # renovate: datasource=docker depName=quay.io/keycloak/keycloak
          image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
          command: ["/bin/bash", "/realm/apply.sh"]
          env:
            - name: KC_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            # Secrets of the platform.conf `proxy_clients`
            # (platform/secrets/keycloak-proxy-clients.sops.yaml). Optional:
            # apply.sh warns and leaves the secret alone when it is missing.
            - name: THEATER_SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-proxy-clients
                  key: THEATER_SSO_CLIENT_SECRET
                  optional: true
            # platform/secrets/headlamp-sso.sops.yaml.
            - name: HEADLAMP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-headlamp-client
                  key: HEADLAMP_CLIENT_SECRET
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: realm
              mountPath: /realm
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm-settings
        - name: tmp
          emptyDir: {}
