# The plugin's namespaced rights, granted only where a CNPG Cluster uses it.
#
# The upstream ClusterRole `plugin-barman-cloud` is patched in
# kustomization.yaml: it keeps get/list/watch on roles and rolebindings
# cluster-wide and loses secrets. The rest moves here, one Role and RoleBinding
# per namespace:
#
#   secrets              get, list, watch   The plugin never reads a Secret. It
#                                           creates a Role `<cluster>-barman-cloud`
#                                           that grants the Cluster's pods these
#                                           verbs on the ObjectStore credential
#                                           Secrets, and RBAC escalation
#                                           prevention requires it to hold them
#                                           in that namespace.
#   roles, rolebindings  create, patch,     It creates and patches that Role and
#                        update             its RoleBinding in the Cluster's
#                                           namespace.
#
# get/list/watch on roles and rolebindings stay cluster-wide: the plugin reads
# them through controller-runtime's shared cache with no namespace restriction
# (internal/cnpgi/operator/manager.go at v0.15.1), so its informers list and
# watch every namespace. Without that they never sync and the Pre hook fails for
# every Cluster.
#
# Roles rather than one ClusterRole bound per namespace: a ClusterRole with
# secrets access is a CRITICAL Trivy finding (KSV-0041) whose waiver would rest
# on there being no ClusterRoleBinding, which nothing checks.
#
# Every namespace with an ObjectStore needs its pair here. Without it, a new
# Cluster gets no Role, its pods cannot read their credentials and WAL
# archiving never starts. The namespaces are set by the transformers in
# kustomization.yaml, because `namespace: immich` overrides the ones written
# here.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plugin-barman-cloud-immich
  namespace: immich
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plugin-barman-cloud-immich
  namespace: immich
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: plugin-barman-cloud-immich
subjects:
  - kind: ServiceAccount
    name: plugin-barman-cloud
    namespace: immich
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plugin-barman-cloud-keycloak
  namespace: keycloak
rules:
