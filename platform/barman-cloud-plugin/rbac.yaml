# The plugin's namespaced rights, granted only where a CNPG Cluster uses it.
# The upstream ClusterRole is patched in kustomization.yaml to lose secrets.
#
# Per namespace: secrets get/list/watch (the plugin never reads one, but RBAC
# escalation prevention requires it to hold what its `<cluster>-barman-cloud`
# Role grants) and create/patch/update on roles and rolebindings. Reads of
# roles and rolebindings stay cluster-wide: its shared cache watches every
# namespace.
#
# Roles, not a ClusterRole bound per namespace: a ClusterRole with secrets is
# a critical Trivy finding (KSV-0041). Every namespace with an ObjectStore
# needs its pair here, or WAL archiving never starts; namespaces are set by
# the transformers in kustomization.yaml.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plugin-barman-cloud-immich
  namespace: immich
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plugin-barman-cloud-immich
  namespace: immich
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: plugin-barman-cloud-immich
subjects:
  - kind: ServiceAccount
    name: plugin-barman-cloud
    namespace: immich
---
