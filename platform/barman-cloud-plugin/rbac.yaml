---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plugin-barman-cloud-keycloak
  namespace: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: plugin-barman-cloud-keycloak
subjects:
  - kind: ServiceAccount
    name: plugin-barman-cloud
    namespace: immich
