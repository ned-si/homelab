apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The plugin must run in the CloudNativePG operator's namespace, which is
# `immich` (see clusters/homelab/platform/cnpg.yaml).
namespace: immich

# The upstream release bundle (CRD `ObjectStore`, Deployment, Certificate).
# It speaks CNPG-I to the operator, so Renovate groups it with the
# cloudnative-pg chart.
#
# renovate: datasource=github-releases depName=cloudnative-pg/plugin-barman-cloud
resources:
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.16.0/manifest.yaml
  # PodMonitor for the CNPG instances and the backup alert rules.
  - monitoring.yaml
  # The namespaced half of the plugin's RBAC, bound per namespace (#951).
  - rbac.yaml

patches:
  # Narrow the upstream ClusterRole (#951): no secrets, and only the reads on
  # roles and rolebindings, which its cluster-wide cache needs. rbac.yaml grants
  # the rest per namespace. The `test` ops fail the render when a bundle bump
  # moves or changes these rules, so the split is re-checked on every bump.
  - target:
      kind: ClusterRole
      name: plugin-barman-cloud
    patch: |-
      - op: test
        path: /rules/0/resources
        value: [secrets]
      - op: test
        path: /rules/0/verbs
        value: [create, delete, get, list, watch]
      - op: test
        path: /rules/6/resources
        value: [rolebindings, roles]
      - op: test
        path: /rules/6/verbs
        value: [create, get, list, patch, update, watch]
      - op: replace
        path: /rules/6/verbs
        value: [get, list, watch]
      - op: remove
        path: /rules/0
  # Digests for the bundle's two images (E10). The bundle sets both by tag,
  # SIDECAR_IMAGE through its own Secret; the patch sets it inline instead.
  # Renovate moves both with the bundle URL (group `cloudnative-pg`); keep
  # their tags equal to the release in the URL above.
  - target:
      kind: Deployment
      name: barman-cloud
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: barman-cloud
      spec:
        template:
          spec:
            containers:
              - name: barman-cloud
                # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/plugin-barman-cloud
                image: ghcr.io/cloudnative-pg/plugin-barman-cloud:v0.16.0@sha256:6404a416718bd7aad943c67a25a7bb20d0558b43edfeab0bf167f013ca435882
                env:
                  - name: SIDECAR_IMAGE
                    # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar
                    value: ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar:v0.16.0@sha256:c669259e20ed1e11fad821f735c396c19d929985aa05b9544b13ecc8b5a386d0
                    valueFrom: null
  # Liveness (#726 task 20): the bundle ships only a TCP readiness probe. The
  # same port, slower: a hung plugin blocks every CNPG backup. The `test` ops
  # fail the render when a bump renames the container or moves its port.
  - target:
      kind: Deployment
      name: barman-cloud
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: barman-cloud
      - op: test
        path: /spec/template/spec/containers/0/readinessProbe/tcpSocket/port
        value: 9090
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          tcpSocket:
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5

# `namespace: immich` above overrides every namespace, so the Roles and
# RoleBindings of rbac.yaml get theirs back here. Transformers run after it.
transformers:
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: plugin-barman-cloud-keycloak
    target: { name: plugin-barman-cloud-keycloak }
    patch: '[{"op": "replace", "path": "/metadata/namespace", "value": "keycloak"}]'
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: plugin-barman-cloud-mealie
    target: { name: plugin-barman-cloud-mealie }
    patch: '[{"op": "replace", "path": "/metadata/namespace", "value": "mealie"}]'
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: plugin-barman-cloud-home
    target: { name: plugin-barman-cloud-home }
    patch: '[{"op": "replace", "path": "/metadata/namespace", "value": "home"}]'
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: plugin-barman-cloud-theater
    target: { name: plugin-barman-cloud-theater }
    patch: '[{"op": "replace", "path": "/metadata/namespace", "value": "theater"}]'
  - |-
    apiVersion: builtin
    kind: PatchTransformer
    metadata:
      name: plugin-barman-cloud-backup-verify
    target: { name: plugin-barman-cloud-backup-verify }
    patch: '[{"op": "replace", "path": "/metadata/namespace", "value": "backup-verify"}]'
