apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cnpg-system

# The upstream release bundle. Installs the CRD (`ObjectStore`), the plugin
# Deployment and its cert-manager Certificate.
#
# Must be kept compatible with the CloudNativePG operator version -- the plugin
# speaks CNPG-I to the operator. Renovate groups this with the cloudnative-pg
# chart so they are reviewed together.
#
# renovate: datasource=github-releases depName=cloudnative-pg/plugin-barman-cloud
resources:
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.15.1/manifest.yaml
