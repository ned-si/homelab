---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  selector:
    matchLabels: {app: cert-manager}
  template:
    metadata:
      labels: {app: cert-manager}
    spec:
      containers:
        - name: controller
          image: quay.io/jetstack/cert-manager-controller:v1.21.3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-cainjector
  namespace: cert-manager
spec:
  selector:
    matchLabels: {app: cainjector}
  template:
    metadata:
      labels: {app: cainjector}
    spec:
      containers:
        - name: cainjector
          image: quay.io/jetstack/cert-manager-cainjector:v1.21.3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-other
  namespace: cert-manager
spec:
  selector:
    matchLabels: {app: other}
  template:
    metadata:
      labels: {app: other}
    spec:
      containers:
        - name: other
          image: quay.io/jetstack/cert-manager-controller:v1.21.3
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tetragon
  namespace: tetragon
spec:
  selector:
    matchLabels: {app: tetragon}
  template:
    metadata:
      labels: {app: tetragon}
    spec:
      containers:
        - name: tetragon
          image: quay.io/cilium/tetragon:v1.8.0
          securityContext:
            capabilities:
              add: [SYS_ADMIN, SYS_PTRACE, SYS_RESOURCE, DAC_OVERRIDE, SYSLOG]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: not-tetragon
  namespace: tetragon
spec:
  selector:
    matchLabels: {app: not-tetragon}
  template:
    metadata:
      labels: {app: not-tetragon}
    spec:
      containers:
        - name: agent
          image: quay.io/cilium/tetragon:v1.8.0
          securityContext:
            capabilities:
              add: [SYS_ADMIN]
