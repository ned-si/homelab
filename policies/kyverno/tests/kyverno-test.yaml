# Policy unit tests: `kyverno test policies/kyverno/tests`. They cover the
# homelab policy and the vendored policies CI blocks on or relies on.
---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: baseline-policies
policies:
  - ../upstream/best-practices-vpol/disallow-latest-tag/disallow-latest-tag.yaml
  - ../upstream/pod-security-vpol/baseline/disallow-privileged-containers/disallow-privileged-containers.yaml
  - ../upstream/best-practices-vpol/require-pod-requests-limits/require-pod-requests-limits.yaml
  - ../drop-cap-net-raw.yaml
  - ../require-probes.yaml
resources:
  - resources.yaml
results:
  - policy: disallow-latest-tag
    isValidatingPolicy: true
    resources: [good]
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    isValidatingPolicy: true
    resources: [probed]
    kind: Deployment
    result: pass
  - policy: disallow-latest-tag
    isValidatingPolicy: true
    resources: [latest-tag, no-tag]
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    isValidatingPolicy: true
    resources: [latest-cron]
    kind: CronJob
    result: fail
  - policy: disallow-privileged-containers
    isValidatingPolicy: true
    resources: [good]
    kind: Pod
    result: pass
  - policy: disallow-privileged-containers
    isValidatingPolicy: true
    resources: [privileged]
    kind: Pod
    result: fail
  - policy: disallow-privileged-containers
    isValidatingPolicy: true
    resources: [privileged-deploy]
    kind: Deployment
    result: fail
  - policy: require-requests-limits
    isValidatingPolicy: true
    resources: [good]
    kind: Pod
    result: pass
  - policy: require-requests-limits
    isValidatingPolicy: true
    resources: [no-limits]
    kind: Pod
    result: fail
  - policy: require-probes
    isValidatingPolicy: true
    resources: [probed]
    kind: Deployment
    result: pass
  - policy: require-probes
    isValidatingPolicy: true
    resources: [no-liveness]
    kind: Deployment
    result: fail
  # `drop: [ALL]` counts, which is what upstream's copy failed on.
  - policy: drop-cap-net-raw
    isValidatingPolicy: true
    resources: [cap-drop-all, cap-drop-net-raw]
    kind: Pod
    result: pass
  - policy: drop-cap-net-raw
    isValidatingPolicy: true
    resources: [cap-no-drop]
    kind: Pod
    result: fail
