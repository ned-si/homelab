# Framework controls per Kyverno policy (the vendored set and the homelab
# require-probes). tests/test_security_controls.py fails when a policy has no
# entry, an entry names no policy, or an ID is malformed. Kept here, not as
# annotations, so the vendored files stay byte for byte upstream.
#
#   cis           CIS Kubernetes Benchmark v1.10, section 5 (policies)
#   nist_800_190  NIST SP 800-190, section 4 (countermeasures)
#   nsa_cisa      NSA/CISA Kubernetes Hardening Guide v1.2, "<section>: <subsection>"
#   csf           NIST CSF 2.0 subcategory
#
# CIS sections 1 to 4 (control plane, etcd, kubelet and their files) are set
# by Talos, not by admission policy (docs/threat-model.md).
frameworks:
  cis: CIS Kubernetes Benchmark v1.10
  nist_800_190: NIST SP 800-190 Application Container Security Guide
  nsa_cisa: NSA/CISA Kubernetes Hardening Guide v1.2
  csf: NIST Cybersecurity Framework 2.0

policies:
