# Every container drops CAP_NET_RAW (CIS 5.2.8); `drop: [ALL]` counts.
# Upstream require-drop-cap-net-raw accepts only an explicit NET_RAW entry.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: drop-cap-net-raw
  annotations:
    policies.kyverno.io/title: Drop CAP_NET_RAW
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: mustDropCapabilities
      expression: "['CAP_NET_RAW','NET_RAW','ALL']"
    - name: allContainers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])"
  validations:
    - expression: >-
        variables.allContainers.all(container,
        container.?securityContext.?capabilities.?drop.orValue([]).exists(capability, capability.upperAscii() in variables.mustDropCapabilities))
      message: >-
        Containers must drop the `CAP_NET_RAW` capability (or `ALL`).
