# Every container gives up CAP_NET_RAW, so no workload can forge packets or
# bind a raw socket (CIS 5.2.8). `drop: [ALL]` counts: it is what the repo sets
# everywhere and it drops NET_RAW with everything else.
#
# Upstream best-practices-vpol/require-drop-cap-net-raw matches an explicit
# CAP_NET_RAW or NET_RAW entry only, so it fails the stricter `drop: [ALL]` and
# reported every workload here -- upstream says as much ("may not strictly
# conform to the Pod Security Standards"). drop-all-capabilities (CIS 5.2.10)
# covers the containers that drop nothing at all.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: drop-cap-net-raw
  annotations:
    policies.kyverno.io/title: Drop CAP_NET_RAW
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: mustDropCapabilities
      expression: "['CAP_NET_RAW','NET_RAW','ALL']"
    - name: allContainers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])"
  validations:
    - expression: >-
        variables.allContainers.all(container,
        container.?securityContext.?capabilities.?drop.orValue([]).exists(capability, capability.upperAscii() in variables.mustDropCapabilities))
      message: >-
        Containers must drop the `CAP_NET_RAW` capability (or `ALL`).
