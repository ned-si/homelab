# Every container image names a tag (or a digest), and the tag is not
# `latest`: a deploy must be reproducible from git, and Renovate can only bump
# what is pinned.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow the latest tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  variables:
    - name: pod
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: images
      expression: >-
        (variables.pod.containers + variables.pod.?initContainers.orValue([])
        + variables.pod.?ephemeralContainers.orValue([])).map(c, c.image)
  validations:
    # The last path segment carries the tag; a registry port is not a tag.
    - expression: >-
        variables.images.all(i, i.contains('@') || i.split('/')[i.split('/').size() - 1].contains(':'))
      message: Every image needs an explicit tag or digest.
    - expression: >-
        variables.images.all(i, !i.split('@')[0].endsWith(':latest'))
      message: The latest tag is not allowed.
