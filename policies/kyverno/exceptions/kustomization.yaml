# Expected findings, one PolicyException per workload with its
# `homelab/reason`, in the `kyverno` namespace (the only one Kyverno reads).
# Also passed to `kyverno apply` by scripts/ci/kyverno.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cert-manager.yaml
  - democratic-csi-controller.yaml
  - democratic-csi-node.yaml
  - grafana.yaml
  - lan-inventory.yaml
  - node-exporter.yaml
  - signoz-clickhouse-operator.yaml
  - tetragon.yaml
  - vector.yaml
