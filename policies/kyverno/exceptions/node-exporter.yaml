# Expected findings of monitoring/kube-prometheus-stack-prometheus-node-exporter: disallow-host-path, disallow-host-namespaces.
# Matched by namespace and name prefix, so the controller, its ReplicaSets and
# its pods are covered and nothing else in the namespace is.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: node-exporter
  namespace: kyverno
  annotations:
    homelab/reason: >-
      node-exporter reads the host's /proc, /sys and root filesystem with host PID and network, which is what it measures.
spec:
  policyRefs:
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: disallow-host-namespaces
      kind: ValidatingPolicy
  matchConditions:
    - name: node-exporter
      expression: >-
        object.metadata.namespace == 'monitoring' &&
        object.metadata.name.startsWith('kube-prometheus-stack-prometheus-node-exporter')
