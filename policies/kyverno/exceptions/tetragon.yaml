# Expected findings of tetragon/tetragon (the agent DaemonSet):
# disallow-privileged-containers, disallow-host-namespaces, disallow-host-path,
# disallow-host-ports. Matched by namespace and name prefix; the operator
# Deployment (tetragon-operator) needs none of them but shares the prefix.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: tetragon
  namespace: kyverno
  annotations:
    homelab/reason: >-
      The Tetragon agent loads eBPF programs into the kernel: privileged,
      hostNetwork, and the host's /sys/kernel, BPF filesystem, /proc and
      container runtime paths (platform/tetragon/values.yaml).
spec:
  policyRefs:
    - name: disallow-privileged-containers
      kind: ValidatingPolicy
    - name: disallow-host-namespaces
      kind: ValidatingPolicy
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: disallow-host-ports
      kind: ValidatingPolicy
  matchConditions:
    - name: tetragon
      expression: >-
        object.metadata.namespace == 'tetragon' &&
        object.metadata.name.startsWith('tetragon')
