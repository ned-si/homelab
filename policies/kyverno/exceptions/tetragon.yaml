# Expected findings of the tetragon agent DaemonSet: disallow-capabilities
# (SYS_ADMIN, SYS_PTRACE, SYS_RESOURCE, DAC_OVERRIDE, SYSLOG),
# disallow-host-namespaces, disallow-host-path, disallow-host-ports. Matched
# by name prefix.
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: tetragon
  namespace: kyverno
  annotations:
    homelab/reason: >-
      The Tetragon agent loads eBPF programs into the kernel: privileged (or,
      from chart 1.8, the capabilities it needs for that), hostNetwork, and
      the host's /sys/kernel, BPF filesystem, /proc and container runtime
      paths (platform/tetragon/values.yaml).
spec:
  policyRefs:
    - name: disallow-privileged-containers
      kind: ValidatingPolicy
    - name: disallow-capabilities
      kind: ValidatingPolicy
    - name: disallow-host-namespaces
      kind: ValidatingPolicy
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: disallow-host-ports
      kind: ValidatingPolicy
  matchConditions:
    - name: tetragon
      expression: >-
        object.metadata.namespace == 'tetragon' &&
        object.metadata.name.startsWith('tetragon')
