# promtool unit tests for the disk alerts of
# platform/kube-prometheus-stack/routes/nas-alerts.yaml (NASSmartTestFailed,
# NASDiskHot). Run: scripts/ci/promtool-check.sh (CI: render job).
rule_files:
  - homelab-nas.yaml

evaluation_interval: 1m

tests:
  # ada1's newest short self-test fails at minute 10; ada0's keeps passing.
  - interval: 1m
    input_series:
      - series: 'truenas_disk_smart_last_test_success{disk="ada1", test="short"}'
        values: '1x9 0x20'
      - series: 'truenas_disk_smart_last_test_success{disk="ada0", test="short"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: NASSmartTestFailed
        exp_alerts: []
      - eval_time: 16m
        alertname: NASSmartTestFailed
        exp_alerts:
          - exp_labels:
              disk: ada1
              test: short
              severity: warning
            exp_annotations:
              summary: NAS disk ada1 failed its SMART self-test
              description: >-
                The newest short self-test on ada1 did
                not pass. Plan a replacement; read the SMART log in the TrueNAS UI.

  # ada2 runs at 70 C from minute 10; ada3 at exactly 65 C does not count;
  # ada4 spikes to 68 C for 10 minutes only.
  - interval: 1m
    input_series:
      - series: 'truenas_disk_temperature_celsius{disk="ada2"}'
        values: '40x9 70x50'
      - series: 'truenas_disk_temperature_celsius{disk="ada3"}'
        values: '65x60'
      - series: 'truenas_disk_temperature_celsius{disk="ada4"}'
        values: '40x9 68x9 40x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: NASDiskHot
        exp_alerts: []
      - eval_time: 45m
        alertname: NASDiskHot
        exp_alerts:
          - exp_labels:
              disk: ada2
              severity: warning
            exp_annotations:
              summary: NAS disk ada2 is at 70 C
              description: >-
                Above 65 C for 30 minutes. Check the case airflow and fans.
