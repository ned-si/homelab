# promtool unit tests for the disk alerts of
# platform/kube-prometheus-stack/routes/nas-alerts.yaml (NASDiskHot).
# Run: scripts/ci/promtool-check.sh (CI: promtool job).
rule_files:
  - homelab-nas.yaml

evaluation_interval: 1m

tests:
  # ada2 runs at 70 C from minute 10; ada3 at exactly 65 C does not count;
  # ada4 spikes to 68 C for 10 minutes only.
  - interval: 1m
    input_series:
      - series: 'truenas_disk_temperature_celsius{disk="ada2"}'
        values: '40x9 70x50'
      - series: 'truenas_disk_temperature_celsius{disk="ada3"}'
        values: '65x60'
      - series: 'truenas_disk_temperature_celsius{disk="ada4"}'
        values: '40x9 68x9 40x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: NASDiskHot
        exp_alerts: []
      - eval_time: 45m
        alertname: NASDiskHot
        exp_alerts:
          - exp_labels:
              disk: ada2
              severity: warning
              action: human
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/NASDiskHot.md
              summary: NAS disk ada2 is at 70 C
              description: >-
                Above 65 C for 30 minutes. Check the case airflow and fans.
