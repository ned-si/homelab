# promtool unit tests for platform/kube-prometheus-stack/routes/paperless-alerts.yaml.
# Run: scripts/ci/promtool-check.sh (CI: render job).
rule_files:
  - paperless-alerts.yaml

evaluation_interval: 1m

tests:
  # The last success stays at t=0: firing once it is over 13 hours old.
  - interval: 10m
    input_series:
      - series: 'paperless_canary_last_success_timestamp_seconds{job="paperless-canary"}'
        values: '0x100'
    alert_rule_test:
      - eval_time: 12h
        alertname: PaperlessIngestFailing
        exp_alerts: []
      - eval_time: 14h
        alertname: PaperlessIngestFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              action: human
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/PaperlessIngestFailing.md
              summary: "Paperless ingest canary has not succeeded in 13 hours"
              description: >-
                No canary page uploaded to Paperless has been findable by a
                full-text search in 13 hours, or there is no success on record:
                uploads may not reach OCR and the index. The reason is in the
                last Job: kubectl -n paperless logs job/<job>.

  # Successes every 6 hours keep it quiet.
  - interval: 6h
    input_series:
      - series: 'paperless_canary_last_success_timestamp_seconds{job="paperless-canary"}'
        values: '0+21600x4'
    alert_rule_test:
      - eval_time: 1d
        alertname: PaperlessIngestFailing
        exp_alerts: []

  # No canary result at all.
  - interval: 10m
    input_series:
      - series: 'paperless_canary_duration_seconds{job="paperless-canary"}'
        values: '20x10'
    alert_rule_test:
      - eval_time: 30m
        alertname: PaperlessIngestFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              action: human
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/PaperlessIngestFailing.md
              summary: "Paperless ingest canary has not succeeded in 13 hours"
              description: >-
                No canary page uploaded to Paperless has been findable by a
                full-text search in 13 hours, or there is no success on record:
                uploads may not reach OCR and the index. The reason is in the
                last Job: kubectl -n paperless logs job/<job>.

  # Two slow runs in a row: 400 s from minute 0, still 400 s after the next run.
  - interval: 1m
    input_series:
      - series: 'paperless_canary_duration_seconds{job="paperless-canary"}'
        values: '400x420'
      - series: 'paperless_canary_success{job="paperless-canary"}'
        values: '1x420'
    alert_rule_test:
      - eval_time: 5h
        alertname: PaperlessIngestSlow
        exp_alerts: []
      - eval_time: 6h10m
        alertname: PaperlessIngestSlow
        exp_alerts:
          - exp_labels:
              severity: warning
              action: human
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/PaperlessIngestSlow.md
              summary: "Paperless uploads take over 5 minutes to be findable"
              description: >-
                Two canary runs in a row took over 5 minutes from upload to a
                full-text search hit (last 6m 40s).
                OCR or the task queue is slow.

  # Slow, then a fast run, then slow again: one slow run at a time stays quiet.
  - interval: 1m
    input_series:
      - series: 'paperless_canary_duration_seconds{job="paperless-canary"}'
        values: '400x355 60x5 400x360'
      - series: 'paperless_canary_success{job="paperless-canary"}'
        values: '1x720'
    alert_rule_test:
      - eval_time: 6h10m
        alertname: PaperlessIngestSlow
        exp_alerts: []

  # Two runs in a row that time out (not findable after 900 s): Failing's
  # case, not Slow's.
  - interval: 1m
    input_series:
      - series: 'paperless_canary_duration_seconds{job="paperless-canary"}'
        values: '900x420'
      - series: 'paperless_canary_success{job="paperless-canary"}'
        values: '0x420'
    alert_rule_test:
      - eval_time: 6h10m
        alertname: PaperlessIngestSlow
        exp_alerts: []
