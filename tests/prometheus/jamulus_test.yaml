# promtool unit tests for platform/kube-prometheus-stack/routes/jamulus-alerts.yaml.
# Run: scripts/ci/promtool-check.sh (CI: promtool job).
rule_files:
  - jamulus-alerts.yaml

evaluation_interval: 1m

tests:
  # No answer from t=0: pending at 14 min, firing at 15 min.
  - interval: 1m
    input_series:
      - series: 'jamulus_up{target="192.168.1.202:41124",job="jamulus-probe"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: JamulusDown
        exp_alerts: []
      - eval_time: 15m
        alertname: JamulusDown
        exp_alerts:
          - exp_labels:
              target: 192.168.1.202:41124
              job: jamulus-probe
              severity: warning
              action: review
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/JamulusDown.md
              summary: "Jamulus at 192.168.1.202:41124 has not answered a ping for 15 minutes"

  # No series for the target (the probe is gone): the absent() branch fires
  # with the same target label. Another target's series does not hide it.
  - interval: 1m
    input_series:
      - series: 'jamulus_up{target="192.168.1.99:41124",job="jamulus-probe"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: JamulusDown
        exp_alerts: []
      - eval_time: 15m
        alertname: JamulusDown
        exp_alerts:
          - exp_labels:
              target: 192.168.1.202:41124
              severity: warning
              action: review
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/JamulusDown.md
              summary: "Jamulus at 192.168.1.202:41124 has not answered a ping for 15 minutes"

  # The server answers every scrape: quiet.
  - interval: 1m
    input_series:
      - series: 'jamulus_up{target="192.168.1.202:41124",job="jamulus-probe"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: JamulusDown
        exp_alerts: []
      - eval_time: 60m
        alertname: JamulusDown
        exp_alerts: []
