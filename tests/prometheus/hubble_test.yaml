# promtool unit tests for platform/kube-prometheus-stack/routes/hubble-alerts.yaml.
# Run: scripts/ci/promtool-check.sh (CI: render job).
rule_files:
  - homelab-hubble.yaml

evaluation_interval: 1m

tests:
  # Four agents Ready; the relay loses one peer at minute 10.
  - interval: 1m
    input_series:
      - series: 'hubble_relay_pool_peer_connection_status{status="READY", pod="hubble-relay-0"}'
        values: '4x9 3x60'
      - series: 'kube_daemonset_status_number_ready{namespace="kube-system", daemonset="cilium"}'
        values: '4x70'
    alert_rule_test:
      - eval_time: 30m
        alertname: HubbleRelayPeersNotReady
        exp_alerts: []
      - eval_time: 45m
        alertname: HubbleRelayPeersNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              action: human
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/HubbleRelayPeersNotReady.md
              summary: Hubble relay reaches 3 agents, fewer than are Ready
              description: >-
                The relay cannot read the flows of every node: the Hubble UI and
                `hubble observe` miss them. `kubectl -n kube-system logs
                deploy/hubble-relay` names the cause; `certificate signed by
                unknown authority` or `expired` means the certificates: re-issue
                them with `kubectl -n kube-system create job
                --from=cronjob/hubble-generate-certs hubble-generate-certs-now`
                (docs/networking.md, "Hubble certificates").
      - eval_time: 45m
        alertname: HubbleRelayAbsent
        exp_alerts: []

  # No relay metrics at all.
  - interval: 1m
    input_series:
      - series: 'kube_daemonset_status_number_ready{namespace="kube-system", daemonset="cilium"}'
        values: '4x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: HubbleRelayAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
              action: human
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/HubbleRelayAbsent.md
              summary: Hubble relay is not being scraped
              description: >-
                HubbleRelayPeersNotReady is inert while this fires. Check
                `kubectl -n kube-system get deploy hubble-relay` and the PodMonitor
                `monitoring/hubble-relay`.
