# promtool unit tests for the inventory rules in
# platform/kube-prometheus-stack/routes/lan-alerts.yaml. 5-minute steps, the
# rules' own interval.
# Run: scripts/ci/promtool-check.sh (CI: render job).
rule_files:
  - homelab-lan.yaml

evaluation_interval: 5m
group_eval_order:
  - homelab.lan.inventory.recording
  - homelab.lan.inventory
  - homelab.lan

tests:
  # The scanner runs from t=0. The router answers throughout; a TV appears
  # at 2h (inside the first day: no alert). At 25h a new fixed-MAC device
  # appears, and a known phone (seen since 1h) rotates its private MAC on the
  # same IP: only the fixed MAC pages, the rotation is info.
  - interval: 5m
    input_series:
      - series: 'lan_inventory_devices'
        values: '2x400'
      - series: 'lan_inventory_scan_success'
        values: '1x400'
      - series: 'lan_device_present{mac="a8:00:00:00:00:01", ip="192.168.1.1", random_mac="false"}'
        values: '1x400'
      - series: 'lan_device_present{mac="a8:00:00:00:00:02", ip="192.168.1.60", random_mac="false"}'
        values: '_x23 1x376'
      - series: 'lan_device_present{mac="a8:00:00:00:00:04", ip="192.168.1.62", random_mac="false"}'
        values: '_x299 1x100'
      - series: 'lan_device_present{mac="da:00:00:00:00:03", ip="192.168.1.61", random_mac="true"}'
        values: '_x11 1x287'
      - series: 'lan_device_present{mac="de:00:00:00:00:05", ip="192.168.1.61", random_mac="true"}'
        values: '_x299 1x100'
    alert_rule_test:
      - eval_time: 2h
        alertname: LANNewDeviceSeen
        exp_alerts: []
      - eval_time: 24h50m
        alertname: LANNewDeviceSeen
        exp_alerts: []
      - eval_time: 25h10m
        alertname: LANNewDeviceSeen
        exp_alerts:
          - exp_labels:
              mac: a8:00:00:00:00:04
              ip: 192.168.1.62
              random_mac: "false"
              severity: warning
            exp_annotations:
              summary: "New device on the LAN: a8:00:00:00:00:04 at 192.168.1.62"
              description: >-
                a8:00:00:00:00:04 answered ARP at 192.168.1.62 and was not
                seen in the last 30 days. Its MAC is a fixed vendor address, so
                this is new hardware, not a phone rotating its private address.
                If it is not yours, find it in the router's DHCP list and block it.
      - eval_time: 25h10m
        alertname: LANNewRandomMACSeen
        exp_alerts:
          - exp_labels:
              mac: de:00:00:00:00:05
              ip: 192.168.1.61
              random_mac: "true"
              severity: info
            exp_annotations:
              summary: "New randomised MAC on the LAN: de:00:00:00:00:05 at 192.168.1.61"
      - eval_time: 26h10m
        alertname: LANNewDeviceSeen
        exp_alerts: []
      - eval_time: 26h10m
        alertname: LANNewRandomMACSeen
        exp_alerts: []
      - eval_time: 26h10m
        alertname: LANInventoryFailing
        exp_alerts: []
      - eval_time: 26h10m
        alertname: LANInventoryAbsent
        exp_alerts: []

  # The scanner stops completing scans.
  - interval: 5m
    input_series:
      - series: 'lan_inventory_devices'
        values: '2x30'
      - series: 'lan_inventory_scan_success'
        values: '1x5 0x25'
      - series: 'lan_inventory_scan_timestamp_seconds'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: LANInventoryFailing
        exp_alerts: []
      - eval_time: 65m
        alertname: LANInventoryFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: lan-inventory has not completed an ARP scan for 30 minutes
              description: >-
                LANNewDeviceSeen is inert while this fires. Read
                `kubectl -n monitoring logs deploy/lan-inventory`.
