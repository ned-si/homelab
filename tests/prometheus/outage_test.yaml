# promtool unit tests for platform/kube-prometheus-stack/routes/outage-alerts.yaml.
# Run: scripts/ci/promtool-check.sh (CI: render job).
rule_files:
  - homelab-outage.yaml

evaluation_interval: 1m

tests:
  # w-1 turns NotReady at minute 10; cp-3 stays Ready.
  - interval: 1m
    input_series:
      - series: 'kube_node_status_condition{node="homelab-w-1", condition="Ready", status="true"}'
        values: '1x9 0x10'
      - series: 'kube_node_status_condition{node="homelab-cp-3", condition="Ready", status="true"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: HomelabNodeNotReady
        exp_alerts: []
      - eval_time: 13m
        alertname: HomelabNodeNotReady
        exp_alerts:
          - exp_labels:
              node: homelab-w-1
              severity: critical
              action: auto
            exp_annotations:
              summary: Node homelab-w-1 is NotReady
              description: >-
                homelab-w-1 has not been Ready for 2 minutes; its pods
                and volumes are down. auto-rollback reverts nothing while this
                fires. Check `kubectl get nodes` and
                `talosctl -n <node IP> dmesg`.
      - eval_time: 13m
        alertname: HomelabNodeDown
        exp_alerts: []

  # A Talos upgrade reboot: cp-2 NotReady for 6 minutes, never
  # HomelabNodeDown. w-1 stays down: HomelabNodeDown after 15 minutes.
  - interval: 1m
    input_series:
      - series: 'kube_node_status_condition{node="homelab-cp-2", condition="Ready", status="true"}'
        values: '1x9 0x5 1x15'
      - series: 'kube_node_status_condition{node="homelab-w-1", condition="Ready", status="true"}'
        values: '1x9 0x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: HomelabNodeDown
        exp_alerts: []
      - eval_time: 24m
        alertname: HomelabNodeDown
        exp_alerts: []
      - eval_time: 26m
        alertname: HomelabNodeDown
        exp_alerts:
          - exp_labels:
              node: homelab-w-1
              severity: critical
              action: human
            exp_annotations:
              summary: Node homelab-w-1 has been NotReady for 15 minutes
              description: >-
                homelab-w-1 did not come back on its own. Check
                `talosctl -n <node IP> dmesg`, then power-cycle it from the
                BMC (docs/runbooks/node-power-cycle.md).

  # The iSCSI port drops at minute 5; another internal target is not the NAS.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-internal", instance="192.168.1.228:3260"}'
        values: '1x4 0x20'
      - series: 'probe_success{job="blackbox-internal", instance="192.168.1.228:2049"}'
        values: '1x25'
      - series: 'probe_success{job="blackbox-internal", instance="192.168.1.254:443"}'
        values: '0x25'
    alert_rule_test:
      - eval_time: 8m
        alertname: HomelabNASUnreachable
        exp_alerts:
          - exp_labels:
              instance: 192.168.1.228:3260
              severity: critical
              action: auto
            exp_annotations:
              summary: NAS port 192.168.1.228:3260 is unreachable
              description: >-
                The cluster cannot reach 192.168.1.228:3260 for 2 minutes
                (3260 iSCSI: every PVC; 2049 NFS: media and local backups).
                auto-rollback reverts nothing while this fires. Check the NAS
                and the basement switch.
      - eval_time: 14m
        alertname: HomelabNASDown
        exp_alerts: []
      - eval_time: 16m
        alertname: HomelabNASDown
        exp_alerts:
          - exp_labels:
              instance: 192.168.1.228:3260
              severity: critical
              action: human
            exp_annotations:
              summary: NAS port 192.168.1.228:3260 has been unreachable for 10 minutes
              description: >-
                The NAS does not power on by itself after a power loss: press
                its power button. Otherwise check the basement switch and the
                NAS network link.
