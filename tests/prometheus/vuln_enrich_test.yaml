# promtool unit tests for platform/vuln-enrich/rules.yaml.
# Run: scripts/ci/promtool-check.sh (CI: render job).
rule_files:
  - vuln-enrich.yaml

evaluation_interval: 1m

tests:
  # immich (exposed) has a KEV CVE with a low EPSS, a high-EPSS CVE and a
  # quiet one; democratic-csi (not exposed) has the KEV CVE too. Only the
  # exposed immich findings of the first two are "act now".
  - interval: 1m
    input_series:
      - series: 'trivy_vulnerability_id{namespace="immich", image_registry="ghcr.io", image_repository="immich-app/immich-server",
                image_tag="v2.7.5", resource="libssl3", installed_version="3.5.1", fixed_version="3.5.2", vuln_id="CVE-2026-0001",
                severity="Critical"}'
        values: '1x30'
      - series: 'trivy_vulnerability_id{namespace="immich", image_registry="ghcr.io", image_repository="immich-app/immich-server",
                image_tag="v2.7.5", resource="sharp", installed_version="0.33.0", fixed_version="0.33.5", vuln_id="CVE-2026-0002", severity="High"}'
        values: '1x30'
      - series: 'trivy_vulnerability_id{namespace="immich", image_registry="ghcr.io", image_repository="immich-app/immich-server",
                image_tag="v2.7.5", resource="zlib", installed_version="1.3", fixed_version="1.3.1", vuln_id="CVE-2026-0003", severity="Medium"}'
        values: '1x30'
      - series: 'trivy_vulnerability_id{namespace="democratic-csi", image_registry="index.docker.io",
                image_repository="democraticcsi/democratic-csi", image_tag="latest", resource="libssl3", installed_version="3.5.1",
                fixed_version="3.5.2", vuln_id="CVE-2026-0001", severity="Critical"}'
        values: '1x30'
      - series: 'vuln_kev{job="vuln-enrich", vuln_id="CVE-2026-0001"}'
        values: '1x30'
      - series: 'vuln_epss_score{job="vuln-enrich", vuln_id="CVE-2026-0001"}'
        values: '0.02x30'
      - series: 'vuln_epss_score{job="vuln-enrich", vuln_id="CVE-2026-0002"}'
        values: '0.4x30'
      - series: 'vuln_epss_score{job="vuln-enrich", vuln_id="CVE-2026-0003"}'
        values: '0.001x30'
      - series: 'vuln_namespace_exposed{job="vuln-enrich", namespace="immich"}'
        values: '1x30'
      - series: 'vuln_enrich_last_success_timestamp_seconds{job="vuln-enrich"}'
        values: '0x30'
    promql_expr_test:
      - expr: vuln:act_now_cve:epss
        eval_time: 10m
        exp_samples:
          - labels: 'vuln:act_now_cve:epss{vuln_id="CVE-2026-0001", kev="yes"}'
            value: 0.02
          - labels: 'vuln:act_now_cve:epss{vuln_id="CVE-2026-0002", kev="no"}'
            value: 0.4
      - expr: vuln:act_now:epss
        eval_time: 10m
        exp_samples:
          - labels: 'vuln:act_now:epss{namespace="immich", image_registry="ghcr.io", image_repository="immich-app/immich-server", image_tag="v2.7.5",
                    resource="libssl3", installed_version="3.5.1", fixed_version="3.5.2", vuln_id="CVE-2026-0001", severity="Critical", kev="yes"}'
            value: 0.02
          - labels: 'vuln:act_now:epss{namespace="immich", image_registry="ghcr.io", image_repository="immich-app/immich-server", image_tag="v2.7.5",
                    resource="sharp", installed_version="0.33.0", fixed_version="0.33.5", vuln_id="CVE-2026-0002", severity="High", kev="no"}'
            value: 0.4
    alert_rule_test:
      - eval_time: 30m
        alertname: VulnEnrichmentStale
        exp_alerts: []

  # A KEV CVE that FIRST has not scored yet still counts, with EPSS 0.
  - interval: 1m
    input_series:
      - series: 'vuln_kev{job="vuln-enrich", vuln_id="CVE-2026-0009"}'
        values: '1x10'
    promql_expr_test:
      - expr: vuln:act_now_cve:epss
        eval_time: 5m
        exp_samples:
          - labels: 'vuln:act_now_cve:epss{vuln_id="CVE-2026-0009", kev="yes"}'
            value: 0

  # The last push is 4 days old at minute 0 of the test, and never again.
  - interval: 1h
    input_series:
      - series: 'vuln_enrich_last_success_timestamp_seconds{job="vuln-enrich"}'
        values: '-345600x2'
    alert_rule_test:
      - eval_time: 3h
        alertname: VulnEnrichmentStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "No KEV/EPSS enrichment in 3 days"
              description: >-
                The vuln-enrich CronJob has not pushed for 3 days, so the
                Security dashboard's "Act now" list is out of date. Check
                kubectl -n monitoring get cronjob,jobs -l app.kubernetes.io/name=vuln-enrich
                and the last Job's log.
