# promtool unit tests for platform/kube-prometheus-stack/routes/kyverno-alerts.yaml.
# Run: scripts/ci/promtool-check.sh (CI: promtool job).
rule_files:
  - homelab-kyverno.yaml

evaluation_interval: 1m

tests:
  # Scans every hour, then they stop at 2h: fires 3h later plus 15m.
  - interval: 1m
    input_series:
      - series: 'kyverno_controller_reconcile_total{controller_name="background-scan-controller"}'
        values: '0+10x120 1200x300'
    alert_rule_test:
      - eval_time: 2h
        alertname: KyvernoReportsStale
        exp_alerts: []
      - eval_time: 5h30m
        alertname: KyvernoReportsStale
        exp_alerts:
          - exp_labels:
              severity: warning
              action: human
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/KyvernoReportsStale.md
              summary: Kyverno has not run a background scan for 3 hours
              description: >-
                The PolicyReports, the Security dashboard counts and the
                Deny-readiness they show are stale. Check the
                kyverno-reports-controller pod.
  # PSA: a controller retrying a rejected Pod every minute fires within
  # 10 minutes; one rejected dry run does not; no deny series, no alert.
  - interval: 1m
    input_series:
      - series: 'pod_security_evaluations_total{decision="deny",mode="enforce",resource="pod",policy_level="restricted"}'
        values: '0x60 1+1x30'
      - series: 'pod_security_evaluations_total{decision="allow",mode="enforce",resource="pod",policy_level="restricted"}'
        values: '0+10x90'
    alert_rule_test:
      - eval_time: 65m
        alertname: PodSecurityEnforceDenied
        exp_alerts: []
      - eval_time: 70m
        alertname: PodSecurityEnforceDenied
        exp_alerts:
          - exp_labels:
              severity: critical
              action: human
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/PodSecurityEnforceDenied.md
              summary: Pod Security admission rejected 10 Pods in 30 minutes
              description: >-
                A controller or an operator keeps creating Pods that a
                namespace's enforce level rejects. Find the namespace from the
                FailedCreate events, then run the Pod Security break-glass.
  - interval: 1m
    input_series:
      - series: 'pod_security_evaluations_total{decision="deny",mode="enforce",resource="pod",policy_level="restricted"}'
        values: '0x60 1x60'
      - series: 'pod_security_evaluations_total{decision="deny",mode="warn",resource="pod",policy_level="restricted"}'
        values: '0+5x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: PodSecurityEnforceDenied
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'pod_security_evaluations_total{decision="allow",mode="enforce",resource="pod",policy_level="baseline"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: PodSecurityEnforceDenied
        exp_alerts: []
  # Kyverno: a controller retrying a rejected Pod every minute fires
  # within 10 minutes, per policy; one rejected dry run does not.
  - interval: 1m
    input_series:
      - series: 'apiserver_admission_webhook_rejection_count{name="vpol.validate.kyverno.svc-ignore-finegrained-require-probes",error_type="no_error",operation="CREATE",rejection_code="400",type="validating"}'
        values: '0x60 1+1x30'
      - series: 'apiserver_admission_webhook_rejection_count{name="vpol.validate.kyverno.svc-ignore-finegrained-disallow-latest-tag",error_type="no_error",operation="CREATE",rejection_code="400",type="validating"}'
        values: '0x60 1x30'
    alert_rule_test:
      - eval_time: 65m
        alertname: KyvernoDenied
        exp_alerts: []
      - eval_time: 70m
        alertname: KyvernoDenied
        exp_alerts:
          - exp_labels:
              severity: critical
              action: human
              name: vpol.validate.kyverno.svc-ignore-finegrained-require-probes
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/KyvernoDenied.md
              summary: Kyverno policy vpol.validate.kyverno.svc-ignore-finegrained-require-probes rejected 10 requests in 30 minutes
              description: >-
                A controller or an operator keeps creating objects that a
                Kyverno policy in Deny rejects. Find the object from the
                FailedCreate events, then run the Kyverno break-glass.
  # Exactly 5 in 30 minutes: silent. Webhook errors (Kyverno down, fails
  # open) and another webhook's rejections: ignored.
  - interval: 1m
    input_series:
      - series: 'apiserver_admission_webhook_rejection_count{name="vpol.validate.kyverno.svc-ignore-finegrained-require-probes",error_type="no_error",operation="CREATE",rejection_code="400",type="validating"}'
        values: '0x60 1 2 3 4 5 5x55'
      - series: 'apiserver_admission_webhook_rejection_count{name="vpol.validate.kyverno.svc-ignore-finegrained-require-ro-rootfs",error_type="calling_webhook_error",operation="CREATE",rejection_code="0",type="validating"}'
        values: '0+5x120'
      - series: 'apiserver_admission_webhook_rejection_count{name="vkubernetesupgrade.kb.io",error_type="no_error",operation="CREATE",rejection_code="403",type="validating"}'
        values: '0+5x120'
    alert_rule_test:
      - eval_time: 70m
        alertname: KyvernoDenied
        exp_alerts: []
      - eval_time: 90m
        alertname: KyvernoDenied
        exp_alerts: []
  # Not scraped at all: absent() carries the selector's label.
  - interval: 1m
    input_series:
      - series: 'up{job="other"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: KyvernoReportsStale
        exp_alerts:
          - exp_labels:
              severity: warning
              action: human
              controller_name: background-scan-controller
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/KyvernoReportsStale.md
              summary: Kyverno has not run a background scan for 3 hours
              description: >-
                The PolicyReports, the Security dashboard counts and the
                Deny-readiness they show are stale. Check the
                kyverno-reports-controller pod.
