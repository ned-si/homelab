# promtool unit tests for platform/kube-prometheus-stack/routes/kyverno-alerts.yaml.
# Run: scripts/ci/promtool-check.sh (CI: render job).
rule_files:
  - homelab-kyverno.yaml

evaluation_interval: 1m

tests:
  # Scans every hour, then they stop at 2h: fires 3h later plus 15m.
  - interval: 1m
    input_series:
      - series: 'kyverno_controller_reconcile_total{controller_name="background-scan-controller"}'
        values: '0+10x120 1200x300'
    alert_rule_test:
      - eval_time: 2h
        alertname: KyvernoReportsStale
        exp_alerts: []
      - eval_time: 5h30m
        alertname: KyvernoReportsStale
        exp_alerts:
          - exp_labels:
              severity: warning
              action: human
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/KyvernoReportsStale.md
              summary: Kyverno has not run a background scan for 3 hours
              description: >-
                The PolicyReports, the Security dashboard counts and the
                Deny-readiness they show are stale. Check the
                kyverno-reports-controller pod.
  # PSA: a controller retrying a rejected Pod every minute fires within
  # 10 minutes; one rejected dry run does not; no deny series, no alert.
  - interval: 1m
    input_series:
      - series: 'pod_security_evaluations_total{decision="deny",mode="enforce",resource="pod",policy_level="restricted"}'
        values: '0x60 1+1x30'
      - series: 'pod_security_evaluations_total{decision="allow",mode="enforce",resource="pod",policy_level="restricted"}'
        values: '0+10x90'
    alert_rule_test:
      - eval_time: 65m
        alertname: PodSecurityEnforceDenied
        exp_alerts: []
      - eval_time: 70m
        alertname: PodSecurityEnforceDenied
        exp_alerts:
          - exp_labels:
              severity: critical
              action: human
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/PodSecurityEnforceDenied.md
              summary: Pod Security admission rejected 10 Pods in 30 minutes
              description: >-
                A controller or an operator keeps creating Pods that a
                namespace's enforce level rejects. Find the namespace from the
                FailedCreate events, then run the Pod Security break-glass.
  - interval: 1m
    input_series:
      - series: 'pod_security_evaluations_total{decision="deny",mode="enforce",resource="pod",policy_level="restricted"}'
        values: '0x60 1x60'
      - series: 'pod_security_evaluations_total{decision="deny",mode="warn",resource="pod",policy_level="restricted"}'
        values: '0+5x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: PodSecurityEnforceDenied
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'pod_security_evaluations_total{decision="allow",mode="enforce",resource="pod",policy_level="baseline"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: PodSecurityEnforceDenied
        exp_alerts: []
  # Not scraped at all: absent() carries the selector's label.
  - interval: 1m
    input_series:
      - series: 'up{job="other"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: KyvernoReportsStale
        exp_alerts:
          - exp_labels:
              severity: warning
              action: human
              controller_name: background-scan-controller
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/KyvernoReportsStale.md
              summary: Kyverno has not run a background scan for 3 hours
              description: >-
                The PolicyReports, the Security dashboard counts and the
                Deny-readiness they show are stale. Check the
                kyverno-reports-controller pod.
