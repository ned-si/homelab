# promtool unit tests for platform/kube-prometheus-stack/routes/slo.yaml.
# Run: scripts/ci/promtool-check.sh (CI: render job).
rule_files:
  - homelab-slo.yaml

evaluation_interval: 30s

tests:
  # media fails every probe from minute 60: the fast burn fires with media's
  # namespace, the slow burn stays quiet behind it, the healthy app (cook)
  # stays quiet.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-public", app="media"}'
        values: '1x59 0x40'
      - series: 'probe_success{job="blackbox-public", app="cook"}'
        values: '1x100'
      # argo is probed but has no SLO.
      - series: 'probe_success{job="blackbox-public", app="argo"}'
        values: '1x59 0x40'
    alert_rule_test:
      - eval_time: 80m
        alertname: SLOErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              app: media
              namespace: immich
              severity: critical
              action: auto
            exp_annotations:
              summary: media is burning its 30-day error budget fast
              description: >-
                At this rate the 99.5% availability budget of media is gone
                within days. Check https://media.lilalala.com, then the Homelab
                overview dashboard (probe status and duration).
      - eval_time: 90m
        alertname: SLOErrorBudgetBurnSlow
        exp_alerts: []
      - eval_time: 80m
        alertname: SLOProbesAbsent
        exp_alerts: []
      # Before the outage nothing fires.
      - eval_time: 55m
        alertname: SLOErrorBudgetBurnFast
        exp_alerts: []

  # A 30-minute outage that ended 40 minutes ago: the fast burn fired during
  # it and has resolved; the slow windows still hold the outage, but the
  # slow burn stays quiet because the fast burn already notified.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-public", app="archive"}'
        values: '1x1379 0x29 1x100'
    alert_rule_test:
      - eval_time: 1400m
        alertname: SLOErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              app: archive
              namespace: paperless
              severity: critical
              action: auto
            exp_annotations:
              summary: archive is burning its 30-day error budget fast
              description: >-
                At this rate the 99.5% availability budget of archive is gone
                within days. Check https://archive.lilalala.com, then the Homelab
                overview dashboard (probe status and duration).
      - eval_time: 1450m
        alertname: SLOErrorBudgetBurnFast
        exp_alerts: []
      - eval_time: 1450m
        alertname: SLOErrorBudgetBurnSlow
        exp_alerts: []

  # cook fails 2% of its probes all day: above the slow threshold (1.5%),
  # below the fast ones (3%, 7.2%). Only the slow burn fires.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-public", app="cook"}'
        values: '0.98x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: SLOErrorBudgetBurnFast
        exp_alerts: []
      - eval_time: 60m
        alertname: SLOErrorBudgetBurnSlow
        exp_alerts:
          - exp_labels:
              app: cook
              namespace: mealie
              severity: warning
              action: auto
            exp_annotations:
              summary: cook is slowly burning its 30-day error budget
              description: >-
                cook fails more probes than its 99.5% objective allows, over a
                day or more. Usually intermittent: look for restarts, slow
                responses (probe_duration_seconds) or a flapping node.

  # A full day without errors: the whole budget is left.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-public", app="auth"}'
        values: '1x1440'
    promql_expr_test:
      - expr: slo:error_budget_remaining:ratio_rate30d
        eval_time: 1440m
        exp_samples:
          - labels: 'slo:error_budget_remaining:ratio_rate30d{app="auth"}'
            value: 1
      - expr: slo:availability:ratio_rate30d
        eval_time: 1440m
        exp_samples:
          - labels: 'slo:availability:ratio_rate30d{app="auth"}'
            value: 1

  # One day of probes every 30s: 1/30 of the window has data. theater has two
  # targets and the same coverage.
  - interval: 30s
    input_series:
      - series: 'probe_success{job="blackbox-public", app="auth"}'
        values: '1x2879'
      - series: 'probe_success{job="blackbox-public", app="theater", instance="a"}'
        values: '1x2879'
      - series: 'probe_success{job="blackbox-public", app="theater", instance="b"}'
        values: '0x2879'
    promql_expr_test:
      - expr: slo:sli_coverage:ratio_rate30d
        eval_time: 1440m
        exp_samples:
          - labels: 'slo:sli_coverage:ratio_rate30d{app="auth"}'
            value: 0.03333333333333333
          - labels: 'slo:sli_coverage:ratio_rate30d{app="theater"}'
            value: 0.03333333333333333

  # Every SLO target but media reports: only media's absent() alert fires.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-public", app="auth"}'
        values: '1x30'
      - series: 'probe_success{job="blackbox-public", app="cinema"}'
        values: '1x30'
      - series: 'probe_success{job="blackbox-public", app="theater"}'
        values: '1x30'
      - series: 'probe_success{job="blackbox-public", app="archive"}'
        values: '1x30'
      - series: 'probe_success{job="blackbox-public", app="cook"}'
        values: '1x30'
      - series: 'probe_success{job="blackbox-public", app="syncthing"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: SLOTargetProbeAbsent
        exp_alerts:
          - exp_labels:
              job: blackbox-public
              app: media
              severity: warning
              action: human
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOTargetProbeAbsent.md
              summary: "No probe results for media: its SLO alerts are blind"
              description: >-
                The media target is missing from the Probes in
                platform/blackbox-exporter/probes, or its `app` relabeling no
                longer matches.
      - eval_time: 20m
        alertname: SLOProbesAbsent
        exp_alerts: []

  # No probe results at all: the SLO alerts would be blind, so this fires,
  # and the per-target alerts stay quiet.
  - interval: 1m
    input_series:
      - series: 'up{job="kubelet"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: SLOTargetProbeAbsent
        exp_alerts: []
      - eval_time: 20m
        alertname: SLOProbesAbsent
        exp_alerts:
          - exp_labels:
              job: blackbox-public
              severity: warning
              action: human
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOProbesAbsent.md
              summary: "No public blackbox probe results: the SLO alerts are blind"
              description: >-
                Check the blackbox-exporter Application and the Probes in
                platform/blackbox-exporter/probes.

  # The remediation window. media is down for 20 minutes from minute 60:
  # the fast burn fires and resolves, nothing pages. cook is down from minute
  # 60 and stays down: the page after about 30 minutes.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-public", app="media"}'
        values: '1x59 0x19 1x60'
      - series: 'probe_success{job="blackbox-public", app="cook"}'
        values: '1x59 0x80'
    alert_rule_test:
      - eval_time: 75m
        alertname: SLOErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              app: media
              namespace: immich
              severity: critical
              action: auto
            exp_annotations:
              summary: media is burning its 30-day error budget fast
              description: >-
                At this rate the 99.5% availability budget of media is gone
                within days. Check https://media.lilalala.com, then the Homelab
                overview dashboard (probe status and duration).
          - exp_labels:
              app: cook
              namespace: mealie
              severity: critical
              action: auto
            exp_annotations:
              summary: cook is burning its 30-day error budget fast
              description: >-
                At this rate the 99.5% availability budget of cook is gone
                within days. Check https://cook.lilalala.com, then the Homelab
                overview dashboard (probe status and duration).
      - eval_time: 90m
        alertname: SLOErrorBudgetBurnFastPersistent
        exp_alerts: []
      - eval_time: 100m
        alertname: SLOErrorBudgetBurnFastPersistent
        exp_alerts:
          - exp_labels:
              app: cook
              namespace: mealie
              severity: critical
              action: human
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOErrorBudgetBurnFastPersistent.md
              summary: cook has been failing for 30 minutes
              description: >-
                The public probes of cook have failed for half an hour and
                nothing automatic has fixed it. Check
                https://cook.lilalala.com, the Homelab overview dashboard, and
                the Homelab / Automation dashboard for a rollback that was
                refused or failed.
      - eval_time: 130m
        alertname: SLOErrorBudgetBurnFastPersistent
        exp_alerts:
          - exp_labels:
              app: cook
              namespace: mealie
              severity: critical
              action: human
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOErrorBudgetBurnFastPersistent.md
              summary: cook has been failing for 30 minutes
              description: >-
                The public probes of cook have failed for half an hour and
                nothing automatic has fixed it. Check
                https://cook.lilalala.com, the Homelab overview dashboard, and
                the Homelab / Automation dashboard for a rollback that was
                refused or failed.

  # archive fails 2% of its probes for 26 hours: the slow burn fires within
  # the hour and pages a day later.
  - interval: 5m
    input_series:
      - series: 'probe_success{job="blackbox-public", app="archive"}'
        values: '0.98x312'
    alert_rule_test:
      - eval_time: 1380m
        alertname: SLOErrorBudgetBurnSlowPersistent
        exp_alerts: []
      - eval_time: 1540m
        alertname: SLOErrorBudgetBurnSlowPersistent
        exp_alerts:
          - exp_labels:
              app: archive
              namespace: paperless
              severity: warning
              action: human
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/SLOErrorBudgetBurnSlowPersistent.md
              summary: archive has been burning its error budget for a day
              description: >-
                SLOErrorBudgetBurnSlow has fired for archive for 24 hours: an
                intermittent fault that does not go away on its own. Look for
                restarts, slow responses (probe_duration_seconds) or a flapping
                node.
