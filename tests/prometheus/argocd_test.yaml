# promtool unit tests for platform/kube-prometheus-stack/routes/argocd-alerts.yaml.
# Run: scripts/ci/promtool-check.sh (CI: render job).
rule_files:
  - homelab-argocd.yaml

evaluation_interval: 1m

tests:
  # immich turns Degraded at minute 10; mealie stays Healthy.
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{name="immich", dest_namespace="immich", health_status="Healthy", sync_status="Synced"}'
        values: '1x9 _x20'
      - series: 'argocd_app_info{name="immich", dest_namespace="immich", health_status="Degraded", sync_status="Synced"}'
        values: '_x9 1x20'
      - series: 'argocd_app_info{name="mealie", dest_namespace="mealie", health_status="Healthy", sync_status="Synced"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: ArgoCDAppDegraded
        exp_alerts: []
      - eval_time: 16m
        alertname: ArgoCDAppDegraded
        exp_alerts:
          - exp_labels:
              name: immich
              namespace: immich
              severity: critical
              action: auto
            exp_annotations:
              summary: immich is Degraded
              description: >-
                Argo CD reports the Application immich as Degraded
                for 5 minutes. If the newest merge deployed it, auto-rollback
                opens a revert pull request. Check
                https://argo.lilalala.com/applications/argo/immich.
      - eval_time: 16m
        alertname: ArgoCDMetricsAbsent
        exp_alerts: []

  # seafile: OutOfSync from minute 5, alert after 30 minutes.
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{name="seafile", dest_namespace="seafile", health_status="Healthy", sync_status="OutOfSync"}'
        values: '_x4 1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ArgoCDAppOutOfSync
        exp_alerts: []
      - eval_time: 36m
        alertname: ArgoCDAppOutOfSync
        exp_alerts:
          - exp_labels:
              name: seafile
              namespace: seafile
              severity: warning
              action: auto
            exp_annotations:
              summary: seafile is OutOfSync for 30 minutes
              description: >-
                The live state of seafile differs from git and
                self-heal has not closed the gap in 30 minutes: a stuck sync, a
                field another controller rewrites, or a resource Argo CD cannot
                apply. Check the diff in
                https://argo.lilalala.com/applications/argo/seafile.

  # theater: an existing failure counter goes 2 -> 3 at minute 20.
  # mealie: its first failure ever creates the series at minute 20.
  # Both fire and resolve 10 minutes later.
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{name="theater", dest_namespace="theater", health_status="Healthy", sync_status="Synced"}'
        values: '1x40'
      - series: 'argocd_app_info{name="mealie", dest_namespace="mealie", health_status="Healthy", sync_status="Synced"}'
        values: '1x40'
      - series: 'argocd_app_sync_total{name="theater", phase="Failed"}'
        values: '2x19 3x20'
      - series: 'argocd_app_sync_total{name="theater", phase="Succeeded"}'
        values: '5x40'
      - series: 'argocd_app_sync_total{name="mealie", phase="Error"}'
        values: '_x19 1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ArgoCDSyncFailed
        exp_alerts: []
      - eval_time: 22m
        alertname: ArgoCDSyncFailed
        exp_alerts:
          - exp_labels:
              name: mealie
              namespace: mealie
              severity: warning
              action: auto
            exp_annotations:
              summary: "mealie: sync failed"
              description: >-
                A sync of mealie ended Failed or Error in the last 10
                minutes. Check
                https://argo.lilalala.com/applications/argo/mealie.
          - exp_labels:
              name: theater
              namespace: theater
              severity: warning
              action: auto
            exp_annotations:
              summary: "theater: sync failed"
              description: >-
                A sync of theater ended Failed or Error in the last 10
                minutes. Check
                https://argo.lilalala.com/applications/argo/theater.
      - eval_time: 35m
        alertname: ArgoCDSyncFailed
        exp_alerts: []

  # Scraping starts at minute 5 with old failure counters: nothing fires.
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{name="seafile", dest_namespace="seafile", health_status="Healthy", sync_status="Synced"}'
        values: '_x5 1x30'
      - series: 'argocd_app_sync_total{name="seafile", phase="Failed"}'
        values: '_x5 4x30'
    alert_rule_test:
      - eval_time: 7m
        alertname: ArgoCDSyncFailed
        exp_alerts: []
      - eval_time: 14m
        alertname: ArgoCDSyncFailed
        exp_alerts: []
      - eval_time: 20m
        alertname: ArgoCDSyncFailed
        exp_alerts: []

  # keycloak is Degraded from minute 10 to 25 and auto-rollback fixes it:
  # no page. home is Degraded from minute 10 and stays so: the page at 40.
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{name="keycloak", dest_namespace="keycloak", health_status="Degraded", sync_status="Synced"}'
        values: '_x9 1x15 _x40'
      - series: 'argocd_app_info{name="keycloak", dest_namespace="keycloak", health_status="Healthy", sync_status="Synced"}'
        values: '1x9 _x15 1x40'
      - series: 'argocd_app_info{name="home", dest_namespace="home", health_status="Degraded", sync_status="Synced"}'
        values: '_x9 1x55'
    alert_rule_test:
      - eval_time: 20m
        alertname: ArgoCDAppDegraded
        exp_alerts:
          - exp_labels:
              name: home
              namespace: home
              severity: critical
              action: auto
            exp_annotations:
              summary: home is Degraded
              description: >-
                Argo CD reports the Application home as Degraded
                for 5 minutes. If the newest merge deployed it, auto-rollback
                opens a revert pull request. Check
                https://argo.lilalala.com/applications/argo/home.
          - exp_labels:
              name: keycloak
              namespace: keycloak
              severity: critical
              action: auto
            exp_annotations:
              summary: keycloak is Degraded
              description: >-
                Argo CD reports the Application keycloak as Degraded
                for 5 minutes. If the newest merge deployed it, auto-rollback
                opens a revert pull request. Check
                https://argo.lilalala.com/applications/argo/keycloak.
      - eval_time: 38m
        alertname: ArgoCDAppStillDegraded
        exp_alerts: []
      - eval_time: 42m
        alertname: ArgoCDAppStillDegraded
        exp_alerts:
          - exp_labels:
              name: home
              namespace: home
              severity: critical
              action: human
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/ArgoCDAppStillDegraded.md
              summary: home has been Degraded for 30 minutes
              description: >-
                Nothing automatic has fixed home: check the
                auto-rollback run on the Homelab / Automation dashboard, then
                https://argo.lilalala.com/applications/argo/home.

  # books: its first sync failure at minute 20 leaves it OutOfSync: the page
  # at 50. mealie: a failure at minute 20, reverted and Synced at 30: no page.
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{name="books", dest_namespace="books", health_status="Healthy", sync_status="Synced"}'
        values: '1x19 _x60'
      - series: 'argocd_app_info{name="books", dest_namespace="books", health_status="Healthy", sync_status="OutOfSync"}'
        values: '_x19 1x60'
      - series: 'argocd_app_sync_total{name="books", phase="Error"}'
        values: '_x19 1x60'
      - series: 'argocd_app_info{name="mealie", dest_namespace="mealie", health_status="Healthy", sync_status="Synced"}'
        values: '1x19 _x10 1x50'
      - series: 'argocd_app_info{name="mealie", dest_namespace="mealie", health_status="Healthy", sync_status="OutOfSync"}'
        values: '_x19 1x10 _x50'
      - series: 'argocd_app_sync_total{name="mealie", phase="Failed"}'
        values: '1x19 2x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: ArgoCDSyncStuck
        exp_alerts: []
      - eval_time: 55m
        alertname: ArgoCDSyncStuck
        exp_alerts:
          - exp_labels:
              name: books
              namespace: books
              severity: warning
              action: human
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/ArgoCDSyncStuck.md
              summary: "books: sync failed and still OutOfSync after 30 minutes"
              description: >-
                A sync of books failed and nothing automatic has
                replaced it: the cluster still runs the previous revision.
                Check the auto-rollback run on the Homelab / Automation
                dashboard, then
                https://argo.lilalala.com/applications/argo/books.

  # No Argo CD metrics at all.
  - interval: 1m
    input_series:
      - series: 'up{job="apiserver"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ArgoCDMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
              action: human
            exp_annotations:
              runbook_url: https://github.com/ned-si/homelab/blob/main/docs/runbooks/alerts/ArgoCDMetricsAbsent.md
              summary: Argo CD application metrics are missing
              description: >-
                Prometheus has no argocd_app_info for 15 minutes, so no Argo CD
                alert can fire. Check the ServiceMonitor
                argo/argocd-application-controller (label release) and the
                application controller pod.
