# promtool unit tests for platform/kube-prometheus-stack/routes/argocd-alerts.yaml.
# Run: scripts/ci/promtool-check.sh (CI: render job).
rule_files:
  - homelab-argocd.yaml

evaluation_interval: 1m

tests:
  # immich turns Degraded at minute 10; mealie stays Healthy.
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{name="immich", health_status="Healthy", sync_status="Synced"}'
        values: '1x9 _x20'
      - series: 'argocd_app_info{name="immich", health_status="Degraded", sync_status="Synced"}'
        values: '_x9 1x20'
      - series: 'argocd_app_info{name="mealie", health_status="Healthy", sync_status="Synced"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: ArgoCDAppDegraded
        exp_alerts: []
      - eval_time: 16m
        alertname: ArgoCDAppDegraded
        exp_alerts:
          - exp_labels:
              name: immich
              severity: critical
            exp_annotations:
              summary: immich is Degraded
              description: >-
                Argo CD reports the Application immich as Degraded
                for 5 minutes. If the newest merge deployed it, auto-rollback
                opens a revert pull request. Check
                https://argo.lilalala.com/applications/argo/immich.
      - eval_time: 16m
        alertname: ArgoCDMetricsAbsent
        exp_alerts: []

  # seafile: OutOfSync from minute 5, alert after 30 minutes.
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{name="seafile", health_status="Healthy", sync_status="OutOfSync"}'
        values: '_x4 1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ArgoCDAppOutOfSync
        exp_alerts: []
      - eval_time: 36m
        alertname: ArgoCDAppOutOfSync
        exp_alerts:
          - exp_labels:
              name: seafile
              severity: warning
            exp_annotations:
              summary: seafile is OutOfSync for 30 minutes
              description: >-
                The live state of seafile differs from git and
                self-heal has not closed the gap in 30 minutes: a stuck sync, a
                field another controller rewrites, or a resource Argo CD cannot
                apply. Check the diff in
                https://argo.lilalala.com/applications/argo/seafile.

  # theater: an existing failure counter goes 2 -> 3 at minute 20.
  # mealie: its first failure ever creates the series at minute 20.
  # Both fire and resolve 10 minutes later.
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{name="theater", health_status="Healthy", sync_status="Synced"}'
        values: '1x40'
      - series: 'argocd_app_info{name="mealie", health_status="Healthy", sync_status="Synced"}'
        values: '1x40'
      - series: 'argocd_app_sync_total{name="theater", phase="Failed"}'
        values: '2x19 3x20'
      - series: 'argocd_app_sync_total{name="theater", phase="Succeeded"}'
        values: '5x40'
      - series: 'argocd_app_sync_total{name="mealie", phase="Error"}'
        values: '_x19 1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ArgoCDSyncFailed
        exp_alerts: []
      - eval_time: 22m
        alertname: ArgoCDSyncFailed
        exp_alerts:
          - exp_labels:
              name: mealie
              severity: warning
            exp_annotations:
              summary: "mealie: sync failed"
              description: >-
                A sync of mealie ended Failed or Error in the last 10
                minutes. Check
                https://argo.lilalala.com/applications/argo/mealie.
          - exp_labels:
              name: theater
              severity: warning
            exp_annotations:
              summary: "theater: sync failed"
              description: >-
                A sync of theater ended Failed or Error in the last 10
                minutes. Check
                https://argo.lilalala.com/applications/argo/theater.
      - eval_time: 35m
        alertname: ArgoCDSyncFailed
        exp_alerts: []

  # Scraping starts at minute 5 with old failure counters: nothing fires.
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{name="seafile", health_status="Healthy", sync_status="Synced"}'
        values: '_x5 1x30'
      - series: 'argocd_app_sync_total{name="seafile", phase="Failed"}'
        values: '_x5 4x30'
    alert_rule_test:
      - eval_time: 7m
        alertname: ArgoCDSyncFailed
        exp_alerts: []
      - eval_time: 14m
        alertname: ArgoCDSyncFailed
        exp_alerts: []
      - eval_time: 20m
        alertname: ArgoCDSyncFailed
        exp_alerts: []

  # No Argo CD metrics at all.
  - interval: 1m
    input_series:
      - series: 'up{job="apiserver"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ArgoCDMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Argo CD application metrics are missing
              description: >-
                Prometheus has no argocd_app_info for 15 minutes, so no Argo CD
                alert can fire. Check the ServiceMonitor
                argo/argocd-application-controller (label release) and the
                application controller pod.
