  # immich-db and keycloak-db pass at minute 5. immich-db's result is served
  # to the end (Pushgateway alive); keycloak-db's series stops at minute 5
  # (Pushgateway replaced). At minute 11526 immich-db's pass is 8 days and
  # 1 minute old and keycloak-db's series stopped 8 days and 1 minute ago:
  # both overdue, neither passed nor failed, their rows and time left out.
  # home-assistant-postgresql has never been tested (overdue throughout).
  # Scraped every 5 minutes, 4 databases: promtool's engine loads at most
  # 10,000 samples per query and the 8-day subquery holds 2,304 per database.
