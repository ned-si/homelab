# promtool unit tests for platform/kube-prometheus-stack/routes/databases.yaml
# (PrometheusRule homelab-databases), the cases of acceptance criterion 31 of
# .kiro/specs/homelab-dashboard/requirements.md. Each case asserts the
# label-free aggregates the public dashboard reads.
# Run: scripts/ci/promtool-check.sh (CI: promtool job).
rule_files:
  - homelab-databases.yaml

evaluation_interval: 1m

tests:

  # Every database healthy: 8 of 8 everywhere, postgres and template1 left
  # out of the data, and every aggregate without a label (the name only).
  - interval: 1m
    input_series:
      - series: 'cnpg_collector_up{namespace="immich", cluster="immich-db", pod="immich-db-1", instance="a"}'
        values: '1x30'
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="immich", pod="immich-db-1", instance="a"}'
        values: '0+60x30'
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="immich", pod="immich-db-1", instance="a"}'
        values: '0x30'
      - series: 'cnpg_pg_stat_archiver_archived_count{namespace="immich", pod="immich-db-1", instance="a"}'
        values: '0+1x30'
      - series: 'cnpg_collector_pg_wal_archive_status{namespace="immich", pod="immich-db-1", instance="a", value="ready"}'
        values: '0x30'
      - series: 'cnpg_pg_database_size_bytes{namespace="immich", pod="immich-db-1", instance="a", datname="app"}'
        values: '1000x30'
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="immich", pod="immich-db-1", instance="a"}'
        values: '600x30'
      - series: 'barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="immich", pod="immich-db-1", instance="a"}'
        values: '0x30'
      - series: 'barman_cloud_cloudnative_pg_io_first_recoverability_point{namespace="immich", pod="immich-db-1", instance="a"}'
        values: '300x30'
      - series: 'backup_verify_last_run_timestamp_seconds{pod="pushgateway-a", check="postgres", target="immich-db"}'
        values: '120x30'
      - series: 'backup_verify_last_success_timestamp_seconds{pod="pushgateway-a", check="postgres", target="immich-db"}'
        values: '120x30'
      - series: 'backup_verify_rows{pod="pushgateway-a", check="postgres", target="immich-db"}'
        values: '1000x30'
      - series: 'backup_verify_restore_seconds{pod="pushgateway-a", check="postgres", target="immich-db"}'
