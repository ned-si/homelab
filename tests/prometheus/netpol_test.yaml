      - expr: netpol:ready_to_enforce
        eval_time: 8d
        exp_samples:
          - labels: 'netpol:ready_to_enforce{namespace="home", direction="egress"}'
            value: 0
          - labels: 'netpol:ready_to_enforce{namespace="home", direction="ingress"}'
            value: 0

  # backup-verify: a new allow-list, counted like the others. Ingress covered
