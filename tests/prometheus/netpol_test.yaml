  - interval: 1m
    input_series:
      - series: >-
          hubble_policy_verdicts_total{direction="ingress", match="l3-l4", action="forwarded",
          source="prometheus", source_namespace="monitoring", destination="pushgateway", destination_namespace="backup-verify", pod="cilium-a"}
        values: '_x10080 0+4x1520'
      - series: >-
          hubble_policy_verdicts_total{direction="egress", match="all", action="forwarded",
          source="backup-verify-files", source_namespace="backup-verify", destination="world", destination_namespace="", pod="cilium-a"}
        values: '_x10080 0+1x1520'
    promql_expr_test:
      - expr: round(netpol:verdicts:rate5m * 60, 0.01)
        eval_time: 8d
        exp_samples:
