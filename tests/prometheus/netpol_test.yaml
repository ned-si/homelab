          source="home-assistant", source_namespace="home", destination="world", destination_namespace="", pod="cilium-a"}
        values: '_x10080 0+1x1520'
    promql_expr_test:
      - expr: round(netpol:verdicts:rate5m * 60, 0.01)
        eval_time: 8d
        exp_samples:
          - labels: '{namespace="home", direction="ingress"}'
            value: 4
          - labels: '{namespace="home", direction="egress"}'
            value: 1
      - expr: round(netpol:would_drop:rate5m * 60, 0.01)
        eval_time: 8d
        exp_samples:
