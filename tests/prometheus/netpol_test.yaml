        values: '_x10080 0+4x1520'
      - series: >-
          hubble_policy_verdicts_total{direction="egress", match="all", action="forwarded",
          source="audiobookshelf", source_namespace="books", destination="world", destination_namespace="", pod="cilium-a"}
        values: '_x10080 0+1x1520'
    promql_expr_test:
      - expr: round(netpol:verdicts:rate5m * 60, 0.01)
        eval_time: 8d
        exp_samples:
          - labels: '{namespace="books", direction="ingress"}'
            value: 4
          - labels: '{namespace="books", direction="egress"}'
            value: 1
      - expr: round(netpol:would_drop:rate5m * 60, 0.01)
        eval_time: 8d
        exp_samples:
          - labels: '{namespace="books", direction="egress"}'
            value: 1
      - expr: netpol:ready_to_enforce
        eval_time: 8d
        exp_samples:
          - labels: 'netpol:ready_to_enforce{namespace="books", direction="egress"}'
            value: 0
          - labels: 'netpol:ready_to_enforce{namespace="books", direction="ingress"}'
            value: 0

