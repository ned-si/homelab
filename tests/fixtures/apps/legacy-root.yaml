# Passes the `legacy-root` profile: the live all-apps object at the 1877d3f pin.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: all-apps
  namespace: argo
spec:
  project: default
  source:
    repoURL: https://github.com/ned-si/homelab.git
    targetRevision: 1877d3fe42ff5f22b032603aa35464a3d9202d23
    path: kubernetes/applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - kind: Service
      jsonPointers:
        - /status/loadBalancer/ingress/0/ipMode
